  function drawLandscape(ctx, Z, P, G, tw) {
    const W = [WIN.x0, WIN.y0, WIN.x1, WIN.y1];
    if (!shows(Z, W, 20)) return;
    ctx.save();
    ctx.beginPath();
    ctx.rect(WIN.x0, WIN.y0, WIN.x1 - WIN.x0, WIN.y1 - WIN.y0);
    ctx.clip();
    const close = (pts) => pts.concat([[WIN.x1 + 400, WIN.y1 + 400], [WIN.x0 - 400, WIN.y1 + 400]]);
    // morning sun with short rays
    const sun = [-3700, -10900];
    const rays = new Path2D();
    for (let i = 0; i < 16; i++) {
      const a = (i / 16) * TAU + tw * 0.15;
      rays.moveTo(sun[0] + Math.cos(a) * 820, sun[1] + Math.sin(a) * 820);
      rays.lineTo(sun[0] + Math.cos(a) * (i % 2 ? 1040 : 1200), sun[1] + Math.sin(a) * (i % 2 ? 1040 : 1200));
    }
    strokeZ(ctx, Z, rays, P.ochre, 2, 0.9);
    inkS(ctx, Z, ell(sun[0], sun[1], 650, 650, 48), { closed: true, width: 2.5, fill: P.sun, seed: sd('sun') });
    for (let i = 0; i < G.clouds.length; i++) {
      const [cx, cy, s] = G.clouds[i];
      const pts = [];
      for (let k = 0; k < 28; k++) {
        const a = (k / 28) * TAU;
        const bump = 1 + 0.18 * Math.abs(Math.sin(a * 3 + i));
        pts.push([cx + Math.cos(a) * s * 1.6 * bump, cy + Math.min(0.2, Math.sin(a)) * s * 0.55 * bump]);
      }
      inkS(ctx, Z, pts, { closed: true, width: 2, fill: P.white, seed: sd('cloud', i), wobble: 1 });
    }
    // far ridge, pale
    const far = close(G.far);
    fillPoly(ctx, far, LIB.mix(P.sage, P.stripeSky, 0.55));
    inkS(ctx, Z, G.far, { width: 2, seed: sd('farI'), taper: [0, 0] });
    hatchZ(ctx, Z, far, { angle: -0.3, spacing: 10, width: 1.1, color: P.tealDeep, alpha: 0.35, seed: sd('farH'), density: 0.5 });
    // mid mountain with terraces of coffee
    const mid = close(G.mid);
    fillPoly(ctx, mid, P.sage);
    inkS(ctx, Z, G.mid, { width: 2.5, seed: sd('midI'), taper: [0, 0] });
    hatchZ(ctx, Z, mid, { spacing: 9, width: 1.2, color: P.leafDeep, alpha: 0.45, seed: sd('midH'), density: (x, y) => sstep(-1500, 4500, x) * 0.8 });
    const terr = (list, bushCol, w) => {
      const rows = new Path2D(), bush = new Path2D(), hi = new Path2D();
      for (const t of list) {
        LIB.tracePath(rows, t.row, false);
        for (const [x, y, rr] of t.bushes) {
          if (x + rr < Z.v[0] || x - rr > Z.v[2] || y + rr < Z.v[1] || y - rr > Z.v[3]) continue;
          bush.moveTo(x + rr, y);
          bush.arc(x, y, rr, 0, TAU);
          bush.moveTo(x - rr * 0.45 + rr * 0.7, y + rr * 0.2);
          bush.arc(x - rr * 0.45, y + rr * 0.2, rr * 0.7, 0, TAU);
          bush.moveTo(x + rr * 0.5 + rr * 0.65, y + rr * 0.25);
          bush.arc(x + rr * 0.5, y + rr * 0.25, rr * 0.65, 0, TAU);
          hi.moveTo(x - rr * 0.35 + rr * 0.3, y - rr * 0.3);
          hi.arc(x - rr * 0.35, y - rr * 0.3, rr * 0.3, 0, TAU);
        }
      }
      strokeZ(ctx, Z, rows, P.inkSoft, w * 0.7, 0.7);
      // outline of the lobed union: a wide ink stroke under the fill
      strokeZ(ctx, Z, bush, P.ink, w * 1.3, 0.9);
      ctx.save();
      ctx.fillStyle = bushCol;
      ctx.fill(bush);
      ctx.restore();
      ctx.save();
      ctx.fillStyle = P.leafLight;
      ctx.globalAlpha = 0.7;
      ctx.fill(hi);
      ctx.restore();
    };
    terr(G.midTerr, P.leafCoffee, 1.6);
    // near slope, bigger terraces, shade tree
    const near = close(G.near);
    fillPoly(ctx, near, LIB.mix(P.leafLight, P.sage, 0.4));
    inkS(ctx, Z, G.near, { width: 3, seed: sd('nearI'), taper: [0, 0] });
    hatchZ(ctx, Z, near, { spacing: 8, width: 1.3, color: P.leafDeep, alpha: 0.5, seed: sd('nearH'), density: (x, y) => 0.25 + 0.6 * sstep(-2600, -1300, y) });
    terr(G.nearTerr, LIB.mix(P.leafCoffee, P.leafDeep, 0.2), 2);
    inkS(ctx, Z, G.tree.trunk, { closed: true, width: 2.5, fill: P.bark, seed: sd('treeT') });
    for (let i = 0; i < G.tree.canopy.length; i++) {
      const [cx, cy, rr] = G.tree.canopy[i];
      inkS(ctx, Z, ell(cx, cy, rr, rr * 0.7, 28), { closed: true, width: 2.5, fill: LIB.mix(P.leafCoffee, P.sage, 0.3), seed: sd('canopy', i), wobble: 3 });
    }
    const canopyAll = ell(3400, -3800, 1350, 700, 40);
    hatchZ(ctx, Z, canopyAll, { spacing: 7, width: 1.3, color: P.leafDeep, alpha: 0.7, seed: sd('canH'), density: (x, y) => sstep(-200, 700, (x - 3400) * 0.5 + (y + 3800) * 0.9) });
    // window glare on the glass
    const glare = new Path2D();
    for (const [x, y, l] of [[-5000, -3000, 2600], [-4400, -2600, 1300], [1800, -9800, 2800], [2500, -9300, 1400]]) {
      glare.moveTo(x, y);
      glare.lineTo(x + l * 0.7, y - l * 0.7);
    }
    strokeZ(ctx, Z, glare, P.white, 3, 0.55);
    ctx.restore();
  }

  function drawRoom(ctx, Z, P, G, tw) {
    // floor tiles in perspective toward a vanishing point above the window
    if (Z.v[3] > G.wallBase) {
      const fl = clipPolyRect(G.floor, Z.v[0] - 400 / Z.k, Z.v[1], Z.v[2] + 400 / Z.k, Z.v[3] + 400 / Z.k);
      if (fl.length > 2) {
        fillPoly(ctx, fl, LIB.mix(P.tan, P.paper, 0.35));
        const vp = [540, -14000];
        const lines = new Path2D();
        for (const y of G.tiles) {
          lines.moveTo(Z.v[0] - 100 / Z.k, y);
          lines.lineTo(Z.v[2] + 100 / Z.k, y);
        }
        const yB = Z.v[3] + 200 / Z.k;
        for (const xk of G.tileRays) {
          const x0 = vp[0] + (xk - vp[0]) * ((G.wallBase - vp[1]) / (60000 - vp[1]));
          const x1 = vp[0] + (xk - vp[0]) * ((yB - vp[1]) / (60000 - vp[1]));
          lines.moveTo(x0, G.wallBase);
          lines.lineTo(x1, yB);
        }
        strokeZ(ctx, Z, lines, P.inkSoft, 1.6, 0.8);
        hatchZ(ctx, Z, fl, { angle: 0.02, spacing: 9, width: 1.2, color: P.inkSoft, alpha: 0.45, seed: sd('floorH'), density: (x, y) => 1 - sstep(G.wallBase, G.wallBase + 5000, y), angleJitter: 0.02 });
      }
    }
    // wainscot
    if (shows(Z, [-60000, 1500, 60000, 3000])) {
      const ws = clipPolyRect(G.wainscot, Z.v[0] - 400 / Z.k, Z.v[1], Z.v[2] + 400 / Z.k, Z.v[3]);
      if (ws.length > 2) {
        fillPoly(ctx, ws, LIB.mix(P.wood, P.paper, 0.2));
        hatchZ(ctx, Z, ws, { angle: Math.PI / 2, spacing: 10, width: 1.2, color: P.barkDeep, alpha: 0.5, seed: sd('wainH'), length: [40, 120] });
        const pan = new Path2D();
        const s = 1500;
        for (let x = Math.floor(Z.v[0] / s) * s; x <= Z.v[2]; x += s) {
          pan.moveTo(x, 1700);
          pan.lineTo(x, 2850);
        }
        strokeZ(ctx, Z, pan, P.barkDeep, 2, 0.8);
        inkS(ctx, Z, [[Z.v[0] - 200 / Z.k, 1500], [Z.v[2] + 200 / Z.k, 1500]], { width: 3, taper: [0, 0], seed: sd('rail') });
        inkS(ctx, Z, [[Z.v[0] - 200 / Z.k, G.wallBase], [Z.v[2] + 200 / Z.k, G.wallBase]], { width: 3.5, taper: [0, 0], seed: sd('base') });
      }
    }
    // picture on the wall: a little cherry study
    if (shows(Z, bbox(G.picture), 8)) {
      inkS(ctx, Z, G.picture, { closed: true, width: 3, fill: P.wood, seed: sd('pic'), smooth: false });
      inkS(ctx, Z, G.pictureIn, { closed: true, width: 2, fill: P.paper, seed: sd('picIn'), smooth: false });
      inkS(ctx, Z, [[-9300, -6900], [-8500, -7050], [-7700, -6800]], { width: 2.5, color: P.barkDeep, seed: sd('picB') });
      for (const [x, y, k] of [[-8900, -6500, 'cherryRed'], [-8400, -6450, 'cherryYellow'], [-8150, -6550, 'cherryRed'], [-8650, -6200, 'cherryGreen']]) {
        inkS(ctx, Z, ell(x, y, 190, 210, 20), { closed: true, width: 2, fill: P[k], seed: sd('picC', x) });
      }
      inkS(ctx, Z, ell(-8400, -7500, 420, 170, 20, 0, TAU), { closed: true, width: 2, fill: P.leafCoffee, seed: sd('picL') });
    }
    // shelf with jars over the counter
    if (shows(Z, bbox(G.shelf), 8)) {
      for (let i = 0; i < G.jars.length; i++) {
        const [x, y, w, h, k] = G.jars[i];
        const jar = LIB.rrectPts(x - w / 2, y - h, w, h, w * 0.25, 60);
        inkS(ctx, Z, jar, { closed: true, width: 2.2, fill: [P.ceramic, P.jute, P.beanMedium][k], seed: sd('jar', i) });
        hatchZ(ctx, Z, jar, { spacing: 6, width: 1.1, color: P.ink, alpha: 0.5, seed: sd('jarH', i), density: (px) => sstep(x - w * 0.1, x + w * 0.5, px) });
      }
      inkS(ctx, Z, G.shelf, { closed: true, width: 2.5, fill: P.wood, seed: sd('shelf'), smooth: false });
    }
    // window frame and sill
    const fo = G.frameO;
    if (shows(Z, bbox(fo), 8)) {
      const k = 1 / Z.k;
      const t = 380;
      const bars = [
        rect(WIN.x0 - t, WIN.y0 - t, WIN.x1 + t, WIN.y0),
        rect(WIN.x0 - t, WIN.y0, WIN.x0, WIN.y1),
        rect(WIN.x1, WIN.y0, WIN.x1 + t, WIN.y1),
        rect(WIN_C[0] - 110, WIN.y0, WIN_C[0] + 110, WIN.y1),

      void k;
      inkS(ctx, Z, G.sill, { closed: true, width: 3, fill: P.white, seed: sd('sill'), smooth: false });
      hatchZ(ctx, Z, G.sill, { angle: 0.05, spacing: 6, width: 1.2, color: P.inkSoft, alpha: 0.6, seed: sd('sillH'), density: (x, y) => sstep(WIN.y1 + 260, WIN.y1 + 520, y) });
      // a potted coffee seedling on the sill: the first shot's plant, waiting by the window
      inkS(ctx, Z, G.pot, { closed: true, width: 2.5, fill: P.orange, seed: sd('pot'), smooth: false });
      hatchZ(ctx, Z, G.pot, { spacing: 6, width: 1.2, color: P.ink, alpha: 0.6, seed: sd('potH'), density: (x) => sstep(-3600, -3150, x) });
      inkS(ctx, Z, [[-3500, -1700], [-3490, -2300], [-3520, -2900]], { width: 3, color: P.leafDeep, seed: sd('stemP') });
      const lv = [[-3500, -2350, -2.5], [-3500, -2350, -0.6], [-3515, -2850, -2.3], [-3515, -2850, -0.85]];
      for (let i = 0; i < lv.length; i++) {
        const [x, y, a] = lv[i];
        const ca = Math.cos(a), sa = Math.sin(a);
        const L0 = 520, W0 = 130;
        const pts = [[x, y], [x + ca * L0 * 0.5 - sa * W0, y + sa * L0 * 0.5 + ca * W0], [x + ca * L0, y + sa * L0], [x + ca * L0 * 0.5 + sa * W0, y + sa * L0 * 0.5 - ca * W0]];
        inkS(ctx, Z, pts, { closed: true, width: 2, fill: P.leafCoffee, seed: sd('potL', i) });
      }
    }
    // hanging lamp over the table: enamel shade, warm glow
    if (shows(Z, [-400, -60000, 1500, -3700], 6)) {
      const cord = new Path2D();
      cord.moveTo(540, Math.max(G.lampCord[0][1], Z.v[1] - 200 / Z.k));
      cord.lineTo(540, -5200);
      strokeZ(ctx, Z, cord, P.ink, 2.5, 1);
      ctx.save();
      ctx.globalAlpha = 0.35;
      fillPoly(ctx, [[-380, -3900], [1460, -3900], [2600, 400], [-1500, 400]], P.sun, 0.35);
      ctx.restore();
      inkS(ctx, Z, G.lampShade, { closed: true, width: 3, fill: P.teal, seed: sd('shade'), smooth: false });
      hatchZ(ctx, Z, G.lampShade, { spacing: 6, width: 1.2, color: P.tealDeep, alpha: 0.8, seed: sd('shadeH'), density: (x) => sstep(500, 1300, x) });
      inkS(ctx, Z, ell(540, -3900, 920, 160, 40, 0, Math.PI), { width: 3, seed: sd('shadeRim') });
      inkS(ctx, Z, ell(540, -3830, 220, 110, 20), { closed: true, width: 2, fill: P.sun, seed: sd('bulb') });
    }
    // counter and espresso machine at the far right
    if (shows(Z, [3400, -2000, 60000, 3600], 6)) {
      const ct = clipPolyRect(G.counter, Z.v[0], Z.v[1], Z.v[2] + 600 / Z.k, Z.v[3]);
      if (ct.length > 2) {
        inkS(ctx, Z, ct, { closed: true, width: 3, fill: P.wood, seed: sd('counter'), smooth: false });
        hatchZ(ctx, Z, ct, { angle: Math.PI / 2, spacing: 7, width: 1.2, color: P.barkDeep, alpha: 0.6, seed: sd('counterH'), length: [40, 140] });
        const pan = new Path2D();
        for (let x = 5200; x < Math.min(60000, Z.v[2] + 2000); x += 1800) {
          pan.moveTo(x, 1650);
          pan.lineTo(x, 3400);
        }
        strokeZ(ctx, Z, pan, P.barkDeep, 2, 0.8);
      }
      const ctop = clipPolyRect(G.counterTop, Z.v[0], Z.v[1], Z.v[2] + 600 / Z.k, Z.v[3]);
      if (ctop.length > 2) inkS(ctx, Z, ctop, { closed: true, width: 3, fill: P.paperDeep, seed: sd('ctop'), smooth: false });
      if (shows(Z, bbox(G.machine), 6)) {
        inkS(ctx, Z, G.machine, { closed: true, width: 3, fill: P.steel, seed: sd('mach') });
        hatchZ(ctx, Z, G.machine, { angle: Math.PI / 2, spacing: 6, width: 1.3, color: P.steelDeep, alpha: 0.8, seed: sd('machH'), density: (x) => 0.2 + 0.8 * sstep(5600, 7400, x) });
        inkS(ctx, Z, G.machineTop, { closed: true, width: 2.5, fill: P.steelDeep, seed: sd('machT'), smooth: false });
        // two group heads with portafilters, gauge, drip tray, a cup
        for (let g = 0; g < 2; g++) {
          const gx = 5100 + g * 1500;
          inkS(ctx, Z, LIB.rrectPts(gx - 260, -300, 520, 380, 80, 40), { closed: true, width: 2.5, fill: P.steelDeep, seed: sd('grp', g) });
          inkS(ctx, Z, [[gx - 200, 160], [gx + 520, 200]], { width: 9, color: P.ink, seed: sd('pf', g), taper: [0, 6] });
          inkS(ctx, Z, ell(gx, 1050, 170, 50, 20), { closed: true, width: 2, fill: P.ceramic, seed: sd('mcup', g) });
          inkS(ctx, Z, rect(gx - 170, 1050, gx + 170, 1230), { closed: true, width: 2, fill: P.ceramic, seed: sd('mcupB', g), smooth: false });
        }
        inkS(ctx, Z, ell(5850, -1000, 240, 240, 28), { closed: true, width: 2.5, fill: P.white, seed: sd('gauge') });
        inkS(ctx, Z, [[5850, -1000], [5980, -1130]], { width: 2, seed: sd('needle'), taper: [0, 4] });
        inkS(ctx, Z, rect(4500, 1230, 7300, 1250 + 60), { closed: true, width: 2, fill: P.steelDeep, seed: sd('tray'), smooth: false });
        inkS(ctx, Z, [[7400, -200], [7650, 400], [7600, 900]], { width: 5, color: P.ink, seed: sd('wand') });
        for (let c = 0; c < 3; c++) inkS(ctx, Z, rect(4600 + c * 520, -2350, 4980 + c * 520, -1900), { closed: true, width: 2, fill: P.ceramic, seed: sd('topcup', c), smooth: false });
      }
    }
    // bistro chair at the left
    if (shows(Z, [-3800, 300, -2000, 5500], 6)) {
      for (let i = 0; i < G.chairLegs.length; i++) inkS(ctx, Z, G.chairLegs[i], { closed: true, width: 2.5, fill: P.barkDeep, seed: sd('leg', i) });
      inkS(ctx, Z, G.chairRing, { closed: true, width: 4, color: P.barkDeep, seed: sd('ring') });
      inkS(ctx, Z, G.chairBack, { width: 10, color: P.ink, seed: sd('back'), taper: [4, 4] });
      inkS(ctx, Z, G.chairBack, { width: 5, color: P.wood, seed: sd('back2'), taper: [4, 4] });
      inkS(ctx, Z, LIB.smoothPts([[-3480, 2620], [-3400, 1500], [-2900, 1100], [-2400, 1500], [-2320, 2620]], false, 30), { width: 4, color: P.barkDeep, seed: sd('back3') });
      inkS(ctx, Z, G.chairSeat, { closed: true, width: 3, fill: P.wood, seed: sd('seat') });
      hatchZ(ctx, Z, G.chairSeat, { spacing: 6, width: 1.2, color: P.barkDeep, alpha: 0.7, seed: sd('seatH'), density: (x, y) => sstep(2650, 2900, y) });
    }
  }

  function drawTable(ctx, Z, P, G, t, tw) {
    // pedestal and foot
    if (shows(Z, [-300, 1950, 1400, 5300])) {
      inkS(ctx, Z, G.foot, { closed: true, width: 3, fill: LIB.mix(P.ink, P.steelDeep, 0.4), seed: sd('foot') });
      inkS(ctx, Z, G.pedestal, { closed: true, width: 3, fill: LIB.mix(P.ink, P.steelDeep, 0.5), seed: sd('ped') });
      hatchZ(ctx, Z, G.pedestal, { angle: 0, spacing: 6, width: 1.2, color: P.steel, alpha: 0.4, seed: sd('pedH'), density: (x) => 1 - sstep(520, 600, x) });
    }
    if (!shows(Z, bbox(G.top))) return;
    // edge band and top
    inkS(ctx, Z, G.edge, { closed: true, width: 3, fill: LIB.mix(P.wood, P.barkDeep, 0.35), seed: sd('edge') });
    hatchZ(ctx, Z, G.edge, { angle: 0.04, spacing: 5, width: 1.2, color: P.barkDeep, alpha: 0.8, seed: sd('edgeH'), length: [30, 90] });
    inkS(ctx, Z, G.top, { closed: true, width: 4, fill: LIB.mix(P.wood, P.paper, 0.22), seed: sd('top') });
    if (Z.k > 0.1) {
      const gp = new Path2D();
      for (const g of G.grain) LIB.tracePath(gp, g, false);
      strokeZ(ctx, Z, gp, P.barkDeep, 1.4, 0.45);
    }
    hatchZ(ctx, Z, G.top, { angle: 0.05, spacing: 10, width: 1.2, color: P.barkDeep, alpha: 0.4, seed: sd('topH'), density: (x, y) => 0.15 + 0.7 * sstep(800, 2400, (x - 560) * 0.6 + (y - 1350) * 1.4), length: [40, 120] });
    // cast shadows under the objects (lower right of each)
    hatchZ(ctx, Z, ell(-470, 1370, 260, 70, 32), { spacing: 5, width: 1.3, color: P.barkDeep, alpha: 0.8, seed: sd('shSug') });
    hatchZ(ctx, Z, ell(70, 1000, 160, 40, 32), { spacing: 5, width: 1.3, color: P.barkDeep, alpha: 0.7, seed: sd('shGl') });
    hatchZ(ctx, Z, ell(640, 1500, 440, 90, 40), { spacing: 5, width: 1.3, color: P.barkDeep, alpha: 0.8, seed: sd('shCup') });
    // sugar bowl
    if (shows(Z, [-760, 1000, -280, 1400], 4)) {
      inkS(ctx, Z, G.sugarBody, { closed: true, width: 3, fill: P.ceramic, seed: sd('sug') });
      hatchZ(ctx, Z, G.sugarBody, { spacing: 7, width: 1.3, color: P.ceramicShade, alpha: 1, seed: sd('sugH'), density: (x) => sstep(-560, -320, x) });
      hatchZ(ctx, Z, G.sugarBody, { spacing: 6, width: 1.2, color: P.inkSoft, alpha: 0.6, seed: sd('sugH2'), density: (x) => sstep(-420, -300, x) });
      inkS(ctx, Z, ell(-520, 1250, 200, 40, 30, 0.1, Math.PI - 0.1), { width: 2.5, color: P.annBlue, alpha: 0.6, seed: sd('sugBand') });
      inkS(ctx, Z, G.sugarLid, { closed: true, width: 3, fill: P.ceramic, seed: sd('lid') });
      inkS(ctx, Z, G.sugarKnob, { closed: true, width: 2.5, fill: P.ceramic, seed: sd('knob') });
      inkS(ctx, Z, [[-330, 1110], [-180, 960], [-110, 900]], { width: 7, color: P.ink, seed: sd('sugSp'), taper: [2, 2] });
      inkS(ctx, Z, [[-330, 1110], [-180, 960], [-110, 900]], { width: 3.5, color: P.steel, seed: sd('sugSp'), taper: [2, 2] });
    }
    // water glass
    if (shows(Z, [-130, 520, 160, 1010], 4)) {
      fillPoly(ctx, G.glass.concat(ell(16, 560, 126, 34, 24, 0, Math.PI).reverse()), P.white, 0.35);
      fillPoly(ctx, [[-118, 700], [150, 700], [136, 980], [80, 1004], [-50, 1004], [-104, 980]], P.water, 0.3);
      hatchZ(ctx, Z, [[-110, 700], [148, 700], [136, 980], [80, 1004], [-50, 1004], [-104, 980]], { angle: 0.02, spacing: 6, width: 1.1, color: P.waterDeep, alpha: 0.6, seed: sd('glassH'), density: 0.6 });
      inkS(ctx, Z, G.glass, { width: 2.5, seed: sd('glassO'), taper: [6, 6] });
      inkS(ctx, Z, G.glassTop, { closed: true, width: 2.2, seed: sd('glassT') });
      inkS(ctx, Z, G.glassWater, { closed: true, width: 1.6, color: P.waterDeep, seed: sd('glassW') });
      inkS(ctx, Z, [[-60, 620], [-70, 900]], { width: 4, color: P.white, alpha: 0.9, seed: sd('glassHi') });
    }
    // book
    if (shows(Z, bbox(G.book), 4)) {
      inkS(ctx, Z, G.bookEdgeL, { closed: true, width: 2.5, fill: P.white, seed: sd('bookL'), smooth: false });
      inkS(ctx, Z, G.bookEdge, { closed: true, width: 2.5, fill: P.white, seed: sd('bookE'), smooth: false });
      const pages = new Path2D();
      for (let i = 1; i < 5; i++) {
        pages.moveTo(1480, 1440 + i * 12);
        pages.lineTo(2280, 1290 + i * 12);
      }
      strokeZ(ctx, Z, pages, P.inkSoft, 1.2, 0.7);
      inkS(ctx, Z, G.book, { closed: true, width: 3, fill: P.rose, seed: sd('book'), smooth: false });
      hatchZ(ctx, Z, G.book, { angle: -0.6, spacing: 8, width: 1.2, color: P.cherryDeep, alpha: 0.5, seed: sd('bookH'), density: 0.6 });
      inkS(ctx, Z, [[1330, 1300], [2110, 1160]], { width: 14, color: P.ochre, seed: sd('bookBand'), taper: [0, 0] });
    }
    // the hand, resting, lifting toward the cup on the beat
    if (shows(Z, [1150, 1400, 3200, 2900], 4)) {
      const d = t < 0.75 ? 0 : [0.55, 1.06, 1][Math.min(2, Math.floor((t - 0.75) * 12 + 1e-6))];
      const dx = -34 * d, dy = -46 * d;
      const sh = (pts, f = 1) => pts.map((p) => [p[0] + dx * f, p[1] + dy * f]);
      inkS(ctx, Z, G.sleeve, { closed: true, width: 3, fill: P.tealDeep, seed: sd('sleeve') });
      hatchZ(ctx, Z, G.sleeve, { angle: 0.6, spacing: 6, width: 1.3, color: P.ink, alpha: 0.6, seed: sd('sleeveH'), density: (x, y) => sstep(1900, 2300, y) });
      const fa = sh(G.forearm, 0.5);
      inkS(ctx, Z, fa, { closed: true, width: 3, fill: P.skin, seed: sd('forearm') });
      for (let i = G.fingers.length - 1; i >= 0; i--) {
        const f = sh(G.fingers[i], 1 + 0.06 * i);
        inkS(ctx, Z, f, { closed: true, width: 2.5, fill: P.skin, seed: sd('finger', i) });
        hatchZ(ctx, Z, f, { spacing: 5, width: 1.1, color: P.skinDeep, alpha: 0.75, seed: sd('fingerH', i), density: 0.5, minPx: 8 });
      }
      const pm = sh(G.palm);
      inkS(ctx, Z, pm, { closed: true, width: 3, fill: P.skin, seed: sd('palm') });
      hatchZ(ctx, Z, pm, { spacing: 6, width: 1.2, color: P.skinDeep, alpha: 0.8, seed: sd('palmH'), density: (x, y) => sstep(1580, 1740, y) });
      inkS(ctx, Z, sh(G.thumb, 1.1), { closed: true, width: 2.5, fill: P.skin, seed: sd('thumb') });
      inkS(ctx, Z, G.cuff, { closed: true, width: 3, fill: LIB.mix(P.tealDeep, P.teal, 0.4), seed: sd('cuff') });
    }
  }

  function drawCup(ctx, Z, P, G, t, tw) {
    if (!shows(Z, [140, 1010, 940, 1530], 2)) return;
    const detail = Z.k > 0.09;
    // saucer
    inkS(ctx, Z, G.saucerUnder, { closed: true, width: 4, fill: P.ceramicShade, seed: sd('saucerU') });
    inkS(ctx, Z, G.saucerTop, { closed: true, width: 5, fill: P.ceramic, seed: sd('saucerT') });
    if (detail) {
      hatchZ(ctx, Z, G.saucerTop, { spacing: 8, width: 1.3, color: P.ceramicShade, alpha: 1, seed: sd('saucerH'), density: (x, y) => sstep(250, 380, (x - 540) * 0.7 + (y - 1420) * 2.2) });
      inkS(ctx, Z, G.saucerWell, { closed: true, width: 1.8, color: P.inkSoft, alpha: 0.9, seed: sd('well') });
      hatchZ(ctx, Z, G.cupShadow, { spacing: 5, width: 1.3, color: P.ceramicShade, alpha: 1, seed: sd('cupSh'), crossSpacing: 7, tone: 0.6, layers: 2 }, true);
    }
    // spoon on the saucer
    inkS(ctx, Z, G.spoonHandle, { closed: true, width: 2.5, fill: P.steel, seed: sd('spoonH') });
    inkS(ctx, Z, G.spoonBowl, { closed: true, width: 3, fill: P.steel, seed: sd('spoonB') });
    if (detail) hatchZ(ctx, Z, G.spoonBowl, { spacing: 5, width: 1.2, color: P.steelDeep, alpha: 0.9, seed: sd('spoonBH'), density: (x, y) => sstep(1452, 1475, y), minPx: 8 });
    // handle (geometric width 26, ink outline screen-constant)
    {
      const hp = new Path2D();
      LIB.tracePath(hp, G.handle, false);
      ctx.save();
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.strokeStyle = P.ink;
      ctx.lineWidth = 26 + 8 / Z.k;
      ctx.stroke(hp);
      if (26 - 2 / Z.k > 0) {
        ctx.strokeStyle = P.ceramic;
        ctx.lineWidth = 26 - 2 / Z.k;
        ctx.stroke(hp);
      }
      ctx.restore();
      if (detail) inkS(ctx, Z, LIB.smoothPts([[862, 1150], [894, 1200], [876, 1258], [820, 1288]], false, 6), { width: 2, color: P.ceramicShade, seed: sd('handleSh') });
    }
    // body
    inkS(ctx, Z, G.body, { closed: true, width: 5, fill: P.ceramic, seed: sd('body') });
    if (detail) {
      hatchZ(ctx, Z, G.body, { spacing: 8, width: 1.4, color: P.ceramicShade, alpha: 1, seed: sd('bodyH'), crossSpacing: 7, tone: 0.7, layers: 2, density: (x) => sstep(560, 770, x) }, true);
      hatchZ(ctx, Z, G.body, { spacing: 7, width: 1.3, color: P.inkSoft, alpha: 0.75, seed: sd('bodyH2'), density: (x, y) => sstep(600, 760, x + (y - 1100) * 0.25) });
      inkS(ctx, Z, LIB.smoothPts([[350, 1150], [362, 1250], [400, 1330]], false, 6), { width: 5, color: P.white, alpha: 0.95, seed: sd('hi') });
      inkS(ctx, Z, ell(540, 1395, 160, 34, 30, 0.1, Math.PI - 0.1), { width: 2, color: P.inkSoft, seed: sd('footL') });
    }
    // rim, inner wall, crema
    inkS(ctx, Z, G.rimO, { closed: true, width: 5, fill: P.ceramic, seed: sd('rim') });
    inkS(ctx, Z, G.rimI, { closed: true, width: 2, fill: P.ceramicShade, seed: sd('rimI') });
    fillPoly(ctx, G.liquid, P.crema);
    if (detail) {
      // tiger mottling, drifting slowly on twos, clipped to the liquid
      ctx.save();
      ctx.beginPath();
      LIB.tracePath(ctx, G.liquid, true);
      ctx.clip();
      const spin = tw * 0.25;
      const pl = new Path2D(), pd = new Path2D();
      for (const [bx, by, br, el, ph, light] of G.blobs) {
        const a = Math.atan2(by, bx) + spin, d = Math.hypot(bx, by);
        const x = 540 + Math.cos(a) * d * 232, y = 1102 + Math.sin(a) * d * 60;
        const p = light ? pl : pd;
        p.moveTo(x + br * 232, y);
        p.ellipse(x, y, br * 232, br * 60 * el + 4, ph * 0.1, 0, TAU);
      }
      ctx.fillStyle = P.cremaLight;
      ctx.globalAlpha = 0.85;
      ctx.fill(pl);
      ctx.fillStyle = LIB.mix(P.crema, P.espresso, 0.25);
      ctx.globalAlpha = 0.6;
      ctx.fill(pd);
      ctx.globalAlpha = 1;
      const ring = new Path2D();
      LIB.tracePath(ring, G.liquid, true);
      ctx.strokeStyle = LIB.mix(P.crema, P.espresso, 0.45);
      ctx.lineWidth = 16;
      ctx.stroke(ring);
      ctx.restore();
      stippleZ(ctx, Z, G.liquid, { spacing: 7, r: [0.8, 1.5], color: P.cremaLight, alpha: 0.8, seed: sd('cremaSt'), density: 0.5, minPx: 10 });
    }
    inkS(ctx, Z, G.liquid, { closed: true, width: 1.8, color: P.inkSoft, seed: sd('liqO') });
  }

  function drawSteam(ctx, Z, P, t, tw) {
    // three ribbons rising and curling on twos; kept while the cup is wider than 20 px
    if (Z.k * 500 < 20 || !shows(Z, [300, 400, 800, 1100], 2)) return;
    for (let s = 0; s < 3; s++) {
      const x0 = 470 + s * 70;
      const ph = s * 2.1 + tw * 3.2;
      const pts = [];
      for (let i = 0; i <= 30; i++) {
        const u = i / 30;
        const y = 1080 - u * 520;
        const amp = 12 + u * 50;
        pts.push([x0 + amp * Math.sin(u * 7 + ph) + u * 30 * (s - 1), y]);
      }
      const w = Math.max(2.5, 11 * Math.min(1, Z.k * 1.4));
      ink(ctx, Z, pts, { width: w, color: P.steam, alpha: 0.75, seed: sd('steam', s), taper: [20, 60], wobble: 1, boil: true });
      ink(ctx, Z, pts.map((p) => [p[0] + 9, p[1] - 4]), { width: w * 0.35, color: P.white, alpha: 0.6, seed: sd('steam2', s), taper: [30, 80], wobble: 1 });
    }
  }

  // ---------------------------------------------------------------------------
  // scene
  // ---------------------------------------------------------------------------

  FILM.scene({
    id: ID,
    draw(ctx, tIn, info) {
      const L = info.lib, P = L.pal, E = L.ease;
      const dur = info.dur;
      let t = clamp(tIn, 0, dur);
      const tf = Math.round(t * 24) / 24;
      if (Math.abs(t - tf) < 1e-4) t = tf + 1e-7;
      const tw = L.onTwos(t);
      const G = geo();
      const cam = camAt(t);
      const zk = cam.z;
      const Z = { k: zk, v: [cam.x - 540 / zk, cam.y - 960 / zk, cam.x + 540 / zk, cam.y + 960 / zk] };
      const toS = (x, y) => [540 + (x - cam.x) * zk, 960 + (y - cam.y) * zk];

      // ---- 1 stripes: the wall and the sky ------------------------------------------------
      L.stripes(ctx, { colors: [P.stripeCream, P.stripeYellow], width: 140, angle: -0.52, offset: 8 * info.T, seed: sd('stripes') & 0xffff });

      L.camera(ctx, { x: cam.x, y: cam.y, zoom: zk }, () => {
        // ---- 2 landscape through the window ---------------------------------------------------
        drawLandscape(ctx, Z, P, G, tw);
        // ---- 3 room ---------------------------------------------------------------------------
        drawRoom(ctx, Z, P, G, tw);
        // ---- 4 table and what is on it ----------------------------------------------------------
        drawTable(ctx, Z, P, G, t, tw);
        // ---- 5 the cup ---------------------------------------------------------------------------
        drawCup(ctx, Z, P, G, t, tw);
        drawSteam(ctx, Z, P, t, tw);
      });

      // ---- 6 overlays (screen space) -----------------------------------------------------------
      // annYellow ring 1.4x the cup radius, shrinking with the cup
      {
        const c = toS(540, 1240);
        const r = 1.4 * 250 * zk;
        ctx.save();
        ctx.strokeStyle = P.annYellow;
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(c[0], c[1], Math.max(r, 14), 0, TAU);
        ctx.stroke();
        ctx.restore();
      }
      // annBlue arc annotation around the window, drawing on from the layer-3 beat
      if (t >= 1.5) {
        const p = E.outExpo(clamp((t - 1.5) / (18 * FR) + 1 / 18));
        const c = toS(WIN_C[0], WIN_C[1]);
        const r = 9600 * zk;
        L.arcAnnotation(ctx, c[0], c[1], r, -160 * DEG, -20 * DEG, { color: P.annBlue, width: 2, p, endTicks: 8, arrow: 14, dot: 4 });
      }
    },
  });
})();

</script>
<script>
// ---- src/scenes/20-grounds-to-soil.js
// 20 grounds-to-soil : The grounds feed the next tree.  T 40.50 to 42.75 (54 frames), illustrated.
// A spent espresso puck is knocked off a knock-box bar at the top left, tumbles down a dashed blue
// trajectory and lands in the soil at the foot of a young coffee tree on the beat (T 41.25),
// crumbling into grounds that sink into the earth; a seedling hooks up beside it on the 8th
// (T 41.625). A magenta ring marks a ripe cherry on the branch above (T 42.00) and a snap zoom
// 1x to 9x (outExpo, 18 frames) lands that cherry exactly on G2 (centre (540, 900), rx 260,
// ry 290) on the last frame, for the hard cut to 21's blueprint oval.
//
// Camera: world (540, 620) is the target cherry centre; it moves from screen (540, 620) at zoom 1
// to screen (540, 900) at zoom 9, so cam.y = 620 - (sy - 960) / zoom. Every pen size (ink width,
// wobble, hatch spacing, stipple radius) is divided by the zoom so lines stay screen-constant, and
// anything outside the visible world rectangle is culled; hatch clips are cut to that rectangle.
//
// Layers, back to front:
//   1 stripes (stripeCream / stripeYellow, drifting 6 px per beat)
//   2 tree: back leaves, trunk, right lateral, upper sprays
//   3 soil cutaway: surface, soilDeep hatching, stones, roots, earthworm, grounds mixing in
//   4 the lateral branch with opposite leaf pairs and three axillary cherry clusters (target in front)
//   5 knock box edge with its bar (top left)
//   6 the puck tumbling, landing, crumbling; the seedling
//   7 overlays: annBlue dashed fall line, annYellow landing ring, annYellow dashed cluster ring,
//     annMagenta target ring
(function () {
  'use strict';

  const ID = 'grounds-to-soil';
  const LIB = FILM.lib;
  const TAU = Math.PI * 2;
  const DEG = Math.PI / 180;
  const FR = 1 / 24;

  const clamp = (v, a = 0, b = 1) => (v < a ? a : v > b ? b : v);
  const lerp = (a, b, u) => a + (b - a) * u;
  const sstep = (a, b, x) => {
    const u = clamp((x - a) / (b - a));
    return u * u * (3 - 2 * u);
  };
  const sd = (...k) => LIB.hash(ID, ...k) & 0x7fffffff;

  // beats (shot-local seconds)
  const B_LAND = 0.75; // T 41.25 puck lands
  const B_SHOOT = 1.125; // T 41.625 seedling pushes up
  const B_ZOOM = 1.5; // T 42.00 magenta ring, snap zoom starts
  const Z_FRAMES = 17; // zoom lands on frame 17 after the beat = the shot's last frame

  // target cherry: lands on G2 at 9x exactly
  const TGT = [540, 620];
  const TRX = 260 / 9, TRY = 290 / 9;
  const ZMAX = 9;

  // puck path
  const PUCK0 = [250, 372];
  const PUCK1 = [420, 1250];
  const PUCK_R = 130;
  const SOIL_Y = 1250;

  // ---------------------------------------------------------------------------
  // small geometry helpers
  // ---------------------------------------------------------------------------

  function clipPolyRect(pts, x0, y0, x1, y1) {
    let out = pts;
    const inside = [(p) => p[0] >= x0, (p) => p[0] <= x1, (p) => p[1] >= y0, (p) => p[1] <= y1];
    const cut = [
      (a, b) => [x0, lerp(a[1], b[1], (x0 - a[0]) / (b[0] - a[0]))],
      (a, b) => [x1, lerp(a[1], b[1], (x1 - a[0]) / (b[0] - a[0]))],
      (a, b) => [lerp(a[0], b[0], (y0 - a[1]) / (b[1] - a[1])), y0],
      (a, b) => [lerp(a[0], b[0], (y1 - a[1]) / (b[1] - a[1])), y1],
    ];
    for (let e = 0; e < 4; e++) {
      const inp = out;
      out = [];
      if (!inp.length) break;
      for (let i = 0; i < inp.length; i++) {
        const a = inp[(i + inp.length - 1) % inp.length], b = inp[i];
        const ia = inside[e](a), ib = inside[e](b);
        if (ib) {
          if (!ia) out.push(cut[e](a, b));
          out.push(b);
        } else if (ia) out.push(cut[e](a, b));
      }
    }
    return out;
  }

  function bbox(pts) {
    let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
    for (const p of pts) {
      if (p[0] < x0) x0 = p[0];
      if (p[0] > x1) x1 = p[0];
      if (p[1] < y0) y0 = p[1];
      if (p[1] > y1) y1 = p[1];
    }
    return [x0, y0, x1, y1];
  }

  // ---------------------------------------------------------------------------
  // the zoom-aware pen. Z = { k: zoom, v: [x0, y0, x1, y1] visible world rect }
  // ---------------------------------------------------------------------------

  const visB = (Z, b, pad = 0) => !(b[2] < Z.v[0] - pad || b[0] > Z.v[2] + pad || b[3] < Z.v[1] - pad || b[1] > Z.v[3] + pad);

  let BOIL = 0; // boil drawing index for every pen in this file (set per frame / per cache)

  function ink(ctx, Z, pts, o = {}) {
    const k = 1 / Z.k;
    const w = o.width != null ? o.width : 3;
    const q = Object.assign({}, o, {
      width: w * k,
      wobble: (o.wobble != null ? o.wobble : 2) * k,
      tremble: (o.tremble != null ? o.tremble : 0.4) * k,
      boilAmp: (o.boilAmp != null ? o.boilAmp : 0.7) * k,
      rough: (o.rough != null ? o.rough : 0.22 + 0.07 * w) * k,
      step: (o.step || 2.5) * k,
      boil: o.boil === false ? false : BOIL,
    });
    const tp = o.taper != null ? o.taper : o.closed ? [10, 22] : [18, 34];
    q.taper = Array.isArray(tp) ? [tp[0] * k, tp[1] * k] : tp * k;
    if (o.double) q.double = { offset: (w / 2 + 3) * k, width: 1.5 * k, alpha: 0.4 };
    LIB.inkPath(ctx, pts, q);
  }

  // hatch clipped to the visible rect, with every pen size in screen px
  function hatchZ(ctx, Z, poly, o = {}, cross = false) {
    const k = 1 / Z.k;
    const pad = 30 * k;
    const cp = Z.k > 1.01 ? clipPolyRect(poly, Z.v[0] - pad, Z.v[1] - pad, Z.v[2] + pad, Z.v[3] + pad) : poly;
    if (cp.length < 3) return;
    const len = o.length || [16, 64];
    const gap = o.gap || [2, 7];
    const q = Object.assign({}, o, {
      spacing: (o.spacing || 8) * k,
      crossSpacing: o.crossSpacing ? o.crossSpacing * k : undefined,
      width: (o.width != null ? o.width : 1.4) * k,
      length: [len[0] * k, len[1] * k],
      gap: [gap[0] * k, gap[1] * k],
      inset: (o.inset != null ? o.inset : 6) * k,
      overshoot: (o.overshoot != null ? o.overshoot : 3) * k,
      bow: (o.bow != null ? o.bow : 0.7) * k,
      bend: (o.bend || 0) * k,
      boilAmp: (o.boilAmp != null ? o.boilAmp : 0.45) * k,
      boil: BOIL,
    });
    if (cross) LIB.crossHatch(ctx, cp, q);
    else LIB.hatch(ctx, cp, q);
  }

  function stippleZ(ctx, Z, poly, o = {}) {
    const k = 1 / Z.k;
    const pad = 20 * k;
    const cp = Z.k > 1.01 ? clipPolyRect(poly, Z.v[0] - pad, Z.v[1] - pad, Z.v[2] + pad, Z.v[3] + pad) : poly;
    if (cp.length < 3) return;
    const r = o.r || [1.0, 2.2];
    LIB.stipple(ctx, cp, Object.assign({}, o, { spacing: (o.spacing || 7.5) * k, r: [r[0] * k, r[1] * k], boilAmp: (o.boilAmp != null ? o.boilAmp : 0.35) * k, boil: BOIL }));
  }

  // the runs of a polyline that fall inside the visible rect (padded), so off-screen ink costs nothing
  function runsIn(Z, pts, closed) {
    if (Z.k <= 1.01) return [closed ? pts.concat([pts[0]]) : pts];
    const pad = 60 / Z.k;
    const x0 = Z.v[0] - pad, y0 = Z.v[1] - pad, x1 = Z.v[2] + pad, y1 = Z.v[3] + pad;
    const src = closed ? pts.concat([pts[0]]) : pts;
    const out = [];
    let cur = null;
    for (let i = 0; i < src.length; i++) {
      const p = src[i];
      const inside = p[0] >= x0 && p[0] <= x1 && p[1] >= y0 && p[1] <= y1;
      if (inside) {
        if (!cur) {
          cur = [];
          if (i > 0) cur.push(src[i - 1]);
        }
        cur.push(p);
      } else if (cur) {
        cur.push(p);
        out.push(cur);
        cur = null;
      }
    }
    if (cur) out.push(cur);
    return out.filter((r) => r.length > 1);
  }

  // ink a long line or outline only where it shows; closed outlines get their fill separately
  function inkRuns(ctx, Z, pts, o = {}) {
    if (Z.k <= 1.01) {
      ink(ctx, Z, pts, o);
      return;
    }
    if (o.closed && o.fill) fillPoly(ctx, pts, o.fill, o.fillAlpha != null ? o.fillAlpha : 1);
    const runs = runsIn(Z, pts, !!o.closed);
    const q = Object.assign({}, o, { closed: false, fill: null });
    runs.forEach((r, i) => {
      const whole = !o.closed && r[0] === pts[0] && r[r.length - 1] === pts[pts.length - 1];
      ink(ctx, Z, r, Object.assign({}, q, { seed: (o.seed || 1) + i * 31, taper: whole ? o.taper : [0, 0] }));
    });
  }

  function fillPoly(ctx, pts, color, alpha = 1) {
    ctx.save();
    ctx.globalAlpha *= alpha;
    ctx.fillStyle = color;
    ctx.beginPath();
    LIB.tracePath(ctx, pts, true);
    ctx.fill();
    ctx.restore();
  }

  // ---------------------------------------------------------------------------
  // forms: leaf, cherry, bark tube
  // ---------------------------------------------------------------------------

  // a coffee leaf from its node: petiole, elliptic blade 2:1 with a drawn-out tip, wavy margin,
  // 9 lateral vein pairs looping toward the tip. side: which half is in shadow (+1 right of midrib)
  function leafGeom(bx, by, ang, len, wid, seed, bend = 0.06) {
    const r = LIB.rng(seed);
    const ca = Math.cos(ang), sa = Math.sin(ang);
    const nx = -sa, ny = ca;
    const pet = len * 0.08;
    const blade = len - pet;
    const ph = r() * TAU;
    const waves = r.int(4, 6);
    const mid = (s) => {
      const d = pet + blade * s;
      const off = Math.sin(Math.PI * s) * bend * blade;
      return [bx + ca * d + nx * off, by + sa * d + ny * off];
    };
    const hw = (s) => {
      const base = (wid / 2) * Math.pow(Math.sin(Math.PI * Math.pow(s, 0.85)), 0.8) * (1 - 0.12 * s);
      return base * (1 + 0.045 * Math.sin(s * TAU * waves + ph)) * (s > 0.92 ? 1 - (s - 0.92) * 4 : 1);
    };
    const N = 40;
    const left = [], right = [], midPts = [];
    for (let i = 0; i <= N; i++) {
      const s = i / N;
      const m = mid(s);
      const w = hw(s);
      midPts.push(m);
      left.push([m[0] - nx * w, m[1] - ny * w]);
      right.push([m[0] + nx * w, m[1] + ny * w]);
    }
    const outline = left.concat(right.slice(1, N).reverse());
    const veins = [];
    for (let k = 0; k < 9; k++) {
      const s = 0.1 + k * 0.088;
      for (const sg of [-1, 1]) {
        const m0 = mid(s);
        const s1 = Math.min(0.97, s + 0.1);
        const m1 = mid(s1);
        const w1 = hw(s1) * 0.84;
        const m2 = mid(s + 0.05);
        const w2 = hw(s + 0.05) * 0.5;
        veins.push([m0, [m2[0] + sg * nx * w2, m2[1] + sg * ny * w2], [m1[0] + sg * nx * w1, m1[1] + sg * ny * w1]]);
      }
    }
    const halfR = [midPts[0]].concat(right.slice(1, N), [midPts[N]], midPts.slice(1, N).reverse());
    const sheen = [];
    for (let i = 4; i <= 32; i++) {
      const s = i / N, m = mid(s), w = hw(s) * 0.22;
      sheen.push([m[0] - nx * w, m[1] - ny * w]);
    }
    return { outline, mid: midPts, veins, halfR, sheen, petiole: [[bx, by], mid(0)], ang, b: bbox(outline) };
  }

  function drawLeaf(ctx, Z, P, lf, seed, o = {}) {
    if (!visB(Z, lf.b, 10)) return;
    const col = o.color || P.leafCoffee;
    ink(ctx, Z, lf.petiole, { width: Math.max(2.5, 2.4 * Z.k), color: P.ink, seed: seed + 1, taper: [2, 6] });
    inkRuns(ctx, Z, lf.outline, { closed: true, width: o.width || 3, fill: col, seed: seed + 2, wobble: 1.4 });
    // gloss streak along one side of the midrib
    inkRuns(ctx, Z, lf.sheen, { width: 5, color: P.leafSheen, alpha: 0.8, seed: seed + 3, taper: [20, 30], wobble: 1 });
    // shadow half: hatching roughly parallel to the laterals
    hatchZ(ctx, Z, lf.halfR, { angle: lf.ang + 0.75, spacing: 7, width: 1.3, color: P.leafDeep, alpha: 0.75, length: [10, 34], seed: seed + 4, density: 0.85 });
    // veins
    const vp = new Path2D();
    for (const v of lf.veins) {
      vp.moveTo(v[0][0], v[0][1]);
      vp.quadraticCurveTo(v[1][0], v[1][1], v[2][0], v[2][1]);
    }
    ctx.save();
    ctx.strokeStyle = P.leafDeep;
    ctx.globalAlpha = 0.9;
    ctx.lineWidth = 1.8 / Z.k;
    ctx.lineCap = 'round';
    ctx.stroke(vp);
    ctx.restore();
    inkRuns(ctx, Z, lf.mid, { width: 2.5, color: P.leafDeep, seed: seed + 5, taper: [4, 30], wobble: 0.8 });
  }

  const CHERRY_COLS = {
    red: ['cherryRed', 'cherryDeep', 'cherryLight'],
    deep: ['cherryDeep', 'ink', 'cherryRed'],
    yellow: ['cherryYellow', 'ochre', 'white'],
    green: ['cherryGreen', 'leafDeep', 'leafSheen'],
  };

  // G2 proportions: calyx disc radius 34/260 rx at 272/290 ry below the centre; gloss inset 40/260
  function drawCherry(ctx, Z, P, cx, cy, rx, ry, kind, seed, o = {}) {
    const b = [cx - rx - 4, cy - ry - 4, cx + rx + 4, cy + ry + 4];
    if (!visB(Z, b, 10)) return;
    const [cf, cd, cl] = CHERRY_COLS[kind].map((k) => P[k]);
    const n = Math.max(48, Math.min(160, Math.round(rx * Z.k * 0.5)));
    const pts = LIB.ellipsePts(cx, cy, rx, ry, n);
    ink(ctx, Z, pts, { closed: true, width: o.width || 3, fill: cf, seed: seed + 1, wobble: o.wobble != null ? o.wobble : 1.2 });
    const dens = (x, y) => sstep(-0.3, 0.85, ((x - cx) / rx) * 0.55 + ((y - cy) / ry) * 0.75);
    hatchZ(ctx, Z, pts, { spacing: o.spacing || 8, crossSpacing: (o.spacing || 8) * 0.8, width: 1.5, color: cd, alpha: 0.85, density: dens, tone: 0.9, layers: 3, length: [14, 50], seed: seed + 2 }, true);
    // gloss crescent at upper left, 200 to 250 degrees
    const gi = rx * (40 / 260);
    const gl = [];
    for (let i = 0; i <= 14; i++) {
      const a = (200 + (50 * i) / 14) * DEG;
      gl.push([cx + Math.cos(a) * (rx - gi), cy + Math.sin(a) * (ry - gi)]);
    }
    for (let i = 14; i >= 0; i--) {
      const a = (200 + (50 * i) / 14) * DEG;
      const th = Math.sin((Math.PI * i) / 14) * rx * 0.07;
      gl.push([cx + Math.cos(a) * (rx - gi - th), cy + Math.sin(a) * (ry - gi - th)]);
    }
    fillPoly(ctx, gl, cl, 0.95);
    // calyx scar: ink disc with a 5-point star scar
    const kx = cx, ky = cy + ry * (272 / 290), kr = rx * (34 / 260);
    ink(ctx, Z, LIB.ellipsePts(kx, ky, kr, kr * 0.62, 24), { closed: true, width: 2, fill: P.ink, seed: seed + 3, wobble: 0.3, taper: [3, 5] });
    const st = new Path2D();
    for (let i = 0; i < 5; i++) {
      const a = -Math.PI / 2 + (i * TAU) / 5 + 0.2;
      st.moveTo(kx, ky);
      st.lineTo(kx + Math.cos(a) * kr * 0.7, ky + Math.sin(a) * kr * 0.45);
    }
    ctx.save();
    ctx.strokeStyle = cd === P.ink ? P.cherryRed : cd;
    ctx.lineWidth = 1.4 / Z.k;
    ctx.stroke(st);
    ctx.restore();
    if (o.dew) {
      const [dx, dy, dr] = o.dew;
      ink(ctx, Z, LIB.ellipsePts(dx, dy, dr, dr, 20), { closed: true, width: 1.6, fill: P.white, fillAlpha: 0.85, seed: seed + 4, wobble: 0.3, taper: [2, 4] });
    }
  }

  // a tapering bark tube along a centreline, with lengthwise hatching on the shadow side
  function tubeGeom(line, w0, w1) {
    const sm = LIB.smoothPts(line, false, 8);
    const n = sm.length;
    const L = [], R = [];
    for (let i = 0; i < n; i++) {
      const a = sm[Math.max(0, i - 1)], b = sm[Math.min(n - 1, i + 1)];
      const tx = b[0] - a[0], ty = b[1] - a[1];
      const tl = Math.hypot(tx, ty) || 1;
      const w = lerp(w0, w1, i / (n - 1)) / 2;
      L.push([sm[i][0] - (ty / tl) * w, sm[i][1] + (tx / tl) * w]);
      R.push([sm[i][0] + (ty / tl) * w, sm[i][1] - (tx / tl) * w]);
    }
    const poly = L.concat(R.slice().reverse());
    // shadow strip: the R side half (lower/right in screen for left-to-right lines)
    const shade = sm.map((p, i) => [(p[0] + L[i][0]) / 2, (p[1] + L[i][1]) / 2]).concat(L.slice().reverse());
    return { sm, L, R, poly, shade, b: bbox(poly) };
  }

  function drawTube(ctx, Z, P, tb, seed, o = {}) {
    if (!visB(Z, tb.b, 10)) return;
    fillPoly(ctx, tb.poly, o.fill || P.bark);
    const along = Math.atan2(tb.sm[tb.sm.length - 1][1] - tb.sm[0][1], tb.sm[tb.sm.length - 1][0] - tb.sm[0][0]);
    hatchZ(ctx, Z, tb.shade, { angle: along, spacing: 5, width: 1.3, color: P.barkDeep, alpha: 0.85, length: [12, 40], seed: seed + 1, angleJitter: 0.03 });
    hatchZ(ctx, Z, tb.poly, { angle: along, spacing: 11, width: 1.1, color: P.barkDeep, alpha: 0.45, length: [8, 26], seed: seed + 2, density: 0.6 });
    inkRuns(ctx, Z, tb.L, { width: o.width || 3, seed: seed + 3, taper: [4, 20] });
    inkRuns(ctx, Z, tb.R, { width: o.width || 3, seed: seed + 4, taper: [4, 20] });
  }

  // ---------------------------------------------------------------------------
  // static world geometry (t-independent, built once)
  // ---------------------------------------------------------------------------

  let GEO = null;
  function geo() {
    if (GEO) return GEO;
    const r = LIB.rng(sd('geo'));
    const G = {};
    // trunk: x 760, from below the soil line to above the frame, slight lean
    G.trunk = tubeGeom([[772, 1330], [766, 1200], [760, 1000], [757, 800], [761, 560], [756, 300], [750, 60], [748, -120]], 62, 40);
    // the lateral branch through the target node: branch top edge at y 585 under G2 at 9x
    G.branch = tubeGeom([[760, 572], [690, 579], [540, 586.7], [420, 598], [300, 614], [160, 636], [-40, 668]], 9, 6);
    G.branchR = tubeGeom([[760, 520], [860, 512], [980, 520], [1120, 536]], 8, 6);
    G.branchLow = tubeGeom([[758, 960], [880, 948], [1000, 958], [1120, 980]], 9, 6);
    G.branchLowL = tubeGeom([[760, 990], [660, 1000], [560, 1020], [470, 1040]], 8, 5);
    // leaves: opposite pairs at each node
    const leaves = [];
    const pair = (x, y, a1, a2, l, w, key) => {
      leaves.push({ g: leafGeom(x, y, a1, l, w, sd('leaf', key, 1), 0.07), seed: sd('lf', key, 1) });
      leaves.push({ g: leafGeom(x, y, a2, l * 0.95, w * 0.95, sd('leaf', key, 2), -0.07), seed: sd('lf', key, 2) });
    };
    // back layer (drawn before the trunk): upper sprays and the far right lateral
    const back = [];
    const bpair = (x, y, a1, a2, l, w, key) => {
      back.push({ g: leafGeom(x, y, a1, l, w, sd('bleaf', key, 1), 0.06), seed: sd('blf', key, 1) });
      back.push({ g: leafGeom(x, y, a2, l * 0.92, w * 0.92, sd('bleaf', key, 2), -0.06), seed: sd('blf', key, 2) });
    };
    bpair(757, 230, -150 * DEG, -30 * DEG, 300, 140, 'top1');
    bpair(752, 60, -160 * DEG, -20 * DEG, 280, 130, 'top2');
    bpair(880, 513, -70 * DEG, 60 * DEG, 260, 124, 'r1');
    bpair(1010, 522, -60 * DEG, 70 * DEG, 240, 116, 'r2');
    bpair(890, 950, -60 * DEG, 65 * DEG, 270, 128, 'lo1');
    bpair(600, 1012, -125 * DEG, 115 * DEG, 230, 110, 'lo2');
    G.back = back;
    // front lateral: nodes at x 690, 540 (target), 330, 120
    pair(690, 579, -80 * DEG, 78 * DEG, 250, 118, 'n0');
    pair(540, 586.7, -128 * DEG, -52 * DEG, 300, 142, 'n1');
    pair(330, 610, -116 * DEG, 104 * DEG, 290, 138, 'n2');
    pair(120, 642, -112 * DEG, 98 * DEG, 270, 128, 'n3');
    G.leaves = leaves;
    // cherry clusters (target cluster scaled from 01's cluster by 1/9 about the target)
    const s9 = (x, y, rr) => [540 + (x - 540) / 9, 620 + (y - 900) / 9, rr / 9];
    G.cluster = [
      Object.assign({ kind: 'yellow' }, { p: s9(230, 760, 130) }),
      Object.assign({ kind: 'red' }, { p: s9(850, 760, 140) }),
      Object.assign({ kind: 'green' }, { p: s9(120, 1000, 110) }),
      Object.assign({ kind: 'deep' }, { p: s9(980, 1040, 120) }),
      Object.assign({ kind: 'green' }, { p: [507, 588, 9] }),
      Object.assign({ kind: 'red' }, { p: [574, 588, 10] }),
    ];
    const cl = (x, y, n, kinds, key) => {
      const out = [];
      const rr = LIB.rng(sd('cl', key));
      for (let i = 0; i < n; i++) {
        const a = (i / n) * Math.PI + rr.range(-0.2, 0.2);
        const d = rr.range(10, 26);
        const rad = rr.range(11, 15);
        out.push({ kind: kinds[i % kinds.length], p: [x - Math.cos(a) * d * 1.3, y + 8 + Math.sin(a) * d, rad] });
      }
      out.sort((A, B) => A.p[1] - B.p[1]);
      return out;
    };
    G.clusterL = cl(330, 612, 7, ['red', 'yellow', 'red', 'green', 'deep', 'red', 'yellow'], 'a');
    G.clusterLL = cl(120, 644, 6, ['green', 'yellow', 'red', 'green', 'red', 'green'], 'b');
    G.clusterN0 = cl(690, 581, 5, ['red', 'deep', 'yellow', 'red', 'green'], 'c');
    // soil
    const surf = [];
    for (let x = -40; x <= 1120; x += 20) surf.push([x, SOIL_Y + 6 * LIB.noise1(x * 0.012, sd('surf')) + 3 * LIB.noise1(x * 0.05, sd('surf2'))]);
    G.surf = surf;
    G.soil = surf.concat([[1120, 1960], [-40, 1960]]);
    G.stones = [];
    for (let i = 0; i < 26; i++) {
      const x = r.range(20, 1060), y = r.range(1300, 1880);
      if (Math.abs(x - 230) < 120 && Math.abs(y - 1560) < 70) continue;
      G.stones.push([x, y, r.range(8, 22), r.range(5, 13), r.range(-0.5, 0.5), r.int(0, 1)]);
    }
    G.roots = [];
    const root = (pts, w) => G.roots.push({ pts: LIB.smoothPts(pts, false, 8), w });
    root([[770, 1250], [700, 1330], [610, 1380], [520, 1470], [430, 1500]], 4);
    root([[770, 1260], [840, 1350], [930, 1400], [1010, 1500], [1100, 1540]], 4);
    root([[766, 1270], [760, 1400], [740, 1560], [770, 1720], [750, 1880]], 5);
    root([[700, 1330], [650, 1420], [660, 1530]], 2);
    root([[840, 1350], [860, 1460], [900, 1560]], 2);
    root([[610, 1380], [560, 1360], [500, 1380]], 1.6);
    root([[760, 1560], [700, 1640], [640, 1660]], 1.6);
    root([[740, 1560], [820, 1630], [880, 1700]], 1.6);
    // leaf litter on the surface
    G.litter = [];
    for (let i = 0; i < 9; i++) {
      const x = r.range(40, 1040);
      if (Math.abs(x - 420) < 150) continue;
      G.litter.push({ g: leafGeom(x, SOIL_Y - 4 + r.range(-3, 6), r.pick([-1, 1]) * r.range(0.05, 0.25) + (r() < 0.5 ? Math.PI : 0), r.range(70, 110), r.range(30, 44), sd('lit', i), 0.02), seed: sd('litS', i) });
    }
    // grounds crumbs: where each crumb sits on the puck face, and where it settles in the soil
    G.crumbs = [];
    for (let i = 0; i < 360; i++) {
      const a = r() * TAU, d = Math.sqrt(r()) * PUCK_R;
      const sx = PUCK1[0] + Math.cos(a) * d, sy = SOIL_Y - 14 + Math.sin(a) * d * 0.18;
      const ex = sx + r.range(-30, 30), ey = SOIL_Y + 8 + Math.pow(r(), 1.7) * 190;
      G.crumbs.push([sx, sy, ex, ey, r.range(1.6, 4.2), r() < 0.25]);
    }
    GEO = G;
    return G;
  }

  // ---------------------------------------------------------------------------
  // puck: a short cylinder seen tumbling. face tilt phi, in-plane turn theta
  // ---------------------------------------------------------------------------

  function puckShape(cx, cy, theta, phi, R, seed) {
    const ry = Math.max(0.16, Math.abs(Math.cos(phi))) * R;
    const th = 34 * Math.abs(Math.sin(phi)) + 6;
    const c = Math.cos(theta), s = Math.sin(theta);
    const T = (x, y) => [cx + x * c - y * s, cy + x * s + y * c];
    const face = [], body = [], rim = [];
    const N = 56;
    for (let i = 0; i < N; i++) {
      const a = (i / N) * TAU;
      const rr = 1 + 0.035 * LIB.noise1(i * 0.45, seed);
      face.push(T(Math.cos(a) * R * rr, Math.sin(a) * ry * rr - th / 2));
    }
    // silhouette = face ellipse swept down by the thickness
    for (let i = 0; i <= N / 2; i++) {
      const a = (i / (N / 2)) * Math.PI;
      const rr = 1 + 0.035 * LIB.noise1(i * 0.9 + 3, seed);
      body.push(T(Math.cos(a) * R * rr, Math.sin(a) * ry * rr + th / 2));
    }
    for (let i = N / 2; i <= N; i++) {
      const a = (i / (N / 2)) * Math.PI;
      body.push(T(Math.cos(a) * R, Math.sin(a) * ry - th / 2));
    }
    for (let i = 0; i <= N / 2; i++) {
      const a = (i / (N / 2)) * Math.PI;
      rim.push(T(Math.cos(a) * R, Math.sin(a) * ry - th / 2));
    }
    return { face, body, rim, ry, th };
  }

  function drawPuck(ctx, Z, P, cx, cy, theta, phi, seed, squash = 0) {
    const sh = puckShape(cx, cy, theta, phi, PUCK_R * (1 + squash * 0.1), seed);
    ink(ctx, Z, sh.body, { closed: true, width: 4, fill: LIB.mix(P.grounds, P.ink, 0.25), seed: seed + 1, wobble: 1.5 });
    hatchZ(ctx, Z, sh.body, { spacing: 6, width: 1.4, color: P.ink, alpha: 0.7, seed: seed + 2, density: (x, y) => sstep(-20, 90, (x - cx) * 0.5 + (y - cy) * 0.9) });
    ink(ctx, Z, sh.face, { closed: true, width: 3, fill: P.grounds, seed: seed + 3, wobble: 1.2 });
    // the face: fine grounds texture, the shower-screen ring, a few lighter specks
    stippleZ(ctx, Z, sh.face, { spacing: 6.5, r: [0.9, 1.9], color: P.beanMedium, alpha: 0.9, seed: seed + 4, density: 0.85 });
    stippleZ(ctx, Z, sh.face, { spacing: 9, r: [0.8, 1.6], color: P.ink, alpha: 0.7, seed: seed + 5, density: 0.6 });
    const ring = puckShape(cx, cy, theta, phi, PUCK_R * 0.72, seed + 9).face;
    ink(ctx, Z, ring, { closed: true, width: 1.6, color: P.beanMedium, alpha: 0.8, seed: seed + 6, wobble: 1 });
    hatchZ(ctx, Z, sh.face, { spacing: 8, width: 1.3, color: P.ink, alpha: 0.6, seed: seed + 7, density: (x, y) => sstep(10, 110, (x - cx) * 0.6 + (y - cy) * 0.8) });
  }

  // ---------------------------------------------------------------------------
  // camera
  // ---------------------------------------------------------------------------

  function camAt(t) {
    if (t <= B_ZOOM) return { zoom: 1, x: 540, y: 960, e: 0 };
    const u = clamp((t - B_ZOOM) / (Z_FRAMES * FR));
    const e = LIB.ease.outExpo(u);
    const zoom = Math.pow(ZMAX, e);
    const sy = lerp(620, 900, e);
    return { zoom, x: TGT[0], y: TGT[1] - (sy - 960) / zoom, e, sy };
  }

  // ---------------------------------------------------------------------------
  // scene
  // ---------------------------------------------------------------------------

  FILM.scene({
    id: ID,
    draw(ctx, tIn, info) {
      const L = info.lib, P = L.pal, E = L.ease;
      const dur = info.dur;
      let t = clamp(tIn, 0, dur);
      const tf = Math.round(t * 24) / 24;
      if (Math.abs(t - tf) < 1e-4) t = tf + 1e-7;
      const tw = L.onTwos(t);
      const bi = L.boil(info.T);
      const G = geo();
      const hit = (a, frames, e, lead = 1) => {
        if (t < a) return 0;
        const u = clamp((t - a) / (frames * FR) + lead / frames);
        return e ? e(u) : u;
      };
      const drawing = (a) => Math.floor((t - a) * 12 + 1e-6);

      const cam = camAt(t);
      const zk = cam.zoom;
      const Z = {
        k: zk,
        v: [cam.x - 540 / zk, cam.y - 960 / zk, cam.x + 540 / zk, cam.y + 960 / zk],
      };

      // ---- 1 stripes ---------------------------------------------------------------
      L.stripes(ctx, { colors: [P.stripeCream, P.stripeYellow], width: 140, angle: -0.52, offset: 8 * info.T, seed: sd('stripes') & 0xffff });

      // ST draws the static world (cached per boil drawing while the camera is locked), DY the
      // moving parts (worm, grounds, puck, seedling)
      const world = (ctx, Z, ST, DY) => {
        const zk = Z.k;
        // ---- 2 back of the tree ---------------------------------------------------------
        if (ST) {
        for (const lf of G.back) drawLeaf(ctx, Z, P, lf.g, lf.seed, { color: L.mix(P.leafCoffee, P.leafDeep, 0.35) });
        drawTube(ctx, Z, P, G.branchR, sd('brR'));
        drawTube(ctx, Z, P, G.branchLow, sd('brLo'));
        drawTube(ctx, Z, P, G.branchLowL, sd('brLoL'));
        // trunk with lenticels
        drawTube(ctx, Z, P, G.trunk, sd('trunk'), { width: 4 });
        if (visB(Z, G.trunk.b)) {
          const lent = new Path2D();
          const rr = L.rng(sd('lent'));
          for (let i = 0; i < 70; i++) {
            const y = rr.range(-100, 1240), x = 760 + rr.range(-14, 14) - (y - 600) * 0.008;
            const w = rr.range(3, 6) / zk * Math.min(zk, 3);
            lent.moveTo(x - w, y);
            lent.lineTo(x + w, y);
          }
          ctx.save();
          ctx.strokeStyle = P.barkDeep;
          ctx.lineWidth = 1.6 / zk;
          ctx.lineCap = 'round';
          ctx.stroke(lent);
          ctx.restore();
        }
        }

        // ---- 3 soil cutaway ----------------------------------------------------------------
        if (Z.v[3] > SOIL_Y - 20) {
          if (ST) {
          ink(ctx, Z, G.soil, { closed: true, width: 0.01, fill: P.soil, seed: sd('soilfill'), wobble: 0 });
          hatchZ(ctx, Z, G.soil, { spacing: 8, width: 1.4, color: P.soilDeep, alpha: 0.8, seed: sd('soilh'), tone: 0.8, layers: 3, crossSpacing: 7, density: (x, y) => 0.35 + 0.65 * sstep(SOIL_Y, 1900, y) }, true);
          stippleZ(ctx, Z, G.soil, { spacing: 9, r: [1, 2.2], color: P.soilDeep, alpha: 0.8, seed: sd('soilst'), density: 0.5 });
          stippleZ(ctx, Z, G.soil, { spacing: 14, r: [1, 2], color: P.tan, alpha: 0.6, seed: sd('soilst2'), density: 0.35 });
          // roots
          for (let i = 0; i < G.roots.length; i++) {
            const rt = G.roots[i];
            ink(ctx, Z, rt.pts, { width: rt.w * 1.6, color: P.barkDeep, seed: sd('root', i), taper: [2, 40] });
          }
          // stones
          for (let i = 0; i < G.stones.length; i++) {
            const [x, y, a, b, rot, k] = G.stones[i];
            const pts = L.ellipsePts(x, y, a, b, 16, rot);
            ink(ctx, Z, pts, { closed: true, width: 2, fill: k ? P.tan : P.paperDeep, seed: sd('stone', i), wobble: 1.5 });
            hatchZ(ctx, Z, pts, { spacing: 4, width: 1, color: P.inkSoft, alpha: 0.7, seed: sd('stoneh', i), density: (px, py) => sstep(-2, a * 0.6, (px - x) + (py - y)) });
          }
          }
          // earthworm, rose, curling on twos
          if (DY) {
            const ph = Math.floor(tw * 12) * 0.5;
            const wp = [];
            for (let i = 0; i <= 26; i++) {
              const u = i / 26;
              const a = u * 4.2 + 0.4 * Math.sin(ph + u * 3);
              const rad = (38 - u * 22) * 1.8;
              wp.push([230 + Math.cos(a) * rad + u * 46, 1560 + Math.sin(a) * rad * 0.7]);
            }
            ink(ctx, Z, wp, { width: 18, color: P.ink, seed: sd('worm'), taper: [8, 8], swell: 0, boil: false });
            ink(ctx, Z, wp, { width: 12.5, color: P.rose, seed: sd('worm'), taper: [7, 7], swell: 0, boil: false });
            const segs = new Path2D();
            for (let i = 2; i < wp.length - 2; i += 2) {
              const a = wp[i - 1], b = wp[i + 1];
              const tx = b[0] - a[0], ty = b[1] - a[1], tl = Math.hypot(tx, ty) || 1;
              segs.moveTo(wp[i][0] - (ty / tl) * 6, wp[i][1] + (tx / tl) * 6);
              segs.lineTo(wp[i][0] + (ty / tl) * 6, wp[i][1] - (tx / tl) * 6);
            }
            ctx.save();
            ctx.strokeStyle = P.inkSoft;
            ctx.globalAlpha = 0.8;
            ctx.lineWidth = 1.2 / zk;
            ctx.stroke(segs);
            ctx.restore();
          }
          // soil surface line and litter
          if (ST) {
            ink(ctx, Z, G.surf, { width: 4, seed: sd('surfline'), taper: [0, 0] });
            for (const lt of G.litter) drawLeaf(ctx, Z, P, lt.g, lt.seed, { color: P.tan, width: 2 });
          }
          // grounds mixing into the soil after the landing: crumbs sink over 9 frames, then rest
          if (DY && t >= B_LAND) {
            const k = hit(B_LAND, 9, E.outCubic);
            const cp = new Path2D(), cp2 = new Path2D();
            for (const c of G.crumbs) {
              const x = lerp(c[0], c[2], k), y = lerp(c[1], c[3], k);
              const rad = c[4] * (1 - 0.25 * k);
              const pth = c[5] ? cp2 : cp;
              pth.moveTo(x + rad, y);
              pth.arc(x, y, rad, 0, TAU);
            }
            ctx.save();
            ctx.fillStyle = P.grounds;
            ctx.fill(cp);
            ctx.fillStyle = P.beanMedium;
            ctx.fill(cp2);
            ctx.restore();
            // what is left on the surface: a low crumbly mound
            const mk = 1 - 0.7 * k;
            const mound = [];
            for (let i = 0; i <= 24; i++) {
              const u = i / 24;
              const x = PUCK1[0] - 150 + u * 300;
              const h = Math.sin(Math.PI * u) * 34 * mk * (1 + 0.25 * L.noise1(u * 9, sd('mound')));
              mound.push([x, SOIL_Y + 2 - h]);
            }
            mound.push([PUCK1[0] + 150, SOIL_Y + 8], [PUCK1[0] - 150, SOIL_Y + 8]);
            ink(ctx, Z, mound, { closed: true, width: 2.5, fill: P.grounds, seed: sd('moundI'), wobble: 1.5 });
            stippleZ(ctx, Z, mound, { spacing: 6, r: [0.8, 1.7], color: P.beanMedium, alpha: 0.9, seed: sd('moundS'), density: 0.7 });
          }
        }

        // ---- 4 the lateral branch, leaves and clusters -------------------------------------
        if (ST) {
        drawTube(ctx, Z, P, G.branch, sd('branch'));
        // the leaf behind the cluster first, front leaves after the clusters
        for (let i = 0; i < G.leaves.length; i++) {
          const lf = G.leaves[i];
          const upward = lf.g.ang < 0;
          if (upward) drawLeaf(ctx, Z, P, lf.g, lf.seed);
        }
        const clusterDraw = (list, key) => {
          list.forEach((c, i) => drawCherry(ctx, Z, P, c.p[0], c.p[1], c.p[2], c.p[2] * 1.1, c.kind, sd('ch', key, i), { width: 2.5, spacing: 6 }));
        };
        clusterDraw(G.clusterLL, 'LL');
        clusterDraw(G.clusterL, 'L');
        clusterDraw(G.clusterN0, 'N0');
        // target cluster: neighbours, then the hero cherry on top
        G.cluster.forEach((c, i) => drawCherry(ctx, Z, P, c.p[0], c.p[1], c.p[2], c.p[2] * 1.1, c.kind, sd('tc', i), { width: 3, spacing: 7 }));
        drawCherry(ctx, Z, P, TGT[0], TGT[1], TRX, TRY, 'red', sd('target'), {
          width: lerp(3, 5, cam.e),
          spacing: 8,
          wobble: 1.2,
          dew: [540 + 110 / 9, 620 - 140 / 9, 18 / 9],
        });
        for (let i = 0; i < G.leaves.length; i++) {
          const lf = G.leaves[i];
          if (!(lf.g.ang < 0)) drawLeaf(ctx, Z, P, lf.g, lf.seed);
        }

        // ---- 5 knock box edge (top left) ----------------------------------------------------
        if (Z.v[0] < 330 && Z.v[1] < 380) {
          const box = [[-40, 300], [210, 300], [222, 312], [222, 420], [-40, 420]];
          ink(ctx, Z, box, { closed: true, width: 4, fill: P.wood, seed: sd('box'), smooth: false, wobble: 1 });
          hatchZ(ctx, Z, [[-40, 330], [222, 330], [222, 420], [-40, 420]], { angle: 0.02, spacing: 6, width: 1.3, color: P.barkDeep, alpha: 0.75, length: [30, 90], seed: sd('boxh'), angleJitter: 0.01 });
          const inner = [[-40, 300], [200, 300], [200, 318], [-40, 318]];
          fillPoly(ctx, inner, P.ink, 0.85);
          // the knock bar: a rubber-sleeved rod across the box mouth
          ink(ctx, Z, [[-40, 296], [214, 288]], { width: 22, color: P.ink, seed: sd('bar'), taper: [0, 4], swell: 0 });
          ink(ctx, Z, [[-40, 291], [210, 283]], { width: 5, color: P.steelDeep, seed: sd('bar2'), taper: [0, 4], swell: 0 });
          ink(ctx, Z, [[214, 278], [214, 300]], { width: 3, seed: sd('barEnd'), taper: 0 });
          // a few grounds left on the bar edge
          const g0 = new Path2D();
          const rr = L.rng(sd('bargr'));
          for (let i = 0; i < 26; i++) {
            const x = rr.range(150, 230), y = rr.range(266, 282);
            const rad = rr.range(1.2, 3);
            g0.moveTo(x + rad, y);
            g0.arc(x, y, rad, 0, TAU);
          }
          ctx.fillStyle = P.grounds;
          ctx.fill(g0);
        }

        }

        // ---- 6 puck and seedling ----------------------------------------------------------------
        if (DY && t < B_LAND + 2 * FR && Z.v[3] > 200) {
          const u = clamp(tw / B_LAND);
          const x = lerp(PUCK0[0], PUCK1[0], u);
          const y = PUCK0[1] + (PUCK1[1] - 30 - PUCK0[1]) * u * u;
          const theta = -0.35 + u * 2.3 * Math.PI * 0.5;
          const phi = 0.9 + u * 2.6;
          if (t < B_LAND) drawPuck(ctx, Z, P, x, y, theta, phi, sd('puck'));
          else {
            // impact drawing (one held drawing): the puck flattens and splits
            drawPuck(ctx, Z, P, PUCK1[0], SOIL_Y - 20, 0.04, 1.42, sd('puck'), 0.6);
            const crack = new Path2D();
            crack.moveTo(PUCK1[0] - 40, SOIL_Y - 30);
            crack.lineTo(PUCK1[0] - 6, SOIL_Y - 16);
            crack.lineTo(PUCK1[0] + 30, SOIL_Y - 28);
            crack.moveTo(PUCK1[0] - 6, SOIL_Y - 16);
            crack.lineTo(PUCK1[0] + 4, SOIL_Y - 4);
            ctx.save();
            ctx.strokeStyle = P.ink;
            ctx.lineWidth = 2.5;
            ctx.stroke(crack);
            ctx.restore();
          }
        }
        if (DY && t >= B_SHOOT && Z.v[3] > SOIL_Y - 120) {
          // soldier stage: the hooked stem lifts the seed in its parchment
          const gstep = Math.min(3, drawing(B_SHOOT));
          const hgt = [0.45, 0.8, 1.06, 1][gstep];
          const bx = 548, by = SOIL_Y + 2;
          const h = 112 * hgt;
          const stem = [[bx, by + 6], [bx + 1, by - h * 0.5], [bx + 4, by - h * 0.92], [bx + 14, by - h * 1.02], [bx + 22, by - h * 0.86]];
          ink(ctx, Z, stem, { width: 8, color: P.ink, seed: sd('stem'), taper: [2, 6], swell: 0 });
          ink(ctx, Z, stem, { width: 4.5, color: P.leafLight, seed: sd('stem'), taper: [2, 6], swell: 0 });
          const seedP = L.ellipsePts(bx + 25, by - h * 0.86 + 12, 11, 15, 18, -0.4);
          ink(ctx, Z, seedP, { closed: true, width: 2, fill: P.parchment, seed: sd('seed'), wobble: 0.4, taper: [2, 4] });
          // a crack in the soil around the stem
          ink(ctx, Z, [[bx - 18, by + 2], [bx - 6, by - 3], [bx + 8, by + 1], [bx + 20, by - 2]], { width: 2, seed: sd('crack'), taper: [4, 4] });
        }
      };

      if (zk <= 1) {
        // locked camera: the static world comes from a cache, one canvas per boil drawing (3 cycle)
        BOIL = bi % 3;
        const S = FILM.S || 1;
        const img = L.cached(['grounds-to-soil-static', S, BOIL].join('|'), () => {
          const c = FILM.makeCanvas(Math.round(1080 * S), Math.round(1920 * S));
          const g = c.getContext('2d');
          g.setTransform(S, 0, 0, S, 0, 0);
          world(g, Z, true, false);
          return c;
        });
        ctx.drawImage(img, 0, 0, 1080, 1920);
        BOIL = bi;
        world(ctx, Z, false, true);
      } else {
        BOIL = bi;
        L.camera(ctx, { x: cam.x, y: cam.y, zoom: zk }, () => world(ctx, Z, true, true));
      }

      // ---- 7 overlays (screen space) ---------------------------------------------------------
      const toS = (x, y) => [540 + (x - cam.x) * zk, 960 + (y - cam.y) * zk];
      // annBlue dashed fall trajectory, drawing on behind the puck at 24 fps
      if (zk < 1.5) {
        const u = clamp(t / B_LAND);
        const pts = [];
        const n = 40;
        for (let i = 0; i <= n; i++) {
          const v = (i / n) * u * 0.8;
          pts.push(toS(lerp(PUCK0[0], PUCK1[0], v), PUCK0[1] + (PUCK1[1] - 30 - PUCK0[1]) * v * v));
        }
        const fade = 1 - clamp((t - 1.2) / 0.3);
        if (pts.length > 1 && fade > 0) {
          ctx.save();
          ctx.globalAlpha = fade;
          ctx.strokeStyle = P.annBlue;
          ctx.lineWidth = 2.5;
          ctx.lineCap = 'round';
          ctx.setLineDash([14, 10]);
          ctx.beginPath();
          L.tracePath(ctx, pts, false);
          ctx.stroke();
          ctx.setLineDash([]);
          // arrowhead at the leading end
          const a = pts[pts.length - 1], b = pts[Math.max(0, pts.length - 3)];
          const ang = Math.atan2(a[1] - b[1], a[0] - b[0]);
          if (u > 0.08) {
            ctx.beginPath();
            ctx.moveTo(a[0] + Math.cos(ang) * 10, a[1] + Math.sin(ang) * 10);
            ctx.lineTo(a[0] + Math.cos(ang + 2.5) * 12, a[1] + Math.sin(ang + 2.5) * 12);
            ctx.lineTo(a[0] + Math.cos(ang - 2.5) * 12, a[1] + Math.sin(ang - 2.5) * 12);
            ctx.closePath();
            ctx.fillStyle = P.annBlue;
            ctx.fill();
          }
          // motion ticks beside the falling puck
          ctx.restore();
        }
      }
      // annYellow ring where it lands (expands outExpo, fades over 12 frames)
      if (t >= B_LAND && zk < 1.5) {
        const k = hit(B_LAND, 12, E.outExpo);
        const a = 1 - hit(B_LAND + 3 * FR, 9);
        if (a > 0) {
          const c = toS(PUCK1[0], SOIL_Y - 10);
          ctx.save();
          ctx.strokeStyle = P.annYellow;
          ctx.globalAlpha = a;
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.ellipse(c[0], c[1], 120 + 110 * k, 34 + 40 * k, 0, 0, TAU);
          ctx.stroke();
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.ellipse(c[0], c[1], 90 + 70 * k, 24 + 26 * k, 0, 0, TAU);
          ctx.stroke();
          ctx.restore();
        }
      }
      // annYellow dashed ring around the target cluster after the shoot: the eye goes up
      if (t >= B_SHOOT && cam.e < 0.6) {
        const k = hit(B_SHOOT, 6, E.outExpo);
        const fade = 1 - clamp(cam.e / 0.4);
        const c = toS(TGT[0], TGT[1] - 4);
        ctx.save();
        ctx.strokeStyle = P.annYellow;
        ctx.globalAlpha = fade;
        ctx.lineWidth = 2.5;
        ctx.setLineDash([14, 10]);
        ctx.lineDashOffset = -t * 40;
        ctx.beginPath();
        ctx.arc(c[0], c[1], (70 + 40 * (1 - k)) * zk, -Math.PI / 2, -Math.PI / 2 + TAU * k);
        ctx.stroke();
        ctx.restore();
      }
      // annMagenta target ring on the beat, riding the zoom and fading over 10 frames
      if (t >= B_ZOOM) {
        const k = hit(B_ZOOM, 3, E.outBack);
        const a = 1 - hit(B_ZOOM + 2 * FR, 8, E.inQuad, 0);
        if (a > 0.003) {
          const c = toS(TGT[0], TGT[1]);
          const rr = (TRX * 1.55 + 6) * zk * k;
          ctx.save();
          ctx.strokeStyle = P.annMagenta;
          ctx.globalAlpha = a;
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.ellipse(c[0], c[1], rr, rr * 1.08, 0, 0, TAU);
          ctx.stroke();
          ctx.lineWidth = 2;
          ctx.beginPath();
          for (let i = 0; i < 4; i++) {
            const an = (i * Math.PI) / 2 + Math.PI / 4;
            ctx.moveTo(c[0] + Math.cos(an) * rr * 1.08, c[1] + Math.sin(an) * rr * 1.16);
            ctx.lineTo(c[0] + Math.cos(an) * (rr * 1.08 + 18), c[1] + Math.sin(an) * (rr * 1.16 + 18));
          }
          ctx.stroke();
          ctx.restore();
        }
      }
    },
  });
})();

</script>
<script>
// ---- src/scenes/21-bean-loop.js
// 21 bean-loop : Back to the seed.  T 42.75 to 45.00 (54 frames), schematic, hard cut from 20.
// A near-duplicate of 02's finished frame, fully drawn on frame 0: the G2 cherry guide oval, the G1 bean
// (double outline, crease, endosperm lattice, embryo), the three network nodes with their lines, the bracket
// and tick scales, and the progress glyph with all four arcs lit. The G1 construction block, the node glyphs
// and every wobble seed are copied from 02 (seeded from 02's id) so the drawing matches it line for line.
// The wordmark `café` (the film's only text) fades in at T 43.50; the embryo pulses at T 44.25; then the
// network, measurement, lattice, construction, glyph and wordmark fade out, leaving only the G2 oval (which
// firms up into a cherry outline with its calyx and gloss) around the G1 bean outline, so the loop seam into
// 01 frame 0 (the inked cherry on G2) reads as a match cut.
//
// Layers, back to front:
//   1 lib.blueprint (as 02)
//   2 guide geometry (as 02's finished frame), fading on the last beat except the r 420 circle
//   3 G2 cherry oval, brightening into the loop seam
//   4 measurement: bracket x 790, tick scales (fade)
//   5 the G1 bean: lattice (fades), double outline, crease, embryo outline
//   6 network nodes (fade)
//   7 embryo glow (pulse at T 44.25, then fades)
//   8 progress glyph (allLit) and the wordmark
(function () {
  'use strict';

  const ID = 'bean-loop';
  const REF = 'bean-blueprint'; // every seed comes from 02 so the wobble and lattice match its frame
  const LIB = FILM.lib;
  const TAU = Math.PI * 2;
  const DEG = Math.PI / 180;
  const FR = 1 / 24;

  const clamp = (v, lo = 0, hi = 1) => (v < lo ? lo : v > hi ? hi : v);
  const lerp = (a, b, u) => a + (b - a) * u;
  const sstep = (a, b, x) => {
    const u = clamp((x - a) / (b - a));
    return u * u * (3 - 2 * u);
  };
  const sd = (...k) => LIB.hash(REF, ...k) & 0x7fffffff;
  void ID;
  // ===========================================================================
  // G1 BEAN CONSTRUCTION — canonical (docs/storyboard.md, Shared geometry G1).
  // Self-contained: copy this whole block to draw G1 on the same pixels (21 does).
  //   Upright superellipse |dx/170|^2.3 + |dy/240|^2.3 = 1 about (540, 900), 96 points from the top end
  //   running clockwise, top end 6 percent narrower (dx *= 1 - 0.06 * (1 - dy/240) / 2), then rotated
  //   -15 degrees (top leans left) about (540, 900).
  //   g1Outline(inset, scale)  closed outline; inset shrinks both radii (the 9 px inner line uses inset 9);
  //                            scale scales about (540, 900) (1 = G1)
  //   g1Crease()               crease centreline, smooth, top to bottom (rotated)
  //   g1CreaseWidth(u)         groove width along it: 12 px, tapering to 3 px at both ends
  //   g1Silverskin()           the silverskin line inside the groove, (546, 700) to (538, 1100) before rotation
  //   G1_EMBRYO                embryo centre, (548, 1110) before rotation -> (602, 1101)
  //   g1Rot(x, y) / g1Unrot(x, y)  rotate a pre-rotation point onto the frame, and back
  // ===========================================================================
  const G1 = { cx: 540, cy: 900, a: 170, b: 240, n: 2.3, taper: 0.06, rot: -15 * Math.PI / 180, N: 96 };
  const G1_COS = Math.cos(G1.rot), G1_SIN = Math.sin(G1.rot);
  function g1Rot(x, y) {
    const dx = x - G1.cx, dy = y - G1.cy;
    return [G1.cx + dx * G1_COS - dy * G1_SIN, G1.cy + dx * G1_SIN + dy * G1_COS];
  }
  function g1Unrot(x, y) {
    const dx = x - G1.cx, dy = y - G1.cy;
    return [G1.cx + dx * G1_COS + dy * G1_SIN, G1.cy - dx * G1_SIN + dy * G1_COS];
  }
  // half-width of the upright bean at height dy (pre-rotation, dy in -240..240), with the top taper
  function g1HalfWidth(dy, inset) {
    const a = G1.a - (inset || 0), b = G1.b - (inset || 0);
    const v = Math.min(1, Math.abs(dy) / b);
    const w = a * Math.pow(Math.max(0, 1 - Math.pow(v, G1.n)), 1 / G1.n);
    return w * (1 - (G1.taper * (1 - dy / G1.b)) / 2);
  }
  function g1Outline(inset, scale) {
    const a = G1.a - (inset || 0), b = G1.b - (inset || 0), s = scale || 1, e = 2 / G1.n;
    const out = [];
    for (let i = 0; i < G1.N; i++) {
      const th = -Math.PI / 2 + (i / G1.N) * Math.PI * 2;
      const c = Math.cos(th), sn = Math.sin(th);
      let dx = a * Math.sign(c) * Math.pow(Math.abs(c), e);
      const dy = b * Math.sign(sn) * Math.pow(Math.abs(sn), e);
      dx *= 1 - (G1.taper * (1 - dy / G1.b)) / 2;
      const p = g1Rot(G1.cx + dx * s, G1.cy + dy * s);
      out.push(p);
    }
    return out;
  }
  const G1_CREASE_RAW = [[548, 682], [531, 750], [536, 826], [552, 900], [547, 976], [530, 1052], [538, 1118]];
  function g1Crease() {
    return LIB.smoothPts(G1_CREASE_RAW.map((p) => g1Rot(p[0], p[1])), false, 5);
  }
  const g1CreaseWidth = (u) => 3 + 9 * Math.pow(Math.sin(Math.PI * Math.min(1, Math.max(0, u))), 0.55);
  function g1Silverskin() {
    // the crease centreline between y 700 and 1100 (pre-rotation), nudged to the listed end points
    const raw = LIB.smoothPts(G1_CREASE_RAW, false, 5).filter((p) => p[1] >= 700 && p[1] <= 1100);
    raw[0] = [546, 700];
    raw[raw.length - 1] = [538, 1100];
    return raw.map((p) => g1Rot(p[0], p[1]));
  }
  const G1_EMBRYO = g1Rot(548, 1110);
  // ===================== end of the G1 construction block =====================

  // G2 cherry guide oval
  const G2 = { x: 540, y: 900, rx: 260, ry: 290 };

  // network nodes (100 px glyphs)
  const NODES = [
    { x: 180, y: 520, kind: 'cells' },
    { x: 180, y: 1340, kind: 'seedling' },
    { x: 880, y: 1340, kind: 'water' },
  ];


  // ---------------------------------------------------------------------------
  // Progress glyph: canonical, copied verbatim from docs/storyboard.md.
  function progressGlyph(ctx, L, stage, u, T, allLit) {
    const P = L.pal, cx = 900, cy = 300, r = 46, gap = 6 * Math.PI / 180;
    const q = Math.PI / 2, pop = L.clamp(u * 6);
    ctx.save();
    ctx.lineCap = 'round';
    ctx.globalAlpha = 0.5; ctx.strokeStyle = P.lavender; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(cx, cy, r + 14, 0, Math.PI * 2); ctx.stroke();
    for (let i = 0; i < 4; i++) {
      const a0 = -q + i * q + gap / 2, a1 = a0 + q - gap;
      const past = allLit || i < stage, cur = !allLit && i === stage;
      ctx.globalAlpha = past ? 0.6 : 0.18;
      ctx.strokeStyle = P.lavender; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(cx, cy, r, a0, a1); ctx.stroke();
      if (cur || allLit) {
        const k = allLit ? 1 : L.clamp(u);
        const ae = a0 + (a1 - a0) * k;
        ctx.globalAlpha = 1; ctx.strokeStyle = P.lineWhite; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.arc(cx, cy, r, a0, ae); ctx.stroke();
        if (cur) L.glowDot(ctx, cx + Math.cos(ae) * r, cy + Math.sin(ae) * r, 4 + 2 * pop, { rays: 0, glow: 3.5, intensity: 0.8 });
      }
    }
    ctx.globalAlpha = 0.7; ctx.fillStyle = P.lineWhite;
    ctx.beginPath(); ctx.arc(cx, cy, 3, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  // ---------------------------------------------------------------------------
  // drawing helpers
  // ---------------------------------------------------------------------------

  function wobPts(L, pts, seed, amp, bi, closed) {
    const n = pts.length;
    const out = new Array(n);
    let s = 0;
    const sdv = (seed + bi * 7919) | 0;
    for (let i = 0; i < n; i++) {
      const p = pts[i];
      if (i > 0) s += Math.hypot(p[0] - pts[i - 1][0], p[1] - pts[i - 1][1]);
      const a = pts[i > 0 ? i - 1 : closed ? n - 1 : 0], b = pts[i < n - 1 ? i + 1 : closed ? 0 : n - 1];
      const tx = b[0] - a[0], ty = b[1] - a[1];
      const tl = Math.hypot(tx, ty) || 1;
      const d = amp * L.noise1(s * 0.018, sdv);
      out[i] = [p[0] - (ty / tl) * d, p[1] + (tx / tl) * d];
    }
    // keep a closed loop closed: blend the last points back onto the first
    if (closed && n > 8) {
      for (let k = 0; k < 6; k++) {
        const w = (6 - k) / 7;
        const j = n - 1 - k;
        out[j] = [lerp(out[j][0], pts[j][0] + (out[0][0] - pts[0][0]), w), lerp(out[j][1], pts[j][1] + (out[0][1] - pts[0][1]), w)];
      }
    }
    return out;
  }

  function addPoly(path, pts, closed) {
    if (pts.length < 2) return;
    path.moveTo(pts[0][0], pts[0][1]);
    for (let i = 1; i < pts.length; i++) path.lineTo(pts[i][0], pts[i][1]);
    if (closed) path.closePath();
  }

  function stroke(ctx, path, color, alpha, width, dash) {
    if (alpha <= 0.002) return;
    ctx.save();
    ctx.strokeStyle = color;
    ctx.globalAlpha *= alpha;
    ctx.lineWidth = width;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    if (dash) ctx.setLineDash(dash);
    ctx.stroke(path);
    ctx.restore();
  }

  function cumLen(pts, closed) {
    const c = new Float64Array(pts.length + 1);
    for (let i = 1; i <= pts.length; i++) {
      const a = pts[i - 1], b = pts[i % pts.length];
      c[i] = c[i - 1] + (i < pts.length || closed ? Math.hypot(b[0] - a[0], b[1] - a[1]) : 0);
    }
    return c;
  }

  // the first `frac` of a polyline (closed loops include the closing segment)
  function slicePts(pts, frac, closed) {
    const c = cumLen(pts, closed);
    const total = c[closed ? pts.length : pts.length - 1];
    const want = total * clamp(frac);
    const out = [pts[0]];
    const m = closed ? pts.length : pts.length - 1;
    for (let i = 1; i <= m; i++) {
      const b = pts[i % pts.length];
      if (c[i] <= want) out.push(b);
      else {
        const a = pts[i - 1];
        const u = (want - c[i - 1]) / (c[i] - c[i - 1] || 1);
        out.push([lerp(a[0], b[0], u), lerp(a[1], b[1], u)]);
        break;
      }
    }
    return out;
  }

  function pointAt(pts, frac) {
    const s = slicePts(pts, frac, false);
    return s[s.length - 1];
  }

  function ovalPts(cx, cy, rx, ry, n) {
    const out = [];
    for (let i = 0; i < n; i++) {
      const a = -Math.PI / 2 + (i / n) * TAU;
      out.push([cx + Math.cos(a) * rx, cy + Math.sin(a) * ry]);
    }
    return out;
  }
