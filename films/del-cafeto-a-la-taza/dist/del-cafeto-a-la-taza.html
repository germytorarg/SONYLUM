      const hl = new Path2D();
      hl.moveTo(cx + Math.cos(ang) * len * 0.1 - nx * s * wid * 0.15, cy + Math.sin(ang) * len * 0.1 - ny * s * wid * 0.15);
      hl.lineTo(cx + Math.cos(ang) * len * 0.35 - nx * s * wid * 0.15, cy + Math.sin(ang) * len * 0.35 - ny * s * wid * 0.15);
      strokePath(ctx, hl, P.white, 0.8, 1.6);
    };
    {
      const lb = H.index;
      const iT = 6;
      const dors = lb.N[iT][1] < 0 ? 1 : -1;
      nail(lb, iT, dors, 30, 15, 0, 31);
      const tb = H.thumb;
      const iTT = 7;
      const dT = tb.N[iTT][1] > 0 ? 1 : -1;
      nail(tb, iTT, dT, 34, 20, 0, 32);
      const md = H.mid;
      nail(md, 3, md.N[3][0] < 0 ? 1 : -1, 16, 9, 0, 33);
    }
  }

  function drawBranch(ctx, L, P, G) {
    fillPoly(ctx, G.branchPoly, P.bark);
    L.hatch(ctx, G.branchPoly, { angle: 0.1, spacing: 5, width: 1.3, color: P.barkDeep, alpha: 0.9, length: [14, 44], seed: sd('brh'), density: (x, y) => sstep(-2, 12, y - branchY(x)) });
    L.inkPath(ctx, G.top, { width: 3.6, seed: sd('brT'), taper: [0, 0] });
    L.inkPath(ctx, G.bot, { width: 4.4, seed: sd('brB'), taper: [0, 0] });
    // bark flecks and node rings
    const fl = new Path2D();
    const r = L.rng(sd('fleck'));
    for (let i = 0; i < 46; i++) {
      const x = r.range(-20, 1100), y = branchY(x) + r.range(-8, 4);
      fl.moveTo(x, y);
      fl.lineTo(x + r.range(6, 14), y + r.range(-1, 1));
    }
    strokePath(ctx, fl, P.barkDeep, 0.8, 1.4);
    for (const nx of [110, 260, 410, 560, 710, 860, 1010]) {
      const ny = branchY(nx);
      L.inkPath(ctx, [[nx - 4, ny - 14], [nx + 2, ny], [nx - 3, ny + 13]], { width: 2.2, color: P.barkDeep, seed: sd('node', nx), taper: [3, 3] });
    }
  }

  // ---------------------------------------------------------------------------
  // basket
  // ---------------------------------------------------------------------------
  const RIM = { cx: 540, cy: 1360, rx: 380, ry: 80 };
  function basketRX(y) {
    return lerp(RIM.rx, 330, clamp((y - RIM.cy) / 560));
  }
  function drawBasketBack(ctx, L, P, bi) {
    // inner back wall seen over the heap: the upper half of the rim ellipse, woven texture
    const pts = [];
    for (let i = 0; i <= 48; i++) {
      const a = Math.PI + (i / 48) * Math.PI;
      pts.push([RIM.cx + Math.cos(a) * RIM.rx, RIM.cy + Math.sin(a) * RIM.ry]);
    }
    const inner = pts.concat([[RIM.cx + RIM.rx, RIM.cy + 40], [RIM.cx - RIM.rx, RIM.cy + 40]]);
    fillPoly(ctx, inner, L.mix(P.juteDeep, P.ink, 0.25));
    L.hatch(ctx, inner, { angle: -0.3, spacing: 7, width: 1.3, color: P.jute, alpha: 0.55, length: [10, 26], seed: sd('bkw') });
    L.hatch(ctx, inner, { angle: 0.35, spacing: 9, width: 1.2, color: P.ink, alpha: 0.5, length: [10, 26], seed: sd('bkw2') });
    L.inkPath(ctx, pts, { width: 4, seed: sd('backrim'), taper: [6, 6] });
    // back rim rope
    const rope = new Path2D();
    for (let i = 0; i < 60; i++) {
      const a = Math.PI + ((i + 0.5) / 60) * Math.PI;
      const x = RIM.cx + Math.cos(a) * RIM.rx, y = RIM.cy + Math.sin(a) * RIM.ry;
      rope.moveTo(x - 6, y + 7);
      rope.lineTo(x + 6, y - 7);
    }
    strokePath(ctx, rope, P.juteDeep, 0.9, 2.2);
  }
  function drawBasketFront(ctx, L, P, bi) {
    // body outline: front rim (lower half of the ellipse) down to the bottom of the frame
    const front = [];
    for (let i = 0; i <= 48; i++) {
      const a = Math.PI - (i / 48) * Math.PI;
      front.push([RIM.cx + Math.cos(a) * RIM.rx, RIM.cy + Math.sin(a) * RIM.ry]);
    }
    const body = [[RIM.cx - basketRX(1940), 1940]].concat(front).concat([[RIM.cx + basketRX(1940), 1940]]);
    fillPoly(ctx, body, P.jute);
    // weave: rows of over-under lozenges wrapped round the cylinder
    ctx.save();
    ctx.beginPath();
    LIB.tracePath(ctx, body, true);
    ctx.clip();
    const cells = new Path2D();
    const shade = new Path2D();
    const NC = 18;
    for (let j = 0; j < 22; j++) {
      const yA = RIM.cy + 24 + j * 28, yB = yA + 28;
      const rxA = basketRX(yA), rxB = basketRX(yB);
      const ryA = RIM.ry * (rxA / RIM.rx), ryB = RIM.ry * (rxB / RIM.rx);
      for (let i = 0; i < NC; i++) {
        const off = (j % 2) * 0.5;
        const f0 = (i + off) / NC, f1 = (i + off + 1) / NC;
        if (f0 >= 1) continue;
        const a0 = Math.PI - f0 * Math.PI, a1 = Math.PI - Math.min(1, f1) * Math.PI;
        const q = (a, ry, rx, y) => [RIM.cx + Math.cos(a) * rx, y + Math.sin(a) * ry];
        const pA0 = q(a0, ryA, rxA, yA), pA1 = q(a1, ryA, rxA, yA), pB0 = q(a0, ryB, rxB, yB), pB1 = q(a1, ryB, rxB, yB);
        const ins = 3;
        const mx = (pA0[0] + pA1[0] + pB0[0] + pB1[0]) / 4, my = (pA0[1] + pA1[1] + pB0[1] + pB1[1]) / 4;
        const sh = (p) => [p[0] + (mx - p[0]) * 0.12, p[1] + (my - p[1]) * (ins / 14)];
        const a = sh(pA0), b = sh(pA1), c = sh(pB1), d = sh(pB0);
        cells.moveTo((a[0] + d[0]) / 2, (a[1] + d[1]) / 2);
        cells.quadraticCurveTo(a[0], a[1], (a[0] + b[0]) / 2, (a[1] + b[1]) / 2 - 2);
        cells.quadraticCurveTo(b[0], b[1], (b[0] + c[0]) / 2, (b[1] + c[1]) / 2);
        cells.quadraticCurveTo(c[0], c[1], (c[0] + d[0]) / 2, (c[1] + d[1]) / 2 + 2);
        cells.quadraticCurveTo(d[0], d[1], (a[0] + d[0]) / 2, (a[1] + d[1]) / 2);
        // a shadow tick under each lozenge
        shade.moveTo(d[0] + 4, d[1] - 2);
        shade.lineTo(c[0] - 4, c[1] - 2);
      }
    }
    ctx.fillStyle = L.mix(P.jute, P.white, 0.12);
    ctx.fill(cells);
    strokePath(ctx, cells, P.juteDeep, 0.95, 1.8);
    strokePath(ctx, shade, P.ink, 0.35, 2.4);
    // vertical stakes peeking between the lozenges
    const stakes = new Path2D();
    for (let i = 1; i < NC * 2; i++) {
      const a = Math.PI - (i / (NC * 2)) * Math.PI;
      for (let y = RIM.cy + 30; y < 1930; y += 56) {
        const rx = basketRX(y), ry = RIM.ry * (rx / RIM.rx);
        const x = RIM.cx + Math.cos(a) * rx, yy = y + Math.sin(a) * ry;
        stakes.moveTo(x, yy + 2);
        stakes.lineTo(x, yy + 22);
      }
    }
    strokePath(ctx, stakes, P.juteDeep, 0.5, 1.4);
    ctx.restore();
    // form shading: the right side turns away from the light
    const rightSide = [[640, RIM.cy + 60], [RIM.cx + RIM.rx + 10, RIM.cy], [RIM.cx + basketRX(1940) + 10, 1940], [640, 1940]];
    ctx.save();
    ctx.beginPath();
    LIB.tracePath(ctx, body, true);
    ctx.clip();
    L.crossHatch(ctx, rightSide, {
      spacing: 7, width: 1.4, color: P.juteDeep, alpha: 0.75, length: [14, 40], seed: sd('bshade'), tone: 0.6, layers: 2,
      density: (x) => sstep(600, 900, x),
    });
    L.hatch(ctx, [[150, RIM.cy], [330, RIM.cy + 60], [330, 1940], [150, 1940]], { spacing: 10, width: 1.3, color: P.juteDeep, alpha: 0.5, length: [10, 30], seed: sd('bshadeL'), density: (x) => sstep(330, 170, x) * 0.7 });
    ctx.restore();
    // outline of the body sides
    L.inkPath(ctx, [[RIM.cx - RIM.rx, RIM.cy], [RIM.cx - basketRX(1700), 1700], [RIM.cx - basketRX(1950), 1950]], { width: 5, seed: sd('bodyL'), taper: [4, 0] });
    L.inkPath(ctx, [[RIM.cx + RIM.rx, RIM.cy], [RIM.cx + basketRX(1700), 1700], [RIM.cx + basketRX(1950), 1950]], { width: 5, seed: sd('bodyR'), taper: [4, 0] });
    // front rim: a thick twisted rope band
    const outer = front.map(([x, y]) => [x, y + 12]);
    const band = front.map(([x, y]) => [x, y - 12]).concat(outer.slice().reverse());
    fillPoly(ctx, band, P.jute);
    L.hatch(ctx, band, { spacing: 5, width: 1.3, color: P.juteDeep, alpha: 0.8, length: [6, 14], seed: sd('rimh'), density: (x) => 0.35 + 0.65 * sstep(500, 900, x) });
    const twist = new Path2D();
    for (let i = 0; i < 64; i++) {
      const a = Math.PI - ((i + 0.5) / 64) * Math.PI;
      const x = RIM.cx + Math.cos(a) * RIM.rx, y = RIM.cy + Math.sin(a) * RIM.ry;
      twist.moveTo(x - 7, y + 11);
      twist.quadraticCurveTo(x + 2, y + 2, x + 7, y - 11);
    }
    strokePath(ctx, twist, P.ink, 0.75, 2);
    L.inkPath(ctx, front.map(([x, y]) => [x, y - 12]), { width: 3.4, seed: sd('rimTop'), taper: [6, 6] });
    L.inkPath(ctx, outer, { width: 4.4, seed: sd('rimBot'), taper: [6, 6] });
    // waist cord: from the right of the rim up and out of frame toward the picker
    L.inkPath(ctx, [[RIM.cx + RIM.rx - 6, RIM.cy - 4], [980, 1320], [1040, 1300], [1110, 1290]], { width: 9, color: P.juteDeep, seed: sd('cordF'), taper: [0, 0] });
    L.inkPath(ctx, [[RIM.cx + RIM.rx - 6, RIM.cy - 10], [980, 1326], [1040, 1305], [1110, 1295]], { width: 2.4, seed: sd('cordI'), taper: [4, 0] });
    L.inkPath(ctx, [[RIM.cx + RIM.rx - 6, RIM.cy + 4], [980, 1336], [1040, 1316], [1110, 1306]], { width: 2.4, seed: sd('cordI2'), taper: [4, 0] });
  }

  // heap surface height (top of the mound) at x for a given lift
  const heapTopAt = (x, lift) => heapSurf(x) - lift;

  // ---------------------------------------------------------------------------
  // the scene
  // ---------------------------------------------------------------------------
  FILM.scene({
    id: ID,
    draw(ctx, tIn, info) {
      const L = info.lib, P = L.pal, E = L.ease;
      let t = clamp(tIn, 0, info.dur);
      const tF = Math.round(t * 24) / 24;
      if (Math.abs(t - tF) < 1e-4) t = tF + 1e-7;
      const tw = L.onTwos(t);
      const bi = L.boil(info.T);
      const G = geo(L);

      // ---- event state ---------------------------------------------------------
      // where each event's cherry sits on the branch
      const evPos = EV.map((e) => {
        const c = G.clusters[e.cl][e.ci];
        return [c.x, c.y];
      });
      // landing points on the heap: lift before each landing
      const landT = EV.map((e) => e.t + TWIST + FALL);
      const relT = EV.map((e) => e.t + TWIST);
      let landedBefore = 0;
      const landPt = EV.map((e) => {
        if (!e.pick) return null;
        const lift = landedBefore * HEAP_STEP;
        landedBefore++;
        return [e.land[0], heapTopAt(e.land[0], lift) + 6];
      });
      const landedNow = EV.filter((e, k) => e.pick && tw >= landT[k] - 1e-6).length;
      // heap lift: each landing raises the heap 14 px over two drawings
      let lift = 0;
      EV.forEach((e, k) => {
        if (!e.pick) return;
        const d = tw - landT[k];
        if (d >= -1e-6) lift += HEAP_STEP * (d < 1 / 12 - 1e-6 ? 0.6 : 1);
      });
      const picked = (k) => EV[k].pick && t >= EV[k].t - 1e-6;

      // ---- hand pose ------------------------------------------------------------
      // angle of the hand (local +x toward the wrist) as a function of target x
      const thetaAt = (x) => lerp(30, 70, clamp((x - 260) / 600)) * DEG;
      const pose = (() => {
        const tt = tw;
        // find the segment
        let k = 0;
        while (k < EV.length - 1 && tt >= EV[k + 1].t - 1e-6) k++;
        const e = EV[k];
        const p0 = evPos[k];
        const dt = tt - e.t;
        let x = p0[0], y = p0[1], th = thetaAt(p0[0]), twist = 0, open = e.pick ? 0 : 0.8;
        if (!e.pick) {
          // hover a little below and in front of the green cherry, fingers apart
          x += 10;
          y += 18;
        }
        if (dt < TWIST - 1e-6) {
          if (e.pick) twist = 15 * DEG * E.outCubic(clamp(dt / TWIST));
        } else {
          const next = k + 1 < EV.length ? EV[k + 1] : null;
          const tEnd = next ? next.t : info.dur;
          const u = clamp((dt - TWIST) / (tEnd - (e.t + TWIST)));
          const m = E.inOutCubic(u);
          twist = e.pick ? 15 * DEG * (1 - m) : 0;
          // fingers open on release, close as the next target arrives
          const openAmt = e.pick ? clamp((dt - TWIST + 1 / 12) / (2 / 12)) : 0.8;
          if (next) {
            const p1 = evPos[k + 1];
            let x1 = p1[0], y1 = p1[1];
            if (!next.pick) {
              x1 += 10;
              y1 += 18;
            }
            // arc a little downward between clusters (the hand drops back, then reaches)
            const far = Math.abs(x1 - x) > 150 ? 1 : 0.3;
            const sag = Math.sin(Math.PI * m) * 46 * far;
            const th1 = thetaAt(p1[0]);
            x = lerp(x, x1, m);
            y = lerp(y, y1, m) + sag;
            th = lerp(th, th1, m);
            const closeAmt = next.pick ? 1 - clamp((u - 0.55) / 0.4) : 0.8;
            open = Math.min(openAmt, closeAmt) * (next.pick ? 1 : 1);
            if (!next.pick) open = lerp(openAmt, 0.8, m);
          } else {
            // after the last pick: withdraw down-right
            x += 70 * m;
            y += 60 * m;
            open = openAmt;
          }
        }
        return { x, y, th: th + twist, open: clamp(open), k, dt };
      })();

      // ---- 1 stripes ---------------------------------------------------------------
      L.stripes(ctx, { colors: [P.stripeCream, P.stripeSage], width: 140, angle: -0.52, offset: 8 * info.T });

      // ---- 2 leaves and back rows -------------------------------------------------
      const isEvent = (k, i) => EV.some((e) => e.cl === k && e.ci === i);
      const isHeld = (k, i) => EV.some((e, j) => e.cl === k && e.ci === i && e.pick && t >= e.t - 1e-6);
      // leaves, the untouched cherries and the branch never change: one sprite per boil drawing
      sprite(ctx, L, 'branch', 80, 1320, bi, (g) => {
        // the lower lateral first (further back)
        const lw = G.low;
        for (const lf of lw.leaves) drawLeaf(g, L, P, lf, bi);
        for (const c of lw.cherries) if (c.back) drawCherry(g, L, P, c, c.x, c.y, c.rot);
        fillPoly(g, lw.poly, P.bark);
        L.hatch(g, lw.poly, { angle: 0.1, spacing: 5, width: 1.2, color: P.barkDeep, alpha: 0.9, length: [12, 36], seed: sd('b2h'), density: (x, y) => sstep(-2, 8, y - lw.y(x)) });
        L.inkPath(g, lw.top, { width: 3, seed: sd('b2T'), taper: [0, 14] });
        L.inkPath(g, lw.bot, { width: 3.6, seed: sd('b2B'), taper: [0, 14] });
        for (const c of lw.cherries) if (!c.back) drawCherry(g, L, P, c, c.x, c.y, c.rot);
        for (const lf of G.LEAVES) drawLeaf(g, L, P, lf, bi);
        for (let k = 0; k < 3; k++) {
          G.clusters[k].forEach((c, i) => {
            if (c.back && !isEvent(k, i)) drawCherry(g, L, P, c, c.x, c.y, c.rot);
          });
        }
        drawBranch(g, L, P, G);
        for (let k = 0; k < 3; k++) {
          G.clusters[k].forEach((c, i) => {
            if (!c.back && !isEvent(k, i)) drawCherry(g, L, P, c, c.x, c.y, c.rot);
          });
        }
      });
      // the cherries the hand visits (all in the front rows)
      for (let k = 0; k < 3; k++) {
        G.clusters[k].forEach((c, i) => {
          if (isEvent(k, i) && !isHeld(k, i)) drawCherry(ctx, L, P, c, c.x, c.y, c.rot);
        });
      }

      // ---- 4 basket inside: back wall, heap, landed cherries ----------------------
      const liftQ = Math.round(lift * 10) / 10;
      sprite(ctx, L, 'heap' + liftQ, 1080, 420, bi, (g) => {
        const lift = liftQ;
        drawBasketBack(g, L, P, bi);
        {
          // clip: above the front rim curve and inside the basket mouth (the heap may rise over the back rim)
          g.save();
          g.beginPath();
          g.moveTo(RIM.cx - RIM.rx + 4, RIM.cy);
          for (let i = 0; i <= 40; i++) {
            const a = Math.PI - (i / 40) * Math.PI;
            g.lineTo(RIM.cx + Math.cos(a) * (RIM.rx - 4), RIM.cy + Math.sin(a) * (RIM.ry - 4));
          }
          g.lineTo(RIM.cx + RIM.rx - 30, 1150);
          g.lineTo(RIM.cx - RIM.rx + 30, 1150);
          g.closePath();
          g.clip();
          for (const h of G.heap) {
            const y = h.y - lift;
            const col = h.kind === 'r' ? G.COLS.r : { fill: P.cherryDeep, deep: P.ink, hi: P.cherryRed };
            if (h.y < heapSurf(h.x) + 30) drawCherry(g, L, P, { r: h.r, col, seed: h.seed }, h.x, y, h.rot, { width: 2.8 });
            else cheapCherry(g, P, h.x, y, h.r, col, h.rot);
          }
          // the heap darkens toward the basket wall on the right and deep inside
          L.hatch(g, null, {
            bounds: [160, 1180 - lift, 760, 300], spacing: 6, width: 1.3, color: P.cherryDeep, alpha: 0.7, length: [10, 28], seed: sd('heapsh'),
            density: (x, y) => (y > heapTopAt(x, lift) + 14 ? 0.8 * sstep(640, 900, x) + 0.5 * sstep(1360, 1440, y) : 0),
          });
          // shadow at the heap's lower right and deep in the basket
          g.restore();
        }
      });
      // landed cherries on top of the heap
      EV.forEach((e, k) => {
        if (!e.pick || tw < landT[k] - 1e-6) return;
        const c = G.clusters[e.cl][e.ci];
        const lp = landPt[k];
        // settle with a small bounce over two drawings
        const d = tw - landT[k];
        const bounce = d < 1 / 12 - 1e-6 ? -10 : 0;
        // later landings raise the heap under earlier cherries
        let under = 0;
        EV.forEach((e2, j) => {
          if (j > k && e2.pick && tw >= landT[j] - 1e-6) under += HEAP_STEP;
        });
        drawCherry(ctx, L, P, c, lp[0], lp[1] + bounce - under, c.rot + 2.2 + k);
      });

      // ---- 5 basket front ------------------------------------------------------------
      sprite(ctx, L, 'basket', 1200, 720, bi, (g) => drawBasketFront(g, L, P, bi));

      // ---- 6 falling cherries ------------------------------------------------------
      const fallPos = (k, tt) => {
        const p0 = evPos[k], p1 = landPt[k];
        const u = clamp((tt - relT[k]) / FALL);
        return [lerp(p0[0], p1[0], u), p0[1] + (p1[1] - p0[1]) * u * u, u];
      };
      EV.forEach((e, k) => {
        if (!e.pick) return;
        if (tw < relT[k] - 1e-6 || tw >= landT[k] - 1e-6) return;
        const c = G.clusters[e.cl][e.ci];
        const [x, y] = fallPos(k, tw);
        const spin = c.rot + 15 * DEG + (tw - relT[k]) * 9;
        drawCherry(ctx, L, P, c, x, y, spin);
      });

      // ---- 7 the hand ------------------------------------------------------------------
      {
        const H = handGeo(L, pose.open);
        // the held cherry turns with the hand during the twist
        const e = EV[pose.k];
        const holding = e.pick && pose.dt < TWIST - 1e-6;
        if (holding) {
          const c = G.clusters[e.cl][e.ci];
          drawCherry(ctx, L, P, c, pose.x, pose.y, c.rot + (pose.th - thetaAt(evPos[pose.k][0])));
          // the snapped stalk stub left on the branch
        }
        ctx.save();
        ctx.translate(pose.x, pose.y);
        ctx.rotate(pose.th);
        ctx.scale(HAND_SCALE, HAND_SCALE);
        drawHand(ctx, L, P, H, bi, sd('hand'));
        ctx.restore();
        if (holding) {
          // the index pad presses over the cherry's top: redraw a sliver of the fingertip outline on top
        }
      }

      // ---- 8 overlays -----------------------------------------------------------------
      // dashed annBlue trajectories: draw on behind each falling cherry, hold, then fade
      EV.forEach((e, k) => {
        if (!e.pick || t < relT[k] - 1e-6) return;
        const u = clamp((t - relT[k]) / FALL + 1 / 6);
        const fade = 1 - clamp((t - landT[k] - 8 * FR) / (8 * FR));
        if (fade <= 0) return;
        const path = new Path2D();
        const N = 24;
        for (let i = 0; i <= N; i++) {
          const uu = (i / N) * u;
          const p0 = evPos[k], p1 = landPt[k];
          const x = lerp(p0[0], p1[0], uu), y = p0[1] + (p1[1] - p0[1]) * uu * uu;
          if (i === 0) path.moveTo(x, y);
          else path.lineTo(x, y);
        }
        strokePath(ctx, path, P.annBlue, fade, 2.5, [14, 10]);
        if (u >= 1) {
          // a landing tick ring on the heap
          const lp = landPt[k];
          const lu = clamp((t - landT[k]) / (8 * FR) + 1 / 8);
          ctx.save();
          ctx.globalAlpha = fade * (1 - lu);
          ctx.strokeStyle = P.annBlue;
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.ellipse(lp[0], lp[1], 30 + 50 * E.outExpo(lu), 10 + 16 * E.outExpo(lu), 0, 0, TAU);
          ctx.stroke();
          ctx.restore();
        }
      });
      // annYellow snap marks round the pinch on each pick beat (6 frames)
      EV.forEach((e, k) => {
        if (!e.pick || t < e.t - 1e-6 || t > e.t + 6 * FR) return;
        const u = clamp((t - e.t) / (6 * FR) + 1 / 6);
        const [x, y] = evPos[k];
        const r0 = 50 + 26 * E.outExpo(u), r1 = r0 + 16 * (1 - u) + 6;
        const mk = new Path2D();
        for (let i = 0; i < 6; i++) {
          const a = (-150 + i * 22) * DEG;
          mk.moveTo(x + Math.cos(a) * r0, y + Math.sin(a) * r0);
          mk.lineTo(x + Math.cos(a) * r1, y + Math.sin(a) * r1);
        }
        strokePath(ctx, mk, P.annYellow, 1 - sstep(0.6, 1, u), 3);
      });
      // annYellow check rings on each picked cherry's former spot
      EV.forEach((e, k) => {
        if (!e.pick || t < relT[k] - 1e-6) return;
        const [x, y] = evPos[k];
        const u = clamp((t - relT[k]) / (3 * FR) + 1 / 3);
        const s = E.outBack(u);
        ctx.save();
        ctx.strokeStyle = P.annYellow;
        ctx.lineWidth = 3;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.beginPath();
        ctx.arc(x, y, 30 * s, 0, TAU);
        ctx.stroke();
        if (u >= 1) {
          ctx.beginPath();
          ctx.moveTo(x - 13, y + 1);
          ctx.lineTo(x - 4, y + 11);
          ctx.lineTo(x + 14, y - 11);
          ctx.stroke();
        }
        ctx.restore();
      });
      // annMagenta X ring over the skipped green cherry (T 13.125), 12 frames
      {
        const k = 3;
        const a = EV[k].t;
        if (t >= a - 1e-6) {
          const c = G.clusters[EV[k].cl][EV[k].ci];
          const u = clamp((t - a) / (12 * FR) + 1 / 12);
          const r = 34 + 22 * E.outExpo(clamp(u * 2));
          const alpha = 1 - sstep(0.6, 1, u);
          if (alpha > 0) {
            ctx.save();
            ctx.globalAlpha = alpha;
            ctx.strokeStyle = P.annMagenta;
            ctx.lineWidth = 3;
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.arc(c.x, c.y, r, 0, TAU);
            ctx.stroke();
            const d = r * 0.5;
            ctx.beginPath();
            ctx.moveTo(c.x - d, c.y - d);
            ctx.lineTo(c.x + d, c.y + d);
            ctx.moveTo(c.x + d, c.y - d);
            ctx.lineTo(c.x - d, c.y + d);
            ctx.stroke();
            ctx.restore();
          }
        }
      }
    },
  });
})();

</script>
<script>
// ---- src/scenes/08-cherry-cutaway.js
// 08 cherry-cutaway : Skin, pulp, honey, parchment.  T 14.25 to 16.50 (54 frames), schematic, hard cut.
// The shot opens on the exact G2 cherry outline (oval centred (540, 900), rx 260, ry 290, calyx scar
// disc r 34 at (540, 1172), gloss crescent at 200..250 degrees inset 40) as a double lavender line.
// T 14.625 (8th): a lineWhite section line slices down the middle with a magenta flash (12 frames).
// T 15.00 (beat): the halves part 60 px each side (outBack, 3 frames) and the layers draw on from the
// outside in, one per 8th-triplet: skin, pulp, mucilage, parchment, then silverskin and the two beans
// flat face to flat face (T 15.00, 15.25, 15.50, 15.75, 16.00). Each layer wires to its node glyph.
//
// Layers, back to front:
//   1 blueprint plate, guide circles, tick rings, diagonals, registration marks
//   2 measurement: height bracket, tick ruler, width bracket (after the split)
//   3 the two halves (clipped half-planes, each translated): section layers, then the outline
//   4 section line and the magenta slice flash
//   5 network: curved lines from layer anchors to five node glyphs with layer icons
//   6 progress glyph (stage 1 cosecha, u = p), copied verbatim from docs/storyboard.md
(function () {
  'use strict';

  const ID = 'cherry-cutaway';
  const LIB = FILM.lib;
  const TAU = Math.PI * 2;
  const DEG = Math.PI / 180;
  const FR = 1 / 24;

  const clamp = (v, lo = 0, hi = 1) => (v < lo ? lo : v > hi ? hi : v);
  const lerp = (a, b, t) => a + (b - a) * t;
  const sstep = (a, b, x) => {
    const u = clamp((x - a) / (b - a));
    return u * u * (3 - 2 * u);
  };
  const sd = (...k) => LIB.hash(ID, ...k) & 0x7fffffff;
  const h3 = LIB.h3;

  // G2 (storyboard, shared geometry)
  const CX = 540, CY = 900, RX = 260, RY = 290;
  const CALYX = [540, 1172], CALYX_R = 34;

  // beats (shot-local seconds)
  const B_SLICE = 0.375; // T 14.625
  const B_SPLIT = 0.75; // T 15.000
  const B_LAYER = [0.75, 1.0, 1.25, 1.5, 1.75]; // T 15.00 .. 16.00, one per 8th-triplet
  const PART = 60;

  // layer insets (px from the G2 outline)
  const D_SKIN = 9, D_PULP = 64, D_MUC = 78, D_PARCH = 86;

  // nodes: skin, pulp, mucilage on the left; parchment, bean on the right
  const NODES = [
    { x: 130, y: 620, side: -1 },
    { x: 130, y: 900, side: -1 },
    { x: 130, y: 1180, side: -1 },
    { x: 885, y: 760, side: 1 },
    { x: 885, y: 1080, side: 1 },
  ];

  // ---------------------------------------------------------------------------
  // geometry (t-independent, built once)
  // ---------------------------------------------------------------------------
  const oval = (d, n = 160) => LIB.ellipsePts(CX, CY, RX - d, RY - d, n);
  const ovalAt = (d, a) => [CX + Math.cos(a) * (RX - d), CY + Math.sin(a) * (RY - d)];

  let GEO = null;
  function geo(L) {
    if (GEO) return GEO;
    const outer = oval(0);
    const inner9 = oval(D_SKIN);
    const pulpIn = oval(D_PULP);
    const mucIn = oval(D_MUC);
    const parchIn = oval(D_PARCH);
    // the beans: half-ovals in the cavity, flat faces 10 px apart, a crease fold in each flat face
    const BR = { rx: RX - D_PARCH - 8, ry: RY - D_PARCH - 8 };
    const left = [];
    // flat face from the top down to the crease, the fold, then down to the bottom
    const xF = 535;
    const yTop = CY - BR.ry * Math.sqrt(1 - Math.pow((xF - CX) / BR.rx, 2)) + 10;
    const yBot = CY + BR.ry * Math.sqrt(1 - Math.pow((xF - CX) / BR.rx, 2)) - 10;
    // rounded back: oval points from the bottom (x just left of the face) round to the top
    const aB = Math.acos((xF - 10 - CX) / BR.rx);
    for (let i = 0; i <= 60; i++) {
      const a = aB + (i / 60) * (TAU - 2 * aB);
      left.push([CX + Math.cos(a) * BR.rx, CY + Math.sin(a) * BR.ry]);
    }
    // top corner, flat face, crease fold, flat face, bottom corner
    left.push([xF - 3, yTop + 6], [xF, yTop + 30], [xF, CY - 60], [xF, CY - 20]);
    left.push([xF - 14, CY - 16], [xF - 30, CY - 6], [xF - 34, CY + 10], [xF - 24, CY + 20], [xF - 14, CY + 14], [xF - 10, CY + 4], [xF - 4, CY + 14], [xF, CY + 26]);
    left.push([xF, CY + 70], [xF, yBot - 30], [xF - 3, yBot - 6]);
    const beanL = L.smoothPts(left, true, 4);
    const beanR = beanL.map(([x, y]) => [2 * CX - x, y]);
    // silverskin: a thin film 4 px outside each bean
    const grow = (pts, d) => {
      const n = pts.length;
      let cx = 0, cy = 0;
      for (const p of pts) { cx += p[0]; cy += p[1]; }
      cx /= n; cy /= n;
      return pts.map((p, i) => {
        const a = pts[(i - 2 + n) % n], b = pts[(i + 2) % n];
        let tx = b[0] - a[0], ty = b[1] - a[1];
        const tl = Math.hypot(tx, ty) || 1;
        let nx = ty / tl, ny = -tx / tl;
        if ((p[0] - cx) * nx + (p[1] - cy) * ny < 0) { nx = -nx; ny = -ny; }
        return [p[0] + nx * d, p[1] + ny * d];
      });
    };
    const silverL = grow(beanL, 4.5), silverR = grow(beanR, 4.5);
    // crease centreline in each flat face (for the white groove)
    const creaseL = L.smoothPts([[xF, CY - 20], [xF - 14, CY - 16], [xF - 30, CY - 6], [xF - 34, CY + 10], [xF - 24, CY + 20], [xF - 14, CY + 14]], false, 3);
    const creaseR = creaseL.map(([x, y]) => [2 * CX - x, y]);
    // gloss crescent at upper left between 200 and 250 degrees, inset 40
    const gloss = [];
    for (let i = 0; i <= 20; i++) gloss.push(ovalAt(40, (200 + i * 2.5) * DEG));
    for (let i = 20; i >= 0; i--) {
      const a = (200 + i * 2.5) * DEG;
      const w = 16 * Math.sin((i / 20) * Math.PI);
      gloss.push(ovalAt(40 + w, a));
    }
    // pulp lattice: rings and spokes (rectangular cells)
    const lat = new Path2D();
    for (const d of [26, 45]) LIB.tracePath(lat, oval(d, 120), true);
    for (let k = 0; k < 64; k++) {
      const a = (k / 64) * TAU + 0.02;
      const stag = k % 2 ? 0 : 1;
      const p0 = ovalAt(D_SKIN + 1, a), p1 = ovalAt(stag ? 26 : 45, a);
      const q0 = ovalAt(stag ? 26 : 45, a + TAU / 128), q1 = ovalAt(D_PULP - 1, a + TAU / 128);
      lat.moveTo(p0[0], p0[1]); lat.lineTo(p1[0], p1[1]);
      lat.moveTo(q0[0], q0[1]); lat.lineTo(q1[0], q1[1]);
    }
    // skin: fine radial ticks in the 9 px band
    const skinT = new Path2D();
    for (let k = 0; k < 180; k++) {
      const a = (k / 180) * TAU;
      const p0 = ovalAt(1.5, a), p1 = ovalAt(D_SKIN - 1.5, a);
      skinT.moveTo(p0[0], p0[1]); skinT.lineTo(p1[0], p1[1]);
    }
    // parchment fibres: short ties between the double line
    const fib = new Path2D();
    for (let k = 0; k < 120; k++) {
      const a = (k / 120) * TAU;
      const p0 = ovalAt(D_MUC + 1.5, a), p1 = ovalAt(D_PARCH - 1.5, a + 0.02);
      fib.moveTo(p0[0], p0[1]); fib.lineTo(p1[0], p1[1]);
    }
    GEO = { outer, inner9, pulpIn, mucIn, parchIn, beanL, beanR, silverL, silverR, creaseL, creaseR, gloss, lat, skinT, fib };
    return GEO;
  }

  // ---------------------------------------------------------------------------
  // helpers
  // ---------------------------------------------------------------------------
  function stroke(ctx, path, color, alpha, width, dash) {
    ctx.save();
    ctx.strokeStyle = color;
    ctx.globalAlpha *= alpha;
    ctx.lineWidth = width;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    if (dash) ctx.setLineDash(dash);
    ctx.stroke(path);
    ctx.restore();
  }
  // a polyline wobbled per boil drawing (schematic lines shimmer too)
  function wobPath(pts, closed, seed, amp, bi, dx = 0, path = new Path2D()) {
    for (let i = 0; i < pts.length; i++) {
      const j1 = (h3(i, bi, seed) - 0.5) * 2 * amp;
      const j2 = (h3(i, bi, seed + 1) - 0.5) * 2 * amp;
      const x = pts[i][0] + j1 + dx, y = pts[i][1] + j2;
      if (i === 0) path.moveTo(x, y);
      else path.lineTo(x, y);
    }
    if (closed) path.closePath();
    return path;
  }
  // first fraction u of a polyline
  function partial(pts, u) {
    if (u >= 1) return pts;
    const n = Math.max(2, Math.ceil(pts.length * u));
    return pts.slice(0, n);
  }
  function bez(p0, p1, p2, p3, n = 40) {
    const out = [];
    for (let i = 0; i <= n; i++) {
      const t = i / n, m = 1 - t;
      out.push([
        m * m * m * p0[0] + 3 * m * m * t * p1[0] + 3 * m * t * t * p2[0] + t * t * t * p3[0],
        m * m * m * p0[1] + 3 * m * m * t * p1[1] + 3 * m * t * t * p2[1] + t * t * t * p3[1],
      ]);
    }
    return out;
  }
  // a wedge from the centre sweeping from 12 o'clock downward on one side, k 0..1
  function wedge(ctx, cx, cy, side, k) {
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    const a0 = -Math.PI / 2;
    const n = 36;
    for (let i = 0; i <= n; i++) {
      const a = a0 - side * (i / n) * Math.PI * k * -1;
      ctx.lineTo(cx + Math.cos(a) * 460, cy + Math.sin(a) * 460);
    }
    ctx.closePath();
  }

  // ---------------------------------------------------------------------------
  // Progress glyph: canonical, copied verbatim from docs/storyboard.md.
  function progressGlyph(ctx, L, stage, u, T, allLit) {
    const P = L.pal, cx = 900, cy = 300, r = 46, gap = 6 * Math.PI / 180;
    const q = Math.PI / 2, pop = L.clamp(u * 6);
    ctx.save();
    ctx.lineCap = 'round';
    ctx.globalAlpha = 0.5; ctx.strokeStyle = P.lavender; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(cx, cy, r + 14, 0, Math.PI * 2); ctx.stroke();
    for (let i = 0; i < 4; i++) {
      const a0 = -q + i * q + gap / 2, a1 = a0 + q - gap;
      const past = allLit || i < stage, cur = !allLit && i === stage;
      ctx.globalAlpha = past ? 0.6 : 0.18;
      ctx.strokeStyle = P.lavender; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(cx, cy, r, a0, a1); ctx.stroke();
      if (cur || allLit) {
        const k = allLit ? 1 : L.clamp(u);
        const ae = a0 + (a1 - a0) * k;
        ctx.globalAlpha = 1; ctx.strokeStyle = P.lineWhite; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.arc(cx, cy, r, a0, ae); ctx.stroke();
        if (cur) L.glowDot(ctx, cx + Math.cos(ae) * r, cy + Math.sin(ae) * r, 4 + 2 * pop, { rays: 0, glow: 3.5, intensity: 0.8 });
      }
    }
    ctx.globalAlpha = 0.7; ctx.fillStyle = P.lineWhite;
    ctx.beginPath(); ctx.arc(cx, cy, 3, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  // node glyph with a tiny icon of its layer
  function nodeGlyph(ctx, L, P, i, x, y, k, bi) {
    if (k <= 0) return;
    const s = k;
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(s, s);
    ctx.fillStyle = P.navyLight;
    ctx.globalAlpha = 0.9;
    ctx.beginPath();
    ctx.arc(0, 0, 48, 0, TAU);
    ctx.fill();
    ctx.globalAlpha = 1;
    const o = new Path2D();
    o.arc(0, 0, 48, 0, TAU);
    stroke(ctx, o, P.lavender, 0.85, 2.5);
    const o2 = new Path2D();
    o2.arc(0, 0, 39, 0, TAU);
    stroke(ctx, o2, P.lavender, 0.5, 1.5);
    L.ticks(ctx, 0, 0, { r: 48, n: 24, len: 5, color: P.lavender, alpha: 0.35, width: 1 });
    const ic = new Path2D();
    if (i === 0) {
      // skin: concentric arcs
      ic.arc(14, 14, 34, Math.PI * 1.05, Math.PI * 1.45);
      ic.moveTo(14 + Math.cos(Math.PI * 1.05) * 26, 14 + Math.sin(Math.PI * 1.05) * 26);
      ic.arc(14, 14, 26, Math.PI * 1.05, Math.PI * 1.45);
      stroke(ctx, ic, P.lineWhite, 0.9, 2);
      const tk = new Path2D();
      for (let a = 1.08; a < 1.44; a += 0.05) {
        tk.moveTo(14 + Math.cos(Math.PI * a) * 27.5, 14 + Math.sin(Math.PI * a) * 27.5);
        tk.lineTo(14 + Math.cos(Math.PI * a) * 32.5, 14 + Math.sin(Math.PI * a) * 32.5);
      }
      stroke(ctx, tk, P.lavender, 0.7, 1);
    } else if (i === 1) {
      // pulp: hatch patch in a rounded square
      ctx.save();
      ctx.beginPath();
      ctx.rect(-18, -18, 36, 36);
      ctx.clip();
      for (let d = -40; d < 40; d += 6) {
        ic.moveTo(d - 20, 20);
        ic.lineTo(d + 20, -20);
      }
      stroke(ctx, ic, P.lavender, 0.8, 1.3);
      ctx.restore();
      const sq = new Path2D();
      sq.rect(-18, -18, 36, 36);
      sq.moveTo(-18, 0); sq.lineTo(18, 0);
      sq.moveTo(0, -18); sq.lineTo(0, 18);
      stroke(ctx, sq, P.lineWhite, 0.85, 1.6);
    } else if (i === 2) {
      // mucilage: dots
      ctx.fillStyle = P.lineWhite;
      const r = L.rng(sd('mdots'));
      for (let k2 = 0; k2 < 16; k2++) {
        const a = r() * TAU, d = Math.sqrt(r()) * 22;
        ctx.globalAlpha = 0.6 + 0.4 * r();
        ctx.beginPath();
        ctx.arc(Math.cos(a) * d, Math.sin(a) * d, 1.6 + r() * 1.6, 0, TAU);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
    } else if (i === 3) {
      // parchment: a double line
      ic.moveTo(-22, 10); ic.quadraticCurveTo(0, -18, 22, 10);
      ic.moveTo(-22, 20); ic.quadraticCurveTo(0, -8, 22, 20);
      stroke(ctx, ic, P.lineWhite, 0.9, 2);
      const tk = new Path2D();
      for (let x2 = -16; x2 <= 16; x2 += 6) {
        const yA = 10 - 28 * (1 - Math.pow(x2 / 22, 2)) * 0.5 + 1, yB = yA + 8;
        tk.moveTo(x2, yA); tk.lineTo(x2 + 1, yB);
      }
      stroke(ctx, tk, P.lavender, 0.6, 1);
    } else {
      // bean: a face-on bean with its crease
      const b = LIB.ellipsePts(0, 0, 16, 23, 28, -15 * DEG);
      LIB.tracePath(ic, b, true);
      stroke(ctx, ic, P.schemBean, 0.95, 2);
      const cr = new Path2D();
      cr.moveTo(3, -19); cr.bezierCurveTo(-6, -8, 6, 6, -3, 19);
      stroke(ctx, cr, P.lineWhite, 0.9, 1.8);
    }
    ctx.restore();
  }

  // ---------------------------------------------------------------------------
  // the scene
  // ---------------------------------------------------------------------------
  FILM.scene({
    id: ID,
    draw(ctx, tIn, info) {
      const L = info.lib, P = L.pal, E = L.ease;
      let t = clamp(tIn, 0, info.dur);
      const tF = Math.round(t * 24) / 24;
      if (Math.abs(t - tF) < 1e-4) t = tF + 1e-7;
      const bi = L.boil(info.T);
      const G = geo(L);
      const lav = P.lavender, white = P.lineWhite, mag = P.magenta;

      const hit = (a, frames, e, lead = 1) => {
        if (t < a) return 0;
        const u = clamp((t - a) / (frames * FR) + lead / frames);
        return e ? e(u) : u;
      };

      // ---- 1 plate and guides --------------------------------------------------------
      L.blueprint(ctx, { center: [CX, CY], seed: sd('bp') % 1000 });
      {
        const rot = 4 * DEG * info.p;
        ctx.save();
        ctx.translate(CX, CY);
        ctx.rotate(rot);
        L.guideCircle(ctx, 0, 0, 470, { alpha: 0.15 });
        L.ticks(ctx, 0, 0, { r: 470, n: 144, len: 6, major: 12, majorLen: 16, inward: true, color: lav, alpha: 0.24, width: 1 });
        L.guideCircle(ctx, 0, 0, 392, { alpha: 0.1, dash: [3, 9] });
        L.guideCircle(ctx, 0, 0, 620, { alpha: 0.08 });
        for (let k = 0; k < 4; k++) {
          const a = k * 90 * DEG + 24 * DEG;
          L.arcAnnotation(ctx, 0, 0, 488, a, a + 30 * DEG, { color: lav, alpha: 0.22, width: 1.2, endTicks: 10 });
        }
        ctx.restore();
        const cons = new Path2D();
        cons.moveTo(CX, 520); cons.lineTo(CX, 1290);
        cons.moveTo(200, CY); cons.lineTo(880, CY);
        stroke(ctx, cons, lav, 0.14, 1, [10, 8]);
        const reg = new Path2D();
        for (const [x, y] of [[CX, 1370], [70, CY], [1010, CY], [CX, 430]]) {
          reg.moveTo(x - 9, y); reg.lineTo(x + 9, y);
          reg.moveTo(x, y - 9); reg.lineTo(x, y + 9);
        }
        stroke(ctx, reg, lav, 0.4, 1.2);
      }

      // ---- 2 measurement --------------------------------------------------------------
      L.bracket(ctx, 1000, CY - RY, 1000, CY + RY, { alpha: 0.5, cap: 14 });
      L.ticks(ctx, 1000, CY - RY, { length: RY * 2, angle: Math.PI / 2, n: 12, len: 9, major: 3, majorLen: 18, side: -1, baseline: false, color: lav, alpha: 0.5, width: 1.2 });
      L.ticks(ctx, 40, 400, { length: 1100, angle: Math.PI / 2, n: 44, len: 8, major: 4, majorLen: 18, side: 1, color: lav, alpha: 0.35, width: 1.2 });
      const kSplit = hit(B_SPLIT, 3, E.outBack);
      const dx = PART * kSplit;
      if (kSplit > 0) {
        const kb = hit(B_SPLIT + 2 * FR, 6, E.outExpo);
        L.bracket(ctx, CX - RX - dx, 1290, CX + RX + dx, 1290, { alpha: 0.55, cap: 16, p: kb });
        L.bracket(ctx, CX - dx, 1240, CX + dx, 1240, { alpha: 0.45, cap: 10, p: kb, width: 1.2 });
        L.ticks(ctx, CX - RX - dx, 1318, { length: 2 * (RX + dx), angle: 0, n: 20, len: 8, major: 5, majorLen: 14, side: 1, baseline: false, color: lav, alpha: 0.4 * kb, width: 1 });
      }

      // layer progress (outside to in)
      const kL = B_LAYER.map((a) => hit(a, 6, E.outExpo, 1));
      const kExt = 1 - hit(B_SPLIT, 6, E.inOutSine); // exterior details fade as the section opens

      // ---- 3 the halves ------------------------------------------------------------------
      const drawHalf = (side) => {
        const ox = side * dx;
        ctx.save();
        ctx.beginPath();
        if (side < 0) ctx.rect(-10 + ox, 0, CX + 10, 1920);
        else ctx.rect(CX + ox, 0, 1100 - CX, 1920);
        ctx.clip();
        ctx.translate(ox, 0);

        // calm the grid inside the fruit
        ctx.save();
        ctx.beginPath();
        LIB.tracePath(ctx, G.outer, true);
        ctx.fillStyle = P.navy;
        ctx.globalAlpha = 0.55;
        ctx.fill();
        ctx.restore();

        const reveal = (k, fn) => {
          if (k <= 0) return;
          ctx.save();
          if (k < 1) {
            wedge(ctx, CX, CY, side, k);
            ctx.clip();
          }
          fn();
          ctx.restore();
        };
        // skin: fine radial ticks in the outer band, brighter
        reveal(kL[0], () => {
          stroke(ctx, G.skinT, white, 0.5, 1);
        });
        // pulp: lattice rectangles and 25 percent hatch
        reveal(kL[1], () => {
          L.hatch(ctx, [G.inner9, G.pulpIn], { color: lav, alpha: 0.25, spacing: 8, width: 1.2, length: [10, 30], seed: sd('pulph') });
          stroke(ctx, G.lat, lav, 0.32, 1);
          stroke(ctx, wobPath(G.pulpIn, true, sd('pin'), 0.5, bi), lav, 0.6, 1.5);
        });
        // mucilage: fine dots
        reveal(kL[2], () => {
          L.stipple(ctx, [G.pulpIn, G.mucIn], { color: lav, alpha: 0.75, spacing: 4.6, r: [0.7, 1.4], seed: sd('muc') });
          stroke(ctx, wobPath(G.mucIn, true, sd('min'), 0.5, bi), lav, 0.4, 1);
        });
        // parchment: a double line with fibres
        reveal(kL[3], () => {
          stroke(ctx, G.fib, lav, 0.4, 1);
          stroke(ctx, wobPath(G.mucIn, true, sd('pa'), 0.5, bi), white, 0.85, 1.8);
          stroke(ctx, wobPath(G.parchIn, true, sd('pb'), 0.5, bi), lav, 0.75, 1.5);
        });
        // silverskin and beans: hex lattice, double outline in the bean tint, crease groove, embryo
        reveal(kL[4], () => {
          const bean = side < 0 ? G.beanL : G.beanR;
          const silver = side < 0 ? G.silverL : G.silverR;
          const crease = side < 0 ? G.creaseL : G.creaseR;
          ctx.save();
          ctx.beginPath();
          LIB.tracePath(ctx, bean, true);
          ctx.fillStyle = P.navyLight;
          ctx.globalAlpha = 0.6;
          ctx.fill();
          ctx.restore();
          L.hexLattice(ctx, bean, { r: 9, alpha: 0.35, color: lav, seed: sd('hex', side) });
          stroke(ctx, wobPath(silver, true, sd('sv', side), 0.4, bi), P.paleBlue, 0.7, 1, [5, 4]);
          stroke(ctx, wobPath(bean, true, sd('bo', side), 0.6, bi), P.schemBean, 0.85, 2.5);
          // inner line of the double outline, 9 px in (scaled toward the bean centre)
          const bc = [side < 0 ? 455 : 625, CY];
          const inner = bean.map(([x, y]) => [lerp(x, bc[0], 9 / 80), lerp(y, bc[1], 9 / 200)]);
          stroke(ctx, wobPath(inner, true, sd('bi', side), 0.5, bi), P.schemBean, 0.45, 1.5);
          stroke(ctx, wobPath(crease, false, sd('cr', side), 0.4, bi), white, 0.9, 3);
          // embryo at the lower end, near the flat face
          L.glowDot(ctx, side < 0 ? 506 : 574, CY + 150, 6, { rays: 8, rayLen: 2.6, glow: 4, intensity: 0.8, seed: sd('emb', side) });
          // a hatched shade crescent on the lower right of each bean
          L.hatch(ctx, bean, { color: lav, alpha: 0.22, spacing: 6, width: 1, length: [8, 20], seed: sd('bsh', side), density: (x, y) => sstep(0.1, 0.9, ((x - bc[0]) / 80 + (y - CY) / 200) * 0.7) });
        });

        // the outline of the fruit: double lavender (outer 2.5 px 85 percent, inner 1.5 px 50 percent, 9 px in)
        stroke(ctx, wobPath(G.outer, true, sd('o1'), 0.6, bi), lav, 0.85, 2.5);
        stroke(ctx, wobPath(G.inner9, true, sd('o2'), 0.6, bi), lav, 0.5, 1.5);
        // exterior details: gloss crescent and calyx scar disc
        if (kExt > 0) {
          ctx.save();
          ctx.globalAlpha = kExt;
          stroke(ctx, wobPath(G.gloss, true, sd('gl'), 0.5, bi), white, 0.8, 1.5);
          L.hatch(ctx, G.gloss, { color: white, alpha: 0.35, spacing: 5, width: 1, length: [6, 14], seed: sd('glh') });
          const cd = new Path2D();
          cd.arc(CALYX[0], CALYX[1], CALYX_R, 0, TAU);
          stroke(ctx, cd, lav, 0.85, 2);
          const cs = new Path2D();
          for (let k = 0; k < 5; k++) {
            const a = -Math.PI / 2 + (k / 5) * TAU;
            cs.moveTo(CALYX[0], CALYX[1]);
            cs.lineTo(CALYX[0] + Math.cos(a) * 22, CALYX[1] + Math.sin(a) * 22);
          }
          cs.moveTo(CALYX[0] + 12, CALYX[1]);
          cs.arc(CALYX[0], CALYX[1], 12, 0, TAU);
          stroke(ctx, cs, lav, 0.55, 1.2);
          // wireframe of the sphere: meridians and latitudes (the fruit as a solid, before the cut)
          const wf = new Path2D();
          for (const th of [22, 44, 66]) {
            const rx = RX * Math.sin(th * DEG);
            wf.moveTo(CX + rx, CY);
            wf.ellipse(CX, CY, rx, RY, 0, 0, TAU);
          }
          for (const lat of [-56, -30, 0, 30, 56]) {
            const yc = CY + RY * Math.sin(lat * DEG) * 0.97, rx = RX * Math.cos(lat * DEG);
            wf.moveTo(CX + rx, yc);
            wf.ellipse(CX, yc, rx, rx * 0.16, 0, 0, Math.PI);
          }
          stroke(ctx, wf, lav, 0.3, 1);
          L.hexLattice(ctx, G.inner9, { r: 10, alpha: 0.13, color: lav, seed: sd('skinhex') });
          // shade ticks inside the fruit, lower right (form turning from the light)
          L.hatch(ctx, G.inner9, { color: lav, alpha: 0.14, spacing: 9, width: 1, length: [10, 26], seed: sd('osh'), density: (x, y) => sstep(0.35, 0.95, ((x - CX) / RX + (y - CY) / RY) * 0.7) });
          ctx.restore();
        }
        // the cut face edge, once the halves part
        if (kSplit > 0) {
          const yS = RY * Math.sqrt(1 - 0);
          const cut = new Path2D();
          cut.moveTo(CX, CY - yS);
          cut.lineTo(CX, CY + yS);
          stroke(ctx, cut, white, 0.9, 2);
        }
        ctx.restore();
      };
      drawHalf(-1);
      drawHalf(1);

      // ---- 4 section line and the magenta flash -------------------------------------
      if (t >= B_SLICE && kSplit <= 0) {
        const k = hit(B_SLICE, 9, E.outCubic);
        const y0 = CY - RY - 30, y1 = lerp(y0, CY + RY + 30, k);
        const cut = new Path2D();
        cut.moveTo(CX, y0);
        cut.lineTo(CX, y1);
        stroke(ctx, cut, white, 1, 2);
        L.glowDot(ctx, CX, y1, 5, { rays: 6, rayLen: 3, glow: 5, intensity: 0.9, seed: sd('blade') });
      }
      {
        // magenta: 12 frames from the slice beat, along the cut, fading
        const m = t >= B_SLICE ? clamp((t - B_SLICE) / (12 * FR) + 1 / 12) : 0;
        if (m > 0 && m < 1) {
          const k = hit(B_SLICE, 9, E.outCubic);
          const a = 1 - sstep(0.5, 1, m);
          const y0 = CY - RY - 30, y1 = lerp(y0, CY + RY + 30, k);
          for (const s of kSplit > 0 ? [-1, 1] : [0]) {
            const x = CX + s * dx;
            ctx.save();
            ctx.globalCompositeOperation = 'lighter';
            const g = ctx.createLinearGradient(x - 18, 0, x + 18, 0);
            g.addColorStop(0, L.rgba(mag, 0));
            g.addColorStop(0.5, L.rgba(mag, 0.45 * a));
            g.addColorStop(1, L.rgba(mag, 0));
            ctx.fillStyle = g;
            ctx.fillRect(x - 18, y0, 36, y1 - y0);
            ctx.restore();
            const ln = new Path2D();
            ln.moveTo(x + (s ? 0 : 0), y0);
            ln.lineTo(x, y1);
            stroke(ctx, ln, mag, a, 3);
          }
        }
      }

      // ---- 4b layer strip: the six layers as a core sample, each band drawing with its layer
      {
        const y0 = 1400, hgt = 46;
        const segs = [[200, 228], [228, 420], [420, 474], [474, 512], [512, 528], [528, 880]];
        const frame = new Path2D();
        frame.rect(200, y0, 680, hgt);
        stroke(ctx, frame, lav, 0.25 + 0.35 * kL[0], 1);
        for (let i = 0; i < 6; i++) {
          const k = kL[Math.min(4, i)];
          if (k <= 0) continue;
          const [x0, x1] = segs[i];
          const xe = lerp(x0, x1, k);
          ctx.save();
          ctx.beginPath();
          ctx.rect(x0, y0, xe - x0, hgt);
          ctx.clip();
          if (i === 0) {
            const tk = new Path2D();
            for (let x = x0 + 3; x < x1; x += 4) { tk.moveTo(x, y0 + 4); tk.lineTo(x, y0 + hgt - 4); }
            stroke(ctx, tk, white, 0.55, 1);
          } else if (i === 1) {
            L.hatch(ctx, null, { bounds: [x0, y0, x1 - x0, hgt], color: lav, alpha: 0.3, spacing: 7, width: 1.1, length: [8, 24], seed: sd('sp') });
            const lt = new Path2D();
            for (let x = x0 + 24; x < x1; x += 24) { lt.moveTo(x, y0); lt.lineTo(x, y0 + hgt); }
            lt.moveTo(x0, y0 + hgt / 2); lt.lineTo(x1, y0 + hgt / 2);
            stroke(ctx, lt, lav, 0.35, 1);
          } else if (i === 2) {
            L.stipple(ctx, null, { bounds: [x0, y0, x1 - x0, hgt], color: lav, alpha: 0.8, spacing: 4.6, r: [0.7, 1.4], seed: sd('sm') });
          } else if (i === 3) {
            const dl = new Path2D();
            dl.moveTo(x0 + 9, y0); dl.lineTo(x0 + 9, y0 + hgt);
            dl.moveTo(x1 - 9, y0); dl.lineTo(x1 - 9, y0 + hgt);
            for (let y = y0 + 4; y < y0 + hgt; y += 6) { dl.moveTo(x0 + 10, y); dl.lineTo(x1 - 10, y + 2); }
            stroke(ctx, dl, white, 0.8, 1.4);
          } else if (i === 4) {
            const sv = new Path2D();
            sv.moveTo((x0 + x1) / 2, y0); sv.lineTo((x0 + x1) / 2, y0 + hgt);
            stroke(ctx, sv, P.paleBlue, 0.8, 1, [5, 4]);
          } else {
            L.hexLattice(ctx, null, { bounds: [x0, y0, x1 - x0, hgt], r: 9, alpha: 0.4, color: lav, seed: sd('sh') });
            const bo = new Path2D();
            bo.moveTo(x0, y0 + 2); bo.lineTo(x1 - 2, y0 + 2);
            bo.moveTo(x0, y0 + hgt - 2); bo.lineTo(x1 - 2, y0 + hgt - 2);
            stroke(ctx, bo, P.schemBean, 0.85, 2);
          }
          ctx.restore();
          const dv = new Path2D();
          dv.moveTo(x1, y0 - 8); dv.lineTo(x1, y0 + hgt + 8);
          stroke(ctx, dv, white, 0.6 * k, 1.5);
        }
        L.bracket(ctx, 200, y0 + hgt + 22, 880, y0 + hgt + 22, { alpha: 0.4 * kL[0], cap: 12, width: 1.2 });
        // a dashed lead from the section's equator down to the strip
        if (kL[0] > 0) {
          const ld = new Path2D();
          ld.moveTo(CX - RX - dx, CY); ld.lineTo(CX - RX - dx - 30, CY + 60); ld.lineTo(170, 1380); ld.lineTo(200, y0);
          stroke(ctx, ld, lav, 0.22 * kL[0], 1, [4, 6]);
        }
      }
      // ---- 4c inset: the whole fruit on its branch and where the cut runs
      {
        const ix = 190, iy = 340;
        L.guideCircle(ctx, ix, iy, 84, { alpha: 0.35, quadrants: 6 });
        L.guideCircle(ctx, ix, iy, 92, { alpha: 0.18, dash: [2, 6] });
        const br = new Path2D();
        br.moveTo(ix - 76, iy - 40); br.quadraticCurveTo(ix, iy - 52, ix + 76, iy - 36);
        stroke(ctx, br, lav, 0.6, 2);
        const lf = new Path2D();
        lf.moveTo(ix - 30, iy - 46); lf.quadraticCurveTo(ix - 60, iy - 80, ix - 40, iy - 74); lf.quadraticCurveTo(ix - 18, iy - 70, ix - 30, iy - 46);
        lf.moveTo(ix + 30, iy - 44); lf.quadraticCurveTo(ix + 64, iy - 74, ix + 46, iy - 72); lf.quadraticCurveTo(ix + 22, iy - 66, ix + 30, iy - 44);
        stroke(ctx, lf, lav, 0.5, 1.4);
        for (const [ox, oy, r] of [[-28, -12, 18], [28, -10, 18]]) {
          const c = new Path2D();
          c.ellipse(ix + ox, iy + oy, r, r * 1.1, 0, 0, TAU);
          stroke(ctx, c, lav, 0.45, 1.3);
        }
        const hc = new Path2D();
        hc.ellipse(ix, iy + 8, 26, 29, 0, 0, TAU);
        stroke(ctx, hc, white, 0.9, 2);
        const ct = new Path2D();
        ct.moveTo(ix, iy - 30); ct.lineTo(ix, iy + 46);
        stroke(ctx, ct, white, t >= B_SLICE ? 0.9 : 0.35, 1.4, [4, 4]);
        L.glowDot(ctx, ix, iy + 8, 3.5, { rays: 0, glow: 4, intensity: 0.7, seed: sd('ins') });
        // a dashed lead from the inset to the big fruit
        const ld = new Path2D();
        ld.moveTo(ix + 64, iy + 56); ld.quadraticCurveTo(330, 470, CX - 150, CY - RY + 40);
        stroke(ctx, ld, lav, 0.25, 1, [4, 6]);
      }

      // ---- 5 network: anchors, curved lines, nodes ------------------------------------
      {
        const anchors = [
          [ovalAt(4, 218 * DEG), -1],
          [ovalAt(36, 180 * DEG), -1],
          [ovalAt(71, 140 * DEG), -1],
          [ovalAt(82, -36 * DEG), 1],
          [[CX + 82, CY + 70], 1],
        ];
        for (let i = 0; i < 5; i++) {
          const k = kL[i];
          if (k <= 0) continue;
          const nd = NODES[i];
          const [ap, side] = anchors[i];
          const ax = ap[0] + side * dx, ay = ap[1];
          const ex = nd.x - nd.side * 50, ey = nd.y;
          const c1 = [ax + side * 70, ay];
          const c2 = [ex + side * 40, ey + (ay - ey) * 0.2];
          const pts = bez([ax, ay], c1, c2, [ex, ey], 40);
          const lp = wobPath(partial(pts, k), false, sd('net', i), 0.6, bi);
          stroke(ctx, lp, lav, 0.6, 1.5);
          L.glowDot(ctx, ax, ay, 4.5, { rays: 0, glow: 4, intensity: 0.75, seed: sd('ad', i) });
          const kn = hit(B_LAYER[i] + 2 * FR, 3, E.outBack);
          nodeGlyph(ctx, L, P, i, nd.x, nd.y, kn, bi);
        }
      }

      // ---- 6 progress glyph --------------------------------------------------------------
      progressGlyph(ctx, L, 1, info.p, info.T, false);
    },
  });
})();

</script>
<script>
// ---- src/scenes/09-depulping.js
// 09 depulping : Washed.  T 16.50 to 18.00 (36 frames), illustrated, hard cut.
// A toothed depulper drum (steel, 300 px across, axis horizontal, seen end-on, centred (540, 640))
// turns clockwise under a hopper of ripe cherries. Each cherry (on 8ths) drops into the gap between
// the drum and the breast plate and pops: its red skin flies out to the right onto the pulp heap, its
// two wet beans in parchment ride down the drum, slide down a chute and drop into the washing channel
// (surface y 980), where they sink with a slight sway and drift with the flow onto the bed of beans.
// Two green unripe floaters bob at the surface (260, 975) and (820, 975). T 17.25: a big splash.
//
// Layers, back to front:
//   1 stripes (stripeCream / stripeSage) in the top part
//   2 static plate (sprite per boil drawing): back wall lip, channel water and floor, ground, depulper
//     housing and stand, pulley and belt, hopper and its cherries, breast plate, chute, bean bed, pulp heap
//   3 the drum (rotating at 24 fps): rim teeth, end plate, spokes, hub
//   4 falling cherries, flying skins, beans on the drum, on the chute and sinking in the water
//   5 floaters, water surface line and ripples, splash
//   6 overlays: annBlue flow arrows, annYellow ring on a floater, annMagenta change ring at the gap
(function () {
  'use strict';

  const ID = 'depulping';
  const LIB = FILM.lib;
  const TAU = Math.PI * 2;
  const DEG = Math.PI / 180;
  const FR = 1 / 24;

  const clamp = (v, lo = 0, hi = 1) => (v < lo ? lo : v > hi ? hi : v);
  const lerp = (a, b, t) => a + (b - a) * t;
  const sstep = (a, b, x) => {
    const u = clamp((x - a) / (b - a));
    return u * u * (3 - 2 * u);
  };
  const sd = (...k) => LIB.hash(ID, ...k) & 0x7fffffff;
  const h3 = LIB.h3;

  // ---------------------------------------------------------------------------
  // layout
  // ---------------------------------------------------------------------------
  const DRUM = { x: 540, y: 640, r: 150 };
  const SURF = 980; // water surface
  const LIP = 860; // top of the back wall
  const FLOOR = 1560; // channel floor
  const GAP_A = -16 * DEG; // where a cherry is squeezed (on the drum, right side)
  const gapPt = [DRUM.x + Math.cos(GAP_A) * 162, DRUM.y + Math.sin(GAP_A) * 162];
  const THROAT = [648, 486];
  const CHUTE0 = [626, 792], CHUTE1 = [372, 956];
  const HEAP = { x0: 790, x1: 1090 };
  const FLOAT = [[260, 975], [820, 975]];
  const STEP = 0.375; // an 8th
  const B_SPLASH = 0.75; // T 17.25

  // events: a cherry pops at the gap at te = k * 0.375 (k = -4 .. 3); k = 1 is a double batch whose
  // beans hit the water on the T 17.25 beat
  const EVENTS = [];
  for (let k = -5; k <= 3; k++) {
    const nb = k === 1 ? 5 : 3;
    EVENTS.push({ k, te: k * STEP, nb });
  }

  // bean timing relative to its event
  const T_DRUM = 3 * FR; // gap to the chute head along the drum
  const T_CHUTE = 4 * FR; // down the chute; a 2-frame drop, so it enters the water 9 frames (one 8th) after the pop
  const T_SINK = 1.25;

  let GEO = null;
  function geo(L) {
    if (GEO) return GEO;
    const r = L.rng(sd('geo'));
    // bean bed on the channel floor, thicker downstream (right)
    const bed = [];
    for (let i = 0; i < 150; i++) {
      const x = r.range(-20, 1100);
      const hgt = lerp(26, 70, sstep(100, 1000, x));
      const y = FLOOR - 14 - r() * hgt;
      bed.push({ x, y, rot: r.range(-1.2, 1.2), s: r.range(0.85, 1.05), seed: sd('bed', i) });
    }
    bed.sort((a, b) => a.y - b.y);
    // pulp heap: crumpled skins piled on the lip at the right
    const pulp = [];
    for (let i = 0; i < 46; i++) {
      const x = r.range(HEAP.x0 + 10, HEAP.x1);
      const top = LIP - 62 * Math.sin(Math.PI * clamp((x - HEAP.x0) / (HEAP.x1 - HEAP.x0 + 60)));
      const y = lerp(top + 8, LIP - 6, Math.pow(r(), 1.4));
      pulp.push({ x, y, rot: r() * TAU, s: r.range(0.8, 1.15), seed: sd('pulp', i) });
    }
    pulp.sort((a, b) => a.y - b.y);
    // hopper cherries
    const hop = [];
    for (let i = 0; i < 40; i++) {
      const y = r.range(318, 470);
      const u = (y - 300) / 180;
      const xl = lerp(490, 618, u), xr = lerp(810, 680, u);
      if (xr - xl < 30) continue;
      hop.push({ x: r.range(xl + 18, xr - 18), y, rr: r.range(24, 28), rot: r.range(-0.5, 0.5), seed: sd('hop', i), kind: r() < 0.9 ? 'r' : 'y' });
    }
    hop.sort((a, b) => a.y - b.y);
    GEO = { bed, pulp, hop };
    return GEO;
  }

  // ---------------------------------------------------------------------------
  // helpers
  // ---------------------------------------------------------------------------
  function strokePath(ctx, path, color, alpha, width, dash, offset) {
    ctx.save();
    ctx.strokeStyle = color;
    ctx.globalAlpha *= alpha;
    ctx.lineWidth = width;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    if (dash) {
      ctx.setLineDash(dash);
      if (offset) ctx.lineDashOffset = offset;
    }
    ctx.stroke(path);
    ctx.restore();
  }
  function fillPoly(ctx, pts, color, alpha = 1) {
    ctx.save();
    ctx.globalAlpha *= alpha;
    ctx.fillStyle = color;
    ctx.beginPath();
    LIB.tracePath(ctx, pts, true);
    ctx.fill();
    ctx.restore();
  }
  function sprite(ctx, L, key, y0, h, bi, drawFn) {
    const S = FILM.S || 1;
    const c = L.cached([ID, key, y0, h, S, bi].join('|'), () => {
      const cv = FILM.makeCanvas(Math.round(1080 * S), Math.round(h * S));
      const g = cv.getContext('2d');
      g.scale(S, S);
      g.translate(0, -y0);
      drawFn(g);
      return cv;
    });
    ctx.drawImage(c, 0, y0, 1080, h);
  }

  // a cherry: inked oval, flat colour, hatched shade, gloss, calyx scar
  function cherry(ctx, L, P, x, y, r, rot, kind, seed, o = {}) {
    const fill = kind === 'g' ? P.cherryGreen : kind === 'y' ? P.cherryYellow : P.cherryRed;
    const deep = kind === 'g' ? L.mix(P.cherryGreen, P.leafDeep, 0.65) : kind === 'y' ? L.mix(P.cherryYellow, P.ochre, 0.8) : P.cherryDeep;
    const hi = kind === 'g' ? L.mix(P.cherryGreen, P.white, 0.45) : kind === 'y' ? L.mix(P.cherryYellow, P.white, 0.5) : P.cherryLight;
    if (o.cheap) {
      ctx.save();
      ctx.fillStyle = deep;
      ctx.beginPath();
      ctx.ellipse(x, y, r, r * 1.08, rot, 0, TAU);
      ctx.fill();
      ctx.fillStyle = fill;
      ctx.beginPath();
      ctx.ellipse(x - r * 0.12, y - r * 0.14, r * 0.86, r * 0.92, rot, 0, TAU);
      ctx.fill();
      ctx.strokeStyle = P.ink;
      ctx.lineWidth = 2.4;
      ctx.beginPath();
      ctx.ellipse(x, y, r, r * 1.08, rot, 0, TAU);
      ctx.stroke();
      ctx.restore();
    } else {
      const pts = L.ellipsePts(x, y, r, r * 1.1, 32, rot);
      L.inkPath(ctx, pts, { closed: true, width: 3, fill, seed, wobble: 0.8 });
      L.hatch(ctx, L.ellipsePts(x, y, r - 2, r * 1.1 - 2, 28, rot), {
        spacing: 4.5, width: 1.2, color: deep, alpha: 0.85, length: [6, 18], seed: seed + 1, inset: 1, overshoot: 0,
        density: (px, py) => sstep(-0.15, 0.75, ((px - x) * 0.7 + (py - y) * 0.7) / r),
      });
    }
    ctx.save();
    ctx.fillStyle = hi;
    ctx.globalAlpha = 0.9;
    ctx.beginPath();
    ctx.ellipse(x - r * 0.36, y - r * 0.4, r * 0.32, r * 0.16, -0.75, 0, TAU);
    ctx.fill();
    ctx.fillStyle = P.white;
    ctx.beginPath();
    ctx.ellipse(x - r * 0.42, y - r * 0.46, r * 0.12, r * 0.07, -0.75, 0, TAU);
    ctx.fill();
    const tx = x - Math.sin(rot) * r * 0.86, ty = y + Math.cos(rot) * r * 0.86;
    ctx.fillStyle = P.ink;
    ctx.globalAlpha = 0.85;
    ctx.beginPath();
    ctx.ellipse(tx, ty, r * 0.17, r * 0.12, rot, 0, TAU);
    ctx.fill();
    ctx.restore();
  }

  // a wet bean in parchment: 46 x 32 oval, mucilage fill, groove, glint
  function bean(ctx, L, P, x, y, rot, s, seed, o = {}) {
    const rx = 23 * s, ry = 16 * s;
    const fill = o.under ? L.mix(P.mucilage, P.water, 0.28) : P.mucilage;
    const shade = o.under ? L.mix(P.parchmentDeep, P.waterDeep, 0.3) : P.parchmentDeep;
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(rot);
    ctx.fillStyle = shade;
    ctx.beginPath();
    ctx.ellipse(0, 0, rx, ry, 0, 0, TAU);
    ctx.fill();
    ctx.fillStyle = fill;
    ctx.beginPath();
    ctx.ellipse(-rx * 0.08, -ry * 0.14, rx * 0.9, ry * 0.82, 0, 0, TAU);
    ctx.fill();
    ctx.strokeStyle = P.ink;
    ctx.lineWidth = o.thin ? 1.8 : 2.4;
    ctx.beginPath();
    ctx.ellipse(0, 0, rx, ry, 0, 0, TAU);
    ctx.stroke();
    // the groove of the flat face showing through the parchment
    ctx.strokeStyle = P.inkSoft;
    ctx.globalAlpha = 0.8;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(-rx * 0.62, ry * 0.05);
    ctx.bezierCurveTo(-rx * 0.2, -ry * 0.25, rx * 0.2, ry * 0.3, rx * 0.62, -ry * 0.05);
    ctx.stroke();
    // wet glint
    ctx.globalAlpha = 1;
    ctx.fillStyle = P.white;
    ctx.beginPath();
    ctx.ellipse(-rx * 0.42, -ry * 0.42, rx * 0.22, ry * 0.14, -0.3, 0, TAU);
    ctx.fill();
    ctx.restore();
  }

  // a crumpled red skin: a ragged crescent with the pulp side showing
  function skin(ctx, L, P, x, y, rot, s, seed) {
    const pts = [];
    const n = 14;
    for (let i = 0; i <= n; i++) {
      const a = Math.PI * 0.1 + (i / n) * Math.PI * 1.25;
      const rr = (26 + 5 * (h3(i, 1, seed) - 0.5)) * s;
      pts.push([Math.cos(a) * rr, Math.sin(a) * rr]);
    }
    for (let i = n; i >= 0; i--) {
      const a = Math.PI * 0.1 + (i / n) * Math.PI * 1.25;
      const rr = (12 + 7 * h3(i, 2, seed)) * s;
      pts.push([Math.cos(a) * rr + 5 * s, Math.sin(a) * rr - 2 * s]);
    }
    const ca = Math.cos(rot), sa = Math.sin(rot);
    const W = pts.map(([px, py]) => [x + px * ca - py * sa, y + px * sa + py * ca]);
    ctx.save();
    ctx.fillStyle = P.cherryRed;
    ctx.beginPath();
    LIB.tracePath(ctx, W, true);
    ctx.fill();
    // pulp side: the inner edge in pulp colour
    ctx.strokeStyle = P.pulp;
    ctx.lineWidth = 4 * s;
    ctx.beginPath();
    LIB.tracePath(ctx, W.slice(n + 1), false);
    ctx.stroke();
    ctx.strokeStyle = P.cherryDeep;
    ctx.lineWidth = 1.4;
    ctx.beginPath();
    for (let i = 3; i < n - 2; i += 3) {
      const p = W[i], q = W[2 * n + 1 - i];
      ctx.moveTo(p[0] * 0.7 + q[0] * 0.3, p[1] * 0.7 + q[1] * 0.3);
      ctx.lineTo(p[0] * 0.35 + q[0] * 0.65, p[1] * 0.35 + q[1] * 0.65);
    }
    ctx.stroke();
    ctx.strokeStyle = P.ink;
    ctx.lineWidth = 2.2;
    ctx.lineJoin = 'round';
    ctx.beginPath();
    LIB.tracePath(ctx, W, true);
    ctx.stroke();
    ctx.restore();
  }

  // ---------------------------------------------------------------------------
  // static plate
  // ---------------------------------------------------------------------------
  function drawPlate(ctx, L, P, G, bi) {
    // ground below the channel
    fillPoly(ctx, [[0, FLOOR + 80], [1080, FLOOR + 80], [1080, 1920], [0, 1920]], P.soil);
    L.hatch(ctx, [[0, FLOOR + 80], [1080, FLOOR + 80], [1080, 1920], [0, 1920]], { spacing: 8, width: 1.3, color: P.soilDeep, alpha: 0.85, length: [12, 36], seed: sd('soil') });
    L.stipple(ctx, [[0, FLOOR + 90], [1080, FLOOR + 90], [1080, 1920], [0, 1920]], { spacing: 16, color: P.soilDeep, alpha: 0.7, seed: sd('soilst') });
    // pebbles in the ground
    for (let i = 0; i < 26; i++) {
      const x = 30 + i * 41 + 20 * h3(i, 1, sd('peb')), y = FLOOR + 140 + 230 * h3(i, 2, sd('peb'));
      const rx = 10 + 12 * h3(i, 3, sd('peb')), ry = rx * (0.55 + 0.2 * h3(i, 4, sd('peb')));
      const pp = L.ellipsePts(x, y, rx, ry, 16, h3(i, 5, sd('peb')) - 0.5);
      L.inkPath(ctx, pp, { closed: true, width: 2.2, fill: L.mix(P.tan, P.soil, 0.3), seed: sd('pebi', i), wobble: 0.6 });
      L.hatch(ctx, pp, { spacing: 3.5, width: 1, color: P.soilDeep, alpha: 0.8, length: [4, 10], seed: sd('pebh', i), density: (px, py) => sstep(-0.2, 0.6, ((px - x) / rx + (py - y) / ry) * 0.7) });
    }
    // channel floor slab (concrete)
    const slab = [[0, FLOOR], [1080, FLOOR], [1080, FLOOR + 80], [0, FLOOR + 80]];
    fillPoly(ctx, slab, P.paperDeep);
    L.hatch(ctx, slab, { spacing: 6, width: 1.3, color: P.inkSoft, alpha: 0.7, length: [12, 40], seed: sd('slab'), density: (x, y) => sstep(FLOOR + 10, FLOOR + 75, y) });
    L.stipple(ctx, slab, { spacing: 9, color: P.inkSoft, alpha: 0.6, seed: sd('slabst') });
    L.inkLine(ctx, -10, FLOOR + 80, 1090, FLOOR + 80, { width: 4, seed: sd('slabB'), taper: 0 });
    // the water body
    const water = [[0, SURF], [1080, SURF], [1080, FLOOR], [0, FLOOR]];
    fillPoly(ctx, water, P.water);
    L.hatch(ctx, water, { angle: 0, spacing: 9, width: 1.4, color: P.waterDeep, alpha: 0.8, length: [20, 70], gap: [6, 18], seed: sd('wat'), density: (x, y) => 0.25 + 0.75 * sstep(SURF + 20, FLOOR - 40, y) });
    L.hatch(ctx, [[0, FLOOR - 160], [1080, FLOOR - 160], [1080, FLOOR], [0, FLOOR]], { angle: 0, spacing: 5, width: 1.2, color: P.tealDeep, alpha: 0.6, length: [14, 50], seed: sd('wat2'), density: (x, y) => sstep(FLOOR - 160, FLOOR - 20, y) });
    // bean bed on the floor (tinted by the water)
    for (const b of G.bed) bean(ctx, L, P, b.x, b.y, b.rot, b.s, b.seed, { under: true, thin: true });
    L.hatch(ctx, [[0, FLOOR - 80], [1080, FLOOR - 80], [1080, FLOOR], [0, FLOOR]], { angle: 0, spacing: 6, width: 1.2, color: P.waterDeep, alpha: 0.55, length: [14, 40], seed: sd('bedsh'), density: (x, y) => sstep(FLOOR - 70, FLOOR, y) * 0.8 });
    L.inkLine(ctx, -10, FLOOR, 1090, FLOOR, { width: 3.4, seed: sd('floor'), taper: 0 });
    // back wall lip: the concrete band above the water
    const wall = [[0, LIP], [1080, LIP], [1080, SURF], [0, SURF]];
    fillPoly(ctx, wall, P.paperDeep);
    L.hatch(ctx, wall, { spacing: 7, width: 1.3, color: P.inkSoft, alpha: 0.75, length: [10, 36], seed: sd('wall'), density: (x, y) => 0.25 + 0.6 * sstep(LIP + 20, SURF, y) });
    L.stipple(ctx, wall, { spacing: 10, color: P.inkSoft, alpha: 0.55, seed: sd('wallst') });
    const joints = new Path2D();
    for (const x of [150, 420, 700, 960]) {
      joints.moveTo(x, LIP + 4);
      joints.lineTo(x + 2, SURF - 2);
    }
    // a wet line just above the water and algae stain
    joints.moveTo(0, SURF - 14);
    for (let x = 0; x <= 1080; x += 30) joints.lineTo(x, SURF - 14 + 3 * Math.sin(x * 0.05));
    strokePath(ctx, joints, P.inkSoft, 0.7, 1.8);
    L.hatch(ctx, [[0, SURF - 14], [1080, SURF - 14], [1080, SURF], [0, SURF]], { angle: 0.15, spacing: 4, width: 1.2, color: P.leafDeep, alpha: 0.6, length: [6, 18], seed: sd('alg') });
    L.inkLine(ctx, -10, LIP, 1090, LIP, { width: 4.4, seed: sd('lip'), taper: 0 });
    L.inkLine(ctx, -10, LIP + 14, 1090, LIP + 14, { width: 1.8, color: P.inkSoft, seed: sd('lip2'), taper: 0 });

    // stand: two legs from the housing to the lip
    for (const x of [400, 690]) {
      const leg = [[x - 12, 800], [x + 12, 800], [x + 16, LIP], [x - 16, LIP]];
      L.inkPath(ctx, leg, { closed: true, width: 3, fill: P.steelDeep, seed: sd('leg', x), smooth: false });
      L.hatch(ctx, leg, { angle: Math.PI / 2 - 0.1, spacing: 4, width: 1.2, color: P.ink, alpha: 0.7, length: [10, 30], seed: sd('legh', x), density: (px) => sstep(x - 6, x + 14, px) });
      const ft = L.rrectPts(x - 34, LIP - 14, 68, 14, 4, 10);
      L.inkPath(ctx, ft, { closed: true, width: 2.6, fill: P.steel, seed: sd('foot', x) });
    }
    // housing behind the drum (sheet steel box)
    const hb = L.rrectPts(350, 455, 400, 360, 26, 18);
    L.inkPath(ctx, hb, { closed: true, width: 4, fill: L.mix(P.steelDeep, P.steel, 0.35), seed: sd('housing') });
    L.hatch(ctx, hb, { spacing: 6, width: 1.3, color: P.ink, alpha: 0.65, length: [14, 40], seed: sd('hh'), density: (x, y) => 0.3 + 0.7 * sstep(520, 780, x + (y - 455) * 0.3) });
    const rv = new Path2D();
    for (const [x, y] of [[372, 478], [728, 478], [372, 792], [728, 792], [550, 470], [372, 635], [728, 635]]) {
      rv.moveTo(x + 4, y);
      rv.arc(x, y, 4, 0, TAU);
    }
    ctx.save();
    ctx.fillStyle = P.steel;
    ctx.fill(rv);
    ctx.restore();
    strokePath(ctx, rv, P.ink, 0.9, 1.6);
    // hopper (cutaway: we see the cherries inside), on a short column
    const hop = [[476, 290], [824, 290], [690, 482], [608, 482]];
    fillPoly(ctx, hop, L.mix(P.steelDeep, P.ink, 0.35));
    ctx.save();
    ctx.beginPath();
    LIB.tracePath(ctx, hop, true);
    ctx.clip();
    for (const c of G.hop) cherry(ctx, L, P, c.x, c.y, c.rr, c.rot, c.kind, c.seed, { cheap: c.y > 400 });
    ctx.restore();
    // hopper walls (thick bands with contour hatching) and rim
    const wallL = [[462, 284], [488, 284], [618, 486], [598, 486]];
    const wallR = [[812, 284], [838, 284], [700, 486], [680, 486]];
    for (const [w, k] of [[wallL, 1], [wallR, 2]]) {
      L.inkPath(ctx, w, { closed: true, width: 3.4, fill: P.steel, seed: sd('hw', k), smooth: false });
      L.hatch(ctx, w, { angle: 0.4, spacing: 4, width: 1.1, color: P.steelDeep, alpha: 0.9, length: [6, 16], seed: sd('hwh', k), density: k === 2 ? 1 : 0.4 });
    }
    L.inkPath(ctx, L.rrectPts(452, 270, 396, 20, 6, 14), { closed: true, width: 3.4, fill: P.steel, seed: sd('hrim') });
    L.hatch(ctx, L.rrectPts(452, 270, 396, 20, 6, 14), { angle: 0, spacing: 4, width: 1.1, color: P.steelDeep, alpha: 0.8, length: [10, 30], seed: sd('hrimh'), density: (x) => sstep(560, 840, x) });
    // throat collar
    L.inkPath(ctx, L.rrectPts(596, 480, 106, 18, 4, 10), { closed: true, width: 3, fill: P.steelDeep, seed: sd('collar') });
    // breast plate on the right of the drum: a thick curved plate with bolts and an adjusting screw
    const bp = [];
    for (let i = 0; i <= 24; i++) {
      const a = lerp(-48, 52, i / 24) * DEG;
      bp.push([DRUM.x + Math.cos(a) * 170, DRUM.y + Math.sin(a) * 170]);
    }
    for (let i = 24; i >= 0; i--) {
      const a = lerp(-48, 52, i / 24) * DEG;
      bp.push([DRUM.x + Math.cos(a) * 196, DRUM.y + Math.sin(a) * 196]);
    }
    L.inkPath(ctx, bp, { closed: true, width: 4, fill: P.steel, seed: sd('bp') });
    L.hatch(ctx, bp, { angle: 0.2, spacing: 4.5, width: 1.2, color: P.steelDeep, alpha: 0.9, length: [8, 22], seed: sd('bph'), density: (x, y) => 0.35 + 0.65 * sstep(560, 720, y) });
    const bolts = new Path2D();
    for (const a of [-36, 0, 38]) {
      const x = DRUM.x + Math.cos(a * DEG) * 183, y = DRUM.y + Math.sin(a * DEG) * 183;
      bolts.moveTo(x + 5, y);
      bolts.arc(x, y, 5, 0, TAU);
    }
    strokePath(ctx, bolts, P.ink, 0.9, 1.8);
    L.inkPath(ctx, [[732, 640], [790, 640]], { width: 7, color: P.steelDeep, seed: sd('screw'), taper: 0 });
    L.inkPath(ctx, L.rrectPts(788, 618, 16, 44, 4, 8), { closed: true, width: 2.6, fill: P.steel, seed: sd('screwh') });
    // skin spout: a short guide plate throwing skins out to the right
    const sp = [[722, 588], [800, 600], [800, 612], [726, 612]];
    L.inkPath(ctx, sp, { closed: true, width: 3, fill: P.steelDeep, seed: sd('spout'), smooth: false });
    // the bean chute: an inclined trough from under the drum to the water
    const dxC = CHUTE1[0] - CHUTE0[0], dyC = CHUTE1[1] - CHUTE0[1];
    const lc = Math.hypot(dxC, dyC), nx = -dyC / lc, ny = dxC / lc;
    const ch = [[CHUTE0[0] + nx * 4, CHUTE0[1] + ny * 4], [CHUTE1[0] + nx * 4, CHUTE1[1] + ny * 4], [CHUTE1[0] + nx * 26, CHUTE1[1] + ny * 26], [CHUTE0[0] + nx * 26, CHUTE0[1] + ny * 26]];
    L.inkPath(ctx, ch, { closed: true, width: 3.6, fill: P.steel, seed: sd('chute'), smooth: false });
    L.hatch(ctx, ch, { angle: Math.atan2(dyC, dxC) + 1.3, spacing: 5, width: 1.2, color: P.steelDeep, alpha: 0.85, length: [6, 16], seed: sd('chh') });
    L.inkPath(ctx, [[CHUTE0[0] - nx * 6, CHUTE0[1] - ny * 6], [CHUTE1[0] - nx * 6, CHUTE1[1] - ny * 6]], { width: 2.4, seed: sd('chlip'), taper: 0 });
    // chute struts down to the lip
    L.inkPath(ctx, [[540, 862], [520, 846], [505, 800 + 40]], { width: 3, seed: sd('strut'), smooth: false });
    // pulp heap of skins on the lip at the right
    for (const p of G.pulp) skin(ctx, L, P, p.x, p.y, p.rot, p.s, p.seed);
    L.hatch(ctx, [[HEAP.x0, LIP], [HEAP.x1, LIP], [HEAP.x1, LIP - 70], [HEAP.x0 + 120, LIP - 70]], { spacing: 5, width: 1.2, color: P.cherryDeep, alpha: 0.55, length: [8, 22], seed: sd('pulpsh'), density: (x, y) => sstep(LIP - 40, LIP, y) * 0.8 });
  }

  // the drum, end-on, rotated by phi (clockwise)
  function drawDrum(ctx, L, P, phi, bi) {
    const { x, y, r } = DRUM;
    // rim teeth (rotating)
    const teeth = [];
    const NT = 44;
    for (let i = 0; i < NT; i++) {
      const a0 = phi + (i / NT) * TAU;
      const a1 = a0 + (0.45 / NT) * TAU, a2 = a0 + (0.75 / NT) * TAU, a3 = a0 + (1 / NT) * TAU;
      teeth.push([x + Math.cos(a0) * r, y + Math.sin(a0) * r], [x + Math.cos(a1) * (r + 9), y + Math.sin(a1) * (r + 9)], [x + Math.cos(a2) * (r + 7), y + Math.sin(a2) * (r + 7)], [x + Math.cos(a3) * r, y + Math.sin(a3) * r]);
    }
    L.inkPath(ctx, teeth, { closed: true, width: 3.4, fill: P.steel, seed: sd('teeth'), smooth: false, wobble: 0.6 });
    // shade on the lower right of the drum
    L.hatch(ctx, L.ellipsePts(x, y, r - 2, r - 2, 48), { spacing: 5, width: 1.3, color: P.steelDeep, alpha: 0.85, length: [10, 30], seed: sd('dsh'), density: (px, py) => sstep(-0.1, 0.8, ((px - x) + (py - y)) / (r * 1.3)) });
    L.crossHatch(ctx, L.ellipsePts(x, y, r - 2, r - 2, 48), { spacing: 5, width: 1.2, color: P.ink, alpha: 0.5, length: [8, 22], seed: sd('dsh2'), layers: 2, density: (px, py) => sstep(0.5, 1.1, ((px - x) + (py - y)) / (r * 1.3)) });
    // end plate ring and rotating spokes, hub
    L.inkCircle(ctx, x, y, r - 18, { width: 2.4, color: P.inkSoft, seed: sd('ring') });
    const sp = new Path2D();
    for (let i = 0; i < 6; i++) {
      const a = phi * 1 + (i / 6) * TAU;
      const ca = Math.cos(a), sa = Math.sin(a);
      const px = -sa, py = ca;
      sp.moveTo(x + ca * 28 + px * 7, y + sa * 28 + py * 7);
      sp.lineTo(x + ca * (r - 22) + px * 10, y + sa * (r - 22) + py * 10);
      sp.lineTo(x + ca * (r - 22) - px * 10, y + sa * (r - 22) - py * 10);
      sp.lineTo(x + ca * 28 - px * 7, y + sa * 28 - py * 7);
      sp.closePath();
    }
    ctx.save();
    ctx.fillStyle = L.mix(P.steel, P.white, 0.25);
    ctx.fill(sp);
    ctx.restore();
    strokePath(ctx, sp, P.ink, 0.9, 2.2);
    // punched tooth rows on the drum skin, seen as dashes between the spokes (rotate with it)
    const dots = new Path2D();
    for (let i = 0; i < 60; i++) {
      const a = phi + (i / 60) * TAU;
      for (const rr of [r - 8]) {
        dots.moveTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr);
        dots.lineTo(x + Math.cos(a + 0.04) * rr, y + Math.sin(a + 0.04) * rr);
      }
    }
    strokePath(ctx, dots, P.ink, 0.7, 2);
    L.inkCircle(ctx, x, y, 30, { width: 3, fill: P.steelDeep, seed: sd('hub') });
    const bl = new Path2D();
    for (let i = 0; i < 6; i++) {
      const a = phi + (i / 6) * TAU + 0.5;
      const bx = x + Math.cos(a) * 19, by = y + Math.sin(a) * 19;
      bl.moveTo(bx + 3, by);
      bl.arc(bx, by, 3, 0, TAU);
    }
    ctx.save();
    ctx.fillStyle = P.steel;
    ctx.fill(bl);
    ctx.restore();
    // the crank arm turns with the drum
    {
      const ca = Math.cos(phi + 0.9), sa = Math.sin(phi + 0.9);
      const ex = x + ca * 104, ey = y + sa * 104;
      const arm = [[x - sa * 11, y + ca * 11], [ex - sa * 8, ey + ca * 8], [ex + sa * 8, ey - ca * 8], [x + sa * 11, y - ca * 11]];
      L.inkPath(ctx, arm, { closed: true, width: 3, fill: P.steelDeep, seed: sd('crank'), smooth: false });
      L.inkCircle(ctx, ex, ey, 17, { width: 3, fill: P.wood, seed: sd('knob') });
      const kh = new Path2D();
      kh.arc(ex, ey, 11, -0.2, 1.6);
      strokePath(ctx, kh, P.barkDeep, 0.9, 2);
      L.inkCircle(ctx, ex - 5, ey - 5, 3.5, { width: 1.2, fill: P.white, seed: sd('knobhl') });
    }
    L.inkCircle(ctx, x, y, 9, { width: 2.4, fill: P.ink, seed: sd('axle') });
    // a highlight arc on the upper left of the rim
    const hl = new Path2D();
    hl.arc(x, y, r - 7, 200 * DEG, 250 * DEG);
    strokePath(ctx, hl, P.white, 0.85, 3);
  }

  // ---------------------------------------------------------------------------
  // the scene
  // ---------------------------------------------------------------------------
  FILM.scene({
    id: ID,
    draw(ctx, tIn, info) {
      const L = info.lib, P = L.pal, E = L.ease;
      let t = clamp(tIn, 0, info.dur);
      const tF = Math.round(t * 24) / 24;
      if (Math.abs(t - tF) < 1e-4) t = tF + 1e-7;
      const tw = L.onTwos(t);
      const bi = L.boil(info.T);
      const G = geo(L);

      // ---- 1 stripes -------------------------------------------------------------------
      L.stripes(ctx, { colors: [P.stripeCream, P.stripeSage], width: 140, angle: -0.52, offset: 8 * info.T, bounds: [0, 0, 1080, LIP + 10] });

      // ---- 2 static plate -------------------------------------------------------------
      sprite(ctx, L, 'plate', 250, 1670, bi, (g) => drawPlate(g, L, P, G, bi));

      // ---- 3 drum (24 fps) ------------------------------------------------------------
      const phi = 2.6 * (info.T - 16.5);
      drawDrum(ctx, L, P, phi, bi);

      // ---- 4 cherries, skins, beans ------------------------------------------------------
      // falling cherries: from the throat into the gap over the 6 frames before each pop
      for (const ev of EVENTS) {
        const d = tw - (ev.te - 6 * FR);
        if (d < 0 || tw >= ev.te - 1e-6) continue;
        const u = clamp(d / (6 * FR));
        const x = lerp(THROAT[0], gapPt[0] - 6, u), y = lerp(THROAT[1] - 6, gapPt[1] - 4, u * u);
        cherry(ctx, L, P, x, y, 27, ev.k * 0.7 + u * 1.2, 'r', sd('fc', ev.k));
        if (ev.nb > 2) cherry(ctx, L, P, x - 30, y - 34, 27, ev.k + u, 'r', sd('fc2', ev.k));
      }
      // skins flying out right onto the heap
      for (const ev of EVENTS) {
        const d = tw - ev.te;
        const T_FLY = 0.42;
        const nSk = ev.nb > 2 ? 2 : 1;
        for (let j = 0; j < nSk; j++) {
          const tx = lerp(HEAP.x0 + 40, HEAP.x1 - 60, h3(ev.k + 9, j, sd('sk')));
          const ty = LIP - 40 * Math.sin(Math.PI * clamp((tx - HEAP.x0) / (HEAP.x1 - HEAP.x0 + 60))) - 6;
          if (d < 0) continue;
          if (d >= T_FLY) {
            // landed: rests on the heap
            skin(ctx, L, P, tx, ty, ev.k * 1.9 + j, 1, sd('skr', ev.k, j));
            continue;
          }
          const u = d / T_FLY;
          const x0 = gapPt[0] + 30, y0 = gapPt[1] + 10;
          const x = lerp(x0, tx, u);
          const y = lerp(y0, ty, u) - Math.sin(Math.PI * u) * 120;
          skin(ctx, L, P, x, y, ev.k * 1.9 + j + u * 7, 1, sd('skr', ev.k, j));
        }
      }
      // beans: along the drum, down the chute, into the water, sinking with sway
      const beanState = (ev, j, tt) => {
        const d = tt - ev.te;
        if (d < 0) return null;
        const lag = j * FR * 0.5;
        const dd = d - lag;
        if (dd < 0) return { x: gapPt[0] - 4, y: gapPt[1] + 4, rot: 0.4, stage: 0 };
        if (dd < T_DRUM) {
          const a = lerp(GAP_A, 64 * DEG, dd / T_DRUM);
          return { x: DRUM.x + Math.cos(a) * 166, y: DRUM.y + Math.sin(a) * 166, rot: a + Math.PI / 2, stage: 1 };
        }
        if (dd < T_DRUM + T_CHUTE) {
          const u = (dd - T_DRUM) / T_CHUTE;
          const off = (j % 2 ? 14 : -4);
          return { x: lerp(CHUTE0[0], CHUTE1[0], u) + off * 0.3, y: lerp(CHUTE0[1], CHUTE1[1], u) - 14 + off * 0.2, rot: Math.atan2(CHUTE1[1] - CHUTE0[1], CHUTE1[0] - CHUTE0[0]) + Math.PI, stage: 2 };
        }
        const ds = dd - T_DRUM - T_CHUTE;
        const x0 = CHUTE1[0] - 22 - j * 9;
