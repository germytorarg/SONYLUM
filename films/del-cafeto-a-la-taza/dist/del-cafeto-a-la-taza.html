        ink(winIn, { closed: true, width: 1.8, color: inkSoft, alpha: 0.9, seed: sd('winIn') });
        // screws at the window corners
        for (const [x, y] of [[WIN.x0 - 14, WIN.y0 + 8], [WIN.x1 + 14, WIN.y0 + 8], [WIN.x0 - 14, WIN.y1 - 8], [WIN.x1 + 14, WIN.y1 - 8]]) {
          ink(ell(x, y, 7, 7, 14), { closed: true, width: 1.8, fill: steelLight, seed: sd('screw', x, y), wobble: 0.3 });
          const sl = new Path2D();
          sl.moveTo(x - 4, y + 3);
          sl.lineTo(x + 4, y - 3);
          stroke(ctx, sl, ink0, 0.9, 1.5);
        }
      }

      // ---- 5 hopper ---------------------------------------------------------------
      {
        const hop = [[HOP.x0, HOP.y0], [HOP.x1, HOP.y0], [HOP.bx1, HOP.y1], [HOP.bx0, HOP.y1]];
        fillPoly(ctx, hop, L.mix(P.white, P.stripeApricot, 0.4), 0.55);
        // beans sink on twos; the middle sinks faster (funnel flow)
        const sink = 84 * E.inOutSine(tw / dur) + 12 * tw;
        ctx.save();
        ctx.beginPath();
        trace(ctx, [[HOP.x0 + 8, HOP.y0 + 6], [HOP.x1 - 8, HOP.y0 + 6], [HOP.bx1 - 6, HOP.y1 + 30], [HOP.bx0 + 6, HOP.y1 + 30]], true);
        ctx.clip();
        const shade = new Path2D();
        const vis = [];
        for (const b of g.beans) {
          const y = b.y0 + sink * (1 + 0.7 * (1 - Math.abs(b.u)));
          if (y > HOP.y1 + 22) continue;
          const hw = Math.max(10, hopHalf(y) - 26);
          const x = 540 + b.u * hw;
          const rot = b.rot + (y - b.y0) * 0.012 * (b.u < 0 ? -1 : 1);
          vis.push([b, x, y, rot]);
        }
        for (const [b, x, y, rot] of vis) {
          bean(ctx, x, y, rot, b.s, b.dark ? P.beanDark : P.beanMedium, P, b.flip, (L.h3(b.k, bi, 11) - 0.5) * 1.6);
          beanShade(shade, x + 1, y + 1, b.s);
        }
        stroke(ctx, shade, ink0, 0.35, 3.5);
        // shadow inside the glass on the right
        L.hatch(ctx, hop, { angle: -Math.PI / 4, spacing: 8, width: 1.3, color: ink0, alpha: 0.4, seed: sd('hopH'), density: (x, y) => sstep(0.55, 1, (x - 540) / hopHalf(y)) });
        ctx.restore();
        // glass reflections
        const refl = new Path2D();
        refl.moveTo(360, 292);
        refl.lineTo(452, 586);
        refl.moveTo(382, 292);
        refl.lineTo(424, 430);
        refl.moveTo(700, 300);
        refl.lineTo(688, 340);
        stroke(ctx, refl, P.white, 0.85, 5);
        ink([[346, 276], [450, 612]], { width: 1.8, color: inkSoft, alpha: 0.8, seed: sd('glassIn1'), taper: [10, 10] });
        ink([[734, 276], [630, 612]], { width: 1.8, color: inkSoft, alpha: 0.8, seed: sd('glassIn2'), taper: [10, 10] });
        ink(hop, { closed: true, width: 5, seed: sd('hop'), smooth: false, double: true });
        // lid
        const lid = L.rrectPts(316, 232, 448, 32, 12, 10);
        ink(lid, { closed: true, width: 4, fill: P.ink, seed: sd('lid') });
        const lidHl = new Path2D();
        lidHl.moveTo(336, 242);
        lidHl.lineTo(600, 242);
        stroke(ctx, lidHl, P.inkFaint, 0.9, 2.5);
        ink(L.rrectPts(518, 204, 44, 30, 10, 8), { closed: true, width: 3, fill: P.ink, seed: sd('knob') });
      }

      // ---- 6 spout, stream, portafilter -----------------------------------------
      // heap height above the rim (on twos): grounds fill the basket, then mound up to a peak
      const gPh = clamp((tw - B_GRIND) / (B_PEAK - B_GRIND));
      const fillFrac = clamp(gPh / 0.4); // basket below the rim
      let heapH = 76 * E.outQuad(clamp((gPh - 0.4) / 0.6));
      const tampK = popTwos(B_TAMP);
      if (tampK > 0) heapH = Math.max(0, heapH * (1 - tampK));
      const tamped = tampK > 0;
      // surface impact point of the stream
      const floorY = lerp(1384, PF.rimY, fillFrac);
      const impY = (gPh < 0.4 ? floorY : PF.rimY - heapH) - 2;

      {
        // spout
        const sp = [[512, 1124], [568, 1124], [562, 1180], [518, 1180]];
        ink(sp, { closed: true, width: 3, fill: steel, seed: sd('spout'), smooth: false });
        L.hatch(ctx, sp, { angle: 0.05, spacing: 5, width: 1.2, color: steelDeep, alpha: 0.85, length: [6, 18], seed: sd('spoutH'), density: (x) => sstep(535, 565, x) });
        ink(ell(540, 1180, 23, 7, 20), { closed: true, width: 2.4, fill: P.ink, seed: sd('spoutM') });
      }

      // portafilter body (behind the stream impact, in front of the column)
      {
        // handle: steel neck then wooden grip off to the left (to x 120)
        const neck = [[402, 1366], [330, 1386], [330, 1414], [404, 1402]];
        ink(neck, { closed: true, width: 3, fill: steel, seed: sd('neck') });
        L.hatch(ctx, neck, { angle: Math.PI / 2 - 0.25, spacing: 5, width: 1.2, color: steelDeep, alpha: 0.85, seed: sd('neckH'), density: (x, y) => sstep(1392, 1412, y) });
        const grip = [[338, 1378], [250, 1392], [150, 1408], [118, 1418], [108, 1436], [122, 1452], [156, 1452], [254, 1434], [338, 1420]];
        ink(grip, { closed: true, width: 4, fill: P.wood, seed: sd('grip') });
        L.hatch(ctx, grip, { angle: -0.14, spacing: 5, width: 1.3, color: P.barkDeep, alpha: 0.85, length: [20, 60], seed: sd('gripH'), density: (x, y) => sstep(1418, 1446, y + (x - 230) * -0.15) });
        const grain = new Path2D();
        grain.moveTo(320, 1392);
        grain.bezierCurveTo(260, 1398, 200, 1406, 140, 1424);
        grain.moveTo(318, 1404);
        grain.bezierCurveTo(250, 1414, 190, 1424, 150, 1436);
        stroke(ctx, grain, P.barkDeep, 0.7, 1.4);
        ink(ell(124, 1436, 9, 9, 14), { closed: true, width: 1.8, fill: P.barkDeep, seed: sd('gripEnd') });

        // bowl
        const bowl = arcPts(540, 1356, 152, 36, Math.PI, 0, 32).concat(arcPts(540, 1374, 150, 66, 0, Math.PI, 40));
        ink(bowl, { closed: true, width: 5, fill: steel, seed: sd('bowl'), double: true });
        L.hatch(ctx, bowl, { angle: Math.PI / 2 - 0.35, spacing: 6, width: 1.4, color: steelDeep, alpha: 0.9, length: [10, 40], bend: 2, seed: sd('bowlH'), density: (x) => sstep(560, 680, x) });
        L.crossHatch(ctx, bowl, { spacing: 5, width: 1.2, color: ink0, alpha: 0.5, layers: 2, seed: sd('bowlX'), density: (x, y) => sstep(640, 690, x) * sstep(1370, 1420, y) });
        const bhl = new Path2D();
        bhl.moveTo(410, 1386);
        bhl.quadraticCurveTo(430, 1420, 470, 1430);
        stroke(ctx, bhl, P.white, 0.85, 3.5);
        // ears
        for (const sgn of [-1, 1]) {
          const ear = [[540 + sgn * 146, 1344], [540 + sgn * 170, 1346], [540 + sgn * 172, 1362], [540 + sgn * 146, 1366]];
          ink(ear, { closed: true, width: 2.4, fill: steel, seed: sd('ear', sgn), smooth: false });
        }
        // spouts under the bowl
        for (const sgn of [-1, 1]) {
          const s = [[540 + sgn * 6, 1436], [540 + sgn * 26, 1436], [540 + sgn * 30, 1470], [540 + sgn * 14, 1470]];
          ink(s, { closed: true, width: 2.2, fill: steel, seed: sd('pfs', sgn), smooth: false });
        }
        // rim ring and the basket mouth
        ink(ell(540, PF.rimY + 2, 152, 36, 56), { closed: true, width: 3, fill: steelLight, seed: sd('ring') });
        const mouth = ell(540, PF.rimY, PF.rx, PF.ry, 56);
        fillPoly(ctx, mouth, L.mix(steelDeep, P.ink, 0.3));
        // inside of the basket: wall shading and the perforated floor (until it is covered)
        ctx.save();
        ctx.beginPath();
        trace(ctx, mouth, true);
        ctx.clip();
        L.hatch(ctx, mouth, { angle: -Math.PI / 4, spacing: 5, width: 1.2, color: ink0, alpha: 0.6, seed: sd('mouthH') });
        if (fillFrac < 1) {
          const fl = ell(540, 1384, 112, 22, 40);
          fillPoly(ctx, fl, steel);
          const holes = new Path2D();
          for (let i = -5; i <= 5; i++) for (let j = -1; j <= 1; j++) {
            const x = 540 + i * 18 + (j % 2) * 9, y = 1384 + j * 10;
            if (((x - 540) / 104) ** 2 + ((y - 1384) / 18) ** 2 > 1) continue;
            holes.moveTo(x + 1.6, y);
            holes.arc(x, y, 1.6, 0, TAU);
          }
          ctx.fillStyle = ink0;
          ctx.fill(holes);
          // grounds layer rising in the basket
          if (fillFrac > 0) {
            const y = lerp(1388, PF.rimY + 4, fillFrac);
            const rx = lerp(112, PF.rx, fillFrac), ry = lerp(22, PF.ry, fillFrac);
            const gs = arcPts(540, y, rx, ry, 0, TAU, 40);
            fillPoly(ctx, gs, P.grounds);
            // the little cone under the impact
            const cone = [[540 - 50, y + 4], [540, y - 26 * fillFrac], [540 + 50, y + 4]];
            fillPoly(ctx, cone, P.grounds);
          }
        }
        ctx.restore();
        ink(mouth, { closed: true, width: 2.4, color: ink0, seed: sd('mouth') });
      }

      // the heap (from the moment the basket is full) or the tamped puck
      if (fillFrac >= 1 || tamped) {
        const rx = PF.rx - 3, ry = PF.ry - 2;
        const pts = [];
        const n = 36;
        for (let i = 0; i <= n; i++) {
          const a = Math.PI + (i / n) * Math.PI; // back half of the rim, under the mound
          const x = 540 + Math.cos(a) * rx;
          const dx = (x - 540) / rx;
          const mound = heapH * Math.pow(Math.max(0, 1 - dx * dx), 1.15);
          const lump = heapH > 4 ? 3 * L.noise1(i * 0.7 + drawing(0) * 0.3, sd('lump')) : 0;
          pts.push([x, PF.rimY + Math.sin(a) * ry - mound + lump]);
        }
        const front = arcPts(540, PF.rimY, rx, ry, 0, Math.PI, 30).reverse();
        const heap = pts.concat(front.reverse());
        fillPoly(ctx, heap, P.grounds);
        L.stipple(ctx, heap, { spacing: 6, color: P.beanMedium, alpha: 0.9, r: [0.8, 1.8], seed: sd('heapSt', heapH > 0 ? drawing(0) % 4 : 9) });
        L.hatch(ctx, heap, { angle: -Math.PI / 4, spacing: 5, width: 1.3, color: ink0, alpha: 0.75, length: [8, 24], seed: sd('heapH'), density: (x) => sstep(545, 640, x) });
        if (heapH > 3) ink(pts, { width: 2.2, color: ink0, seed: sd('heapL', drawing(0) % 3), taper: [8, 8] });
        else {
          // the tamped puck: flat, polished, a fine ring at the wall
          const pk = ell(540, PF.rimY + 3, rx - 6, ry - 3, 40);
          ink(pk, { closed: true, width: 1.6, color: P.beanMedium, alpha: 0.9, seed: sd('puckL') });
        }
      }

      // the grounds stream: on from T 31.50, off at T 32.25 (the tail falls over 4 frames)
      if (t >= B_GRIND) {
        const fall = 1182;
        const headU = hit(B_GRIND, 4, E.inQuad); // head reaches the heap in 4 frames
        const tailU = t >= B_PEAK ? clamp((t - B_PEAK) / (4 * FR)) : 0;
        const yHead = lerp(fall, impY, headU);
        const yTail = lerp(fall, impY, E.inQuad(tailU));
        if (yHead > yTail + 1) {
          const rr = L.rng(sd('stream', drawing(0)));
          const pa = new Path2D(), pb = new Path2D();
          const len = yHead - yTail;
          const cnt = Math.floor(len * 1.5);
          for (let i = 0; i < cnt; i++) {
            const y = yTail + rr() * len;
            const f = (y - fall) / (impY - fall);
            const x = 540 + rr.gauss() * (3.6 + 5.5 * f);
            const rad = rr.range(0.8, 2.0);
            const pth = rr() < 0.7 ? pa : pb;
            pth.moveTo(x + rad, y);
            pth.arc(x, y, rad, 0, TAU);
          }
          ctx.fillStyle = P.grounds;
          ctx.fill(pa);
          ctx.fillStyle = P.beanMedium;
          ctx.fill(pb);
          // a dusty core line
          const core = new Path2D();
          core.moveTo(540, yTail);
          core.lineTo(540, yHead);
          stroke(ctx, core, P.grounds, 0.7, 5);
          // tiny splash at the impact while flowing
          if (headU >= 1 && tailU === 0) {
            const sp = new Path2D();
            for (let i = 0; i < 14; i++) {
              const a = Math.PI + rr() * Math.PI;
              const d = rr.range(10, 34);
              const x = 540 + Math.cos(a) * d * 1.6, y = impY + Math.sin(a) * d * 0.5;
              sp.moveTo(x + 1.4, y);
              sp.arc(x, y, 1.4, 0, TAU);
            }
            ctx.fillStyle = P.grounds;
            ctx.fill(sp);
          }
        }
      }

      // ---- 7 tamper --------------------------------------------------------------
      if (t >= B_TAMP_IN) {
        const hover = PF.rimY - 76 - 34; // disk bottom just above the peak heap
        const enterU = E.outCubic(clamp((tw - B_TAMP_IN) / (B_TAMP - B_TAMP_IN - 1 / 12)));
        let yb = lerp(hover - 300, hover, enterU);
        if (tampK > 0) yb = lerp(hover, PF.rimY + 1, tampK);
        const a = clamp((t - B_TAMP_IN) / (3 * FR));
        ctx.save();
        ctx.globalAlpha = a;
        // cast shadow on the bowl rim while hovering
        // disk (cylinder)
        const dTop = yb - 26;
        const side = arcPts(540, dTop, 122, 27, Math.PI, 0, 28).concat(arcPts(540, yb, 122, 27, 0, Math.PI, 28));
        ink(side, { closed: true, width: 4, fill: steel, seed: sd('tdisk') });
        L.hatch(ctx, side, { angle: 0.04, spacing: 5, width: 1.3, color: steelDeep, alpha: 0.9, length: [10, 40], seed: sd('tdiskH'), density: (x) => sstep(560, 660, x) });
        ink(ell(540, dTop, 122, 27, 48), { closed: true, width: 3, fill: steelLight, seed: sd('tdiskT') });
        L.hatch(ctx, ell(540, dTop, 118, 24, 40), { angle: -Math.PI / 4, spacing: 7, width: 1.2, color: steelDeep, alpha: 0.6, seed: sd('tdiskTH'), density: (x) => sstep(560, 660, x) });
        // neck and wooden handle
        const neck = [[524, dTop - 6], [524, dTop - 62], [556, dTop - 62], [556, dTop - 6]];
        ink(neck, { closed: true, width: 3, fill: steel, seed: sd('tneck'), smooth: false });
        L.hatch(ctx, neck, { angle: 0, spacing: 5, width: 1.2, color: steelDeep, alpha: 0.85, length: [6, 14], seed: sd('tneckH'), density: (x) => sstep(540, 556, x) });
        const hdl = [[516, dTop - 60], [500, dTop - 100], [498, dTop - 150], [514, dTop - 178], [540, dTop - 186], [566, dTop - 178], [582, dTop - 150], [580, dTop - 100], [564, dTop - 60]];
        ink(hdl, { closed: true, width: 4, fill: P.wood, seed: sd('thdl'), double: true });
        L.hatch(ctx, hdl, { angle: 0.05, spacing: 5, width: 1.3, color: P.barkDeep, alpha: 0.85, length: [10, 30], bend: 2, seed: sd('thdlH'), density: (x) => sstep(546, 580, x) });
        const hh = new Path2D();
        hh.moveTo(512, dTop - 92);
        hh.quadraticCurveTo(508, dTop - 130, 518, dTop - 160);
        stroke(ctx, hh, P.white, 0.75, 3);
        ctx.restore();
        // motion lines above the tamper as it slams
        if (tampK > 0 && drawing(B_TAMP) < 3) {
          const ml = new Path2D();
          for (const dx of [-90, -60, 60, 90]) {
            ml.moveTo(540 + dx, yb - 230);
            ml.lineTo(540 + dx, yb - 150);
          }
          stroke(ctx, ml, ink0, 0.6, 2.2);
        }
        // puff of grounds squeezed out at the rim on the tamp (6 frames)
        const puff = t >= B_TAMP ? clamp((t - B_TAMP) / (6 * FR) + 1 / 6) : 0;
        if (puff > 0 && puff < 1) {
          const rr = L.rng(sd('puff'));
          const pp = new Path2D();
          for (let i = 0; i < 40; i++) {
            const sgn = rr() < 0.5 ? -1 : 1;
            const d = rr.range(10, 60) * E.outCubic(puff);
            const x = 540 + sgn * (130 + d), y = PF.rimY - rr.range(0, 30) * E.outCubic(puff) + 30 * puff * puff;
            const rad = rr.range(1, 2.2) * (1 - puff * 0.5);
            pp.moveTo(x + rad, y);
            pp.arc(x, y, rad, 0, TAU);
          }
          ctx.fillStyle = P.grounds;
          ctx.fill(pp);
        }
      }

      // ---- 8 overlays --------------------------------------------------------------
      {
        // annBlue rotation arrow around the burr: a front arc with an animated dash and an arrowhead
        ctx.save();
        ctx.strokeStyle = P.annBlue;
        ctx.fillStyle = P.annBlue;
        ctx.lineWidth = 2.5;
        ctx.lineCap = 'round';
        ctx.setLineDash([14, 10]);
        ctx.lineDashOffset = -t * 96;
        ctx.beginPath();
        ctx.ellipse(540, 880, 176, 44, 0, 0.12 * Math.PI, 0.88 * Math.PI);
        ctx.stroke();
        ctx.setLineDash([]);
        const ae = 0.12 * Math.PI;
        const ex = 540 + Math.cos(ae) * 176, ey = 880 + Math.sin(ae) * 44;
        // tangent direction of travel (toward decreasing angle: left to right across the front)
        const tx = Math.sin(ae) * 176, ty = -Math.cos(ae) * 44;
        const tl = Math.hypot(tx, ty);
        const ux = tx / tl, uy = ty / tl, nx = -uy, ny = ux;
        ctx.beginPath();
        ctx.moveTo(ex + ux * 10, ey + uy * 10);
        ctx.lineTo(ex - ux * 12 + nx * 9, ey - uy * 12 + ny * 9);
        ctx.lineTo(ex - ux * 12 - nx * 9, ey - uy * 12 - ny * 9);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
        // the back half of the motion ellipse, faint, behind nothing (drawn thin)
        ctx.save();
        ctx.strokeStyle = P.annBlue;
        ctx.globalAlpha = 0.45;
        ctx.lineWidth = 2;
        ctx.setLineDash([4, 9]);
        ctx.lineDashOffset = t * 96;
        ctx.beginPath();
        ctx.ellipse(540, 880, 176, 44, 0, 1.06 * Math.PI, 1.94 * Math.PI);
        ctx.stroke();
        ctx.restore();

        // annYellow fineness ruler beside the stream (draws on with the grounds)
        const rk = hit(B_GRIND, 6, E.outExpo);
        if (rk > 0) {
          L.ticks(ctx, 600, 1200, { length: 120, angle: Math.PI / 2, n: 20, len: 9, major: 5, majorLen: 20, side: 1, color: P.annYellow, alpha: 1, width: 2, p: rk });
          L.bracket(ctx, 586, 1236, 586, 1260, { style: 'square', cap: 10, color: P.annYellow, alpha: rk, width: 2.5, p: rk });
          // magnified grain circle linked to the ruler
          const mx = 690, my = 1248;
          ctx.save();
          ctx.globalAlpha = rk;
          ctx.strokeStyle = P.annYellow;
          ctx.lineWidth = 2.5;
          ctx.beginPath();
          ctx.arc(mx, my, 30 * rk, 0, TAU);
          ctx.stroke();
          ctx.beginPath();
          ctx.moveTo(624, 1248);
          ctx.lineTo(mx - 30 * rk, my);
          ctx.stroke();
          const mg = new Path2D();
          const rr = L.rng(sd('mag'));
          for (let i = 0; i < 26; i++) {
            const a = rr() * TAU, d = Math.sqrt(rr()) * 22 * rk;
            const x = mx + Math.cos(a) * d, y = my + Math.sin(a) * d;
            mg.moveTo(x + 2.2, y);
            mg.arc(x, y, rr.range(1.4, 2.6), 0, TAU);
          }
          ctx.fillStyle = P.grounds;
          ctx.fill(mg);
          ctx.restore();
        }

        // annYellow attention ring on the heap at its peak (8 frames)
        if (t >= B_PEAK && t < B_PEAK + 10 * FR) {
          const u = clamp((t - B_PEAK) / (10 * FR) + 0.1);
          ctx.save();
          ctx.strokeStyle = P.annYellow;
          ctx.globalAlpha = 1 - u * u;
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.ellipse(540, PF.rimY - 30, 120 + 70 * E.outExpo(u), 50 + 26 * E.outExpo(u), 0, 0, TAU);
          ctx.stroke();
          ctx.restore();
        }

        // annMagenta dose ring on the tamp (12 frames)
        if (t >= B_TAMP) {
          const u = clamp((t - B_TAMP) / (12 * FR) + 1 / 12);
          if (u < 1) {
            ctx.save();
            ctx.strokeStyle = P.annMagenta;
            ctx.globalAlpha = 1 - u * u;
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.ellipse(540, PF.rimY + 4, 170 + 110 * E.outExpo(u), 44 + 30 * E.outExpo(u), 0, 0, TAU);
            ctx.stroke();
            ctx.beginPath();
            ctx.ellipse(540, PF.rimY + 4, 160 + 50 * E.outExpo(u), 40 + 14 * E.outExpo(u), 0, 0, TAU);
            ctx.globalAlpha = 0.6 * (1 - u);
            ctx.lineWidth = 2;
            ctx.stroke();
            ctx.restore();
          }
          // a level line on the tamped puck (stays)
          const lv = new Path2D();
          lv.moveTo(372, PF.rimY + 1);
          lv.lineTo(708, PF.rimY + 1);
          stroke(ctx, lv, P.annMagenta, 0.9 * clamp((t - B_TAMP) / (6 * FR) + 1 / 6), 2.5, [14, 10]);
        }
      }
    },
  });
})();

</script>
<script>
// ---- src/scenes/17-espresso-schematic.js
// 17 espresso-schematic : "Nine bar, ninety-three degrees" (schematic, global T 33.00 to 35.25, hard cut)
// Act 4 (taza) starts here.
//
// The group head and portafilter in section, centred on x 540. Hot water comes down through the group
// head and the shower screen into the tamped puck (hex lattice); a pressure gauge at (180, 420) sweeps
// to its 9-bar tick; a temperature bracket on the right marks the brew band; the two G4 spouts at
// (505, 760) and (575, 760) start to run, the streams reach the G3 cup and its liquid level rises to
// the G3 liquid surface (540, 1102), rx 232, ry 60 on the last frame. No numbers anywhere.
//
// Layers, back to front:
//   1 blueprint plate, guide circles, construction lines, registration crosses
//   2 network: node glyphs (fine grounds, crema bubbles) and their curved links
//   3 the G3 cup in lavender 60 percent: saucer, foot, body, handle, rim; the liquid filling
//   4 the group head in section: walls, bore, dispersion chamber, shower screen, gasket
//   5 the portafilter in section: basket, puck lattice (wetting), body, handle, spouts
//   6 water: schemWater dashed flow lines, glow dots where water enters the puck, flow to the spouts
//   7 G4 streams (from T 34.125), first-drop glow dots
//   8 measurement: pressure gauge, temperature bracket and column, extraction timer, brackets
//   9 magenta moments (water arrives, 9 bar reached), progress glyph (stage 3, u = p)
(function () {
  'use strict';

  const ID = 'espresso-schematic';
  const LIB = FILM.lib;
  const TAU = Math.PI * 2;
  const DEG = Math.PI / 180;
  const FR = 1 / 24;

  const clamp = (v, a = 0, b = 1) => (v < a ? a : v > b ? b : v);
  const lerp = (a, b, u) => a + (b - a) * u;
  const sstep = (a, b, x) => {
    const u = clamp((x - a) / (b - a));
    return u * u * (3 - 2 * u);
  };
  const sd = (...k) => LIB.hash(ID, ...k) & 0x7fffffff;

  // beats (shot-local seconds)
  const B_WATER = 0.375; // T 33.375 water arrives (8th)
  const B_PRESS = 1.125; // T 34.125 9 bar reached, first drops (beat)
  const B_STREAM = 1.5; // T 34.50 streams reach the cup, filling starts

  // ---------------------------------------------------------------------------
  // Progress glyph: canonical, copied verbatim from docs/storyboard.md.
  function progressGlyph(ctx, L, stage, u, T, allLit) {
    const P = L.pal, cx = 900, cy = 300, r = 46, gap = 6 * Math.PI / 180;
    const q = Math.PI / 2, pop = L.clamp(u * 6);
    ctx.save();
    ctx.lineCap = 'round';
    ctx.globalAlpha = 0.5; ctx.strokeStyle = P.lavender; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(cx, cy, r + 14, 0, Math.PI * 2); ctx.stroke();
    for (let i = 0; i < 4; i++) {
      const a0 = -q + i * q + gap / 2, a1 = a0 + q - gap;
      const past = allLit || i < stage, cur = !allLit && i === stage;
      ctx.globalAlpha = past ? 0.6 : 0.18;
      ctx.strokeStyle = P.lavender; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(cx, cy, r, a0, a1); ctx.stroke();
      if (cur || allLit) {
        const k = allLit ? 1 : L.clamp(u);
        const ae = a0 + (a1 - a0) * k;
        ctx.globalAlpha = 1; ctx.strokeStyle = P.lineWhite; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.arc(cx, cy, r, a0, ae); ctx.stroke();
        if (cur) L.glowDot(ctx, cx + Math.cos(ae) * r, cy + Math.sin(ae) * r, 4 + 2 * pop, { rays: 0, glow: 3.5, intensity: 0.8 });
      }
    }
    ctx.globalAlpha = 0.7; ctx.fillStyle = P.lineWhite;
    ctx.beginPath(); ctx.arc(cx, cy, 3, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  // ---------------------------------------------------------------------------
  // helpers
  // ---------------------------------------------------------------------------
  function trace(ctx, pts, closed = true) {
    for (let i = 0; i < pts.length; i++) {
      if (i === 0) ctx.moveTo(pts[i][0], pts[i][1]);
      else ctx.lineTo(pts[i][0], pts[i][1]);
    }
    if (closed) ctx.closePath();
  }
  function pathOf(pts, closed = true) {
    const p = new Path2D();
    trace(p, pts, closed);
    return p;
  }
  function stroke(ctx, path, color, alpha, width, dash, dashOff) {
    ctx.save();
    ctx.strokeStyle = color;
    ctx.globalAlpha *= alpha;
    ctx.lineWidth = width;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    if (dash) {
      ctx.setLineDash(dash);
      ctx.lineDashOffset = dashOff || 0;
    }
    ctx.stroke(path);
    ctx.restore();
  }
  function fill(ctx, path, color, alpha) {
    ctx.save();
    ctx.fillStyle = color;
    ctx.globalAlpha *= alpha;
    ctx.fill(path);
    ctx.restore();
  }
  function arcPts(cx, cy, rx, ry, a0, a1, n = 32) {
    const out = [];
    for (let i = 0; i <= n; i++) {
      const a = lerp(a0, a1, i / n);
      out.push([cx + Math.cos(a) * rx, cy + Math.sin(a) * ry]);
    }
    return out;
  }
  // boil wobble of a polyline: shifts each point a little per 12 fps drawing
  function wob(L, pts, seed, amp, bi) {
    return pts.map((p, i) => [p[0] + (L.h3(i, bi, seed) - 0.5) * 2 * amp, p[1] + (L.h3(i, bi, seed + 7) - 0.5) * 2 * amp]);
  }
  // double lavender outline (art bible 3.2): outer 2.5 px at 85 percent and inner 1.5 px at 50 percent, 9 px apart
  function dbl(ctx, L, outer, inner, bi, seed, closed = true, a = 1) {
    const P = L.pal;
    stroke(ctx, pathOf(wob(L, outer, seed, 0.6, bi), closed), P.lavender, 0.85 * a, 2.5);
    if (inner) stroke(ctx, pathOf(wob(L, inner, seed + 3, 0.6, bi), closed), P.lavender, 0.5 * a, 1.5);
  }
  function bez(p0, p1, p2, p3, n = 24) {
    const out = [];
    for (let i = 0; i <= n; i++) {
      const u = i / n, v = 1 - u;
      out.push([v * v * v * p0[0] + 3 * v * v * u * p1[0] + 3 * v * u * u * p2[0] + u * u * u * p3[0], v * v * v * p0[1] + 3 * v * v * u * p1[1] + 3 * v * u * u * p2[1] + u * u * u * p3[1]]);
    }
    return out;
  }
  function offsetLine(pts, d) {
    const out = [];
    for (let i = 0; i < pts.length; i++) {
      const a = pts[Math.max(0, i - 1)], b = pts[Math.min(pts.length - 1, i + 1)];
      let tx = b[0] - a[0], ty = b[1] - a[1];
      const tl = Math.hypot(tx, ty) || 1;
      tx /= tl;
      ty /= tl;
      out.push([pts[i][0] - ty * d, pts[i][1] + tx * d]);
    }
    return out;
  }

  // ---------------------------------------------------------------------------
  // G3 cup (docs/storyboard.md, Shared geometry G3)
  // ---------------------------------------------------------------------------
  const CUP = { cx: 540, rimY: 1080, rx: 250, ry: 70, footY: 1395, footRx: 160, footRy: 34, liqY: 1102, liqRx: 232, liqRy: 60 };
  // the body's left side from the rim side point (290, 1080) curving in to the foot ellipse (380, 1395)
  const SIDE_L = bez([290, 1080], [288, 1250], [338, 1372], [380, 1395], 40);
  const SIDE_R = SIDE_L.map(([x, y]) => [1080 - x, y]);
  function cupHalf(y) {
    for (let i = 1; i < SIDE_L.length; i++) {
      if (SIDE_L[i][1] >= y) {
        const a = SIDE_L[i - 1], b = SIDE_L[i];
        const u = (y - a[1]) / (b[1] - a[1] || 1);
        return 540 - lerp(a[0], b[0], u);
      }
    }
    return CUP.footRx;
  }
  const HANDLE = bez([782, 1130], [880, 1110], [930, 1200], [905, 1240], 20).concat(bez([905, 1240], [885, 1300], [800, 1310], [752, 1300], 20).slice(1));

  // ---------------------------------------------------------------------------
  // scene
  // ---------------------------------------------------------------------------
  FILM.scene({
    id: ID,
    draw(ctx, tIn, info) {
      const L = info.lib, P = L.pal, E = L.ease;
      const dur = info.dur;
      let t = clamp(tIn, 0, dur);
      const tFrame = Math.round(t * 24) / 24;
      if (Math.abs(t - tFrame) < 1e-4) t = tFrame + 1e-7;
      const bi = L.boil(info.T);
      const lav = P.lavender, white = P.lineWhite, water = P.schemWater, mag = P.magenta;

      const drawing = (a) => Math.floor((t - a) * 12 + 1e-6);
      const hit = (a, frames, e, lead = 1) => {
        if (t < a) return 0;
        const u = clamp((t - a) / (frames * FR) + lead / frames);
        return e ? e(u) : u;
      };

      // state
      const wTop = t < B_WATER ? 0 : E.outCubic(clamp((t - B_WATER) / 0.375 + 1 / 9)); // water down to the screen
      const wPuck = clamp((t - 0.75) / (B_PRESS - 0.75)); // water through the puck
      const press = E.inOutCubic(clamp((t - B_WATER) / (B_PRESS - B_WATER)));
      const strm = t < B_PRESS ? 0 : E.outExpo(clamp((t - B_PRESS) / (B_STREAM - B_PRESS) + 1 / 9));
      const level = t < B_STREAM ? 0 : E.outQuad(clamp((t - B_STREAM) / (dur - B_STREAM - FR)));

      // ---- 1 plate and guides ------------------------------------------------------
      L.blueprint(ctx, { center: [540, 900], seed: 1717 });
      ctx.save();
      ctx.translate(540, 900);
      ctx.rotate(4 * DEG * (t / dur));
      L.guideCircle(ctx, 0, 0, 460, { alpha: 0.13 });
      L.ticks(ctx, 0, 0, { r: 460, n: 120, len: 6, major: 10, majorLen: 15, inward: true, color: lav, alpha: 0.2, width: 1 });
      L.guideCircle(ctx, 0, 0, 640, { alpha: 0.08 });
      L.guideCircle(ctx, 0, 0, 652, { alpha: 0.1, width: 1, dash: [2, 9] });
      ctx.restore();
      L.guideCircle(ctx, 540, 1250, 330, { alpha: 0.12, dash: [6, 8] });
      {
        const cons = new Path2D();
        cons.moveTo(540, 230);
        cons.lineTo(540, 1560);
        stroke(ctx, cons, lav, 0.16, 1, [10, 8]);
        const hl = new Path2D();
        for (const y of [300, 520, 640, 760, 1102]) {
          hl.moveTo(60, y);
          hl.lineTo(1020, y);
        }
        stroke(ctx, hl, lav, 0.1, 1, [3, 7]);
        const vl = new Path2D();
        for (const x of [505, 575]) {
          vl.moveTo(x, 700);
          vl.lineTo(x, 1500);
        }
        stroke(ctx, vl, lav, 0.12, 1, [2, 6]);
        const reg = new Path2D();
        for (const [x, y] of [[505, 760], [575, 760], [290, 1080], [790, 1080], [540, 1395], [540, 1102], [280, 300], [800, 300], [390, 640], [690, 640]]) {
          reg.moveTo(x - 9, y);
          reg.lineTo(x + 9, y);
          reg.moveTo(x, y - 9);
          reg.lineTo(x, y + 9);
        }
        stroke(ctx, reg, lav, 0.4, 1.2);
      }

      // ---- 2 network ------------------------------------------------------------------
      {
        const nodes = [
          { x: 168, y: 800, from: [390, 600], c1: [300, 640], c2: [190, 700], kind: 'grounds', on: 0 },
          { x: 880, y: 860, from: [590, 740], c1: [700, 760], c2: [860, 760], kind: 'bubbles', on: B_PRESS },
          { x: 158, y: 1040, from: [292, 1150], c1: [250, 1150], c2: [170, 1140], kind: 'timer', on: B_PRESS },
        ];
        for (let k = 0; k < nodes.length; k++) {
          const n = nodes[k];
          const a = n.on === 0 ? 1 : hit(n.on, 6, E.outExpo);
          if (a <= 0) continue;
          const link = bez(n.from, n.c1, n.c2, [n.x, n.y - 56], 30);
          const cut = link.slice(0, Math.max(2, Math.round(link.length * a)));
          stroke(ctx, pathOf(cut, false), lav, 0.4, 1.2);
          ctx.beginPath();
          ctx.arc(n.from[0], n.from[1], 3.5, 0, TAU);
          ctx.fillStyle = lav;
          ctx.globalAlpha = 0.7 * a;
          ctx.fill();
          ctx.globalAlpha = 1;
          if (a < 0.6) continue;
          const na = (a - 0.6) / 0.4;
          ctx.save();
          ctx.globalAlpha = na;
          L.guideCircle(ctx, n.x, n.y, 56, { alpha: 0.75, width: 1.5 });
          L.guideCircle(ctx, n.x, n.y, 47, { alpha: 0.35, width: 1 });
          ctx.save();
          ctx.beginPath();
          ctx.arc(n.x, n.y, 45, 0, TAU);
          ctx.clip();
          if (n.kind === 'grounds') {
            L.hexLattice(ctx, null, { r: 9, alpha: 0.3, bounds: { x: n.x - 50, y: n.y - 50, w: 100, h: 100 }, seed: sd('nodeHex'), dots: 2.2 });
          } else if (n.kind === 'bubbles') {
            const rr = L.rng(sd('bub'));
            const bp = new Path2D();
            for (let i = 0; i < 22; i++) {
              const ang = rr() * TAU, d = Math.sqrt(rr()) * 38;
              const rad = rr.range(3, 9);
              const x = n.x + Math.cos(ang) * d, y = n.y + Math.sin(ang) * d - ((t * 18 + i * 7) % 12);
              bp.moveTo(x + rad, y);
              bp.arc(x, y, rad, 0, TAU);
            }
            stroke(ctx, bp, white, 0.6, 1.2);
          } else {
            // extraction timer: sweeping hand over a tick ring (25 to 30 s band marked)
            L.ticks(ctx, n.x, n.y, { r: 36, n: 30, len: 5, major: 5, majorLen: 9, inward: true, color: white, alpha: 0.6, width: 1.2 });
            L.arcAnnotation(ctx, n.x, n.y, 28, -Math.PI / 2 + TAU * (25 / 30) * 0.95, -Math.PI / 2 + TAU * 0.98, { color: lav, alpha: 0.8, width: 2, endTicks: 6 });
            const ha = -Math.PI / 2 + TAU * clamp((t - B_PRESS) / (dur - B_PRESS)) * 0.92;
            const hp = new Path2D();
            hp.moveTo(n.x, n.y);
            hp.lineTo(n.x + Math.cos(ha) * 32, n.y + Math.sin(ha) * 32);
            stroke(ctx, hp, white, 0.95, 2);
          }
          ctx.restore();
          ctx.restore();
        }
      }

      // ---- 3 the G3 cup (lavender 60 percent) ------------------------------------------
      {
        const a = 0.6 / 0.85; // dbl() draws the outer at 85 percent: scale it to 60
        // saucer and well
        const sauc = arcPts(540, 1420, 400, 96, 0, TAU, 96);
        dbl(ctx, L, sauc, arcPts(540, 1420, 391, 89, 0, TAU, 96), bi, sd('sauc'), true, a);
        stroke(ctx, pathOf(arcPts(540, 1434, 400, 96, 0.05, Math.PI - 0.05, 60), false), lav, 0.35, 1.5);
        stroke(ctx, pathOf(wob(L, arcPts(540, 1420, 190, 44, 0, TAU, 64), sd('well'), 0.5, bi)), lav, 0.45, 1.5);
        // foot
        stroke(ctx, pathOf(wob(L, arcPts(540, CUP.footY, CUP.footRx, CUP.footRy, 0, TAU, 64), sd('foot'), 0.5, bi)), lav, 0.5, 1.5);
        // body sides and the bottom of the bowl
        // left side down, the front of the foot from left to right, right side up
        const frontFix = SIDE_L.concat(arcPts(540, CUP.footY, CUP.footRx, CUP.footRy, Math.PI, 0, 40).map(([x, y]) => [x, 2 * CUP.footY - y]).slice(1)).concat(SIDE_R.slice().reverse().slice(1));
        const innerSide = frontFix.map(([x, y]) => [540 + (x - 540) * 0.95, y - 4]);
        dbl(ctx, L, frontFix, innerSide, bi, sd('body'), false, a);
        // handle loop, 26 px band
        const hOut = offsetLine(HANDLE, -13), hIn = offsetLine(HANDLE, 13);
        stroke(ctx, pathOf(wob(L, hOut, sd('hO'), 0.5, bi), false), lav, 0.6, 2.5);
        stroke(ctx, pathOf(wob(L, hIn, sd('hI'), 0.5, bi), false), lav, 0.45, 1.5);
        stroke(ctx, pathOf(HANDLE, false), lav, 0.14, 1, [4, 6]);

        // the liquid filling: level from the bottom to the G3 liquid surface
        const yL = lerp(1372, CUP.liqY, level);
        const k = (cupHalf(yL) - 18) / (cupHalf(CUP.liqY) - 18);
        const lrx = CUP.liqRx * k, lry = CUP.liqRy * k;
        if (t >= B_STREAM) {
          // liquid body clipped to the inside of the cup
          const inner = SIDE_L.map(([x, y]) => [540 + (x - 540) * 0.93, y]).concat(arcPts(540, CUP.footY - 6, CUP.footRx * 0.92, CUP.footRy * 0.9, Math.PI, 0, 30).map(([x, y]) => [x, 2 * (CUP.footY - 6) - y])).concat(SIDE_R.map(([x, y]) => [540 + (x - 540) * 0.93, y]).reverse());
          ctx.save();
          ctx.beginPath();
          trace(ctx, inner, true);
          ctx.clip();
          ctx.beginPath();
          ctx.rect(0, yL, 1080, 400);
          ctx.ellipse(540, yL, lrx, lry, 0, 0, Math.PI, true);
          ctx.clip('evenodd');
          const hl = new Path2D();
          for (let y = yL - lry; y < 1440; y += 9) {
            hl.moveTo(250, y);
            hl.lineTo(830, y);
          }
          stroke(ctx, hl, lav, 0.32, 1);
          ctx.restore();
          // the level ellipse: lineWhite, the surface glow when it lands on G3
          ctx.save();
          ctx.beginPath();
          ctx.ellipse(540, yL, lrx, lry, 0, 0, TAU);
          ctx.fillStyle = P.navyLight;
          ctx.globalAlpha = 0.6;
          ctx.fill();
          ctx.restore();
          // the foam cap: a fine bubble lattice on the surface, thickening as the cup fills
          L.hexLattice(ctx, arcPts(540, yL, lrx - 4, lry - 2, 0, TAU, 48), { r: 7, alpha: 0.12 + 0.2 * level, seed: sd('foam'), jitter: 1.4 });
          ctx.save();
          ctx.beginPath();
          ctx.ellipse(540, yL, lrx, lry, 0, 0, TAU);
          ctx.globalAlpha = 0.9;
          ctx.strokeStyle = white;
          ctx.lineWidth = 2;
          ctx.stroke();
          ctx.restore();
          // ripple rings where the streams land
          for (const x of [505, 575]) {
            for (let r = 0; r < 2; r++) {
              const ph = ((t * 2.4 + r * 0.5 + (x > 540 ? 0.25 : 0)) % 1);
              ctx.save();
              ctx.strokeStyle = white;
              ctx.globalAlpha = 0.55 * (1 - ph);
              ctx.lineWidth = 1.2;
              ctx.beginPath();
              ctx.ellipse(x, yL, 8 + 34 * ph * k, (8 + 34 * ph * k) * (lry / lrx), 0, 0, TAU);
              ctx.stroke();
              ctx.restore();
            }
          }
        } else {
          stroke(ctx, pathOf(arcPts(540, CUP.liqY, CUP.liqRx, CUP.liqRy, 0, TAU, 64)), lav, 0.28, 1.2, [6, 7]);
        }
        // rim, 12 px thick
        dbl(ctx, L, arcPts(540, CUP.rimY, CUP.rx, CUP.ry, 0, TAU, 96), null, bi, sd('rim'), true, a);
        stroke(ctx, pathOf(wob(L, arcPts(540, CUP.rimY, CUP.rx - 12, CUP.ry - 9, 0, TAU, 96), sd('rimIn'), 0.5, bi)), lav, 0.45, 1.5);
        // brackets: the cup height and the liquid surface width (no numbers)
        L.bracket(ctx, 250, 1080, 250, 1395, { alpha: 0.4, cap: 12, width: 1.2, offset: 0 });
        L.bracket(ctx, 308, 1196, 772, 1196, { alpha: 0.32 * (t >= B_STREAM ? 1 : 0.5), cap: 10, width: 1.2 });
      }

      // ---- 4 group head in section ------------------------------------------------------
      const GH = { x0: 280, x1: 800, y0: 300, y1: 520 };
      {
        const outer = L.rrectPts(GH.x0, GH.y0, GH.x1 - GH.x0, GH.y1 - GH.y0, 22, 12);
        const inner = L.rrectPts(GH.x0 + 9, GH.y0 + 9, GH.x1 - GH.x0 - 18, GH.y1 - GH.y0 - 18, 15, 12);
        // section hatch in the solid metal (outer shape minus the bore and the dispersion chamber)
        const bore = [[518, GH.y0 - 60], [562, GH.y0 - 60], [562, 470], [518, 470]];
        const chamber = L.rrectPts(352, 466, 376, 40, 10, 12);
        ctx.save();
        ctx.beginPath();
        trace(ctx, outer, true);
        trace(ctx, bore, true);
        trace(ctx, chamber, true);
        ctx.clip('evenodd');
        const sh = new Path2D();
        for (let k = -600; k < 700; k += 12) {
          sh.moveTo(GH.x0 + k, GH.y1);
          sh.lineTo(GH.x0 + k + 240, GH.y0 - 20);
        }
        stroke(ctx, sh, lav, 0.14, 1);
        ctx.restore();
        dbl(ctx, L, outer, inner, bi, sd('gh'));
        // inlet pipe from the top (boiler) and the valve block
        dbl(ctx, L, [[518, 230], [518, GH.y0 + 4]], null, bi, sd('bL'), false);
        dbl(ctx, L, [[562, 230], [562, GH.y0 + 4]], null, bi, sd('bR'), false);
        stroke(ctx, pathOf(wob(L, bore.slice(1, 3).concat([]), sd('boreR'), 0.5, bi), false), lav, 0.5, 1.5);
        stroke(ctx, pathOf(wob(L, [bore[0], bore[3]], sd('boreL'), 0.5, bi), false), lav, 0.5, 1.5);
        dbl(ctx, L, L.rrectPts(470, 232, 140, 40, 8, 10), null, bi, sd('valve'));
        stroke(ctx, pathOf(L.rrectPts(484, 242, 112, 20, 5, 10)), lav, 0.35, 1);
        // dispersion chamber and its plate holes
        stroke(ctx, pathOf(wob(L, chamber, sd('ch'), 0.5, bi)), lav, 0.6, 1.5);
        const holes = new Path2D();
        for (let x = 372; x <= 708; x += 24) {
          holes.moveTo(x, 466);
          holes.lineTo(x, 456);
        }
        stroke(ctx, holes, lav, 0.4, 1);
        // shower screen at y 520: a line with a row of perforations
        stroke(ctx, pathOf(wob(L, [[360, 520], [720, 520]], sd('screen'), 0.4, bi), false), white, 0.75, 1.8);
        const perf = new Path2D();
        for (let x = 368; x <= 712; x += 8) {
          perf.moveTo(x + 1.2, 514);
          perf.arc(x, 514, 1.2, 0, TAU);
        }
        fill(ctx, perf, lav, 0.6);
        // gasket blocks
        for (const x of [344, 704]) {
          const gk = L.rrectPts(x, 506, 32, 16, 4, 6);
          fill(ctx, pathOf(gk), lav, 0.25);
          stroke(ctx, pathOf(gk), lav, 0.6, 1.2);
        }
        // fixing bolts
        for (const x of [312, 768]) {
          L.guideCircle(ctx, x, 340, 10, { alpha: 0.6, width: 1.2, cross: 6 });
        }
      }

      // ---- 5 portafilter in section ------------------------------------------------------
      {
        // body outline: ears at the gasket, walls down, funnel into the spout block
        const outer = [[338, 522], [338, 640], [356, 676], [420, 700], [496, 704], [496, 716], [584, 716], [584, 704], [660, 700], [724, 676], [742, 640], [742, 522]];
        const inner = [[347, 528], [347, 636], [362, 668], [422, 691], [500, 695], [580, 695], [658, 691], [718, 668], [733, 636], [733, 528]];
        // basket: thin wall around the puck with a perforated floor at y 650
        const basket = [[382, 522], [384, 652], [696, 652], [698, 522]];
        ctx.save();
        ctx.beginPath();
        trace(ctx, outer, true);
        ctx.clip();
        ctx.beginPath();
        trace(ctx, basket, true);
        ctx.rect(400, 652, 280, 40);
        ctx.rect(0, 0, 1080, 1920);
        ctx.clip('evenodd');
        const sh = new Path2D();
        for (let k = -400; k < 600; k += 12) {
          sh.moveTo(338 + k, 716);
          sh.lineTo(338 + k + 200, 500);
        }
        stroke(ctx, sh, lav, 0.14, 1);
        ctx.restore();
        dbl(ctx, L, outer, inner, bi, sd('pf'), false);
        stroke(ctx, pathOf(wob(L, basket, sd('basket'), 0.4, bi), false), lav, 0.75, 1.8);
        const floor = new Path2D();
        for (let x = 392; x < 690; x += 10) {
          floor.moveTo(x, 652);
          floor.lineTo(x + 6, 652);
        }
        stroke(ctx, floor, white, 0.7, 1.6);
        // handle off to the left (to x 110)
        const hTop = [[338, 572], [250, 586], [160, 598], [116, 604]], hBot = [[338, 612], [250, 620], [160, 632], [116, 638]];
        dbl(ctx, L, hTop, null, bi, sd('hT'), false);
        dbl(ctx, L, hBot, null, bi, sd('hB'), false);
        stroke(ctx, pathOf(wob(L, arcPts(116, 621, 12, 17, Math.PI / 2, Math.PI * 1.5, 12), sd('hE'), 0.4, bi), false), lav, 0.85, 2.5);
        stroke(ctx, pathOf([[300, 598], [128, 621]], false), lav, 0.18, 1, [5, 6]);
        // the two spouts down to the G4 tips (505, 760) and (575, 760)
        for (const [sx, tx] of [[516, 505], [564, 575]]) {
          const sp = [[sx - 10, 716], [tx - 9, 758], [tx + 9, 758], [sx + 10, 716]];
          dbl(ctx, L, sp, null, bi, sd('spout', tx), false);
          stroke(ctx, pathOf(arcPts(tx, 759, 9, 3, 0, TAU, 16)), lav, 0.8, 1.5);
        }
        // the puck: hex lattice, wetting as the water front passes
        const puck = [[390, 530], [690, 530], [690, 640], [390, 640]];
        const wetY = 530 + 110 * wPuck;
        L.hexLattice(ctx, puck, {
          r: 14,
          alpha: 0.38,
          seed: sd('puck'),
          cellFn: (cx, cy) => (wPuck > 0 && cy < wetY ? { fill: water, alpha: 0.16 } : true),
        });
        dbl(ctx, L, puck, [[399, 539], [681, 539], [681, 631], [399, 631]], bi, sd('puckO'));
        // tamped-flat bracket on the puck (thickness)
        L.bracket(ctx, 372, 530, 372, 640, { style: 'square', cap: 8, alpha: 0.6, width: 1.5 });
      }

      // ---- 6 water ---------------------------------------------------------------------
      if (wTop > 0) {
        const xs = [];
        for (let i = 0; i < 8; i++) xs.push(410 + i * 37);
        const yFront = lerp(286, 528, wTop);
        const fl = new Path2D();
        for (const x of xs) {
          // from the bore, the water spreads through the chamber to eight parallel lines
          fl.moveTo(540, 240);
          fl.lineTo(540, 300);
          fl.moveTo(x, 300);
          fl.lineTo(x, yFront);
        }
        stroke(ctx, fl, water, 0.9, 2, [12, 8], -t * 140);
        // spread bar in the chamber
        if (yFront > 470) stroke(ctx, pathOf([[410, 486], [669, 486]], false), water, 0.6, 2, [6, 6], -t * 80);
        // arrowheads at the front
        const ah = new Path2D();
        for (const x of xs) {
          const y = Math.min(yFront, 528);
          ah.moveTo(x - 6, y - 9);
          ah.lineTo(x, y);
          ah.lineTo(x + 6, y - 9);
        }
        stroke(ctx, ah, water, 1, 2);
        // inside the puck: thin wavering paths as the front soaks down
        if (wPuck > 0) {
          const pp = new Path2D();
          for (const x of xs) {
            pp.moveTo(x, 532);
            const yEnd = 532 + 106 * wPuck;
            for (let y = 532; y <= yEnd; y += 6) pp.lineTo(x + 5 * Math.sin(y * 0.11 + x), y);
          }
          stroke(ctx, pp, water, 0.75, 1.5, [4, 4], -t * 60);
          // glow dots where the water enters the puck
          for (let i = 0; i < xs.length; i++) {
            const tw = 0.7 + 0.3 * Math.sin(t * 9 + i * 1.3);
            L.glowDot(ctx, xs[i], 531, 4.5 * tw, { color: water, rays: 0, glow: 4, intensity: 0.75 });
          }
        }
        // below the puck: converging flow to the spouts
        if (t >= B_PRESS - 3 * FR) {
          const cv = new Path2D();
          for (const x of xs) {
            const tx = x < 540 ? 505 : 575;
            cv.moveTo(x, 656);
            cv.quadraticCurveTo(x, 688, tx, 712);
            cv.lineTo(tx, 752);
          }
          stroke(ctx, cv, white, 0.55, 1.2, [5, 6], -t * 90);
        }
      }

      // ---- 7 G4 streams ----------------------------------------------------------------
      if (t >= B_PRESS) {
        const yL = lerp(1372, CUP.liqY, level);
        const yEnd = lerp(760, yL, strm);
        for (const x of [505, 575]) {
          const len = Math.max(0, yEnd - 760);
          const wAt = (y) => lerp(14, 9, clamp((y - 760) / (CUP.liqY - 760))) / 2;
          if (len > 2) {
            const L0 = [], R0 = [];
            for (let y = 760; y <= yEnd; y += 12) {
              const w = wAt(y);
              L0.push([x - w, y]);
              R0.push([x + w, y]);
            }
            L0.push([x - wAt(yEnd), yEnd]);
            R0.push([x + wAt(yEnd), yEnd]);
            const shape = L0.concat(R0.reverse());
            fill(ctx, pathOf(shape), lav, 0.3);
            stroke(ctx, pathOf(wob(L, L0, sd('sl', x), 0.5, bi), false), white, 0.9, 1.5);
            stroke(ctx, pathOf(wob(L, R0, sd('sr', x), 0.5, bi), false), white, 0.9, 1.5);
            const core = new Path2D();
            core.moveTo(x, 762);
            core.lineTo(x, yEnd);
            stroke(ctx, core, white, 0.8, 1.2, [10, 12], -t * 220);
          }
          // first drops: glow dot at the tip, popping on the beat
          const dk = hit(B_PRESS, 6, E.outBack);
          L.glowDot(ctx, x, 762, 5 + 3 * dk * (1 - clamp((t - B_PRESS) / 0.5)), { color: P.glow, rays: 8, rayLen: 2.6, glow: 4, intensity: 0.85, seed: sd('drop', x) });
          if (strm < 1) L.glowDot(ctx, x, yEnd, 4, { color: P.glow, rays: 0, glow: 3, intensity: 0.7 });
        }
      }

      // ---- 8 measurement -----------------------------------------------------------------
      // the fall of the streams: a tick ruler on the left and a bracket on the right
      {
        const rk = hit(B_PRESS, 6, E.outExpo);
        L.ticks(ctx, 466, 760, { length: CUP.liqY - 760, angle: Math.PI / 2, n: 19, len: 7, major: 3, majorLen: 14, side: -1, color: lav, alpha: 0.4, width: 1.2, p: 0.25 + 0.75 * rk });
        if (rk > 0) L.bracket(ctx, 612, 760, 612, CUP.liqY, { alpha: 0.5 * rk, cap: 12, width: 1.2, p: rk });
        // a pressure tick ring around the group head, brightening with the pressure
        L.ticks(ctx, 540, 410, { r: 300, n: 72, len: 8, start: -168 * DEG, span: 156 * DEG, major: 6, majorLen: 16, color: lav, alpha: 0.18 + 0.32 * press, width: 1.2 });
        L.arcAnnotation(ctx, 540, 410, 286, -168 * DEG, (-168 + 156 * press) * DEG, { color: water, alpha: 0.35, width: 1.5, endTicks: 0 });
      }
      // pressure gauge at (180, 420), radius 70
      {
        const gx = 180, gy = 420;
        const angOf = (bar) => (135 + (bar / 12) * 270) * DEG;
        dbl(ctx, L, arcPts(gx, gy, 70, 70, 0, TAU, 72), arcPts(gx, gy, 61, 61, 0, TAU, 72), bi, sd('gauge'));
        L.ticks(ctx, gx, gy, { r: 58, n: 48, len: 5, start: angOf(0), span: 270 * DEG, major: 4, majorLen: 11, inward: true, color: white, alpha: 0.6, width: 1.5 });
        // last tick at 12 (span covers 0..12 exclusive), draw it
        const tk = new Path2D();
        tk.moveTo(gx + Math.cos(angOf(12)) * 58, gy + Math.sin(angOf(12)) * 58);
        tk.lineTo(gx + Math.cos(angOf(12)) * 47, gy + Math.sin(angOf(12)) * 47);
        stroke(ctx, tk, white, 0.6, 1.5);
        // brew band 8 to 10 and the marked 9-bar tick
        L.arcAnnotation(ctx, gx, gy, 42, angOf(8), angOf(10), { color: lav, alpha: 0.75, width: 3, endTicks: 0 });
        const a9 = angOf(9);
        const m9 = new Path2D();
        m9.moveTo(gx + Math.cos(a9) * 64, gy + Math.sin(a9) * 64);
        m9.lineTo(gx + Math.cos(a9) * 40, gy + Math.sin(a9) * 40);
        stroke(ctx, m9, white, 1, 2.5);
        const tri = new Path2D();
        const ox = gx + Math.cos(a9) * 76, oy = gy + Math.sin(a9) * 76;
        const nx = Math.cos(a9), ny = Math.sin(a9);
        tri.moveTo(ox - nx * 4, oy - ny * 4);
        tri.lineTo(ox + nx * 8 - ny * 6, oy + ny * 8 + nx * 6);
        tri.lineTo(ox + nx * 8 + ny * 6, oy + ny * 8 - nx * 6);
        tri.closePath();
        fill(ctx, tri, white, 0.9);
        // the needle: 0 to 9 bar from T 33.375 to T 34.125 (inOutCubic), pump pulse after
        const pulse = t > B_PRESS ? 0.12 * Math.sin(t * 40) : 0;
        const na = angOf(9 * press + pulse);
        const nd = new Path2D();
        nd.moveTo(gx - Math.cos(na) * 12, gy - Math.sin(na) * 12);
        nd.lineTo(gx + Math.cos(na) * 52, gy + Math.sin(na) * 52);
        stroke(ctx, nd, white, 1, 2.5);
        L.glowDot(ctx, gx, gy, 5, { rays: 0, glow: 3, intensity: 0.7 });
        // swept arc behind the needle
        if (press > 0) L.arcAnnotation(ctx, gx, gy, 30, angOf(0), na, { color: water, alpha: 0.6, width: 2, endTicks: 0 });
        // pipe to the group head
        stroke(ctx, pathOf([[gx + 70, gy], [GH.x0, gy]], false), lav, 0.6, 1.5);
        stroke(ctx, pathOf([[gx + 70, gy + 9], [GH.x0, gy + 9]], false), lav, 0.35, 1);
        if (press > 0) stroke(ctx, pathOf([[gx + 72, gy + 4.5], [GH.x0 - 2, gy + 4.5]], false), water, 0.8, 1.5, [5, 5], -t * 60);
        // the gauge's own bracket (radius)
        L.bracket(ctx, gx - 70, gy + 96, gx + 70, gy + 96, { alpha: 0.4, cap: 10, width: 1.2 });
      }
      // temperature: a column and a bracket on the right (x 900), the 90 to 96 band and the 93 tick
      {
        const bx = 900, y0 = 384, y1 = 650;
        const cx = 852;
        dbl(ctx, L, L.rrectPts(cx - 9, y0, 18, y1 - y0 - 14, 9, 8), null, bi, sd('therm'));
        dbl(ctx, L, arcPts(cx, y1, 16, 16, 0, TAU, 32), null, bi, sd('bulb'));
        const tLevel = lerp(0.18, 0.62, E.outCubic(clamp((t - B_WATER) / 0.75)));
        const yT = lerp(y1 - 14, y0 + 6, tLevel);
        fill(ctx, pathOf(L.rrectPts(cx - 4, yT, 8, y1 - yT, 4, 6)), water, 0.75);
        fill(ctx, pathOf(arcPts(cx, y1, 10, 10, 0, TAU, 24)), water, 0.75);
        L.bracket(ctx, bx, y0, bx, y1, { style: 'square', cap: 16, alpha: 0.6, width: 1.5 });
        L.ticks(ctx, bx, y0, { length: y1 - y0, angle: Math.PI / 2, n: 20, len: 8, major: 5, majorLen: 16, side: 1, baseline: false, color: white, alpha: 0.55, width: 1.5 });
        // brew band and the marked tick (93 sits at 62 percent of the column)
        const yB0 = lerp(y1 - 14, y0 + 6, 0.56), yB1 = lerp(y1 - 14, y0 + 6, 0.68);
        L.bracket(ctx, 924, yB1, 924, yB0, { style: 'square', cap: 8, alpha: 0.75, width: 1.5 });
        const y93 = lerp(y1 - 14, y0 + 6, 0.62);
        const mk = new Path2D();
        mk.moveTo(868, y93);
        mk.lineTo(918, y93);
        stroke(ctx, mk, white, 1, 2.5);
        const tri = new Path2D();
        tri.moveTo(936, y93);
        tri.lineTo(928, y93 - 6);
        tri.lineTo(928, y93 + 6);
        tri.closePath();
        fill(ctx, tri, white, 0.9);
        stroke(ctx, pathOf([[GH.x1, 440], [cx - 9, 440]], false), lav, 0.4, 1, [4, 5]);
      }

      // ---- 9 magenta moments and the progress glyph -----------------------------------
      {
        // water arrives at the shower screen (8 frames)
        const ws = clamp((t - (B_WATER + 0.375)) / (8 * FR) + 1 / 8);
        if (t >= B_WATER + 0.375 && ws < 1) {
          stroke(ctx, pathOf([[360, 521], [720, 521]], false), mag, 1 - ws, 3);
        }
        // 9 bar reached (12 frames): a ring on the gauge, a flash on the marked tick
        if (t >= B_PRESS) {
          const u = clamp((t - B_PRESS) / (12 * FR) + 1 / 12);
          if (u < 1) {
            ctx.save();
            ctx.strokeStyle = mag;
            ctx.globalAlpha = 1 - u * u;
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.arc(180, 420, 74 + 40 * E.outExpo(u), 0, TAU);
            ctx.stroke();
            const a9 = (135 + 202.5) * DEG;
            ctx.beginPath();
            ctx.moveTo(180 + Math.cos(a9) * 66, 420 + Math.sin(a9) * 66);
            ctx.lineTo(180 + Math.cos(a9) * 38, 420 + Math.sin(a9) * 38);
            ctx.stroke();
            ctx.restore();
          }
        }
      }
      progressGlyph(ctx, L, 3, info.p, info.T, false);
    },
  });
})();

</script>
<script>
// ---- src/scenes/18-pour-crema.js
// 18 pour-crema : "Tiger stripes and crema" (illustrated, global T 35.25 to 37.50, hard cut)
//
// The inked portafilter spouts at G4 (505, 760) and (575, 760) pour two streams straight down into
// the ceramic G3 cup (rim (540, 1080) rx 250 ry 70, liquid surface (540, 1102) rx 232 ry 60) on its
// saucer, a teaspoon at the right. The surface goes from dark espresso to caramel crema with tiger
// mottling by T 36.375; the streams go honey-coloured and thin, and cut off on the beat T 36.75 (top
// first, the last drops fall over 6 frames). On the 8th T 37.125 an annYellow ring pops around the
// crema and a first wisp of steam rises. The last frame (full cup, caramel crema, first wisp) is the
// first frame of 19, which starts on the same cup at G3. Cup, saucer and streams are screen-fixed.
//
// Layers, back to front:
//   1 stripes stripeCream / stripeYellow (drift 6 px per beat)
//   2 espresso machine: top band, group head, drip-tray grate behind the saucer, tray front
//   3 saucer with its well, the cup's cast shadow, teaspoon
//   4 cup: body with contour hatching, handle, inner wall, crema surface (clipped to the inner rim), rim
//   5 portafilter: ring, basket bowl, wooden handle, spout fork and the two nozzles ending on G4
//   6 streams (on twos), impact ripples, cut-off and last drops
//   7 steam wisp (from T 37.125)
//   8 overlays: annBlue flow arrows, annYellow crema ring, construction lines
(function () {
  'use strict';

  const ID = 'pour-crema';
  const LIB = FILM.lib;
  const TAU = Math.PI * 2;
  const DEG = Math.PI / 180;
  const FR = 1 / 24;

  const clamp = (v, a = 0, b = 1) => (v < a ? a : v > b ? b : v);
  const lerp = (a, b, u) => a + (b - a) * u;
  const sstep = (a, b, x) => {
    const u = clamp((x - a) / (b - a));
    return u * u * (3 - 2 * u);
  };
  const sd = (...k) => LIB.hash(ID, ...k) & 0x7fffffff;

  // beats (shot-local seconds)
  const B_CREMA = 1.125; // T 36.375 crema fully caramel
  const B_CUT = 1.5; // T 36.75 streams cut off (beat)
  const B_RING = 1.875; // T 37.125 ring pops, first wisp of steam (8th)

  // ---------------------------------------------------------------------------
  // helpers
  // ---------------------------------------------------------------------------
  function trace(ctx, pts, closed = true) {
    for (let i = 0; i < pts.length; i++) {
      if (i === 0) ctx.moveTo(pts[i][0], pts[i][1]);
      else ctx.lineTo(pts[i][0], pts[i][1]);
    }
    if (closed) ctx.closePath();
  }
  function fillPoly(ctx, pts, color, alpha = 1) {
    ctx.save();
    ctx.globalAlpha *= alpha;
    ctx.fillStyle = color;
    ctx.beginPath();
    trace(ctx, pts, true);
    ctx.fill();
    ctx.restore();
  }
  function stroke(ctx, path, color, alpha, width, dash, dashOff) {
    ctx.save();
    ctx.strokeStyle = color;
    ctx.globalAlpha *= alpha;

        stroke(ctx, bhl, P.white, 0.9, 5);
        // spout stem and fork, two nozzles ending exactly on the G4 tips (505, 760) and (575, 760)
        const stem = [[516, 598], [564, 598], [562, 650], [518, 650]];
        ink(stem, { closed: true, width: 3, fill: steel, seed: sd('stem'), smooth: false });
        L.hatch(ctx, stem, { angle: 0.04, spacing: 5, width: 1.2, color: steelDeep, alpha: 0.9, length: [6, 18], seed: sd('stemH'), density: (x) => sstep(540, 562, x) });
        const fork = [[490, 646], [590, 646], [596, 676], [484, 676]];
        ink(fork, { closed: true, width: 3, fill: steelLight, seed: sd('fork'), smooth: false });
        L.hatch(ctx, fork, { angle: -Math.PI / 4, spacing: 5, width: 1.2, color: steelDeep, alpha: 0.85, seed: sd('forkH'), density: (x) => sstep(550, 596, x) });
        for (const x of [505, 575]) {
          const nz = [[x - 13, 676], [x + 13, 676], [x + 10, 760], [x - 10, 760]];
          ink(nz, { closed: true, width: 3, fill: steel, seed: sd('nozzle', x), smooth: false });
          L.hatch(ctx, nz, { angle: 0.04, spacing: 4, width: 1.2, color: steelDeep, alpha: 0.9, length: [4, 12], seed: sd('nozH', x), density: (xx) => sstep(x - 2, x + 10, xx) });
          const nh = new Path2D();
          nh.moveTo(x - 6, 682);
          nh.lineTo(x - 5, 750);
          stroke(ctx, nh, P.white, 0.85, 2.5);
          ink(L.ellipsePts(x, 760, 10, 4, 16), { closed: true, width: 2, fill: P.ink, seed: sd('tip', x), wobble: 0.2 });
        }
      }

      // ---- 6 streams --------------------------------------------------------------------------------
      {
        const k = drawing(0);
        const s = sstep(0.1, 1.45, tw); // dark to honey
        const col = s < 0.55 ? L.mix(P.espresso, P.crema, s / 0.55) : L.mix(P.crema, P.cremaLight, (s - 0.55) / 0.45 * 0.6);
        const thin = 1 - 0.42 * sstep(0.95, 1.5, tw);
        const G = 10944; // px/s2: the cut stream's top falls 342 px in 6 frames
        const cutT = tw - B_CUT;
        const yTop = cutT < 0 ? 760 : 760 + 0.5 * G * cutT * cutT;
        const yBot = CUP.liqY;
        for (const x0 of [505, 575]) {
          if (yTop < yBot - 2) {
            const Lp = [], Rp = [];
            for (let y = yTop; y <= yBot; y += 10) {
              const f = (y - 760) / (yBot - 760);
              const w = lerp(14, 9, f) * 0.5 * thin;
              const wv = 1.6 * Math.sin(y * 0.045 + k * 1.9 + x0) * (0.3 + f);
              Lp.push([x0 - w + wv, y]);
              Rp.push([x0 + w + wv, y]);
            }
            const wb = 4.5 * thin;
            Lp.push([x0 - wb, yBot]);
            Rp.push([x0 + wb, yBot]);
            const shape = Lp.concat(Rp.slice().reverse());
            fillPoly(ctx, shape, col);
            // tiger bands travelling down the stream (flat per drawing)
            ctx.save();
            ctx.beginPath();
            trace(ctx, shape, true);
            ctx.clip();
            const tb = new Path2D();
            for (let y = 760 + ((k * 23 + (x0 > 540 ? 11 : 0)) % 34); y < yBot; y += 34) {
              if (y < yTop) continue;
              tb.moveTo(x0 - 8, y);
              tb.quadraticCurveTo(x0, y + 7, x0 + 8, y + 2);
            }
            stroke(ctx, tb, s < 0.5 ? P.beanMedium : P.cremaLight, 0.7, 2.6);
            const core = new Path2D();
            core.moveTo(x0 - 1.5 * thin, Math.max(yTop, 762));
            core.lineTo(x0 - 1 * thin, yBot - 4);
            stroke(ctx, core, s < 0.5 ? P.crema : P.white, 0.75, 1.4);
            ctx.restore();
            ink(Lp, { width: 1.8, seed: sd('sL', x0, k % 3), taper: [4, 4], wobble: 0.4 });
            ink(Rp, { width: 1.8, seed: sd('sR', x0, k % 3), taper: [4, 4], wobble: 0.4 });
          }
          // last drops after the cut: two drops released from the tip, one drawing apart
          if (cutT >= 0) {
            for (let d = 1; d <= 2; d++) {
              const rel = cutT - d / 12;
              if (rel < 0) {
                // hanging at the tip, swelling
                if (d === 1 || rel > -1 / 12) {
                  const sw = clamp(1 + rel * 12);
                  ctx.save();
                  ctx.fillStyle = col;
                  ctx.beginPath();
                  ctx.ellipse(x0, 763 + 3 * sw, 3 + 2 * sw, 3 + 3 * sw, 0, 0, TAU);
                  ctx.fill();
                  ctx.restore();
                }
                continue;
              }
              const y = 766 + 0.5 * G * rel * rel;
              if (y > yBot) continue;
              const dp = [[x0, y - 13], [x0 + 5, y - 2], [x0 + 4.5, y + 3], [x0, y + 6], [x0 - 4.5, y + 3], [x0 - 5, y - 2]];
              ink(dp, { closed: true, width: 1.6, fill: col, seed: sd('drop', x0, d), taper: 0, wobble: 0.2 });
            }
          }
          // impact ripples on the crema while pouring, plus a ring for each last drop
          const pour = tw < B_CUT + 0.3 ? 1 - clamp((tw - B_CUT) / 0.3) : 0;
          for (let r = 0; r < 3; r++) {
            const ph = (t * 2.2 + r / 3 + (x0 > 540 ? 0.17 : 0)) % 1;
            const a = pour * (1 - ph);
            if (a <= 0.02) continue;
            ctx.save();
            ctx.strokeStyle = P.cremaLight;
            ctx.globalAlpha = 0.8 * a;
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.ellipse(x0, CUP.liqY, 10 + 46 * ph, (10 + 46 * ph) * 0.26, 0, 0, TAU);
            ctx.stroke();
            ctx.restore();
          }
        }
      }

      // ---- 7 steam ---------------------------------------------------------------------------------
      if (t >= B_RING) {
        const wisps = [
          { x: 566, y: 1086, len: 250, ph: 0.4, start: B_RING, w: 11 },
          { x: 498, y: 1094, len: 150, ph: 2.1, start: B_RING + 2 / 12, w: 8 },
        ];
        for (let i = 0; i < wisps.length; i++) {
          const wsp = wisps[i];
          if (tw < wsp.start) continue;
          const u = E.outCubic(clamp((tw - wsp.start + 1 / 12) / 0.375));
          const top = wsp.y - wsp.len * u;
          const pts = [];
          for (let y = wsp.y; y >= top; y -= 8) {
            const f = (wsp.y - y) / wsp.len;
            pts.push([wsp.x + (6 + 26 * f) * Math.sin(f * 5.2 + wsp.ph + tw * 3.2), y]);
          }
          if (pts.length < 3) continue;
          ink(pts, { width: wsp.w, color: P.steam, alpha: 0.8, seed: sd('steam', i, drawing(B_RING) % 4), taper: [4, 30], wobble: 1 });
          const edge = pts.map(([x, y]) => [x + wsp.w * 0.55, y]);
          ink(edge, { width: 1.4, color: inkSoft, alpha: 0.6, seed: sd('steamE', i), taper: [6, 20], wobble: 1 });
          ink(pts.map(([x, y]) => [x - wsp.w * 0.55, y]), { width: 1.1, color: inkSoft, alpha: 0.35, seed: sd('steamF', i), taper: [6, 30], wobble: 1 });
        }
      }

      // ---- 8 overlays -----------------------------------------------------------------------------------
      {
        // construction: centre axis, the G4 verticals, registration crosses on the G3 points
        const cons = new Path2D();
        cons.moveTo(540, 250);
        cons.lineTo(540, 1290);
        stroke(ctx, cons, P.inkFaint, 0.3, 1.5, [10, 8]);
        const reg = new Path2D();
        for (const [x, y] of [[290, 1080], [790, 1080], [540, 1395], [905, 1200], [140, 1420], [940, 1420]]) {
          reg.moveTo(x - 9, y);
          reg.lineTo(x + 9, y);
          reg.moveTo(x, y - 9);
          reg.lineTo(x, y + 9);
        }
        stroke(ctx, reg, P.inkFaint, 0.55, 1.5);
        L.guideCircle(ctx, 540, 1102, 300, { color: P.inkFaint, alpha: 0.22, width: 1.5, dash: [3, 7] });

        // annBlue flow arrows beside the streams (fade over 6 frames after the cut)
        const fa = t < B_CUT ? 1 : 1 - clamp((t - B_CUT) / (6 * FR));
        if (fa > 0) {
          ctx.save();
          ctx.globalAlpha = fa;
          for (const x of [462, 618]) {
            const p = new Path2D();
            p.moveTo(x, 800);
            p.lineTo(x, 990);
            stroke(ctx, p, P.annBlue, 1, 2.5, [14, 10], -t * 120);
            const ah = new Path2D();
            ah.moveTo(x - 9, 984);
            ah.lineTo(x, 1002);
            ah.lineTo(x + 9, 984);
            ah.closePath();
            ctx.fillStyle = P.annBlue;
            ctx.fill(ah);
          }
          ctx.restore();
        }

        // annYellow ring around the crema: pops on T 37.125 (3 frames, outBack) and holds
        if (t >= B_RING) {
          const u = clamp((t - B_RING) / (3 * FR) + 1 / 3);
          const k = E.outBack(u);
          ctx.save();
          ctx.strokeStyle = P.annYellow;
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.ellipse(540, CUP.liqY, 232 * (0.8 + 0.42 * k), 60 * (0.8 + 0.5 * k), 0, 0, TAU);
          ctx.stroke();
          // a second, thin echo expanding and fading (8 frames)
          const e = clamp((t - B_RING) / (8 * FR) + 1 / 8);
          if (e < 1) {
            ctx.globalAlpha = 1 - e;
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.ellipse(540, CUP.liqY, 232 * (1.22 + 0.25 * E.outExpo(e)), 60 * (1.3 + 0.4 * E.outExpo(e)), 0, 0, TAU);
            ctx.stroke();
          }
          ctx.restore();
        }
      }
    },
  });
})();

</script>
<script>
// ---- src/scenes/19-cup-pullback.js
// 19 cup-pullback : Pull-back: cup, café, window, mountain.  T 37.50 to 40.50 (72 frames), illustrated.
// One continuous log-linear zoom out, 1.0 -> 0.4 -> 0.16 -> 0.07 -> 0.05, each knot on a beat
// (T 38.25, 39.00, 39.75). Frame 0 is the inked G3 cup with caramel crema and steam, on the same
// pixels shot 18 ends on. The camera keeps the cup at screen (540, 1100) until T 39.00, then drifts
// so the café window is centred by T 40.50; through the window, terraced coffee mountains under a
// morning sun.
//
// One world, in L1 (cup) pixels: 1 cm is about 55 px, so the table is 3800 px across and the room
// is about 4 m (22000 px). Every pen size (ink width, wobble, hatch spacing, stipple radius) is
// divided by the zoom, so lines stay screen-constant at every layer as in the butterfly pull-back;
// objects outside the view or too small to read are culled, and long lines and hatch clips are cut
// to the visible rectangle.
//
// Layers, back to front:
//   1 stripes (stripeCream / stripeYellow): the café wall and the sky behind the window
//   2 landscape inside the window: sun, far ridge, terraced mountain, near terraces, shade tree
//   3 room: window frame and sill (with a potted seedling), picture, shelf, wainscot, floor tiles,
//     hanging lamp, counter with the espresso machine, bistro chair
//   4 table: pedestal, round wood top, sugar bowl, water glass, book, the hand in a tealDeep sleeve
//   5 L1 cup: saucer, spoon, cup body, handle, rim, crema, steam
//   6 overlays: annYellow ring 1.4x the cup radius, annBlue arc annotation around the window
(function () {
  'use strict';

  const ID = 'cup-pullback';
  const LIB = FILM.lib;
  const TAU = Math.PI * 2;
  const DEG = Math.PI / 180;
  const FR = 1 / 24;

  const clamp = (v, a = 0, b = 1) => (v < a ? a : v > b ? b : v);
  const lerp = (a, b, u) => a + (b - a) * u;
  const sstep = (a, b, x) => {
    const u = clamp((x - a) / (b - a));
    return u * u * (3 - 2 * u);
  };
  const sd = (...k) => LIB.hash(ID, ...k) & 0x7fffffff;

  // ---------------------------------------------------------------------------
  // camera: log-linear zoom through the knots, cup anchored, then drift to the window
  // ---------------------------------------------------------------------------

  const KN = [[0, 1], [0.75, 0.4], [1.5, 0.16], [2.25, 0.07], [3.0, 0.05]];
  const ANCHOR = [540, 1100];
  const WIN = { x0: -6400, x1: 7400, y0: -13400, y1: -1200 };
  const WIN_C = [(WIN.x0 + WIN.x1) / 2, (WIN.y0 + WIN.y1) / 2];

  function zoomAt(t) {
    let i = 0;
    while (i < KN.length - 2 && t >= KN[i + 1][0]) i++;
    const u = clamp((t - KN[i][0]) / (KN[i + 1][0] - KN[i][0]));
    // a slight breath at each knot so every layer lands on its beat
    const e = u - (0.12 * Math.sin(TAU * u)) / TAU;
    return Math.exp(lerp(Math.log(KN[i][1]), Math.log(KN[i + 1][1]), e));
  }
  function camAt(t) {
    const z = zoomAt(t);
    let x = ANCHOR[0] - (ANCHOR[0] - 540) / z, y = ANCHOR[1] - (ANCHOR[1] - 960) / z;
    if (t > 1.5) {
      const k = LIB.ease.inOutSine((t - 1.5) / 1.5);
      x = lerp(x, WIN_C[0], k);
      y = lerp(y, WIN_C[1], k);
    }
    return { z, x, y };
  }

  // ---------------------------------------------------------------------------
  // geometry helpers
  // ---------------------------------------------------------------------------

  function clipPolyRect(pts, x0, y0, x1, y1) {
    let out = pts;
    const inside = [(p) => p[0] >= x0, (p) => p[0] <= x1, (p) => p[1] >= y0, (p) => p[1] <= y1];
    const cut = [
      (a, b) => [x0, lerp(a[1], b[1], (x0 - a[0]) / (b[0] - a[0]))],
      (a, b) => [x1, lerp(a[1], b[1], (x1 - a[0]) / (b[0] - a[0]))],
      (a, b) => [lerp(a[0], b[0], (y0 - a[1]) / (b[1] - a[1])), y0],
      (a, b) => [lerp(a[0], b[0], (y1 - a[1]) / (b[1] - a[1])), y1],
    ];
    for (let e = 0; e < 4; e++) {
      const inp = out;
      out = [];
      if (!inp.length) break;
      for (let i = 0; i < inp.length; i++) {
        const a = inp[(i + inp.length - 1) % inp.length], b = inp[i];
        const ia = inside[e](a), ib = inside[e](b);
        if (ib) {
          if (!ia) out.push(cut[e](a, b));
          out.push(b);
        } else if (ia) out.push(cut[e](a, b));
      }
    }
    return out;
  }
  function bbox(pts) {
    let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
    for (const p of pts) {
      if (p[0] < x0) x0 = p[0];
      if (p[0] > x1) x1 = p[0];
      if (p[1] < y0) y0 = p[1];
      if (p[1] > y1) y1 = p[1];
    }
    return [x0, y0, x1, y1];
  }
  const rect = (x0, y0, x1, y1) => [[x0, y0], [x1, y0], [x1, y1], [x0, y1]];
  const ell = (cx, cy, rx, ry, n = 64, a0 = 0, a1 = TAU) => {
    const out = [];
    for (let i = 0; i <= n; i++) {
      const a = a0 + ((a1 - a0) * i) / n;
      out.push([cx + Math.cos(a) * rx, cy + Math.sin(a) * ry]);
    }
    if (Math.abs(a1 - a0 - TAU) < 1e-9) out.pop();
    return out;
  };

  // ---------------------------------------------------------------------------
  // the zoom-aware pen. Z = { k: zoom, v: [x0, y0, x1, y1] visible world rect }
  // ---------------------------------------------------------------------------

  const visB = (Z, b, pad = 0) => !(b[2] < Z.v[0] - pad || b[0] > Z.v[2] + pad || b[3] < Z.v[1] - pad || b[1] > Z.v[3] + pad);
  const insideV = (Z, b) => b[0] >= Z.v[0] && b[2] <= Z.v[2] && b[1] >= Z.v[1] && b[3] <= Z.v[3];
  const scr = (Z, b) => Math.max(b[2] - b[0], b[3] - b[1]) * Z.k; // screen size of a bbox
  // drawable: on screen and at least px pixels across
  const shows = (Z, b, px = 3) => visB(Z, b, 4 / Z.k) && scr(Z, b) >= px;

  function ink(ctx, Z, pts, o = {}) {
    const k = 1 / Z.k;
    const w = o.width != null ? o.width : 3;
    const q = Object.assign({}, o, {
      width: w * k,
      wobble: (o.wobble != null ? o.wobble : 2) * k,
      tremble: (o.tremble != null ? o.tremble : 0.4) * k,
      boilAmp: (o.boilAmp != null ? o.boilAmp : 0.7) * k,
      rough: (o.rough != null ? o.rough : 0.22 + 0.07 * w) * k,
      step: (o.step || 4.5) * k,
    });
    const tp = o.taper != null ? o.taper : o.closed ? [10, 22] : [18, 34];
    q.taper = Array.isArray(tp) ? [tp[0] * k, tp[1] * k] : tp * k;
    if (o.double) q.double = { offset: (w / 2 + 3) * k, width: 1.5 * k, alpha: 0.4 };
    LIB.inkPath(ctx, pts, q);
  }

  function runsIn(Z, pts, closed) {
    const src = closed ? pts.concat([pts[0]]) : pts;
    const pad = 60 / Z.k;
    const x0 = Z.v[0] - pad, y0 = Z.v[1] - pad, x1 = Z.v[2] + pad, y1 = Z.v[3] + pad;
    const out = [];
    let cur = null;
    for (let i = 0; i < src.length; i++) {
      const p = src[i];
      const inside = p[0] >= x0 && p[0] <= x1 && p[1] >= y0 && p[1] <= y1;
      if (inside) {
        if (!cur) {
          cur = [];
          if (i > 0) cur.push(src[i - 1]);
        }
        cur.push(p);
      } else if (cur) {
        cur.push(p);
        out.push(cur);
        cur = null;
      }
    }
    if (cur) out.push(cur);
    return out.filter((r) => r.length > 1);
  }

  function fillPoly(ctx, pts, color, alpha = 1) {
    if (alpha <= 0) return;
    ctx.save();
    ctx.globalAlpha *= alpha;
    ctx.fillStyle = color;
    ctx.beginPath();
    LIB.tracePath(ctx, pts, true);
    ctx.fill();
    ctx.restore();
  }

  // ink a shape: whole when it sits inside the view, only its visible runs when it does not
  function inkS(ctx, Z, pts, o = {}) {
    const b = o.b || bbox(pts);
    if (!shows(Z, b, o.minPx || 2)) return;
    const size = scr(Z, b);
    if (size < 160) {
      // small on screen: a plain boiling polyline (fill + stroke) instead of the full ink ribbon
      const bi = LIB.boil(LIB.T);
      const seed = LIB.hash(o.seed || 1) | 0;
      const j = (0.55 / Z.k);
      const path = new Path2D();
      const step = Math.max(1, Math.floor(pts.length / 40));
      for (let i = 0; i < pts.length; i += step) {
        const x = pts[i][0] + (LIB.h3(i, bi, seed) - 0.5) * 2 * j, y = pts[i][1] + (LIB.h3(bi, i, seed + 1) - 0.5) * 2 * j;
        if (i === 0) path.moveTo(x, y);
        else path.lineTo(x, y);
      }
      if (!o.closed && (pts.length - 1) % step) path.lineTo(pts[pts.length - 1][0], pts[pts.length - 1][1]);
      if (o.closed) path.closePath();
      ctx.save();
      if (o.closed && o.fill) {
        ctx.globalAlpha = o.fillAlpha != null ? o.fillAlpha : 1;
        ctx.fillStyle = o.fill;
        ctx.fill(path);
      }
      ctx.globalAlpha = o.alpha != null ? o.alpha : 1;
      ctx.strokeStyle = o.color || LIB.pal.ink;
      ctx.lineWidth = (o.width != null ? o.width : 3) * 0.85 / Z.k;
      ctx.lineJoin = 'round';
      ctx.lineCap = 'round';
      ctx.stroke(path);
      ctx.restore();
      return;
    }
    if (insideV(Z, b) || size < 300) {
      ink(ctx, Z, pts, o);
      return;
    }
    if (o.closed && o.fill) fillPoly(ctx, pts, o.fill, o.fillAlpha != null ? o.fillAlpha : 1);
    const runs = runsIn(Z, pts, !!o.closed);
    const q = Object.assign({}, o, { closed: false, fill: null });
    runs.forEach((r, i) => ink(ctx, Z, r, Object.assign({}, q, { seed: (o.seed || 1) + i * 31, taper: [0, 0] })));
  }

  function hatchZ(ctx, Z, poly, o = {}, cross = false) {
    const b = bbox(poly);
    if (!shows(Z, b, o.minPx || 30)) return;
    const k = 1 / Z.k;
    const pad = 30 * k;
    const cp = insideV(Z, b) ? poly : clipPolyRect(poly, Z.v[0] - pad, Z.v[1] - pad, Z.v[2] + pad, Z.v[3] + pad);
    if (cp.length < 3) return;
    const len = o.length || [16, 64];
    const gap = o.gap || [2, 7];
    const q = Object.assign({}, o, {
      spacing: (o.spacing || 8) * k,
      crossSpacing: o.crossSpacing ? o.crossSpacing * k : undefined,
      width: (o.width != null ? o.width : 1.4) * k,
      length: [len[0] * k, len[1] * k],
      gap: [gap[0] * k, gap[1] * k],
      inset: (o.inset != null ? o.inset : 6) * k,
      overshoot: (o.overshoot != null ? o.overshoot : 3) * k,
      bow: (o.bow != null ? o.bow : 0.7) * k,
      bend: (o.bend || 0) * k,
      boilAmp: (o.boilAmp != null ? o.boilAmp : 0.45) * k,
    });
    if (cross) LIB.crossHatch(ctx, cp, q);
    else LIB.hatch(ctx, cp, q);
  }

  function stippleZ(ctx, Z, poly, o = {}) {
    const b = bbox(poly);
    if (!shows(Z, b, o.minPx || 30)) return;
    const k = 1 / Z.k;
    const pad = 20 * k;
    const cp = insideV(Z, b) ? poly : clipPolyRect(poly, Z.v[0] - pad, Z.v[1] - pad, Z.v[2] + pad, Z.v[3] + pad);
    if (cp.length < 3) return;
    const r = o.r || [1.0, 2.2];
    LIB.stipple(ctx, cp, Object.assign({}, o, { spacing: (o.spacing || 7.5) * k, r: [r[0] * k, r[1] * k], boilAmp: (o.boilAmp != null ? o.boilAmp : 0.35) * k }));
  }

  // a plain stroked path with a screen-constant width
  function strokeZ(ctx, Z, path, color, width, alpha = 1, dash) {
    ctx.save();
    ctx.strokeStyle = color;
    ctx.globalAlpha *= alpha;
    ctx.lineWidth = width / Z.k;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    if (dash) ctx.setLineDash(dash.map((d) => d / Z.k));
    ctx.stroke(path);
    ctx.restore();
  }

  // a tapering tube along a centreline (chair rods, pedestal, lamp cord)
  function tube(line, w0, w1) {
    const sm = LIB.smoothPts(line, false, 10);
    const n = sm.length;
    const A = [], B = [];
    for (let i = 0; i < n; i++) {
      const a = sm[Math.max(0, i - 1)], b = sm[Math.min(n - 1, i + 1)];
      const tx = b[0] - a[0], ty = b[1] - a[1], tl = Math.hypot(tx, ty) || 1;
      const w = lerp(w0, w1, i / Math.max(1, n - 1)) / 2;
      A.push([sm[i][0] - (ty / tl) * w, sm[i][1] + (tx / tl) * w]);
      B.push([sm[i][0] + (ty / tl) * w, sm[i][1] - (tx / tl) * w]);
    }
    return A.concat(B.reverse());
  }
