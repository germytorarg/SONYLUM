      // span bracket of the open flower (320 px), fading with the petals
      const petalA = 1 - clamp((f24 + 1) / 9); // petals gone after 9 frames
      if (petalA > 0) L.bracket(ctx, 380, 380, 700, 380, { style: 'dim', cap: 14, alpha: 0.5 * petalA, width: 1.5 });
      // ovary bracket stays
      L.bracket(ctx, OVARY.x - OVARY.rx, 790, OVARY.x + OVARY.rx, 790, { style: 'dim', cap: 12, alpha: 0.5, width: 1.5 });

      // 3. ghost outlines of the ladder fruits, the envelope and the bracket
      for (const F of FRUITS) {
        strokeP(ctx, pathOf(F.pts), LAV, 0.28, 1, [6, 6]);
        const c = new Path2D();
        c.moveTo(F.x - F.r - 14, F.y);
        c.lineTo(F.x + F.r + 14, F.y);
        c.moveTo(F.x, F.y - F.ry - 14);
        c.lineTo(F.x, F.y + F.ry + 14);
        strokeP(ctx, c, LAV, 0.16, 1, [10, 4, 2, 4]);
      }
      {
        const env = L.smoothPts([[110, LADDER_Y - 6], ...FRUITS.map((F) => [F.x, F.y - F.ry - 12]), [990, LADDER_Y - 128]], false, 6);
        strokeP(ctx, pathOf(env, false), LAV, 0.32, 1.2, [6, 8]);
        const envB = L.smoothPts([[110, LADDER_Y + 6], ...FRUITS.map((F) => [F.x, F.y + F.ry + 12]), [990, LADDER_Y + 128]], false, 6);
        strokeP(ctx, pathOf(envB, false), LAV, 0.18, 1, [6, 8]);
      }
      const ladderP = clamp((t - FRUIT_T[0]) / (FRUIT_T[4] + 0.125 - FRUIT_T[0]));
      L.bracket(ctx, FRUITS[0].x - FRUITS[0].r, 1268, FRUITS[4].x + FRUITS[4].r, 1268, { style: 'square', cap: 16, alpha: 0.25, width: 1.5 });
      if (ladderP > 0) L.bracket(ctx, FRUITS[0].x - FRUITS[0].r, 1268, FRUITS[4].x + FRUITS[4].r, 1268, { style: 'square', cap: 16, alpha: 0.6, width: 1.5, p: ladderP });

      // 4. the flower
      // branch stub and the short pedicel under the ovary
      {
        const br = L.rrectPts(360, 760, 360, 26, 13, 12);
        dbl(ctx, br, sd('branch'), { gap: 6, alpha: 0.9 });
        L.hexLattice(ctx, br, { r: 7, alpha: 0.18, width: 1, seed: sd('brlat') });
        const ped = [[530, OVARY.y + OVARY.ry - 4], [530, 762], [550, 762], [550, OVARY.y + OVARY.ry - 4]];
        L.inkPath(ctx, ped, lav({ width: 1.5, alpha: 0.6, seed: sd('ped'), smooth: false }));
      }
      // ovary: navy-light fill, lattice, double outline, partition and two ovules
      const glowK = 0.55 + 0.45 * clamp((f24 + 1) / 9);
      {
        fillP(ctx, pathOf(OVARY_PTS), NAVYL, 0.85);
        L.hexLattice(ctx, OVARY_PTS, { r: 8, alpha: 0.38, width: 1, seed: sd('ovlat'), color: LAV });
        dbl(ctx, OVARY_PTS, sd('ovary'), { gap: 9 });
        const part = new Path2D();
        part.moveTo(540, OVARY.y - OVARY.ry + 10);
        part.lineTo(540, OVARY.y + OVARY.ry - 10);
        strokeP(ctx, part, LAV, 0.6, 1.5);
        for (const side of [-1, 1]) {
          const sp = seedPts(540 + side * 25, OVARY.y + 2, 20, 29, side);
          fillP(ctx, pathOf(sp), NAVYL, 1);
          L.inkPath(ctx, sp, lav({ closed: true, width: 1.8, color: WHITE, alpha: 0.75, seed: sd('ovule', side) }));
          L.stipple(ctx, sp, { spacing: 5, r: [0.8, 1.4], color: LEAFT, alpha: 0.7 * glowK, seed: sd('ovdots', side) });
        }
        // calyx rim: small lobes across the top of the ovary
        const cal = [];
        for (let i = 0; i <= 24; i++) {
          const u = i / 24;
          const x = lerp(478, 602, u);
          cal.push([x, OVARY.y - OVARY.ry * 0.9 - 6 - 6 * Math.abs(Math.sin(u * Math.PI * 4))]);
        }
        L.inkPath(ctx, cal, lav({ width: 1.8, alpha: 0.75, seed: sd('calyx') }));
      }
      // petals, tube, stamens and style fall away over 9 frames
      if (petalA > 0.003) {
        const drop = (1 - petalA) * 26;
        ctx.save();
        ctx.globalAlpha = petalA;
        for (const pt of PETALS) {
          const out = Math.cos(pt.ang) * drop * 0.8;
          const pts = pt.pts.map((q) => [q[0] + out, q[1] + drop]);
          fillP(ctx, pathOf(pts), NAVYL, 0.55);
          L.hexLattice(ctx, pts, { r: 7, alpha: 0.2, width: 1, seed: sd('plat', pt.i) });
          dbl(ctx, pts, sd('petal', pt.i), { gap: Math.min(7, pt.wid * 0.3) });
          // midrib
          const c = Math.cos(pt.ang), s = Math.sin(pt.ang);
          const m = new Path2D();
          m.moveTo(MOUTH[0] + c * 18 + out, MOUTH[1] + s * 18 + drop);
          m.lineTo(MOUTH[0] + c * pt.len * pt.fore * 0.86 + out, MOUTH[1] + s * pt.len * pt.fore * 0.86 + drop);
          strokeP(ctx, m, WHITE, 0.5, 1);
        }
        const tube = TUBE.map((q) => [q[0], q[1] + drop * 0.5]);
        fillP(ctx, pathOf(tube), NAVYL, 1);
        dbl(ctx, tube, sd('tube'), { gap: 4 });
        // five stamens with linear anthers at the mouth
        const st = new Path2D();
        const an = new Path2D();
        for (let k = 0; k < 5; k++) {
          const a = (205 + k * 32.5) * DEG;
          const x0 = MOUTH[0] + Math.cos(a) * 6, y0 = MOUTH[1] + drop;
          const x1 = MOUTH[0] + Math.cos(a) * 52, y1 = MOUTH[1] + Math.sin(a) * 52 + drop;
          st.moveTo(x0, y0);
          st.lineTo(x1, y1);
          an.moveTo(x1 + Math.cos(a) * 14, y1 + Math.sin(a) * 14);
          an.ellipse(x1 + Math.cos(a) * 7, y1 + Math.sin(a) * 7, 10, 3.2, a, 0, TAU);
        }
        strokeP(ctx, st, LAV, 0.7, 1.4);
        strokeP(ctx, an, WHITE, 0.9, 1.4);
        // the style runs from the ovary up through the tube to a forked stigma
        const sy = new Path2D();
        sy.moveTo(540, OVARY.y - 20);
        sy.lineTo(540, MOUTH[1] - 74 + drop);
        sy.moveTo(540, MOUTH[1] - 74 + drop);
        sy.lineTo(530, MOUTH[1] - 96 + drop);
        sy.moveTo(540, MOUTH[1] - 74 + drop);
        sy.lineTo(551, MOUTH[1] - 95 + drop);
        strokeP(ctx, sy, WHITE, 0.85, 1.6);
        ctx.restore();
        // the falling petals are a change: a brief magenta tick on each petal tip in the first frames
        if (f24 < 6) {
          const tk = new Path2D();
          for (const pt of PETALS) {
            const c = Math.cos(pt.ang), s = Math.sin(pt.ang);
            const r = pt.len * pt.fore + 22;
            tk.moveTo(MOUTH[0] + c * r, MOUTH[1] + s * r + drop);
            tk.lineTo(MOUTH[0] + c * (r + 14), MOUTH[1] + s * (r + 14) + drop);
          }
          strokeP(ctx, tk, MAG, 1 - f24 / 6, 3);
        }
      }

      // 5. network: the ovary feeds the ladder
      const netP = 1; // the network is part of the plate from frame 0
      {
        const src = [OVARY.x - 30, OVARY.y + OVARY.ry - 6];
        const dst = [FRUITS[0].x + 6, FRUITS[0].y - FRUITS[0].ry - 10];
        const pts = L.smoothPts([src, [430, 900], [250, 960], [190, 1060], dst], false, 6);
        const n = Math.max(2, Math.floor(pts.length * netP));
        strokeP(ctx, pathOf(pts.slice(0, n), false), LAV, 0.6, 1.5);
        // node glyph at the junction on the left curve
        const nd = pts[Math.floor(pts.length * 0.45)];
        if (netP > 0.45) {
          const g = new Path2D();
          g.arc(nd[0], nd[1], 8, 0, TAU);
          strokeP(ctx, g, WHITE, 0.7, 1.5);
        }
        if (netP >= 0.99) {
          const a = pts[pts.length - 1], b = pts[pts.length - 4];
          const ang = Math.atan2(a[1] - b[1], a[0] - b[0]);
          const ah = new Path2D();
          ah.moveTo(a[0] - Math.cos(ang - 0.45) * 12, a[1] - Math.sin(ang - 0.45) * 12);
          ah.lineTo(a[0], a[1]);
          ah.lineTo(a[0] - Math.cos(ang + 0.45) * 12, a[1] - Math.sin(ang + 0.45) * 12);
          strokeP(ctx, ah, WHITE, 0.8, 1.5);
        }
      }

      // 5b. network nodes: sunlight feeds the ovary; nine months of time feed the ripe fruit
      {
        const np = 1;
        // sun node, upper left
        const S = [165, 560];
        const ring = new Path2D();
        ring.arc(S[0], S[1], 50, 0, TAU);
        strokeP(ctx, ring, LAV, 0.6 * np, 1.5);
        const ring2 = new Path2D();
        ring2.arc(S[0], S[1], 41, 0, TAU);
        strokeP(ctx, ring2, LAV, 0.25 * np, 1, [3, 5]);
        const rays = new Path2D();
        for (let k = 0; k < 12; k++) {
          const a = (k / 12) * TAU;
          const r0 = 20, r1 = k % 2 ? 30 : 36;
          rays.moveTo(S[0] + Math.cos(a) * r0, S[1] + Math.sin(a) * r0);
          rays.lineTo(S[0] + Math.cos(a) * r1, S[1] + Math.sin(a) * r1);
        }
        strokeP(ctx, rays, WHITE, 0.6 * np, 1.5);
        L.glowDot(ctx, S[0], S[1], 9, { rays: 0, glow: 3, intensity: 0.7 * np, seed: sd('sun') });
        const s1 = L.smoothPts([[S[0] + 44, S[1] + 24], [300, 640], [420, 690], [OVARY.x - OVARY.rx - 12, OVARY.y]], false, 6);
        strokeP(ctx, pathOf(s1.slice(0, Math.max(2, Math.floor(s1.length * np))), false), LAV, 0.5, 1.3);
        // time node, right: nine segments light with the month scale
        const M = [890, 640];
        let litN = 0;
        for (let i = 0; i < 5; i++) if (t >= FRUIT_T[i] - 1e-6) litN = LIT_AFTER[i];
        const mr = new Path2D();
        mr.arc(M[0], M[1], 50, 0, TAU);
        strokeP(ctx, mr, LAV, 0.6 * np, 1.5);
        for (let k = 0; k < 9; k++) {
          const a0 = -Math.PI / 2 + (k / 9) * TAU + 0.06, a1 = -Math.PI / 2 + ((k + 1) / 9) * TAU - 0.06;
          const seg = new Path2D();
          seg.arc(M[0], M[1], 36, a0, a1);
          if (k < litN) strokeP(ctx, seg, WHITE, 0.95, 3);
          else strokeP(ctx, seg, LAV, 0.3 * np, 2);
        }
        const hand = new Path2D();
        const ha = -Math.PI / 2 + (litN / 9) * TAU;
        hand.moveTo(M[0], M[1]);
        hand.lineTo(M[0] + Math.cos(ha) * 26, M[1] + Math.sin(ha) * 26);
        strokeP(ctx, hand, WHITE, 0.8 * np, 1.5);
        const dotc = new Path2D();
        dotc.arc(M[0], M[1], 3, 0, TAU);
        fillP(ctx, dotc, WHITE, 0.8 * np);
        const m1 = L.smoothPts([[M[0] - 6, M[1] + 50], [905, 760], [930, 900], [FRUITS[4].x + 40, FRUITS[4].y - FRUITS[4].ry - 6]], false, 6);
        strokeP(ctx, pathOf(m1.slice(0, Math.max(2, Math.floor(m1.length * np))), false), LAV, 0.5, 1.3);
        const m2 = L.smoothPts([[M[0] - 50, M[1] - 4], [760, 630], [OVARY.x + OVARY.rx + 12, OVARY.y]], false, 6);
        strokeP(ctx, pathOf(m2.slice(0, Math.max(2, Math.floor(m2.length * np))), false), LAV, 0.3, 1, [4, 6]);
      }

      // 6. ladder fruits
      for (let i = 0; i < 5; i++) {
        const F = FRUITS[i];
        const p = hit(FRUIT_T[i], i === 4 ? 3 : 6, E.outExpo);
        if (p <= 0) continue;
        // link from the previous fruit: a straight dashed arrow along the ladder axis
        if (i > 0) {
          const A = FRUITS[i - 1];
          const x0 = A.x + A.r + 30, x1 = F.x - F.r - 10;
          const xe = lerp(x0, x1, p);
          const lk = new Path2D();
          lk.moveTo(x0, F.y);
          lk.lineTo(xe, F.y);
          strokeP(ctx, lk, LAV, 0.55, 1.2, [5, 5]);
          if (p >= 1) {
            const ah = new Path2D();
            ah.moveTo(x1 - 9, F.y - 6);
            ah.lineTo(x1, F.y);
            ah.lineTo(x1 - 9, F.y + 6);
            strokeP(ctx, ah, WHITE, 0.75, 1.5);
          }
        }
        const fp = pathOf(F.pts);
        if (p >= 1) fillP(ctx, fp, NAVYL, 0.7);
        dbl(ctx, F.pts, sd('fruit', i), { p, gap: Math.min(9, F.r * 0.2) });
        if (p < 1) continue;
        // inner structure: lattice skin band, two seeds flat face to flat face, schemLeaf dots
        const inner = L.ellipsePts(F.x, F.y, F.r * 0.62, F.ry * 0.62, 48);
        if (F.r > 30) {
          const band = [F.pts, inner.slice().reverse()];
          L.hexLattice(ctx, band, { r: Math.max(5, F.r * 0.09), alpha: 0.22, width: 1, seed: sd('flat', i) });
        }
        L.stipple(ctx, F.pts, { spacing: Math.max(5, F.r * 0.12), r: [0.9, 1.7], color: LEAFT, alpha: 0.75, seed: sd('fdots', i), density: (x, y) => 0.4 + 0.6 * sstep(0.4, 1, Math.hypot((x - F.x) / F.r, (y - F.y) / F.ry)) });
        if (F.r > 30) {
          for (const side of [-1, 1]) {
            const sp = seedPts(F.x + side * F.r * 0.27, F.y, F.r * 0.27, F.ry * 0.42, side);
            fillP(ctx, pathOf(sp), NAVYL, 1);
            L.inkPath(ctx, sp, lav({ closed: true, width: 1.5, color: WHITE, alpha: 0.7, seed: sd('fseed', i, side) }));
            // the crease down each flat face
            const cr = new Path2D();
            const cx = F.x + side * F.r * 0.12;
            cr.moveTo(cx, F.y - F.ry * 0.3);
            cr.quadraticCurveTo(cx + side * 4, F.y, cx, F.y + F.ry * 0.3);
            strokeP(ctx, cr, LAV, 0.55, 1);
          }
        } else {
          const g = new Path2D();
          g.arc(F.x, F.y, 4, 0, TAU);
          strokeP(ctx, g, WHITE, 0.7, 1.2);
        }
        // calyx scar at the tip (bottom) and the stalk stub at the top
        const cs = new Path2D();
        const sr = Math.max(4, F.r * 0.14);
        cs.arc(F.x, F.y + F.ry - sr - 3, sr, 0, TAU);
        for (let k = 0; k < 5; k++) {
          const a = -Math.PI / 2 + (k * TAU) / 5;
          cs.moveTo(F.x, F.y + F.ry - sr - 3);
          cs.lineTo(F.x + Math.cos(a) * sr, F.y + F.ry - sr - 3 + Math.sin(a) * sr);
        }
        strokeP(ctx, cs, WHITE, 0.7, 1.2);
        const stub = new Path2D();
        stub.moveTo(F.x - 4, F.y - F.ry);
        stub.lineTo(F.x - 4, F.y - F.ry - 10);
        stub.moveTo(F.x + 4, F.y - F.ry);
        stub.lineTo(F.x + 4, F.y - F.ry - 10);
        strokeP(ctx, stub, LAV, 0.6, 1.5);
        // a small vertical size bracket beside each fruit
        L.bracket(ctx, F.x + F.r + 16, F.y - F.ry, F.x + F.r + 16, F.y + F.ry, { style: 'square', cap: 8, alpha: 0.4, width: 1.2 });
      }

      // 7. month scale: 9 long ticks, minor ticks between, lit in step with the fruits
      {
        let lit = 0;
        for (let i = 0; i < 5; i++) if (t >= FRUIT_T[i] - 1e-6) lit = LIT_AFTER[i];
        const base = new Path2D();
        base.moveTo(SCALE.x0, SCALE.y);
        base.lineTo(SCALE.x1, SCALE.y);
        strokeP(ctx, base, LAV, 0.55, 1.5);
        const minor = new Path2D();
        for (let i = 0; i < 8; i++) {
          for (let k = 1; k < 4; k++) {
            const x = lerp(TICK_X[i], TICK_X[i + 1], k / 4);
            minor.moveTo(x, SCALE.y);
            minor.lineTo(x, SCALE.y + 8);
          }
        }
        strokeP(ctx, minor, LAV, 0.35, 1);
        const dim = new Path2D(), on = new Path2D();
        for (let i = 0; i < 9; i++) {
          const p = i < lit ? on : dim;
          p.moveTo(TICK_X[i], SCALE.y - 4);
          p.lineTo(TICK_X[i], SCALE.y + (i < lit ? 26 : 20));
        }
        strokeP(ctx, dim, LAV, 0.35, 1.5);
        strokeP(ctx, on, WHITE, 1, 2);
        // end caps
        const caps = new Path2D();
        caps.moveTo(SCALE.x0, SCALE.y - 10);
        caps.lineTo(SCALE.x0, SCALE.y + 10);
        caps.moveTo(SCALE.x1, SCALE.y - 10);
        caps.lineTo(SCALE.x1, SCALE.y + 10);
        strokeP(ctx, caps, LAV, 0.6, 1.5);
        if (lit > 0) {
          const lx = TICK_X[lit - 1];
          const lt = new Path2D();
          lt.moveTo(TICK_X[0], SCALE.y + 34);
          lt.lineTo(lx, SCALE.y + 34);
          strokeP(ctx, lt, WHITE, 0.7, 1.5);
          L.glowDot(ctx, lx, SCALE.y + 34, 4, { rays: 0, glow: 4, intensity: 0.8, seed: sd('scaledot') });
        }
        // projections from each drawn fruit down to its months
        const pr = new Path2D();
        for (let i = 0; i < 5; i++) {
          if (t < FRUIT_T[i] - 1e-6) continue;
          const F = FRUITS[i];
          const tx = TICK_X[LIT_AFTER[i] - 1];
          pr.moveTo(F.x, F.y + F.ry + 22);
          pr.lineTo(tx, SCALE.y - 10);
        }
        strokeP(ctx, pr, LAV, 0.22, 1, [2, 6]);
      }

      // 8. glow: the ovary core, the fruit cores, the magenta ripe ring
      L.glowDot(ctx, OVARY.x, OVARY.y - 34, 8, { rays: 12, rayLen: 2.4, glow: 5, intensity: glowK, seed: sd('ovglow') });
      for (let i = 0; i < 5; i++) {
        const p = hit(FRUIT_T[i], 3);
        if (p <= 0) continue;
        const fade = 1 - 0.6 * clamp((t - FRUIT_T[i]) / 0.25);
        L.glowDot(ctx, FRUITS[i].x, FRUITS[i].y - FRUITS[i].ry - 22, 4, { rays: 0, glow: 4, intensity: 0.8 * fade, seed: sd('fglow', i) });
      }
      if (t >= B_RIPE - 1e-6) {
        const f = (t - B_RIPE) * 24;
        if (f < 12) {
          const F = FRUITS[4];
          const pr = E.outExpo(clamp((f + 1) / 6));
          const g = new Path2D();
          const r = F.ry + 12 + 34 * pr;
          g.arc(F.x, F.y, r, 0, TAU);
          strokeP(ctx, g, MAG, 1 - clamp((f - 3) / 9), 3);
          dbl(ctx, F.pts, sd('fruit-mag'), { color: MAG, alpha: 1 - clamp((f - 2) / 10), gap: 9 });
        }
      }

      // 9. progress glyph
      progressGlyph(ctx, L, 0, info.p, info.T, false);
    },
  });
})();

</script>
<script>
// ---- src/scenes/06-ripening.js
// 06 ripening : Green, yellow, red. Illustrated, global T 9.75 to 12.00 (t 0 to 2.25).
// A horizontal coffee branch at y 700 with opposite leaf pairs at x 220 and 860. At the centre node
// (540, 760) a tight axillary cluster of 11 nearly stalkless cherries packs around the branch: 7 in front
// hanging just under it, 4 behind peeking over it. They start small and green, swell to full size on twos
// (T 9.75 to 10.50), then ripen unevenly: four turn yellow from T 10.50 (8th-triplets), five turn red from
// T 11.25 with magenta change rings, one darkens to overripe on T 11.625; two stay yellow and four green.
// A nine-dot month tally (annYellow) fills one dot per 8th-triplet; an annBlue ruler shows the growth.
//
// Layers, back to front:
//   1. stripes (stripeCream / stripeSpring), screen-fixed, drifting 6 px per beat
//   2. (camera push 1.00 to 1.05 about (540, 800))
//   3. leaves (cached static layer, 4-drawing boil cycle)
//   4. back-row cherries (behind the branch)
//   5. the branch (cached static layer)
//   6. young cherries in the side axils, front-row cherries with cast shadows on their neighbours
//   7. magenta change rings on the cherries that turn red
//   8. screen-fixed overlays: annBlue growth ruler (x 160, y 780 to 940), annYellow month tally ring
(function () {
  'use strict';

  const ID = 'ripening';
  const LIB = FILM.lib;
  const TAU = Math.PI * 2;
  const DEG = Math.PI / 180;
  const FR = 1 / 24;

  const lerp = (a, b, t) => a + (b - a) * t;
  const clamp = (v, lo = 0, hi = 1) => (v < lo ? lo : v > hi ? hi : v);
  const sstep = (a, b, x) => {
    const t = clamp((x - a) / (b - a));
    return t * t * (3 - 2 * t);
  };
  const sd = (...k) => LIB.hash(ID, ...k) & 0x7fffffff;

  // While a cached static layer is drawn, BOIL pins every line to one of four boil drawings
  // (a 4-drawing boil cycle), so each cached layer is the same whichever frame builds it.
  let BOIL = null;
  const bo = (o) => (BOIL == null ? o : Object.assign({}, o, { boil: BOIL }));
  const ink = (ctx, pts, o) => LIB.inkPath(ctx, pts, bo(o));
  const hatchB = (ctx, clip, o) => LIB.hatch(ctx, clip, bo(o));
  const stippleB = (ctx, clip, o) => LIB.stipple(ctx, clip, bo(o));

  // beats (shot-local seconds; global T in comments)
  const B_SWELL = 0; // T 9.75 swell starts (pairs of cherries, one drawing apart)
  const B_YEL = [0.75, 1.0, 1.25, 1.5]; // T 10.50, 10.75, 11.00, 11.25 yellow events
  const B_RED = [1.5, 1.75, 2.0]; // T 11.25, 11.50, 11.75 red events
  const B_DEEP = 1.875; // T 11.625 overripe

  // hoisted colours (pal is a read-only proxy)
  const P0 = LIB.pal;
  const C = {
    ink: P0.ink, inkSoft: P0.inkSoft, inkFaint: P0.inkFaint,
    leaf: P0.leafCoffee, leafDeep: P0.leafDeep, leafLight: P0.leafLight, leafSheen: P0.leafSheen,
    bark: P0.bark, barkDeep: P0.barkDeep,
    white: P0.white, ochre: P0.ochre, tan: P0.tan,
    annYellow: P0.annYellow, annBlue: P0.annBlue, annMagenta: P0.annMagenta,
    leafInk: LIB.mix(P0.leafDeep, P0.ink, 0.45),
    barkLight: LIB.mix(P0.bark, P0.tan, 0.45),
    sheenWhite: LIB.mix(P0.leafSheen, P0.white, 0.55),
  };
  // cherry colour stages: fill, shade (hatch), gloss
  const STAGE = {
    green: { fill: P0.cherryGreen, shade: LIB.mix(P0.cherryGreen, P0.leafDeep, 0.6), gloss: LIB.mix(P0.cherryGreen, P0.white, 0.55) },
    yellow: { fill: P0.cherryYellow, shade: LIB.mix(P0.cherryYellow, P0.ochre, 0.55), gloss: LIB.mix(P0.cherryYellow, P0.white, 0.6) },
    red: { fill: P0.cherryRed, shade: P0.cherryDeep, gloss: P0.cherryLight },
    deep: { fill: P0.cherryDeep, shade: LIB.mix(P0.cherryDeep, P0.ink, 0.5), gloss: LIB.mix(P0.cherryDeep, P0.cherryLight, 0.45) },
  };

  function trace(ctx, pts, closed = true) {
    for (let i = 0; i < pts.length; i++) {
      if (i === 0) ctx.moveTo(pts[i][0], pts[i][1]);
      else ctx.lineTo(pts[i][0], pts[i][1]);
    }
    if (closed) ctx.closePath();
  }
  function pathOf(pts, closed = true) {
    const p = new Path2D();
    trace(p, pts, closed);
    return p;
  }
  function fillPoly(ctx, pts, color, alpha = 1) {
    ctx.save();
    ctx.globalAlpha *= alpha;
    ctx.fillStyle = color;
    ctx.beginPath();
    trace(ctx, pts, true);
    ctx.fill();
    ctx.restore();
  }
  function strokeP(ctx, p, color, alpha, width, dash) {
    ctx.save();
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.strokeStyle = color;
    ctx.globalAlpha *= alpha;
    ctx.lineWidth = width;
    if (dash) ctx.setLineDash(dash);
    ctx.stroke(p);
    ctx.restore();
  }
  function bboxOf(pts, pad = 4) {
    let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
    for (const p of pts) {
      if (p[0] < x0) x0 = p[0];
      if (p[1] < y0) y0 = p[1];
      if (p[0] > x1) x1 = p[0];
      if (p[1] > y1) y1 = p[1];
    }
    return { x: x0 - pad, y: y0 - pad, w: x1 - x0 + 2 * pad, h: y1 - y0 + 2 * pad };
  }
  function polyLen(pts) {
    let s = 0;
    for (let i = 1; i < pts.length; i++) s += Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]);
    return s;
  }

  // ---------------------------------------------------------------------------
  // Coffee leaf: elliptic, about 2 : 1, drawn-out tip, wavy margin (5 undulations a side),
  // 9 pairs of looping lateral veins, a pale gloss streak beside the midrib on the lit side.
  // ---------------------------------------------------------------------------
  function leafGeom(bx, by, ang, len, width, key, bend) {
    const ux = Math.cos(ang), uy = Math.sin(ang);
    const nx = -uy, ny = ux;
    const pet = 34, blade = len - pet;
    const ph = LIB.h3(sd('leafph', key), 1, 2) * TAU;
    const at = (u, v) => {
      const b = bend * 4 * u * (1 - u);
      return [bx + ux * (pet + u * blade) + nx * (v + b), by + uy * (pet + u * blade) + ny * (v + b)];
    };
    const hw = (u) => {
      u = clamp(u);
      const s = Math.pow(Math.sin(Math.PI * Math.pow(u, 0.9)), 0.78) * (1 - 0.32 * sstep(0.7, 1, u));
      return (width / 2) * s;
    };
    const wave = (u, side) => 1 + 0.055 * Math.sin(TAU * 5 * u + ph + (side > 0 ? 0 : 1.9)) * sstep(0.05, 0.22, u) * (1 - sstep(0.86, 0.99, u));
    const N = 64;
    const upper = [], lower = [], mid = [];
    for (let i = 0; i <= N; i++) {
      const u = i / N;
      upper.push(at(u, hw(u) * wave(u, 1)));
      lower.push(at(u, -hw(u) * 0.94 * wave(u, -1)));
      mid.push(at(u, 0));
    }
    const outline = upper.concat(lower.slice(1, N).reverse());
    const halfA = upper.concat(mid.slice(1, N).reverse());
    const halfB = lower.concat(mid.slice(1, N).reverse());
    // the side whose normal points up-left faces the light
    const litSide = nx + ny < 0 ? 1 : -1;
    const r = LIB.rng(sd('leafv', key));
    const veins = [];
    for (let k = 0; k < 9; k++) {
      const u0 = 0.07 + k * 0.088 + r.range(-0.01, 0.01);
      for (const s of [1, -1]) {
        const k2 = s > 0 ? 1 : 0.94;
        const pts = [at(u0, 0)];
        const steps = [[0.05, 0.42], [0.12, 0.76], [0.2, 0.84], [0.27, 0.8]];
        for (const [du, f] of steps) {
          const u = Math.min(0.975, u0 + du);
          pts.push(at(u, s * hw(u) * f * k2));
        }
        veins.push({ s, u0, pts });
      }
    }
    const veinAng = (s) => {
      const a = at(0.42, 0), b = at(0.42 + 0.12, s * hw(0.54) * 0.76);
      return Math.atan2(b[1] - a[1], b[0] - a[0]);
    };
    const gloss = [];
    {
      const fw = [], bw = [];
      for (let i = 0; i <= 30; i++) {
        const u = 0.1 + (i / 30) * 0.74;
        const w = Math.sin((Math.PI * (u - 0.1)) / 0.74);
        fw.push(at(u, litSide * hw(u) * 0.07));
        bw.push(at(u, litSide * hw(u) * (0.08 + 0.3 * Math.pow(w, 0.8))));
      }
      gloss.push(...fw, ...bw.reverse());
    }
    const uvOf = (x, y) => {
      const dx = x - bx, dy = y - by;
      const u = (dx * ux + dy * uy - pet) / blade;
      const uc = clamp(u);
      const v = dx * nx + dy * ny - bend * 4 * uc * (1 - uc);
      return [u, v / Math.max(6, hw(uc))];
    };
    return {
      outline, halfA, halfB, mid, veins, gloss, litSide, key, uvOf, at, hw,
      stalk: [[bx, by], at(0, 0)], angA: veinAng(1), angB: veinAng(-1), bounds: bboxOf(outline, 8),
    };
  }

  function drawLeaf(ctx, Lf, o = {}) {
    const L = LIB;
    const k = Lf.key;
    const wScale = o.thin ? 0.8 : 1;
    // petiole
    ink(ctx, Lf.stalk, { width: 13 * wScale, color: C.ink, seed: sd('pet0', k), taper: [0, 5], swell: 0, wobble: 0.4 });
    ink(ctx, Lf.stalk, { width: 7 * wScale, color: C.leafLight, seed: sd('pet', k), taper: [0, 4], swell: 0, wobble: 0.4 });
    ink(ctx, Lf.outline, { closed: true, width: 3 * wScale, fill: C.leaf, seed: sd('leafline', k), wobble: 1.2 });
    const shadowHalf = Lf.litSide > 0 ? Lf.halfB : Lf.halfA;
    const litHalf = Lf.litSide > 0 ? Lf.halfA : Lf.halfB;
    const angShadow = Lf.litSide > 0 ? Lf.angB : Lf.angA;
    const angLit = Lf.litSide > 0 ? Lf.angA : Lf.angB;
    const B = Lf.bounds;
    // shadow half: hatch parallel to the side veins, darker toward the margin and tip
    hatchB(ctx, shadowHalf, {
      angle: angShadow, spacing: 5.5, width: 1.6, color: C.leafDeep, alpha: 0.9, length: [12, 34], bounds: B, seed: sd('lh', k),
      density: (x, y) => {
        const q = Lf.uvOf(x, y);
        return 0.5 + 0.5 * sstep(0.1, 0.75, Math.abs(q[1]));
      },
    });
    hatchB(ctx, shadowHalf, {
      angle: angShadow + 1.05, spacing: 7, width: 1.3, color: C.ink, alpha: 0.42, length: [10, 26], bounds: B, seed: sd('lh2', k),
      density: (x, y) => {
        const q = Lf.uvOf(x, y);
        return 0.95 * sstep(0.45, 0.95, Math.abs(q[1])) * (0.4 + 0.6 * sstep(0.3, 0.9, q[0]));
      },
    });
    // lit half: only a light shade near the margin and in the base
    hatchB(ctx, litHalf, {
      angle: angLit, spacing: 9, width: 1.3, color: C.leafDeep, alpha: 0.8, length: [10, 24], bounds: B, seed: sd('uh', k),
      density: (x, y) => {
        const q = Lf.uvOf(x, y);
        return 0.75 * sstep(0.72, 1.0, Math.abs(q[1])) + 0.6 * (1 - sstep(0.02, 0.16, q[0]));
      },
    });
    // gloss streak along the midrib on the lit side, with a few bright flicks
    fillPoly(ctx, Lf.gloss, C.leafSheen, 0.8);
    const flick = new Path2D();
    for (let i = 0; i < 5; i++) {
      const u0 = 0.2 + i * 0.12;
      const a = Lf.at(u0, Lf.litSide * Lf.hw(u0) * 0.16), b = Lf.at(u0 + 0.06, Lf.litSide * Lf.hw(u0 + 0.06) * 0.2);
      flick.moveTo(a[0], a[1]);
      flick.lineTo(b[0], b[1]);
    }
    strokeP(ctx, flick, C.sheenWhite, 0.9, 2.2);
    // sunken lateral veins and the midrib
    for (let i = 0; i < Lf.veins.length; i++) {
      ink(ctx, Lf.veins[i].pts, { width: 1.8, color: C.leafDeep, alpha: 0.95, seed: sd('lv', k, i), taper: [3, 14], wobble: 0.5, step: 3 });
    }
    ink(ctx, Lf.mid, { width: 4 * wScale, color: C.leafLight, seed: sd('mid', k), taper: [2, 70], wobble: 0.6 });
    ink(ctx, Lf.mid, { width: 1.2, color: C.leafInk, alpha: 0.6, seed: sd('mid2', k), taper: [10, 90], wobble: 0.6 });
  }


  // ---------------------------------------------------------------------------
  // Branch
  // ---------------------------------------------------------------------------
  function branchPts(x0, y0, x1, y1, half, sagAmp, n = 40) {
    const dx = x1 - x0, dy = y1 - y0, l = Math.hypot(dx, dy);
    const ux = dx / l, uy = dy / l, nx = uy, ny = -ux;
    const top = [], bot = [], mid = [];
    for (let i = 0; i <= n; i++) {
      const s = i / n;
      const g = sagAmp * Math.sin(Math.PI * s);
      const cx = x0 + dx * s - nx * g, cy = y0 + dy * s - ny * g;
      const h = half * (1 - 0.12 * s);
      mid.push([cx, cy]);
      top.push([cx + nx * h, cy + ny * h]);
      bot.push([cx - nx * h, cy - ny * h]);
    }
    return { top, bot, mid, poly: top.concat(bot.slice().reverse()), ux, uy, nx, ny };
  }

  function drawBranch(ctx, Bp, key, nodes, o = {}) {
    const L = LIB;
    const w = o.w || 3.5;
    fillPoly(ctx, Bp.poly, C.bark);
    // a pale lit strip along the top edge
    const strip = [];
    for (let i = 0; i < Bp.top.length; i++) {
      const t = Bp.top[i], m = Bp.mid[i];
      strip.push([lerp(t[0], m[0], 0.15), lerp(t[1], m[1], 0.15)]);
    }
    for (let i = Bp.top.length - 1; i >= 0; i--) {
      const t = Bp.top[i], m = Bp.mid[i];
      strip.push([lerp(t[0], m[0], 0.55), lerp(t[1], m[1], 0.55)]);
    }
    fillPoly(ctx, strip, C.barkLight, 0.7);
    // lengthwise bark hatching on the shadow (lower) half, plus contour strokes in the deepest band
    const ang = Math.atan2(Bp.uy, Bp.ux);
    const half = Math.hypot(Bp.top[0][0] - Bp.mid[0][0], Bp.top[0][1] - Bp.mid[0][1]);
    const vOf = (x, y) => ((x - Bp.mid[0][0]) * Bp.nx + (y - Bp.mid[0][1]) * Bp.ny);
    // distance below the (sagging) centreline, normalised
    const sOf = (x, y) => ((x - Bp.mid[0][0]) * Bp.ux + (y - Bp.mid[0][1]) * Bp.uy);
    const total = polyLen(Bp.mid);
    const below = (x, y) => {
      const s = clamp(sOf(x, y) / total);
      const m = Bp.mid[Math.round(s * (Bp.mid.length - 1))];
      return -((x - m[0]) * Bp.nx + (y - m[1]) * Bp.ny) / half;
    };
    hatchB(ctx, Bp.poly, { angle: ang + 0.04, spacing: 3.6, width: 1.4, color: C.barkDeep, alpha: 0.9, length: [16, 46], seed: sd('bh', key), density: (x, y) => sstep(-0.25, 0.55, below(x, y)) });
    hatchB(ctx, Bp.poly, { angle: ang + Math.PI / 2 + 0.25, spacing: 6, width: 1.3, color: C.ink, alpha: 0.5, length: [5, 10], seed: sd('bc', key), density: (x, y) => sstep(0.45, 0.9, below(x, y)) });
    // bark flecks and lenticels
    stippleB(ctx, Bp.poly, { spacing: 13, r: [1.0, 1.8], color: C.barkDeep, alpha: 0.75, seed: sd('len', key), density: (x, y) => 0.55 + 0.4 * sstep(-0.6, 0.4, below(x, y)) });
    void vOf;
    // node swellings: a slight ring where each leaf pair joins
    for (let i = 0; i < nodes.length; i++) {
      const [x, y] = nodes[i];
      const ring = [];
      for (let k = -1; k <= 1; k += 2) ring.push([x + Bp.ux * k * 6 + Bp.nx * (half + 2), y + Bp.uy * k * 6 + Bp.ny * (half + 2)]);
      const p1 = [x + Bp.nx * (half + 3), y + Bp.ny * (half + 3)], p2 = [x - Bp.nx * (half + 3), y - Bp.ny * (half + 3)];
      const c = [x + Bp.ux * 5, y + Bp.uy * 5];
      ink(ctx, L.smoothPts([p1, c, p2], false, 3), { width: 1.8, color: C.inkSoft, alpha: 0.9, seed: sd('nodering', key, i), taper: [4, 4], wobble: 0.3 });
    }
    ink(ctx, Bp.top, { width: w, seed: sd('btop', key), taper: [0, 0], wobble: 1.2 });
    ink(ctx, Bp.bot, { width: w + 0.5, seed: sd('bbot', key), taper: [0, 0], wobble: 1.2 });
  }

  // ---------------------------------------------------------------------------
  // Cherries
  // ---------------------------------------------------------------------------
  const NODE = [540, 700];
  // final colours: A overripe, B..E red, F, G yellow, H..K green (uneven on purpose)
  // y events: when it turns yellow; r: when it turns red; d: when it goes overripe
  const SCHED = {
    A: { y: 0.75, r: 1.5, d: B_DEEP },
    B: { y: 1.0, r: 1.75 },
    C: { y: 0.75, r: 1.5 },
    D: { y: 1.25, r: 1.75 },
    E: { y: 1.25, r: 2.0 },
    F: { y: 1.0 },
    G: { y: 1.5 },
    H: {}, I: {}, J: {}, K: {},
  };
  // front row hangs just under the branch, arched; back row peeks over it
  const FRONT = [
    { x: 300, r: 74, k: 'H', tilt: 0.2 },
    { x: 382, r: 80, k: 'B', tilt: 0.12 },
    { x: 462, r: 78, k: 'F', tilt: 0.06 },
    { x: 540, r: 85, k: 'C', tilt: -0.02 },
    { x: 620, r: 76, k: 'I', tilt: -0.08 },
    { x: 700, r: 82, k: 'D', tilt: -0.14 },
    { x: 780, r: 72, k: 'G', tilt: -0.2 },
  ].map((c, i) => Object.assign(c, { y: 774 + Math.pow((c.x - 540) / 240, 2) * 50, back: false, id: i }));
  const BACK = [
    { x: 392, y: 640, r: 72, k: 'E', tilt: -0.25 },
    { x: 488, y: 622, r: 70, k: 'J', tilt: -0.1 },
    { x: 600, y: 626, r: 74, k: 'A', tilt: 0.1 },
    { x: 694, y: 644, r: 70, k: 'K', tilt: 0.24 },
  ].map((c, i) => Object.assign(c, { back: true, id: 10 + i }));
  // young green cherries in the side axils (static, full grown but unripe)
  const SIDE = [
    { x: 196, y: 652, r: 40, tilt: -0.3, back: true, id: 30 },
    { x: 246, y: 648, r: 38, tilt: 0.25, back: true, id: 31 },
    { x: 836, y: 748, r: 42, tilt: 0.25, back: false, id: 32 },
    { x: 888, y: 744, r: 40, tilt: -0.2, back: false, id: 33 },
    { x: 862, y: 652, r: 38, tilt: 0.05, back: true, id: 34 },
  ];
  // swell order: pairs of cherries, one drawing (2 frames) apart
  const SWELL_ORDER = ['C', 'A', 'B', 'D', 'J', 'F', 'I', 'E', 'H', 'K', 'G'];

  function stageOf(k, t) {
    const s = SCHED[k];
    if (s.d != null && t >= s.d - 1e-6) return 'deep';
    if (s.r != null && t >= s.r - 1e-6) return 'red';
    if (s.y != null && t >= s.y - 1e-6) return 'yellow';
    return 'green';
  }

  function cherryPts(cx, cy, r, tilt, n = 56) {
    // slightly oval (h : w 1.1), a touch fuller on the lower half
    const out = [];
    const c = Math.cos(tilt), s = Math.sin(tilt);
    for (let i = 0; i < n; i++) {
      const a = (i / n) * TAU;
      const x = Math.cos(a) * r, y = Math.sin(a) * r * 1.1 * (Math.sin(a) > 0 ? 1.02 : 0.98);
      out.push([cx + x * c - y * s, cy + x * s + y * c]);
    }
    return out;
  }

  function drawCherry(ctx, ch, cx, cy, r, stage, opts) {
    const L = LIB;
    const S = STAGE[stage];
    const pts = cherryPts(cx, cy, r, ch.tilt);
    const tipDir = ch.back ? -1 : 1; // the calyx end points away from the branch
    ink(ctx, pts, { closed: true, width: 4, fill: S.fill, seed: sd('ch', ch.id), wobble: 0.8, taper: [8, 16] });
    // shadow on the lower right: 45 degree hatch, then a cross layer in the deep crescent
    const lx = (x, y) => ((x - cx) * 0.7071 + (y - cy) * 0.7071) / r;
    hatchB(ctx, pts, {
      angle: -Math.PI / 4, spacing: 4.6, width: 1.5, color: S.shade, alpha: 0.9, length: [10, 28], inset: 2, overshoot: 0, seed: sd('chh', ch.id),
      density: (x, y) => sstep(-0.15, 0.55, lx(x, y)),
    });
    hatchB(ctx, pts, {
      angle: -Math.PI / 4 - Math.PI / 3, spacing: 6, width: 1.3, color: stage === 'green' ? C.leafDeep : C.ink, alpha: 0.5, length: [8, 20], inset: 2, overshoot: 0, seed: sd('chx', ch.id),
      density: (x, y) => sstep(0.45, 0.85, lx(x, y)),
    });
    if (stage === 'deep') {
      // wrinkles on the overripe skin
      for (let k = 0; k < 4; k++) {
        const a = -0.6 + k * 0.5;
        const p0 = [cx + Math.cos(a) * r * 0.25, cy + Math.sin(a) * r * 0.2];
        const p1 = [cx + Math.cos(a + 0.2) * r * 0.55, cy + Math.sin(a + 0.25) * r * 0.5];
        const p2 = [cx + Math.cos(a + 0.1) * r * 0.78, cy + Math.sin(a + 0.1) * r * 0.75];
        ink(ctx, [p0, p1, p2], { width: 1.8, color: C.ink, alpha: 0.8, seed: sd('wr', ch.id, k), taper: [4, 8], wobble: 0.6 });
      }
    }
    // gloss crescent at the upper left (angles 200 to 250 degrees), and a bright dot
    const g = [];
    for (let i = 0; i <= 14; i++) {
      const a = (198 + (i / 14) * 56) * DEG;
      g.push([cx + Math.cos(a) * r * 0.72, cy + Math.sin(a) * r * 0.78]);
    }
    for (let i = 14; i >= 0; i--) {
      const a = (198 + (i / 14) * 56) * DEG;
      const k = 0.72 - 0.16 * Math.sin((i / 14) * Math.PI);
      g.push([cx + Math.cos(a) * r * k, cy + Math.sin(a) * r * (k + 0.06)]);
    }
    ctx.save();
    ctx.fillStyle = S.gloss;
    ctx.globalAlpha = 0.95;
    ctx.beginPath();
    for (let i = 0; i < g.length; i++) (i ? ctx.lineTo(g[i][0], g[i][1]) : ctx.moveTo(g[i][0], g[i][1]));
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = C.white;
    ctx.beginPath();
    ctx.arc(cx - r * 0.34, cy - r * 0.48, Math.max(2.5, r * 0.07), 0, TAU);
    ctx.fill();
    ctx.restore();
    // calyx scar disc at the tip with its five-point mark
    const c = Math.cos(ch.tilt), s = Math.sin(ch.tilt);
    const tx = cx - s * r * 0.8 * tipDir, ty = cy + c * r * 0.8 * tipDir;
    const sr = r * 0.16;
    ink(ctx, LIB.ellipsePts(tx, ty, sr, sr * 0.72, 16, ch.tilt), { closed: true, width: 2, fill: stage === 'green' ? LIB.mix(S.shade, C.ink, 0.35) : LIB.mix(S.shade, C.ink, 0.5), seed: sd('scar', ch.id), wobble: 0.3, taper: [3, 5] });
    const st = new Path2D();
    for (let k = 0; k < 5; k++) {
      const a = ch.tilt + (k * TAU) / 5;
      st.moveTo(tx, ty);
      st.lineTo(tx + Math.cos(a) * sr * 0.75, ty + Math.sin(a) * sr * 0.55);
    }
    strokeP(ctx, st, C.ink, 0.8, 1.2);
    if (opts && opts.double) ink(ctx, pts.map((p) => [p[0] + 3, p[1] + 3]), { closed: true, width: 1.5, alpha: 0.35, seed: sd('chd', ch.id), wobble: 0.6 });
    return pts;
  }

  // the stub where a back cherry presses against the branch, or a front cherry hangs on it
  function drawStalkStub(ctx, ch, cx, cy, r) {
    const tipDir = ch.back ? -1 : 1;
    const c = Math.cos(ch.tilt), s = Math.sin(ch.tilt);
    const bx = cx + s * r * 0.95 * tipDir, by = cy - c * r * 0.95 * tipDir;
    let ex = lerp(bx, NODE[0] + (cx - NODE[0]) * 0.25, 0.6), ey = NODE[1] + (ch.back ? -6 : 8);
    // nearly stalkless: never longer than 18 px
    const dl = Math.hypot(ex - bx, ey - by);
    if (dl > 18) {
      ex = bx + ((ex - bx) / dl) * 18;
      ey = by + ((ey - by) / dl) * 18;
    }
    ink(ctx, [[bx, by], [ex, ey]], { width: 9, color: C.ink, seed: sd('stk0', ch.id), taper: [0, 2], swell: 0, wobble: 0.3 });
    ink(ctx, [[bx, by], [ex, ey]], { width: 5, color: C.leafLight, seed: sd('stk', ch.id), taper: [0, 2], swell: 0, wobble: 0.3 });
  }

  // ---------------------------------------------------------------------------
  // Memoised geometry and cached static layers
  // ---------------------------------------------------------------------------
  let GEO = null;
  function geo() {
    if (GEO) return GEO;
    const branch = branchPts(-40, 706, 1120, 694, 16, 5, 60);
    const leaves = [
      leafGeom(220 - 6, 686, -1.95, 430, 205, 'L0', 16),
      leafGeom(220 - 6, 716, 1.95, 430, 205, 'L1', -14),
      leafGeom(860 + 6, 684, -1.18, 430, 205, 'L2', -16),
      leafGeom(860 + 6, 714, 1.25, 430, 205, 'L3', 14),
      // an older pair beyond the frame edges, only their tips reach in
      leafGeom(-40, 712, 2.9, 380, 186, 'L4', 10),
      leafGeom(1120, 690, -0.35, 380, 186, 'L5', -10),
    ];
    // scenery: an upper branch at the top edge and a lower branch with its own mixed cluster
    const upper = branchPts(-40, 120, 760, -40, 12, 4, 40);
    const upperLeaves = [
      leafGeom(150, 96, 1.75, 380, 182, 'U0', 12),
      leafGeom(460, 36, 2.05, 380, 182, 'U1', -12),
      leafGeom(470, 30, 1.2, 360, 172, 'U2', 10),
    ];
    const lower = branchPts(-40, 1430, 1120, 1330, 14, 6, 50);
    const lowY = (x) => lerp(1430, 1330, (x + 40) / 1160) - 6 * Math.sin(Math.PI * ((x + 40) / 1160));
    const lowerLeaves = [
      leafGeom(320, lowY(320) - 12, -1.75, 400, 192, 'D0', -14),
      leafGeom(320, lowY(320) + 12, 1.65, 400, 192, 'D1', 12),
      leafGeom(830, lowY(830) - 12, -1.3, 400, 192, 'D2', 12),
      leafGeom(830, lowY(830) + 12, 1.35, 400, 192, 'D3', -14),
    ];
    // the lower cluster: a smaller axillary bunch, mostly green with a few turning (static)
    const lowCluster = [];
    {
      const r = LIB.rng(sd('lowcl'));
      const cols = ['green', 'yellow', 'green', 'red', 'green', 'green', 'yellow', 'green', 'red'];
      const n = cols.length;
      for (let i = 0; i < n; i++) {
        const a = (i / n) * TAU + 0.3;
        const back = Math.sin(a) < -0.2;
        const x = 575 + Math.cos(a) * 92, y = lowY(575) + Math.sin(a) * 50 + (back ? -4 : 34);
        lowCluster.push({ x, y, r: r.range(50, 58), tilt: r.range(-0.25, 0.25), back, id: 60 + i, col: cols[i] });
      }
      lowCluster.sort((p, q) => p.y - q.y);
    }
    GEO = { branch, leaves, upper, upperLeaves, lower, lowerLeaves, lowCluster, lowY };
    return GEO;
  }

  function staticLayer(L, name, bi, draw) {
    const S = FILM.S || 1;
    const b = ((bi % 4) + 4) % 4;
    return L.cached(ID + ':' + name + ':' + b + ':' + S, () => {
      const cv = FILM.makeCanvas(Math.round(1080 * S), Math.round(1920 * S));
      const ctx = cv.getContext('2d');
      ctx.setTransform(S, 0, 0, S, 0, 0);
      BOIL = b;
      try {
        draw(ctx);
      } finally {
        BOIL = null;
      }
      return cv;
    });
  }

  function overlayStroke(ctx, path, color, alpha, width) {
    ctx.save();
    ctx.lineCap = 'round';
    ctx.globalAlpha = alpha * 0.25;
    ctx.strokeStyle = C.ink;
    ctx.lineWidth = width + 3;
    ctx.stroke(path);
    ctx.globalAlpha = alpha;
    ctx.strokeStyle = color;
    ctx.lineWidth = width;
    ctx.stroke(path);
    ctx.restore();
  }

  // ---------------------------------------------------------------------------
  // Scene
  // ---------------------------------------------------------------------------
  FILM.scene({
    id: ID,
    draw(ctx, tIn, info) {
      const L = info.lib;
      const E = L.ease;
      const t = clamp(tIn, 0, info.dur);
      const tw = L.onTwos(t);
      const bi = L.boil(info.T);
      const G = geo();
      const drawing = (a) => Math.max(0, Math.floor((t - a) * 12 + 1e-4));

      // swell: 0.55 to 1.0, outBack over 6 frames, on twos; pairs one drawing apart
      const scaleOf = (k) => {
        const idx = SWELL_ORDER.indexOf(k);
        const st = B_SWELL + Math.floor(idx / 2) * 2 * FR;
        const u = clamp((tw - st) / (6 * FR) + 1 / 6);
        return tw < st - 1e-6 ? 0.55 : 0.55 + 0.45 * E.outBack(u);
      };
      // a cherry's centre eases toward the node while it is small, so the cluster stays packed
      const place = (ch, s) => [NODE[0] + (ch.x - NODE[0]) * (0.6 + 0.4 * s), NODE[1] + (ch.y - NODE[1]) * (0.45 + 0.55 * s)];

      // 1. stripes
      L.stripes(ctx, { colors: [L.pal.stripeCream, L.pal.stripeSpring], width: 140, angle: -0.52, offset: 8 * info.T, seed: sd('stripes') });

      // 2. camera
      const zoom = 1 + 0.05 * E.inOutSine(t / info.dur);
      const cam = { x: 540, y: 800 + 160 / zoom, zoom };

      const ringsToDraw = [];
      L.camera(ctx, cam, (ctx) => {
        // 3. leaves
        ctx.drawImage(staticLayer(L, 'leaves', bi, (c) => {
          // scenery branches first
          for (const Lf of G.upperLeaves) drawLeaf(c, Lf, { thin: true });
          drawBranch(c, G.upper, 'upper', [[150, 96], [465, 33]], { w: 3 });
          for (const Lf of G.lowerLeaves) drawLeaf(c, Lf);
          for (const ch of G.lowCluster) if (ch.back) drawCherry(c, ch, ch.x, ch.y, ch.r, ch.col);
          drawBranch(c, G.lower, 'lower', [[320, G.lowY(320)], [575, G.lowY(575)], [830, G.lowY(830)]], { w: 3.5 });
          for (const ch of G.lowCluster) if (!ch.back) drawCherry(c, ch, ch.x, ch.y, ch.r, ch.col);
          for (const Lf of G.leaves) drawLeaf(c, Lf);
        }), 0, 0, 1080, 1920);

        // 4. back row (and the young side cherries behind the branch)
        for (const ch of SIDE) if (ch.back) {
          drawStalkStub(ctx, ch, ch.x, ch.y, ch.r);
          drawCherry(ctx, ch, ch.x, ch.y, ch.r, 'green');
        }
        const backDrawn = [];
        for (const ch of BACK) {
          const s = scaleOf(ch.k);
          const [cx, cy] = place(ch, s);
          backDrawn.push(drawCherry(ctx, ch, cx, cy, ch.r * s, stageOf(ch.k, tw)));
        }

        // 5. branch, then its shadow on the back row's lower halves is implied by the hatch
        ctx.drawImage(staticLayer(L, 'branch', bi, (c) => drawBranch(c, G.branch, 'hero', [[220, 700], [540, 700], [860, 700]], { w: 4 })), 0, 0, 1080, 1920);
        // the branch casts a band of shadow onto the back cherries just above it
        {
          const band = [[300, 690], [800, 690], [800, 660], [300, 664]];
          ctx.save();
          const u = new Path2D();
          for (const p of backDrawn) {
            u.moveTo(p[0][0], p[0][1]);
            for (let i = 1; i < p.length; i++) u.lineTo(p[i][0], p[i][1]);
            u.closePath();
          }
          ctx.clip(u);
          L.hatch(ctx, band, { angle: -Math.PI / 4 - Math.PI / 3, spacing: 4, width: 1.3, color: C.ink, alpha: 0.4, length: [8, 18], seed: sd('brsh'), clip: false });
          ctx.restore();
        }

        // 6. side cherries in front, then the front row (outer ones first, the centre nearest the camera)
        for (const ch of SIDE) if (!ch.back) {
          drawStalkStub(ctx, ch, ch.x, ch.y, ch.r);
          drawCherry(ctx, ch, ch.x, ch.y, ch.r, 'green');
        }
        const order = FRONT.slice().sort((a, b) => Math.abs(b.x - 540) - Math.abs(a.x - 540) || a.x - b.x);
        const drawn = new Path2D();
        let any = false;
        for (const ch of order) {
          const s = scaleOf(ch.k);
          const [cx, cy] = place(ch, s);
          const r = ch.r * s;
          // cast shadow of this cherry on the cherries already drawn behind it (down and right)
          if (any) {
            const sh = cherryPts(cx + 12, cy + 14, r, ch.tilt, 40);
            ctx.save();
            ctx.clip(drawn);
            L.hatch(ctx, sh, { angle: -Math.PI / 4, spacing: 3.6, width: 1.3, color: C.ink, alpha: 0.5, length: [8, 20], seed: sd('csh', ch.id) });
            ctx.restore();
          }
          drawStalkStub(ctx, ch, cx, cy, r);
          const pts = drawCherry(ctx, ch, cx, cy, r, stageOf(ch.k, tw));
          drawn.moveTo(pts[0][0], pts[0][1]);
          for (let i = 1; i < pts.length; i++) drawn.lineTo(pts[i][0], pts[i][1]);
          drawn.closePath();
          any = true;
        }

        // 7. magenta change rings the moment a cherry turns red
        for (const ch of FRONT.concat(BACK)) {
          const sc = SCHED[ch.k];
          if (sc.r == null || t < sc.r - 1e-6) continue;
          const f = (t - sc.r) * 24;
          if (f >= 12) continue;
          const pr = E.outExpo(clamp((f + 1) / 8));
          const a = 1 - clamp((f - 4) / 8);
          const p = new Path2D();
          const rr = ch.r * 1.12 + 6 + 46 * pr;
          p.arc(ch.x, ch.y, rr, 0, TAU);
          ringsToDraw.push(p);
          overlayStroke(ctx, p, C.annMagenta, a, 3);
        }
        // an annYellow attention ring on the overripe cherry
        if (t >= B_DEEP - 1e-6) {
          const f = (t - B_DEEP) * 24;
          if (f < 12) {
            const ch = BACK[2];
            const pr = E.outExpo(clamp((f + 1) / 8));
            const p = new Path2D();
            p.arc(ch.x, ch.y, ch.r + 8 + 36 * pr, 0, TAU);
            for (let q = 0; q < 4; q++) {
              const a = Math.PI / 4 + (q * Math.PI) / 2;
              const rr = ch.r + 8 + 36 * pr;
              p.moveTo(ch.x + Math.cos(a) * (rr - 9), ch.y + Math.sin(a) * (rr - 9));
              p.lineTo(ch.x + Math.cos(a) * (rr + 9), ch.y + Math.sin(a) * (rr + 9));
            }
            overlayStroke(ctx, p, C.annYellow, 1 - clamp((f - 4) / 8), 3);
          }
        }
      });

      // 8a. annBlue growth ruler at x 160, y 780 to 940, reading the leftmost front cherry
      {
        const ch = FRONT[0];
        const s = scaleOf(ch.k);
        const [wx, wy] = place(ch, s);
        // world to screen through the camera
        const toS = (x, y) => [540 + (x - cam.x) * zoom, 960 + (y - cam.y) * zoom];
        const top = toS(wx, wy - ch.r * 1.1 * s), bot = toS(wx, wy + ch.r * 1.1 * s);
        const rx = 160;
        const rul = new Path2D();
        rul.moveTo(rx, 780);
        rul.lineTo(rx, 940);
        for (let y = 780, i = 0; y <= 940 + 1e-6; y += 10, i++) {
          const long = i % 5 === 0;
          rul.moveTo(rx, y);
          rul.lineTo(rx - (long ? 28 : 12), y);
        }
        overlayStroke(ctx, rul, C.annBlue, 1, 2);
        // leaders from the cherry's top and bottom to the ruler, with arrow marks
        const ld = new Path2D();
        for (const p of [top, bot]) {
          const y = clamp(p[1], 760, 960);
          ld.moveTo(p[0] - ch.r * s * 0.2, p[1]);
          ld.lineTo(rx + 8, y);
        }
        ctx.save();
        ctx.setLineDash([14, 10]);
        overlayStroke(ctx, ld, C.annBlue, 0.9, 2);
        ctx.restore();
        ctx.save();
        ctx.fillStyle = C.annBlue;
        for (const p of [top, bot]) {
          const y = clamp(p[1], 760, 960);
          ctx.beginPath();
          ctx.moveTo(rx + 2, y);
          ctx.lineTo(rx + 16, y - 7);
          ctx.lineTo(rx + 16, y + 7);
          ctx.closePath();
          ctx.fill();
        }
        // the span between the marks, as a thicker bar on the ruler
        ctx.fillRect(rx - 3, clamp(top[1], 760, 960), 6, clamp(bot[1], 760, 960) - clamp(top[1], 760, 960));
        ctx.restore();
      }

      // 8b. annYellow month tally: nine dots on a ring at (840, 330), radius 70, one per 8th-triplet
      {
        const cx = 840, cy = 330, R = 70;
        const ring = new Path2D();
        ring.arc(cx, cy, R, 0, TAU);
        overlayStroke(ctx, ring, C.annYellow, 0.55, 2);
        let litN = 0;
        for (let k = 0; k < 9; k++) {
          const a0 = k * 0.25;
          const on = t >= a0 - 1e-6;
          if (on) litN = k + 1;
          const pop = on ? [1.35, 1.08, 1][Math.min(2, drawing(a0))] : 1;
          const a = -Math.PI / 2 + (k / 9) * TAU;
          const x = cx + Math.cos(a) * R, y = cy + Math.sin(a) * R;
          ctx.save();
          ctx.lineWidth = 3;
          ctx.strokeStyle = C.annYellow;
          ctx.fillStyle = C.annYellow;
          ctx.beginPath();
          ctx.arc(x, y, 10 * pop, 0, TAU);
          if (on) ctx.fill();
          else {
            ctx.fillStyle = L.pal.stripeCream;
            ctx.fill();
          }
          ctx.stroke();
          ctx.restore();
        }
        // a hand pointing at the newest dot
        const ha = -Math.PI / 2 + ((litN - 1) / 9) * TAU;
        const hand = new Path2D();
        hand.moveTo(cx, cy);
        hand.lineTo(cx + Math.cos(ha) * (R - 22), cy + Math.sin(ha) * (R - 22));
        overlayStroke(ctx, hand, C.annYellow, 1, 3);
        ctx.save();
        ctx.fillStyle = C.annYellow;
        ctx.beginPath();
        ctx.arc(cx, cy, 6, 0, TAU);
        ctx.fill();
        ctx.restore();
      }
      void ringsToDraw;
    },
  });
})();

</script>
<script>
// ---- src/scenes/07-picking.js
// 07 picking : Only the red ones.  T 12.00 to 14.25 (54 frames), illustrated, hard cut. Act 2 opens.
// A coffee branch runs across the frame from (-40, 520) to (1120, 640) with three tight mixed clusters
// (x 260, 560, 860) and opposite leaf pairs. A picker's right hand enters from the lower right, its
// forearm in a rolled tealDeep sleeve, and visits the clusters right to left. Thumb and index pinch a
// red cherry on the beat, twist it 15 degrees over 3 frames and let go; the cherry falls into the
// woven jute basket at the bottom along a dashed annBlue trajectory and the heap rises 14 px.
// At T 13.125 the hand hovers over a green cherry and moves on: annMagenta X ring.
//
// Layers, back to front:
//   1 stripes (stripeCream / stripeSage, drifting 6 px per beat)
//   2 leaves (opposite pairs) and the back row of each cluster
//   3 branch, then the front row of each cluster
//   4 basket inside (back wall, heap of red cherries), landed cherries
//   5 basket front (weave, rim rope, waist cord)
//   6 falling cherries
//   7 forearm, sleeve and hand (pinching cherry held between thumb and index)
//   8 overlays: dashed annBlue trajectories, annYellow check rings, annMagenta X ring
(function () {
  'use strict';

  const ID = 'picking';
  const LIB = FILM.lib;
  const TAU = Math.PI * 2;
  const DEG = Math.PI / 180;
  const FR = 1 / 24;

  const clamp = (v, lo = 0, hi = 1) => (v < lo ? lo : v > hi ? hi : v);
  const lerp = (a, b, t) => a + (b - a) * t;
  const sstep = (a, b, x) => {
    const u = clamp((x - a) / (b - a));
    return u * u * (3 - 2 * u);
  };
  const sd = (...k) => LIB.hash(ID, ...k) & 0x7fffffff;
  const h3 = LIB.h3;

  // ---------------------------------------------------------------------------
  // beats (shot-local seconds)
  // ---------------------------------------------------------------------------
  // picks: T 12.00, 12.375 (cluster 3), 12.75 (cluster 2), 13.125 skip, 13.50, 13.875 (cluster 1)
  const EV = [
    { t: 0.0, cl: 2, ci: 4, pick: true, land: [470, 0] }, // T 12.000
    { t: 0.375, cl: 2, ci: 6, pick: true, land: [640, 0] }, // T 12.375
    { t: 0.75, cl: 1, ci: 5, pick: true, land: [555, 0] }, // T 12.750
    { t: 1.125, cl: 1, ci: 4, pick: false }, // T 13.125 skip (green)
    { t: 1.5, cl: 0, ci: 4, pick: true, land: [395, 0] }, // T 13.500
    { t: 1.875, cl: 0, ci: 5, pick: true, land: [700, 0] }, // T 13.875
  ];
  const TWIST = 3 * FR;
  const FALL = 6 * FR; // released at pick + 3 frames, lands 9 frames after the pick
  const HEAP_STEP = 14;
  const HAND_SCALE = 1.3; // the hand is drawn large: index finger about as wide as a cherry

  // ---------------------------------------------------------------------------
  // geometry
  // ---------------------------------------------------------------------------
  const BR0 = [-40, 520], BR1 = [1120, 640];
  const branchY = (x) => BR0[1] + ((x - BR0[0]) * (BR1[1] - BR0[1])) / (BR1[0] - BR0[0]) + 6 * Math.sin((x + 40) * 0.006);
  const CLX = [260, 560, 860];

  // cluster layouts: offsets from the node, colour (g, y, r), back row flag. Index 4..6 are front row.
  const CL_LAYOUT = [
    // cluster 1 (x 260)
    [
      [-62, -36, 'g', 1], [4, -44, 'r', 1], [62, -32, 'y', 1], [-78, 30, 'y', 0],
      [-22, 56, 'r', 0], [52, 46, 'r', 0], [100, 14, 'g', 0], [14, 22, 'g', 0],
    ],
    // cluster 2 (x 560)
    [
      [-58, -34, 'r', 1], [6, -42, 'y', 1], [66, -28, 'g', 1], [-92, 24, 'r', 0],
      [-36, 58, 'g', 0], [30, 56, 'r', 0], [88, 28, 'y', 0], [-4, 20, 'g', 0],
    ],
    // cluster 3 (x 860)
    [
      [-56, -34, 'g', 1], [10, -42, 'r', 1], [66, -28, 'y', 1], [-90, 28, 'g', 0],
      [-26, 58, 'r', 0], [40, 54, 'g', 0], [98, 26, 'r', 0], [8, 22, 'y', 0],
    ],
  ];

  // the heap's surface before any cherry lands: a low dome just under the back rim
  const heapSurf = (x) => 1330 - 44 * (1 - Math.pow(clamp(Math.abs(x - 540) / 380), 2));

  let GEO = null;
  function geo(L) {
    if (GEO) return GEO;
    const P = L.pal;
    const COLS = {
      g: { fill: P.cherryGreen, deep: L.mix(P.cherryGreen, P.leafDeep, 0.65), hi: L.mix(P.cherryGreen, P.white, 0.45) },
      y: { fill: P.cherryYellow, deep: L.mix(P.cherryYellow, P.ochre, 0.8), hi: L.mix(P.cherryYellow, P.white, 0.5) },
      r: { fill: P.cherryRed, deep: P.cherryDeep, hi: P.cherryLight },
    };
    // clusters
    const clusters = CLX.map((x, k) => {
      const ny = branchY(x);
      return CL_LAYOUT[k].map((o, i) => {
        const cx = x + o[0], cy = ny + o[1];
        const dx = o[0] * 0.6, dy = o[1] + (o[3] ? -10 : 10);
        const rot = Math.atan2(dy, dx) - Math.PI / 2;
        const r = 38 + 4 * h3(k, i, sd('cr'));
        return { x: cx, y: cy, r, rot, col: COLS[o[2]], kind: o[2], back: !!o[3], seed: sd('ch', k, i) };
      });
    });
    // branch outline: thicker at the left (toward the trunk)
    const spine = [];
    for (let i = 0; i <= 40; i++) {
      const x = lerp(BR0[0] - 20, BR1[0] + 20, i / 40);
      spine.push([x, branchY(x)]);
    }
    const halfW = (x) => lerp(17, 11, clamp((x + 40) / 1200));
    const top = spine.map(([x, y]) => [x, y - halfW(x)]);
    const bot = spine.map(([x, y]) => [x, y + halfW(x)]);
    const branchPoly = top.concat(bot.slice().reverse());

    // leaves: opposite pairs at four nodes
    const LEAVES = [
      [110, -122, 330, 1], [110, 108, 350, -1],
      [410, -68, 380, -1], [410, 116, 330, 1],
      [710, -104, 400, 1], [710, 70, 230, -1],
      [1010, -58, 330, -1], [1010, 108, 260, 1],
    ].map((d, i) => buildLeaf(L, d[0], branchY(d[0]), d[1] * DEG, d[2], d[3], sd('leaf', i)));

    // heap: cherries packed in a dome inside the basket mouth (centres below the heap surface)
    const heap = [];
    const rH = L.rng(sd('heap'));
    for (let row = 0; row < 10; row++) {
      const y = 1262 + row * 23;
      for (let i = 0; i < 15; i++) {
        const x = 540 + (i - 7) * 54 + rH.range(-12, 12) + (row % 2) * 27;
        const yy = y + rH.range(-6, 6);
        if (Math.abs(x - 540) > 350) continue;
        if (yy < heapSurf(x) + 6) continue;
        heap.push({ x, y: yy, r: rH.range(29, 35), rot: rH.range(-3, 3), seed: sd('hp', row, i), kind: rH() < 0.88 ? 'r' : 'd' });
      }
    }
    heap.sort((a, b) => a.y - b.y);

    // a lower lateral at the left, with unripe cherries left for a later pass
    const b2y = (x) => 1010 + (x + 40) * 0.13 + 5 * Math.sin(x * 0.01);
    const s2 = [];
    for (let i = 0; i <= 16; i++) {
      const x = lerp(-60, 330, i / 16);
      s2.push([x, b2y(x)]);
    }
    const hw2 = (x) => lerp(13, 5, clamp((x + 60) / 390));
    const top2 = s2.map(([x, y]) => [x, y - hw2(x)]);
    const bot2 = s2.map(([x, y]) => [x, y + hw2(x)]);
    const low = {
      poly: top2.concat(bot2.slice().reverse()), top: top2, bot: bot2, y: b2y,
      leaves: [[170, -100, 270, 1], [170, 96, 250, -1], [-10, 70, 230, 1]].map((d, i) => buildLeaf(L, d[0], b2y(d[0]), d[1] * DEG, d[2], d[3], sd('leaf2', i))),
      cherries: [[-46, -26, 'g'], [8, -32, 'g'], [-60, 26, 'y'], [-8, 40, 'g'], [44, 22, 'g'], [52, -18, 'y']].map((o, i) => {
        const x = 80 + o[0], y = b2y(80) + o[1];
        const rot = Math.atan2(o[1] + (o[1] < 0 ? -10 : 10), o[0] * 0.6) - Math.PI / 2;
        return { x, y, r: 34 + 3 * h3(i, 5, sd('lc')), rot, col: COLS[o[2]], back: o[1] < 0, seed: sd('lc', i) };
      }),
    };

    GEO = { clusters, branchPoly, top, bot, spine, LEAVES, heap, COLS, low };
    return GEO;
  }

  // a coffee leaf: elliptic blade, drawn-out tip, wavy margin, 9 looping lateral veins
  function buildLeaf(L, bx, by, ang, len, wid, seed) {
    const W = len * 0.48 * (wid > 0 ? 1 : 0.94);
    const ca = Math.cos(ang), sa = Math.sin(ang);
    const P2 = (u, v) => [bx + ca * u - sa * v, by + sa * u + ca * v];
    const pet = len * 0.09;
    const half = (u) => {
      // u 0..1 along the blade
      const s = Math.pow(Math.sin(Math.PI * Math.pow(u, 0.85)), 0.9);
      const tip = u > 0.86 ? 1 - 0.55 * sstep(0.86, 1, u) : 1;
      return (W / 2) * s * tip;
    };
    const n = 46;
    const sideA = [], sideB = [];
    for (let i = 0; i <= n; i++) {
      const u = i / n;
      const wav = 1 + 0.045 * Math.sin(u * TAU * 5 + (seed % 7)) * Math.sin(Math.PI * u);
      const wavB = 1 + 0.045 * Math.sin(u * TAU * 5 + 1.7 + (seed % 5)) * Math.sin(Math.PI * u);
      const bend = 0.06 * len * Math.sin(Math.PI * u);
      const uu = pet + u * (len - pet);
      sideA.push(P2(uu, -half(u) * wav + bend * 0.3));
      sideB.push(P2(uu, half(u) * wavB + bend * 0.3));
    }
    const outline = sideA.concat(sideB.slice().reverse());
    const mid = [];
    for (let i = 0; i <= 20; i++) {
      const u = i / 20;
      mid.push(P2(pet + u * (len - pet), 0.06 * len * Math.sin(Math.PI * u) * 0.3));
    }
    const veins = [];
    for (let k = 1; k <= 9; k++) {
      const u0 = 0.06 + k * 0.088;
      for (const s of [-1, 1]) {
        const uu0 = pet + u0 * (len - pet);
        const u1 = Math.min(0.97, u0 + 0.14);
        const uu1 = pet + u1 * (len - pet);
        const hw = half(u1) * 0.82;
        const bend = 0.06 * len * Math.sin(Math.PI * u0) * 0.3;
        veins.push({ s, pts: [P2(uu0, bend), P2(lerp(uu0, uu1, 0.45), s * half(lerp(u0, u1, 0.45)) * 0.55 + bend), P2(uu1, s * hw + bend)] });
      }
    }
    const petiole = [[bx, by], P2(pet * 0.5, 2), P2(pet, 0)];
    // gloss streak on one side of the midrib
    const sheen = [];
    for (let i = 2; i <= 16; i++) {
      const u = i / 20;
      sheen.push(P2(pet + u * (len - pet), -half(u) * 0.18 - 3));
    }
    for (let i = 16; i >= 2; i--) {
      const u = i / 20;
      sheen.push(P2(pet + u * (len - pet), -half(u) * 0.42 - 3));
    }
    // shadow half: the half whose normal points further down-right
    const nA = [-sa * -1, ca * -1];
    const shadeSide = nA[0] + nA[1] > 0 ? -1 : 1; // -1 means side A is the shadow side
    const shadowPoly = (shadeSide < 0 ? sideA : sideB).concat(mid.slice().reverse());
    return { outline, mid, veins, petiole, sheen, shadowPoly, ang, seed };
  }

  // ---------------------------------------------------------------------------
  // drawing helpers
  // ---------------------------------------------------------------------------
  function strokePath(ctx, path, color, alpha, width, dash) {
    ctx.save();
    ctx.strokeStyle = color;
    ctx.globalAlpha *= alpha;
    ctx.lineWidth = width;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    if (dash) ctx.setLineDash(dash);
    ctx.stroke(path);
    ctx.restore();
  }
  // a static layer rendered once per boil drawing into an offscreen canvas (y0..y0+h band)
  function sprite(ctx, L, key, y0, h, bi, drawFn) {
    const S = FILM.S || 1;
    const c = L.cached([ID, key, y0, h, S, bi].join('|'), () => {
      const cv = FILM.makeCanvas(Math.round(1080 * S), Math.round(h * S));
      const g = cv.getContext('2d');
      g.scale(S, S);
      g.translate(0, -y0);
      drawFn(g);
      return cv;
    });
    ctx.drawImage(c, 0, y0, 1080, h);
  }
  function fillPoly(ctx, pts, color, alpha = 1) {
    ctx.save();
    ctx.globalAlpha *= alpha;
    ctx.fillStyle = color;
    ctx.beginPath();
    LIB.tracePath(ctx, pts, true);
    ctx.fill();
    ctx.restore();
  }

  function drawLeaf(ctx, L, P, lf, bi) {
    L.inkPath(ctx, lf.petiole, { width: 3, seed: lf.seed + 1, taper: [2, 8] });
    L.inkPath(ctx, lf.outline, { closed: true, width: 3, fill: P.leafCoffee, seed: lf.seed + 2 });
    fillPoly(ctx, lf.sheen, P.leafSheen, 0.55);
    L.hatch(ctx, lf.shadowPoly, {
      angle: lf.ang + (lf.ang > 0 ? -0.9 : 0.9), spacing: 6, width: 1.3, color: P.leafDeep, alpha: 0.85, length: [10, 34], seed: lf.seed + 3,
    });
    L.hatch(ctx, lf.outline, { angle: lf.ang - 0.9, spacing: 11, width: 1.2, color: P.leafDeep, alpha: 0.45, length: [8, 22], seed: lf.seed + 4, density: 0.5 });
    L.inkPath(ctx, lf.mid, { width: 2.2, color: P.leafDeep, seed: lf.seed + 5, taper: [4, 30] });
    const vp = new Path2D();
    for (let i = 0; i < lf.veins.length; i++) {
      const v = lf.veins[i].pts;
      const j = (k) => (h3(i * 3 + k, bi, lf.seed) - 0.5) * 1.4;
      vp.moveTo(v[0][0] + j(0), v[0][1] + j(1));
      vp.quadraticCurveTo(v[1][0] + j(2), v[1][1] + j(0), v[2][0] + j(1), v[2][1] + j(2));
    }
    strokePath(ctx, vp, P.leafDeep, 0.9, 1.7);
  }

  // a coffee cherry: slightly oval, flat colour, shadow hatching lower right, gloss, calyx scar at the tip
  function drawCherry(ctx, L, P, c, x, y, rot, o = {}) {
    const r = c.r * (o.scale || 1);
    const pts = L.ellipsePts(x, y, r, r * 1.1, 36, rot);
    L.inkPath(ctx, pts, { closed: true, width: o.width || 3.4, fill: c.col.fill, seed: c.seed, wobble: 1 });
    if (!o.cheap) {
      L.hatch(ctx, L.ellipsePts(x, y, r - 2, r * 1.1 - 2, 30, rot), {
        spacing: 5, width: 1.3, color: c.col.deep, alpha: 0.85, length: [8, 26], seed: c.seed + 1, inset: 1, overshoot: 0,
        density: (px, py) => sstep(-0.15, 0.75, ((px - x) * 0.7 + (py - y) * 0.7) / r),
      });
    }
    // gloss crescent upper left and a glint
    ctx.save();
    ctx.fillStyle = c.col.hi;
    ctx.globalAlpha = 0.9;
    ctx.beginPath();
    ctx.ellipse(x - r * 0.36, y - r * 0.4, r * 0.34, r * 0.17, -0.75, 0, TAU);
    ctx.fill();
    ctx.fillStyle = P.white;
    ctx.beginPath();
    ctx.ellipse(x - r * 0.42, y - r * 0.46, r * 0.13, r * 0.07, -0.75, 0, TAU);
    ctx.fill();
    ctx.restore();
    // calyx scar at the tip
    const tx = x - Math.sin(rot) * r * 0.86, ty = y + Math.cos(rot) * r * 0.86;
    ctx.save();
    ctx.fillStyle = P.cherryDeep === c.col.deep ? P.ink : L.mix(c.col.deep, P.ink, 0.5);
    ctx.globalAlpha = 0.9;
    ctx.beginPath();
    ctx.ellipse(tx, ty, r * 0.17, r * 0.12, rot, 0, TAU);
    ctx.fill();
    ctx.restore();
    if (!o.cheap) {
      const st = new Path2D();
      for (let k = 0; k < 5; k++) {
        const a = rot + (k / 5) * TAU;
        st.moveTo(tx, ty);
        st.lineTo(tx + Math.cos(a) * r * 0.24, ty + Math.sin(a) * r * 0.18);
      }
      strokePath(ctx, st, P.ink, 0.7, 1.2);
    }
  }

  // a cherry deep in the heap: flat colour, a shadow crescent, outline, gloss (no hatching)
  function cheapCherry(ctx, P, x, y, r, col, rot) {
    ctx.save();
    ctx.fillStyle = col.deep;
    ctx.beginPath();
    ctx.ellipse(x, y, r, r * 1.08, rot, 0, TAU);
    ctx.fill();
    ctx.fillStyle = col.fill;
    ctx.beginPath();
    ctx.ellipse(x - r * 0.12, y - r * 0.14, r * 0.86, r * 0.92, rot, 0, TAU);
    ctx.fill();
    ctx.strokeStyle = P.ink;
    ctx.lineWidth = 2.6;
    ctx.beginPath();
    ctx.ellipse(x, y, r, r * 1.08, rot, 0, TAU);
    ctx.stroke();
    ctx.fillStyle = col.hi;
    ctx.beginPath();
    ctx.ellipse(x - r * 0.38, y - r * 0.42, r * 0.3, r * 0.15, -0.75, 0, TAU);
    ctx.fill();
    ctx.fillStyle = P.white;
    ctx.beginPath();
    ctx.ellipse(x - r * 0.44, y - r * 0.47, r * 0.11, r * 0.06, -0.75, 0, TAU);
    ctx.fill();
    ctx.restore();
  }

  // ---------------------------------------------------------------------------
  // the hand: designed in a local frame with the pinched cherry at the origin, the wrist toward +x,
  // the back of the hand toward -y. Seen from the thumb side.
  // ---------------------------------------------------------------------------
  function limb(L, cl, radii, step = 4) {
    // centreline from tip to base, radius per knot; outline with round caps
    const n = cl.length;
    const sm = [];
    const rr = [];
    for (let i = 0; i < n - 1; i++) {
      const a = cl[i], b = cl[i + 1];
      const d = Math.hypot(b[0] - a[0], b[1] - a[1]);
      const k = Math.max(1, Math.ceil(d / step));
      for (let j = 0; j < k; j++) {
        const u = j / k;
        // gentle curve through the joint: quadratic blend with the neighbours
        sm.push([lerp(a[0], b[0], u), lerp(a[1], b[1], u)]);
        rr.push(lerp(radii[i], radii[i + 1], u));
      }
    }
    sm.push(cl[n - 1].slice());
    rr.push(radii[n - 1]);
    // smooth the centreline a little (3 passes) keeping the ends
    for (let pass = 0; pass < 4; pass++) {
      for (let i = 1; i < sm.length - 1; i++) {
        sm[i] = [(sm[i - 1][0] + sm[i][0] * 2 + sm[i + 1][0]) / 4, (sm[i - 1][1] + sm[i][1] * 2 + sm[i + 1][1]) / 4];
      }
    }
    const m = sm.length;
    const A = [], B = [], N = [];
    for (let i = 0; i < m; i++) {
      const p0 = sm[Math.max(0, i - 1)], p1 = sm[Math.min(m - 1, i + 1)];
      let tx = p1[0] - p0[0], ty = p1[1] - p0[1];
      const tl = Math.hypot(tx, ty) || 1;
      tx /= tl;
      ty /= tl;
      const nx = -ty, ny = tx;
      N.push([nx, ny, tx, ty]);
      A.push([sm[i][0] + nx * rr[i], sm[i][1] + ny * rr[i]]);
      B.push([sm[i][0] - nx * rr[i], sm[i][1] - ny * rr[i]]);
    }
    const cap = (c, r, a0, a1) => {
      const out = [];
      for (let k = 1; k < 10; k++) {
        const a = lerp(a0, a1, k / 10);
        out.push([c[0] + Math.cos(a) * r, c[1] + Math.sin(a) * r]);
      }
      return out;
    };
    const aT = Math.atan2(N[0][1], N[0][0]);
    const aE = Math.atan2(N[m - 1][1], N[m - 1][0]);
    const outline = []
      .concat(A)
      .concat(cap(sm[m - 1], rr[m - 1], aE, aE - Math.PI))
      .concat(B.slice().reverse())
      .concat(cap(sm[0], rr[0], aT + Math.PI, aT));
    return { outline, sm, rr, N, A, B };
  }

  const rotP = (p, c, a) => {
    const ca = Math.cos(a), sa = Math.sin(a);
    const dx = p[0] - c[0], dy = p[1] - c[1];
    return [c[0] + dx * ca - dy * sa, c[1] + dx * sa + dy * ca];
  };

  // hand shapes for an opening amount `open` (0 pinch, 1 open). Pure function of open (quantised).
  const handCache = new Map();
  function handGeo(L, open) {
    const key = Math.round(open * 20);
    if (handCache.has(key)) return handCache.get(key);
    const op = key / 20;
    // index: tip, DIP, PIP, MCP. Opening lifts it about the MCP.
    const MCPi = [205, -96];
    let idx = [[16, -47], [60, -90], [122, -113], MCPi];
    idx = idx.map((p, i) => (i < 3 ? rotP(rotP(p, [122, -113], i < 2 ? 14 * DEG * op : 0), MCPi, 10 * DEG * op) : p));
    const index = limb(L, idx, [21, 23.5, 26, 29]);
    // thumb: tip, IP, MCP, CMC. Opening drops it about the CMC.
    const CMC = [238, 72];
    let th = [[27, 44], [86, 76], [152, 94], CMC];
    th = th.map((p, i) => (i < 3 ? rotP(p, CMC, -12 * DEG * op) : p));
    const thumb = limb(L, th, [22, 24.5, 30, 40]);
    // curled middle, ring and little fingers (seen past the index, curling into the palm)
    const mid = limb(L, [[134, 4], [112, -22], [138, -62], [218, -64]].map((p, i) => (i < 2 ? rotP(p, [138, -62], -10 * DEG * op) : p)), [19, 22, 25, 27]);
    const ring = limb(L, [[168, 30], [148, 6], [168, -26], [230, -32]].map((p, i) => (i < 2 ? rotP(p, [168, -26], -8 * DEG * op) : p)), [17, 20, 22.5, 25]);
    const pinky = limb(L, [[200, 50], [184, 30], [196, 4], [240, -2]], [15, 17, 19, 21]);
    // back of the hand and palm mass, joined to the wrist
    const palm = L.smoothPts([
      [196, -124], [232, -126], [280, -116], [336, -100], [392, -84],
      [404, -20], [410, 62], [352, 104], [290, 122], [232, 122], [190, 112],
      [182, 70], [186, 20], [180, -40], [182, -96],
    ], true, 5);
    // forearm in local coordinates, running out toward +x (off frame)
    const armTop = L.smoothPts([[386, -84], [480, -94], [600, -98], [760, -96], [1100, -92], [1500, -90]], false, 8);
    const armBot = L.smoothPts([[408, 64], [500, 84], [620, 98], [780, 104], [1100, 108], [1500, 110]], false, 8);
    const arm = armTop.concat(armBot.slice().reverse());
    // sleeve from x 610 on: rolled cuff 610..690, then the sleeve
    const sleeveY = (pts, x) => {
      for (let i = 1; i < pts.length; i++) if (pts[i][0] >= x) {
        const a = pts[i - 1], b = pts[i];
        return lerp(a[1], b[1], (x - a[0]) / (b[0] - a[0] || 1));
      }
      return pts[pts.length - 1][1];
    };
    const cuff = [];
    const sleeve = [];
    {
      const x0 = 612, x1 = 700;
      const yt0 = sleeveY(armTop, x0) - 12, yb0 = sleeveY(armBot, x0) + 12;
      const yt1 = sleeveY(armTop, x1) - 14, yb1 = sleeveY(armBot, x1) + 14;
      cuff.push([x0, yt0], [x0 - 8, (yt0 + yb0) / 2], [x0, yb0], [x1, yb1], [x1 + 6, (yt1 + yb1) / 2], [x1, yt1]);
      sleeve.push([x1 - 4, yt1 + 4], [x1 + 200, yt1 - 6], [1600, yt1 - 10], [1600, yb1 + 14], [x1 + 200, yb1 + 10], [x1 - 4, yb1 - 4]);
    }
    const g = { index, thumb, mid, ring, pinky, palm, arm, armTop, armBot, cuff, sleeve, idx, th };
    handCache.set(key, g);
    return g;
  }

  // wrinkles across a finger at knot position `at` (index into the limb's centreline), dorsal sign s
  function jointMarks(path, lb, at, s, rScale = 1) {
    const i = Math.max(1, Math.min(lb.sm.length - 2, at));
    const c = lb.sm[i], r = lb.rr[i] * rScale;
    const [nx, ny, tx, ty] = lb.N[i];
    for (let k = -1; k <= 1; k++) {
      const off = k * 5;
      const ax = c[0] + nx * s * r * 0.92 + tx * off, ay = c[1] + ny * s * r * 0.92 + ty * off;
      const bx = c[0] + nx * s * r * (0.5 - 0.1 * Math.abs(k)) + tx * (off + 3), by = c[1] + ny * s * r * (0.5 - 0.1 * Math.abs(k)) + ty * (off + 3);
      path.moveTo(ax, ay);
      path.quadraticCurveTo((ax + bx) / 2 + tx * 3, (ay + by) / 2 + ty * 3, bx, by);
    }
  }
  function nearestKnot(lb, p) {
    let bi = 0, bd = 1e9;
    for (let i = 0; i < lb.sm.length; i++) {
      const d = Math.hypot(lb.sm[i][0] - p[0], lb.sm[i][1] - p[1]);
      if (d < bd) { bd = d; bi = i; }
    }
    return bi;
  }

  function drawHand(ctx, L, P, H, bi, seedBase) {
    const skin = P.skin, deep = P.skinDeep;
    const S = (k) => seedBase + k * 131;
    const shadeLocal = (cx, cy, r) => (x, y) => sstep(-0.1, 0.8, ((y - cy) * 0.8 + (x - cx) * 0.25) / r);
    // forearm
    L.inkPath(ctx, H.arm, { closed: true, width: 4, fill: skin, seed: S(1), taper: [0, 0] });
    L.hatch(ctx, H.arm, { angle: Math.PI / 2 + 0.15, spacing: 7, width: 1.4, color: deep, alpha: 0.85, length: [10, 30], bend: 3, seed: S(2), density: (x, y) => sstep(10, 90, y) });
    L.hatch(ctx, H.arm, { angle: Math.PI / 2 - 0.3, spacing: 6, width: 1.2, color: deep, alpha: 0.7, length: [8, 20], seed: S(3), density: (x, y) => sstep(60, 105, y) });
    // arm hairs (stipple-like short dashes on the upper arm)
    {
      const hp = new Path2D();
      const r = L.rng(S(4));
      for (let i = 0; i < 70; i++) {
        const x = r.range(430, 610), y = r.range(-80, 40);
        hp.moveTo(x, y);
        hp.lineTo(x + 5 + r() * 3, y - 2 + r() * 2);
      }
      strokePath(ctx, hp, deep, 0.5, 1);
    }
    // sleeve and rolled cuff
    L.inkPath(ctx, H.sleeve, { closed: true, width: 4, fill: P.tealDeep, seed: S(5), taper: [0, 0] });
    L.hatch(ctx, H.sleeve, { angle: Math.PI / 2 + 0.25, spacing: 6, width: 1.4, color: P.ink, alpha: 0.6, length: [12, 40], seed: S(6), density: (x, y) => sstep(-20, 100, y) });
    {
      const fold = new Path2D();
      fold.moveTo(760, -90); fold.quadraticCurveTo(800, -20, 770, 100);
      fold.moveTo(880, -96); fold.quadraticCurveTo(900, 0, 860, 104);
      strokePath(ctx, fold, P.ink, 0.6, 1.8);
    }
    L.inkPath(ctx, H.cuff, { closed: true, width: 4, fill: L.mix(P.tealDeep, P.teal, 0.55), seed: S(7) });
    L.hatch(ctx, H.cuff, { angle: Math.PI / 2 + 0.1, spacing: 5, width: 1.3, color: P.tealDeep, alpha: 0.9, length: [8, 24], seed: S(8), density: (x, y) => sstep(-30, 70, y) });
    {
      const cl = new Path2D();
      cl.moveTo(640, -108); cl.quadraticCurveTo(628, 0, 640, 118);
      cl.moveTo(670, -110); cl.quadraticCurveTo(660, 0, 672, 120);
      strokePath(ctx, cl, P.tealDeep, 0.9, 2.2);
    }
    // wrist crease and the ulna bump shading
    {
      const wc = new Path2D();
      wc.moveTo(398, 40); wc.quadraticCurveTo(420, 10, 414, -30);
      strokePath(ctx, wc, P.inkSoft, 0.8, 1.8);
    }
    // little and ring fingers (behind), palm, middle finger
    for (const [lb, k] of [[H.pinky, 10], [H.ring, 11]]) {
      L.inkPath(ctx, lb.outline, { closed: true, width: 3, fill: L.mix(skin, deep, 0.25), seed: S(k) });
      L.hatch(ctx, lb.outline, { angle: 0.5, spacing: 5, width: 1.2, color: deep, alpha: 0.8, length: [6, 18], seed: S(k + 20), density: 0.7 });
    }
    L.inkPath(ctx, H.palm, { closed: true, width: 4, fill: skin, seed: S(12) });
    // back-of-hand tone: shadow toward the lower right in local space, tendons, knuckle bumps
    L.hatch(ctx, H.palm, { angle: 1.25, spacing: 7, width: 1.3, color: deep, alpha: 0.8, length: [10, 28], bend: 2, seed: S(13), density: shadeLocal(300, 0, 130) });
    L.hatch(ctx, H.palm, { angle: 0.2, spacing: 6, width: 1.2, color: deep, alpha: 0.7, length: [8, 20], seed: S(14), density: (x, y) => sstep(60, 115, y) * 0.9 });
    {
      const tn = new Path2D();
      tn.moveTo(232, -112); tn.quadraticCurveTo(300, -96, 380, -74);
      tn.moveTo(236, -88); tn.quadraticCurveTo(300, -70, 378, -50);
      tn.moveTo(250, -60); tn.quadraticCurveTo(310, -40, 376, -24);
      strokePath(ctx, tn, P.inkSoft, 0.45, 1.5);
      // knuckle bumps of middle and ring MCP on the back of the hand
      const kb = new Path2D();
      kb.moveTo(214, -118); kb.quadraticCurveTo(226, -126, 238, -118);
      kb.moveTo(228, -96); kb.quadraticCurveTo(240, -104, 252, -96);
      kb.moveTo(204, -110); kb.quadraticCurveTo(206, -100, 214, -96);
      strokePath(ctx, kb, P.ink, 0.75, 1.8);
      // a vein over the back of the hand
      const vn = new Path2D();
      vn.moveTo(268, -100); vn.bezierCurveTo(300, -80, 320, -96, 352, -66); vn.quadraticCurveTo(370, -50, 396, -56);
      strokePath(ctx, vn, deep, 0.6, 2);
    }
    // middle finger curled under the index: knuckle wrinkles and its nail at the curled tip
    L.inkPath(ctx, H.mid.outline, { closed: true, width: 3.4, fill: skin, seed: S(15) });
    L.hatch(ctx, H.mid.outline, { angle: 0.4, spacing: 5, width: 1.2, color: deep, alpha: 0.85, length: [6, 18], seed: S(16), density: (x, y) => sstep(-50, 0, y) * 0.6 + 0.25 });
    // index finger
    L.inkPath(ctx, H.index.outline, { closed: true, width: 4, fill: skin, seed: S(17) });
    {
      // contour hatching on the palm (lower) half, perpendicular to the finger
      const lb = H.index;
      const lower = lb.B.slice().concat(lb.sm.slice().reverse());
      const hp = new Path2D();
      for (let i = 2; i < lb.sm.length - 2; i += 2) {
        const c = lb.sm[i], r = lb.rr[i];
        const [nx, ny, tx, ty] = lb.N[i];
        const jj = h3(i, bi, S(18));
        const a = 0.05 + 0.25 * jj;
        hp.moveTo(c[0] - nx * r * a, c[1] - ny * r * a);
        hp.quadraticCurveTo(c[0] - nx * r * 0.6 + tx * 3, c[1] - ny * r * 0.6 + ty * 3, c[0] - nx * r * 0.92, c[1] - ny * r * 0.92);
      }
      strokePath(ctx, hp, deep, 0.8, 1.3);
      L.hatch(ctx, lower, { angle: 1.1, spacing: 6, width: 1.1, color: deep, alpha: 0.5, length: [6, 14], seed: S(19), density: 0.6 });
    }
    // thumb (front)
    L.inkPath(ctx, H.thumb.outline, { closed: true, width: 4, fill: skin, seed: S(21) });
    {
      const lb = H.thumb;
      const hp = new Path2D();
      for (let i = 2; i < lb.sm.length - 2; i += 2) {
        const c = lb.sm[i], r = lb.rr[i];
        const [nx, ny, tx, ty] = lb.N[i];
        const a = 0.0 + 0.3 * h3(i, bi, S(22));
        // shadow on the side away from the index (local +y)
        const sgn = ny > 0 ? 1 : -1;
        hp.moveTo(c[0] + nx * sgn * r * a, c[1] + ny * sgn * r * a);
        hp.quadraticCurveTo(c[0] + nx * sgn * r * 0.6 + tx * 3, c[1] + ny * sgn * r * 0.6 + ty * 3, c[0] + nx * sgn * r * 0.93, c[1] + ny * sgn * r * 0.93);
      }
      strokePath(ctx, hp, deep, 0.8, 1.3);
      // thenar mound crease
      const tc = new Path2D();
      tc.moveTo(190, 104); tc.bezierCurveTo(176, 70, 196, 40, 230, 30);
      strokePath(ctx, tc, P.inkSoft, 0.75, 1.8);
    }
    // joint wrinkles: index DIP and PIP (dorsal = side toward -y), palm creases; thumb IP
    {
      const wr = new Path2D();
      const iDIP = nearestKnot(H.index, H.idx[1]), iPIP = nearestKnot(H.index, H.idx[2]);
      const dorsI = H.index.N[iPIP][1] < 0 ? 1 : -1; // normal side pointing up
      jointMarks(wr, H.index, iDIP, dorsI, 1);
      jointMarks(wr, H.index, iPIP, dorsI, 1);
      jointMarks(wr, H.index, iDIP, -dorsI, 0.9);
      jointMarks(wr, H.index, iPIP, -dorsI, 0.9);
      const iIP = nearestKnot(H.thumb, H.th[1]);
      const dorsT = H.thumb.N[iIP][1] > 0 ? 1 : -1;
      jointMarks(wr, H.thumb, iIP, dorsT, 1);
      jointMarks(wr, H.thumb, iIP, -dorsT, 0.9);
      const iMid = nearestKnot(H.mid, [112, -22]);
      jointMarks(wr, H.mid, iMid, H.mid.N[iMid][0] < 0 ? 1 : -1, 1);
      strokePath(ctx, wr, P.inkSoft, 0.9, 1.6);
    }
    // nails: index (on the dorsal edge of the distal phalanx), thumb, middle finger
    const nail = (lb, tipIdx, s, len, wid, rot = 0, k = 30) => {
      const i = Math.min(lb.sm.length - 1, tipIdx);
      const c = lb.sm[i], r = lb.rr[i];
      const [nx, ny, tx, ty] = lb.N[i];
      const cx = c[0] + nx * s * r * 0.52, cy = c[1] + ny * s * r * 0.52;
      const ang = Math.atan2(ty, tx) + rot;
      const pts = L.ellipsePts(cx, cy, len / 2, wid / 2, 24, ang);
      L.inkPath(ctx, pts, { closed: true, width: 2.2, fill: L.mix(P.skin, P.white, 0.55), seed: S(k) });
      // lunula and free edge
      const ln = new Path2D();
      const ex = cx - Math.cos(ang) * len * 0.36, ey = cy - Math.sin(ang) * len * 0.36;
      ln.moveTo(ex - nx * wid * 0.3, ey - ny * wid * 0.3);
      ln.lineTo(ex + nx * wid * 0.3, ey + ny * wid * 0.3);
      strokePath(ctx, ln, P.white, 0.9, 2.4);
