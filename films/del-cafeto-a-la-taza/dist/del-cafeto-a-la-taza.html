// ---- src/scenes/01-hero-cherries.js
// 01 hero-cherries : Cold open, the ripe cherry (illustrated, global T 0.00 to 1.50)
//
// A macro of an arabica branch. The hero cherry sits on G2 (centre (540, 900), rx 260, ry 290) under a
// branch at y 600, with an unevenly ripening cluster (yellow, red, green, deep red) and an opposite pair
// of glossy wavy leaves rising from the node at x 540. Frame 0 is the film's thumbnail and the loop target.
//
// Layers, back to front:
//   1 stripes (stripeCream / stripeSpring), drifting 6 px per beat
//   2 (camera, push 1.00 to 1.06 about (540, 900)) construction lines in inkFaint
//   3 lower leaf pair (tips (60, 1500) and (1020, 1520)), half hidden
//   4 upper opposite leaf pair from the node at x 540 (tips near (90, 250) and (990, 230))
//   5 branch (40 px, bark, lengthwise hatch, lenticels, node with stipules)
//   6 back cherries: green (120, 1000), deep red (980, 1040); then yellow (230, 760), red (850, 760)
//   7 cast shadows of the front cherries on the ones behind
//   8 hero cherry on G2: cherryRed, cross-hatched cherryDeep shadow, gloss crescent, calyx scar, dew drop
//   9 overlays: annYellow attention ring r 330 (beat 2), annBlue ruler x 830 from y 610 to 1190 (T 1.125)
//
// Motion: cluster sways +-4 px on twos to T 0.75 (zero at T 0 so frame 0 is exactly on G2), the hero bobs
// 10 px on beat 2 (T 0.75) on twos, the ring draws on over 6 frames, the ruler at T 1.125 over 6 frames.
// The push keeps world (540, 900) on screen (540, 900), so the last frame shows G2 scaled 1.06 about its
// centre: 02 opens its guide oval at 1.06 to match.
(function () {
  'use strict';

  const ID = 'hero-cherries';
  const LIB = FILM.lib;
  const TAU = Math.PI * 2;
  const DEG = Math.PI / 180;
  const FR = 1 / 24;

  const clamp = (v, lo = 0, hi = 1) => (v < lo ? lo : v > hi ? hi : v);
  const lerp = (a, b, u) => a + (b - a) * u;
  const sstep = (a, b, x) => {
    const u = clamp((x - a) / (b - a));
    return u * u * (3 - 2 * u);
  };
  const sd = (...k) => LIB.hash(ID, ...k) & 0x7fffffff;

  // beats (shot-local seconds)
  const B_BOB = 0.75; // T 0.75, beat 2: hero bob + attention ring
  const B_RULER = 1.125; // T 1.125, 8th: ruler

  // ---------------------------------------------------------------------------
  // G2: the hero cherry (docs/storyboard.md, Shared geometry G2)
  // ---------------------------------------------------------------------------
  const G2 = { x: 540, y: 900, rx: 260, ry: 290, scarX: 540, scarY: 1172, scarR: 34 };

  // branch centreline: a gentle sag through (0, 590), (540, 605), (1080, 595)
  const BR_A = 27.5 / 540;
  const BR_B = -25 / 583200;
  const branchY = (x) => 590 + BR_A * x + BR_B * x * x;
  const branchHalf = (x) => lerp(22, 18, clamp((x + 40) / 1160));

  // ---------------------------------------------------------------------------
  // small geometry helpers
  // ---------------------------------------------------------------------------

  function trace(ctx, pts, closed = true) {
    for (let i = 0; i < pts.length; i++) {
      if (i === 0) ctx.moveTo(pts[i][0], pts[i][1]);
      else ctx.lineTo(pts[i][0], pts[i][1]);
    }
    if (closed) ctx.closePath();
  }

  function pathOf(pts, closed = true) {
    const p = new Path2D();
    trace(p, pts, closed);
    return p;
  }

  function fillPoly(ctx, pts, color, alpha = 1) {
    ctx.save();
    ctx.globalAlpha *= alpha;
    ctx.fillStyle = color;
    ctx.beginPath();
    trace(ctx, pts, true);
    ctx.fill();
    ctx.restore();
  }

  function strokePath(ctx, path, color, alpha, width, dash) {
    ctx.save();
    ctx.strokeStyle = color;
    ctx.globalAlpha *= alpha;
    ctx.lineWidth = width;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    if (dash) ctx.setLineDash(dash);
    ctx.stroke(path);
    ctx.restore();
  }

  const offsetPts = (pts, dx, dy) => pts.map((p) => [p[0] + dx, p[1] + dy]);

  // oval rotated by rot about its centre, n points, starting at the top and running clockwise
  function ovalPts(cx, cy, rx, ry, rot, n) {
    const out = [];
    const c = Math.cos(rot), s = Math.sin(rot);
    for (let i = 0; i < n; i++) {
      const a = -Math.PI / 2 + (i / n) * TAU;
      const x = Math.cos(a) * rx, y = Math.sin(a) * ry;
      out.push([cx + x * c - y * s, cy + x * s + y * c]);
    }
    return out;
  }

  // ---------------------------------------------------------------------------
  // leaves: elliptic blade, drawn-out tip, wavy margin, 9 looping lateral vein pairs
  // ---------------------------------------------------------------------------

  function leafGeom(bx, by, tx, ty, width, key, o = {}) {
    const len = Math.hypot(tx - bx, ty - by);
    const ux = (tx - bx) / len, uy = (ty - by) / len;
    const nx = -uy, ny = ux; // side +1
    const pet = o.pet != null ? o.pet : 36;
    const blade = len - pet;
    const bend = o.bend != null ? o.bend : 18;
    const waves = o.waves || 5;
    const r = LIB.rng(sd('leaf', key));
    const ph1 = r.range(0, TAU), ph2 = r.range(0, TAU);
    // blade half-width profile: broad elliptic body, a drawn-out acuminate tip
    const shape = (u) => {
      u = clamp(u);
      const body = Math.pow(Math.sin(Math.PI * Math.pow(u, 0.86)), 0.66);
      return body * (1 - 0.5 * sstep(0.7, 1, u));
    };
    const bendAt = (u) => bend * 4 * u * (1 - u);
    const at = (u, v) => {
      const a = pet + u * blade;
      const w = v + bendAt(u);
      return [bx + ux * a + nx * w, by + uy * a + ny * w];
    };
    const hwAt = (u) => (width / 2) * shape(u);
    const wave = (u, side) => {
      const env = sstep(0.04, 0.18, u) * (1 - sstep(0.82, 0.97, u));
      return 4.2 * env * Math.sin(u * waves * TAU + (side > 0 ? ph1 : ph2));
    };
    const N = 72;
    const up = [], lo = [], mid = [];
    for (let i = 0; i <= N; i++) {
      const u = i / N;
      up.push(at(u, hwAt(u) + wave(u, 1)));
      lo.push(at(u, -(hwAt(u) * 0.95 + wave(u, -1))));
      mid.push(at(u, 0));
    }
    const outline = up.concat(lo.slice(1, N).reverse());
    const half = { 1: up.concat(mid.slice(1, N).reverse()), [-1]: lo.concat(mid.slice(1, N).reverse()) };
    // the half whose outward normal faces the lower right is the shadow half (light from the upper left)
    const shadowSide = nx + ny > 0 ? 1 : -1;
    // nine lateral pairs leaving the midrib, curving toward the tip, looping before the margin
    const veins = [];
    for (let k = 0; k < 9; k++) {
      const u0 = 0.07 + k * 0.088 + r.range(-0.008, 0.008);
      for (const side of [1, -1]) {
        const sk = side > 0 ? 1 : 0.95;
        const h = (u) => hwAt(u) * sk;
        const p0 = at(u0, 0);
        const p1 = at(u0 + 0.05, side * h(u0 + 0.05) * 0.45);
        const p2 = at(u0 + 0.12, side * h(u0 + 0.12) * 0.78);
        const p3 = at(u0 + 0.19, side * h(u0 + 0.19) * 0.86);
        const p4 = at(u0 + 0.26, side * h(u0 + 0.26) * 0.84);
        const pts = LIB.smoothPts(u0 + 0.26 < 0.99 ? [p0, p1, p2, p3, p4] : [p0, p1, p2], false, 4);
        veins.push({ side, pts, u0 });
      }
    }
    const veinAngle = (side) => {
      const v = veins.find((q) => q.side === side && q.u0 > 0.3);
      const a = v.pts[0], b = v.pts[Math.min(v.pts.length - 1, 6)];
      return Math.atan2(b[1] - a[1], b[0] - a[0]);
    };
    // gloss streak along the lit side of the midrib
    const litSide = -shadowSide;
    const sheenA = [], sheenB = [];
    for (let i = 0; i <= 40; i++) {
      const u = 0.06 + (i / 40) * 0.76;
      const env = Math.sin(Math.PI * ((u - 0.06) / 0.76));
      sheenA.push(at(u, litSide * hwAt(u) * 0.1));
      sheenB.push(at(u, litSide * hwAt(u) * (0.1 + 0.26 * Math.pow(env, 0.7))));
    }
    const sheen = sheenA.concat(sheenB.reverse());
    return {
      outline, half, mid, veins, base: [bx, by], tip: [tx, ty], stalk: [[bx, by], at(0, 0)],
      ux, uy, nx, ny, width, blade, pet, bend, hwAt, shadowSide, litSide, sheen,
      angle: { 1: veinAngle(1), [-1]: veinAngle(-1) },
      // signed across-blade coordinate in half-widths (-1..1) and along-blade u
      uv(x, y) {
        const dx = x - bx, dy = y - by;
        const u = (dx * ux + dy * uy - pet) / blade;
        const cu = clamp(u);
        const v = (dx * nx + dy * ny - bendAt(cu)) / Math.max(6, hwAt(clamp(cu, 0.02, 0.98)));
        return [u, v];
      },
      path: null,
    };
  }

  // the upper pair grows from the node at x 540, the lower pair hangs half hidden at the edges
  const LEAVES = [
    { g: leafGeom(150, 1060, 60, 1500, 200, 'll', { bend: -22, pet: 30 }), key: 'll', w: 3 },
    { g: leafGeom(935, 1085, 1020, 1520, 205, 'lr', { bend: 20, pet: 30 }), key: 'lr', w: 3 },
    { g: leafGeom(528, 592, 90, 250, 240, 'ul', { bend: 26, pet: 38 }), key: 'ul', w: 3 },
    { g: leafGeom(552, 590, 990, 230, 240, 'ur', { bend: -24, pet: 38 }), key: 'ur', w: 3 },
  ];
  for (const Lf of LEAVES) Lf.g.path = pathOf(Lf.g.outline);

  function drawLeaf(ctx, P, Lf, COL, castShadows) {
    const L = CUR;
    const g = Lf.g, key = Lf.key;
    const sh = g.shadowSide, lit = g.litSide;
    // petiole
    L.inkPath(ctx, g.stalk, { width: 13, color: P.ink, seed: sd('pet0', key), taper: [0, 3], swell: 0, wobble: 0.4 });
    L.inkPath(ctx, g.stalk, { width: 8, color: P.leafLight, seed: sd('pet', key), taper: [0, 3], swell: 0, wobble: 0.4 });
    // flat glossy upper face
    fillPoly(ctx, g.outline, P.leafCoffee);
    // gloss streak (flat leafSheen) and a brighter core
    fillPoly(ctx, g.sheen, P.leafSheen, 0.5);
    // shadow half: hatch parallel to the laterals, deepening toward the margin
    L.hatch(ctx, g.half[sh], {
      angle: g.angle[sh], spacing: 6, width: 1.6, color: P.leafDeep, alpha: 0.85, length: [12, 34], seed: sd('lh', key),
      density: (x, y) => {
        const q = g.uv(x, y);
        return 0.45 + 0.55 * sstep(0.15, 0.8, Math.abs(q[1]));
      },
    });
    // darker cross layer at the shadow margin and the base
    L.hatch(ctx, g.half[sh], {
      angle: g.angle[sh] + 1.05, spacing: 7, width: 1.3, color: COL.leafInk, alpha: 0.55, length: [10, 24], seed: sd('lh2', key),
      density: (x, y) => {
        const q = g.uv(x, y);
        return 0.9 * sstep(0.55, 0.95, Math.abs(q[1])) + 0.7 * (1 - sstep(0.02, 0.16, q[0]));
      },
    });
    // lit half: light shade only out at the margin, flat elsewhere
    L.hatch(ctx, g.half[lit], {
      angle: g.angle[lit], spacing: 11, width: 1.4, color: P.leafDeep, alpha: 0.7, length: [10, 26], seed: sd('lit', key),
      density: (x, y) => {
        const q = g.uv(x, y);
        return 0.85 * sstep(0.7, 0.98, Math.abs(q[1])) + 0.6 * sstep(0.86, 1, q[0]);
      },
    });
    if (castShadows) castShadows(g);
    // sunken laterals in leafDeep, a pale lit lip along each on the lit half
    for (let k = 0; k < g.veins.length; k++) {
      const v = g.veins[k];
      L.inkPath(ctx, v.pts, { width: 1.8, color: P.leafDeep, alpha: 0.95, seed: sd('lv', key, k), taper: [2, 16], wobble: 0.5, step: 3 });
      if (v.side === lit && k % 2 === 0) {
        L.inkPath(ctx, offsetPts(v.pts.slice(0, Math.ceil(v.pts.length * 0.6)), -1.6, -1.6), {
          width: 1.1, color: P.leafSheen, alpha: 0.6, seed: sd('lvl', key, k), taper: [3, 10], wobble: 0.4, step: 3,
        });
      }
    }
    // midrib 2.5 px leafDeep, with a pale raised core
    L.inkPath(ctx, g.mid, { width: 4, color: P.leafLight, alpha: 0.8, seed: sd('midc', key), taper: [2, 70], wobble: 0.6 });
    L.inkPath(ctx, g.mid, { width: 2.5, color: P.leafDeep, seed: sd('mid', key), taper: [4, 90], wobble: 0.7 });
    // outline, 3 px ink with the wavy margin
    L.inkPath(ctx, g.outline, { closed: true, width: Lf.w, color: P.ink, seed: sd('lo', key), wobble: 1.2 });
  }

  // ---------------------------------------------------------------------------
  // cherries
  // ---------------------------------------------------------------------------

  // the node the cluster grows from
  const NODE = [540, 602];

  function cherryDef(x, y, r, kind, key) {
    const dx = x - NODE[0], dy = y - NODE[1];
    // the tip points away from the node, half way between hanging straight down and the radial direction
    const rot = 0.5 * (Math.atan2(dy, dx) - Math.PI / 2);
    return { x, y, rx: r, ry: r * 1.1, rot, kind, key };
  }

  const HERO_BASE = { x: 540, y: 900, rx: 260, ry: 290, rot: 0, kind: 'red', key: 'hero' };
  const BACK = [cherryDef(120, 1000, 110, 'green', 'cg'), cherryDef(980, 1040, 120, 'deep', 'cd')];
  const MIDC = [cherryDef(230, 760, 130, 'yellow', 'cy'), cherryDef(850, 760, 140, 'red', 'cr')];

  function cherryColours(P, kind) {
    switch (kind) {
      case 'green':
        return { base: P.cherryGreen, deep: LIB.mix(P.cherryGreen, P.leafDeep, 0.72), light: LIB.mix(P.cherryGreen, P.white, 0.55), ink: LIB.mix(P.leafDeep, P.ink, 0.4) };
      case 'yellow':
        return { base: P.cherryYellow, deep: LIB.mix(P.cherryYellow, P.ochre, 0.85), light: LIB.mix(P.cherryYellow, P.white, 0.6), ink: LIB.mix(P.ochre, P.ink, 0.45) };
      case 'deep':
        return { base: P.cherryDeep, deep: LIB.mix(P.cherryDeep, P.ink, 0.55), light: LIB.mix(P.cherryDeep, P.cherryLight, 0.55), ink: P.ink };
      default:
        return { base: P.cherryRed, deep: P.cherryDeep, light: P.cherryLight, ink: LIB.mix(P.cherryDeep, P.ink, 0.5) };
    }
  }

  // local frame of an oval cherry: (lx, ly) in radii, 0 at the centre
  function localOf(c, x, y) {
    const dx = x - c.x, dy = y - c.y;
    const cs = Math.cos(-c.rot), sn = Math.sin(-c.rot);
    return [(dx * cs - dy * sn) / c.rx, (dx * sn + dy * cs) / c.ry];
  }

  // shadow tone on a sphere lit from the upper left, with a pale reflected rim on the lower right
  function sphereTone(lx, ly) {
    const rr = Math.hypot(lx, ly);
    const d = lx * 0.62 + ly * 0.78;
    return sstep(-0.25, 0.75, d) * (1 - 0.45 * sstep(0.9, 1.0, rr));
  }

  function toLocalPt(c, lx, ly) {
    const cs = Math.cos(c.rot), sn = Math.sin(c.rot);
    const x = lx * c.rx, y = ly * c.ry;
    return [c.x + x * cs - y * sn, c.y + x * sn + y * cs];
  }

  function drawCherry(ctx, P, c, o) {
    const L = CUR;
    const col = cherryColours(P, c.kind);
    const hero = !!o.hero;
    const key = c.key;
    const pts = ovalPts(c.x, c.y, c.rx, c.ry, c.rot, hero ? 120 : 84);
    fillPoly(ctx, pts, col.base);
    // shadow side, lower right: 8 px then 5 px, a 105-degree cross layer in the deepest part
    const tone = (x, y) => {
      const q = localOf(c, x, y);
      return sphereTone(q[0], q[1]);
    };
    L.hatch(ctx, pts, { angle: -Math.PI / 4, spacing: 8, width: hero ? 2 : 1.7, color: col.deep, alpha: 0.95, length: hero ? [18, 60] : [12, 36], seed: sd('ch1', key), density: (x, y) => clamp(tone(x, y) * 2.4) });
    L.hatch(ctx, pts, { angle: -Math.PI / 4 + 0.06, spacing: 5, width: hero ? 1.8 : 1.5, color: col.deep, alpha: 0.95, length: hero ? [14, 44] : [10, 28], seed: sd('ch2', key), density: (x, y) => sstep(0.2, 0.6, tone(x, y)) });
    L.hatch(ctx, pts, { angle: -Math.PI / 4 - Math.PI / 3, spacing: 7, width: 1.5, color: col.deep, alpha: 0.9, length: hero ? [10, 30] : [8, 20], seed: sd('ch3', key), density: (x, y) => sstep(0.4, 0.75, tone(x, y)) });
    L.hatch(ctx, pts, { angle: -Math.PI / 4 + 0.3, spacing: 6, width: 1.3, color: col.ink, alpha: 0.55, length: hero ? [10, 26] : [6, 16], seed: sd('ch4', key), density: (x, y) => sstep(0.5, 0.85, tone(x, y)) });
    // contour strokes that follow the round form on the shadow half (curved, perpendicular to the axis)
    {
      const cp = new Path2D();
      const rows = hero ? 15 : 8;
      for (let k = 0; k < rows; k++) {
        const ly = -0.25 + (k / (rows - 1)) * 1.05;
        const w = Math.sqrt(Math.max(0, 1 - ly * ly));
        const a0 = 0.25 + 0.15 * L.h3(k, 3, sd('ct', key) & 0xffff);
        const s0 = toLocalPt(c, w * a0, ly);
        const s1 = toLocalPt(c, w * 0.66, ly + 0.06 * w);
        const s2 = toLocalPt(c, w * 0.9, ly + 0.02);
        cp.moveTo(s0[0], s0[1]);
        cp.quadraticCurveTo(s1[0], s1[1], s2[0], s2[1]);
      }
      ctx.save();
      ctx.clip(pathOf(pts));
      strokePath(ctx, cp, col.deep, 0.5, 1.3);
      ctx.restore();
    }
    // skin texture: sparse fine pores on the lit side
    L.stipple(ctx, pts, { spacing: hero ? 13 : 12, r: [1.0, 1.4], color: col.deep, alpha: 0.45, seed: sd('pore', key), density: (x, y) => 0.5 * (1 - tone(x, y)) });
    // gloss crescent between 200 and 250 degrees, inset (40 px on the hero)
    {
      const inset = hero ? 40 : 0.16 * c.rx;
      const A = [], B = [];
      const n = 24;
      const ca = Math.cos(c.rot), sa = Math.sin(c.rot);
      const local = (ang, d) => {
        const x = Math.cos(ang) * (c.rx - d), y = Math.sin(ang) * (c.ry - d);
        return [c.x + x * ca - y * sa, c.y + x * sa + y * ca];
      };
      const thick = hero ? 34 : 0.13 * c.rx;
      for (let i = 0; i <= n; i++) {
        const u = i / n;
        const ang = (200 + 50 * u) * DEG;
        const w = Math.sin(Math.PI * u);
        A.push(local(ang, inset));
        B.push(local(ang, inset + thick * Math.pow(w, 0.8)));
      }
      const cres = A.concat(B.reverse());
      fillPoly(ctx, cres, col.light);
      // a white core streak and a pinpoint highlight
      const core = [];
      for (let i = 0; i <= 16; i++) {
        const u = 0.15 + (i / 16) * 0.6;
        core.push(local((200 + 50 * u) * DEG, inset + thick * 0.3));
      }
      L.inkPath(ctx, core, { width: hero ? 7 : 4, color: P.white, alpha: 0.9, seed: sd('core', key), taper: [10, 16], wobble: 0.5 });
      const dot = local(255 * DEG, inset + thick * 1.5);
      ctx.beginPath();
      ctx.arc(dot[0], dot[1], hero ? 7 : 4, 0, TAU);
      ctx.fillStyle = P.white;
      ctx.globalAlpha = 0.9;
      ctx.fill();
      ctx.globalAlpha = 1;
      L.inkPath(ctx, cres, { closed: true, width: 1.2, color: col.deep, alpha: 0.35, seed: sd('cresl', key), wobble: 0.5 });
    }
    // calyx scar at the tip: a dark disc with a five-point star scar and a raised rim
    {
      let sx, sy, sr;
      if (hero) {
        sx = G2.scarX - G2.x + c.x;
        sy = G2.scarY - G2.y + c.y;
        sr = G2.scarR;
      } else {
        const p = toLocalPt(c, 0, 0.9);
        sx = p[0];
        sy = p[1];
        sr = c.rx * 0.13;
      }
      const ry = sr * 0.72;
      const rimPts = ovalPts(sx, sy, sr + 6, ry + 5, hero ? 0 : c.rot, 36);
      fillPoly(ctx, rimPts, col.deep, 0.9);
      const disc = ovalPts(sx, sy, sr, ry, hero ? 0 : c.rot, 36);
      L.inkPath(ctx, disc, { closed: true, width: hero ? 2.4 : 1.8, color: P.ink, fill: LIB.mix(P.ink, col.deep, 0.25), seed: sd('scar', key), wobble: 0.4 });
      const star = new Path2D();
      for (let k = 0; k < 5; k++) {
        const a = -Math.PI / 2 + (k / 5) * TAU + (hero ? 0.2 : c.rot);
        star.moveTo(sx, sy);
        star.lineTo(sx + Math.cos(a) * sr * 0.72, sy + Math.sin(a) * ry * 0.72);
      }
      strokePath(ctx, star, col.deep, 1, hero ? 3 : 2);
      ctx.beginPath();
      ctx.arc(sx, sy, hero ? 5 : 3, 0, TAU);
      ctx.fillStyle = col.light;
      ctx.globalAlpha = 0.8;
      ctx.fill();
      ctx.globalAlpha = 1;
    }
    // deep red: a few soft wrinkles of a cherry a day past ripe
    if (c.kind === 'deep') {
      for (let k = 0; k < 3; k++) {
        const a = toLocalPt(c, -0.3 + k * 0.25, -0.1 + k * 0.18), b = toLocalPt(c, 0.05 + k * 0.25, 0.1 + k * 0.2), m = toLocalPt(c, -0.1 + k * 0.25, 0.08 + k * 0.18);
        L.inkPath(ctx, [a, m, b], { width: 1.6, color: col.ink, alpha: 0.6, seed: sd('wr', k), taper: [6, 6], wobble: 0.5 });
      }
    }
    // outline
    L.inkPath(ctx, pts, { closed: true, width: hero ? 5 : 3.4, color: P.ink, seed: sd('co', key), wobble: hero ? 1.4 : 1, double: hero ? { alpha: 0.4, width: 0.3 } : false });
  }

  // ---------------------------------------------------------------------------
  // branch
  // ---------------------------------------------------------------------------

  const BRANCH = (() => {
    const top = [], bot = [], mid = [];
    for (let x = -60; x <= 1140; x += 12) {
      const y = branchY(x), h = branchHalf(x);
      // the node swells a little where the leaf pair leaves it
      const sw = 4 * Math.exp(-((x - 540) * (x - 540)) / (2 * 28 * 28));
      top.push([x, y - h - sw]);
      bot.push([x, y + h + sw]);
      mid.push([x, y]);
    }
    const outline = top.concat(bot.slice().reverse());
    const r = LIB.rng(sd('lent'));
    const lent = [];
    for (let i = 0; i < 34; i++) {
      const x = r.range(-20, 1100);
      if (Math.abs(x - 540) < 40) continue;
      const v = r.range(-0.75, 0.6);
      lent.push({ x, y: branchY(x) + v * branchHalf(x), w: r.range(3, 7), h: r.range(1.3, 2.2) });
    }
    // fine lengthwise bark streaks
    const streaks = [];
    for (let i = 0; i < 46; i++) {
      const x0 = r.range(-60, 1100), l = r.range(40, 140), v = r.range(-0.7, 0.85);
      const pts = [];
      for (let k = 0; k <= 6; k++) {
        const x = x0 + (k / 6) * l;
        pts.push([x, branchY(x) + v * branchHalf(x) + r.range(-0.6, 0.6)]);
      }
      streaks.push(pts);
    }
    return { top, bot, mid, outline, lent, streaks };
  })();

  function drawBranch(ctx, P) {
    const L = CUR;
    const B = BRANCH;
    fillPoly(ctx, B.outline, P.bark);
    // lengthwise hatching on the lower (shadow) half
    L.hatch(ctx, B.outline, {
      angle: -0.02, spacing: 4.5, width: 1.4, color: P.barkDeep, alpha: 0.9, length: [20, 70], gap: [3, 10], seed: sd('brh'),
      density: (x, y) => sstep(-0.15, 0.7, (y - branchY(x)) / branchHalf(x)),
    });
    L.hatch(ctx, B.outline, {
      angle: 0.02, spacing: 6, width: 1.2, color: P.ink, alpha: 0.55, length: [16, 50], gap: [4, 12], seed: sd('brh2'),
      density: (x, y) => sstep(0.45, 0.95, (y - branchY(x)) / branchHalf(x)),
    });
    for (let i = 0; i < B.streaks.length; i++) {
      L.inkPath(ctx, B.streaks[i], { width: 1.2, color: P.barkDeep, alpha: 0.75, seed: sd('bs', i), taper: [8, 12], wobble: 0.3 });
    }
    // lenticels: pale horizontal flecks with a soft rim
    const lp = new Path2D();
    for (const q of B.lent) {
      lp.moveTo(q.x + q.w, q.y);
      lp.ellipse(q.x, q.y, q.w, q.h, 0, 0, TAU);
    }
    ctx.fillStyle = P.tan;
    ctx.globalAlpha = 0.9;
    ctx.fill(lp);
    ctx.globalAlpha = 1;
    strokePath(ctx, lp, P.barkDeep, 0.7, 0.9);
    // a lit lip along the top edge
    L.inkPath(ctx, offsetPts(B.top, 0, 4), { width: 2, color: P.tan, alpha: 0.7, seed: sd('blip'), taper: [0, 0], wobble: 0.8, step: 4 });
    // node ring and the small triangular interpetiolar stipules above and below
    const ny = branchY(540);
    L.inkPath(ctx, [[524, ny - 25], [520, ny], [525, ny + 25]], { width: 2, color: P.barkDeep, seed: sd('nr1'), taper: [3, 3], wobble: 0.3 });
    L.inkPath(ctx, [[557, ny - 25], [561, ny], [556, ny + 25]], { width: 2, color: P.barkDeep, seed: sd('nr2'), taper: [3, 3], wobble: 0.3 });
    for (const s of [-1, 1]) {
      const st = [[528, ny + s * 22], [540, ny + s * 44], [552, ny + s * 22]];
      L.inkPath(ctx, st, { closed: true, width: 1.8, color: P.ink, fill: P.leafLight, seed: sd('stip', s), wobble: 0.3, taper: [2, 4] });
    }
    // outline: two edges, 3 px
    L.inkPath(ctx, B.top, { width: 3, color: P.ink, seed: sd('bt'), taper: [0, 0], wobble: 1.2, step: 4 });
    L.inkPath(ctx, B.bot, { width: 3.4, color: P.ink, seed: sd('bb'), taper: [0, 0], wobble: 1.2, step: 4 });
  }

  // short pedicel stubs from the branch into each cherry's shoulder
  function drawStalk(ctx, P, c, dx, dy, k) {
    const top = toLocalPt(c, 0, -0.92);
    const bx = lerp(top[0], NODE[0], 0.18), by = branchY(bx) + 12;
    const pts = [[bx, by], [lerp(bx, top[0] + dx, 0.5) + 3, lerp(by, top[1] + dy, 0.5)], [top[0] + dx, top[1] + dy]];
    LIB.inkPath(ctx, pts, { width: 11, color: P.ink, seed: sd('st0', k), taper: [2, 2], swell: 0, wobble: 0.3 });
    LIB.inkPath(ctx, pts, { width: 6.5, color: P.leafLight, seed: sd('st1', k), taper: [2, 2], swell: 0, wobble: 0.3 });
  }

  // ---------------------------------------------------------------------------
  // a lower lateral twig below the cluster (scenery, under the Shorts caption band): a leaf pair and a
  // young green cluster at its node, so the tall frame stays dense to the bottom edge
  // ---------------------------------------------------------------------------

  const twigY = (x) => 1790 - 0.16 * x + 0.00004 * (x - 540) * (x - 540);
  const TWIG = (() => {
    const top = [], bot = [];
    for (let x = -60; x <= 1140; x += 14) {
      const y = twigY(x), h = lerp(15, 11, clamp((x + 60) / 1200));
      top.push([x, y - h]);
      bot.push([x, y + h]);
    }
    return { top, bot, outline: top.concat(bot.slice().reverse()) };
  })();
  const TNODE = [620, twigY(620)];
  const TLEAVES = [
    { g: leafGeom(608, TNODE[1] - 6, 250, 1560, 190, 'tl', { bend: 18, pet: 28 }), key: 'tl', w: 2.6 },
    { g: leafGeom(632, TNODE[1] + 6, 990, 1890, 190, 'tr', { bend: -16, pet: 28 }), key: 'tr', w: 2.6 },
  ];
  for (const Lf of TLEAVES) Lf.g.path = pathOf(Lf.g.outline);
  const TCHER = [
    { x: 588, y: 1752, rx: 46, ry: 51, rot: 0.35, kind: 'green', key: 't1' },
    { x: 668, y: 1745, rx: 50, ry: 55, rot: -0.3, kind: 'green', key: 't2' },
    { x: 626, y: 1790, rx: 52, ry: 57, rot: 0.05, kind: 'yellow', key: 't3' },
  ];

  function drawTwig(ctx, P, COL) {
    const L = CUR;
    fillPoly(ctx, TWIG.outline, P.bark);
    L.hatch(ctx, TWIG.outline, {
      angle: -0.16, spacing: 4.5, width: 1.3, color: P.barkDeep, alpha: 0.9, length: [16, 50], gap: [3, 10], seed: sd('twh'),
      density: (x, y) => sstep(-0.3, 0.8, (y - twigY(x)) / 13),
    });
    L.inkPath(ctx, TWIG.top, { width: 2.6, color: P.ink, seed: sd('twt'), taper: [0, 0], wobble: 1, step: 4 });
    L.inkPath(ctx, TWIG.bot, { width: 3, color: P.ink, seed: sd('twb'), taper: [0, 0], wobble: 1, step: 4 });
    for (const Lf of TLEAVES) drawLeaf(ctx, P, Lf, COL, null);
    for (const c of TCHER) drawCherry(ctx, P, c, {});
  }

  // ---------------------------------------------------------------------------
  // the static plate: construction, twig, both leaf pairs and the branch. None of it moves, so it is
  // drawn once per boil phase (a three-drawing boil cycle, still re-wobbling every 1/12 s) into a canvas
  // at 1.06x so the push-in never upsamples it.
  // ---------------------------------------------------------------------------

  let CUR = LIB; // the lib the drawing helpers use: LIB, or a wrapper that pins the boil drawing
  function boilLib(b) {
    const o = {};
    for (const k of Object.keys(LIB)) o[k] = LIB[k];
    const pin = (fn) => (ctx, a, opts) => fn(ctx, a, Object.assign({}, opts, { boil: b }));
    o.inkPath = pin(LIB.inkPath);
    o.hatch = pin(LIB.hatch);
    o.crossHatch = pin(LIB.crossHatch);
    o.stipple = pin(LIB.stipple);
    return o;
  }

  function drawPlate(ctx, L, P, COL) {
    // ---- 2 construction lines --------------------------------------------------
    {
      const cons = { width: 1.5, color: P.inkFaint, alpha: 0.3, taper: [0, 0], wobble: 1.5, smooth: false, step: 8 };
      L.inkPath(ctx, [[540, -60], [540, 1980]], Object.assign({ seed: sd('axis') }, cons));
      L.inkPath(ctx, [[-40, 900], [1120, 900]], Object.assign({ seed: sd('hz') }, cons));
      L.guideCircle(ctx, 540, 900, 420, { color: P.inkFaint, alpha: 0.28, width: 1.5 });
      L.guideCircle(ctx, 540, 900, 560, { color: P.inkFaint, alpha: 0.18, width: 1.5, dash: [3, 8] });
      const deg = new Path2D();
      for (let a = 0; a < 360; a += 10) {
        const c = Math.cos(a * DEG), s = Math.sin(a * DEG);
        const l = a % 30 === 0 ? 16 : 8;
        deg.moveTo(540 + c * 420, 900 + s * 420);
        deg.lineTo(540 + c * (420 + l), 900 + s * (420 + l));
      }
      strokePath(ctx, deg, P.inkFaint, 0.45, 1.5);
      const marks = new Path2D();
      for (const [x, y] of [[230, 760], [850, 760], [120, 1000], [980, 1040], [540, 602], [540, 610], [540, 1190], [280, 900], [800, 900]]) {
        marks.moveTo(x - 9, y);
        marks.lineTo(x + 9, y);
        marks.moveTo(x, y - 9);
        marks.lineTo(x, y + 9);
      }
      strokePath(ctx, marks, P.inkFaint, 0.55, 1.5);
      // rays from the node through each cluster cherry
      const rays = new Path2D();
      for (const c of BACK.concat(MIDC)) {
        const a = Math.atan2(c.y - NODE[1], c.x - NODE[0]);
        rays.moveTo(NODE[0] + Math.cos(a) * 60, NODE[1] + Math.sin(a) * 60);
        rays.lineTo(NODE[0] + Math.cos(a) * 760, NODE[1] + Math.sin(a) * 760);
      }
      strokePath(ctx, rays, P.inkFaint, 0.22, 1.5, [10, 8]);
    }

    // ---- 2b the lower twig ---------------------------------------------------------
    drawTwig(ctx, P, COL);

    // ---- 3 lower leaf pair (behind the edge cherries) ---------------------------
    const backPos = BACK;

    const castOn = (g, list) => {
      // cherry shadows fall down and right onto the blade (light from the upper left)
      ctx.save();
      ctx.clip(g.path);
      for (const c of list) {
        const s = ovalPts(c.x + c.rx * 0.18, c.y + c.ry * 0.16, c.rx, c.ry, c.rot, 48);
        L.hatch(ctx, s, { angle: -Math.PI / 4 - Math.PI / 3, spacing: 5, width: 1.3, color: P.ink, alpha: 0.5, length: [10, 26], seed: sd('lcs', c.key, g.width) });
      }
      ctx.restore();
    };
    drawLeaf(ctx, P, LEAVES[0], COL, (g) => castOn(g, [backPos[0]]));
    drawLeaf(ctx, P, LEAVES[1], COL, (g) => castOn(g, [backPos[1]]));

    // ---- 4 upper opposite leaf pair ---------------------------------------------
    drawLeaf(ctx, P, LEAVES[2], COL, (g) => {
      // the branch casts a strip of shade across the leaf base
      ctx.save();
      ctx.clip(g.path);
      L.hatch(ctx, offsetPts(BRANCH.outline, 14, 18), { bounds: { x: 0, y: 560, w: 1080, h: 100 }, angle: -Math.PI / 4, spacing: 4.5, width: 1.3, color: P.ink, alpha: 0.5, length: [8, 20], seed: sd('brs', 'l') });
      ctx.restore();
    });
    drawLeaf(ctx, P, LEAVES[3], COL, (g) => {
      ctx.save();
      ctx.clip(g.path);
      L.hatch(ctx, offsetPts(BRANCH.outline, 14, 18), { bounds: { x: 0, y: 560, w: 1080, h: 100 }, angle: -Math.PI / 4, spacing: 4.5, width: 1.3, color: P.ink, alpha: 0.5, length: [8, 20], seed: sd('brs', 'r') });
      ctx.restore();
    });

    // ---- 5 branch ------------------------------------------------------------------
    drawBranch(ctx, P);
  }

  function plate(P, COL, b) {
    const S = FILM.S || 1;
    const k = 1.06 * S;
    return LIB.cached(['hero-cherries-plate', b, S].join('|'), () => {
      const w = Math.ceil(1080 * k), h = Math.ceil(1920 * k);
      let c;
      if (FILM.makeCanvas) c = FILM.makeCanvas(w, h);
      else {
        c = document.createElement('canvas');
        c.width = w;
        c.height = h;
      }
      const g = c.getContext('2d');
      g.scale(w / 1080, h / 1920);
      const prev = CUR;
      CUR = boilLib(b);
      try {
        drawPlate(g, CUR, P, COL);
      } finally {
        CUR = prev;
      }
      return c;
    });
  }

  // a cherry drawn once per boil phase into a sprite (1.06x), then placed at its swayed / bobbed offset
  function cherrySprite(P, c, hero, b) {
    const S = FILM.S || 1;
    const k = 1.06 * S;
    const m = 24;
    const ext = Math.max(c.rx, c.ry) + m + (hero ? 16 : 6);
    const x0 = c.x - ext, y0 = c.y - ext, side = ext * 2;
    const img = LIB.cached(['hero-cherries-cherry', c.key, b, S].join('|'), () => {
      const w = Math.ceil(side * k);
      let cv;
      if (FILM.makeCanvas) cv = FILM.makeCanvas(w, w);
      else {
        cv = document.createElement('canvas');
        cv.width = w;
        cv.height = w;
      }
      const g = cv.getContext('2d');
      g.scale(w / side, w / side);
      g.translate(-x0, -y0);
      const prev = CUR;
      CUR = boilLib(b);
      try {
        drawCherry(g, P, c, { hero });
      } finally {
        CUR = prev;
      }
      return cv;
    });
    return { img, x0, y0, side };
  }

  function placeCherry(ctx, P, base, pos, hero, b) {
    const sp = cherrySprite(P, base, hero, b);
    ctx.drawImage(sp.img, sp.x0 + (pos.x - base.x), sp.y0 + (pos.y - base.y), sp.side, sp.side);
  }

  // ---------------------------------------------------------------------------
  // scene
  // ---------------------------------------------------------------------------

  FILM.scene({
    id: ID,
    draw(ctx, tIn, info) {
      const L = info.lib;
      const P = L.pal;
      const E = L.ease;
      const dur = info.dur;
      let t = clamp(tIn, 0, dur);
      const tFrame = Math.round(t * 24) / 24;
      if (Math.abs(t - tFrame) < 1e-4) t = tFrame + 1e-7;
      const tw = L.onTwos(t);
      const bi = L.boil(info.T);

      const drawing = (a) => Math.floor((t - a) * 12 + 1e-6);
      const hit = (a, frames, e, lead = 1) => {
        if (t < a) return 0;
        const u = clamp((t - a) / (frames * FR) + lead / frames);
        return e ? e(u) : u;
      };

      const COL = { leafInk: L.mix(P.leafDeep, P.ink, 0.5) };

      // ---- motion (objects on twos) -------------------------------------------
      // cluster sway: +-4 px, zero at T 0 and back to zero by beat 2, so frame 0 and the end sit on G2
      const swayU = clamp(tw / B_BOB);
      const sway = (ph) => (tw < B_BOB ? 4 * Math.sin(TAU * swayU + ph) * Math.sin(Math.PI * swayU) : 0);
      // hero bob on beat 2: three drawings, drop 10 px, overshoot back, settle
      const bobK = t >= B_BOB ? drawing(B_BOB) : -1;
      const heroBob = bobK === 0 ? 10 : bobK === 1 ? -2 : 0;
      const sideBob = bobK === 1 ? 4 : bobK === 2 ? -1 : 0;
      const hx = sway(0), hy = heroBob + 0.4 * sway(1.3);

      // ---- 1 stripes ------------------------------------------------------------
      L.stripes(ctx, { colors: [P.stripeCream, P.stripeSpring], width: 140, angle: -0.52, offset: 8 * info.T, seed: sd('stripes') });

      // camera: push-in 1.00 to 1.06 holding world (540, 900) on screen (540, 900)
      const zoom = 1 + 0.06 * E.inOutSine(t / dur);
      const cam = { x: 540, y: 900 + 60 / zoom, zoom };

      L.camera(ctx, cam, (ctx) => {
        // ---- 2 to 5 the static plate: construction, twig, leaves, branch ----------------
        const bp = ((bi % 3) + 3) % 3;
        ctx.drawImage(plate(P, COL, bp), 0, 0, 1080, 1920);

        const backPos = BACK.map((c, i) => Object.assign({}, c, { x: c.x + sway(2 + i), y: c.y + 0.5 * sway(3 + i) + (i ? sideBob : 0) }));
        const midPos = MIDC.map((c, i) => Object.assign({}, c, { x: c.x + sway(4 + i * 1.7), y: c.y + 0.5 * sway(5 + i) + sideBob }));
        const heroC = { x: G2.x + hx, y: G2.y + hy, rx: G2.rx, ry: G2.ry, rot: 0, kind: 'red', key: 'hero' };

        // ---- 6 back cherries, then the shoulder cherries -----------------------------
        for (let i = 0; i < BACK.length; i++) placeCherry(ctx, P, BACK[i], backPos[i], false, bp);
        // the shoulder cherries' shadows on the back ones
        {
          const backPath = new Path2D();
          for (const c of backPos) trace(backPath, ovalPts(c.x, c.y, c.rx, c.ry, c.rot, 48), true);
          ctx.save();
          ctx.clip(backPath);
          for (const c of midPos) {
            L.hatch(ctx, ovalPts(c.x + 26, c.y + 34, c.rx, c.ry, c.rot, 48), { angle: -Math.PI / 4, spacing: 4, width: 1.3, color: P.ink, alpha: 0.55, length: [8, 22], seed: sd('mcs', c.key) });
          }
          ctx.restore();
        }
        drawStalk(ctx, P, midPos[0], 0, 0, 0);
        drawStalk(ctx, P, midPos[1], 0, 0, 1);
        for (let i = 0; i < MIDC.length; i++) placeCherry(ctx, P, MIDC[i], midPos[i], false, bp);

        // ---- 7 the hero's cast shadow on the cherries behind it ----------------------
        {
          const behind = new Path2D();
          for (const c of midPos.concat(backPos)) trace(behind, ovalPts(c.x, c.y, c.rx, c.ry, c.rot, 48), true);
          ctx.save();
          ctx.clip(behind);
          L.crossHatch(ctx, ovalPts(heroC.x + 34, heroC.y + 40, G2.rx, G2.ry, 0, 72), { bounds: { x: 300, y: 600, w: 780, h: 700 }, spacing: 4.5, width: 1.3, color: P.ink, alpha: 0.55, layers: 2, length: [8, 24], seed: sd('hcs') });
          ctx.restore();
        }

        // ---- 8 hero cherry on G2 ---------------------------------------------------------
        placeCherry(ctx, P, HERO_BASE, heroC, true, bp);

        // dew drop at (650, 760), r 18: it trembles on twos
        {
          const j1 = (L.h3(drawing(0), 5, 77) - 0.5) * 2, j2 = (L.h3(drawing(0), 9, 78) - 0.5) * 2;
          const dx = 650 + hx + j1 * 0.9, dy = 760 + hy + j2 * 0.9, dr = 18 + j1 * 0.5;
          L.hatch(ctx, ovalPts(dx + 9, dy + 10, dr + 1, dr * 0.85, 0, 24), { angle: -Math.PI / 4, spacing: 3, width: 1.3, color: P.cherryDeep, alpha: 0.85, seed: sd('dewsh') });
          L.inkPath(ctx, ovalPts(dx, dy, dr, dr * 1.04, 0, 28), { closed: true, width: 2.2, color: P.ink, fill: P.white, seed: sd('dew'), wobble: 0.3 });
          // the drop refracts the red skin on its lower right
          L.hatch(ctx, ovalPts(dx, dy, dr - 2, dr - 2, 0, 24), { angle: -Math.PI / 4 + 1.05, spacing: 2.6, width: 1.1, color: P.cherryLight, alpha: 0.95, length: [4, 12], overshoot: 0, inset: 1, seed: sd('dewin'), density: (x, y) => sstep(-2, 9, (x - dx) * 0.7 + (y - dy) * 0.7) });
          ctx.beginPath();
          ctx.arc(dx - 1, dy - 1, dr - 6, Math.PI * 1.08, Math.PI * 1.5);
          ctx.strokeStyle = P.white;
          ctx.lineWidth = 3.2;
          ctx.lineCap = 'round';
          ctx.stroke();
          ctx.beginPath();
          ctx.arc(dx - 6, dy - 7, 2.2, 0, TAU);
          ctx.fillStyle = P.ink;
          ctx.globalAlpha = 0.6;
          ctx.fill();
          ctx.globalAlpha = 1;
        }

        // ---- 9 overlays (24 fps) -----------------------------------------------------------
        // annYellow attention ring around the hero, r 330, drawing on from 12 o'clock clockwise
        const kRing = hit(B_BOB, 6, E.outExpo);
        if (kRing > 0) {
          const cx = 540 + hx, cy = 900 + hy;
          const a0 = -Math.PI / 2, a1 = a0 + TAU * kRing;
          ctx.save();
          ctx.lineCap = 'round';
          ctx.strokeStyle = P.ink;
          ctx.globalAlpha = 0.22;
          ctx.lineWidth = 6;
          ctx.beginPath();
          ctx.arc(cx, cy, 330, a0, a1);
          ctx.stroke();
          ctx.globalAlpha = 1;
          ctx.strokeStyle = P.annYellow;
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.arc(cx, cy, 330, a0, a1);
          ctx.stroke();
          // four diagonal ticks on the ring once it closes
          const tk = new Path2D();
          for (let q = 0; q < 4; q++) {
            const a = Math.PI / 4 + (q * Math.PI) / 2;
            if (((a - a0 + TAU) % TAU) / TAU > kRing) continue;
            tk.moveTo(cx + Math.cos(a) * 320, cy + Math.sin(a) * 320);
            tk.lineTo(cx + Math.cos(a) * 342, cy + Math.sin(a) * 342);
          }
          ctx.stroke(tk);
          ctx.beginPath();
          ctx.arc(cx, cy - 330, 4.5, 0, TAU);
          ctx.fillStyle = P.annYellow;
          ctx.fill();
          ctx.restore();
        }
        // annBlue ruler at x 830 from y 610 to 1190 measuring the hero, long ticks at both ends
        const kRul = hit(B_RULER, 6, E.outExpo);
        if (kRul > 0) {
          const x = 830, y0 = 610, y1 = 1190;
          const ye = lerp(y0, y1, kRul);
          const p = new Path2D();
          p.moveTo(x, y0);
          p.lineTo(x, ye);
          for (let k = 0; k <= 20; k++) {
            const y = lerp(y0, y1, k / 20);
            if (y > ye + 0.5) break;
            const l = k === 0 || k === 20 ? 28 : k % 10 === 0 ? 20 : 12;
            p.moveTo(x, y);
            p.lineTo(x + l, y);
          }
          // dotted leaders from the cherry's top and bottom to the ruler ends
          const dots = new Path2D();
          for (const [yy, ok] of [[y0, true], [y1, kRul >= 1]]) {
            if (!ok) continue;
            for (let xx = 552; xx < x - 8; xx += 12) {
              dots.moveTo(xx + 1.5, yy);
              dots.arc(xx, yy, 1.5, 0, TAU);
            }
          }
          ctx.save();
          strokePath(ctx, p, P.ink, 0.2, 5);
          strokePath(ctx, p, P.annBlue, 1, 2);
          ctx.fillStyle = P.annBlue;
          ctx.globalAlpha = 0.9;
          ctx.fill(dots);
          ctx.restore();
        }
      });
    },
  });
})();

</script>
<script>
// ---- src/scenes/02-bean-blueprint.js
// 02 bean-blueprint : A spark, a seed (schematic, global T 1.50 to 3.75)
//
// From 01's cherry on G2, a blueprint: the G2 cherry outline as a lavender guide oval (scale 1.06 settling to
// 1.00 by T 1.875), a spark runs down its left side to the top of the G1 bean, the bean's double outline traces
// on, the crease and the endosperm lattice build, the embryo pops at T 3.00 with a magenta ring, and a network
// of three nodes (endosperm cells, embryo seedling, water uptake) draws out. Exits on G1, which 03 inks on the
// same pixels. Shot 21 duplicates this shot's finished frame: the G1 construction block below is canonical.
//
// Layers, back to front:
//   1 lib.blueprint (navy, 60 px grid, guide circles, two long diagonals)
//   2 guide geometry: circle r 420 at (540, 900) 15 percent with ticks, r 560 dashed, the bean's tilted axis,
//     its construction box, registration crosses, the G2 guide oval (1.5 px, 30 percent)
//   3 measurement: bracket x 790 (y 660 to 1140), tick scale y 1230 (x 360 to 720), tilt arc annotation
//   4 the G1 bean: rectangular endosperm lattice (18 x 12 cells, meridian-curved), double lavender outline,
//     crease groove in lineWhite, embryo outline
//   5 network: three curved lines from the bean surface to node glyphs at (180, 520), (180, 1340), (880, 1340)
//   6 embryo glow (core 9, halo 40, 12 rays) and the magenta ring; the spark
//   7 progress glyph, stage 0 (planta), u = p
//
// Beats: T 1.50 spark (9 frames), T 1.875 outer outline (9 frames, inner 3 behind), T 2.25 crease (9 frames)

(function () {
  'use strict';

  const ID = 'bean-blueprint';
  const LIB = FILM.lib;
  const TAU = Math.PI * 2;
  const DEG = Math.PI / 180;

  };
  const sd = (...k) => LIB.hash(ID, ...k) & 0x7fffffff;

  // ===========================================================================
  // G1 BEAN CONSTRUCTION — canonical (docs/storyboard.md, Shared geometry G1).
  // Self-contained: copy this whole block to draw G1 on the same pixels (21 does).
  //   Upright superellipse |dx/170|^2.3 + |dy/240|^2.3 = 1 about (540, 900), 96 points from the top end
  //   running clockwise, top end 6 percent narrower (dx *= 1 - 0.06 * (1 - dy/240) / 2), then rotated
  //   -15 degrees (top leans left) about (540, 900).
  //   g1Outline(inset, scale)  closed outline; inset shrinks both radii (the 9 px inner line uses inset 9);
  //                            scale scales about (540, 900) (1 = G1)
  //   g1Crease()               crease centreline, smooth, top to bottom (rotated)
  //   g1CreaseWidth(u)         groove width along it: 12 px, tapering to 3 px at both ends
  //   g1Silverskin()           the silverskin line inside the groove, (546, 700) to (538, 1100) before rotation
  //   G1_EMBRYO                embryo centre, (548, 1110) before rotation -> (602, 1101)
  //   g1Rot(x, y) / g1Unrot(x, y)  rotate a pre-rotation point onto the frame, and back
  // ===========================================================================
  const G1 = { cx: 540, cy: 900, a: 170, b: 240, n: 2.3, taper: 0.06, rot: -15 * Math.PI / 180, N: 96 };
  const G1_COS = Math.cos(G1.rot), G1_SIN = Math.sin(G1.rot);
  function g1Rot(x, y) {
    const dx = x - G1.cx, dy = y - G1.cy;
    return [G1.cx + dx * G1_COS - dy * G1_SIN, G1.cy + dx * G1_SIN + dy * G1_COS];
  }
  function g1Unrot(x, y) {
    const dx = x - G1.cx, dy = y - G1.cy;

  // half-width of the upright bean at height dy (pre-rotation, dy in -240..240), with the top taper
  function g1HalfWidth(dy, inset) {
    const a = G1.a - (inset || 0), b = G1.b - (inset || 0);
    const v = Math.min(1, Math.abs(dy) / b);
    const w = a * Math.pow(Math.max(0, 1 - Math.pow(v, G1.n)), 1 / G1.n);

  }
  const G1_CREASE_RAW = [[548, 682], [531, 750], [536, 826], [552, 900], [547, 976], [530, 1052], [538, 1118]];
  function g1Crease() {

  const g1CreaseWidth = (u) => 3 + 9 * Math.pow(Math.sin(Math.PI * Math.min(1, Math.max(0, u))), 0.55);

  const NODES = [

  const B_SPARK = 0; // T 1.50
  const B_OUTLINE = 0.375; // T 1.875
  const B_CREASE = 0.75; // T 2.25
  const B_EMBRYO = 1.5; // T 3.00
  const B_NET = [1.5, 1.75, 2.0]; // T 3.00, 3.25, 3.50 (8th-triplets)
  const B_BRACKET = 1.875; // T 3.375

  // ---------------------------------------------------------------------------
  // Progress glyph: canonical, copied verbatim from docs/storyboard.md.
  function progressGlyph(ctx, L, stage, u, T, allLit) {
    const P = L.pal, cx = 900, cy = 300, r = 46, gap = 6 * Math.PI / 180;
    const q = Math.PI / 2, pop = L.clamp(u * 6);
    ctx.save();
    ctx.lineCap = 'round';
    ctx.globalAlpha = 0.5; ctx.strokeStyle = P.lavender; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(cx, cy, r + 14, 0, Math.PI * 2); ctx.stroke();
    for (let i = 0; i < 4; i++) {
      const a0 = -q + i * q + gap / 2, a1 = a0 + q - gap;
      const past = allLit || i < stage, cur = !allLit && i === stage;
      ctx.globalAlpha = past ? 0.6 : 0.18;
      ctx.strokeStyle = P.lavender; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(cx, cy, r, a0, a1); ctx.stroke();
      if (cur || allLit) {

        const ae = a0 + (a1 - a0) * k;
        ctx.globalAlpha = 1; ctx.strokeStyle = P.lineWhite; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.arc(cx, cy, r, a0, ae); ctx.stroke();

      }

    ctx.beginPath(); ctx.arc(cx, cy, 3, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  // ---------------------------------------------------------------------------
  // drawing helpers
  // ---------------------------------------------------------------------------

  function wobPts(L, pts, seed, amp, bi, closed) {
    const n = pts.length;
    const out = new Array(n);
    let s = 0;
    const sdv = (seed + bi * 7919) | 0;
    for (let i = 0; i < n; i++) {
      const p = pts[i];
      if (i > 0) s += Math.hypot(p[0] - pts[i - 1][0], p[1] - pts[i - 1][1]);
      const a = pts[i > 0 ? i - 1 : closed ? n - 1 : 0], b = pts[i < n - 1 ? i + 1 : closed ? 0 : n - 1];
      const tx = b[0] - a[0], ty = b[1] - a[1];
      const tl = Math.hypot(tx, ty) || 1;
      const d = amp * L.noise1(s * 0.018, sdv);
      out[i] = [p[0] - (ty / tl) * d, p[1] + (tx / tl) * d];
    }
    // keep a closed loop closed: blend the last points back onto the first
    if (closed && n > 8) {
      for (let k = 0; k < 6; k++) {
        const w = (6 - k) / 7;
        const j = n - 1 - k;
        out[j] = [lerp(out[j][0], pts[j][0] + (out[0][0] - pts[0][0]), w), lerp(out[j][1], pts[j][1] + (out[0][1] - pts[0][1]), w)];
      }
    }
    return out;
  }

  function addPoly(path, pts, closed) {
    if (pts.length < 2) return;
    path.moveTo(pts[0][0], pts[0][1]);
    for (let i = 1; i < pts.length; i++) path.lineTo(pts[i][0], pts[i][1]);
    if (closed) path.closePath();
  }

  function stroke(ctx, path, color, alpha, width, dash) {
    if (alpha <= 0.002) return;
    ctx.save();
    ctx.strokeStyle = color;
    ctx.globalAlpha *= alpha;
    ctx.lineWidth = width;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    if (dash) ctx.setLineDash(dash);
    ctx.stroke(path);
    ctx.restore();
  }

  function cumLen(pts, closed) {
    const c = new Float64Array(pts.length + 1);
    for (let i = 1; i <= pts.length; i++) {
      const a = pts[i - 1], b = pts[i % pts.length];
      c[i] = c[i - 1] + (i < pts.length || closed ? Math.hypot(b[0] - a[0], b[1] - a[1]) : 0);
    }
    return c;
  }

  // the first `frac` of a polyline (closed loops include the closing segment)
  function slicePts(pts, frac, closed) {
    const c = cumLen(pts, closed);
    const total = c[closed ? pts.length : pts.length - 1];
    const want = total * clamp(frac);
    const out = [pts[0]];
    const m = closed ? pts.length : pts.length - 1;
    for (let i = 1; i <= m; i++) {
      const b = pts[i % pts.length];
      if (c[i] <= want) out.push(b);
      else {
        const a = pts[i - 1];
        const u = (want - c[i - 1]) / (c[i] - c[i - 1] || 1);
        out.push([lerp(a[0], b[0], u), lerp(a[1], b[1], u)]);
        break;
      }
    }
    return out;
  }

  function pointAt(pts, frac) {
    const s = slicePts(pts, frac, false);
    return s[s.length - 1];
  }

  function ovalPts(cx, cy, rx, ry, n) {
    const out = [];
    for (let i = 0; i < n; i++) {
      const a = -Math.PI / 2 + (i / n) * TAU;
      out.push([cx + Math.cos(a) * rx, cy + Math.sin(a) * ry]);
    }
    return out;
  }

  // ---------------------------------------------------------------------------
  // geometry, built once (t-independent)
  // ---------------------------------------------------------------------------

  let GEO = null;
  function geo() {
    if (GEO) return GEO;
    const outer = g1Outline(0, 1);
    const inner = g1Outline(9, 1);
    const crease = g1Crease();
    const ccum = cumLen(crease, false);
    const silver = g1Silverskin();
    const outerPath = new Path2D();
    addPoly(outerPath, outer, true);
    const innerPath = new Path2D();
    addPoly(innerPath, inner, true);

    // endosperm lattice: rows every 12 px, meridians every 18 px at the waist (curving with the dome)
    const rows = [];
    for (let y = G1.cy - G1.b + 12; y < G1.cy + G1.b - 4; y += 12) {
      const dy = y - G1.cy;
      const w = g1HalfWidth(dy, 10);
      if (w < 6) continue;
      const pts = [];
      for (let k = 0; k <= 12; k++) {
        const x = G1.cx - w + (k / 12) * 2 * w;
        // rows bow a little downward across the dome, like latitudes seen slightly from above
        const bow = 4 * (1 - Math.pow((x - G1.cx) / w, 2));
        pts.push(g1Rot(x, y + bow));

        const u = ((k + 0.5) * 18) / 160;

        if (Math.abs(x - G1.cx) < 18) continue;

    for (let i = 0; i <= 18; i++) {

    }

    const ctrl = [s0[0] + 40, s0[1] + 80];
    for (let i = 1; i <= 12; i++) {
      const u = i / 12, v = 1 - u;
      sparkPts.push([v * v * s0[0] + 2 * v * u * ctrl[0] + u * u * top[0], v * v * s0[1] + 2 * v * u * ctrl[1] + u * u * top[1]]);

        const d = Math.hypot(outer[k][0] - nd.x, outer[k][1] - nd.y);

  // ---------------------------------------------------------------------------

  function drawNode(ctx, L, P, nd, k, bi, alpha) {

      stroke(ctx, rip, P.schemWater, 0.45, 1);
    }
    ctx.restore();
  }

  // ---------------------------------------------------------------------------

  FILM.scene({
    id: ID,
    draw(ctx, tIn, info) {

      L.guideCircle(ctx, 540, 900, 560, { alpha: 0.1, width: 1.2, dash: [3, 9] });
      L.guideCircle(ctx, 540, 900, 300, { alpha: 0.08, width: 1 });
      {

        ax.lineTo(a1[0], a1[1]);

        pl.moveTo(540, 520);

        addPoly(bx, g.box, true);

        const ck = new Path2D();
        for (let i = 0; i < 4; i++) {

        // registration crosses
        const reg = new Path2D();
        for (const [x, y] of [[540, 480], [120, 900], [960, 900], [540, 1320], [540, 610], [540, 1190]]) {
          reg.moveTo(x - 9, y);
          reg.lineTo(x + 9, y);
          reg.moveTo(x, y - 9);
          reg.lineTo(x, y + 9);
        }
        stroke(ctx, reg, lav, 0.4, 1.2);
      }
      // full-bleed rulers down the left edge and across the bottom (scenery), centre crosshair
      L.ticks(ctx, 60, 220, { length: 1320, angle: Math.PI / 2, n: 44, len: 9, major: 4, majorLen: 20, side: 1, alpha: 0.35, width: 1.2, color: lav });
      L.ticks(ctx, 120, 1620, { length: 840, angle: 0, n: 28, len: 8, major: 7, majorLen: 18, side: -1, alpha: 0.25, width: 1.2, color: lav });
      {
        const ch = new Path2D();
        ch.moveTo(520, 900);
        ch.lineTo(560, 900);
        ch.moveTo(540, 880);
        ch.lineTo(540, 920);
        stroke(ctx, ch, lav, 0.35, 1);
      }
      const kOutG = hit(B_OUTLINE, 9);
      // G2 cherry guide oval: 1.06 at the cut (01's last frame), settling to 1.00 by T 1.875
      {
        const s = lerp(1.06, 1, E.outCubic(clamp(t / B_OUTLINE)));
        const ov = new Path2D();
        ov.ellipse(G2.x, G2.y, G2.rx * s, G2.ry * s, 0, 0, TAU);
        stroke(ctx, ov, lav, 0.3, 1.5);
        const qt = new Path2D();
        for (let k = 0; k < 4; k++) {
          const a = (k * Math.PI) / 2;
          const x = G2.x + Math.cos(a) * G2.rx * s, y = G2.y + Math.sin(a) * G2.ry * s;
          const nx = Math.cos(a), ny = Math.sin(a);
          qt.moveTo(x - nx * 8, y - ny * 8);
          qt.lineTo(x + nx * 8, y + ny * 8);
        }
        stroke(ctx, qt, lav, 0.5, 1.5);
        // a graduated ring of ticks around the oval, every 5 degrees, longer every 30
        const gt = new Path2D(), gtM = new Path2D();
        for (let d = 0; d < 360; d += 5) {
          const a = d * DEG;
          const x = G2.x + Math.cos(a) * G2.rx * s, y = G2.y + Math.sin(a) * G2.ry * s;
          let nx = Math.cos(a) / G2.rx, ny = Math.sin(a) / G2.ry;
          const nl = Math.hypot(nx, ny);
          nx /= nl;
          ny /= nl;
          const major = d % 30 === 0;
          const pth = major ? gtM : gt;
          pth.moveTo(x - nx * 3, y - ny * 3);
          pth.lineTo(x - nx * (major ? 16 : 8), y - ny * (major ? 16 : 8));
        }
        stroke(ctx, gt, lav, 0.38, 1.2);
        stroke(ctx, gtM, lav, 0.6, 1.5);
        // the G1 construction ghost, dashed, the target the spark is heading for
        const gh = new Path2D();
        addPoly(gh, g.outer, true);
        stroke(ctx, gh, lav, 0.26 * (1 - 0.5 * clamp(kOutG)), 1.2, [6, 7]);
        // the calyx scar disc of G2, as a faint construction ring
        const sc = new Path2D();
        sc.ellipse(540, 900 + 272 * s, 34 * s, 24 * s, 0, 0, TAU);
        stroke(ctx, sc, lav, 0.2, 1);
      }

      // ---- 3 measurement -------------------------------------------------------------------
      const kB = hit(B_BRACKET, 6, E.outExpo);
      if (kB > 0) {
        L.bracket(ctx, 790, 660, 790, 1140, { p: kB, alpha: 0.6, cap: 16 });
        L.ticks(ctx, 790, 660, { length: 480, angle: Math.PI / 2, n: 8, len: 10 * kB, side: 1, baseline: false, alpha: 0.6, width: 1.5, color: white });
        L.ticks(ctx, 360, 1230, { length: 360, angle: 0, n: 12, len: 12, major: 3, majorLen: 20, side: 1, alpha: 0.6, width: 1.5, p: kB });
        // extension lines from the bean's ends and sides to the scales
        const ext = new Path2D();
        const top = g.outer[0], bot = g.outer[48];
        ext.moveTo(top[0] + 14, 660);
        ext.lineTo(806, 660);
        ext.moveTo(bot[0] + 14, 1140);
        ext.lineTo(806, 1140);
        let minX = 1e9, maxX = -1e9;
        for (const p of g.outer) {
          minX = Math.min(minX, p[0]);
          maxX = Math.max(maxX, p[0]);
        }
        ext.moveTo(minX, 1000);
        ext.lineTo(minX, 1244);
        ext.moveTo(maxX, 1000);
        ext.lineTo(maxX, 1244);
        stroke(ctx, ext, lav, 0.28 * kB, 1, [4, 6]);
        // tilt: an arc from the plumb line to the bean's axis, above the bean
        L.arcAnnotation(ctx, 540, 900, 330, -Math.PI / 2, -Math.PI / 2 - 15 * DEG * kB, { color: lav, alpha: 0.6, width: 1.5, endTicks: 10 });
      }

      // ---- 4 the G1 bean ----------------------------------------------------------------------
      const kOut = hit(B_OUTLINE, 9, E.inOutSine);
      const kIn = hit(B_OUTLINE + 3 * FR, 9, E.inOutSine);
      const kCrease = hit(B_CREASE, 9, E.outCubic);
      // lattice rows fade in top to bottom from T 2.25 to 3.00
      const latU = clamp((t - B_CREASE) / (B_EMBRYO - B_CREASE));
      if (latU > 0) {
        const nR = g.rows.length;
        const byA = new Map();
        const bucket = (a) => {
          const q = Math.round(a * 20) / 20;
          if (!byA.has(q)) byA.set(q, new Path2D());
          return byA.get(q);
        };
        for (let j = 0; j < nR; j++) {
          const a = clamp(latU * (nR + 6) - j, 0, 6) / 6;
          if (a <= 0) continue;
          addPoly(bucket(a), wobPts(L, g.rows[j].pts, sd('row', j), 0.6, bi, false), false);
        }
        for (const [a, p] of byA) stroke(ctx, p, lav, 0.32 * a, 1);
        // meridians reveal with the rows: clip them to the revealed band
        const yCut = G1.cy - G1.b + latU * (2 * G1.b + 72);
        ctx.save();
        ctx.clip(g.innerPath);
        const mp = new Path2D();
        for (let k = 0; k < g.merid.length; k++) {
          const pts = g.merid[k];
          const cut = [];
          for (const p of pts) {
            const up = g1Unrot(p[0], p[1]);
            if (up[1] <= yCut) cut.push(p);
          }
          if (cut.length > 1) addPoly(mp, wobPts(L, cut, sd('mer', k), 0.6, bi, false), false);
        }
        stroke(ctx, mp, lav, 0.3, 1);
        // nuclei
        ctx.fillStyle = lav;
        ctx.globalAlpha = 0.45;
        ctx.beginPath();
        for (const n of g.nuclei) {
          if (n.y > yCut - 30) continue;
          ctx.moveTo(n.p[0] + n.s, n.p[1]);
          ctx.arc(n.p[0], n.p[1], n.s, 0, TAU);
        }
        ctx.fill();
        ctx.restore();
      }
      // double outline: outer 2.5 px at 85 percent, inner 1.5 px at 50 percent, 9 px in
      if (kOut > 0) {
        const pts = wobPts(L, g.outer, sd('outer'), 1.1, bi, true);
        const p = new Path2D();
        addPoly(p, kOut >= 1 ? pts : slicePts(pts, kOut, true), kOut >= 1);
        stroke(ctx, p, lav, 0.85, 2.5);
      }
      if (kIn > 0) {
        const pts = wobPts(L, g.inner, sd('inner'), 0.9, bi, true);
        const p = new Path2D();
        addPoly(p, kIn >= 1 ? pts : slicePts(pts, kIn, true), kIn >= 1);
        stroke(ctx, p, lav, 0.5, 1.5);
      }
      // crease: a lineWhite groove 12 px tapering to 3 px, drawn top to bottom
      if (kCrease > 0) {
        const cr = wobPts(L, g.crease, sd('crease'), 0.7, bi, false);
        const n = cr.length;
        const total = g.ccum[n - 1];
        const lim = total * kCrease;
        ctx.save();
        ctx.lineCap = 'round';
        ctx.strokeStyle = white;
        ctx.globalAlpha = 0.9;
        for (let i = 1; i < n; i++) {
          if (g.ccum[i - 1] > lim) break;
          const u = g.ccum[i] / total;
          ctx.lineWidth = g1CreaseWidth(u);
          ctx.beginPath();
          ctx.moveTo(cr[i - 1][0], cr[i - 1][1]);
          ctx.lineTo(cr[i][0], cr[i][1]);
          ctx.stroke();
        }
        ctx.restore();
        // the groove floor: a thin navy line down the middle, with the silverskin line in paleBlue
        const floor = new Path2D();
        addPoly(floor, slicePts(cr, kCrease, false), false);
        stroke(ctx, floor, P.navy, 0.75, 2.2);
        const sv = slicePts(wobPts(L, g.silver, sd('silver'), 0.5, bi, false), clamp((kCrease - 0.05) / 0.9), false);
        const svp = new Path2D();
        addPoly(svp, sv.map((p) => [p[0] + 1.2, p[1] - 0.4]), false);
        stroke(ctx, svp, P.paleBlue, 0.7, 1);
        // the groove's lips: two fine lavender lines either side
        const lips = new Path2D();
        for (const s of [-1, 1]) {
          const lp = [];
          for (let i = 0; i < n; i++) {
            if (g.ccum[i] > lim) break;
            const a = cr[Math.max(0, i - 1)], b = cr[Math.min(n - 1, i + 1)];
            const tx = b[0] - a[0], ty = b[1] - a[1], tl = Math.hypot(tx, ty) || 1;
            const w = g1CreaseWidth(g.ccum[i] / total) / 2 + 5;
            lp.push([cr[i][0] - (ty / tl) * w * s, cr[i][1] + (tx / tl) * w * s]);
          }
          addPoly(lips, lp, false);
        }
        stroke(ctx, lips, lav, 0.45, 1);
      }
      // embryo outline appears with the crease end
      const kEmbOut = hit(B_CREASE + 7 * FR, 6, E.outExpo);
      if (kEmbOut > 0) {
        const p = new Path2D();
        addPoly(p, wobPts(L, g.emb, sd('emb'), 0.5, bi, true), true);
        stroke(ctx, p, lav, 0.7 * kEmbOut, 1.5);
        const p2 = new Path2D();
        addPoly(p2, g.emb.map((q) => [lerp(q[0], G1_EMBRYO[0], 0.3), lerp(q[1], G1_EMBRYO[1], 0.3)]), true);
        stroke(ctx, p2, lav, 0.35 * kEmbOut, 1);
      }

      // ---- 5 network -----------------------------------------------------------------------------
      for (let i = 0; i < NODES.length; i++) {
        const a = B_NET[i];
        if (t < a) continue;
        const kL = hit(a, 6, E.outExpo);
        const net = g.net[i];
        const p = new Path2D();
        addPoly(p, slicePts(wobPts(L, net.pts, sd('net', i), 0.8, bi, false), kL, false), false);
        stroke(ctx, p, lav, 0.6, 1.5);
        // source dot on the bean surface
        ctx.save();
        ctx.fillStyle = white;
        ctx.globalAlpha = 0.85;
        ctx.beginPath();
        ctx.arc(net.s[0], net.s[1], 3.5, 0, TAU);
        ctx.fill();
        ctx.restore();
        drawNode(ctx, L, P, NODES[i], popTwos(a), bi, 1);
      }

      // ---- 6 embryo glow and the magenta ring ------------------------------------------------------
      if (t >= B_EMBRYO) {
        const k = hit(B_EMBRYO, 3, E.outBack);
        L.glowDot(ctx, G1_EMBRYO[0], G1_EMBRYO[1], 9 * k, { rays: 12, rayLen: 2, glow: 40 / 9, rot: (bi % 2) * 15 * DEG, seed: sd('embryo') });
        L.ticks(ctx, G1_EMBRYO[0], G1_EMBRYO[1], { r: 30, n: 16, len: 6 * clamp(k), color: white, alpha: 0.5, width: 1.2, rot: t * 0.6 });
        const f = (t - B_EMBRYO) / FR;
        if (f < 12) {
          const u = hit(B_EMBRYO, 12, E.outExpo);
          const ring = new Path2D();
          ring.arc(G1_EMBRYO[0], G1_EMBRYO[1], lerp(30, 120, u), 0, TAU);
          stroke(ctx, ring, mag, 1 - clamp(f / 12), 3);
        }
      }
      // the spark: down the guide oval's left side to the top of the bean, then it rides the tracing pen
      if (t < B_OUTLINE + 9 * FR) {
        let sp;
        if (t < B_OUTLINE) {
          sp = pointAt(g.sparkPts, hit(B_SPARK, 9, E.inOutSine));
          // a short fading trail behind it
          const u = hit(B_SPARK, 9, E.inOutSine);
          const tr = slicePts(g.sparkPts, u, false);
          const tail = tr.slice(Math.max(0, tr.length - 8));
          const tp = new Path2D();
          addPoly(tp, tail, false);
          stroke(ctx, tp, white, 0.55, 2);
        } else {
          sp = pointAt(g.outer.concat([g.outer[0]]), kOut);
        }
        L.glowDot(ctx, sp[0], sp[1], 6, { rays: 8, rayLen: 3, rot: (bi % 2) * 22.5 * DEG, seed: sd('spark'), glow: 5 });
      }

      // ---- 7 progress glyph ------------------------------------------------------------------------
      progressGlyph(ctx, L, 0, info.p, info.T, false);
    },
  });
})();

</script>
<script>
// ---- src/scenes/03-seedling.js
// 03 seedling : Soldier, then butterfly (illustrated, global T 3.75 to 6.00)
//
// The G1 bean, inked and still in its parchment, sits on the exact G1 pixels of 02's last frame, then drops
// into a soil cutaway. The root goes down first; the hypocotyl arches up as a hook, breaks the surface on the
// beat and straightens, lifting the seed (parchment on) to the top of the stem: the "soldier" stage. On the
// next beat the parchment cracks along the crease and falls off to the right, and two round cotyledons open
// flat: the "butterfly" stage, with the first pair of true leaves just showing between them.
//
// Layers, back to front:
//   1 stripes stripeCream / stripeSpring (top 60 percent, the soil covers the rest)
//   2 construction lines in inkFaint: the stem axis, the soldier height, a height scale on the left
//   3 soil cutaway y 1180 to 1920: soil, soilDeep hatching, stones, crumbs, organic flecks, surface line
//   4 root (3 px to 1 px) with 14 root hairs and three late laterals
//   5 stem, 22 px, leafLight with a pale base, contour hatched on its shadow half
//   6 the seed: the inked G1 bean in parchment; after the split, two tumbling parchment halves and the
//     cotyledons (closed, then opening flat) with the first true-leaf pair
//   7 overlays: annBlue dashed drop line (fall) and dashed lift trajectory, annMagenta ring at the split,
//     annYellow arc annotation across the cotyledon span
//
// Beats: T 3.75 fall (9 frames, inOutCubic), T 4.125 root (outExpo, 9 frames), T 4.50 the hook breaks the
// surface, T 4.50 to 5.25 the stem rises on twos, T 5.25 parchment split + magenta ring, halves fall 9 frames,
// T 5.625 cotyledons open (popTwos), then hold with a slight sway.
(function () {
  'use strict';

  const ID = 'seedling';
  const LIB = FILM.lib;
  const TAU = Math.PI * 2;
  const DEG = Math.PI / 180;
  const FR = 1 / 24;

  const clamp = (v, lo = 0, hi = 1) => (v < lo ? lo : v > hi ? hi : v);
  const lerp = (a, b, u) => a + (b - a) * u;
  const sstep = (a, b, x) => {
    const u = clamp((x - a) / (b - a));
    return u * u * (3 - 2 * u);
  };
  const sd = (...k) => LIB.hash(ID, ...k) & 0x7fffffff;

  // ===========================================================================
  // G1 BEAN CONSTRUCTION — canonical, copied verbatim from 02-bean-blueprint.js
  // (docs/storyboard.md, Shared geometry G1).
  // ===========================================================================
  const G1 = { cx: 540, cy: 900, a: 170, b: 240, n: 2.3, taper: 0.06, rot: -15 * Math.PI / 180, N: 96 };
  const G1_COS = Math.cos(G1.rot), G1_SIN = Math.sin(G1.rot);
  function g1Rot(x, y) {
    const dx = x - G1.cx, dy = y - G1.cy;
    return [G1.cx + dx * G1_COS - dy * G1_SIN, G1.cy + dx * G1_SIN + dy * G1_COS];
  }
  function g1Unrot(x, y) {
    const dx = x - G1.cx, dy = y - G1.cy;
    return [G1.cx + dx * G1_COS + dy * G1_SIN, G1.cy - dx * G1_SIN + dy * G1_COS];
  }
  // half-width of the upright bean at height dy (pre-rotation, dy in -240..240), with the top taper
  function g1HalfWidth(dy, inset) {
    const a = G1.a - (inset || 0), b = G1.b - (inset || 0);
    const v = Math.min(1, Math.abs(dy) / b);
    const w = a * Math.pow(Math.max(0, 1 - Math.pow(v, G1.n)), 1 / G1.n);
    return w * (1 - (G1.taper * (1 - dy / G1.b)) / 2);
  }
  function g1Outline(inset, scale) {
    const a = G1.a - (inset || 0), b = G1.b - (inset || 0), s = scale || 1, e = 2 / G1.n;
    const out = [];
    for (let i = 0; i < G1.N; i++) {
      const th = -Math.PI / 2 + (i / G1.N) * Math.PI * 2;
      const c = Math.cos(th), sn = Math.sin(th);
      let dx = a * Math.sign(c) * Math.pow(Math.abs(c), e);
      const dy = b * Math.sign(sn) * Math.pow(Math.abs(sn), e);
      dx *= 1 - (G1.taper * (1 - dy / G1.b)) / 2;
      const p = g1Rot(G1.cx + dx * s, G1.cy + dy * s);
      out.push(p);
    }
    return out;
  }
  const G1_CREASE_RAW = [[548, 682], [531, 750], [536, 826], [552, 900], [547, 976], [530, 1052], [538, 1118]];
  function g1Crease() {
    return LIB.smoothPts(G1_CREASE_RAW.map((p) => g1Rot(p[0], p[1])), false, 5);
  }
  const g1CreaseWidth = (u) => 3 + 9 * Math.pow(Math.sin(Math.PI * Math.min(1, Math.max(0, u))), 0.55);
  function g1Silverskin() {
    // the crease centreline between y 700 and 1100 (pre-rotation), nudged to the listed end points
    const raw = LIB.smoothPts(G1_CREASE_RAW, false, 5).filter((p) => p[1] >= 700 && p[1] <= 1100);
    raw[0] = [546, 700];
    raw[raw.length - 1] = [538, 1100];
    return raw.map((p) => g1Rot(p[0], p[1]));
  }
  const G1_EMBRYO = g1Rot(548, 1110);
  // ===================== end of the G1 construction block =====================

  // beats (shot-local seconds; the shot starts at T 3.75)
  const B_FALL = 0; // T 3.75
  const B_ROOT = 0.375; // T 4.125
  const B_HOOK = 0.5; // T 4.25: the hook forms in the soil
  const B_RISE = 0.75; // T 4.50: the hook breaks the surface
  const B_SPLIT = 1.5; // T 5.25
  const B_OPEN = 1.875; // T 5.625

  const SURF = 1180; // soil surface
  const BURY = [540, 1350]; // buried seed centre
  const S_SEED = 0.35; // seed scale once buried
  const HALF_LEN = G1.b * S_SEED; // 84 px from the seed centre to either end
  // root / shoot junction: the seed's lower tip at rest
  const J = [BURY[0] + HALF_LEN * Math.sin(15 * DEG), BURY[1] + HALF_LEN * Math.cos(15 * DEG)];
  const R_HOOK = 44;
  const LS_HOOK = J[1] - SURF - R_HOOK; // straight length when the hook apex reaches the surface
  const R_STRAIGHT = 213; // the arc radius once the stem is nearly straight (no kink under the seed)
const LS_END = J[1] - 781 - R_STRAIGHT * Math.sin(15 * DEG); // straight length at the soldier stage (seed centre (540, 700))
  const STEM_W = 22;

  // ---------------------------------------------------------------------------
  // helpers
  // ---------------------------------------------------------------------------

  function trace(ctx, pts, closed = true) {
    for (let i = 0; i < pts.length; i++) {
      if (i === 0) ctx.moveTo(pts[i][0], pts[i][1]);
      else ctx.lineTo(pts[i][0], pts[i][1]);
    }
    if (closed) ctx.closePath();
  }

  function pathOf(pts, closed = true) {
    const p = new Path2D();
    trace(p, pts, closed);
    return p;
  }

  function fillPoly(ctx, pts, color, alpha = 1) {
    ctx.save();
    ctx.globalAlpha *= alpha;
    ctx.fillStyle = color;
    ctx.beginPath();
    trace(ctx, pts, true);
    ctx.fill();
    ctx.restore();
  }

  function strokePath(ctx, path, color, alpha, width, dash) {
    if (alpha <= 0.002) return;
    ctx.save();
    ctx.strokeStyle = color;
    ctx.globalAlpha *= alpha;
    ctx.lineWidth = width;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    if (dash) ctx.setLineDash(dash);
    ctx.stroke(path);
    ctx.restore();
  }

  function ovalPts(cx, cy, rx, ry, rot, n) {
    const out = [];
    const c = Math.cos(rot), s = Math.sin(rot);
    for (let i = 0; i < n; i++) {
      const a = (i / n) * TAU;
      const x = Math.cos(a) * rx, y = Math.sin(a) * ry;
      out.push([cx + x * c - y * s, cy + x * s + y * c]);
    }
    return out;
  }

  function cum(pts) {
    const c = [0];
    for (let i = 1; i < pts.length; i++) c.push(c[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]));
    return c;
  }

  function slicePts(pts, frac) {
    const c = cum(pts);
    const want = c[c.length - 1] * clamp(frac);
    const out = [pts[0]];
    for (let i = 1; i < pts.length; i++) {
      if (c[i] <= want) out.push(pts[i]);
      else {
        const u = (want - c[i - 1]) / (c[i] - c[i - 1] || 1);
        out.push([lerp(pts[i - 1][0], pts[i][0], u), lerp(pts[i - 1][1], pts[i][1], u)]);
        break;
      }
    }
    return out;
  }

  // local bean shape (upright, centred at 0,0, pre-rotation), taken from the canonical G1 outline
  const BEAN_LOCAL = (() => {
    const outline = g1Outline(0, 1).map((p) => {
      const q = g1Unrot(p[0], p[1]);
      return [q[0] - G1.cx, q[1] - G1.cy];
    });
    const crease = g1Crease().map((p) => {
      const q = g1Unrot(p[0], p[1]);
      return [q[0] - G1.cx, q[1] - G1.cy];
    });
    const silver = g1Silverskin().map((p) => {
      const q = g1Unrot(p[0], p[1]);
      return [q[0] - G1.cx, q[1] - G1.cy];
    });
    // parchment halves split along the crease: right = outline top->bottom + crease bottom->top
    const n = outline.length;
    const right = outline.slice(0, n / 2 + 1).concat(crease.slice().reverse());
    const left = outline.slice(n / 2).concat([outline[0]]).concat(crease.slice());
    // papery fibres running along the hull
    const r = LIB.rng(sd('fibres'));
    const fibres = [];
    for (let i = 0; i < 26; i++) {
      const u = r.range(-0.85, 0.85);
      const y0 = r.range(-200, 60), l = r.range(70, 170);
      const pts = [];
      for (let k = 0; k <= 6; k++) {
        const y = Math.min(225, y0 + (k / 6) * l);
        pts.push([u * g1HalfWidth(y, 14), y]);
      }
      fibres.push(pts);
    }
    return { outline, crease, silver, right, left, fibres, ccum: cum(crease) };
  })();

  function xf(pts, cx, cy, s, rot) {
    const c = Math.cos(rot), sn = Math.sin(rot);
    return pts.map((p) => [cx + (p[0] * c - p[1] * sn) * s, cy + (p[0] * sn + p[1] * c) * s]);
  }

  // ---------------------------------------------------------------------------
  // pose of the seed and stem at a drawing time tw (on twos)
  // ---------------------------------------------------------------------------

  function pose(tw, E) {
    if (tw < B_ROOT) {
      const u = E.inOutCubic(clamp((tw - B_FALL) / (B_ROOT - B_FALL)));
      return { c: [lerp(G1.cx, BURY[0], u), lerp(G1.cy, BURY[1], u)], s: lerp(1, S_SEED, u), rot: G1.rot, stem: null };
    }
    let Ls = 0, phi = -15 * DEG;
    if (tw < B_HOOK) return { c: BURY.slice(), s: S_SEED, rot: G1.rot, stem: null };
    if (tw < B_RISE) {
      const u = (tw - B_HOOK) / (B_RISE - B_HOOK);
      Ls = LS_HOOK * E.outQuad(u);
      phi = lerp(-15, 180, E.inOutQuad(u)) * DEG;
    } else {
      const u = clamp((tw - B_RISE) / (B_SPLIT - B_RISE));
      Ls = lerp(LS_HOOK, LS_END, E.outCubic(u));
      phi = lerp(180, -15, E.inOutCubic(sstep(0.15, 1, u))) * DEG;
    }
    const st = stemLine(Ls, phi);
    const hd = -Math.PI / 2 + phi;
    const end = st.pts[st.pts.length - 1];
    return { c: [end[0] + Math.cos(hd) * HALF_LEN, end[1] + Math.sin(hd) * HALF_LEN], s: S_SEED, rot: phi, stem: st, end, hd };
  }

  // stem centreline from J: straight up Ls, then an arc turning by phi (right = positive). The arc is tight
  // (R 44) while hooked and opens to R 213 as the stem straightens; the straight part leans right by the
  // arc's sideways drift so the seed lands centred on x 540.
  function stemLine(Ls, phi) {
    const R = R_HOOK + (R_STRAIGHT - R_HOOK) * (1 - sstep(0, 60 * DEG, Math.abs(phi)));
    const lean = phi < 0 ? R * (1 - Math.cos(phi)) * clamp((R - R_HOOK) / (R_STRAIGHT - R_HOOK)) : 0;
    const pts = [];
    const nS = Math.max(2, Math.ceil(Ls / 8));
    for (let i = 0; i <= nS; i++) pts.push([J[0] + (lean * i) / nS, J[1] - (Ls * i) / nS]);
    const top = pts[pts.length - 1];
    const n = Math.max(2, Math.ceil((Math.abs(phi) * R) / 6));
    for (let i = 1; i <= n; i++) {
      const a = (phi * i) / n;
      if (phi >= 0) pts.push([top[0] + R - R * Math.cos(a), top[1] - R * Math.sin(a)]);
      else pts.push([top[0] - R + R * Math.cos(a), top[1] + R * Math.sin(a)]);
    }
    return { pts };
  }

  // ---------------------------------------------------------------------------
  // geometry, built once (t-independent)
  // ---------------------------------------------------------------------------

  let GEO = null;
  function geo() {
    if (GEO) return GEO;
    const r = LIB.rng(sd('soil'));
    // soil surface: a soft irregular line
    const surf = [];
    for (let x = -40; x <= 1120; x += 10) surf.push([x, SURF + 3 * LIB.noise1(x * 0.02, sd('surf')) + 1.5 * LIB.noise1(x * 0.09, sd('surf2'))]);
    const soilPoly = surf.concat([[1120, 1960], [-40, 1960]]);
    // stones
    const stones = [];
    const spots = [[150, 1300, 46, 30], [880, 1260, 38, 26], [300, 1640, 58, 36], [820, 1580, 50, 34], [700, 1760, 34, 24], [110, 1820, 44, 30], [960, 1840, 40, 28], [420, 1270, 22, 15]];
    for (const [x, y, rx, ry] of spots) {
      const pts = [];
      const rot = r.range(-0.5, 0.5);
      for (let i = 0; i < 18; i++) {
        const a = (i / 18) * TAU;
        const k = 1 + 0.12 * LIB.noise1(i * 0.7, sd('stone', x));
        pts.push([x + Math.cos(a + rot) * rx * k, y + Math.sin(a + rot) * ry * k]);
      }
      stones.push({ pts, x, y, rx, ry, key: x * 7 + y });
    }
    // crumbs and organic flecks
    const crumbs = [];
    for (let i = 0; i < 90; i++) crumbs.push({ x: r.range(0, 1080), y: r.range(SURF + 20, 1910), r: r.range(2, 5), pale: r() < 0.5 });
    const flecks = [];
    for (let i = 0; i < 26; i++) {
      const x = r.range(20, 1060), y = r.range(SURF + 40, 1900), a = r.range(0, TAU), l = r.range(14, 36);
      flecks.push([[x, y], [x + Math.cos(a) * l * 0.5 + r.range(-4, 4), y + Math.sin(a) * l * 0.5 + r.range(-4, 4)], [x + Math.cos(a) * l, y + Math.sin(a) * l]]);
    }
    // surface crumbs above the line
    const top = [];
    for (let i = 0; i < 40; i++) top.push({ x: r.range(0, 1080), y: SURF - r.range(1, 6), r: r.range(1.5, 3.5) });
    // strata dashes
    const strata = [];
    for (let k = 0; k < 5; k++) {
      const y0 = 1330 + k * 120 + r.range(-20, 20);
      const pts = [];
      for (let x = -20; x <= 1100; x += 40) pts.push([x, y0 + 6 * LIB.noise1(x * 0.01, sd('strata', k))]);
      strata.push(pts);
    }
    // the root: from J down to about (548, 1800), wandering
    const root = [];
    for (let i = 0; i <= 18; i++) {
      const u = i / 18;
      root.push([J[0] + (548 - J[0]) * u + 12 * LIB.noise1(u * 3.2, sd('root')) * Math.sin(Math.PI * u), lerp(J[1], 1800, u)]);
    }
    const rootS = LIB.smoothPts(root, false, 4);
    const rc = cum(rootS);
    const hairs = [];
    for (let i = 0; i < 14; i++) {
      const u = 0.12 + (i / 14) * 0.8;
      const k = Math.min(rootS.length - 2, Math.floor(u * (rootS.length - 1)));
      const p = rootS[k], q = rootS[k + 1];
      const da = Math.atan2(q[1] - p[1], q[0] - p[0]);
      const side = i % 2 ? 1 : -1;
      const a = da + side * r.range(0.9, 1.3);
      const l = r.range(14, 28) * (1 - 0.4 * u);
      hairs.push({ u, pts: [p, [p[0] + Math.cos(a) * l * 0.55, p[1] + Math.sin(a) * l * 0.55 + 2], [p[0] + Math.cos(a) * l, p[1] + Math.sin(a) * l + 5]] });
    }
    const laterals = [];
    for (const [u, side, l] of [[0.3, -1, 80], [0.48, 1, 95], [0.66, -1, 70]]) {
      const k = Math.floor(u * (rootS.length - 1));
      const p = rootS[k];
      const pts = [p];
      for (let j = 1; j <= 5; j++) {
        const v = j / 5;
        pts.push([p[0] + side * l * v, p[1] + l * 0.55 * v + 8 * Math.sin(v * 3 + u * 9)]);
      }
      laterals.push({ u, pts: LIB.smoothPts(pts, false, 4) });
    }
    GEO = { surf, soilPoly, stones, crumbs, flecks, top, strata, rootS, rc, hairs, laterals };
    return GEO;
  }

  // ---------------------------------------------------------------------------
  // drawing pieces
  // ---------------------------------------------------------------------------

  function drawSoil(ctx, L, P, g, bi) {
    fillPoly(ctx, g.soilPoly, P.soil);
    // soilDeep hatching, denser with depth
    L.hatch(ctx, g.soilPoly, {
      angle: -Math.PI / 4, spacing: 7, width: 1.5, color: P.soilDeep, alpha: 0.85, length: [12, 36], seed: sd('sh1'),
      density: (x, y) => 0.35 + 0.65 * sstep(SURF, 1900, y),
    });
    L.hatch(ctx, g.soilPoly, {
      angle: -Math.PI / 4 - Math.PI / 3, spacing: 7, width: 1.3, color: P.soilDeep, alpha: 0.75, length: [10, 26], seed: sd('sh2'),
      density: (x, y) => sstep(1450, 1900, y),
    });
    // a darker band just under the surface (the lip of the cut)
    L.hatch(ctx, [[-40, SURF], [1120, SURF], [1120, SURF + 26], [-40, SURF + 26]], { angle: -0.05, spacing: 4, width: 1.3, color: P.soilDeep, alpha: 0.9, length: [20, 60], seed: sd('lip') });
    for (let k = 0; k < g.strata.length; k++) L.inkPath(ctx, g.strata[k], { width: 1.4, color: P.soilDeep, alpha: 0.7, seed: sd('str', k), taper: [30, 30], wobble: 1.5 });
    // grains
    L.stipple(ctx, g.soilPoly, { spacing: 12, r: [1.0, 2.0], color: P.tan, alpha: 0.55, seed: sd('grain'), density: 0.6 });
    L.stipple(ctx, g.soilPoly, { spacing: 10, r: [1.0, 1.8], color: P.soilDeep, alpha: 0.8, seed: sd('grain2'), density: (x, y) => 0.4 + 0.6 * sstep(SURF, 1800, y) });
    // crumbs
    const cp = new Path2D(), cd = new Path2D();
    for (const c of g.crumbs) {
      const p = c.pale ? cp : cd;
      p.moveTo(c.x + c.r, c.y);
      p.arc(c.x, c.y, c.r, 0, TAU);
    }
    ctx.fillStyle = P.tan;
    ctx.globalAlpha = 0.7;
    ctx.fill(cp);
    ctx.fillStyle = P.soilDeep;
    ctx.globalAlpha = 0.9;
    ctx.fill(cd);
    ctx.globalAlpha = 1;
    strokePath(ctx, cp, P.ink, 0.35, 0.8);
    for (let i = 0; i < g.flecks.length; i++) L.inkPath(ctx, g.flecks[i], { width: 1.8, color: P.tan, alpha: 0.75, seed: sd('fl', i), taper: [3, 5], wobble: 0.4 });
    // stones
    for (const s of g.stones) {
      fillPoly(ctx, s.pts, L.mix(P.paperDeep, P.tan, 0.4));
