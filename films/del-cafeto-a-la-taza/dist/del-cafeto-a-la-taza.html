      L.hatch(ctx, s.pts, { angle: -Math.PI / 4, spacing: 4.5, width: 1.2, color: P.inkSoft, alpha: 0.8, length: [6, 18], seed: sd('stoneh', s.key), density: (x, y) => sstep(-0.2, 0.7, ((x - s.x) / s.rx) * 0.6 + ((y - s.y) / s.ry) * 0.8) });
      L.inkPath(ctx, s.pts, { closed: true, width: 2.4, color: P.ink, seed: sd('stone', s.key), wobble: 0.6 });
      L.inkPath(ctx, [[s.x - s.rx * 0.5, s.y - s.ry * 0.45], [s.x - s.rx * 0.1, s.y - s.ry * 0.62]], { width: 1.6, color: P.white, alpha: 0.7, seed: sd('stl', s.key), taper: [3, 3], wobble: 0.2 });
    }
    // surface line with crumbs on top
    const tp = new Path2D();
    for (const c of g.top) {
      tp.moveTo(c.x + c.r, c.y);
      tp.arc(c.x, c.y, c.r, 0, TAU);
    }
    ctx.fillStyle = P.soil;
    ctx.fill(tp);
    strokePath(ctx, tp, P.ink, 0.6, 1);
    L.inkPath(ctx, g.surf, { width: 3.4, color: P.ink, seed: sd('surfline'), taper: [0, 0], wobble: 1, step: 4 });
  }

  // a 22 px stem ribbon along a centreline, contour hatched on its shadow half
  function drawStem(ctx, L, P, pts, bi, extra) {
    if (pts.length < 2) return;
    const C = L.smoothPts(pts, false, 5);
    const n = C.length;
    if (n < 2) return;
    const left = [], right = [], nrm = [];
    for (let i = 0; i < n; i++) {
      const a = C[Math.max(0, i - 1)], b = C[Math.min(n - 1, i + 1)];
      let tx = b[0] - a[0], ty = b[1] - a[1];
      const tl = Math.hypot(tx, ty) || 1;
      tx /= tl;
      ty /= tl;
      const u = i / (n - 1);
      const w = (STEM_W / 2) * (1 - 0.18 * sstep(0.85, 1, u)) * (extra && extra.ws ? extra.ws : 1);
      left.push([C[i][0] + ty * w, C[i][1] - tx * w]);
      right.push([C[i][0] - ty * w, C[i][1] + tx * w]);
      nrm.push([-ty, tx]);
    }
    const poly = left.concat(right.slice().reverse());
    // the buried part is pale, yellow-green toward the base; above ground leafLight
    fillPoly(ctx, poly, P.leafLight);
    ctx.save();
    ctx.beginPath();
    ctx.rect(-10, SURF + 2, 1100, 800);
    ctx.clip();
    fillPoly(ctx, poly, L.mix(P.leafLight, P.flowerWhite, 0.55));
    ctx.restore();
    // contour hatching across the shadow half (the side facing lower right), 7 px apart, slightly curved
    const hp = new Path2D();
    const c = cum(C);
    let next = 4;
    for (let i = 1; i < n - 1; i++) {
      if (c[i] < next) continue;
      next = c[i] + 7.5 + 1.2 * L.h3(i, 3, sd('stemh') & 0xffff);
      const nx = nrm[i][0], ny = nrm[i][1];
      const s = nx * 0.7 + ny * 0.7 >= 0 ? 1 : -1;
      const w = Math.hypot(left[i][0] - C[i][0], left[i][1] - C[i][1]);
      const j = (L.h3(i, bi, 9) - 0.5) * 0.8;
      const a0 = [C[i][0] + nx * s * (1 + j), C[i][1] + ny * s * (1 + j)];
      const a1 = [C[i][0] + nx * s * (w - 1), C[i][1] + ny * s * (w - 1)];
      const tx = C[i + 1][0] - C[i - 1][0], ty = C[i + 1][1] - C[i - 1][1], tl = Math.hypot(tx, ty) || 1;
      hp.moveTo(a0[0], a0[1]);
      hp.quadraticCurveTo((a0[0] + a1[0]) / 2 + (tx / tl) * 2.5, (a0[1] + a1[1]) / 2 + (ty / tl) * 2.5, a1[0], a1[1]);
    }
    strokePath(ctx, hp, P.leafDeep, 0.65, 1.3);
    // a pale lit stripe on the other side
    const lit = [];
    for (let i = 0; i < n; i++) {
      const nx = nrm[i][0], ny = nrm[i][1];
      const s = nx * 0.7 + ny * 0.7 >= 0 ? -1 : 1;
      lit.push([C[i][0] + nx * s * 5, C[i][1] + ny * s * 5]);
    }
    const k = (extra && extra.key) || 'hero';
    const lw = extra && extra.ws ? 2.4 : 3;
    L.inkPath(ctx, lit, { width: 2.2 * (extra && extra.ws ? extra.ws : 1), color: P.white, alpha: 0.5, seed: sd('stemlit', k), taper: [20, 20], wobble: 0.4 });
    L.inkPath(ctx, left, { width: lw, color: P.ink, seed: sd('stemL', k), taper: [0, 4], wobble: 0.7 });
    L.inkPath(ctx, right, { width: lw, color: P.ink, seed: sd('stemR', k), taper: [0, 4], wobble: 0.7 });
  }

  // the seed in its parchment hull, inked: centre c, scale s, rotation rot (G1 exactly at (540, 900), 1, -15 deg)
  function drawBean(ctx, L, P, c, s, rot, key) {
    const B = BEAN_LOCAL;
    const out = xf(B.outline, c[0], c[1], s, rot);
    fillPoly(ctx, out, P.parchment);
    // tone: lower right of the dome
    const cr = Math.cos(-rot), sr = Math.sin(-rot);
    const tone = (x, y) => {
      const dx = (x - c[0]) / s, dy = (y - c[1]) / s;
      const lx = (dx * cr - dy * sr) / G1.a, ly = (dx * sr + dy * cr) / G1.b;
      // light from the upper left in frame space: rotate back
      const fx = lx * Math.cos(rot) - ly * Math.sin(rot), fy = lx * Math.sin(rot) + ly * Math.cos(rot);
      const rr = Math.hypot(lx, ly);
      return sstep(-0.2, 0.8, fx * 0.62 + fy * 0.78) * (1 - 0.4 * sstep(0.88, 1, rr));
    };
    const sp = Math.max(0.45, s);
    L.hatch(ctx, out, { angle: -Math.PI / 4, spacing: 8 * Math.max(0.7, sp), width: 1.6 * Math.max(0.75, sp), color: P.parchmentDeep, alpha: 0.95, length: [10 * sp + 4, 40 * sp + 6], seed: sd('bh1', key), density: (x, y) => clamp(tone(x, y) * 2.6) });
    L.hatch(ctx, out, { angle: -Math.PI / 4 + 0.05, spacing: 5 * Math.max(0.8, sp), width: 1.4 * Math.max(0.8, sp), color: P.parchmentDeep, alpha: 0.95, length: [8 * sp + 4, 26 * sp + 6], seed: sd('bh2', key), density: (x, y) => sstep(0.25, 0.65, tone(x, y)) });
    L.hatch(ctx, out, { angle: -Math.PI / 4 - Math.PI / 3, spacing: 7 * Math.max(0.8, sp), width: 1.2, color: P.inkSoft, alpha: 0.6, length: [6 * sp + 4, 20 * sp + 4], seed: sd('bh3', key), density: (x, y) => sstep(0.6, 0.95, tone(x, y)) });
    // papery fibres
    for (let i = 0; i < B.fibres.length; i += s < 0.6 ? 2 : 1) {
      L.inkPath(ctx, xf(B.fibres[i], c[0], c[1], s, rot), { width: 1.1 * Math.max(0.8, sp), color: P.parchmentDeep, alpha: 0.75, seed: sd('fib', i, key), taper: [10 * sp, 14 * sp], wobble: 0.4 });
    }
    // crease: a 12 px groove (beanGreenDeep through the hull) with the silverskin line inside
    const crease = xf(B.crease, c[0], c[1], s, rot);
    const groove = L.mix(P.beanGreenDeep, P.ink, 0.25);
    const n = crease.length;
    const tot = B.ccum[n - 1];
    ctx.save();
    ctx.lineCap = 'round';
    ctx.strokeStyle = groove;
    for (let i = 1; i < n; i++) {
      ctx.lineWidth = g1CreaseWidth(B.ccum[i] / tot) * s;
      ctx.beginPath();
      ctx.moveTo(crease[i - 1][0], crease[i - 1][1]);
      ctx.lineTo(crease[i][0], crease[i][1]);
      ctx.stroke();
    }
    ctx.restore();
    L.inkPath(ctx, xf(B.silver, c[0], c[1], s, rot), { width: Math.max(1.2, 3 * s), color: P.silverskin, alpha: 0.95, seed: sd('silv', key), taper: [10 * s, 10 * s], wobble: 0.3 });
    // inked lips of the groove: the shadow lip heavier
    L.inkPath(ctx, crease.map((p) => [p[0] - 6 * s * Math.cos(rot), p[1] - 6 * s * Math.sin(rot)]), { width: Math.max(1.2, 2.2 * s), color: P.ink, alpha: 0.9, seed: sd('lipL', key), taper: [20 * s, 20 * s], wobble: 0.5 });
    L.inkPath(ctx, crease.map((p) => [p[0] + 6 * s * Math.cos(rot), p[1] + 6 * s * Math.sin(rot)]), { width: Math.max(0.9, 1.4 * s), color: P.inkSoft, alpha: 0.8, seed: sd('lipR', key), taper: [20 * s, 20 * s], wobble: 0.5 });
    // a lit sheen on the upper left of the hull
    const sh = [];
    for (let i = 0; i <= 12; i++) {
      const a = (205 + (i / 12) * 50) * DEG;
      sh.push([Math.cos(a) * (G1.a - 34), Math.sin(a) * (G1.b - 40)]);
    }
    L.inkPath(ctx, xf(sh, c[0], c[1], s, rot), { width: Math.max(2, 6 * s), color: P.white, alpha: 0.75, seed: sd('bsh', key), taper: [14 * s, 18 * s], wobble: 0.4 });
    // outline: 5 px hero line at full size
    L.inkPath(ctx, out, { closed: true, width: Math.max(3, 5 * s), color: P.ink, seed: sd('bo', key), wobble: 1.2 * Math.max(0.5, s), double: s > 0.8 ? { alpha: 0.4, width: 0.3 } : false });
  }

  function drawHalf(ctx, L, P, pts, c, s, rot, key) {
    const out = xf(pts, c[0], c[1], s, rot);
    fillPoly(ctx, out, P.parchment);
    L.hatch(ctx, out, { angle: -Math.PI / 4, spacing: 4.5, width: 1.3, color: P.parchmentDeep, alpha: 0.95, length: [6, 18], seed: sd('hh', key), density: 0.55 });
    L.inkPath(ctx, out, { closed: true, width: 2.8, color: P.ink, seed: sd('ho', key), wobble: 0.6 });
  }

  // a round, kidney-shaped cotyledon in its own frame: the petiole end at (0, 0), the blade along +x
  const COTY = (() => {
    const pts = [];
    const n = 64;
    for (let i = 0; i < n; i++) {
      const a = (i / n) * TAU;
      // round blade 230 x 186 centred 128 px out; a notch where it meets the petiole
      let rx = 115, ry = 93;
      const notch = 22 * Math.exp(-Math.pow(((a - Math.PI + TAU) % TAU) - Math.PI, 2) / 0.09);
      const x = 128 + Math.cos(a) * rx + notch * -Math.cos(a) * 0 + (Math.cos(a) < 0 ? notch : 0);
      const y = Math.sin(a) * ry * (1 - 0.06 * Math.cos(a));
      pts.push([x, y]);
    }
    const mid = [[14, 0], [60, -1], [120, -3], [190, -2], [236, 0]];
    const veins = [];
    for (const [u, side] of [[60, -1], [60, 1], [110, -1], [110, 1], [160, -1], [160, 1]]) {
      veins.push([[u, side * 1], [u + 26, side * 34], [u + 52, side * 58]]);
    }
    return { pts, mid, veins };
  })();

  function cotyXf(pts, node, ang, ls, ws) {
    const c = Math.cos(ang), s = Math.sin(ang);
    return pts.map((p) => [node[0] + (p[0] * ls) * c - (p[1] * ws) * s, node[1] + (p[0] * ls) * s + (p[1] * ws) * c]);
  }

  function drawCotyledon(ctx, L, P, node, ang, ls, ws, key, mirror) {
    const blade = cotyXf(COTY.pts.map((p) => [p[0], mirror ? -p[1] : p[1]]), node, ang, ls, ws);
    // petiole
    const pe = cotyXf([[0, 0], [16, 0]], node, ang, ls, ws);
    L.inkPath(ctx, pe, { width: 9, color: P.ink, seed: sd('cpe0', key), taper: [0, 0], swell: 0 });
    L.inkPath(ctx, pe, { width: 5, color: P.leafLight, seed: sd('cpe', key), taper: [0, 0], swell: 0 });
    fillPoly(ctx, blade, P.leafLight);
    // shade on the lower right of the blade
    let cx = 0, cy = 0;
    for (const p of blade) {
      cx += p[0];
      cy += p[1];
    }
    cx /= blade.length;
    cy /= blade.length;
    const R = 115 * Math.max(ls, ws);
    L.hatch(ctx, blade, { angle: -Math.PI / 4, spacing: 7, width: 1.5, color: P.leafDeep, alpha: 0.85, length: [10, 28], seed: sd('ch', key), density: (x, y) => sstep(-0.15, 0.75, ((x - cx) * 0.62 + (y - cy) * 0.78) / R) });
    L.hatch(ctx, blade, { angle: -Math.PI / 4 - Math.PI / 3, spacing: 7, width: 1.2, color: P.leafDeep, alpha: 0.7, length: [8, 20], seed: sd('ch2', key), density: (x, y) => sstep(0.45, 0.95, ((x - cx) * 0.62 + (y - cy) * 0.78) / R) });
    L.stipple(ctx, blade, { spacing: 12, r: [1, 1.4], color: P.leafDeep, alpha: 0.4, seed: sd('cst', key), density: 0.5 });
    // veins: the midline in leafDeep, faint side veins
    for (let k = 0; k < COTY.veins.length; k++) {
      L.inkPath(ctx, cotyXf(COTY.veins[k].map((p) => [p[0], mirror ? -p[1] : p[1]]), node, ang, ls, ws), { width: 1.3, color: P.leafDeep, alpha: 0.6, seed: sd('cv', key, k), taper: [2, 8], wobble: 0.3 });
    }
    L.inkPath(ctx, cotyXf(COTY.mid, node, ang, ls, ws), { width: 2, color: P.leafDeep, seed: sd('cm', key), taper: [3, 30], wobble: 0.4 });
    // gloss on the upper-left lobe
    const gl = cotyXf([[80, -54], [120, -66], [170, -60]].map((p) => [p[0], mirror ? -p[1] : p[1]]), node, ang, ls, ws);
    L.inkPath(ctx, gl, { width: 3, color: P.leafSheen, alpha: 0.85, seed: sd('cg', key), taper: [6, 8], wobble: 0.3 });
    L.inkPath(ctx, blade, { closed: true, width: 3, color: P.ink, seed: sd('co', key), wobble: 0.9 });
  }

  // ---------------------------------------------------------------------------
  // the static plate: construction lines and the soil cutaway. Nothing in it moves, so it is drawn once
  // per boil phase (a three-drawing boil cycle, still re-wobbling every 1/12 s) and reused.
  // ---------------------------------------------------------------------------

  function boilLib(b) {
    const o = {};
    for (const k of Object.keys(LIB)) o[k] = LIB[k];
    const pin = (fn) => (ctx, a, opts) => fn(ctx, a, Object.assign({}, opts, { boil: b }));
    o.inkPath = pin(LIB.inkPath);
    o.hatch = pin(LIB.hatch);
    o.crossHatch = pin(LIB.crossHatch);
    o.stipple = pin(LIB.stipple);
    return o;
  }

  function drawPlate(ctx, L, P, g, bi) {
    // ---- 2 construction lines ---------------------------------------------------------
    {
      const cons = { width: 1.5, color: P.inkFaint, alpha: 0.3, taper: [0, 0], wobble: 1.5, smooth: false, step: 8 };
      L.inkPath(ctx, [[540, -40], [540, SURF]], Object.assign({ seed: sd('axis') }, cons));
      L.inkPath(ctx, [[60, 700], [1020, 700]], Object.assign({ seed: sd('h700') }, cons));
      L.inkPath(ctx, [[60, 900], [1020, 900]], Object.assign({ seed: sd('h900'), alpha: 0.18 }, cons));
      L.guideCircle(ctx, 540, 700, 330, { color: P.inkFaint, alpha: 0.22, width: 1.5, dash: [3, 8] });
      // a height scale on the left, surface up to the soldier height
      const sc = new Path2D();
      sc.moveTo(70, SURF);
      sc.lineTo(70, 640);
      for (let k = 0; k <= 27; k++) {
        const y = SURF - k * 20;
        if (y < 640) break;
        sc.moveTo(70, y);
        sc.lineTo(70 + (k % 5 === 0 ? 22 : 10), y);
      }
      strokePath(ctx, sc, P.inkFaint, 0.5, 1.5);
      const marks = new Path2D();
      for (const [x, y] of [[540, 700], [540, 900], [540, 1350], [420, 640], [660, 640], [540, 1800]]) {
        marks.moveTo(x - 9, y);
        marks.lineTo(x + 9, y);
        marks.moveTo(x, y - 9);
        marks.lineTo(x, y + 9);
      }
      strokePath(ctx, marks, P.inkFaint, 0.5, 1.5);
    }

    // ---- 3 soil -------------------------------------------------------------------------
    drawSoil(ctx, L, P, g, bi);
  }

  function plate(P, g, b) {
    const S = FILM.S || 1;
    return LIB.cached(['seedling-plate', b, S].join('|'), () => {
      const w = Math.round(1080 * S), h = Math.round(1920 * S);
      let c;
      if (FILM.makeCanvas) c = FILM.makeCanvas(w, h);
      else {
        c = document.createElement('canvas');
        c.width = w;
        c.height = h;
      }
      const x = c.getContext('2d');
      x.scale(w / 1080, h / 1920);
      drawPlate(x, boilLib(b), P, g, b);
      return c;
    });
  }

  // ---------------------------------------------------------------------------
  // the seedbed: two neighbours at other stages (left just hooked through, right a week older),
  // so the row reads as a nursery and the tall frame stays dense
  // ---------------------------------------------------------------------------

  function drawNeighbours(ctx, L, P, tw, bi) {
    const sw = Math.sin(Math.floor(tw * 12) * 1.7) * 1.2; // a small sway, on twos
    // left: the hook has just broken the surface, the seed still hangs in the soil
    {
      const j = [196, 1290];
      const root = LIB.smoothPts([j, [192, 1380], [201, 1470], [196, 1560]], false, 5);
      L.inkPath(ctx, root, { width: 8, color: P.ink, seed: sd('nr0'), taper: [0, 40], swell: 0, pressure: (u) => lerp(1, 0.3, u), wobble: 0.5 });
      L.inkPath(ctx, root, { width: 4.5, color: L.mix(P.flowerWhite, P.tan, 0.35), seed: sd('nr1'), taper: [0, 40], swell: 0, pressure: (u) => lerp(1, 0.25, u), wobble: 0.5 });
      const R = 24, top = 1172 + sw;
      const pts = [j, [196, top + R]];
      for (let i = 1; i <= 10; i++) {
        const a = (Math.PI * i) / 10;
        pts.push([196 + R - R * Math.cos(a), top + R - R * Math.sin(a)]);
      }
      pts.push([196 + 2 * R, top + R + 14]);
      drawStem(ctx, L, P, pts, bi, { ws: 0.6, key: 'nl' });
      drawBean(ctx, L, P, [196 + 2 * R + 2, top + R + 14 + 48], 0.2, 172 * DEG, 'nlseed');
    }
    // right: an older seedling, cotyledons flat and the first true leaves out
    {
      const j = [890, 1300];
      const root = LIB.smoothPts([j, [896, 1400], [884, 1520], [890, 1650]], false, 5);
      L.inkPath(ctx, root, { width: 9, color: P.ink, seed: sd('rr0'), taper: [0, 40], swell: 0, pressure: (u) => lerp(1, 0.3, u), wobble: 0.5 });
      L.inkPath(ctx, root, { width: 5, color: L.mix(P.flowerWhite, P.tan, 0.35), seed: sd('rr1'), taper: [0, 40], swell: 0, pressure: (u) => lerp(1, 0.25, u), wobble: 0.5 });
      for (const [u, side, l] of [[0.35, -1, 46], [0.55, 1, 56], [0.75, -1, 40]]) {
        const p = root[Math.floor(u * (root.length - 1))];
        L.inkPath(ctx, [p, [p[0] + side * l * 0.5, p[1] + l * 0.25], [p[0] + side * l, p[1] + l * 0.55]], { width: 2.2, color: P.ink, seed: sd('rrl', u), taper: [0, 12], swell: 0, wobble: 0.3 });
      }
      const node = [886 + sw, 930];
      drawStem(ctx, L, P, [j, [889, 1150], [887 + sw * 0.5, 1020], node], bi, { ws: 0.62, key: 'nr' });
      drawCotyledon(ctx, L, P, node, (180 + 18) * DEG, 0.5, 0.5, 'ncl', true);
      drawCotyledon(ctx, L, P, node, -18 * DEG, 0.5, 0.5, 'ncr', false);
      // true leaves: a pointed pair rising between the cotyledons
      for (const s of [-1, 1]) {
        const a = (-90 + s * 26) * DEG + sw * 0.01;
        const len = 104;
        const tip = [node[0] + Math.cos(a) * len, node[1] + Math.sin(a) * len];
        const nx = -Math.sin(a), ny = Math.cos(a);
        const m1 = [lerp(node[0], tip[0], 0.42), lerp(node[1], tip[1], 0.42)];
        const lf = LIB.smoothPts([node, [m1[0] + nx * 22, m1[1] + ny * 22], tip, [m1[0] - nx * 22, m1[1] - ny * 22]], true, 3);
        fillPoly(ctx, lf, P.leafCoffee);
        L.hatch(ctx, lf, { angle: -Math.PI / 4, spacing: 5, width: 1.2, color: P.leafDeep, alpha: 0.9, length: [6, 16], seed: sd('ntl', s), density: s > 0 ? 0.8 : 0.35 });
        L.inkPath(ctx, [node, m1, tip], { width: 1.4, color: P.leafSheen, alpha: 0.8, seed: sd('ntlm', s), taper: [2, 10], wobble: 0.3 });
        L.inkPath(ctx, lf, { closed: true, width: 2.2, color: P.ink, seed: sd('ntlo', s), wobble: 0.4 });
      }
    }
  }

  // ---------------------------------------------------------------------------
  // scene
  // ---------------------------------------------------------------------------

  FILM.scene({
    id: ID,
    draw(ctx, tIn, info) {
      const L = info.lib, P = L.pal, E = L.ease;
      const dur = info.dur;
      let t = clamp(tIn, 0, dur);
      const tFrame = Math.round(t * 24) / 24;
      if (Math.abs(t - tFrame) < 1e-4) t = tFrame + 1e-7;
      const tw = L.onTwos(t);
      const bi = L.boil(info.T);
      const g = geo();

      const drawing = (a) => Math.floor((t - a) * 12 + 1e-6);
      const hit = (a, frames, e, lead = 1) => {
        if (t < a) return 0;
        const u = clamp((t - a) / (frames * FR) + lead / frames);
        return e ? e(u) : u;
      };
      const popTwos = (a) => (t < a ? 0 : [0.72, 1.08, 1][Math.min(2, drawing(a))]);

      const ps = pose(tw, E);
      const split = t >= B_SPLIT;

      // ---- 1 stripes -----------------------------------------------------------------
      L.stripes(ctx, { colors: [P.stripeCream, P.stripeSpring], width: 140, angle: -0.52, offset: 8 * info.T, seed: sd('stripes') });

      // ---- 2 and 3 the static plate: construction lines, soil cutaway ------------------------
      ctx.drawImage(plate(P, g, ((bi % 3) + 3) % 3), 0, 0, 1080, 1920);

      // ---- 3b the neighbours in the seedbed ---------------------------------------------------
      drawNeighbours(ctx, L, P, tw, bi);

      // ---- 4 root -------------------------------------------------------------------------
      const kRoot = hit(B_ROOT, 9, E.outExpo);
      if (kRoot > 0) {
        const rpts = slicePts(g.rootS, kRoot);
        L.inkPath(ctx, rpts, { width: 13, color: P.ink, seed: sd('root0'), taper: [0, 50], swell: 0, pressure: (u) => lerp(1, 0.3, u), wobble: 0.6 });
        L.inkPath(ctx, rpts, { width: 7.5, color: L.mix(P.flowerWhite, P.tan, 0.35), seed: sd('root1'), taper: [0, 50], swell: 0, pressure: (u) => lerp(1, 0.25, u), wobble: 0.6 });
        for (let i = 0; i < g.hairs.length; i++) {
          const h = g.hairs[i];
          const a = clamp((kRoot - h.u) / 0.08);
          if (a <= 0) continue;
          L.inkPath(ctx, slicePts(h.pts, a), { width: 1.6, color: P.white, alpha: 0.9, seed: sd('hair', i), taper: [1, 6], swell: 0, wobble: 0.3 });
        }
        // laterals branch off once the stem is rising
        const kLat = hit(B_RISE + 4 * FR, 12, E.outCubic);
        if (kLat > 0) {
          for (let i = 0; i < g.laterals.length; i++) {
            const la = clamp(kLat * 1.4 - i * 0.2);
            if (la <= 0) continue;
            L.inkPath(ctx, slicePts(g.laterals[i].pts, la), { width: 3.2, color: P.ink, seed: sd('lat', i), taper: [0, 20], swell: 0, pressure: (u) => lerp(1, 0.4, u), wobble: 0.4 });
          }
        }
      }

      // ---- 5 stem ------------------------------------------------------------------------
      let node = null;
      if (ps.stem) {
        const pts = ps.stem.pts.slice();
        if (split) {
          // with the parchment gone the stem shows up to the cotyledon node
          const e = ps.end;
          node = [e[0] + Math.cos(ps.hd) * 90, e[1] + Math.sin(ps.hd) * 90];
          pts.push([e[0] + Math.cos(ps.hd) * 45, e[1] + Math.sin(ps.hd) * 45], node);
        }
        drawStem(ctx, L, P, pts, bi);
        // a little mound of broken crust where the stem comes through
        if (tw >= B_RISE) {
          const sx = J[0];
          const mound = [];
          for (let k = 0; k <= 12; k++) {
            const u = k / 12;
            const x = sx - 70 + u * 140;
            mound.push([x, SURF - 10 * Math.sin(Math.PI * u) * (Math.abs(x - sx) > 14 ? 1 : 0.3)]);
          }
          L.inkPath(ctx, mound.slice(0, 5), { width: 2.4, color: P.ink, seed: sd('mL'), taper: [4, 2], wobble: 0.6 });
          L.inkPath(ctx, mound.slice(8), { width: 2.4, color: P.ink, seed: sd('mR'), taper: [2, 4], wobble: 0.6 });
          const cr = new Path2D();
          for (const [x, y, r] of [[sx - 44, SURF - 9, 4], [sx + 40, SURF - 10, 5], [sx - 26, SURF - 16, 3], [sx + 58, SURF - 6, 3]]) {
            cr.moveTo(x + r, y);
            cr.arc(x, y, r, 0, TAU);
          }
          ctx.fillStyle = P.soil;
          ctx.fill(cr);
          strokePath(ctx, cr, P.ink, 0.8, 1.2);
        }
      }

      // ---- 6 the seed --------------------------------------------------------------------------
      if (!split) {
        drawBean(ctx, L, P, ps.c, ps.s, ps.rot, 'seed');
      } else {
        const kOpen = popTwos(B_OPEN);
        const swayK = t >= B_OPEN ? drawing(B_OPEN) : 0;
        const sway = t >= B_OPEN + 3 * FR ? 2 * DEG * Math.sin(swayK * 1.3) : 0;
        // cotyledons: closed (folded up) until T 5.625, then they open flat
        const flatR = Math.atan2(640 - node[1], 660 - node[0]);
        const flatL = Math.atan2(640 - node[1], 420 - node[0]);
        const closedR = -84 * DEG, closedL = -96 * DEG;
        const ls = lerp(0.52, 1, kOpen), ws = lerp(0.42, 1, kOpen);
        const dR = Math.hypot(660 - node[0], 640 - node[1]) / 128;
        const dL = Math.hypot(420 - node[0], 640 - node[1]) / 128;
        // first true-leaf pair, tiny, between the cotyledons
        if (kOpen > 0) {
          const kt = clamp(hit(B_OPEN + 2 * FR, 8, E.outCubic));
          for (const s of [-1, 1]) {
            const a = (-90 + s * 28) * DEG;
            const len = 40 * kt;
            if (len < 2) continue;
            const base = node;
            const tip = [base[0] + Math.cos(a) * len, base[1] + Math.sin(a) * len];
            const nx = -Math.sin(a), ny = Math.cos(a);
            const lf = [base, [lerp(base[0], tip[0], 0.45) + nx * 10 * kt, lerp(base[1], tip[1], 0.45) + ny * 10 * kt], tip, [lerp(base[0], tip[0], 0.45) - nx * 10 * kt, lerp(base[1], tip[1], 0.45) - ny * 10 * kt]];
            L.inkPath(ctx, LIB.smoothPts(lf, true, 3), { closed: true, width: 2, color: P.ink, fill: P.leafCoffee, seed: sd('tl', s), wobble: 0.3 });
          }
        }
        drawCotyledon(ctx, L, P, node, lerp(closedL, flatL, kOpen) - sway, ls * dL, ws, 'cl', true);
        drawCotyledon(ctx, L, P, node, lerp(closedR, flatR, kOpen) + sway, ls * dR, ws, 'cr', false);
        // the parchment halves crack apart along the crease and tumble off to the right
        const uF = E.inQuad(clamp((tw - B_SPLIT) / (9 * FR)));
        const c0 = ps.c;
        const halves = [
          { pts: BEAN_LOCAL.left, key: 'hl', dx: 130, dy: 1162 - c0[1], rot: 105 * DEG, kick: -10 },
          { pts: BEAN_LOCAL.right, key: 'hr', dx: 215, dy: 1164 - c0[1], rot: -75 * DEG, kick: 12 },
        ];
        for (const h of halves) {
          const ux = E.outQuad(clamp((tw - B_SPLIT) / (9 * FR)));
          const cx = c0[0] + h.kick * (1 - ux) * (tw > B_SPLIT ? 1 : 0) + h.dx * ux;
          const cy = c0[1] + h.dy * uF;
          drawHalf(ctx, L, P, h.pts, [cx, cy], S_SEED, ps.rot + h.rot * ux, h.key);
        }
        // crack ticks on the split drawing
        if (drawing(B_SPLIT) < 2) {
          const ck = new Path2D();
          for (let k = 0; k < 6; k++) {
            const a = (k / 6) * TAU + 0.3;
            ck.moveTo(c0[0] + Math.cos(a) * 70, c0[1] + Math.sin(a) * 80);
            ck.lineTo(c0[0] + Math.cos(a) * 100, c0[1] + Math.sin(a) * 112);
          }
          strokePath(ctx, ck, P.ink, 1, 2.4);
        }
      }

      // ---- 7 overlays ---------------------------------------------------------------------------
      // the drop: a dashed annBlue line from G1 down to the burial point while the seed falls
      {
        const kD = hit(B_FALL, 9, E.outExpo);
        const fade = 1 - clamp((t - B_ROOT) / (9 * FR));
        if (fade > 0) {
          const p = new Path2D();
          p.moveTo(540, 900);
          p.lineTo(540, lerp(900, 1350, kD));
          strokePath(ctx, p, P.annBlue, fade, 2.5, [14, 10]);
          if (kD >= 1) {
            const ar = new Path2D();
            ar.moveTo(526, 1328);
            ar.lineTo(540, 1350);
            ar.lineTo(554, 1328);
            strokePath(ctx, ar, P.annBlue, fade, 2.5);
          }
        }
      }
      // the lift: a dashed annBlue trajectory of the seed's centre, drawing on behind it
      if (tw >= B_RISE) {
        const trail = [];
        const f0 = Math.round(B_RISE * 24), f1 = Math.round(Math.min(t, B_SPLIT) * 24);
        for (let f = f0; f <= f1; f += 2) trail.push(pose(L.onTwos(f / 24 + 1e-6), E).c);
        if (t < B_SPLIT) trail.push(ps.c);
        if (trail.length > 1) {
          const tp = new Path2D();
          trace(tp, LIB.smoothPts(trail, false, 6), false);
          strokePath(ctx, tp, P.annBlue, 0.9, 2.5, [14, 10]);
          const o = trail[0];
          ctx.beginPath();
          ctx.arc(o[0], o[1], 5, 0, TAU);
          ctx.fillStyle = P.annBlue;
          ctx.fill();
        }
      }
      // annMagenta change ring at the parchment split
      if (split) {
        const f = (t - B_SPLIT) / FR;
        if (f < 12) {
          const u = hit(B_SPLIT, 10, E.outExpo);
          const r = lerp(50, 230, u);
          const ring = new Path2D();
          ring.arc(ps.c[0], ps.c[1], r, 0, TAU);
          const a = 1 - clamp((f - 2) / 10);
          strokePath(ctx, ring, P.ink, 0.25 * a, 6);
          strokePath(ctx, ring, P.annMagenta, a, 3);
        }
      }
      // annYellow arc annotation across the cotyledon span, radius 260 around (540, 700)
      const kArc = hit(B_OPEN, 6, E.outExpo);
      if (kArc > 0) {
        L.arcAnnotation(ctx, 540, 700, 260, 200 * DEG, 340 * DEG, { color: P.ink, alpha: 0.22, width: 5, p: kArc, endTicks: 0 });
        L.arcAnnotation(ctx, 540, 700, 260, 200 * DEG, 340 * DEG, { color: P.annYellow, width: 2.5, p: kArc, endTicks: 10, dot: 4 });
      }
    },
  });
})();

</script>
<script>
// ---- src/scenes/04-blossom.js
// 04 blossom : Five-pointed white stars. Illustrated, global T 6.00 to 8.25 (t 0 to 2.25).
// A mature lateral coffee branch runs diagonally from lower left (-40, 1250) to upper right (1120, 760).
// Three leaf nodes (x 260, 560, 860) each carry an opposite pair of glossy wavy leaves and a tight
// axillary cluster of white five-petalled flowers hugging the branch (5, 8, 6 flowers plus closed buds).
// The clusters burst open on T 6.00, 6.75 and 7.50; a honeybee loops in from the left and lands on the
// hero cluster on T 7.50; on T 7.875 the first petals of cluster 1 begin to fall.
//
// Layers, back to front:
//   1. stripes (stripeCream / stripeSpring), screen-fixed, drifting 6 px per beat
//   2. (camera push 1.00 to 1.04 about (560, 1010))
//   3. background branch low in the frame (scenery), its leaves and closed bud clusters
//   4. leaves of the three nodes (opposite pairs), petioles
//   5. back flowers and buds of each cluster (behind the branch)
//   6. the hero branch: bark fill, lengthwise hatching, lenticels, node swellings
//   7. front flowers and buds of each cluster
//   8. falling petals, the bee
//   9. overlays: annBlue dashed flight path, annYellow cluster rings, annMagenta landing ring
//  10. screen-fixed tally of three annYellow dots (x 120 to 200, y 300)
(function () {
  'use strict';

  const ID = 'blossom';
  const LIB = FILM.lib;
  const TAU = Math.PI * 2;
  const DEG = Math.PI / 180;
  const FR = 1 / 24;

  const lerp = (a, b, t) => a + (b - a) * t;
  const clamp = (v, lo = 0, hi = 1) => (v < lo ? lo : v > hi ? hi : v);
  const sstep = (a, b, x) => {
    const t = clamp((x - a) / (b - a));
    return t * t * (3 - 2 * t);
  };
  const sd = (...k) => LIB.hash(ID, ...k) & 0x7fffffff;

  // While the cached static layer is drawn, BOIL pins every line to one of four boil drawings
  // (a 4-drawing boil cycle), so each cached layer is the same whichever frame builds it.
  let BOIL = null;
  const bo = (o) => (BOIL == null ? o : Object.assign({}, o, { boil: BOIL }));
  const ink = (ctx, pts, o) => LIB.inkPath(ctx, pts, bo(o));
  const hatchB = (ctx, clip, o) => LIB.hatch(ctx, clip, bo(o));
  const stippleB = (ctx, clip, o) => LIB.stipple(ctx, clip, bo(o));

  // beats (shot-local seconds; global T in comments)
  const B_C1 = 0; // T 6.00 cluster 1 opens (the cut)
  const B_C2 = 0.75; // T 6.75 cluster 2 (hero)
  const B_C3 = 1.5; // T 7.50 cluster 3, bee lands
  const B_BEE0 = 0.375; // T 6.375 bee enters
  const B_FALL = 1.875; // T 7.875 petals fall
  const OPEN_AT = [B_C1, B_C2, B_C3];

  // hoisted colours (pal is a read-only proxy)
  const P0 = LIB.pal;
  const C = {
    ink: P0.ink, inkSoft: P0.inkSoft, inkFaint: P0.inkFaint,
    leaf: P0.leafCoffee, leafDeep: P0.leafDeep, leafLight: P0.leafLight, leafSheen: P0.leafSheen,
    bark: P0.bark, barkDeep: P0.barkDeep,
    petal: P0.flowerWhite, petalShade: P0.flowerShade, anther: P0.anther,
    petalHatch: LIB.mix(P0.flowerShade, P0.inkSoft, 0.38),
    white: P0.white, ochre: P0.ochre, tan: P0.tan,
    annYellow: P0.annYellow, annBlue: P0.annBlue, annMagenta: P0.annMagenta,
    leafInk: LIB.mix(P0.leafDeep, P0.ink, 0.45),
    barkLight: LIB.mix(P0.bark, P0.tan, 0.45),
    sheenWhite: LIB.mix(P0.leafSheen, P0.white, 0.55),
  };

  function trace(ctx, pts, closed = true) {
    for (let i = 0; i < pts.length; i++) {
      if (i === 0) ctx.moveTo(pts[i][0], pts[i][1]);
      else ctx.lineTo(pts[i][0], pts[i][1]);
    }
    if (closed) ctx.closePath();
  }
  function pathOf(pts, closed = true) {
    const p = new Path2D();
    trace(p, pts, closed);
    return p;
  }
  function fillPoly(ctx, pts, color, alpha = 1) {
    ctx.save();
    ctx.globalAlpha *= alpha;
    ctx.fillStyle = color;
    ctx.beginPath();
    trace(ctx, pts, true);
    ctx.fill();
    ctx.restore();
  }
  function strokeP(ctx, p, color, alpha, width, dash) {
    ctx.save();
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.strokeStyle = color;
    ctx.globalAlpha *= alpha;
    ctx.lineWidth = width;
    if (dash) ctx.setLineDash(dash);
    ctx.stroke(p);
    ctx.restore();
  }
  function bboxOf(pts, pad = 4) {
    let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
    for (const p of pts) {
      if (p[0] < x0) x0 = p[0];
      if (p[1] < y0) y0 = p[1];
      if (p[0] > x1) x1 = p[0];
      if (p[1] > y1) y1 = p[1];
    }
    return { x: x0 - pad, y: y0 - pad, w: x1 - x0 + 2 * pad, h: y1 - y0 + 2 * pad };
  }
  function polyLen(pts) {
    let s = 0;
    for (let i = 1; i < pts.length; i++) s += Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]);
    return s;
  }
  function atFrac(pts, u) {
    const total = polyLen(pts);
    let want = clamp(u) * total;
    for (let i = 1; i < pts.length; i++) {
      const l = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]);
      if (want <= l || i === pts.length - 1) {
        const f = l ? clamp(want / l) : 0;
        return [lerp(pts[i - 1][0], pts[i][0], f), lerp(pts[i - 1][1], pts[i][1], f), i];
      }
      want -= l;
    }
    const e = pts[pts.length - 1];
    return [e[0], e[1], pts.length - 1];
  }

  // ---------------------------------------------------------------------------
  // Coffee leaf: elliptic, about 2 : 1, drawn-out tip, wavy margin (5 undulations a side),
  // 9 pairs of looping lateral veins, a pale gloss streak beside the midrib on the lit side.
  // ---------------------------------------------------------------------------
  function leafGeom(bx, by, ang, len, width, key, bend) {
    const ux = Math.cos(ang), uy = Math.sin(ang);
    const nx = -uy, ny = ux;
    const pet = 34, blade = len - pet;
    const ph = LIB.h3(sd('leafph', key), 1, 2) * TAU;
    const at = (u, v) => {
      const b = bend * 4 * u * (1 - u);
      return [bx + ux * (pet + u * blade) + nx * (v + b), by + uy * (pet + u * blade) + ny * (v + b)];
    };
    const hw = (u) => {
      u = clamp(u);
      const s = Math.pow(Math.sin(Math.PI * Math.pow(u, 0.9)), 0.78) * (1 - 0.32 * sstep(0.7, 1, u));
      return (width / 2) * s;
    };
    const wave = (u, side) => 1 + 0.055 * Math.sin(TAU * 5 * u + ph + (side > 0 ? 0 : 1.9)) * sstep(0.05, 0.22, u) * (1 - sstep(0.86, 0.99, u));
    const N = 64;
    const upper = [], lower = [], mid = [];
    for (let i = 0; i <= N; i++) {
      const u = i / N;
      upper.push(at(u, hw(u) * wave(u, 1)));
      lower.push(at(u, -hw(u) * 0.94 * wave(u, -1)));
      mid.push(at(u, 0));
    }
    const outline = upper.concat(lower.slice(1, N).reverse());
    const halfA = upper.concat(mid.slice(1, N).reverse());
    const halfB = lower.concat(mid.slice(1, N).reverse());
    // the side whose normal points up-left faces the light
    const litSide = nx + ny < 0 ? 1 : -1;
    const r = LIB.rng(sd('leafv', key));
    const veins = [];
    for (let k = 0; k < 9; k++) {
      const u0 = 0.07 + k * 0.088 + r.range(-0.01, 0.01);
      for (const s of [1, -1]) {
        const k2 = s > 0 ? 1 : 0.94;
        const pts = [at(u0, 0)];
        const steps = [[0.05, 0.42], [0.12, 0.76], [0.2, 0.84], [0.27, 0.8]];
        for (const [du, f] of steps) {
          const u = Math.min(0.975, u0 + du);
          pts.push(at(u, s * hw(u) * f * k2));
        }
        veins.push({ s, u0, pts });
      }
    }
    const veinAng = (s) => {
      const a = at(0.42, 0), b = at(0.42 + 0.12, s * hw(0.54) * 0.76);
      return Math.atan2(b[1] - a[1], b[0] - a[0]);
    };
    const gloss = [];
    {
      const fw = [], bw = [];
      for (let i = 0; i <= 30; i++) {
        const u = 0.1 + (i / 30) * 0.74;
        const w = Math.sin((Math.PI * (u - 0.1)) / 0.74);
        fw.push(at(u, litSide * hw(u) * 0.07));
        bw.push(at(u, litSide * hw(u) * (0.08 + 0.3 * Math.pow(w, 0.8))));
      }
      gloss.push(...fw, ...bw.reverse());
    }
    const uvOf = (x, y) => {
      const dx = x - bx, dy = y - by;
      const u = (dx * ux + dy * uy - pet) / blade;
      const uc = clamp(u);
      const v = dx * nx + dy * ny - bend * 4 * uc * (1 - uc);
      return [u, v / Math.max(6, hw(uc))];
    };
    return {
      outline, halfA, halfB, mid, veins, gloss, litSide, key, uvOf, at, hw,
      stalk: [[bx, by], at(0, 0)], angA: veinAng(1), angB: veinAng(-1), bounds: bboxOf(outline, 8),
    };
  }

  function drawLeaf(ctx, Lf, o = {}) {
    const L = LIB;
    const k = Lf.key;
    const wScale = o.thin ? 0.8 : 1;
    // petiole
    ink(ctx, Lf.stalk, { width: 13 * wScale, color: C.ink, seed: sd('pet0', k), taper: [0, 5], swell: 0, wobble: 0.4 });
    ink(ctx, Lf.stalk, { width: 7 * wScale, color: C.leafLight, seed: sd('pet', k), taper: [0, 4], swell: 0, wobble: 0.4 });
    ink(ctx, Lf.outline, { closed: true, width: 3 * wScale, fill: C.leaf, seed: sd('leafline', k), wobble: 1.2 });
    const shadowHalf = Lf.litSide > 0 ? Lf.halfB : Lf.halfA;
    const litHalf = Lf.litSide > 0 ? Lf.halfA : Lf.halfB;
    const angShadow = Lf.litSide > 0 ? Lf.angB : Lf.angA;
    const angLit = Lf.litSide > 0 ? Lf.angA : Lf.angB;
    const B = Lf.bounds;
    // shadow half: hatch parallel to the side veins, darker toward the margin and tip
    hatchB(ctx, shadowHalf, {
      angle: angShadow, spacing: 5.5, width: 1.6, color: C.leafDeep, alpha: 0.9, length: [12, 34], bounds: B, seed: sd('lh', k),
      density: (x, y) => {
        const q = Lf.uvOf(x, y);
        return 0.5 + 0.5 * sstep(0.1, 0.75, Math.abs(q[1]));
      },
    });
    hatchB(ctx, shadowHalf, {
      angle: angShadow + 1.05, spacing: 7, width: 1.3, color: C.ink, alpha: 0.42, length: [10, 26], bounds: B, seed: sd('lh2', k),
      density: (x, y) => {
        const q = Lf.uvOf(x, y);
        return 0.95 * sstep(0.45, 0.95, Math.abs(q[1])) * (0.4 + 0.6 * sstep(0.3, 0.9, q[0]));
      },
    });
    // lit half: only a light shade near the margin and in the base
    hatchB(ctx, litHalf, {
      angle: angLit, spacing: 9, width: 1.3, color: C.leafDeep, alpha: 0.8, length: [10, 24], bounds: B, seed: sd('uh', k),
      density: (x, y) => {
        const q = Lf.uvOf(x, y);
        return 0.75 * sstep(0.72, 1.0, Math.abs(q[1])) + 0.6 * (1 - sstep(0.02, 0.16, q[0]));
      },
    });
    // gloss streak along the midrib on the lit side, with a few bright flicks
    fillPoly(ctx, Lf.gloss, C.leafSheen, 0.8);
    const flick = new Path2D();
    for (let i = 0; i < 5; i++) {
      const u0 = 0.2 + i * 0.12;
      const a = Lf.at(u0, Lf.litSide * Lf.hw(u0) * 0.16), b = Lf.at(u0 + 0.06, Lf.litSide * Lf.hw(u0 + 0.06) * 0.2);
      flick.moveTo(a[0], a[1]);
      flick.lineTo(b[0], b[1]);
    }
    strokeP(ctx, flick, C.sheenWhite, 0.9, 2.2);
    // sunken lateral veins and the midrib
    for (let i = 0; i < Lf.veins.length; i++) {
      ink(ctx, Lf.veins[i].pts, { width: 1.8, color: C.leafDeep, alpha: 0.95, seed: sd('lv', k, i), taper: [3, 14], wobble: 0.5, step: 3 });
    }
    ink(ctx, Lf.mid, { width: 4 * wScale, color: C.leafLight, seed: sd('mid', k), taper: [2, 70], wobble: 0.6 });
    ink(ctx, Lf.mid, { width: 1.2, color: C.leafInk, alpha: 0.6, seed: sd('mid2', k), taper: [10, 90], wobble: 0.6 });
  }

  // ---------------------------------------------------------------------------
  // Branch geometry
  // ---------------------------------------------------------------------------
  const BR = { x0: -40, y0: 1250, x1: 1120, y1: 760, half: 17 };
  const BDX = BR.x1 - BR.x0, BDY = BR.y1 - BR.y0;
  const BLEN = Math.hypot(BDX, BDY);
  const UX = BDX / BLEN, UY = BDY / BLEN; // along the branch, toward the upper right
  const NUX = UY, NUY = -UX; // normal pointing up-left (above the branch)
  const BANG = Math.atan2(BDY, BDX);
  const branchY = (x) => BR.y0 + (BDY * (x - BR.x0)) / BDX;
  const NODES = [260, 560, 860].map((x) => [x, branchY(x)]);
  // a 3 px sag in the middle of the branch keeps it from looking ruled
  const sag = (s) => 6 * Math.sin(Math.PI * s);

  function branchPts(x0, y0, x1, y1, half, sagAmp, n = 40) {
    const dx = x1 - x0, dy = y1 - y0, l = Math.hypot(dx, dy);
    const ux = dx / l, uy = dy / l, nx = uy, ny = -ux;
    const top = [], bot = [], mid = [];
    for (let i = 0; i <= n; i++) {
      const s = i / n;
      const g = sagAmp * Math.sin(Math.PI * s);
      const cx = x0 + dx * s - nx * g, cy = y0 + dy * s - ny * g;
      const h = half * (1 - 0.12 * s);
      mid.push([cx, cy]);
      top.push([cx + nx * h, cy + ny * h]);
      bot.push([cx - nx * h, cy - ny * h]);
    }
    return { top, bot, mid, poly: top.concat(bot.slice().reverse()), ux, uy, nx, ny };
  }

  // ---------------------------------------------------------------------------
  // Flowers
  // ---------------------------------------------------------------------------
  // lanceolate petal along +x from the tube edge: narrow, pointed
  function petalLocal(len, wid, r0) {
    const up = [], dn = [];
    const n = 12;
    for (let i = 0; i <= n; i++) {
      const s = i / n;
      const w = wid * Math.pow(Math.sin(Math.PI * Math.pow(s, 0.62)), 0.85) * Math.pow(1 - s, 0.25);
      up.push([r0 + s * len, w]);
      dn.push([r0 + s * len, -w * 0.92]);
    }
    return up.concat(dn.slice(1, n).reverse());
  }

  function makeXf(F) {
    const e = [Math.cos(F.phi), Math.sin(F.phi)];
    return (lx, ly) => {
      const d = lx * e[0] + ly * e[1];
      const k = d * (F.sq - 1);
      return [F.x + lx + e[0] * k, F.y + ly + e[1] * k];
    };
  }

  function rot(p, a) {
    const c = Math.cos(a), s = Math.sin(a);
    return [p[0] * c - p[1] * s, p[0] * s + p[1] * c];
  }

  // signed shortest angle from a to b
  const angDiff = (a, b) => {
    let d = (b - a) % TAU;
    if (d > Math.PI) d -= TAU;
    if (d < -Math.PI) d += TAU;
    return d;
  };

  // Geometry of a flower at opening amount o (0 closed, 1 open, >1 overshoot)
  function flowerShape(F, o, skip) {
    const xf = makeXf(F);
    const R = F.R;
    const lenK = 0.62 + 0.38 * Math.min(o, 1.1);
    const widK = 0.55 + 0.45 * Math.min(o, 1);
    const petals = [];
    for (let k = 0; k < 5; k++) {
      if (skip && skip.has(k)) continue;
      const full = F.rho + k * 72 * DEG;
      const a = F.phi + angDiff(F.phi, full) * Math.min(o, 1) + (o > 1 ? (o - 1) * 0.5 * Math.sign(angDiff(F.phi, full)) : 0);
      const loc = petalLocal(R * lenK * (o > 1 ? o : 1), R * 0.235 * widK, 6);
      const pts = loc.map((p) => {
        const q = rot(p, a);
        return xf(q[0], q[1]);
      });
      const tip = rot([5 + R * lenK, 0], a);
      const midA = rot([5 + R * 0.25, 0], a), midB = rot([5 + R * lenK * 0.85, 0], a);
      petals.push({ k, pts, tip: xf(tip[0], tip[1]), vein: [xf(midA[0], midA[1]), xf(midB[0], midB[1])], a });
    }
    // draw the petal whose tip is highest first, so the lower ones overlap them (seen a little from above)
    petals.sort((p, q) => p.tip[1] - q.tip[1]);
    return { petals, xf };
  }

  function drawBud(ctx, b, P, scale = 1) {
    const L = LIB;
    const len = b.len * scale, w = b.w * scale;
    const ux = Math.cos(b.phi), uy = Math.sin(b.phi), nx = -uy, ny = ux;
    const up = [], dn = [];
    const n = 12;
    for (let i = 0; i <= n; i++) {
      const s = i / n;
      const hw = w * Math.pow(Math.sin(Math.PI * Math.pow(s, 0.66)), 0.8) * (0.5 + 0.5 * s);
      const cx = b.x + ux * s * len, cy = b.y + uy * s * len;
      up.push([cx + nx * hw, cy + ny * hw]);
      dn.push([cx - nx * hw * 0.95, cy - ny * hw * 0.95]);
    }
    const poly = up.concat(dn.slice(1, n).reverse());
    // little green calyx cup at the base
    ink(ctx, L.ellipsePts(b.x + ux * 4, b.y + uy * 4, 6 * scale, 4.5 * scale, 14, b.phi), { closed: true, width: 1.5, fill: C.leafLight, seed: sd('budcal', b.id), wobble: 0.3 });
    ink(ctx, poly, { closed: true, width: 2, fill: C.petal, seed: sd('bud', b.id), wobble: 0.5, taper: [4, 8] });
    // shadow side (lower right) hatch and the twisted petal seam
    const lit = nx + ny < 0 ? -1 : 1; // the side of dn faces down-right when lit = -1
    hatchB(ctx, poly, {
      angle: b.phi + 1.2, spacing: 3.6, width: 1.1, color: C.petalHatch, alpha: 0.9, length: [4, 10], inset: 1, overshoot: 0, seed: sd('budh', b.id),
      density: (x, y) => {
        const v = ((x - b.x) * nx + (y - b.y) * ny) * lit;
        return sstep(-w * 0.1, w * 0.6, v);
      },
    });
    const seam = [];
    for (let i = 2; i <= 10; i++) {
      const s = i / 12;
      const hw = w * 0.35 * Math.sin(s * 5.5);
      seam.push([b.x + ux * s * len + nx * hw, b.y + uy * s * len + ny * hw]);
    }
    ink(ctx, seam, { width: 1.1, color: C.inkSoft, alpha: 0.6, seed: sd('seam', b.id), taper: [3, 6], wobble: 0.2 });
  }

  function drawFlower(ctx, F, o, skip) {
    const L = LIB;
    if (o <= 0) {
      drawBud(ctx, { x: F.x - Math.cos(F.phi) * F.R * 0.3, y: F.y - Math.sin(F.phi) * F.R * 0.3, phi: F.phi, len: F.R * 0.95, w: F.R * 0.17, id: F.id + 500 }, null);
      return;
    }
    const { petals, xf } = flowerShape(F, o, skip);
    const all = new Path2D();
    for (const pt of petals) trace(all, pt.pts, true);
    // fill all petals, ink each one
    ctx.save();
    ctx.fillStyle = C.petal;
    ctx.fill(all, 'nonzero');
    ctx.restore();
    // petal-base and shadow-side shade, clipped to the petals
    const bb = bboxOf(petals.flatMap((p) => p.pts), 2);
    ctx.save();
    ctx.clip(all, 'nonzero');
    L.hatch(ctx, null, {
      bounds: bb, angle: -Math.PI / 4, spacing: 3.8, width: 1.15, color: C.petalHatch, alpha: 0.85, length: [5, 12], seed: sd('fh', F.id),
      density: (x, y) => {
        const dx = x - F.x, dy = y - F.y;
        const d = Math.hypot(dx, dy) / F.R;
        const side = (dx * 0.7 + dy * 0.7) / F.R;
        return 0.95 * (1 - sstep(0.18, 0.42, d)) + 0.6 * sstep(0.15, 0.75, side) * sstep(0.3, 0.6, d);
      },
    });
    ctx.restore();
    for (const pt of petals) {
      L.inkPath(ctx, pt.pts, { closed: true, width: 2, color: C.ink, seed: sd('pet', F.id, pt.k), wobble: 0.5, tremble: 0.25, taper: [6, 10] });
    }
    const veinP = new Path2D();
    for (const pt of petals) {
      veinP.moveTo(pt.vein[0][0], pt.vein[0][1]);
      veinP.lineTo(pt.vein[1][0], pt.vein[1][1]);
    }
    strokeP(ctx, veinP, C.petalHatch, 0.8, 1);
    // corolla tube centre
    const tube = L.ellipsePts(F.x, F.y, 7, 7 * F.sq, 16, F.phi);
    L.inkPath(ctx, tube, { closed: true, width: 1.4, fill: C.petalShade, seed: sd('tube', F.id), wobble: 0.2 });
    if (o > 0.6) {
      // five anthers on short filaments between the petals, and the forked style
      const a5 = new Path2D();
      const ant = [];
      for (let k = 0; k < 5; k++) {
        const a = F.rho + (k + 0.5) * 72 * DEG;
        const p1 = rot([F.R * 0.3, 0], a), p2 = rot([F.R * 0.44, 0], a);
        const q1 = xf(p1[0], p1[1]), q2 = xf(p2[0], p2[1]);
        a5.moveTo(F.x, F.y);
        a5.lineTo(q1[0], q1[1]);
        ant.push([q1, q2]);
      }
      strokeP(ctx, a5, C.petalHatch, 0.9, 1.4);
      const antP = new Path2D();
      for (const [q1, q2] of ant) {
        const mx = (q1[0] + q2[0]) / 2, my = (q1[1] + q2[1]) / 2;
        const ang = Math.atan2(q2[1] - q1[1], q2[0] - q1[0]);
        const len = Math.max(5, Math.hypot(q2[0] - q1[0], q2[1] - q1[1]) * 0.75);
        antP.moveTo(mx + Math.cos(ang) * len, my + Math.sin(ang) * len);
        antP.ellipse(mx, my, len, 2.9, ang, 0, TAU);
      }
      ctx.save();
      ctx.fillStyle = C.anther;
      ctx.fill(antP);
      ctx.restore();
      strokeP(ctx, antP, C.ink, 0.9, 1.1);
      const sa = F.rho + 0.2;
      const s1 = rot([F.R * 0.42, 0], sa);
      const st = xf(s1[0], s1[1]);
      const f1 = rot([F.R * 0.52, F.R * 0.07], sa), f2 = rot([F.R * 0.52, -F.R * 0.07], sa);
      const ft1 = xf(f1[0], f1[1]), ft2 = xf(f2[0], f2[1]);
      const style = new Path2D();
      style.moveTo(F.x, F.y);
      style.lineTo(st[0], st[1]);
      style.moveTo(st[0], st[1]);
      style.lineTo(ft1[0], ft1[1]);
      style.moveTo(st[0], st[1]);
      style.lineTo(ft2[0], ft2[1]);
      strokeP(ctx, style, C.ink, 0.85, 2.6);
      strokeP(ctx, style, C.white, 1, 1.3);
    }
  }

  // ---------------------------------------------------------------------------
  // Memoised geometry
  // ---------------------------------------------------------------------------
  let GEO = null;
  function geo() {
    if (GEO) return GEO;
    const L = LIB;
    // leaf pairs: one above and one below the branch at each node, angles varied so pairs do not mirror
    const LEAFDEF = [
      { n: 0, side: 1, ang: -1.22, bend: 14 },
      { n: 0, side: -1, ang: 0.78, bend: -12 },
      { n: 1, side: 1, ang: -1.42, bend: -16 },
      { n: 1, side: -1, ang: 0.6, bend: 14 },
      { n: 2, side: 1, ang: -1.28, bend: 12 },
      { n: 2, side: -1, ang: 0.72, bend: -14 },
    ];
    const leaves = LEAFDEF.map((d, i) => {
      const [x, y] = NODES[d.n];
      const bx = x + NUX * 12 * d.side, by = y + NUY * 12 * d.side;
      return leafGeom(bx, by, d.ang, 360 + (i % 3) * 10, 172, 'L' + i, d.bend);
    });
    // background branch low in the frame (scenery): (-40, 1830) to (1120, 1470)
    const bg = branchPts(-40, 1830, 1120, 1470, 13, 8);
    const bgNodes = [0.3, 0.72].map((s) => [lerp(-40, 1120, s), lerp(1830, 1470, s) - 8 * Math.sin(Math.PI * s)]);
    const bgLeaves = [
      leafGeom(bgNodes[0][0] - 4, bgNodes[0][1] - 12, -1.5, 300, 146, 'B0', 12),
      leafGeom(bgNodes[0][0] + 4, bgNodes[0][1] + 12, 0.9, 300, 146, 'B1', -10),
      leafGeom(bgNodes[1][0] - 4, bgNodes[1][1] - 12, -1.3, 300, 146, 'B2', -12),
      leafGeom(bgNodes[1][0] + 4, bgNodes[1][1] + 12, 0.75, 300, 146, 'B3', 10),
    ];
    const top = branchPts(1120, 300, 470, -40, 12, -6);
    const topNodes = [0.32, 0.74].map((u) => [lerp(1120, 470, u), lerp(300, -40, u) + 6 * Math.sin(Math.PI * u)]);
    bgLeaves.push(
      leafGeom(topNodes[0][0] - 5, topNodes[0][1] + 10, 2.0, 310, 150, 'T0', 12),
      leafGeom(topNodes[0][0] + 5, topNodes[0][1] - 10, -1.2, 310, 150, 'T1', -10),
      leafGeom(topNodes[1][0] - 5, topNodes[1][1] + 10, 2.25, 300, 146, 'T2', -12),
      leafGeom(topNodes[1][0] + 5, topNodes[1][1] - 10, -0.95, 300, 146, 'T3', 10)
    );
    const bgBuds = [];
    bgNodes.concat(topNodes).forEach((nd, j) => {
      const r = L.rng(sd('bgbud', j));
      for (let i = 0; i < 9; i++) {
        const a = (i / 9) * TAU + r.range(-0.2, 0.2);
        bgBuds.push({ x: nd[0] + Math.cos(a) * 12, y: nd[1] + Math.sin(a) * 9, phi: a, len: r.range(34, 44), w: r.range(6.5, 8), id: 900 + j * 20 + i });
      }
    });

    // flower clusters
    const COUNTS = [5, 8, 6];
    const BUDS = [6, 9, 7];
    const clusters = COUNTS.map((n, c) => {
      const [nx0, ny0] = NODES[c];
      const r = L.rng(sd('cluster', c));
      const flowers = [];
      const ra = c === 1 ? 86 : 64, rb = c === 1 ? 72 : 56;
      const ringN = c === 1 ? n - 1 : n;
      const a0 = r.range(0, TAU);
      for (let j = 0; j < ringN; j++) {
        const th = a0 + (j / ringN) * TAU + r.range(-0.18, 0.18);
        const ca = Math.cos(th) * ra * r.range(0.85, 1.05), cb = Math.sin(th) * rb * r.range(0.85, 1.05);
        const x = nx0 + UX * ca + NUX * cb, y = ny0 + UY * ca + NUY * cb;
        const phi = Math.atan2(y - ny0, x - nx0);
        flowers.push({
          x, y, phi, R: c === 1 ? r.range(62, 67) : r.range(56, 62), sq: r.range(0.66, 0.92), rho: r.range(0, TAU),
          back: Math.sin(th) > 0.3, id: c * 100 + j,
        });
      }
      if (c === 1) {
        // the hero flower faces the camera in front of the node
        flowers.push({ x: nx0 + 6, y: ny0 + 12, phi: 0.6, R: 70, sq: 0.96, rho: -0.3, back: false, id: c * 100 + 99 });
      }
      // opening order: front flowers first, hero flower first in cluster 2
      const order = flowers.map((f, i) => i).sort((i, j) => (flowers[i].back - flowers[j].back) || (flowers[j].y - flowers[i].y));
      if (c === 1) {
        order.splice(order.indexOf(flowers.length - 1), 1);
        order.unshift(flowers.length - 1);
      }
      order.forEach((fi, k) => (flowers[fi].ord = k));
      const buds = [];
      for (let j = 0; j < BUDS[c]; j++) {
        const th = a0 + ((j + 0.5) / BUDS[c]) * TAU + r.range(-0.15, 0.15);
        const kr = r.range(0.45, 0.8);
        const ca = Math.cos(th) * ra * kr, cb = Math.sin(th) * rb * kr;
        const x = nx0 + UX * ca + NUX * cb, y = ny0 + UY * ca + NUY * cb;
        buds.push({ x, y, phi: Math.atan2(y - ny0, x - nx0) + r.range(-0.25, 0.25), len: r.range(48, 62), w: r.range(9, 11.5), back: Math.sin(th) > 0, id: c * 100 + 50 + j });
      }
      return { c, node: [nx0, ny0], flowers, buds };
    });

    // falling petals: three petals of cluster 1
    const falls = [
      { f: 0, k: 1, dx: -40, rot: 3.2 },
      { f: 2, k: 3, dx: 30, rot: -2.6 },
      { f: 3, k: 0, dx: -10, rot: 2.2 },
    ].map((d, i) => Object.assign(d, { i, fl: clusters[0].flowers[d.f % clusters[0].flowers.length] }));

    // bee flight path (world px): in from the left edge, a loop, down onto the hero cluster
    const hero = clusters[1].flowers[clusters[1].flowers.length - 1];
    const land = [hero.x + 4, hero.y - 8];
    const beePath = L.smoothPts([
      [-90, 640], [60, 560], [210, 520], [330, 560], [370, 650], [300, 720], [220, 680], [240, 590], [350, 560], [460, 640], [520, 780], [land[0] - 14, land[1] - 60], land,
    ], false, 4);

    const branch = branchPts(BR.x0, BR.y0, BR.x1, BR.y1, BR.half, 6, 60);
    GEO = { leaves, top, topNodes, bg, bgNodes, bgLeaves, bgBuds, clusters, falls, beePath, land, branch };
    return GEO;
  }

  // ---------------------------------------------------------------------------
  // Branch drawing
  // ---------------------------------------------------------------------------
  function drawBranch(ctx, Bp, key, nodes, o = {}) {
    const L = LIB;
    const w = o.w || 3.5;
    fillPoly(ctx, Bp.poly, C.bark);
    // a pale lit strip along the top edge
    const strip = [];
    for (let i = 0; i < Bp.top.length; i++) {
      const t = Bp.top[i], m = Bp.mid[i];
      strip.push([lerp(t[0], m[0], 0.15), lerp(t[1], m[1], 0.15)]);
    }
    for (let i = Bp.top.length - 1; i >= 0; i--) {
      const t = Bp.top[i], m = Bp.mid[i];
      strip.push([lerp(t[0], m[0], 0.55), lerp(t[1], m[1], 0.55)]);
    }
    fillPoly(ctx, strip, C.barkLight, 0.7);
    // lengthwise bark hatching on the shadow (lower) half, plus contour strokes in the deepest band
    const ang = Math.atan2(Bp.uy, Bp.ux);
    const half = Math.hypot(Bp.top[0][0] - Bp.mid[0][0], Bp.top[0][1] - Bp.mid[0][1]);
    const vOf = (x, y) => ((x - Bp.mid[0][0]) * Bp.nx + (y - Bp.mid[0][1]) * Bp.ny);
    // distance below the (sagging) centreline, normalised
    const sOf = (x, y) => ((x - Bp.mid[0][0]) * Bp.ux + (y - Bp.mid[0][1]) * Bp.uy);
    const total = polyLen(Bp.mid);
    const below = (x, y) => {
      const s = clamp(sOf(x, y) / total);
      const m = Bp.mid[Math.round(s * (Bp.mid.length - 1))];
      return -((x - m[0]) * Bp.nx + (y - m[1]) * Bp.ny) / half;
    };
    hatchB(ctx, Bp.poly, { angle: ang + 0.04, spacing: 3.6, width: 1.4, color: C.barkDeep, alpha: 0.9, length: [16, 46], seed: sd('bh', key), density: (x, y) => sstep(-0.25, 0.55, below(x, y)) });
    hatchB(ctx, Bp.poly, { angle: ang + Math.PI / 2 + 0.25, spacing: 6, width: 1.3, color: C.ink, alpha: 0.5, length: [5, 10], seed: sd('bc', key), density: (x, y) => sstep(0.45, 0.9, below(x, y)) });
    // bark flecks and lenticels
    stippleB(ctx, Bp.poly, { spacing: 13, r: [1.0, 1.8], color: C.barkDeep, alpha: 0.75, seed: sd('len', key), density: (x, y) => 0.55 + 0.4 * sstep(-0.6, 0.4, below(x, y)) });
    void vOf;
    // node swellings: a slight ring where each leaf pair joins
    for (let i = 0; i < nodes.length; i++) {
      const [x, y] = nodes[i];
      const ring = [];
      for (let k = -1; k <= 1; k += 2) ring.push([x + Bp.ux * k * 6 + Bp.nx * (half + 2), y + Bp.uy * k * 6 + Bp.ny * (half + 2)]);
      const p1 = [x + Bp.nx * (half + 3), y + Bp.ny * (half + 3)], p2 = [x - Bp.nx * (half + 3), y - Bp.ny * (half + 3)];
      const c = [x + Bp.ux * 5, y + Bp.uy * 5];
      ink(ctx, L.smoothPts([p1, c, p2], false, 3), { width: 1.8, color: C.inkSoft, alpha: 0.9, seed: sd('nodering', key, i), taper: [4, 4], wobble: 0.3 });
    }
    ink(ctx, Bp.top, { width: w, seed: sd('btop', key), taper: [0, 0], wobble: 1.2 });
    ink(ctx, Bp.bot, { width: w + 0.5, seed: sd('bbot', key), taper: [0, 0], wobble: 1.2 });
  }

  // ---------------------------------------------------------------------------
  // Bee (dorsal view, about 60 px long), heading hd, wing angle wa
  // ---------------------------------------------------------------------------
  function drawBee(ctx, x, y, hd, wa, k) {
    const L = LIB;
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(hd);
    // legs
    const legs = new Path2D();
    for (const s of [-1, 1]) {
      legs.moveTo(6, 6 * s); legs.lineTo(12, 14 * s); legs.lineTo(16, 16 * s);
      legs.moveTo(2, 7 * s); legs.lineTo(0, 16 * s); legs.lineTo(-3, 19 * s);
      legs.moveTo(-2, 6 * s); legs.lineTo(-10, 15 * s); legs.lineTo(-16, 17 * s);
    }
    strokeP(ctx, legs, C.ink, 0.9, 1.6);
    // abdomen with ochre and ink stripes
    const abd = L.ellipsePts(-16, 0, 17, 11.5, 28);
    L.inkPath(ctx, abd, { closed: true, width: 2.2, fill: C.ochre, seed: sd('abd', k & 1), wobble: 0.3, boil: k });
    ctx.save();
    ctx.beginPath();
    trace(ctx, abd, true);
    ctx.clip();
    ctx.fillStyle = C.ink;
    for (const sx of [-6, -15, -24]) {
      ctx.beginPath();
      ctx.moveTo(sx + 2.5, -14);
      ctx.quadraticCurveTo(sx - 1.5, 0, sx + 2.5, 14);
      ctx.lineTo(sx - 2.5, 14);
      ctx.quadraticCurveTo(sx - 6.5, 0, sx - 2.5, -14);
      ctx.closePath();
      ctx.fill();
    }
    L.hatch(ctx, abd, { angle: -Math.PI / 4 - hd, spacing: 3, width: 1, color: C.ink, alpha: 0.5, length: [3, 8], seed: sd('abdh'), density: (px, py) => sstep(0, 9, py) });
    ctx.restore();
    // thorax: fuzzy ochre-tan
    const th = L.ellipsePts(4, 0, 11, 10, 20);
    L.inkPath(ctx, th, { closed: true, width: 2, fill: L.mix(C.ochre, C.tan, 0.5), seed: sd('thx'), wobble: 0.3 });
    const fuzz = new Path2D();
    for (let i = 0; i < 18; i++) {
      const a = (i / 18) * TAU;
      fuzz.moveTo(4 + Math.cos(a) * 9, Math.sin(a) * 8.5);
      fuzz.lineTo(4 + Math.cos(a) * 13.5, Math.sin(a) * 12.5);
    }
    strokeP(ctx, fuzz, C.inkSoft, 0.7, 1);
    // head and antennae
    L.inkPath(ctx, L.ellipsePts(19, 0, 7, 8, 16), { closed: true, width: 2, fill: C.ink, seed: sd('head'), wobble: 0.2 });
    const ant = new Path2D();
    ant.moveTo(24, -3); ant.lineTo(31, -8); ant.lineTo(35, -6);
    ant.moveTo(24, 3); ant.lineTo(31, 8); ant.lineTo(35, 6);
    strokeP(ctx, ant, C.ink, 1, 1.4);
    // wings: translucent white, veined
    for (const s of [-1, 1]) {
      ctx.save();
      ctx.translate(2, 4 * s);
      ctx.rotate(s * (Math.PI - wa));
      const wing = L.ellipsePts(16, 0, 18, 7.5, 20);
      ctx.globalAlpha = 0.6;
      fillPoly(ctx, wing, C.white);
      ctx.globalAlpha = 1;
      L.inkPath(ctx, wing, { closed: true, width: 1.3, color: C.ink, alpha: 0.85, seed: sd('wing', s), wobble: 0.2, taper: [3, 5] });
      const v = new Path2D();
      v.moveTo(2, 0); v.lineTo(26, -1.5);
      v.moveTo(12, -1); v.lineTo(20, 4);
      strokeP(ctx, v, C.inkSoft, 0.6, 0.9);
      ctx.restore();
    }
    ctx.restore();
  }

  // dashed polyline drawn on up to arc length fraction u
  function dashedPath(ctx, pts, u, color, width, dash) {
    if (u <= 0) return;
    const total = polyLen(pts);
    const want = total * clamp(u);
    const p = new Path2D();
    let acc = 0;
    p.moveTo(pts[0][0], pts[0][1]);
    for (let i = 1; i < pts.length; i++) {
      const l = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]);
      if (acc + l >= want) {
        const f = l ? (want - acc) / l : 0;
        p.lineTo(lerp(pts[i - 1][0], pts[i][0], f), lerp(pts[i - 1][1], pts[i][1], f));
        break;
      }
      p.lineTo(pts[i][0], pts[i][1]);
      acc += l;
    }
    ctx.save();
    ctx.strokeStyle = color;
    ctx.lineWidth = width;
    ctx.lineCap = 'butt';
    ctx.setLineDash(dash);
    ctx.stroke(p);
    ctx.restore();
  }

  function ringPath(cx, cy, r, ticks) {
    const p = new Path2D();
    p.moveTo(cx + r, cy);
    p.arc(cx, cy, r, 0, TAU);
    if (ticks) {
      for (let q = 0; q < 4; q++) {
        const a = Math.PI / 4 + (q * Math.PI) / 2;
        p.moveTo(cx + Math.cos(a) * (r - 9), cy + Math.sin(a) * (r - 9));
        p.lineTo(cx + Math.cos(a) * (r + 9), cy + Math.sin(a) * (r + 9));
      }
    }
    return p;
  }

  function overlayStroke(ctx, path, color, alpha, width) {
    ctx.save();
    ctx.lineCap = 'round';
    ctx.globalAlpha = alpha * 0.25;
    ctx.strokeStyle = C.ink;
    ctx.lineWidth = width + 3;
    ctx.stroke(path);
    ctx.globalAlpha = alpha;
    ctx.strokeStyle = color;
    ctx.lineWidth = width;
    ctx.stroke(path);
    ctx.restore();
  }


  // The scenery and leaves do not move: render them once per boil drawing into an offscreen layer.
  function staticLayer(L, bi) {
    const S = FILM.S || 1;
    const b = ((bi % 4) + 4) % 4;
    return L.cached(ID + ':static:' + b + ':' + S, () => {
      const cv = FILM.makeCanvas(Math.round(1080 * S), Math.round(1920 * S));
      const ctx = cv.getContext('2d');
      ctx.setTransform(S, 0, 0, S, 0, 0);
      BOIL = b;
      try {
        drawStatic(ctx, L);
      } finally {
        BOIL = null;
      }
      return cv;
    });
  }
  function drawStatic(ctx, L) {
    const G = geo();
    // 3. background branch (scenery)
    for (const Lf of G.bgLeaves) drawLeaf(ctx, Lf, { thin: true });
    drawBranch(ctx, G.bg, 'bg', G.bgNodes, { w: 3 });
    drawBranch(ctx, G.top, 'top', G.topNodes, { w: 3 });
    for (const b of G.bgBuds) drawBud(ctx, b, null, 1);

    // 4. leaves of the hero branch
    for (const Lf of G.leaves) drawLeaf(ctx, Lf);

    // a soft cast shadow of each cluster on the leaves below and right of it
    for (const cl of G.clusters) {
      const [x, y] = cl.node;
      const sh = L.ellipsePts(x + 26, y + 40, 120, 70, 32, BANG);
      for (const Lf of G.leaves) {
        ctx.save();
        ctx.clip(pathOf(Lf.outline));
        hatchB(ctx, sh, { angle: -Math.PI / 4 + 1.05, spacing: 4.5, width: 1.3, color: C.ink, alpha: 0.4, length: [8, 22], seed: sd('csh', cl.c, Lf.key), bounds: bboxOf(sh), density: (px, py) => 1 - sstep(0.5, 1, Math.hypot((px - x - 26) / 120, (py - y - 40) / 70)) });
        ctx.restore();
      }
    }
  }

  // ---------------------------------------------------------------------------
  // Scene
  // ---------------------------------------------------------------------------
  FILM.scene({
    id: ID,
    draw(ctx, tIn, info) {
      const L = info.lib;
      const E = L.ease;
      const t = clamp(tIn, 0, info.dur);
      const tw = L.onTwos(t);
      const G = geo();

      // timing helpers
      const drawing = (a) => Math.max(0, Math.floor((t - a) * 12 + 1e-4));
      const hit = (a, frames, e, lead = 1) => (t < a - 1e-6 ? 0 : (e || ((u) => u))(clamp((t - a) / (frames * FR) + lead / frames)));
      const POP = [0.45, 1.08, 1];
      const openAmt = (a) => (t < a - 1e-6 ? 0 : POP[Math.min(2, drawing(a))]);
      const flowerOpenAt = (c, F) => OPEN_AT[c] + F.ord * 2 * FR;

      // 1. stripes
      L.stripes(ctx, { colors: [L.pal.stripeCream, L.pal.stripeSpring], width: 140, angle: -0.52, offset: 8 * info.T, seed: sd('stripes') });

      // 2. camera: push 1.00 to 1.04 keeping (560, 1010) on its screen spot
      const zoom = 1 + 0.04 * E.inOutSine(t / info.dur);
      const cam = { x: 560 - 20 / zoom, y: 1010 - 50 / zoom, zoom };

      // which petals of cluster 1 have dropped off
      const fallen = new Map();
      for (const f of G.falls) {
        const a = B_FALL + f.i * 2 * FR;
        if (t >= a - 1e-6) {
          if (!fallen.has(f.fl.id)) fallen.set(f.fl.id, new Set());
          fallen.get(f.fl.id).add(f.k);
        }
      }

      L.camera(ctx, cam, (ctx) => {
        // 3-4. static layer (scenery branches, all leaves, cluster shadows), cached per boil drawing
        ctx.drawImage(staticLayer(L, L.boil(info.T)), 0, 0, 1080, 1920);

        // 5. back flowers and buds
        for (const cl of G.clusters) {
          for (const b of cl.buds) if (b.back) drawBud(ctx, b, null, 1);
          for (const F of cl.flowers) if (F.back) drawFlower(ctx, F, openAmt(flowerOpenAt(cl.c, F)), fallen.get(F.id));
        }

        // 6. the hero branch
        drawBranch(ctx, G.branch, 'hero', NODES, { w: 4 });

        // 7. front buds and flowers (lowest first so the ones nearer the camera overlap)
        for (const cl of G.clusters) {
          for (const b of cl.buds) if (!b.back) drawBud(ctx, b, null, 1);
          const front = cl.flowers.filter((F) => !F.back).sort((a, b) => a.y - b.y);
          for (const F of front) drawFlower(ctx, F, openAmt(flowerOpenAt(cl.c, F)), fallen.get(F.id));
        }

        // 8a. falling petals (on twos)
        for (const f of G.falls) {
          const a = B_FALL + f.i * 2 * FR;
          if (tw < a - 1e-6) continue;
          const dt = tw - a + 1 / 12;
          const F = f.fl;
          const { petals } = flowerShape(F, 1, null);
          const pt = petals.find((p) => p.k === f.k);
          if (!pt) continue;
          let cx = 0, cy = 0;
          for (const q of pt.pts) {
            cx += q[0];
            cy += q[1];
          }
          cx /= pt.pts.length;
          cy /= pt.pts.length;
          const ox = f.dx * dt * 2 + 14 * Math.sin(dt * 9 + f.i), oy = 90 * dt + 620 * dt * dt;
          const ang = f.rot * dt;
          const moved = pt.pts.map((q) => {
            const r = rot([q[0] - cx, q[1] - cy], ang);
            return [cx + ox + r[0], cy + oy + r[1] * (0.8 + 0.2 * Math.cos(dt * 7))];
          });
          L.inkPath(ctx, moved, { closed: true, width: 2, fill: C.petal, seed: sd('fallp', f.i), wobble: 0.4, taper: [6, 10] });
          L.hatch(ctx, moved, { angle: -Math.PI / 4, spacing: 3.6, width: 1.1, color: C.petalHatch, alpha: 0.8, length: [4, 9], inset: 1, seed: sd('fallh', f.i), density: 0.45 });
        }

        // 9a. bee flight path (dashed, annBlue), drawing on behind the bee
        const flyT = clamp((t - B_BEE0) / (B_C3 - B_BEE0));
        const flyTw = clamp((tw - B_BEE0) / (B_C3 - B_BEE0));
        const sOf = (q) => E.inOutSine(q);
        const sNow = Math.min(sOf(flyT), sOf(flyTw));
        if (t >= B_BEE0 - 1e-6) dashedPath(ctx, G.beePath, Math.max(0.004, sNow - 0.02), C.annBlue, 2.5, [14, 10]);

        // 8b. bee (on twos), wings flick between two drawings
        if (tw >= B_BEE0 - 1e-6) {
          const s = sOf(flyTw);
          const p = atFrac(G.beePath, s);
          const q = atFrac(G.beePath, Math.min(1, s + 0.01));
          const pr = atFrac(G.beePath, Math.max(0, s - 0.01));
          let hd = Math.atan2(q[1] - pr[1], q[0] - pr[0]);
          const landed = flyTw >= 1;
          if (landed) hd = 0.9;
          const k = Math.floor(tw * 12 + 1e-6);
          const wa = k % 2 ? 0.55 : 1.05;
          ctx.save();
          ctx.translate(p[0], p[1]);
          ctx.scale(1.15, 1.15);
          drawBee(ctx, 0, 0, hd, wa, k);
          ctx.restore();
          if (!landed) {
            // buzz marks around the wings
            const bz = new Path2D();
            for (const sgn of [-1, 1]) {
              const a = hd + sgn * 1.9;
              bz.moveTo(p[0] + Math.cos(a) * 34, p[1] + Math.sin(a) * 34);
              bz.lineTo(p[0] + Math.cos(a) * 44, p[1] + Math.sin(a) * 44);
            }
            strokeP(ctx, bz, C.ink, 0.6, 1.6);
          }
        }

        // 9b. annYellow attention rings popping around each cluster as it opens
        for (let c = 0; c < 3; c++) {
          const a = OPEN_AT[c];
          if (t < a - 1e-6) continue;
          const f = (t - a) * 24;
          if (f > 13) continue;
          const pr = E.outExpo(clamp((f + 1) / 10));
          const alpha = 1 - clamp((f - 5) / 8);
          const [x, y] = G.clusters[c].node;
          overlayStroke(ctx, ringPath(x, y, 70 + 120 * pr, true), C.annYellow, alpha, 3);
          if (f >= 2) overlayStroke(ctx, ringPath(x, y, 50 + 90 * E.outExpo(clamp((f - 1) / 10)), false), C.annYellow, alpha * 0.8, 2);
        }
        // 9c. a small annMagenta ring where the bee touches down
        if (t >= B_C3 - 1e-6) {
          const f = (t - B_C3) * 24;
          if (f < 12) {
            const pr = E.outExpo(clamp((f + 1) / 8));
            overlayStroke(ctx, ringPath(G.land[0], G.land[1], 26 + 60 * pr, false), C.annMagenta, 1 - clamp((f - 4) / 8), 3);
          }
        }
      });

      // 10. tally: three annYellow dots, one filling per opened cluster
      for (let i = 0; i < 3; i++) {
        const x = 120 + i * 40, y = 300;
        const on = t >= OPEN_AT[i] - 1e-6;
        const pop = on ? [1.35, 1.08, 1][Math.min(2, drawing(OPEN_AT[i]))] : 1;
        ctx.save();
        ctx.lineWidth = 3;
        ctx.strokeStyle = C.annYellow;
        ctx.fillStyle = C.annYellow;
        ctx.beginPath();
        ctx.arc(x, y, 11 * pop, 0, TAU);
        if (on) ctx.fill();
        ctx.stroke();
        ctx.restore();
      }
      // a thin baseline under the tally, like a ruler
      const tl = new Path2D();
      tl.moveTo(102, 326);
      tl.lineTo(218, 326);
      for (let i = 0; i < 3; i++) {
        tl.moveTo(120 + i * 40, 326);
        tl.lineTo(120 + i * 40, 316);
      }
      strokeP(ctx, tl, C.annYellow, 0.9, 2);
      void hit;
    },
  });
})();

</script>
<script>
// ---- src/scenes/05-flower-to-fruit.js
// 05 flower-to-fruit : Nine months in a flower. Schematic, global T 8.25 to 9.75 (t 0 to 1.5).
// A blueprint section of one coffee flower at the top (centre (540, 560), 320 px across): five petals in
// double lavender outline on a narrow corolla tube, the inferior ovary below them holding two ovules
// (the two future beans). The petals fall away over 9 frames from the cut and the ovary glows.
// Below, a growth ladder at y 1150 draws on one fruit per 8th-triplet (T 8.625 to 9.625), a nine-tick
// month scale lighting in step, and the ripe fifth fruit flashes magenta on T 9.625.
//
// Layers, back to front:
//   1. blueprint plate (navy, 60 px grid, guide circles, diagonals)
//   2. guide circle and radial ticks around the flower, stipple haze, construction lines
//   3. ghost (dashed) outlines of the five ladder fruits, the growth envelope, the bracket
//   4. the flower: branch stub, ovary with hex lattice and two ovules, calyx, tube, petals, stamens, style
//   5. network line from the ovary down to the first fruit, links between fruits
//   6. the ladder fruits drawing on (double outlines, schemLeaf dots, two seeds each, calyx scar)
//   7. the month tick scale
//   8. glow dots (ovary, fruit cores), the magenta ripe ring
//   9. progress glyph (stage 0, u = p)
(function () {
  'use strict';

  const ID = 'flower-to-fruit';
  const L = FILM.lib;
  const P = L.pal;
  const TAU = Math.PI * 2;
  const DEG = Math.PI / 180;
  const FR = 1 / 24;

  const LAV = P.lavender, WHITE = P.lineWhite, MAG = P.magenta, LEAFT = P.schemLeaf, NAVYL = P.navyLight, GLOW = P.glow;
  const lerp = (a, b, t) => a + (b - a) * t;
  const clamp = (v, lo = 0, hi = 1) => (v < lo ? lo : v > hi ? hi : v);
  const sstep = (a, b, x) => {
    const t = clamp((x - a) / (b - a));
    return t * t * (3 - 2 * t);
  };
  const sd = (...k) => L.hash(ID, ...k) & 0x7fffffff;

  // beats (shot-local; global T in comments)
  const B_PETALS = 0; // T 8.25 petals start to fall (9 frames)
  const FRUIT_T = [0.375, 0.625, 0.875, 1.125, 1.375]; // T 8.625, 8.875, 9.125, 9.375, 9.625
  const B_RIPE = 1.375; // T 9.625 magenta ring on the ripe fruit

  // Progress glyph: canonical, copied verbatim from docs/storyboard.md.
  function progressGlyph(ctx, L, stage, u, T, allLit) {
    const P = L.pal, cx = 900, cy = 300, r = 46, gap = 6 * Math.PI / 180;
    const q = Math.PI / 2, pop = L.clamp(u * 6);
    ctx.save();
    ctx.lineCap = 'round';
    ctx.globalAlpha = 0.5; ctx.strokeStyle = P.lavender; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(cx, cy, r + 14, 0, Math.PI * 2); ctx.stroke();
    for (let i = 0; i < 4; i++) {
      const a0 = -q + i * q + gap / 2, a1 = a0 + q - gap;
      const past = allLit || i < stage, cur = !allLit && i === stage;
      ctx.globalAlpha = past ? 0.6 : 0.18;
      ctx.strokeStyle = P.lavender; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(cx, cy, r, a0, a1); ctx.stroke();
      if (cur || allLit) {
        const k = allLit ? 1 : L.clamp(u);
        const ae = a0 + (a1 - a0) * k;
        ctx.globalAlpha = 1; ctx.strokeStyle = P.lineWhite; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.arc(cx, cy, r, a0, ae); ctx.stroke();
        if (cur) L.glowDot(ctx, cx + Math.cos(ae) * r, cy + Math.sin(ae) * r, 4 + 2 * pop, { rays: 0, glow: 3.5, intensity: 0.8 });
      }
    }
    ctx.globalAlpha = 0.7; ctx.fillStyle = P.lineWhite;
    ctx.beginPath(); ctx.arc(cx, cy, 3, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  // ---------------------------------------------------------------------------
  // helpers
  // ---------------------------------------------------------------------------
  function trace(ctx, pts, closed = true) {
    for (let i = 0; i < pts.length; i++) {
      if (i === 0) ctx.moveTo(pts[i][0], pts[i][1]);
      else ctx.lineTo(pts[i][0], pts[i][1]);
    }
    if (closed) ctx.closePath();
  }
  function strokeP(ctx, p, color, alpha, width, dash) {
    ctx.save();
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.strokeStyle = color;
    ctx.globalAlpha *= alpha;
    ctx.lineWidth = width;
    if (dash) ctx.setLineDash(dash);
    ctx.stroke(p);
    ctx.restore();
  }
  function fillP(ctx, p, color, alpha) {
    ctx.save();
    ctx.globalAlpha *= alpha;
    ctx.fillStyle = color;
    ctx.fill(p);
    ctx.restore();
  }
  function pathOf(pts, closed = true) {
    const p = new Path2D();
    trace(p, pts, closed);
    return p;
  }
  function area(pts) {
    let a = 0;
    for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) a += pts[j][0] * pts[i][1] - pts[i][0] * pts[j][1];
    return a / 2;
  }
  // inward offset of a closed polygon by d px (vertex normals from neighbours)
  function inset(pts, d) {
    const n = pts.length;
    const s = area(pts) > 0 ? 1 : -1;
    const out = [];
    for (let i = 0; i < n; i++) {
      const a = pts[(i - 1 + n) % n], b = pts[(i + 1) % n];
      let tx = b[0] - a[0], ty = b[1] - a[1];
      const l = Math.hypot(tx, ty) || 1;
      tx /= l;
      ty /= l;
      // inward normal for the polygon's winding
      out.push([pts[i][0] - ty * d * s, pts[i][1] + tx * d * s]);
    }
    return out;
  }
  const COMMON = { color: LAV, wobble: 0.7, tremble: 0.15, boilAmp: 0.55, widthJitter: 0.12, rough: 0.12 };
  const lav = (o) => Object.assign({}, COMMON, o);

  // double lavender outline: outer 2.5 px at 85 percent, inner 1.5 px at 50 percent, gap px inside
  function dbl(ctx, pts, seed, o = {}) {
    const a = o.alpha != null ? o.alpha : 1;
    const p = o.p != null ? o.p : 1;
    if (p <= 0 || a <= 0.003) return;
    const gap = o.gap != null ? o.gap : 9;
    const col = o.color || LAV;
    if (p < 1) {
      const n = Math.max(2, Math.floor(pts.length * p));
      L.inkPath(ctx, pts.slice(0, n), lav({ color: col, width: o.w || 2.5, alpha: 0.9 * a, seed, taper: [3, 8] }));
      if (gap > 0) {
        const inn = inset(pts, gap);
        L.inkPath(ctx, inn.slice(0, n), lav({ color: col, width: 1.5, alpha: 0.5 * a, seed: seed + 17, taper: [3, 8] }));
      }
      return;
    }
    L.inkPath(ctx, pts, lav({ color: col, closed: true, width: o.w || 2.5, alpha: 0.85 * a, seed, taper: [6, 12] }));
    if (gap > 0) L.inkPath(ctx, inset(pts, gap), lav({ color: col, closed: true, width: 1.5, alpha: 0.5 * a, seed: seed + 17, taper: [6, 12] }));
  }

  // ---------------------------------------------------------------------------
  // Flower geometry (side section): petals fan from the tube mouth at (540, 540)
  // ---------------------------------------------------------------------------
  const MOUTH = [540, 532];
  const OVARY = { x: 540, y: 694, rx: 66, ry: 52 };
  function petalPts(ang, len, wid, fore) {
    // lanceolate petal from the mouth toward angle ang; fore < 1 foreshortens it
    const up = [], dn = [];
    const n = 16;
    const c = Math.cos(ang), s = Math.sin(ang);
    for (let i = 0; i <= n; i++) {
      const u = i / n;
      const w = wid * Math.pow(Math.sin(Math.PI * Math.pow(u, 0.6)), 0.85) * Math.pow(1 - u, 0.22);
      const x = 10 + u * len * fore;
      up.push([MOUTH[0] + c * x - s * w, MOUTH[1] + s * x + c * w]);
      dn.push([MOUTH[0] + c * x + s * w, MOUTH[1] + s * x - c * w]);
    }
    return up.concat(dn.slice(1, n).reverse());
  }
  const PETALS = [
    { ang: 188 * DEG, len: 162, wid: 24, fore: 1 },
    { ang: 228 * DEG, len: 150, wid: 22, fore: 0.72 },
    { ang: 268 * DEG, len: 150, wid: 22, fore: 0.55 },
    { ang: 312 * DEG, len: 150, wid: 22, fore: 0.72 },
    { ang: 352 * DEG, len: 162, wid: 24, fore: 1 },
  ].map((p, i) => Object.assign(p, { i, pts: petalPts(p.ang, p.len, p.wid, p.fore) }));

  const TUBE = (() => {
    const l = [], r = [];
    for (let i = 0; i <= 10; i++) {
      const u = i / 10;
      const y = lerp(MOUTH[1] + 4, 646, u);
      const w = lerp(15, 11, Math.pow(u, 0.7));
      l.push([540 - w, y]);
      r.push([540 + w, y]);
    }
    return l.concat(r.reverse());
  })();

  const OVARY_PTS = (() => {
    const out = [];
    for (let i = 0; i < 72; i++) {
      const a = (i / 72) * TAU;
      // slightly flattened top under the calyx, rounder bottom
      const ry = Math.sin(a) < 0 ? OVARY.ry * 0.9 : OVARY.ry;
      out.push([OVARY.x + Math.cos(a) * OVARY.rx, OVARY.y + Math.sin(a) * ry]);
    }
    return out;
  })();

  // two ovules facing flat side to flat side (the two future beans)
  function seedPts(cx, cy, w, h, side) {
    // D shape: flat face toward the partition at cx - side * w
    const out = [];
    const n = 36;
    for (let i = 0; i <= n; i++) {
      const a = -Math.PI / 2 + (i / n) * Math.PI;
      out.push([cx - side * w * 0.12 + side * Math.cos(a) * w, cy + Math.sin(a) * h]);
    }
    out.push([cx - side * w * 0.12, cy + h * 0.85]);
    out.push([cx - side * w * 0.12, cy - h * 0.85]);
    return out;
  }

  // ---------------------------------------------------------------------------
  // Ladder
  // ---------------------------------------------------------------------------
  const LADDER_Y = 1150;
  const FRUITS = [
    { x: 170, r: 24 },
    { x: 320, r: 44 },
    { x: 490, r: 62 },
    { x: 680, r: 78 },
    { x: 880, r: 92 },
  ].map((f, i) => Object.assign(f, { i, y: LADDER_Y, ry: f.r * 1.1, pts: L.ellipsePts(f.x, LADDER_Y, f.r, f.r * 1.1, 72) }));
  const SCALE = { x0: 120, x1: 960, y: 1320 };
  const TICK_X = Array.from({ length: 9 }, (_, i) => SCALE.x0 + 46 + i * ((SCALE.x1 - SCALE.x0 - 92) / 8));
  const LIT_AFTER = [2, 4, 6, 8, 9];

  // ---------------------------------------------------------------------------
  // Scene
  // ---------------------------------------------------------------------------
  FILM.scene({
    id: ID,
    draw(ctx, tIn, info) {
      const t = clamp(tIn, 0, info.dur);
      const E = L.ease;
      const f24 = t * 24;
      const hit = (a, frames, e, lead = 1) => (t < a - 1e-6 ? 0 : (e || ((u) => u))(clamp((t - a) / (frames * FR) + lead / frames)));

      // 1. plate
      L.blueprint(ctx, { center: [540, 600], circles: 3, diagonals: 3, seed: 405 });

      // 2. guides around the flower
      const haze = (x, y) => {
        const d = Math.hypot(x - 540, y - 600) / 250;
        return d < 1 ? 0.22 * (1 - d * 0.5) : 0;
      };
      L.stipple(ctx, null, { bounds: [280, 340, 520, 520], spacing: 7.5, density: haze, r: [0.8, 1.5], color: LAV, alpha: 0.3, seed: sd('haze') });
      L.guideCircle(ctx, 540, 600, 250, { alpha: 0.17, width: 1.5, cross: 22 });
      L.guideCircle(ctx, 540, 600, 212, { alpha: 0.09, width: 1, dash: [2, 8] });
      L.ticks(ctx, 540, 600, { r: 250, n: 120, len: 7, major: 10, majorLen: 16, inward: true, alpha: 0.24, width: 1, color: LAV });
      // horizontal and vertical construction lines through the mouth and the ovary
      {
        const c = new Path2D();
        c.moveTo(250, MOUTH[1]);
        c.lineTo(830, MOUTH[1]);
        c.moveTo(250, OVARY.y);
        c.lineTo(830, OVARY.y);
        c.moveTo(540, 320);
        c.lineTo(540, 880);
        strokeP(ctx, c, LAV, 0.16, 1, [14, 4, 2, 4]);
      }
