        const u = clamp(ds / T_SINK);
        // a short drop to the surface, then a slowing sink, drifting right with the flow
        const settle = FLOOR - 30 - 50 * h3(ev.k + 20, j, sd('settle'));
        const y = ds < 2 * FR ? lerp(CHUTE1[1], SURF + 10, ds / (2 * FR)) : lerp(SURF + 10, settle, E.outQuad(clamp((ds - 2 * FR) / (T_SINK - 2 * FR))));
        const sway = Math.sin(ds * 9 + j * 1.7 + ev.k) * 12 * (1 - u);
        const drift = 60 + 170 * h3(ev.k + 40, j, sd('drift'));
        const x = x0 + drift * E.outQuad(u) + sway + j * 22;
        return { x, y, rot: 0.6 + ds * 2.5 * (1 - u) + j, stage: 3, under: y > SURF + 12, u };
      };
      for (const ev of EVENTS) {
        for (let j = 0; j < ev.nb; j++) {
          const s = beanState(ev, j, tw);
          if (!s) continue;
          if (s.stage === 3 && s.under && s.u < 0.7) {
            const bb = new Path2D();
            for (let q = 1; q <= 4; q++) {
              const by = s.y - 18 - q * 24 - (tw * 60) % 24;
              if (by < SURF + 8) continue;
              const bx = s.x + 6 * Math.sin(q * 1.7 + tw * 6 + j) + 4;
              const br = 2.5 + q * 0.9;
              bb.moveTo(bx + br, by);
              bb.arc(bx, by, br, 0, TAU);
            }
            ctx.save();
            ctx.fillStyle = L.rgba(P.white, 0.45);
            ctx.fill(bb);
            ctx.restore();
            strokePath(ctx, bb, P.white, (1 - s.u) * 0.9, 1.6);
          }
          bean(ctx, L, P, s.x, s.y, s.rot, 1, sd('bn', ev.k, j), { under: s.under });
        }
      }

      // ---- 5 floaters, surface, splash -------------------------------------------------
      for (let i = 0; i < 2; i++) {
        const [fx, fy] = FLOAT[i];
        const bob = 5 * Math.sin(TAU * (tw / 0.75) + i * 2.1);
        const roll = 0.25 * Math.sin(TAU * (tw / 1.5) + i);
        cherry(ctx, L, P, fx + 3 * Math.sin(tw * 3 + i), fy + bob, 30, roll + (i ? 0.4 : -0.3), 'g', sd('fl', i));
        // the part under the surface reads through the water
        ctx.save();
        ctx.beginPath();
        ctx.rect(fx - 50, SURF + 2, 100, 60);
        ctx.clip();
        ctx.fillStyle = P.water;
        ctx.globalAlpha = 0.55;
        ctx.fillRect(fx - 50, SURF + 2, 100, 60);
        const wh = new Path2D();
        for (let y = SURF + 8; y < SURF + 60; y += 7) {
          wh.moveTo(fx - 40, y);
          wh.lineTo(fx + 40, y);
        }
        ctx.restore();
        ctx.save();
        ctx.beginPath();
        ctx.ellipse(fx, fy + bob, 31, 34, 0, 0, TAU);
        ctx.clip();
        strokePath(ctx, wh, P.waterDeep, 0.6, 1.3);
        ctx.restore();
      }
      // the surface line with travelling ripples
      {
        const pts = [];
        for (let x = -20; x <= 1100; x += 12) {
          let y = SURF + 2.5 * Math.sin(x * 0.025 - info.T * 5) + 1.5 * Math.sin(x * 0.061 + info.T * 3);
          // rings round the floaters
          for (const [fx] of FLOAT) {
            const d = Math.abs(x - fx);
            if (d < 90) y += 3 * Math.cos(d * 0.12 - info.T * 9) * (1 - d / 90);
          }
          pts.push([x, y]);
        }
        L.inkPath(ctx, pts, { width: 3.4, seed: sd('surf'), taper: 0 });
        const hl = new Path2D();
        for (let i = 0; i < 22; i++) {
          const x = (i * 53 + ((info.T * 40) % 53) + 20 * h3(i, 0, sd('hl'))) % 1100;
          const y = SURF + 10 + 30 * h3(i, 1, sd('hl'));
          hl.moveTo(x, y);
          hl.lineTo(x + 14 + 10 * h3(i, 2, sd('hl')), y);
        }
        strokePath(ctx, hl, P.white, 0.75, 2);
      }
      // entry plips for every bean group, and the big splash on the beat
      for (const ev of EVENTS) {
        const tEnter = ev.te + T_DRUM + T_CHUTE + 2 * FR;
        const d = t - tEnter;
        const big = ev.nb > 2;
        const dur = big ? 14 * FR : 8 * FR;
        if (d < -FR || d > dur) continue;
        const u = clamp((d + FR) / dur);
        const cx = CHUTE1[0] - 10;
        const rr = (big ? 130 : 50) * E.outExpo(u);
        ctx.save();
        ctx.globalAlpha = 1 - u;
        ctx.strokeStyle = P.white;
        ctx.lineWidth = big ? 4 : 2.5;
        ctx.beginPath();
        ctx.ellipse(cx, SURF + 2, rr, rr * 0.18, 0, 0, TAU);
        ctx.stroke();
        if (big) {
          ctx.strokeStyle = P.ink;
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.ellipse(cx, SURF + 2, rr * 0.7, rr * 0.12, 0, 0, TAU);
          ctx.stroke();
        }
        ctx.restore();
        // droplets thrown up on twos
        const ud = clamp((L.onTwos(t) - tEnter + FR) / (big ? 12 * FR : 6 * FR));
        if (ud > 0 && ud < 1) {
          const n = big ? 14 : 5;
          for (let i = 0; i < n; i++) {
            const a = lerp(-160, -20, (i + 0.5) / n) * DEG;
            const sp = (big ? 260 : 120) * (0.6 + 0.6 * h3(i, ev.k, sd('drop')));
            const x = cx + Math.cos(a) * sp * ud;
            const y = SURF + Math.sin(a) * sp * ud + 0.5 * 900 * ud * ud * (big ? 0.5 : 0.25);
            const r = (big ? 7 : 4.5) * (1 - 0.4 * ud);
            ctx.save();
            ctx.fillStyle = P.white;
            ctx.strokeStyle = P.ink;
            ctx.lineWidth = 1.8;
            ctx.beginPath();
            ctx.ellipse(x, y, r * 0.8, r, a + Math.PI / 2, 0, TAU);
            ctx.fill();
            ctx.stroke();
            ctx.restore();
          }
          if (big) {
            // a crown of water at the entry point
            const cr = new Path2D();
            const hgt = 90 * Math.sin(Math.PI * ud);
            for (let i = 0; i < 7; i++) {
              const xx = cx - 60 + i * 20;
              cr.moveTo(xx, SURF);
              cr.quadraticCurveTo(xx + (i - 3) * 4, SURF - hgt * (0.6 + 0.4 * h3(i, 3, sd('crown'))), xx + (i - 3) * 9, SURF - hgt * (0.9 + 0.2 * h3(i, 4, sd('crown'))));
            }
            strokePath(ctx, cr, P.white, 0.95, 4);
            strokePath(ctx, cr, P.ink, 0.7, 1.4);
          }
        }
      }

      // ---- 6 overlays --------------------------------------------------------------------
      // annBlue flow arrows along the channel (water flowing right), dashes travelling
      for (let i = 0; i < 3; i++) {
        const y0 = 1120 + i * 135;
        const x0 = 90 + (i % 2) * 140, x1 = x0 + 560;
        const path = new Path2D();
        const pts = [];
        for (let k = 0; k <= 30; k++) {
          const x = lerp(x0, x1, k / 30);
          pts.push([x, y0 + 16 * Math.sin((k / 30) * Math.PI * 1.6 + i)]);
        }
        pts.forEach((p, k) => (k ? path.lineTo(p[0], p[1]) : path.moveTo(p[0], p[1])));
        strokePath(ctx, path, P.annBlue, 0.95, 2.5, [14, 10], -info.T * 70);
        const e = pts[pts.length - 1], q = pts[pts.length - 3];
        const a = Math.atan2(e[1] - q[1], e[0] - q[0]);
        const ah = new Path2D();
        ah.moveTo(e[0] + Math.cos(a) * 6, e[1] + Math.sin(a) * 6);
        ah.lineTo(e[0] - Math.cos(a - 0.5) * 16, e[1] - Math.sin(a - 0.5) * 16);
        ah.lineTo(e[0] - Math.cos(a + 0.5) * 16, e[1] - Math.sin(a + 0.5) * 16);
        ah.closePath();
        ctx.save();
        ctx.fillStyle = P.annBlue;
        ctx.fill(ah);
        ctx.restore();
      }
      // a dashed annBlue path for the beans: drum, chute, water
      {
        const p = new Path2D();
        p.arc(DRUM.x, DRUM.y, 166, GAP_A, 64 * DEG);
        p.lineTo(CHUTE1[0], CHUTE1[1] - 14);
        p.quadraticCurveTo(CHUTE1[0] - 40, SURF + 40, CHUTE1[0] + 20, SURF + 200);
        strokePath(ctx, p, P.annBlue, 0.55, 2, [8, 9], -info.T * 50);
      }
      // annYellow ring round the left floater (unripe floats)
      {
        const [fx, fy] = FLOAT[0];
        const bob = 5 * Math.sin(TAU * (tw / 0.75));
        const pulse = 1 + 0.04 * Math.sin(TAU * (t / 0.75));
        ctx.save();
        ctx.strokeStyle = P.annYellow;
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(fx, fy + bob, 58 * pulse, 0, TAU);
        ctx.stroke();
        ctx.setLineDash([6, 8]);
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(fx, fy + bob, 72 * pulse, -2.4, -0.7);
        ctx.stroke();
        ctx.restore();
      }
      // annMagenta change ring where skin meets bean at the gap, on each pop (8 frames)
      for (const ev of EVENTS) {
        const d = t - ev.te;
        if (d < 0 || d > 8 * FR) continue;
        const u = clamp(d / (8 * FR) + 1 / 8);
        ctx.save();
        ctx.globalAlpha = 1 - sstep(0.5, 1, u);
        ctx.strokeStyle = P.annMagenta;
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(gapPt[0], gapPt[1], 22 + 40 * E.outExpo(u), 0, TAU);
        ctx.stroke();
        ctx.restore();
      }
    },
  });
})();

</script>
<script>
// ---- src/scenes/10-drying-patio.js
// 10 drying-patio: "Seven suns on the patio". T 18.00 to 21.00, illustrated, hard cut.
// A time-passage hold: a raised drying bed of parchment coffee seen from above-front while the sun
// crosses its arc seven times (six days of one 8th each, then a slow seventh day over the last two
// beats). A rake drags once per day, leaving furrows; the beans dry from glistening mucilage-wet to
// pale parchment; a seven-circle day tally fills top left.
//
// Layers, back to front:
//   1 stripes stripeCream / stripeSage (sky, top 45 percent), drifting 6 px per beat
//   2 sun-path arc (dotted annYellow) and the sun disc on it (on twos)
//   3 far ridge and near ridge of coffee hills, the patio ground with converging slab seams
//   4 night pass: navy wash on the sky band for the last 2 frames of days 1 to 6
//   5 under the bed: shadow, legs, contact shadows
//   6 the bed frame: back, left and right rails, the front board
//   7 the bean field: two cached layers (wet and dry) crossfaded, plus live glints while wet
//   8 rake furrows (current day and the day before), the bean ridge pushed by the head
//   9 the rake: head with tines, handle running out of frame at the bottom
//  10 overlays: annBlue dashed rake path and vapour wisps, annYellow day tally (screen-fixed)
(function () {
  'use strict';

  const ID = 'drying-patio';
  const TAU = Math.PI * 2;
  const FR = 1 / 24;
  const clamp = (v, a = 0, b = 1) => (v < a ? a : v > b ? b : v);
  const lerp = (a, b, u) => a + (b - a) * u;
  const sstep = (a, b, x) => {
    const u = clamp((x - a) / (b - a));
    return u * u * (3 - 2 * u);
  };
  const sd = (...k) => FILM.lib.hash(ID, ...k) & 0x7fffffff;

  // ---------------------------------------------------------------------------
  // layout (storyboard 10)
  // ---------------------------------------------------------------------------
  const SKY_Y = 864; // sky band: top 45 percent
  const BACK_Y = 1000, FRONT_Y = 1600;
  const leftX = (y) => lerp(90, -40, (y - BACK_Y) / (FRONT_Y - BACK_Y));
  const rightX = (y) => lerp(990, 1120, (y - BACK_Y) / (FRONT_Y - BACK_Y));
  const depthScale = (y) => lerp(0.58, 1.0, clamp((y - BACK_Y) / (FRONT_Y - BACK_Y)));
  const BED = [[90, BACK_Y], [990, BACK_Y], [1120, FRONT_Y], [-40, FRONT_Y]];

  // sun-path arc: the circle through (60, 700), (540, 330), (1020, 700)
  const ARC_CX = 540;
  const ARC_CY = (480 * 480 + 700 * 700 - 330 * 330) / (2 * (700 - 330));
  const ARC_R = ARC_CY - 330;
  const ARC_A0 = Math.atan2(700 - ARC_CY, 60 - ARC_CX);
  const ARC_A1 = Math.atan2(700 - ARC_CY, 1020 - ARC_CX);
  const SUN_R = 44;

  // day tally: 7 circles at y 250 from x 120 to 480
  const TALLY_Y = 250, TALLY_X0 = 120, TALLY_DX = 60, TALLY_R = 17;

  // rake: the handle runs from (700, 1600) up to the head near (980, 1180); the head drags toward
  // the viewer along the handle and back, once per day
  const HEAD_FAR = [962, 1207];
  const HEAD_NEAR = [818, 1423];
  const RD = (() => {
    const dx = HEAD_NEAR[0] - HEAD_FAR[0], dy = HEAD_NEAR[1] - HEAD_FAR[1];
    const l = Math.hypot(dx, dy);
    return [dx / l, dy / l]; // toward the viewer
  })();
  const RP = [RD[1], -RD[0]]; // across the rake (points right-down)
  const DAY_OFF = [-34, 16, -10, 30, -24, 8, 0]; // lateral shift of each day's stroke
  const TINES = 7, TINE_GAP = 25;

  // ---------------------------------------------------------------------------
  // timing: frame-exact days
  // ---------------------------------------------------------------------------
  function timing(t) {
    const f = Math.min(71, Math.floor(t * 24 + 1e-6));
    let day, df, len;
    if (f < 54) {
      day = Math.floor(f / 9);
      df = f - day * 9;
      len = 9;
    } else {
      day = 6;
      df = f - 54;
      len = 18;
    }
    const df2 = df - (df % 2); // on twos
    const night = day < 6 && df >= 7;
    // sun: rises at the left end on the day's first frame, sets at the right end
    const su = day < 6 ? Math.min(1, df2 / 6) : Math.min(1, df2 / 12);
    // rake: out and back over the day
    const ru = day < 6 ? df2 / 8 : df2 / 16;
    const rs = Math.sin(Math.PI * ru);
    const rmax = ru <= 0.5 ? rs : 1;
    const dayF = f < 54 ? f / 9 : 6 + (f - 54) / 18;
    const wet = 1 - clamp(dayF / 5);
    return { f, day, df, len, night, su, ru, rs, rmax, dayF, wet };
  }
  // the frame on which tally circle k (0-based) fills
  const tallyFrame = (k) => (k < 6 ? k * 9 + 7 : 66);

  // ---------------------------------------------------------------------------
  // helpers
  // ---------------------------------------------------------------------------
  function canvas(w, h) {
    if (FILM.makeCanvas) return FILM.makeCanvas(w, h);
    const c = document.createElement('canvas');
    c.width = w;
    c.height = h;
    return c;
  }
  function polyPath(pts, closed = true) {
    const p = new Path2D();
    pts.forEach((q, i) => (i ? p.lineTo(q[0], q[1]) : p.moveTo(q[0], q[1])));
    if (closed) p.closePath();
    return p;
  }
  function strokeP(ctx, path, color, alpha, width, dash) {
    ctx.save();
    ctx.strokeStyle = color;
    ctx.globalAlpha *= alpha;
    ctx.lineWidth = width;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    if (dash) ctx.setLineDash(dash);
    ctx.stroke(path);
    ctx.restore();
  }
  function fillP(ctx, path, color, alpha = 1) {
    ctx.save();
    ctx.globalAlpha *= alpha;
    ctx.fillStyle = color;
    ctx.fill(path);
    ctx.restore();
  }
  function quad(a, b, c, d) {
    return [a, b, c, d];
  }
  // a tapered ribbon polygon around a polyline
  function ribbon(pts, w0, w1) {
    const n = pts.length;
    const L = [], R = [];
    for (let i = 0; i < n; i++) {
      const a = pts[Math.max(0, i - 1)], b = pts[Math.min(n - 1, i + 1)];
      let tx = b[0] - a[0], ty = b[1] - a[1];
      const tl = Math.hypot(tx, ty) || 1;
      tx /= tl;
      ty /= tl;
      const w = lerp(w0, w1, i / (n - 1)) / 2;
      L.push([pts[i][0] - ty * w, pts[i][1] + tx * w]);
      R.push([pts[i][0] + ty * w, pts[i][1] - tx * w]);
    }
    return L.concat(R.reverse());
  }

  // ---------------------------------------------------------------------------
  // geometry (t-independent, built once)
  // ---------------------------------------------------------------------------
  let G = null;
  function geo(L) {
    if (G) return G;
    const g = {};
    // the bean field: rows back to front in a gently foreshortened plane
    const r = L.rng(sd('beans'));
    const rows = [];
    let y = BACK_Y + 3;
    while (y < FRONT_Y + 4) {
      const s = depthScale(y);
      const row = [];
      const x0 = leftX(y) - 12, x1 = rightX(y) + 12;
      let x = x0 + r() * 10 * s;
      while (x < x1) {
        const rx = 6.4 * s * r.range(0.82, 1.18);
        const ry = rx * r.range(0.6, 0.74);
        row.push({ x, y: y + r.range(-1.6, 1.6) * s, rx, ry, rot: r.range(-1.15, 1.15), tone: (r() * 3) | 0, h: r() });
        x += r.range(9.6, 12.6) * s;
      }
      rows.push(row);
      y += r.range(5.4, 6.6) * s;
    }
    g.rows = rows;
    // glint candidates: a sparse sample of beans
    g.glints = [];
    let k = 0;
    for (const row of rows) for (const b of row) if (((k++) * 2654435761) % 1000 < 34) g.glints.push(b);
    // raking patches: soft darker zones from earlier passes
    g.patches = [];
    for (let i = 0; i < 9; i++) g.patches.push([r.range(120, 960), r.range(1060, 1560), r.range(60, 150), r()]);
    // ridges
    // the far mountain: a terraced coffee slope with its peak left of centre
    const mtn = (x) => 826 - 205 * Math.exp(-Math.pow((x - 600) / 290, 2)) - 70 * Math.exp(-Math.pow((x - 130) / 150, 2)) + 9 * L.noise1(x * 0.011, sd('mtn')) + 4 * L.noise1(x * 0.04, sd('mtn2'));
    g.mtn = mtn;
    g.far = [];
    for (let x = -40; x <= 1120; x += 12) g.far.push([x, mtn(x)]);
    g.terraces = [];
    for (let k = 1; k <= 7; k++) {
      const row = [];
      for (let x = -40; x <= 1120; x += 14) {
        const y0 = mtn(x);
        const u = k / 8;
        row.push([x, lerp(y0, SKY_Y, u) + 6 * Math.sin(x * 0.01 + k) * u]);
      }
      g.terraces.push(row);
    }
    g.near = [];
    for (let x = -40; x <= 1120; x += 16) g.near.push([x, 842 + 14 * L.noise1(x * 0.005 + 7.3, sd('near')) + 5 * L.noise1(x * 0.02, sd('near2')) - 22 * Math.exp(-Math.pow((x - 820) / 180, 2))]);
    // coffee shrub rows on the near ridge (small bumps along contour rows)
    g.shrubs = [];
    const rs = L.rng(sd('shrubs'));
    for (let row = 0; row < 3; row++) {
      for (let x = -20; x < 1100; x += rs.range(26, 34)) {
        const i = clamp(Math.round((x + 40) / 16), 0, g.near.length - 1);
        const yy = g.near[i][1] + 7 + row * 8;
        if (yy > SKY_Y - 2) continue;
        g.shrubs.push([x + row * 11, yy, rs.range(7, 10) * (1 - row * 0.15)]);
      }
    }
    g.farShrubs = [];
    g.terraces.forEach((row, k) => {
      for (let i = 0; i < row.length; i++) {
        if (rs() < 0.25) continue;
        const [x, y] = row[i];
        if (y > g.near[clamp(Math.round((x + 40) / 16), 0, g.near.length - 1)][1] - 2) continue;
        g.farShrubs.push([x + rs.range(-4, 4), y - 2, rs.range(3, 5.5) * (0.7 + k * 0.06)]);
      }
    });
    // clouds: three, shifted each day
    g.clouds = [[200, 540, 150, 0.9], [740, 470, 200, 1], [980, 640, 120, 0.8]].map(([x, y, w, k], i) => {
      const r = L.rng(sd('cloud', i));
      const bumps = [];
      const n = 5 + i;
      for (let j = 0; j < n; j++) bumps.push([lerp(-0.9, 0.9, j / (n - 1)) * w * 0.55, -r.range(0.35, 0.75) * w * 0.4 * (1 - Math.pow(lerp(-1, 1, j / (n - 1)), 2) * 0.5), r.range(0.22, 0.32) * w]);
      return { x, y, w, k, bumps };
    });
    // vapour wisps: bases on the bed
    g.wisps = [];
    const rw = L.rng(sd('wisps'));
    for (let i = 0; i < 10; i++) g.wisps.push({ x: rw.range(110, 900), y: rw.range(1080, 1520), ph: rw(), h: rw.range(60, 110) });
    G = g;
    return g;
  }

  // ---------------------------------------------------------------------------
  // the bean field sprite (wet or dry), cached; boil-free so it never needs redrawing
  // ---------------------------------------------------------------------------
  const SPR_Y = 990, SPR_H = 620;
  function beanField(L, P, wet) {
    const S = FILM.S || 1;
    return L.cached(['bean-field', ID, wet ? 'wet' : 'dry', S].join('|'), () => {
      const g = geo(L);
      const c = canvas(Math.round(1080 * S), Math.round(SPR_H * S));
      const x = c.getContext('2d');
      x.scale(S, S);
      x.translate(0, -SPR_Y);
      x.save();
      x.beginPath();
      L.tracePath(x, BED, true);
      x.clip();
      const pal = wet
        ? {
            gap: L.mix(P.parchmentDeep, P.ink, 0.6),
            shadow: L.mix(P.parchmentDeep, P.ink, 0.42),
            tones: [L.mix(P.mucilage, P.ochre, 0.12), L.mix(P.mucilage, P.parchmentDeep, 0.45), L.mix(P.mucilage, P.ochre, 0.3)],
            hi: P.white,
            line: 0.42,
          }
        : {
            gap: L.mix(P.parchmentDeep, P.inkSoft, 0.32),
            shadow: P.parchmentDeep,
            tones: [P.parchment, L.mix(P.parchment, P.white, 0.4), L.mix(P.parchment, P.parchmentDeep, 0.3)],
            hi: P.white,
            line: 0.28,
          };
      x.fillStyle = pal.gap;
      x.fillRect(-60, BACK_Y - 10, 1200, FRONT_Y - BACK_Y + 20);
      for (const row of g.rows) {
        const sh = new Path2D(), hi = new Path2D();
        const tp = [new Path2D(), new Path2D(), new Path2D()];
        for (const b of row) {
          const o = 1.1 * depthScale(b.y);
          sh.moveTo(b.x + o + b.rx, b.y + o);
          sh.ellipse(b.x + o, b.y + o, b.rx + 0.5, b.ry + 0.5, b.rot, 0, TAU);
          tp[b.tone].moveTo(b.x - o * 0.4 + b.rx, b.y - o * 0.4);
          tp[b.tone].ellipse(b.x - o * 0.4, b.y - o * 0.4, b.rx, b.ry, b.rot, 0, TAU);
          if (b.h < 0.55) {
            // a lit fleck on the upper left of the hull
            const hx = b.x - o * 0.4 - b.rx * 0.38, hy = b.y - o * 0.4 - b.ry * 0.42;
            hi.moveTo(hx + b.rx * 0.28, hy);
            hi.ellipse(hx, hy, b.rx * 0.28, b.ry * 0.22, b.rot, 0, TAU);
          }
        }
        fillP(x, sh, pal.shadow, 0.95);
        for (let i = 0; i < 3; i++) fillP(x, tp[i], pal.tones[i]);
        fillP(x, hi, pal.hi, wet ? 0.55 : 0.35);
      }
      // raking patches: slightly deeper tone where beans were turned
      for (const [px, py, pr, ph] of g.patches) {
        L.hatch(x, null, {
          bounds: [px - pr, py - pr * 0.5, pr * 2, pr],
          spacing: 7,
          width: 1.1,
          color: pal.shadow,
          alpha: 0.35,
          length: [8, 22],
          seed: sd('patch', px | 0, wet ? 1 : 0),
          boil: 0,
          density: (hx, hy) => 0.8 * (1 - clamp(Math.hypot((hx - px) / pr, (hy - py) / (pr * 0.5)))) * (0.6 + 0.4 * ph),
        });
      }
      // the left rail's shadow falls across the beans next to it (light from upper left)
      const shade = [[90, BACK_Y], [134, BACK_Y], [26, FRONT_Y], [-40, FRONT_Y]];
      L.hatch(x, shade, { spacing: 5, width: 1.3, color: P.ink, alpha: 0.55, length: [10, 30], seed: sd('railshade', wet ? 1 : 0), boil: 0 });
      // the back rail's shadow: a thin band
      L.hatch(x, [[90, BACK_Y], [990, BACK_Y], [994, BACK_Y + 16], [87, BACK_Y + 16]], { spacing: 5, width: 1.2, color: P.ink, alpha: 0.5, length: [12, 34], seed: sd('backshade', wet ? 1 : 0), boil: 0 });
      x.restore();
      return c;
    });
  }

  // ---------------------------------------------------------------------------
  // background: stripes, sun arc, sun, hills, patio
  // ---------------------------------------------------------------------------
  function sunRays(x, y) {
    const out = [];
    for (let i = 0; i < 12; i++) {
      const a = (i / 12) * TAU + 0.13;
      const long = i % 2 === 0;
      const r0 = SUN_R + 10, r1 = SUN_R + (long ? 36 : 24);
      out.push([x + Math.cos(a) * r0, y + Math.sin(a) * r0, x + Math.cos(a) * r1, y + Math.sin(a) * r1]);
    }
    return out;
  }
  function drawSun(ctx, L, P, x, y) {
    const seed = sd('sun');
    sunRays(x, y).forEach((q, i) => L.inkLine(ctx, q[0], q[1], q[2], q[3], { width: 3.6, seed: seed + i, taper: [2, 8], wobble: 0.4 }));
    const disc = L.ellipsePts(x, y, SUN_R, SUN_R, 40);
    L.inkPath(ctx, disc, { closed: true, fill: P.sun, width: 3.6, seed: seed + 20 });
    L.hatch(ctx, disc, { spacing: 5, width: 1.3, color: P.ochre, alpha: 0.85, seed: seed + 21, length: [8, 26], density: (px, py) => sstep(0.05, 0.7, ((px - x) * 0.6 + (py - y) * 0.8) / SUN_R) });
    L.stipple(ctx, disc, { spacing: 7, r: [0.8, 1.4], color: P.ochre, alpha: 0.7, seed: seed + 23, density: (px, py) => 0.6 * sstep(-0.2, 0.4, ((px - x) * 0.6 + (py - y) * 0.8) / SUN_R) });
    L.inkPath(ctx, [[x - 27, y - 13], [x - 17, y - 27], [x - 3, y - 33]], { width: 3, color: P.white, alpha: 0.85, seed: seed + 22, taper: [6, 8] });
  }
  function sunPos(u) {
    const a = lerp(ARC_A0, ARC_A1, u);
    return [ARC_CX + Math.cos(a) * ARC_R, ARC_CY + Math.sin(a) * ARC_R];
  }

  function cloudPts(c, ox) {
    // the upper outline as a union of bumps, a flat-ish bottom
    const pts = [];
    const w = c.w;
    const n = 90;
    for (let i = 0; i <= n; i++) {
      const x = lerp(-w * 0.78, w * 0.78, i / n);
      let top = 0;
      for (const [bx, by, br] of c.bumps) {
        const d = br * br - (x - bx) * (x - bx);
        if (d > 0) top = Math.min(top, by - Math.sqrt(d) + br * 0.6);
      }
      pts.push([c.x + ox + x, c.y + Math.min(top, -4)]);
    }
    pts.push([c.x + ox + w * 0.7, c.y + 10], [c.x + ox - w * 0.7, c.y + 10]);
    return pts;
  }
  function drawClouds(ctx, L, P, g, day, night) {
    g.clouds.forEach((c, i) => {
      let ox = day * (i === 1 ? 46 : 62) * (i === 2 ? -1 : 1);
      const pts = cloudPts(c, ox);
      L.inkPath(ctx, pts, { closed: true, fill: night ? L.mix(P.white, P.nightSky, 0.25) : P.white, width: 2.6, color: P.inkSoft, seed: sd('cloudline', i), taper: [6, 12] });
      L.hatch(ctx, pts, { spacing: 5, width: 1.2, color: P.inkSoft, alpha: 0.7, length: [10, 34], seed: sd('cloudh', i), density: (x, y) => sstep(c.y - c.w * 0.12, c.y + 6, y) * 0.9 + 0.3 * sstep(c.x + ox, c.x + ox + c.w * 0.8, x) * sstep(c.y - c.w * 0.3, c.y, y) });
    });
  }

  function drawHills(ctx, L, P, g, bo) {
    // far ridge
    const farPoly = g.far.concat([[1120, SKY_Y + 4], [-40, SKY_Y + 4]]);
    ctx.save();
    ctx.fillStyle = L.mix(P.stripeSage, P.sage, 0.55);
    ctx.beginPath();
    L.tracePath(ctx, farPoly, true);
    ctx.fill();
    ctx.restore();
    // shadow flank right of the peak, light from the upper left
    L.hatch(ctx, farPoly, { spacing: 7, width: 1.2, color: P.leafDeep, alpha: 0.55, angle: -0.95, length: [14, 44], boil: bo, seed: sd('farhatch'), density: (x, y) => 0.15 + 0.75 * sstep(560, 900, x) * (0.7 + 0.3 * L.noise1(y * 0.03, sd('fh'))) });
    L.crossHatch(ctx, farPoly, { spacing: 6, width: 1.1, color: P.leafDeep, alpha: 0.45, tone: 0.6, boil: bo, seed: sd('farx'), density: (x, y) => sstep(760, 1080, x) });
    const ter = new Path2D();
    for (const row of g.terraces) row.forEach((q, i) => (i ? ter.lineTo(q[0], q[1]) : ter.moveTo(q[0], q[1])));
    ctx.save();
    ctx.beginPath();
    L.tracePath(ctx, farPoly, true);
    ctx.clip();
    strokeP(ctx, ter, P.leafDeep, 0.5, 1.4);
    ctx.restore();
    const fs = new Path2D();
    for (const [x, y, r] of g.farShrubs) {
      fs.moveTo(x + r, y);
      fs.arc(x, y, r, 0, TAU);
    }
    fillP(ctx, fs, P.leafDeep, 0.45);
    L.inkPath(ctx, g.far, { width: 2.2, color: P.inkSoft, alpha: 0.85, boil: bo, seed: sd('farline'), taper: 0 });
    // near ridge with coffee rows
    const nearPoly = g.near.concat([[1120, SKY_Y + 4], [-40, SKY_Y + 4]]);
    ctx.save();
    ctx.fillStyle = P.sage;
    ctx.beginPath();
    L.tracePath(ctx, nearPoly, true);
    ctx.fill();
    ctx.restore();
    L.hatch(ctx, nearPoly, { spacing: 6, width: 1.3, color: P.leafDeep, alpha: 0.55, angle: -0.2, length: [10, 30], boil: bo, seed: sd('nearhatch'), density: (x, y) => 0.3 + 0.5 * sstep(-0.2, 0.7, L.noise1(x * 0.008 + 3, sd('nh'))) });
    const sh = new Path2D(), sl = new Path2D();
    for (const [x, y, r] of g.shrubs) {
      sh.moveTo(x + r, y);
      sh.ellipse(x, y, r, r * 0.8, 0, Math.PI, TAU);
      sh.closePath();
      sl.moveTo(x - r * 0.5, y - r * 0.4);
      sl.arc(x - r * 0.15, y - r * 0.2, r * 0.32, Math.PI, TAU);
    }
    fillP(ctx, sh, P.leafCoffee, 0.95);
    strokeP(ctx, sh, P.ink, 0.6, 1.1);
    fillP(ctx, sl, P.leafLight, 0.6);
    L.inkPath(ctx, g.near, { width: 3, color: P.ink, alpha: 0.9, boil: bo, seed: sd('nearline'), taper: 0 });
  }

  function drawPatio(ctx, L, P, bo) {
    // patio slab from the horizon line down behind and under the bed
    const top = SKY_Y;
    ctx.save();
    ctx.fillStyle = L.mix(P.paperShade, P.paper, 0.35);
    ctx.fillRect(0, top, 1080, 1920 - top);
    ctx.restore();
    // slab seams converge toward a far vanishing point; cross seams step with depth
    const VPY = -1080, VPX = 540;
    const seams = new Path2D();
    for (let i = -10; i <= 10; i++) {
      const xb = 540 + i * 150;
      const u0 = (top - VPY) / (1920 - VPY);
      seams.moveTo(lerp(VPX, xb, u0), top);
      seams.lineTo(xb, 1920);
    }
    let yy = top + 18;
    for (let k = 0; yy < 1920; k++) {
      seams.moveTo(0, yy);
      seams.lineTo(1080, yy);
      yy += 22 + k * 9;
    }
    strokeP(ctx, seams, P.inkFaint, 0.32, 1.4);
    // horizon hatching: a band of horizontal strokes under the ridge
    L.hatch(ctx, null, { bounds: [0, top + 2, 1080, 40], angle: 0, spacing: 6, width: 1.1, color: P.inkSoft, alpha: 0.35, length: [20, 70], boil: bo, seed: sd('patioband'), density: (x, y) => 1 - (y - top) / 40 });
  }

  // ---------------------------------------------------------------------------
  // the bed: under-shadow, legs, rails and front board
  // ---------------------------------------------------------------------------
  function drawUnder(ctx, L, P, bo) {
    // the shadow under the bed
    const shade = [[-60, 1660], [1140, 1660], [1140, 1920], [-60, 1920]];
    fillP(ctx, polyPath(shade), L.mix(P.paperShade, P.paperDeep, 0.6), 1);
    L.crossHatch(ctx, shade, { spacing: 6, crossSpacing: 8, width: 1.3, color: P.ink, alpha: 0.6, tone: 0.55, boil: bo, seed: sd('undershade'), density: (x, y) => 1 - 0.55 * sstep(1700, 1920, y) });
    // legs: back pair (deeper in shadow, shorter), front pair
    const legs = [[178, 1660, 1838, 30, 0.6], [902, 1660, 1838, 30, 0.6], [40, 1660, 1960, 46, 1], [1040, 1660, 1960, 46, 1]];
    legs.forEach(([x, y0, y1, w, k], i) => {
      const pts = [[x - w / 2, y0], [x + w / 2, y0], [x + w / 2 + 2, y1], [x - w / 2 - 2, y1]];
      // contact shadow on the ground
      if (y1 < 1920) {
        ctx.save();
        ctx.fillStyle = L.rgba(P.ink, 0.35);
        ctx.beginPath();
        ctx.ellipse(x + 10, y1, w * 1.1, 8, 0, 0, TAU);
        ctx.fill();
        ctx.restore();
      }
      L.inkPath(ctx, pts, { closed: true, fill: L.mix(P.wood, P.barkDeep, 1 - k * 0.7), width: 3, boil: bo, seed: sd('leg', i), taper: [4, 8] });
      L.hatch(ctx, [[x, y0], [x + w / 2, y0], [x + w / 2 + 2, y1], [x, y1]], { angle: Math.PI / 2 - 0.05, spacing: 5, width: 1.3, color: P.barkDeep, alpha: 0.85, length: [30, 90], boil: bo, seed: sd('leghatch', i) });
    });
  }

  function drawRails(ctx, L, P) {
    const wood = P.wood;
    // back rail (thin, far)
    const back = [[80, 986], [1000, 986], [992, BACK_Y + 1], [88, BACK_Y + 1]];
    L.inkPath(ctx, back, { closed: true, fill: wood, width: 2.6, seed: sd('backrail'), taper: [4, 8] });
    L.hatch(ctx, back, { angle: 0, spacing: 4, width: 1, color: P.barkDeep, alpha: 0.6, length: [30, 80], seed: sd('backrailh'), density: 0.5 });
    // side rails (top faces)
    const left = [[80, 986], [90, BACK_Y], [-40, FRONT_Y], [-62, 1604]];
    const right = [[1000, 986], [990, BACK_Y], [1120, FRONT_Y], [1142, 1604]];
    L.inkPath(ctx, left, { closed: true, fill: wood, width: 3, seed: sd('leftrail'), taper: [4, 8] });
    L.inkPath(ctx, right, { closed: true, fill: L.mix(wood, P.white, 0.15), width: 3, seed: sd('rightrail'), taper: [4, 8] });
    L.hatch(ctx, left, { angle: Math.atan2(600, -130), spacing: 4, width: 1.1, color: P.barkDeep, alpha: 0.7, length: [40, 120], seed: sd('leftrailh') });
    // front board: top face and front face
    const topF = [[-62, 1596], [1142, 1596], [1142, 1612], [-62, 1612]];
    const face = [[-62, 1612], [1142, 1612], [1142, 1664], [-62, 1664]];
    L.inkPath(ctx, face, { closed: true, fill: L.mix(wood, P.barkDeep, 0.25), width: 5, seed: sd('frontface'), taper: [4, 8] });
    L.hatch(ctx, face, { angle: 0.01, spacing: 5, width: 1.4, color: P.barkDeep, alpha: 0.8, length: [40, 160], seed: sd('frontfaceh'), density: (x, y) => 0.45 + 0.5 * sstep(1620, 1660, y) });
    // grain knots
    for (const [kx, ky] of [[220, 1636], [610, 1640], [890, 1632]]) {
      L.inkPath(ctx, L.ellipsePts(kx, ky, 16, 6, 18), { closed: true, width: 1.6, color: P.barkDeep, seed: sd('knot', kx), taper: [3, 6] });
      L.inkPath(ctx, [[kx - 70, ky + 8], [kx - 20, ky + 9], [kx, ky + 12], [kx + 26, ky + 9], [kx + 90, ky + 8]], { width: 1.4, color: P.barkDeep, alpha: 0.8, seed: sd('grain', kx) });
    }
    L.inkPath(ctx, topF, { closed: true, fill: L.mix(wood, P.white, 0.2), width: 4, seed: sd('fronttop'), taper: [4, 8] });
    // nail heads along the front board
    const nails = new Path2D();
    for (let x = 30; x < 1080; x += 150) {
      nails.moveTo(x + 3.5, 1626);
      nails.arc(x, 1626, 3.5, 0, TAU);
      nails.moveTo(x + 3.5, 1652);
      nails.arc(x, 1652, 3.5, 0, TAU);
    }
    fillP(ctx, nails, P.ink, 0.8);
  }

  // the static backdrop (patio, hills, under the bed), cached for two boil drawings
  const BD_Y = 560;
  function backdrop(L, P, g, b) {
    const S = FILM.S || 1;
    return L.cached(['backdrop', ID, b, S].join('|'), () => {
      const c = canvas(Math.round(1080 * S), Math.round((1920 - BD_Y) * S));
      const x = c.getContext('2d');
      x.scale(S, S);
      x.translate(0, -BD_Y);
      drawPatio(x, L, P, b);
      drawHills(x, L, P, g, b);
      drawUnder(x, L, P, b);
      return c;
    });
  }

  // ---------------------------------------------------------------------------
  // rake, furrows, overlays
  // ---------------------------------------------------------------------------
  function headAt(s, day) {
    const off = DAY_OFF[day];
    return [lerp(HEAD_FAR[0], HEAD_NEAR[0], s) + RP[0] * off, lerp(HEAD_FAR[1], HEAD_NEAR[1], s) + RP[1] * off];
  }

  function drawFurrows(ctx, L, P, day, smax, alpha, wet, bi) {
    if (smax <= 0.02 || alpha <= 0) return;
    const a = headAt(0, day), b = headAt(smax, day);
    const groove = new Path2D(), ridgeL = new Path2D(), ridgeD = new Path2D();
    const seed = sd('furrow', day);
    for (let j = 0; j < TINES; j++) {
      const n = 22;
      const pts = [];
      for (let i = 0; i <= n; i++) {
        const u = i / n;
        const x = lerp(a[0], b[0], u), y = lerp(a[1], b[1], u);
        const s = depthScale(y);
        const lat = (j - (TINES - 1) / 2) * TINE_GAP * s + 3.2 * L.noise1(u * 6 + j * 1.7, seed) + 0.8 * L.noise1(u * 20 + j, seed + bi);
        pts.push([x + RP[0] * lat, y + RP[1] * lat, s]);
      }
      pts.forEach((q, i) => (i ? groove.lineTo(q[0], q[1]) : groove.moveTo(q[0], q[1])));
      // ridges: lit on the left of each groove, shaded on the right
      pts.forEach((q, i) => {
        const o = 8 * q[2];
        const lx = q[0] - RP[0] * o, ly = q[1] - RP[1] * o;
        const rx = q[0] + RP[0] * o, ry = q[1] + RP[1] * o;
        if (i) {
          ridgeL.lineTo(lx, ly);
        } else ridgeL.moveTo(lx, ly);
        if (i) ridgeD.lineTo(rx, ry);
        else ridgeD.moveTo(rx, ry);
      });
    }
    const dark = L.mix(P.parchmentDeep, P.ink, 0.35 + 0.25 * wet);
    strokeP(ctx, groove, dark, 0.22 * alpha, 13);
    strokeP(ctx, groove, dark, 0.3 * alpha, 7);
    strokeP(ctx, groove, dark, 0.55 * alpha, 2.4, [16, 5]);
    strokeP(ctx, ridgeD, P.parchmentDeep, 0.55 * alpha, 2.4, [7, 4]);
    strokeP(ctx, ridgeL, P.white, 0.6 * alpha, 2.4, [9, 3]);
  }

  function drawRake(ctx, L, P, st, bi) {
    const h = headAt(st.rs, st.day);
    const s = depthScale(h[1]);
    const half = (TINES - 1) / 2 * TINE_GAP * s + 22 * s;
    // bean ridge pushed ahead of the head (toward the viewer) while it moves
    const push = st.rs > 0.05 ? 1 : 0.4;
    {
      const r = L.rng(sd('push', st.day, Math.round(st.rs * 8)));
      const pp = new Path2D(), ps = new Path2D();
      for (let i = 0; i < 70 * push; i++) {
        const u = r.range(-1, 1), v = r.range(0, 1);
        const x = h[0] + RP[0] * u * half + RD[0] * (8 + v * 16) * s;
        const y = h[1] + RP[1] * u * half + RD[1] * (8 + v * 16) * s;
        const rx = 6.2 * s * r.range(0.8, 1.15), ry = rx * 0.66, rot = r.range(-1.2, 1.2);
        ps.moveTo(x + 1.2 + rx, y + 1.2);
        ps.ellipse(x + 1.2, y + 1.2, rx, ry, rot, 0, TAU);
        pp.moveTo(x + rx, y);
        pp.ellipse(x, y, rx, ry, rot, 0, TAU);
      }
      const tone = L.mix(P.mucilage, P.parchment, 1 - st.wet);
      fillP(ctx, ps, L.mix(P.parchmentDeep, P.inkSoft, 0.4), 0.9);
      fillP(ctx, pp, tone);
      strokeP(ctx, pp, P.ink, 0.35, 0.7);
    }
    // handle: from the head toward the viewer and out of frame at the bottom
    const hEnd = [h[0] + RD[0] * 900, h[1] + RD[1] * 900];
    const hStart = [h[0] - RD[0] * 6, h[1] - RD[1] * 6];
    const hp = ribbon([hStart, [lerp(hStart[0], hEnd[0], 0.5), lerp(hStart[1], hEnd[1], 0.5)], hEnd], 13, 30);
    L.inkPath(ctx, hp, { closed: true, fill: L.mix(P.wood, P.white, 0.12), width: 3, seed: sd('handle'), taper: [4, 8] });
    // lengthwise hatching on the handle's shadow (right) half
    const hShade = [];
    for (let i = 0; i <= 8; i++) {
      const u = i / 8;
      const x = lerp(hStart[0], hEnd[0], u), y = lerp(hStart[1], hEnd[1], u), w = lerp(13, 30, u) / 2;
      hShade.push([x + RP[0] * w * 0.05, y + RP[1] * w * 0.05]);
    }
    for (let i = 8; i >= 0; i--) {
      const u = i / 8;
      const x = lerp(hStart[0], hEnd[0], u), y = lerp(hStart[1], hEnd[1], u), w = lerp(13, 30, u) / 2;
      hShade.push([x + RP[0] * w, y + RP[1] * w]);
    }
    L.hatch(ctx, hShade, { angle: Math.atan2(RD[1], RD[0]), spacing: 3.2, width: 1.1, color: P.barkDeep, alpha: 0.85, length: [30, 110], inset: 1, seed: sd('handleh') });
    // ferrule where the handle meets the head
    const fe = ribbon([[h[0] + RD[0] * 4, h[1] + RD[1] * 4], [h[0] + RD[0] * 26, h[1] + RD[1] * 26]], 18, 19);
    L.inkPath(ctx, fe, { closed: true, fill: P.steel, width: 2.2, seed: sd('ferrule'), taper: [3, 5] });
    // the head: a wooden bar across the stroke, tines buried in the beans
    const bar = [
      [h[0] - RP[0] * half - RD[0] * 12 * s, h[1] - RP[1] * half - RD[1] * 12 * s - 10 * s],
      [h[0] + RP[0] * half - RD[0] * 12 * s, h[1] + RP[1] * half - RD[1] * 12 * s - 10 * s],
      [h[0] + RP[0] * half + RD[0] * 9 * s, h[1] + RP[1] * half + RD[1] * 9 * s + 4 * s],
      [h[0] - RP[0] * half + RD[0] * 9 * s, h[1] - RP[1] * half + RD[1] * 9 * s + 4 * s],
    ];
    // tines hang from the bar into the beans (their tips buried)
    const tines = new Path2D(), tips = new Path2D();
    for (let j = 0; j < TINES; j++) {
      const lat = (j - (TINES - 1) / 2) * TINE_GAP * s;
      const x = h[0] + RP[0] * lat + RD[0] * 6 * s, y = h[1] + RP[1] * lat + RD[1] * 6 * s;
      tines.moveTo(x, y);
      tines.lineTo(x + RD[0] * 8 * s, y + 36 * s);
      tips.moveTo(x + RD[0] * 8 * s + 8 * s, y + 37 * s);
      tips.ellipse(x + RD[0] * 8 * s, y + 37 * s, 8 * s, 3.5 * s, 0, 0, TAU);
    }
    strokeP(ctx, tines, P.ink, 1, 6 * s);
    strokeP(ctx, tines, P.steel, 1, 2.4 * s);
    fillP(ctx, tips, L.mix(P.parchmentDeep, P.ink, 0.4), 0.8);
    L.inkPath(ctx, bar, { closed: true, fill: P.wood, width: 3.4, seed: sd('bar'), taper: [4, 8], double: true });
    L.hatch(ctx, [bar[3], bar[2], [lerp(bar[2][0], bar[1][0], 0.45), lerp(bar[2][1], bar[1][1], 0.45)], [lerp(bar[3][0], bar[0][0], 0.45), lerp(bar[3][1], bar[0][1], 0.45)]], { angle: Math.atan2(RP[1], RP[0]), spacing: 3.5, width: 1.1, color: P.barkDeep, alpha: 0.85, length: [20, 60], inset: 1, seed: sd('barh') });
  }

  function drawWisps(ctx, L, P, g, t, wet, dayF) {
    const k = clamp(1 - dayF / 4.6);
    if (k <= 0) return;
    const p = new Path2D();
    for (const w of g.wisps) {
      const ph = (t * 1.6 + w.ph) % 1; // rises and fades in a loop (24 fps overlay)
      const s = depthScale(w.y);
      const y0 = w.y - ph * 50 * s;
      const n = 10;
      for (let i = 0; i <= n; i++) {
        const u = i / n;
        const x = w.x + Math.sin(u * 5.2 + w.ph * 6 + t * 7) * 7 * s;
        const y = y0 - u * w.h * s;
        if (i) p.lineTo(x, y);
        else p.moveTo(x, y);
      }
    }
    strokeP(ctx, p, P.annBlue, 0.85 * k, 2);
  }

  function drawRakePath(ctx, L, P, st, t) {
    // a dashed annBlue guide beside the rake: both ways, drawn on over the day's first 6 frames
    const dayStart = st.day < 6 ? st.day * 9 : 54;
    const prog = L.ease.outExpo((st.f - dayStart + 1) / 6);
    const off = DAY_OFF[st.day] - 150;
    const a = [HEAD_FAR[0] + RP[0] * off, HEAD_FAR[1] + RP[1] * off];
    const b = [HEAD_NEAR[0] + RP[0] * off + RD[0] * 40, HEAD_NEAR[1] + RP[1] * off + RD[1] * 40];
    const e = [lerp(a[0], b[0], prog), lerp(a[1], b[1], prog)];
    ctx.save();
    ctx.strokeStyle = P.annBlue;
    ctx.fillStyle = P.annBlue;
    ctx.lineWidth = 2.5;
    ctx.lineCap = 'round';
    ctx.setLineDash([14, 10]);
    ctx.beginPath();
    ctx.moveTo(a[0], a[1]);
    ctx.lineTo(e[0], e[1]);
    ctx.stroke();
    ctx.setLineDash([]);
    const arrow = (p, dx, dy) => {
      ctx.beginPath();
      ctx.moveTo(p[0] + dx * 6, p[1] + dy * 6);
      ctx.lineTo(p[0] - dx * 12 - dy * 8, p[1] - dy * 12 + dx * 8);
      ctx.lineTo(p[0] - dx * 7, p[1] - dy * 7);
      ctx.lineTo(p[0] - dx * 12 + dy * 8, p[1] - dy * 12 - dx * 8);
      ctx.closePath();
      ctx.fill();
    };
    arrow(e, RD[0], RD[1]);
    if (prog > 0.98) arrow(a, -RD[0], -RD[1]);
    ctx.restore();
  }

  function drawTally(ctx, L, P, st) {
    ctx.save();
    ctx.lineCap = 'round';
    // the guide rule under the tally
    ctx.strokeStyle = P.annYellow;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(TALLY_X0 - 30, TALLY_Y + 34);
    ctx.lineTo(TALLY_X0 + 6 * TALLY_DX + 30, TALLY_Y + 34);
    for (let k = 0; k < 7; k++) {
      ctx.moveTo(TALLY_X0 + k * TALLY_DX, TALLY_Y + 28);
      ctx.lineTo(TALLY_X0 + k * TALLY_DX, TALLY_Y + 40);
    }
    ctx.stroke();
    for (let k = 0; k < 7; k++) {
      const x = TALLY_X0 + k * TALLY_DX, y = TALLY_Y;
      const ff = st.f - tallyFrame(k);
      ctx.save();
      ctx.translate(x, y);
      if (ff >= 0) {
        const sc = ff < 3 ? L.ease.outBack((ff + 1) / 3) : 1;
        ctx.scale(sc, sc);
        ctx.fillStyle = P.annYellow;
        ctx.beginPath();
        ctx.arc(0, 0, TALLY_R, 0, TAU);
        ctx.fill();
        // a little sun glyph knocked out of the disc
        ctx.fillStyle = P.white;
        ctx.globalAlpha = 0.8;
        ctx.beginPath();
        ctx.arc(0, 0, 4, 0, TAU);
        ctx.fill();
      } else {
        ctx.strokeStyle = P.annYellow;
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(0, 0, TALLY_R - 1.5, 0, TAU);
        ctx.stroke();
      }
      ctx.restore();
      // attention ring on a circle as it fills (expands and fades over 9 frames)
      if (ff >= 0 && ff < 9) {
        const u = (ff + 1) / 9;
        ctx.save();
        ctx.strokeStyle = P.annYellow;
        ctx.globalAlpha = 1 - sstep(0.3, 1, u);
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(x, y, lerp(TALLY_R + 4, TALLY_R + 26, L.ease.outExpo(u)), 0, TAU);
        ctx.stroke();
        ctx.restore();
      }
    }
    // the current day marker: a small caret under today's circle
    const cx = TALLY_X0 + st.day * TALLY_DX;
    ctx.fillStyle = P.annYellow;
    ctx.beginPath();
    ctx.moveTo(cx, TALLY_Y + 46);
    ctx.lineTo(cx - 7, TALLY_Y + 58);
    ctx.lineTo(cx + 7, TALLY_Y + 58);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  function drawGlints(ctx, L, P, g, wet, bi) {
    if (wet <= 0.02) return;
    const p = new Path2D(), x = new Path2D();
    let i = 0;
    for (const b of g.glints) {
      i++;
      if (L.h3(i, bi, 77) < 0.45) continue;
      const s = depthScale(b.y);
      const gx = b.x - b.rx * 0.35, gy = b.y - b.ry * 0.5;
      p.moveTo(gx + 1.6 * s, gy);
      p.arc(gx, gy, 1.6 * s, 0, TAU);
      if (i % 4 === 0) {
        const r = 5.5 * s;
        x.moveTo(gx - r, gy);
        x.lineTo(gx + r, gy);
        x.moveTo(gx, gy - r);
        x.lineTo(gx, gy + r);
      }
    }
    fillP(ctx, p, P.white, wet);
    strokeP(ctx, x, P.white, 0.9 * wet, 1.2);
  }

  // ---------------------------------------------------------------------------
  FILM.scene({
    id: ID,
    draw(ctx, tIn, info) {
      const L = info.lib, P = L.pal;
      const t = clamp(tIn, 0, info.dur);
      const g = geo(L);
      const st = timing(t);
      const bi = L.boil(info.T);

      // 1 stripes (sky)
      L.stripes(ctx, { colors: [P.stripeCream, P.stripeSage], width: 140, angle: -0.52, offset: (info.T / 0.75) * 6, bounds: [0, 0, 1080, SKY_Y + 40] });

      drawClouds(ctx, L, P, g, st.day, st.night);

      // 2 sun-path arc and sun
      ctx.save();
      ctx.strokeStyle = P.annYellow;
      ctx.lineWidth = 2.5;
      ctx.lineCap = 'round';
      ctx.setLineDash([0.01, 9]);
      ctx.beginPath();
      ctx.arc(ARC_CX, ARC_CY, ARC_R, ARC_A0, ARC_A1);
      ctx.stroke();
      ctx.restore();
      // hour ticks on the arc
      ctx.save();
      ctx.strokeStyle = P.annYellow;
      ctx.lineWidth = 2;
      ctx.beginPath();
      for (let i = 0; i <= 6; i++) {
        const a = lerp(ARC_A0, ARC_A1, i / 6);
        const l = i % 3 === 0 ? 14 : 8;
        ctx.moveTo(ARC_CX + Math.cos(a) * (ARC_R - l), ARC_CY + Math.sin(a) * (ARC_R - l));
        ctx.lineTo(ARC_CX + Math.cos(a) * (ARC_R + l), ARC_CY + Math.sin(a) * (ARC_R + l));
      }
      ctx.stroke();
      ctx.restore();
      if (!st.night) {
        const [sx, sy] = sunPos(st.su);
        // the trail of today's crossing (24 fps overlay behind the disc)
        ctx.save();
        ctx.strokeStyle = P.annYellow;
        ctx.lineWidth = 3;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.arc(ARC_CX, ARC_CY, ARC_R, ARC_A0, lerp(ARC_A0, ARC_A1, st.su));
        ctx.stroke();
        ctx.restore();
        drawSun(ctx, L, P, sx, sy);
      }

      // 3 hills and patio
      ctx.drawImage(backdrop(L, P, g, bi % 2), 0, BD_Y, 1080, 1920 - BD_Y);

      // 4 night pass
      if (st.night) {
        ctx.save();
        ctx.fillStyle = L.rgba(P.navy, 0.25);
        ctx.fillRect(0, 0, 1080, SKY_Y + 2);
        ctx.fillStyle = L.rgba(P.navy, 0.1);
        ctx.fillRect(0, SKY_Y + 2, 1080, 1920 - SKY_Y);
        ctx.restore();
        // a few stars in the dimmed band
        const r = L.rng(sd('stars', st.day));
        const sp = new Path2D();
        for (let i = 0; i < 14; i++) {
          const x = r.range(80, 1000), y = r.range(340, 760), rr = r.range(1.4, 2.6);
          sp.moveTo(x + rr, y);
          sp.arc(x, y, rr, 0, TAU);
        }
        fillP(ctx, sp, P.white, 0.85);
      }

      // 5-6 under the bed and the frame
      drawRails(ctx, L, P);

      // 7 the bean field: dry underneath, wet on top fading out
      ctx.drawImage(beanField(L, P, false), 0, SPR_Y, 1080, SPR_H);
      if (st.wet > 0.004) {
        // wet: the mucilage-slick beans read darker and warmer (a multiply tint over the dry field)
        ctx.save();
        ctx.globalCompositeOperation = 'multiply';
        ctx.globalAlpha = 0.85 * st.wet;
        ctx.fillStyle = L.mix(P.parchmentDeep, P.mucilage, 0.3);
        ctx.beginPath();
        L.tracePath(ctx, BED, true);
        ctx.fill();
        ctx.restore();
      }
      if (st.night) {
        ctx.save();
        ctx.fillStyle = L.rgba(P.navy, 0.1);
        ctx.beginPath();
        L.tracePath(ctx, BED, true);
        ctx.fill();
        ctx.restore();
      }

      // 8 furrows: yesterday's (settling) and today's
      ctx.save();
      ctx.beginPath();
      L.tracePath(ctx, BED, true);
      ctx.clip();
      if (st.day > 0) drawFurrows(ctx, L, P, st.day - 1, 1, 0.4, st.wet, bi);
      drawFurrows(ctx, L, P, st.day, st.rmax, 1, st.wet, bi);
      drawGlints(ctx, L, P, g, st.wet, bi);
      ctx.restore();

      // 9 the rake
      drawRake(ctx, L, P, st, bi);

      // 10 overlays
      drawWisps(ctx, L, P, g, t, st.wet, st.dayF);
      drawRakePath(ctx, L, P, st, t);
      drawTally(ctx, L, P, st);
    },
  });
})();

</script>
<script>
// ---- src/scenes/11-hulling.js
// 11 hulling: "Dry to eleven percent, then hulled". T 21.00 to 22.50, schematic, hard cut.
// The G1 bean inside its parchment hull loses its water as a moisture gauge falls to 18 percent of
// its height; on the beat at T 21.75 the hull cracks (magenta) and its two halves fly off left and
// right; at T 22.125 the bare G1 bean pulses once: green coffee. The last frame is the bare G1 bean,
// which 12 opens on, inked, on the same pixels.
//
// Layers, back to front:
//   1 blueprint plate (navy, grid, guide circles, diagonals), guide circle r 330 on the bean
//   2 measurement: length bracket along the bean axis, width bracket across, construction lines
//   3 moisture gauge at x 150 (tube, tick scale, schemWater level, drop bracket, target tick)
//   4 the G1 bean: hex lattice, stipple form, crease groove, silverskin line, double outline
//   5 water droplets (schemWater glow dots) drifting out and fading on twos
//   6 the parchment hull: double outline 22 px outside G1 with rectangular cells; crack and halves
//   7 inset node (hull section) with its network line
//   8 magenta crack, the bean pulse, the progress glyph (stage 1, u = p)
(function () {
  'use strict';

  const ID = 'hulling';
  const TAU = Math.PI * 2;
  const DEG = Math.PI / 180;
  const FR = 1 / 24;
  const clamp = (v, a = 0, b = 1) => (v < a ? a : v > b ? b : v);
  const lerp = (a, b, u) => a + (b - a) * u;
  const sstep = (a, b, x) => {
    const u = clamp((x - a) / (b - a));
    return u * u * (3 - 2 * u);
  };
  const sd = (...k) => FILM.lib.hash(ID, ...k) & 0x7fffffff;

  // beats (shot-local seconds)
  const B_CRACK = 0.75; // T 21.75, beat: the hull cracks
  const B_PULSE = 1.125; // T 22.125, 8th: the bare bean pulses

  // ---------------------------------------------------------------------------
  // G1: the bean, face-on (docs/storyboard.md, Shared geometry). Copied exactly.
  // ---------------------------------------------------------------------------
  const G1X = 540, G1Y = 900, G1ROT = -15 * DEG;
  const G1_CREASE = [[548, 682], [531, 750], [536, 826], [552, 900], [547, 976], [530, 1052], [538, 1118]];
  const G1_SILVER = [[546, 700], [538, 1100]];
  const CR = Math.cos(G1ROT), SR = Math.sin(G1ROT);
  const rot = (dx, dy) => [G1X + dx * CR - dy * SR, G1Y + dx * SR + dy * CR];
  function g1Local(n) {
    const out = [];
    const e = 2 / 2.3;
    for (let i = 0; i < n; i++) {
      const a = (i / n) * TAU;
      const c = Math.cos(a), s = Math.sin(a);
      let dx = 170 * Math.sign(c) * Math.pow(Math.abs(c), e);
      const dy = 240 * Math.sign(s) * Math.pow(Math.abs(s), e);
      dx *= 1 - (0.06 * (1 - dy / 240)) / 2;
      out.push([dx, dy]);
    }
    return out;
  }
  // offset a closed local outline along its outward normals
  function offsetLocal(pts, d) {
    const n = pts.length;
    return pts.map((p, i) => {
      const a = pts[(i - 1 + n) % n], b = pts[(i + 1) % n];
      let tx = b[0] - a[0], ty = b[1] - a[1];
      const tl = Math.hypot(tx, ty) || 1;
      // the outline runs clockwise on screen (y down), so the outward normal is (ty, -tx)
      return [p[0] + (ty / tl) * d, p[1] - (tx / tl) * d];
    });
  }
  const toWorld = (pts) => pts.map((p) => rot(p[0], p[1]));

  // ---------------------------------------------------------------------------
  // layout
  // ---------------------------------------------------------------------------
  const GAUGE_X = 150, GAUGE_Y0 = 600, GAUGE_Y1 = 1300, GAUGE_W = 44, GAUGE_END = 0.18;
  const NODE_X = 832, NODE_Y = 1430, NODE_R = 74;

  // ---------------------------------------------------------------------------
  // geometry (t-independent, built once)
  // ---------------------------------------------------------------------------
  let G = null;
  function geo(L) {
    if (G) return G;
    const g = {};
    const loc = g1Local(96);
    g.loc = loc;
    g.bean = toWorld(loc);
    g.inner = toWorld(offsetLocal(loc, -9));
    g.lattice = toWorld(offsetLocal(loc, -14));
    const hullLoc = offsetLocal(loc, 22);
    const hullInLoc = offsetLocal(loc, 13);
    g.hull = toWorld(hullLoc);
    g.hullIn = toWorld(hullInLoc);
    g.hullRing = [g.hull, toWorld(offsetLocal(loc, 3)).reverse()];
    // the halves: split at the top and bottom tips (local x = 0); each an open arc, top to bottom
    const half = (sign) => {
      const arc = (P) => {
        const pts = [];
        // indices from the top (a = -90 deg, i = 72) round to the bottom (i = 24) on the chosen side
        if (sign < 0) for (let i = 72; i >= 24; i--) pts.push(P[i % 96]);
        else for (let i = 72; i <= 120; i++) pts.push(P[i % 96]);
        return pts;
      };
      const o = arc(toWorld(hullLoc)), m = arc(toWorld(hullInLoc)), b = arc(toWorld(offsetLocal(loc, 3)));
      // rectangular cells: radial walls across the band every 4th sample
      const walls = [];
      for (let i = 2; i < o.length - 2; i += 3) walls.push([b[i], o[i]]);
      // jagged crack edges at the two tips
      const r = L.rng(sd('jag', sign));
      const jag = (p, q) => {
        const pts = [];
        for (let k = 0; k <= 4; k++) {
          const u = k / 4;
          pts.push([lerp(p[0], q[0], u) + (k % 2 ? sign * r.range(2, 6) : 0), lerp(p[1], q[1], u) + r.range(-1.5, 1.5)]);
        }
        return pts;
      };
      return { o, m, b, walls, jt: jag(b[0], o[0]), jb: jag(b[b.length - 1], o[o.length - 1]) };
    };
    g.halfL = half(-1);
    g.halfR = half(1);
    // crease and silverskin, rotated with the bean
    const cr = G1_CREASE.map((p) => rot(p[0] - G1X, p[1] - G1Y));
    g.crease = L.smoothPts(cr, false, 4);
    g.groove = groove(g.crease, 12, 3);
    // silverskin: the crease curve trimmed to y 700..1100 (pre-rotation), ends pinned to the given points
    const sv = [];
    const crLocal = L.smoothPts(G1_CREASE, false, 4);
    for (const p of crLocal) if (p[1] >= 700 && p[1] <= 1100) sv.push(p);
    const a0 = sv[0], a1 = sv[sv.length - 1];
    g.silver = sv.map((p, i) => {
      const u = i / (sv.length - 1);
      const dx = lerp(G1_SILVER[0][0] - a0[0], G1_SILVER[1][0] - a1[0], u);
      return rot(p[0] + dx * 0.5 - G1X, p[1] - G1Y);
    });
    // droplets: seeded inside the bean (local), drifting outward
    const r = L.rng(sd('drops'));
    g.drops = [];
    while (g.drops.length < 52) {
      const x = r.range(-150, 150), y = r.range(-215, 215);
      if (Math.pow(Math.abs(x / 150), 2.3) + Math.pow(Math.abs(y / 215), 2.3) > 1) continue;
      const ang = Math.atan2(y, x) + r.range(-0.4, 0.4);
      g.drops.push({
        p: rot(x, y),
        dir: [Math.cos(ang + G1ROT), Math.sin(ang + G1ROT)],
        dist: r.range(110, 230),
        t0: r.range(0, 0.42),
        dur: r.range(0.22, 0.34),
        keep: g.drops.length < 9, // about 18 percent of the water stays
        r: r.range(3.2, 4.8),
      });
    }
    // axis vectors on screen
    g.up = [SR, -CR]; // toward the narrow top tip
    g.across = [CR, SR];
    G = g;
    return g;
  }

  // a tapered groove polygon around the crease centreline
  function groove(pts, wMax, wEnd) {
    const n = pts.length;
    const Lp = [], Rp = [];
    for (let i = 0; i < n; i++) {
      const a = pts[Math.max(0, i - 1)], b = pts[Math.min(n - 1, i + 1)];
      let tx = b[0] - a[0], ty = b[1] - a[1];
      const tl = Math.hypot(tx, ty) || 1;
      tx /= tl;
      ty /= tl;
      const u = i / (n - 1);
      const w = (wEnd + (wMax - wEnd) * Math.pow(Math.sin(Math.PI * u), 0.55)) / 2;
      Lp.push([pts[i][0] - ty * w, pts[i][1] + tx * w]);
      Rp.push([pts[i][0] + ty * w, pts[i][1] - tx * w]);
    }
    return Lp.concat(Rp.reverse());
  }

  // ---------------------------------------------------------------------------
  // drawing helpers
  // ---------------------------------------------------------------------------
  function wobPts(L, pts, seed, amp, bi) {
    const n = pts.length;
    const out = new Array(n);
    let s = 0;
    const sdd = (seed + bi * 7919) | 0;
    for (let i = 0; i < n; i++) {
      const p = pts[i];
      if (i > 0) s += Math.hypot(p[0] - pts[i - 1][0], p[1] - pts[i - 1][1]);
      const a = pts[i > 0 ? i - 1 : 0], b = pts[i < n - 1 ? i + 1 : n - 1];
      const tx = b[0] - a[0], ty = b[1] - a[1];
      const tl = Math.hypot(tx, ty) || 1;
      const d = amp * L.noise1(s * 0.018, sdd);
      out[i] = [p[0] - (ty / tl) * d, p[1] + (tx / tl) * d];
    }
    return out;
  }
  function addPoly(path, pts, closed, dx = 0, dy = 0) {
    if (pts.length < 2) return;
    path.moveTo(pts[0][0] + dx, pts[0][1] + dy);
    for (let i = 1; i < pts.length; i++) path.lineTo(pts[i][0] + dx, pts[i][1] + dy);
    if (closed) path.closePath();
  }
  function wob(L, path, pts, seed, amp, bi, closed, dx = 0, dy = 0) {
    addPoly(path, wobPts(L, pts, seed, amp, bi), closed, dx, dy);
  }
  function stroke(ctx, path, color, alpha, width, dash) {
    if (alpha <= 0.002) return;
    ctx.save();
    ctx.strokeStyle = color;
    ctx.globalAlpha *= alpha;
    ctx.lineWidth = width;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    if (dash) ctx.setLineDash(dash);
    ctx.stroke(path);
    ctx.restore();
  }
  function glowStroke(ctx, path, color, k) {
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    stroke(ctx, path, color, 0.05 * k, 16);
    stroke(ctx, path, color, 0.08 * k, 7);
    ctx.restore();
  }

  // Progress glyph: canonical, copied verbatim from docs/storyboard.md.
  function progressGlyph(ctx, L, stage, u, T, allLit) {
    const P = L.pal, cx = 900, cy = 300, r = 46, gap = 6 * Math.PI / 180;
    const q = Math.PI / 2, pop = L.clamp(u * 6);
    ctx.save();
    ctx.lineCap = 'round';
    ctx.globalAlpha = 0.5; ctx.strokeStyle = P.lavender; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(cx, cy, r + 14, 0, Math.PI * 2); ctx.stroke();
    for (let i = 0; i < 4; i++) {
      const a0 = -q + i * q + gap / 2, a1 = a0 + q - gap;
      const past = allLit || i < stage, cur = !allLit && i === stage;
      ctx.globalAlpha = past ? 0.6 : 0.18;
      ctx.strokeStyle = P.lavender; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(cx, cy, r, a0, a1); ctx.stroke();
      if (cur || allLit) {
        const k = allLit ? 1 : L.clamp(u);
        const ae = a0 + (a1 - a0) * k;
        ctx.globalAlpha = 1; ctx.strokeStyle = P.lineWhite; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.arc(cx, cy, r, a0, ae); ctx.stroke();
        if (cur) L.glowDot(ctx, cx + Math.cos(ae) * r, cy + Math.sin(ae) * r, 4 + 2 * pop, { rays: 0, glow: 3.5, intensity: 0.8 });
      }
    }
    ctx.globalAlpha = 0.7; ctx.fillStyle = P.lineWhite;
    ctx.beginPath(); ctx.arc(cx, cy, 3, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  // ---------------------------------------------------------------------------
  // layers
  // ---------------------------------------------------------------------------
  function drawMeasure(ctx, L, P, g, bi) {
    const lav = P.lavender;
    // construction: the bean axis and the cross axis, long and faint
    const ax = new Path2D();
    const top = [G1X + g.up[0] * 330, G1Y + g.up[1] * 330], bot = [G1X - g.up[0] * 330, G1Y - g.up[1] * 330];
    ax.moveTo(top[0], top[1]);
    ax.lineTo(bot[0], bot[1]);
    ax.moveTo(G1X - g.across[0] * 300, G1Y - g.across[1] * 300);
    ax.lineTo(G1X + g.across[0] * 300, G1Y + g.across[1] * 300);
    stroke(ctx, ax, lav, 0.16, 1, [10, 8]);
    L.guideCircle(ctx, G1X, G1Y, 330, { alpha: 0.16, quadrants: 10, cross: 14 });
    L.guideCircle(ctx, G1X, G1Y, 268, { alpha: 0.1, dash: [3, 9] });
    L.ticks(ctx, G1X, G1Y, { r: 330, n: 72, len: 6, major: 6, majorLen: 14, alpha: 0.28 });
    // length bracket along the axis, to the right of the hull
    const off = 236;
    const a = [G1X + g.up[0] * 240 + g.across[0] * off, G1Y + g.up[1] * 240 + g.across[1] * off];
    const b = [G1X - g.up[0] * 240 + g.across[0] * off, G1Y - g.up[1] * 240 + g.across[1] * off];
    L.bracket(ctx, a[0], a[1], b[0], b[1], { color: lav, alpha: 0.6, cap: 16 });
    L.ticks(ctx, a[0] + g.across[0] * 18, a[1] + g.across[1] * 18, { length: 480, angle: Math.atan2(-g.up[1], -g.up[0]), n: 16, len: 8, major: 4, majorLen: 14, alpha: 0.45, side: -1, baseline: false });
    // width bracket across, below the bean
    const c = [G1X - g.across[0] * 170 - g.up[0] * 300, G1Y - g.across[1] * 170 - g.up[1] * 300];
    const d = [G1X + g.across[0] * 170 - g.up[0] * 300, G1Y + g.across[1] * 170 - g.up[1] * 300];
    L.bracket(ctx, c[0], c[1], d[0], d[1], { color: lav, alpha: 0.6, cap: 16 });
    // extension lines from the bean tips and sides to the brackets
    const ex = new Path2D();
    const tipT = rot(0, -240), tipB = rot(0, 240), sL = rot(-170, 0), sRr = rot(170, 0);
    ex.moveTo(tipT[0] + g.across[0] * 30, tipT[1] + g.across[1] * 30);
    ex.lineTo(a[0] + g.across[0] * 10, a[1] + g.across[1] * 10);
    ex.moveTo(tipB[0] + g.across[0] * 30, tipB[1] + g.across[1] * 30);
    ex.lineTo(b[0] + g.across[0] * 10, b[1] + g.across[1] * 10);
    ex.moveTo(sL[0] - g.up[0] * 40, sL[1] - g.up[1] * 40);
    ex.lineTo(c[0] - g.up[0] * 10, c[1] - g.up[1] * 10);
    ex.moveTo(sRr[0] - g.up[0] * 40, sRr[1] - g.up[1] * 40);
    ex.lineTo(d[0] - g.up[0] * 10, d[1] - g.up[1] * 10);
    stroke(ctx, ex, lav, 0.22, 1, [4, 6]);
  }

  function drawGauge(ctx, L, P, t, bi) {
    const lav = P.lavender, water = P.schemWater;
    const lvl = lerp(1, GAUGE_END, L.ease.inOutSine(t / B_CRACK));
    const x0 = GAUGE_X - GAUGE_W / 2, x1 = GAUGE_X + GAUGE_W / 2;
    const tube = L.rrectPts(x0, GAUGE_Y0, GAUGE_W, GAUGE_Y1 - GAUGE_Y0, GAUGE_W / 2, 12);
    const tubeIn = L.rrectPts(x0 + 8, GAUGE_Y0 + 8, GAUGE_W - 16, GAUGE_Y1 - GAUGE_Y0 - 16, (GAUGE_W - 16) / 2, 12);
    const po = new Path2D(), pi = new Path2D();
    wob(L, po, tube, sd('tube'), 0.5, bi, true);
    wob(L, pi, tubeIn, sd('tubein'), 0.4, bi, true);
    glowStroke(ctx, po, lav, 1);
    stroke(ctx, po, lav, 0.85, 2.5);
    stroke(ctx, pi, lav, 0.5, 1.5);
    // the water column: horizontal schemWater lines (lines, never a fill) up to the level
    const ly = lerp(GAUGE_Y1 - 10, GAUGE_Y0 + 10, lvl);
    const col = new Path2D();
    for (let y = GAUGE_Y1 - 14; y > ly; y -= 6) {
      col.moveTo(x0 + 11, y);
      col.lineTo(x1 - 11, y);
    }
    stroke(ctx, col, water, 0.5, 1.2);
    const surf = new Path2D();
    surf.moveTo(x0 + 9, ly);
    surf.quadraticCurveTo(GAUGE_X, ly + 4, x1 - 9, ly);
    stroke(ctx, surf, water, 1, 2.5);
    L.glowDot(ctx, GAUGE_X, ly, 5, { color: water, rays: 0, glow: 4, intensity: 0.8, seed: sd('lvl') });
    // tick scale on the right of the tube
    L.ticks(ctx, x1 + 10, GAUGE_Y1, { length: GAUGE_Y1 - GAUGE_Y0, angle: -Math.PI / 2, n: 20, len: 10, major: 5, majorLen: 20, alpha: 0.6, side: -1 });
    // the target: 18 percent of the height (11 percent moisture)
    const ty = GAUGE_Y1 - (GAUGE_Y1 - GAUGE_Y0) * GAUGE_END;
    const tg = new Path2D();
    tg.moveTo(x1 + 40, ty);
    tg.lineTo(x1 + 56, ty - 9);
    tg.lineTo(x1 + 56, ty + 9);
    tg.closePath();
    ctx.save();
    ctx.fillStyle = P.lineWhite;
    ctx.globalAlpha = 0.8;
    ctx.fill(tg);
    ctx.restore();
    const tl = new Path2D();
    tl.moveTo(x0 - 6, ty);
    tl.lineTo(x1 + 36, ty);
    stroke(ctx, tl, P.lineWhite, 0.7, 1.5, [5, 4]);
    // drop bracket on the left: from the full mark to the current level
    if (lvl < 0.985) L.bracket(ctx, x0 - 26, GAUGE_Y0 + 10, x0 - 26, ly, { color: lav, alpha: 0.6, cap: 14 });
    // water leaving: three droplets rising out of the tube's top while it falls
    if (t < B_CRACK + 2 * FR) {
      const tw = L.onTwos(t);
      for (let k = 0; k < 3; k++) {
        const u = ((tw * 2.2 + k / 3) % 1);
        L.glowDot(ctx, GAUGE_X + (k - 1) * 9, GAUGE_Y0 - 14 - u * 60, 3, { color: water, rays: 0, glow: 3, intensity: (1 - u) * 0.9, seed: sd('gd', k) });
      }
    }
  }

  function drawBean(ctx, L, P, g, bi, pulse, tDry) {
    const lav = P.lavender, white = P.lineWhite;
    // hex lattice inside
    L.hexLattice(ctx, g.lattice, { r: 15, alpha: 0.3, width: 1, seed: sd('hex'), cellFn: (cx, cy) => {
      const d = Math.hypot(cx - G1X, cy - G1Y);
      return d < 120 ? { fill: lav, alpha: 0.03 + 0.03 * (1 - d / 120) } : true;
    } });
    // form: stipple on the lower right (shadow side), a faint lift upper left
    L.stipple(ctx, g.inner, { spacing: 7, r: [0.8, 1.5], color: lav, alpha: 0.5, seed: sd('stip'), density: (x, y) => 0.08 + 0.75 * sstep(-40, 160, (x - G1X) * 0.6 + (y - G1Y) * 0.8) });
    // drying front: two dashed schemWater isolines contracting toward the centre as the water leaves
    {
      const e = L.ease.inOutSine(clamp(tDry / B_CRACK));
      for (let j = 0; j < 2; j++) {
        const k = lerp(0.9 - j * 0.24, 0.32 - j * 0.14, e);
        const a = lerp(0.6, 0.22, e);
        const iso = new Path2D();
        wob(L, iso, g.inner.map((p) => [G1X + (p[0] - G1X) * k, G1Y + (p[1] - G1Y) * k]), sd('iso', j), 0.8, bi, true);
        stroke(ctx, iso, P.schemWater, a, 1.3, [8, 7]);
      }
    }
    // the embryo at the bottom end: a small rosette of cells
    const emb = rot(-6, 196);
    const ep = new Path2D();
    for (let k = 0; k < 6; k++) {
      const a = (k / 6) * TAU + G1ROT;
      ep.moveTo(emb[0] + Math.cos(a) * 9 + 7, emb[1] + Math.sin(a) * 9);
      ep.arc(emb[0] + Math.cos(a) * 9, emb[1] + Math.sin(a) * 9, 7, 0, TAU);
    }
    stroke(ctx, ep, lav, 0.6, 1.2);
    // crease groove: lineWhite, 12 px tapering to 3
    const gp = new Path2D();
    wob(L, gp, g.groove, sd('groove'), 0.4, bi, true);
    ctx.save();
    ctx.fillStyle = white;
    ctx.globalAlpha = 0.42;
    ctx.fill(gp);
    ctx.restore();
    stroke(ctx, gp, white, 0.9, 1.4);
    const sv = new Path2D();
    wob(L, sv, g.silver, sd('silver'), 0.3, bi, false);
    stroke(ctx, sv, P.paleBlue, 0.85, 1.6, [7, 5]);
    // double outline: the outer line sits on G1
    const po = new Path2D(), pi = new Path2D();
    wob(L, po, g.bean, sd('out'), 0.6, bi, true);
    wob(L, pi, g.inner, sd('in'), 0.5, bi, true);
    glowStroke(ctx, po, lav, 1 + pulse * 5);
    if (pulse > 0) glowStroke(ctx, po, white, pulse * 4);
    stroke(ctx, po, pulse > 0 ? L.mix(lav, white, pulse) : lav, 0.85 + 0.15 * pulse, 2.5 + pulse * 1.5);
    stroke(ctx, pi, lav, 0.5, 1.5);
  }

  function dropAt(d, t) {
    const tw = L_onTwos(t);
    if (d.keep) return { x: d.p[0], y: d.p[1], a: 0.65 };
    const u = clamp((tw - d.t0) / d.dur);
    const e = 1 - (1 - u) * (1 - u);
    return { x: d.p[0] + d.dir[0] * d.dist * e, y: d.p[1] + d.dir[1] * d.dist * e, a: 1 - sstep(0.35, 1, u) };
  }
  const L_onTwos = (t) => Math.floor(t * 12 + 1e-6) / 12;

  function drawDrops(ctx, L, P, g, t) {
    const water = P.schemWater;
    const trails = new Path2D();
    g.drops.forEach((d, i) => {
      const q = dropAt(d, t);
      if (q.a <= 0.01) return;
      if (!d.keep && (q.x !== d.p[0] || q.y !== d.p[1])) {
        // a short trail behind a moving drop
        trails.moveTo(q.x - d.dir[0] * 26, q.y - d.dir[1] * 26);
        trails.lineTo(q.x - d.dir[0] * 6, q.y - d.dir[1] * 6);
      }
      L.glowDot(ctx, q.x, q.y, d.r, { color: water, rays: 0, glow: 3.6, intensity: 0.85 * q.a, seed: sd('drop', i) });
    });
    stroke(ctx, trails, water, 0.45, 1.2);
  }

  function drawHalf(ctx, L, P, h, sign, dx, dy, ang, alpha, bi) {
    if (alpha <= 0.01) return;
    const lav = P.lavender;
    ctx.save();
    ctx.globalAlpha *= alpha;
    // rotate the half about the bean centre, then shift it
    ctx.translate(G1X + dx, G1Y + dy);
    ctx.rotate(ang);
    ctx.translate(-G1X, -G1Y);
    const po = new Path2D(), pm = new Path2D(), pb = new Path2D(), pw = new Path2D(), pj = new Path2D();
    wob(L, po, h.o, sd('ho', sign), 0.6, bi, false);
    wob(L, pm, h.m, sd('hm', sign), 0.5, bi, false);
    wob(L, pb, h.b, sd('hb', sign), 0.4, bi, false);
    for (const [a, b] of h.walls) {
      pw.moveTo(a[0], a[1]);
      pw.lineTo(b[0], b[1]);
    }
    addPoly(pj, h.jt, false);
    addPoly(pj, h.jb, false);
    glowStroke(ctx, po, lav, 1);
    stroke(ctx, po, lav, 0.85, 2.5);
    stroke(ctx, pm, lav, 0.5, 1.5);
    stroke(ctx, pb, lav, 0.4, 1);
    stroke(ctx, pw, lav, 0.35, 1);
    stroke(ctx, pj, lav, 0.7, 1.5);
    ctx.restore();
  }

  function drawWholeHull(ctx, L, P, g, bi) {
    const lav = P.lavender;
    // the band between the hull and the bean: rectangular cells and a fine stipple (parchment fibre)
    L.stipple(ctx, g.hullRing, { spacing: 6, r: [0.7, 1.2], color: lav, alpha: 0.35, seed: sd('hullstip') });
    for (const [h, sign] of [[g.halfL, -1], [g.halfR, 1]]) {
      const pw = new Path2D(), pb = new Path2D();
      for (const [a, b] of h.walls) {
        pw.moveTo(a[0], a[1]);
        pw.lineTo(b[0], b[1]);
      }
      wob(L, pb, h.b, sd('hb', sign), 0.4, bi, false);
      stroke(ctx, pw, lav, 0.35, 1);
      stroke(ctx, pb, lav, 0.4, 1);
    }
    const po = new Path2D(), pm = new Path2D();
    wob(L, po, g.hull, sd('hull'), 0.6, bi, true);
    wob(L, pm, g.hullIn, sd('hullin'), 0.5, bi, true);
    glowStroke(ctx, po, lav, 1);
    stroke(ctx, po, lav, 0.85, 2.5);
    stroke(ctx, pm, lav, 0.5, 1.5);
  }

  function drawCrack(ctx, L, P, g, f) {
    // magenta: a jagged crack line runs round the hull from the top tip down both sides (3 frames),
    // then fades; 10 frames in all
    const k = f - 18;
    if (k < 0 || k >= 10) return;
    const prog = clamp((k + 1) / 2);
    const fade = 1 - sstep(3, 10, k + 1);
    const r = L.rng(sd('crack'));
    const p = new Path2D();
    const n = 48;
    for (const side of [-1, 1]) {
      const pts = [];
      for (let i = 0; i <= Math.round(n * prog); i++) {
        const idx = (72 + side * i + 96) % 96;
        const q = g.hull[idx];
        const m = g.hullIn[idx];
        const u = i % 2 ? 0.25 : 0.75;
        pts.push([lerp(q[0], m[0], u) + r.range(-2, 2), lerp(q[1], m[1], u) + r.range(-2, 2)]);
      }
      addPoly(p, pts, false);
    }
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    stroke(ctx, p, P.magenta, 0.25 * fade, 10);
    ctx.restore();
    stroke(ctx, p, P.magenta, fade, 3);
    // sparks at the two tips
    for (const idx of [72, 24]) {
      const q = g.hull[idx];
      L.glowDot(ctx, q[0], q[1], 7, { color: P.magenta, rays: 10, rayLen: 3.2, intensity: fade, rot: k * 0.3, seed: sd('tip', idx) });
    }
  }

  function drawNode(ctx, L, P, g, t, f, bi) {
    const lav = P.lavender, water = P.schemWater;
    // network line from the hull's lower right to the node
    const src = g.bean[8];
    const line = new Path2D();
    line.moveTo(src[0], src[1]);
    line.bezierCurveTo(src[0] + 120, src[1] + 40, NODE_X - 40, NODE_Y - 170, NODE_X - 20, NODE_Y - NODE_R);
    stroke(ctx, line, lav, 0.5, 1.2);
    const sdot = new Path2D();
    sdot.arc(src[0], src[1], 4, 0, TAU);
    ctx.save();
    ctx.fillStyle = lav;
    ctx.globalAlpha = 0.8;
    ctx.fill(sdot);
    ctx.restore();
    // node: a magnified section through hull and bean
    const circ = L.ellipsePts(NODE_X, NODE_Y, NODE_R, NODE_R, 64);
    ctx.save();
    ctx.fillStyle = L.rgba(P.navyLight, 0.9);
    ctx.beginPath();
    L.tracePath(ctx, circ, true);
    ctx.fill();
    ctx.clip();
    const split = f >= 19 ? (f < 21 ? L.ease.outBack((f - 18) / 3) : 1 + (L_onTwos(t) - 21 * FR) * 1.4) : 0;
    const lift = Math.min(1.6, split) * 34;
    // bean below: hex cells
    L.hexLattice(ctx, null, { bounds: [NODE_X - NODE_R, NODE_Y - 4, NODE_R * 2, NODE_R + 4], r: 11, alpha: 0.4, seed: sd('nodehex'), clip: false });
    const bl = new Path2D();
    bl.moveTo(NODE_X - NODE_R, NODE_Y - 4);
    bl.lineTo(NODE_X + NODE_R, NODE_Y - 4);
    stroke(ctx, bl, lav, 0.85, 2.5);
    // parchment above: rectangular cells, lifting off after the crack
    const hy0 = NODE_Y - 34 - lift, hy1 = NODE_Y - 6 - lift;
    const hp = new Path2D();
    hp.moveTo(NODE_X - NODE_R, hy0);
    hp.lineTo(NODE_X + NODE_R, hy0);
    hp.moveTo(NODE_X - NODE_R, hy1);
    hp.lineTo(NODE_X + NODE_R, hy1);
    const cells = new Path2D();
    for (let x = NODE_X - NODE_R; x < NODE_X + NODE_R; x += 14) {
      cells.moveTo(x, hy0);
      cells.lineTo(x, hy1);
    }
    cells.moveTo(NODE_X - NODE_R, (hy0 + hy1) / 2);
    cells.lineTo(NODE_X + NODE_R, (hy0 + hy1) / 2);
    const hullA = f >= 21 ? clamp(1 - (f - 21) / 9) : 1;
    stroke(ctx, hp, lav, 0.85 * hullA, 2.5);
    stroke(ctx, cells, lav, 0.4 * hullA, 1);
    // water dots in the section, leaving through the parchment
    const tw = L_onTwos(t);
    for (let i = 0; i < 9; i++) {
      const r = L.rng(sd('nodedrop', i));
      const x = NODE_X + r.range(-50, 50), y0 = NODE_Y + r.range(6, 50);
      const t0 = r.range(0, 0.45), keep = i < 2;
      const u = keep ? 0 : clamp((tw - t0) / 0.3);
      const a = keep ? 0.7 : 1 - sstep(0.4, 1, u);
      if (a > 0.01) L.glowDot(ctx, x, y0 - u * 110, 3.2, { color: water, rays: 0, glow: 3, intensity: a * 0.9, seed: sd('nd', i) });
    }
    ctx.restore();
    const ring = new Path2D(), ring2 = new Path2D();
    wob(L, ring, circ, sd('node'), 0.5, bi, true);
    wob(L, ring2, L.ellipsePts(NODE_X, NODE_Y, NODE_R - 9, NODE_R - 9, 64), sd('node2'), 0.4, bi, true);
    glowStroke(ctx, ring, lav, 1);
    stroke(ctx, ring, lav, 0.85, 2.5);
    stroke(ctx, ring2, lav, 0.5, 1.5);
    L.ticks(ctx, NODE_X, NODE_Y, { r: NODE_R + 6, n: 24, len: 6, major: 6, majorLen: 12, alpha: 0.45 });
  }

  // a second node, upper left: vapour leaving the bean (rising schemWater wisps and drops)
  const VX = 252, VY = 428, VR = 66;
  function drawVapourNode(ctx, L, P, g, t, bi) {
    const lav = P.lavender, water = P.schemWater;
    const src = g.bean[60];
    const line = new Path2D();
    line.moveTo(src[0], src[1]);
    line.bezierCurveTo(src[0] - 60, src[1] - 120, VX + 90, VY + 90, VX + VR * 0.7, VY + VR * 0.7);
    stroke(ctx, line, lav, 0.5, 1.2);
    ctx.save();
    ctx.fillStyle = lav;
    ctx.globalAlpha = 0.8;
    ctx.beginPath();
    ctx.arc(src[0], src[1], 4, 0, TAU);
    ctx.fill();
    ctx.restore();
    const circ = L.ellipsePts(VX, VY, VR, VR, 64);
    ctx.save();
    ctx.fillStyle = L.rgba(P.navyLight, 0.9);
    ctx.beginPath();
    L.tracePath(ctx, circ, true);
    ctx.fill();
    ctx.clip();
    // a surface line at the bottom, wisps rising from it; they thin out as the bean dries
    const k = 1 - 0.75 * L.ease.inOutSine(clamp(t / B_CRACK));
    const tw = L.onTwos(t);
    const base = new Path2D();
    base.moveTo(VX - VR, VY + 34);
    base.lineTo(VX + VR, VY + 34);
    stroke(ctx, base, lav, 0.8, 2);
    L.hatch(ctx, null, { bounds: [VX - VR, VY + 36, VR * 2, 30], angle: 0, spacing: 6, width: 1, color: lav, alpha: 0.35, length: [10, 30], seed: sd('vbase'), boil: bi });
    const wp = new Path2D();
    for (let i = 0; i < 4; i++) {
      const x0 = VX - 36 + i * 24;
      for (let j = 0; j <= 12; j++) {
        const u = j / 12;
        const x = x0 + Math.sin(u * 6 + i + tw * 9) * 6 * u;
        const y = VY + 30 - u * 84;
        if (j) wp.lineTo(x, y);
        else wp.moveTo(x, y);
      }
    }
    stroke(ctx, wp, water, 0.75 * k, 1.5, [6, 5]);
    for (let i = 0; i < 6; i++) {
      const u = (tw * 1.8 + i / 6) % 1;
      const x = VX - 40 + ((i * 37) % 80);
      L.glowDot(ctx, x, VY + 30 - u * 90, 3, { color: water, rays: 0, glow: 3, intensity: k * (1 - u) * 0.9, seed: sd('vd', i) });
    }
    ctx.restore();
    const ring = new Path2D(), ring2 = new Path2D();
    wob(L, ring, circ, sd('vnode'), 0.5, bi, true);
    wob(L, ring2, L.ellipsePts(VX, VY, VR - 9, VR - 9, 64), sd('vnode2'), 0.4, bi, true);
    glowStroke(ctx, ring, lav, 1);
    stroke(ctx, ring, lav, 0.85, 2.5);
    stroke(ctx, ring2, lav, 0.5, 1.5);
    L.ticks(ctx, VX, VY, { r: VR + 6, n: 24, len: 6, major: 6, majorLen: 12, alpha: 0.45 });
  }

  // ---------------------------------------------------------------------------
  FILM.scene({
    id: ID,
    draw(ctx, tIn, info) {
      const L = info.lib, P = L.pal;
      const t = clamp(tIn, 0, info.dur);
      const g = geo(L);
      const bi = L.boil(info.T);
      const f = Math.min(35, Math.floor(t * 24 + 1e-6));
      const tw = L.onTwos(t);

      // 1 plate
      L.blueprint(ctx, { center: [G1X, G1Y] });

      // 2 measurement and construction
      drawMeasure(ctx, L, P, g, bi);

      // 3 gauge
      drawGauge(ctx, L, P, t, bi);

      // 4 the bean (pulse on the 8th at T 22.125: 8 frames)
      const pf = f - Math.round(B_PULSE * 24);
      const pulse = pf >= 0 && pf < 8 ? Math.sin(Math.PI * ((pf + 1) / 8)) : 0;
      drawBean(ctx, L, P, g, bi, pulse, t);
      if (pf >= 0 && pf < 9) {
        // a lavender ring expands off the outline with the pulse
        const u = (pf + 1) / 9;
        const ring = new Path2D();
        const k = 1 + 0.18 * L.ease.outExpo(u);
        addPoly(ring, g.bean.map((p) => [G1X + (p[0] - G1X) * k, G1Y + (p[1] - G1Y) * k]), true);
        stroke(ctx, ring, P.lineWhite, 0.7 * (1 - u), 2);
      }

      // 5 droplets
      drawDrops(ctx, L, P, g, t);

      // 6 hull: whole until the crack, then two halves flying apart
      if (f < 18) {
        drawWholeHull(ctx, L, P, g, bi);
      } else {
        // outBack over 3 frames to 70 px apart, then drift on twos and fade over 9 frames
        const k3 = L.ease.outBack(clamp((f - 18) / 3));
        const drift = f >= 21 ? (tw - 21 * FR) / (9 * FR) : 0;
        const off = 70 * k3 + 320 * L.ease.inQuad(clamp(drift));
        const alpha = f < 21 ? 1 : 1 - clamp(drift);
        const ang = 0.12 * k3 + 0.25 * clamp(drift);
        drawHalf(ctx, L, P, g.halfL, -1, -g.across[0] * off, -g.across[1] * off + 30 * clamp(drift), -ang, alpha, bi);
        drawHalf(ctx, L, P, g.halfR, 1, g.across[0] * off, g.across[1] * off + 30 * clamp(drift), ang, alpha, bi);
      }

      // 7 inset node
      drawNode(ctx, L, P, g, t, f, bi);
      drawVapourNode(ctx, L, P, g, t, bi);

      // 8 magenta crack and the progress glyph
      drawCrack(ctx, L, P, g, f);
      progressGlyph(ctx, L, 1, info.p, info.T, false);
    },
  });
})();

</script>
<script>
// ---- src/scenes/12-green-beans.js
// 12 green-beans: "Green coffee into the sack". T 22.50 to 24.00, illustrated, hard cut.
// Frame 0 is the inked grey-green bean exactly on G1 (beanGreen, matte, beanGreenDeep crease,
// silverskin line), matching 11's last frame. Over one 8th (9 frames, inOutCubic, on twos) it shrinks
// to 0.12 and becomes one bean in a stream pouring from a steel scoop into a jute sack. On the beat at
// T 23.25 the scoop tips further and the pour thickens; at T 23.625 the filling sack slumps 3 percent.
//
// Layers, back to front:
//   1 stripes stripeCream / stripeSage, drifting 6 px per beat
//   2 two background sacks, left and right (scenery)
//   3 the sack (slides up in frames 2 to 8; squashes on T 23.625): body, weave, folds, emblem, rope,
//     back rim, the dark inside, the heap of green beans (cached texture) rising, front rim
//   4 the stream of green beans (40 to 60 px, on twos), behind the front rim once they drop in
//   5 the scoop (slides down in frames 2 to 8, tips on the beat)
//   6 the hero bean: G1 on frame 0, shrinking, then falling with the stream
//   7 overlays: annBlue dashed stream guide, annYellow bracket on the sack height
(function () {
  'use strict';

  const ID = 'green-beans';
  const TAU = Math.PI * 2;
  const DEG = Math.PI / 180;
  const FR = 1 / 24;
  const clamp = (v, a = 0, b = 1) => (v < a ? a : v > b ? b : v);
  const lerp = (a, b, u) => a + (b - a) * u;
  const sstep = (a, b, x) => {
    const u = clamp((x - a) / (b - a));
    return u * u * (3 - 2 * u);
  };
  const sd = (...k) => FILM.lib.hash(ID, ...k) & 0x7fffffff;

  // beats (shot-local seconds)
  const B_SHRUNK = 0.375; // T 22.875: the bean is one of the stream
  const B_TIP = 0.75; // T 23.25: the scoop tips further, more beans
  const B_SLUMP = 1.125; // T 23.625: the sack slumps

  // ---------------------------------------------------------------------------
  // G1: the bean, face-on (docs/storyboard.md, Shared geometry). Copied exactly.
  // ---------------------------------------------------------------------------
  const G1X = 540, G1Y = 900, G1ROT = -15 * DEG;
  const G1_CREASE = [[548, 682], [531, 750], [536, 826], [552, 900], [547, 976], [530, 1052], [538, 1118]];
  const G1_SILVER = [[546, 700], [538, 1100]];
  function g1Local(n) {
    const out = [];
    const e = 2 / 2.3;
    for (let i = 0; i < n; i++) {
      const a = (i / n) * TAU;
      const c = Math.cos(a), s = Math.sin(a);
