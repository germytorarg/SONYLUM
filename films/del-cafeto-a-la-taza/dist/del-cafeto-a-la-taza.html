    ctx.globalAlpha *= alpha;
    ctx.lineWidth = width;
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';
    if (dash) ctx.setLineDash(dash);
    ctx.beginPath();
    L.tracePath(ctx, pts, closed);
    ctx.stroke();
    ctx.restore();
  };
  function ribbon(cl, wFn) {
    const n = cl.length;
    const left = [], right = [];
    for (let i = 0; i < n; i++) {
      const a = cl[Math.max(0, i - 1)], b = cl[Math.min(n - 1, i + 1)];
      let tx = b[0] - a[0], ty = b[1] - a[1];
      const tl = Math.hypot(tx, ty) || 1;
      tx /= tl; ty /= tl;
      const w = wFn(i / (n - 1)) / 2;
      left.push([cl[i][0] - ty * w, cl[i][1] + tx * w]);
      right.push([cl[i][0] + ty * w, cl[i][1] - tx * w]);
    }
    return { left, right, poly: left.concat(right.slice().reverse()) };
  }

  // ---------------------------------------------------------------------------
  // Progress glyph: canonical, copied verbatim from docs/storyboard.md.
  // ---------------------------------------------------------------------------
  // Progress glyph: canonical, copied verbatim from docs/storyboard.md.
  function progressGlyph(ctx, L, stage, u, T, allLit) {
    const P = L.pal, cx = 900, cy = 300, r = 46, gap = 6 * Math.PI / 180;
    const q = Math.PI / 2, pop = L.clamp(u * 6);
    ctx.save();
    ctx.lineCap = 'round';
    ctx.globalAlpha = 0.5; ctx.strokeStyle = P.lavender; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(cx, cy, r + 14, 0, Math.PI * 2); ctx.stroke();
    for (let i = 0; i < 4; i++) {
      const a0 = -q + i * q + gap / 2, a1 = a0 + q - gap;
      const past = allLit || i < stage, cur = !allLit && i === stage;
      ctx.globalAlpha = past ? 0.6 : 0.18;
      ctx.strokeStyle = P.lavender; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(cx, cy, r, a0, a1); ctx.stroke();
      if (cur || allLit) {
        const k = allLit ? 1 : L.clamp(u);
        const ae = a0 + (a1 - a0) * k;
        ctx.globalAlpha = 1; ctx.strokeStyle = P.lineWhite; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.arc(cx, cy, r, a0, ae); ctx.stroke();
        if (cur) L.glowDot(ctx, cx + Math.cos(ae) * r, cy + Math.sin(ae) * r, 4 + 2 * pop, { rays: 0, glow: 3.5, intensity: 0.8 });
      }
    }
    ctx.globalAlpha = 0.7; ctx.fillStyle = P.lineWhite;
    ctx.beginPath(); ctx.arc(cx, cy, 3, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  // ---------------------------------------------------------------------------
  // Geometry tables (t-independent)
  // ---------------------------------------------------------------------------
  let GEO = null;
  function geo() {
    if (GEO) return GEO;
    const g = {};
    g.crease = L.smoothPts(CRL, false, 4);
    g.silver = L.smoothPts(SILVER.map(([x, y]) => [x - 540, y - 900]), false, 6).map(([x, y]) => [creaseX(y) - 1, y]);
    // fitted lattice: 19 columns across, 40 rows along; cells are 18 x 12 at the bean's waist
    g.cells = [];
    const rows = 40, cols = 19;
    for (let j = 0; j < rows; j++) {
      const v0 = -1 + (2 * j) / rows, v1 = -1 + (2 * (j + 1)) / rows;
      const dy0 = v0 * (G1_B - 16), dy1 = v1 * (G1_B - 16);
      for (let i = 0; i < cols; i++) {
        const u0 = -1 + (2 * i) / cols, u1 = -1 + (2 * (i + 1)) / cols;
        const corner = (u, dy) => [u * (halfW(dy) - 14), dy];
        const c = [corner(u0, dy0), corner(u1, dy0), corner(u1, dy1), corner(u0, dy1)];
        const mx = (c[0][0] + c[1][0] + c[2][0] + c[3][0]) / 4, my = (dy0 + dy1) / 2;
        const w = Math.abs(c[1][0] - c[0][0]);
        if (w < 4) continue;
        if (Math.abs(mx - creaseX(my)) < 14 + w * 0.5) continue;
        g.cells.push({ c, mx, my, k: L.h3(i, j, sd('cell') & 0xffff), side: mx < creaseX(my) ? -1 : 1 });
      }
    }
    // CO2 glow dots in the cells
    const r = L.rng(sd('co2'));
    g.co2 = [];
    let guard = 0;
    while (g.co2.length < 9 && guard++ < 4000) {
      const dy = r.range(-190, 190);
      const dx = r.range(-1, 1) * (halfW(dy) - 40);
      if (Math.abs(dx - creaseX(dy)) < 40) continue;
      if (g.co2.some((q) => Math.hypot(q.dx - dx, q.dy - dy) < 70)) continue;
      g.co2.push({ dx, dy, t0: r.range(-0.2, 0.7), ph: r.range(0, TAU) });
    }
    // heat lines round the bean
    const h = L.rng(sd('heat'));
    g.heat = [];
    const xs = [150, 205, 262, 318, 772, 826, 884, 940, 400, 470, 610, 680];
    for (let i = 0; i < xs.length; i++) {
      const low = i >= 8;
      g.heat.push({ x: xs[i] + h.range(-14, 14), y0: low ? h.range(1300, 1420) : h.range(1180, 1480), len: low ? h.range(120, 200) : h.range(300, 520), spd: h.range(180, 320), ph: h.range(0, 1), amp: h.range(6, 12), k: h.range(0.025, 0.04) });
    }
    // chaff shards from the crease (u along the crease, side)
    g.shards = [[0.24, 1], [0.42, -1], [0.6, 1], [0.8, -1]].map(([u, side], i) => ({ u, side, dist: 150 + 40 * L.h3(i, 1, 5), spin: (L.h3(i, 2, 5) - 0.5) * 9, w: 16 + 6 * L.h3(i, 3, 5) }));
    // follow-up crack sites on the outline (indices into the 96-point outline)
    g.pops = [{ i: 18, t: B_POP2 }, { i: 70, t: B_POP3 }];
    GEO = g;
    return g;
  }

  // ---------------------------------------------------------------------------
  // Timing
  // ---------------------------------------------------------------------------
  const hit = (t, a, frames, e, lead = 1) => (t < a ? 0 : (e || ((u) => u))(clamp((t - a) / (frames * FR) + lead / frames)));
  function scaleAt(t) {
    const tw = L.onTwos(t);
    let s = 1 + 0.15 * E.inOutSine(clamp(tw / B_CRACK));
    s += 0.1 * hit(t, B_CRACK, 3, E.outBack);
    s += 0.03 * hit(t, B_POP2, 3, E.outBack);
    s += 0.02 * hit(t, B_POP3, 3, E.outBack);
    return s;
  }

  // ---------------------------------------------------------------------------
  // Layers
  // ---------------------------------------------------------------------------
  function drawGuides(ctx, t, s) {
    const rot = t * 4 * DEG;
    L.guideCircle(ctx, G1C[0], G1C[1], 430, { alpha: 0.16, cross: 0 });
    L.guideCircle(ctx, G1C[0], G1C[1], 372, { alpha: 0.12, dash: [4, 10] });
    L.ticks(ctx, G1C[0], G1C[1], { r: 430, n: 72, len: 10, major: 6, majorLen: 20, rot, alpha: 0.35 });
    // bean axis
    const a = tf(0, -300, 1), b = tf(0, 300, 1);
    strokePts(ctx, [a, b], false, LAV, 0.14, 1, [10, 8]);
    const c = tf(-230, 0, 1), d = tf(230, 0, 1);
    strokePts(ctx, [c, d], false, LAV, 0.12, 1, [10, 8]);
    // quadrant marks
    ctx.save();
    ctx.strokeStyle = LAV;
    ctx.globalAlpha = 0.3;
    ctx.lineWidth = 1.5;
    for (let k = 0; k < 4; k++) {
      const an = rot * 2 + (k * Math.PI) / 2 + G1_ROT;
      ctx.beginPath();
      ctx.arc(G1C[0], G1C[1], 470, an - 0.08, an + 0.08);
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawHeat(ctx, t, G, bi) {
    ctx.save();
    ctx.strokeStyle = BEAN;
    ctx.lineCap = 'round';
    const heat = 0.55 + 0.45 * sstep(0, B_CRACK, t);
    for (let i = 0; i < G.heat.length; i++) {
      const h = G.heat[i];
      const u = (t * h.spd / h.len + h.ph) % 1;
      const yb = h.y0 - u * h.len * 0.9;
      const len = h.len * 0.55;
      ctx.lineWidth = 2;
      ctx.globalAlpha = 0.6 * heat * Math.sin(Math.PI * u);
      ctx.beginPath();
      for (let k = 0; k <= 30; k++) {
        const y = yb - (k / 30) * len;
        const x = h.x + Math.sin(y * h.k + t * 7 + i + bi * 0.6) * h.amp * (0.6 + 0.4 * (k / 30));
        if (k === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawLattice(ctx, t, s, G, bi) {
    const path = new Path2D();
    const lit = new Path2D();
    const heat = sstep(0.1, B_CRACK, t);
    const jit = (x, y, k) => [x + (L.h3(Math.round(x), Math.round(y), bi + k) - 0.5) * 0.8, y + (L.h3(Math.round(y), Math.round(x), bi + k + 9) - 0.5) * 0.8];
    for (const cell of G.cells) {
      // inset each cell by 1.5 px (screen) toward its centre
      const pts = cell.c.map(([x, y]) => {
        const dx = x - cell.mx, dy = y - cell.my;
        const d = Math.hypot(dx, dy) || 1;
        const k = Math.max(0, 1 - 1.5 / s / d);
        return tf(cell.mx + dx * k, cell.my + dy * k, s);
      });
      const q = pts.map((p, i) => jit(p[0], p[1], i));
      path.moveTo(q[0][0], q[0][1]);
      for (let i = 1; i < 4; i++) path.lineTo(q[i][0], q[i][1]);
      path.closePath();
      if (cell.k < heat * 0.32) {
        lit.moveTo(q[0][0], q[0][1]);
        for (let i = 1; i < 4; i++) lit.lineTo(q[i][0], q[i][1]);
        lit.closePath();
      }
    }
    ctx.save();
    ctx.fillStyle = LAV;
    ctx.globalAlpha = 0.07;
    ctx.fill(lit);
    ctx.strokeStyle = LAV;
    ctx.lineWidth = 1;
    ctx.globalAlpha = 0.36;
    ctx.stroke(path);
    ctx.restore();
  }

  function drawCO2(ctx, t, s, G) {
    const crackK = hit(t, B_CRACK, 12, (u) => 1 - u);
    for (let i = 0; i < G.co2.length; i++) {
      const c = G.co2[i];
      const on = sstep(c.t0, c.t0 + 0.3, t);
      if (on <= 0) continue;
      const [x, y] = tf(c.dx, c.dy, s);
      const r = (3 + 2.5 * on + 2 * (t >= B_CRACK ? 1 : 0)) * (1 + 0.15 * Math.sin(t * 9 + c.ph));
      L.glowDot(ctx, x, y, r, { rays: t >= B_CRACK ? 8 : 0, rayLen: 2.6, glow: 4, intensity: 0.55 * on + 0.45 * crackK, seed: sd('co2', i) });
    }
  }

  function drawBean(ctx, t, s, G, bi) {
    const out = tfPts(OUT_LOCAL, s);
    const outer = wob(out, sd('outer'), 1.1, bi, true);
    const inner = wob(insetPoly(out, 9), sd('inner'), 0.9, bi, true);
    // panel tint inside the outline so the lattice reads as a body
    ctx.save();
    ctx.fillStyle = NAVY_L;
    ctx.globalAlpha = 0.55;
    ctx.beginPath();
    L.tracePath(ctx, out, true);
    ctx.fill();
    ctx.restore();
    // lattice clipped to the inner outline
    ctx.save();
    ctx.beginPath();
    L.tracePath(ctx, inner, true);
    ctx.clip();
    drawLattice(ctx, t, s, G, bi);
    ctx.restore();
    drawCO2(ctx, t, s, G);
    strokePts(ctx, outer, true, LAV, 0.85, 2.5);
    strokePts(ctx, inner, true, LAV, 0.5, 1.5);
    // rim ticks along the outer outline (shell structure)
    const rt = new Path2D();
    for (let i = 0; i < G1_N; i += 2) {
      const p = out[i], q = out[(i + 1) % G1_N];
      let tx = q[0] - p[0], ty = q[1] - p[1];
      const tl = Math.hypot(tx, ty) || 1;
      const nx = -ty / tl, ny = tx / tl;
      const sgn = (G1C[0] - p[0]) * nx + (G1C[1] - p[1]) * ny > 0 ? 1 : -1;
      rt.moveTo(p[0] + nx * sgn * 2, p[1] + ny * sgn * 2);
      rt.lineTo(p[0] + nx * sgn * 7, p[1] + ny * sgn * 7);
    }
    ctx.save();
    ctx.strokeStyle = LAV;
    ctx.globalAlpha = 0.4;
    ctx.lineWidth = 1;
    ctx.stroke(rt);
    ctx.restore();
    drawCrease(ctx, t, s, G, bi);
    // follow-up crack scars on the outline
    for (const pp of G.pops) {
      if (t + FR < pp.t) continue;
      const k = hit(t, pp.t, 3, E.outBack);
      const p = out[pp.i];
      const dir = Math.atan2(p[1] - G1C[1], p[0] - G1C[0]) + Math.PI;
      const z = [];
      for (let m = 0; m <= 4; m++) {
        const d = m * 9 * k;
        const off = (m % 2 ? 4 : -4) * k;
        z.push([p[0] + Math.cos(dir) * d - Math.sin(dir) * off, p[1] + Math.sin(dir) * d + Math.cos(dir) * off]);
      }
      strokePts(ctx, z, false, WHITE, 0.85, 1.5);
    }
  }

  function drawCrease(ctx, t, s, G, bi) {
    const cl = wob(tfPts(G.crease, s), sd('crease'), 0.8, bi, false);
    const open = hit(t, B_CRACK, 3, E.outBack);
    const W = 12 + 14 * open;
    const rb = ribbon(cl, (u) => 3 + (W - 3) * Math.pow(Math.sin(Math.PI * u), 0.6));
    const glow = sstep(0.3, B_CRACK, t) * 0.5 + 0.5 * open;
    // crease glow (schemBean), soft and additive
    if (glow > 0) {
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      ctx.strokeStyle = BEAN;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      for (const [w, a] of [[34, 0.06], [20, 0.1], [10, 0.16]]) {
        ctx.globalAlpha = a * glow;
        ctx.lineWidth = w + W * 0.6;
        ctx.beginPath();
        L.tracePath(ctx, cl, false);
        ctx.stroke();
      }
      ctx.restore();
    }
    if (open <= 0) {
      // closed groove: a 12 px lineWhite groove tapering to 3 px
      ctx.save();
      ctx.fillStyle = WHITE;
      ctx.globalAlpha = 0.85;
      ctx.beginPath();
      L.tracePath(ctx, rb.poly, true);
      ctx.fill();
      ctx.restore();
    } else {
      // split open: dark gap with white lips
      ctx.save();
      ctx.fillStyle = NAVY_D;
      ctx.beginPath();
      L.tracePath(ctx, rb.poly, true);
      ctx.fill();
      ctx.restore();
      strokePts(ctx, rb.left, false, WHITE, 0.9, 2.5);
      strokePts(ctx, rb.right, false, WHITE, 0.9, 2.5);
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      strokePts(ctx, cl.slice(4, cl.length - 4), false, BEAN, 0.8 * glow, 3);
      ctx.restore();
      // torn fibres across the gap
      const fib = new Path2D();
      for (let i = 6; i < rb.left.length - 6; i += 5) {
        const a = rb.left[i], b = rb.right[i];
        const j = L.h3(i, bi, 3) - 0.5;
        fib.moveTo(a[0], a[1]);
        fib.lineTo(lerp(a[0], b[0], 0.35 + j * 0.2), lerp(a[1], b[1], 0.35 + j * 0.2));
      }
      ctx.save();
      ctx.strokeStyle = LAV;
      ctx.globalAlpha = 0.45;
      ctx.lineWidth = 1;
      ctx.stroke(fib);
      ctx.restore();
    }
    // silverskin line inside the groove
    const sv = wob(tfPts(G.silver, s), sd('silver'), 0.6, bi, false);
    strokePts(ctx, sv, false, PALE, open > 0 ? 0.9 : 0.75, 3);
  }

  function drawGhost(ctx, t, s, bi) {
    const g = sstep(0.15, 0.45, t);
    if (g <= 0) return;
    const pts = wob(tfPts(OUT_LOCAL, 1), sd('ghost'), 0.8, bi, true);
    strokePts(ctx, pts, true, LAV, 0.3 * g, 1.5, [8, 9]);
  }

  function drawLengthBracket(ctx, t, s) {
    // dimension bracket along the bean's axis, to its left, measuring the swelling length
    const top = tf(0, -G1_B, s), bot = tf(0, G1_B, s);
    const off = -(G1_A * s + 46);
    const nx = COS, ny = SIN; // local +x direction on screen
    const a = [top[0] + nx * off, top[1] + ny * off], b = [bot[0] + nx * off, bot[1] + ny * off];
    L.bracket(ctx, a[0], a[1], b[0], b[1], { style: 'dim', cap: 16, alpha: 0.6, width: 1.5, p: E.outExpo(clamp(t / (6 * FR) + 1 / 6)) });
    // ghost length (scale 1.00) as a faint second bracket
    const top1 = tf(0, -G1_B, 1), bot1 = tf(0, G1_B, 1);
    const off1 = off - 26;
    L.bracket(ctx, top1[0] + nx * off1, top1[1] + ny * off1, bot1[0] + nx * off1, bot1[1] + ny * off1, { style: 'square', cap: 10, alpha: 0.28, width: 1 });
    // width bracket below
    const l = tf(-halfW(0), 0, s), r = tf(halfW(0), 0, s);
    const dn = G1_B * s * 0 + 0;
    const ux = -SIN, uy = COS; // local +y direction
    const o2 = G1_B * s + 40;
    const pa = [G1C[0] + (l[0] - G1C[0]) + ux * o2, G1C[1] + (l[1] - G1C[1]) + uy * o2];
    const pb = [G1C[0] + (r[0] - G1C[0]) + ux * o2, G1C[1] + (r[1] - G1C[1]) + uy * o2];
    L.bracket(ctx, pa[0] + dn, pa[1], pb[0], pb[1], { style: 'dim', cap: 14, alpha: 0.5, width: 1.5 });
  }

  // thermometer: x 900, y 620..1300, level rising to the first-crack tick
  const TH_X = 900, TH_TOP = 620, TH_BOT = 1300, TH_MARK = 760;
  function drawThermo(ctx, t, bi) {
    L.ticks(ctx, TH_X - 6, TH_BOT, { kind: 'linear', length: TH_BOT - TH_TOP, angle: -Math.PI / 2, n: 34, len: 10, major: 5, majorLen: 18, side: -1, alpha: 0.6, baseline: false });
    L.bracket(ctx, TH_X + 22, TH_TOP, TH_X + 22, TH_BOT, { style: 'square', cap: 16, offset: 0, alpha: 0.6 });
    // tube
    strokePts(ctx, [[TH_X - 7, TH_BOT + 6], [TH_X - 7, TH_TOP - 6]], false, LAV, 0.5, 1.5);
    strokePts(ctx, [[TH_X + 7, TH_BOT + 6], [TH_X + 7, TH_TOP - 6]], false, LAV, 0.5, 1.5);
    ctx.save();
    ctx.strokeStyle = LAV;
    ctx.globalAlpha = 0.85;
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.arc(TH_X, TH_BOT + 26, 20, 0, TAU);
    ctx.stroke();
    ctx.globalAlpha = 0.5;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(TH_X, TH_BOT + 26, 13, 0, TAU);
    ctx.stroke();
    ctx.restore();
    // level: rises on twos to the mark by the crack, creeps on after
    const tw = L.onTwos(t);
    const yl = tw < B_CRACK ? lerp(1236, TH_MARK, E.inOutSine(tw / B_CRACK)) : lerp(TH_MARK, 712, E.outQuad((tw - B_CRACK) / 0.75));
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.strokeStyle = BEAN;
    ctx.lineCap = 'round';
    ctx.globalAlpha = 0.25;
    ctx.lineWidth = 12;
    ctx.beginPath();
    ctx.moveTo(TH_X, TH_BOT + 10);
    ctx.lineTo(TH_X, yl);
    ctx.stroke();
    ctx.globalAlpha = 0.95;
    ctx.lineWidth = 4;
    ctx.stroke();
    ctx.restore();
    L.glowDot(ctx, TH_X, TH_BOT + 26, 8, { color: BEAN, core: GLOW, rays: 0, glow: 2.6, intensity: 0.8, seed: sd('bulb') });
    L.glowDot(ctx, TH_X, yl, 3.5, { color: BEAN, rays: 0, glow: 3, intensity: 0.9, seed: sd('meniscus') });
    // the first-crack mark: a long tick with a pointer
    const flash = t >= B_CRACK - FR ? 1 - hit(t, B_CRACK, 12) : 0;
    const mc = flash > 0 ? MAG : WHITE;
    ctx.save();
    ctx.strokeStyle = mc;
    ctx.fillStyle = mc;
    ctx.globalAlpha = flash > 0 ? 1 : 0.85;
    ctx.lineWidth = flash > 0 ? 3 : 2;
    ctx.beginPath();
    ctx.moveTo(TH_X - 40, TH_MARK);
    ctx.lineTo(TH_X + 14, TH_MARK);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(TH_X - 52, TH_MARK);
    ctx.lineTo(TH_X - 64, TH_MARK - 8);
    ctx.lineTo(TH_X - 64, TH_MARK + 8);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
    if (flash > 0) {
      ctx.save();
      ctx.strokeStyle = MAG;
      ctx.globalAlpha = flash;
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(TH_X, TH_MARK, 12 + 30 * E.outExpo(1 - flash), 0, TAU);
      ctx.stroke();
      ctx.restore();
    }
  }

  // network nodes: vapour leaving (upper left) and CO2 building (lower left)
  function drawNodes(ctx, t, s, bi) {
    const nodes = [
      { x: 162, y: 520, r: 54, from: [-150, -140], kind: 'vapour' },
      { x: 162, y: 1350, r: 54, from: [-120, 150], kind: 'co2' },
    ];
    for (const n of nodes) {
      const src = tf(n.from[0], n.from[1], s);
      // curved link
      const mx = (src[0] + n.x) / 2 - 20, my = (src[1] + n.y) / 2;
      ctx.save();
      ctx.strokeStyle = LAV;
      ctx.globalAlpha = 0.45;
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.moveTo(src[0], src[1]);
      ctx.quadraticCurveTo(mx - 40, my, n.x + (src[0] > n.x ? n.r : -n.r) * 0.7, n.y + (src[1] > n.y ? n.r : -n.r) * 0.7);
      ctx.stroke();
      // travelling pulse along the link
      const u = (t * 0.9 + (n.kind === 'co2' ? 0.5 : 0)) % 1;
      const ex = n.x + (src[0] > n.x ? n.r : -n.r) * 0.7, ey = n.y + (src[1] > n.y ? n.r : -n.r) * 0.7;
      const v = 1 - u;
      const px = v * v * src[0] + 2 * v * u * (mx - 40) + u * u * ex;
      const py = v * v * src[1] + 2 * v * u * my + u * u * ey;
      ctx.restore();
      L.glowDot(ctx, px, py, 2.6, { rays: 0, glow: 3, intensity: 0.7, seed: sd('pulse', n.kind) });
      ctx.save();
      ctx.fillStyle = LAV;
      ctx.globalAlpha = 0.8;
      ctx.beginPath();
      ctx.arc(src[0], src[1], 3.5, 0, TAU);
      ctx.fill();
      ctx.restore();
      // node glyph: double ring
      ctx.save();
      ctx.fillStyle = NAVY_L;
      ctx.globalAlpha = 0.8;
      ctx.beginPath();
      ctx.arc(n.x, n.y, n.r, 0, TAU);
      ctx.fill();
      ctx.restore();
      strokePts(ctx, wob(L.ellipsePts(n.x, n.y, n.r, n.r, 48), sd('node', n.kind), 0.7, bi, true), true, LAV, 0.85, 2.5);
      strokePts(ctx, L.ellipsePts(n.x, n.y, n.r - 9, n.r - 9, 40), true, LAV, 0.5, 1.5);
      ctx.save();
      ctx.beginPath();
      ctx.arc(n.x, n.y, n.r - 11, 0, TAU);
      ctx.clip();
      if (n.kind === 'vapour') {
        // three rising wavy strands leaving the node
        ctx.strokeStyle = LAV;
        ctx.lineCap = 'round';
        ctx.lineWidth = 1.5;
        for (let k = -1; k <= 1; k++) {
          ctx.globalAlpha = 0.75;
          ctx.beginPath();
          for (let m = 0; m <= 16; m++) {
            const yy = n.y + 30 - m * 4;
            const xx = n.x + k * 13 + Math.sin(m * 0.7 + t * 8 + k) * 4;
            if (m === 0) ctx.moveTo(xx, yy);
            else ctx.lineTo(xx, yy);
          }
          ctx.stroke();
        }
      } else {
        // gas bubbles gathering: ring outlines growing with the heat
        const g = 0.4 + 0.6 * sstep(0, B_CRACK, t);
        ctx.strokeStyle = LAV;
        ctx.lineWidth = 1.3;
        ctx.globalAlpha = 0.8;
        for (let k = 0; k < 9; k++) {
          const a = k * 2.4 + 0.3;
          const rr = 8 + (k % 3) * 9;
          const bx = n.x + Math.cos(a) * rr, by = n.y + Math.sin(a) * rr;
          ctx.beginPath();
          ctx.arc(bx, by, (3 + (k % 4)) * g, 0, TAU);
          ctx.stroke();
        }
      }
      ctx.restore();
      L.ticks(ctx, n.x, n.y, { r: n.r + 6, n: 16, len: 6, alpha: 0.4, rot: t * 0.3 });
    }
  }


  // magnified inset of three cells swelling (18 x 12 -> 24 x 16), linked to the bean's lower end
  function drawInset(ctx, t, s, bi) {
    const x = 540, y = 1436, r = 66;
    const src = tf(40, 200, s);
    ctx.save();
    ctx.strokeStyle = LAV;
    ctx.globalAlpha = 0.45;
    ctx.lineWidth = 1.2;
    ctx.setLineDash([6, 6]);
    ctx.beginPath();
    ctx.moveTo(src[0], src[1]);
    ctx.lineTo(x, y - r);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.globalAlpha = 0.85;
    ctx.fillStyle = NAVY_L;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, TAU);
    ctx.fill();
    ctx.restore();
    ctx.save();
    ctx.globalAlpha = 0.6;
    ctx.strokeStyle = LAV;
    ctx.beginPath();
    ctx.arc(src[0], src[1], 14, 0, TAU);
    ctx.stroke();
    ctx.restore();
    strokePts(ctx, wob(L.ellipsePts(x, y, r, r, 48), sd('inset'), 0.7, bi, true), true, LAV, 0.85, 2.5);
    strokePts(ctx, L.ellipsePts(x, y, r - 9, r - 9, 40), true, LAV, 0.5, 1.5);
    ctx.save();
    ctx.beginPath();
    ctx.arc(x, y, r - 11, 0, TAU);
    ctx.clip();
    // 3 x 3 cells at 2.2x magnification; walls thin as they stretch
    const k = 2.2 * s;
    const cw = 18 * k * 0.62, ch = 12 * k * 0.62;
    const p = new Path2D();
    for (let j = -2; j <= 2; j++) {
      for (let i = -2; i <= 2; i++) {
        const cx = x + i * cw, cy = y + j * ch + (i % 2 ? ch * 0.5 : 0);
        const ins = 2.2;
        p.moveTo(cx - cw / 2 + ins, cy - ch / 2 + ins);
        p.lineTo(cx + cw / 2 - ins, cy - ch / 2 + ins);
        p.lineTo(cx + cw / 2 - ins, cy + ch / 2 - ins);
        p.lineTo(cx - cw / 2 + ins, cy + ch / 2 - ins);
        p.closePath();
      }
    }
    ctx.strokeStyle = LAV;
    ctx.lineWidth = 1.5;
    ctx.globalAlpha = 0.7;
    ctx.stroke(p);
    // gas inside the centre cells
    const g = sstep(0, B_CRACK, t);
    ctx.globalAlpha = 0.85;
    ctx.lineWidth = 1.2;
    for (let m = 0; m < 5; m++) {
      const a = m * 1.9 + 0.4;
      ctx.beginPath();
      ctx.arc(x + Math.cos(a) * 9, y + Math.sin(a) * 6, 2 + 3 * g * ((m % 2) + 0.5), 0, TAU);
      ctx.stroke();
    }
    ctx.restore();
    // scale ticks under the inset: before (faint) and now
    L.bracket(ctx, x - (18 * 2.2 * 0.62) / 2, y + r + 18, x + (18 * 2.2 * 0.62) / 2, y + r + 18, { style: 'square', cap: 8, alpha: 0.3, width: 1 });
    L.bracket(ctx, x - cw / 2, y + r + 30, x + cw / 2, y + r + 30, { style: 'dim', cap: 10, alpha: 0.6 });
  }

  // the heat source below the frame's safe area: schematic burner glyphs and rising arrows (schemBean)
  function drawBurner(ctx, t, bi) {
    ctx.save();
    ctx.strokeStyle = LAV;
    ctx.globalAlpha = 0.5;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(150, 1650);
    ctx.lineTo(930, 1650);
    ctx.stroke();
    ctx.restore();
    for (let i = 0; i < 9; i++) {
      const x = 180 + i * 90;
      const f = 0.85 + 0.15 * Math.sin(bi * 1.3 + i * 2.1);
      const pts = [];
      for (let m = 0; m <= 16; m++) {
        const a = (m / 16) * TAU;
        const top = (1 + Math.cos(a)) / 2;
        pts.push([x + 13 * Math.sin(a) * (0.55 + 0.45 * (1 - top)), 1640 - 46 * f * top]);
      }
      strokePts(ctx, pts, true, LAV, 0.6, 1.5);
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      strokePts(ctx, pts.map(([px, py]) => [x + (px - x) * 0.45, 1640 - (1640 - py) * 0.55]), true, BEAN, 0.7, 1.5);
      ctx.restore();
      // rising heat arrow
      const u = (t * 1.6 + i * 0.37) % 1;
      const y0 = 1580 - u * 70;
      ctx.save();
      ctx.strokeStyle = BEAN;
      ctx.globalAlpha = 0.7 * Math.sin(Math.PI * u);
      ctx.lineWidth = 2;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(x, y0);
      ctx.lineTo(x, y0 - 30);
      ctx.moveTo(x - 7, y0 - 22);
      ctx.lineTo(x, y0 - 30);
      ctx.lineTo(x + 7, y0 - 22);
      ctx.stroke();
      ctx.restore();
    }
  }

  function drawEvents(ctx, t, s, G) {
    const mid = tf(552 - 540, 0, s);
    // the flash ring: 40 -> 260 px over 12 frames
    if (t >= B_CRACK - FR && t < B_CRACK + 12 * FR) {
      const u = hit(t, B_CRACK, 12);
      ctx.save();
      ctx.strokeStyle = MAG;
      ctx.globalAlpha = 1 - u;
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(mid[0], mid[1], 40 + 220 * E.outExpo(u), 0, TAU);
      ctx.stroke();
      ctx.globalAlpha = (1 - u) * 0.6;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(mid[0], mid[1], 30 + 120 * E.outExpo(u), 0, TAU);
      ctx.stroke();
      // radial burst ticks
      ctx.globalAlpha = 1 - u;
      ctx.lineWidth = 3;
      ctx.lineCap = 'round';
      for (let k = 0; k < 12; k++) {
        const a = (k / 12) * TAU + 0.13;
        const r0 = 60 + 150 * E.outExpo(u), r1 = r0 + 26 * (1 - u);
        ctx.beginPath();
        ctx.moveTo(mid[0] + Math.cos(a) * r0, mid[1] + Math.sin(a) * r0);
        ctx.lineTo(mid[0] + Math.cos(a) * r1, mid[1] + Math.sin(a) * r1);
        ctx.stroke();
      }
      ctx.restore();
    }
    // four chaff shards fly out of the crease, then drift and fade
    if (t >= B_CRACK - FR) {
      const cl = tfPts(G.crease, s);
      const k = hit(t, B_CRACK, 12, E.outCubic);
      const drift = Math.max(0, t - B_CRACK - 0.5);
      for (const sh of G.shards) {
        const i = Math.round(sh.u * (cl.length - 1));
        const a = cl[Math.max(0, i - 1)], b = cl[Math.min(cl.length - 1, i + 1)];
        let tx = b[0] - a[0], ty = b[1] - a[1];
        const tl = Math.hypot(tx, ty) || 1;
        const nx = (-ty / tl) * sh.side, ny = (tx / tl) * sh.side;
        const d = sh.dist * k + 40 * drift;
        const x = cl[i][0] + nx * d, y = cl[i][1] + ny * d - 30 * drift;
        const rot = sh.spin * (k + drift);
        const w = sh.w, h = w * 0.45;
        const pts = [[-w / 2, 0], [-w * 0.1, -h], [w / 2, -h * 0.2], [w * 0.15, h * 0.7]].map(([px, py]) => [x + px * Math.cos(rot) - py * Math.sin(rot), y + px * Math.sin(rot) + py * Math.cos(rot)]);
        const fade = 1 - sstep(0.9, 1.5, t);
        strokePts(ctx, pts, true, WHITE, 0.9 * fade + 0.25, 1.5);
        ctx.save();
        ctx.fillStyle = LAV;
        ctx.globalAlpha = 0.18;
        ctx.beginPath();
        L.tracePath(ctx, pts, true);
        ctx.fill();
        ctx.restore();
        // short motion trail while flying
        if (k < 1) strokePts(ctx, [[cl[i][0] + nx * d * 0.5, cl[i][1] + ny * d * 0.5], [x, y]], false, LAV, 0.5 * (1 - k), 1);
      }
    }
    // follow-up cracks: small magenta rings at outline sites (8 frames each)
    const out = tfPts(OUT_LOCAL, s);
    for (const pp of G.pops) {
      if (t < pp.t - FR || t > pp.t + 8 * FR) continue;
      const u = hit(t, pp.t, 8);
      const p = out[pp.i];
      ctx.save();
      ctx.strokeStyle = MAG;
      ctx.globalAlpha = 1 - u;
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(p[0], p[1], 10 + 60 * E.outExpo(u), 0, TAU);
      ctx.stroke();
      ctx.restore();
    }
  }

  // ---------------------------------------------------------------------------
  FILM.scene({
    id: ID,
    draw(ctx, tIn, info) {
      const t = clamp(tIn, 0, info.dur);
      const bi = L.boil(info.T);
      const G = geo();
      const s = scaleAt(t);

      L.blueprint(ctx, { center: [540, 900], circles: 4, diagonals: 5, seed: sd('plate') & 0xffff });
      drawGuides(ctx, t, s);
      drawBurner(ctx, t, bi);
      drawHeat(ctx, t, G, bi);
      drawGhost(ctx, t, s, bi);
      drawBean(ctx, t, s, G, bi);
      drawLengthBracket(ctx, t, s);
      drawThermo(ctx, t, bi);
      drawNodes(ctx, t, s, bi);
      drawInset(ctx, t, s, bi);
      drawEvents(ctx, t, s, G);
      progressGlyph(ctx, L, 2, info.p, info.T, false);
    },
  });
})();

</script>
<script>
// ---- src/scenes/15-cooling-tray.js
// 15 cooling-tray : "The cooling tray and the roast ladder" (illustrated, global T 28.50 to 30.75)
// Stripes stripeCream / stripeApricot. Camera locked with a slow drift down (y 960 -> 990).
//
// Layers, back to front (inside the camera):
//   1 stripes, floor shadow, the tray stand (legs, motor housing)
//   2 the roast card behind the ladder (paper, printed slot rings), its shadow
//   3 the roast ladder: six large beans at y 520 popping in on 8th-triplets, green -> yellow -> cinnamon ->
//     medium -> dark -> dark with oil sheen, growing 0.8 -> 1.0, crease opening; the oil gleam at T 30.0
//   4 the cooling tray (ellipse (540, 1180) rx 470 ry 300): side wall, rim, perforated floor, the bean bed
//     (about 190 roasted beans, 48 x 34, medium with cinnamon and dark mixed), the stirring arm (one turn per 1.5 s)
//   5 steam / smoke wisps rising off the tray
//   6 overlays: annBlue elliptical arrow with the arm, annYellow bracket under the ladder, annMagenta ring on the
//     oily bean at T 30.0
(function () {
  'use strict';

  const ID = 'cooling-tray';
  const L = FILM.lib;
  const P = L.pal;
  const E = L.ease;
  const TAU = Math.PI * 2;
  const DEG = Math.PI / 180;
  const FR = 1 / 24;

  const clamp = (v, a = 0, b = 1) => (v < a ? a : v > b ? b : v);
  const lerp = (a, b, u) => a + (b - a) * u;
  const sstep = (a, b, x) => {
    const u = clamp((x - a) / (b - a));
    return u * u * (3 - 2 * u);
  };
  const sd = (...k) => L.hash(ID, ...k) & 0x7fffffff;

  const INK = P.ink, INKSOFT = P.inkSoft, INKFAINT = P.inkFaint, WHITE = P.white;
  const STEEL = P.steel, STEELD = P.steelDeep;
  const STEEL_L = L.mix(P.steel, P.white, 0.45);
  const FLOOR = L.mix(P.steelDeep, P.ink, 0.25);

  // ---------------------------------------------------------------------------
  // Beats (shot-local; global T in comments)
  // ---------------------------------------------------------------------------
  const POPS = [0.0, 0.25, 0.5, 0.75, 1.0, 1.25]; // T 28.50 .. 29.75, one per 8th-triplet
  const B_GLEAM = 1.5; // T 30.00 magenta ring + oil gleam (second crack)
  const ARM_PERIOD = 1.5;

  // ---------------------------------------------------------------------------
  // Layout (docs/storyboard.md 15). The ladder is re-spaced to sit inside the safe area x 60..940
  // (storyboard x 135..930 would put the last bean and its ring past x 940).
  // ---------------------------------------------------------------------------
  const LAD_Y = 520;
  const LAD_X = [125, 273, 421, 569, 717, 865];
  const LAD_W = 110, LAD_H = 150;
  const LAD_S = [0.7, 0.72, 0.86, 0.95, 1.0, 1.0]; // green to roasted: about twice the size (storyboard 0.8)
  const LAD_OPEN = [0.0, 0.08, 0.42, 0.62, 0.78, 0.84];
  const LAD_COL = [P.beanGreen, P.beanYellow, P.beanCinnamon, P.beanMedium, P.beanDark, P.beanDark];
  const LAD_ROT = -15 * DEG; // the G1 lean
  const TC = [540, 1180], TRX = 470, TRY = 300, RIM = 30;
  const KY = TRY / TRX; // foreshortening of the tray plane

  // ---------------------------------------------------------------------------
  // Bean shape (G1 superellipse family) and helpers
  // ---------------------------------------------------------------------------
  const CREASE = [[548, 682], [531, 750], [536, 826], [552, 900], [547, 976], [530, 1052], [538, 1118]].map(([x, y]) => [(x - 540) / 170, (y - 900) / 240]);
  function beanUnit(n) {
    const out = [];
    const e = 2 / 2.3;
    for (let i = 0; i < n; i++) {
      const a = (i / n) * TAU;
      const c = Math.cos(a), s = Math.sin(a);
      const x = Math.sign(c) * Math.pow(Math.abs(c), e);
      const y = Math.sign(s) * Math.pow(Math.abs(s), e);
      out.push([x * (1 - (0.06 * (1 - y)) / 2), y]);
    }
    return out;
  }
  const BEAN_U = beanUnit(48);
  const xf = (pts, cx, cy, a, b, rot) => {
    const c = Math.cos(rot), s = Math.sin(rot);
    return pts.map(([x, y]) => [cx + x * a * c - y * b * s, cy + x * a * s + y * b * c]);
  };
  function ribbon(cl, wFn) {
    const n = cl.length;
    const left = [], right = [];
    for (let i = 0; i < n; i++) {
      const a = cl[Math.max(0, i - 1)], b = cl[Math.min(n - 1, i + 1)];
      let tx = b[0] - a[0], ty = b[1] - a[1];
      const tl = Math.hypot(tx, ty) || 1;
      tx /= tl; ty /= tl;
      const w = wFn(i / (n - 1)) / 2;
      left.push([cl[i][0] - ty * w, cl[i][1] + tx * w]);
      right.push([cl[i][0] + ty * w, cl[i][1] - tx * w]);
    }
    return { left, right, poly: left.concat(right.slice().reverse()) };
  }
  const fillPoly = (ctx, pts, col, a = 1) => {
    ctx.save();
    ctx.globalAlpha *= a;
    ctx.fillStyle = col;
    ctx.beginPath();
    L.tracePath(ctx, pts, true);
    ctx.fill();
    ctx.restore();
  };

  // one roasted / green bean, upright local frame rotated by rot. o: col, open, oil, seed, lw, hs, hw, bi
  function paintBean(g, cx, cy, a, b, rot, o) {
    const pts = xf(BEAN_U, cx, cy, a, b, rot);
    const deep = L.mix(o.col, INK, o.dark ? 0.55 : 0.5);
    const local = (x, y) => {
      const dx = x - cx, dy = y - cy, c = Math.cos(-rot), s = Math.sin(-rot);
      return [(dx * c - dy * s) / a, (dx * s + dy * c) / b];
    };
    fillPoly(g, xf(BEAN_U, cx + a * 0.14, cy + b * 0.1, a, b, rot), INK, 0.2);
    const bo = o.bi == null ? {} : { boil: o.bi };
    L.inkPath(g, pts, Object.assign({ closed: true, width: o.lw, fill: o.col, seed: o.seed, wobble: o.big ? 1 : 0.5, tremble: o.big ? 0.3 : 0.12, taper: [4, 8], step: o.big ? 2.5 : 1.5, overlap: o.big ? 10 : 4 }, bo));
    const dens = (x, y) => {
      const [u, v] = local(x, y);
      return sstep(-0.05, 0.75, u * 0.62 + v * 0.78);
    };
    if (o.dark) {
      L.crossHatch(g, pts, Object.assign({ tone: 0.75, spacing: o.hs, crossSpacing: o.hs * 1.3, width: o.hw, color: L.mix(o.col, INK, 0.7), alpha: 0.9, length: [o.hs * 2, o.hs * 6], gap: [1, 3], inset: 1, overshoot: 0, clip: true, seed: o.seed + 3, density: dens }, bo));
    } else {
      L.hatch(g, pts, Object.assign({ angle: -Math.PI / 4, spacing: o.hs, width: o.hw, color: deep, alpha: 0.85, length: [o.hs * 1.8, o.hs * 6], gap: [1, 3], inset: 1, overshoot: 0, clip: true, seed: o.seed + 3, density: dens }, bo));
    }
    // highlight on the lit upper left
    g.save();
    g.translate(cx, cy);
    g.rotate(rot);
    g.strokeStyle = L.mix(o.col, WHITE, o.dark ? 0.32 : 0.5);
    g.lineCap = 'round';
    g.lineWidth = a * 0.14;
    g.globalAlpha = 0.9;
    g.beginPath();
    g.ellipse(0, 0, a * 0.72, b * 0.78, 0, 1.08 * Math.PI, 1.42 * Math.PI);
    g.stroke();
    g.restore();
    // crease
    const cl = L.smoothPts(xf(CREASE, cx, cy, a, b, rot), false, o.big ? 3 : 2);
    const w0 = a * (0.1 + 0.3 * o.open);
    const groove = ribbon(cl, (u) => w0 * (0.25 + 0.75 * Math.pow(Math.sin(Math.PI * u), 0.7)));
    fillPoly(g, groove.poly, L.mix(o.col, INK, 0.78));
    if (o.open > 0.3) {
      // opened lips catch the light on the left edge
      L.inkPath(g, groove.left, Object.assign({ width: Math.max(1, o.lw * 0.35), color: L.mix(o.col, WHITE, 0.3), alpha: 0.9, seed: o.seed + 21, taper: [6, 6], wobble: 0.3 }, bo));
    }
    L.inkPath(g, groove.right, Object.assign({ width: Math.max(1.1, o.lw * 0.45), color: INK, alpha: 0.85, seed: o.seed + 9, taper: [5, 5], wobble: 0.3, tremble: 0.1 }, bo));
    // the pale silverskin line stays in the crease
    L.inkPath(g, cl.slice(3, cl.length - 3), Object.assign({ width: Math.max(1, a * (0.05 + 0.03 * o.open)), color: P.silverskin, alpha: 0.95, seed: o.seed + 11, taper: [4, 4], wobble: 0.2, tremble: 0.05 }, bo));
    if (o.oil) {
      // oily sheen: beanOil patches and two white gloss streaks
      g.save();
      g.beginPath();
      L.tracePath(g, pts, true);
      g.clip();
      g.translate(cx, cy);
      g.rotate(rot);
      g.fillStyle = P.beanOil;
      g.globalAlpha = 0.55;
      g.beginPath();
      g.ellipse(-a * 0.42, -b * 0.25, a * 0.2, b * 0.42, 0.1, 0, TAU);
      g.fill();
      g.beginPath();
      g.ellipse(a * 0.45, b * 0.18, a * 0.12, b * 0.3, -0.1, 0, TAU);
      g.fill();
      g.strokeStyle = WHITE;
      g.lineCap = 'round';
      g.globalAlpha = 0.9;
      g.lineWidth = a * 0.12;
      g.beginPath();
      g.ellipse(0, 0, a * 0.6, b * 0.66, 0, 1.12 * Math.PI, 1.34 * Math.PI);
      g.stroke();
      g.lineWidth = a * 0.06;
      g.beginPath();
      g.ellipse(0, 0, a * 0.6, b * 0.66, 0, 1.4 * Math.PI, 1.46 * Math.PI);
      g.stroke();
      g.restore();
    }
  }

  // tray bean atlas: 4 colours (cinnamon, medium, dark, dark+oil) x 3 boil drawings, drawn at 2x
  const TCOL = [P.beanCinnamon, P.beanMedium, P.beanDark, P.beanDark];
  const CW = 64, VAR = 3, TB_W = 17, TB_L = 24; // half sizes of a 48 x 34 bean
  function atlas() {
    const S = FILM.S || 1;
    return L.cached(['bean-atlas', ID, S].join('|'), () => {
      const c = FILM.makeCanvas(Math.ceil(TCOL.length * CW * S), Math.ceil(VAR * CW * S));
      const g = c.getContext('2d');
      g.scale(S, S);
      for (let i = 0; i < TCOL.length; i++) {
        for (let k = 0; k < VAR; k++) {
          paintBean(g, i * CW + CW / 2, k * CW + CW / 2, TB_W, TB_L, 0, {
            col: TCOL[i], open: 0.75, oil: i === 3, dark: i >= 2, seed: sd('spr', i, k), bi: k * 7 + 5, lw: 2, hs: 3, hw: 1.1,
          });
        }
      }
      return c;
    });
  }
  function blit(ctx, A, ci, vk, x, y, rot, sc) {
    const S = FILM.S || 1;
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(rot);
    ctx.scale(1, 0.9); // seen from three-quarters above
    const d = CW * sc;
    ctx.drawImage(A, ci * CW * S, vk * CW * S, CW * S, CW * S, -d / 2, -d / 2, d, d);
    ctx.restore();
  }

  // ---------------------------------------------------------------------------
  // Geometry tables
  // ---------------------------------------------------------------------------
  const tp = (r, a, lift = 0) => [TC[0] + Math.cos(a) * r, TC[1] + Math.sin(a) * r * KY - lift];
  let GEO = null;
  function geo() {
    if (GEO) return GEO;
    const g = {};
    const r = L.rng(sd('beans'));
    g.beans = [];
    let guard = 0;
    while (g.beans.length < 196 && guard++ < 60000) {
      const u = r.range(-1, 1), v = r.range(-1, 1);
      if (u * u + v * v > 1) continue;
      const rr = Math.hypot(u, v) * 402, a = Math.atan2(v, u);
      const p = tp(rr, a);
      if (g.beans.some((b) => Math.hypot(b.x0 - p[0], (b.y0 - p[1]) / 0.9) < 33)) continue;
      const k = r();
      g.beans.push({
        rr, a, x0: p[0], y0: p[1],
        ci: k < 0.62 ? 1 : k < 0.8 ? 0 : k < 0.95 ? 2 : 3,
        rot: r.range(0, TAU), vk: r.int(0, 2), jig: r.range(0, TAU), sc: r.range(0.94, 1.06),
      });
    }
    // perforation dots on the floor ring
    g.perf = [];
    for (let y = -280; y <= 280; y += 14) {
      for (let x = -440; x <= 440; x += 16) {
        const xx = x + ((y / 14) % 2 ? 8 : 0);
        const e = (xx / 440) ** 2 + (y / 280) ** 2;
        if (e < 0.8 || e > 0.97) continue;
        g.perf.push([TC[0] + xx, TC[1] + y]);
      }
    }
    // steam wisps
    const w = L.rng(sd('wisps'));
    g.wisps = [];
    for (let i = 0; i < 7; i++) g.wisps.push({ x: 230 + i * 100 + w.range(-25, 25), y0: w.range(1000, 1090), h: w.range(260, 380), ph: w.range(0, 1), spd: w.range(0.35, 0.55), amp: w.range(16, 30), seed: sd('wisp', i) });
    g.rimOut = L.ellipsePts(TC[0], TC[1], TRX, TRY, 120);
    g.rimIn = L.ellipsePts(TC[0], TC[1], TRX - RIM, TRY - RIM * KY * 1.3, 120);
    GEO = g;
    return g;
  }

  // ---------------------------------------------------------------------------
  // Layers
  // ---------------------------------------------------------------------------
  function drawStand(ctx) {
    // floor shadow
    const sh = L.ellipsePts(560, 1800, 520, 60, 48);
    hat(ctx, sh, { angle: -Math.PI / 4, spacing: 6, width: 1.4, color: INK, alpha: 0.5, length: [14, 40], seed: sd('floorsh'), density: (x, y) => 1 - sstep(0.45, 1, Math.hypot((x - 560) / 520, (y - 1800) / 60)) });
    // legs
    for (const [x0, x1] of [[260, 200], [820, 880], [540, 540]]) {
      const top = x0 === 540 ? 1520 : 1440;
      ink(ctx, [[x0 - 12, top], [x1 - 12, 1800], [x1 + 12, 1800], [x0 + 12, top]], { closed: true, width: 3, fill: STEELD, smooth: false, seed: sd('leg', x0), wobble: 0.6 });
      hat(ctx, [[x0 + 1, top], [x1 + 1, 1800], [x1 + 12, 1800], [x0 + 12, top]], { angle: 0.05, spacing: 5, width: 1.3, color: INK, alpha: 0.7, length: [10, 26], seed: sd('legh', x0) });
      ink(ctx, L.ellipsePts(x1, 1802, 26, 8, 20), { closed: true, width: 2.4, fill: STEEL, seed: sd('foot', x0), wobble: 0.3 });
    }
    // motor housing under the centre
    const mh = [[470, 1470], [470, 1590], [610, 1590], [610, 1470]];
    ink(ctx, mh, { closed: true, width: 3.4, fill: STEEL, smooth: false, seed: sd('motor'), wobble: 0.6 });
    const cont = new Path2D();
    for (let y = 1476; y < 1588; y += 7) {
      cont.moveTo(560 + L.h3(y, 1, 9) * 8, y);
      cont.quadraticCurveTo(590, y + 3, 607, y);
    }
    ctx.save();
    ctx.strokeStyle = STEELD;
    ctx.lineWidth = 1.4;
    ctx.globalAlpha = 0.9;
    ctx.stroke(cont);
    ctx.restore();
    ink(ctx, L.ellipsePts(540, 1590, 70, 14, 30), { closed: true, width: 3, fill: STEELD, seed: sd('motorb'), wobble: 0.4 });
    for (let k = 0; k < 4; k++) ink(ctx, [[482, 1500 + k * 22], [520, 1500 + k * 22]], { width: 2, color: INKSOFT, seed: sd('vent', k), taper: [2, 2] });
  }

  function drawCard(ctx, bi) {
    // roast card: a paper strip behind the ladder, slightly askew
    const card = L.rrectPts(40, 400, 1000, 252, 14, 24).map(([x, y]) => [x, y + (x - 540) * -0.012]);
    fillPoly(ctx, card.map(([x, y]) => [x + 12, y + 14]), INK, 0.12);
    hat(ctx, card.map(([x, y]) => [x + 12, y + 14]), { angle: -Math.PI / 4, spacing: 6, width: 1.3, color: INK, alpha: 0.45, length: [12, 30], seed: sd('cardsh'), density: (x, y) => (y > 640 || x > 1030 ? 1 : 0) });
    ink(ctx, card, { closed: true, width: 3, fill: P.white, seed: sd('card'), wobble: 1.2 });
    ink(ctx, [[64, 444 + 6], [1016, 444 - 6]], { width: 1.5, color: INKFAINT, alpha: 0.6, seed: sd('cardline1'), taper: [10, 10] });
    ink(ctx, [[64, 618 + 6], [1016, 618 - 6]], { width: 1.5, color: INKFAINT, alpha: 0.6, seed: sd('cardline2'), taper: [10, 10] });
    // a printed slot ring under each bean and colour swatches along the bottom
    for (let i = 0; i < 6; i++) {
      const x = LAD_X[i], y = LAD_Y + (x - 540) * -0.012;
      ink(ctx, L.ellipsePts(x, y + 2, 64, 86, 40, LAD_ROT), { closed: true, width: 1.4, color: INKFAINT, alpha: 0.55, seed: sd('slot', i), wobble: 0.6 });
      const sw = L.rrectPts(x - 26, y + 92, 52, 14, 4, 8);
      ink(ctx, sw, { closed: true, width: 1.6, fill: LAD_COL[i], seed: sd('sw', i), wobble: 0.3 });
    }
  }

  function drawLadder(ctx, t, bi) {
    for (let i = 0; i < 6; i++) {
      const x = LAD_X[i], y = LAD_Y + (x - 540) * -0.012;
      const t0 = POPS[i];
      if (t + 1e-6 < t0) {
        // empty slot: a faint dashed placeholder
        L.inkPath(ctx, xf(BEAN_U, x, y, (LAD_W / 2) * LAD_S[i] * 0.9, (LAD_H / 2) * LAD_S[i] * 0.9, LAD_ROT), { closed: true, width: 1.5, color: INKFAINT, alpha: 0.35, seed: sd('ph', i), wobble: 0.6 });
        continue;
      }
      const d = Math.floor((t - t0) * 12 + 1e-6);
      const pop = [0.72, 1.08, 1][Math.min(2, d)];
      const s = LAD_S[i] * pop;
      const a = (LAD_W / 2) * s, b = (LAD_H / 2) * s;
      // cast shadow on the card
      const sh = xf(BEAN_U, x + 12, y + 16, a, b, LAD_ROT);
      L.hatch(ctx, sh, { angle: -Math.PI / 4, spacing: 4, width: 1.3, color: INK, alpha: 0.55, length: [8, 24], seed: sd('lsh', i) });
      paintBean(ctx, x, y, a, b, LAD_ROT, {
        col: LAD_COL[i], open: LAD_OPEN[i], oil: i === 5, dark: i >= 4, seed: sd('lad', i), lw: 4, hs: 6, hw: 1.5, big: true,
      });
      if (i === 5 && t >= B_GLEAM - FR) {
        // the gleam travels across the oily bean over 6 frames
        const u = clamp((t - B_GLEAM) / (6 * FR) + 1 / 6);
        if (u < 1) {
          const pts = xf(BEAN_U, x, y, a, b, LAD_ROT);
          ctx.save();
          ctx.beginPath();
          L.tracePath(ctx, pts, true);
          ctx.clip();
          const gx = x - a * 1.4 + u * a * 2.8, gy = y - b * 1.1 + u * b * 2.2;
          ctx.translate(gx, gy);
          ctx.rotate(-Math.PI / 4);
          ctx.fillStyle = WHITE;
          ctx.globalAlpha = 0.85;
          ctx.fillRect(-140, -9, 280, 18);
          ctx.globalAlpha = 0.5;
          ctx.fillRect(-140, 14, 280, 5);
          ctx.restore();
        }
        // tiny sparkle at the gleam's start
        const sp = 1 - u;
        if (sp > 0) {
          ctx.save();
          ctx.strokeStyle = WHITE;
          ctx.lineWidth = 2.5;
          ctx.lineCap = 'round';
          ctx.globalAlpha = sp;
          const sx = x - a * 0.5, sy = y - b * 0.55, rr = 18 * (0.5 + u);
          ctx.beginPath();
          ctx.moveTo(sx - rr, sy);
          ctx.lineTo(sx + rr, sy);
          ctx.moveTo(sx, sy - rr);
          ctx.lineTo(sx, sy + rr);
          ctx.stroke();
          ctx.restore();
        }
      }
    }
  }

  // boil override while painting cached layers (null = live)
  let CB = null;
  const ink = (ctx, pts, o) => L.inkPath(ctx, pts, CB == null ? o : Object.assign({}, o, { boil: CB }));
  const hat = (ctx, c, o) => L.hatch(ctx, c, CB == null ? o : Object.assign({}, o, { boil: CB }));
  const xhat = (ctx, c, o) => L.crossHatch(ctx, c, CB == null ? o : Object.assign({}, o, { boil: CB }));
  const stip = (ctx, c, o) => L.stipple(ctx, c, CB == null ? o : Object.assign({}, o, { boil: CB }));
  // the tray's static parts as three boil drawings: under the beans and over them
  const LX0 = 0, LY0 = 360, LW = 1080, LH = 1530;
  function trayLayer(G, which, v) {
    const S = FILM.S || 1;
    return L.cached(['tray', which, ID, S, v].join('|'), () => {
      const c = FILM.makeCanvas(Math.ceil(LW * S), Math.ceil(LH * S));
      const g = c.getContext('2d');
      g.scale(S, S);
      g.translate(-LX0, -LY0);
      CB = v * 5 + (which === 'under' ? 1 : 3);
      try {
        if (which === 'under') {
          drawStand(g);
          drawCard(g);
          trayUnder(g, G);
        }
        else trayOver(g, G);
      } finally {
        CB = null;
      }
      return c;
    });
  }
  function trayUnder(ctx, G) {
    // side wall below the rim (front half)
    const wall = [];
    for (let i = 0; i <= 60; i++) {
      const a = (i / 60) * Math.PI;
      wall.push(tp(TRX, a));
    }
    for (let i = 60; i >= 0; i--) {
      const a = (i / 60) * Math.PI;
      const p = tp(TRX - 6, a);
      wall.push([p[0], p[1] + 46]);
    }
    ink(ctx, wall, { closed: true, width: 4, fill: STEEL, seed: sd('wall'), wobble: 1 });
    xhat(ctx, wall, { tone: 0.5, spacing: 6, width: 1.4, color: STEELD, alpha: 0.9, seed: sd('wallh'), length: [10, 30], density: (x) => sstep(380, 1000, x) * 0.8 + 0.2 });
    // rivets on the wall
    for (let k = 1; k < 18; k++) {
      const a = (k / 18) * Math.PI;
      const p = tp(TRX - 3, a);
      ctx.fillStyle = INK;
      ctx.beginPath();
      ctx.arc(p[0], p[1] + 24, 3, 0, TAU);
      ctx.fill();
    }
    // rim top surface
    ctx.save();
    ctx.beginPath();
    L.tracePath(ctx, G.rimOut, true);
    L.tracePath(ctx, G.rimIn.slice().reverse(), true);
    ctx.fillStyle = STEEL;
    ctx.fill();
    ctx.restore();
    // floor
    fillPoly(ctx, G.rimIn, FLOOR);
    const pp = new Path2D();
    for (const [x, y] of G.perf) {
      pp.moveTo(x + 2.4, y);
      pp.ellipse(x, y, 2.4, 1.6, 0, 0, TAU);
    }
    ctx.save();
    ctx.fillStyle = INK;
    ctx.globalAlpha = 0.8;
    ctx.fill(pp);
    ctx.restore();
    // the bean bed mass
    fillPoly(ctx, L.ellipsePts(TC[0], TC[1] + 4, 412, 262, 80), L.mix(P.beanMedium, INK, 0.5));
    stip(ctx, L.ellipsePts(TC[0], TC[1] + 4, 404, 256, 60), { spacing: 9, density: 0.7, r: [1.2, 2.2], color: P.beanCinnamon, alpha: 0.5, seed: sd('bedst') });
  }
  function trayOver(ctx, G) {
    // rim outlines and light
    ink(ctx, G.rimOut, { closed: true, width: 5, seed: sd('rimo'), wobble: 1.2, double: { offset: -4, alpha: 0.35 } });
    ink(ctx, G.rimIn, { closed: true, width: 3, seed: sd('rimi'), wobble: 1 });
    ctx.save();
    ctx.strokeStyle = STEEL_L;
    ctx.lineCap = 'round';
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.ellipse(TC[0], TC[1], TRX - RIM / 2, TRY - (RIM / 2) * KY * 1.3, 0, 1.05 * Math.PI, 1.55 * Math.PI);
    ctx.stroke();
    ctx.restore();
    // rim shadow inside along the far (upper) floor edge
    const cr = [];
    for (let i = 0; i <= 40; i++) cr.push(tp(TRX - RIM, Math.PI + (i / 40) * Math.PI));
    for (let i = 40; i >= 0; i--) { const p = tp(TRX - RIM - 34, Math.PI + (i / 40) * Math.PI); cr.push([p[0], p[1] + 10]); }
    hat(ctx, cr, { angle: -Math.PI / 4, spacing: 5, width: 1.3, color: INK, alpha: 0.5, seed: sd('rimsh'), length: [10, 26], clip: true });
  }
  function drawTray(ctx, t, tw, G, A, bi) {
    const vkb = Math.floor(tw * 12);
    const phi = (t / ARM_PERIOD) * TAU;
    const v = ((bi % 3) + 3) % 3;
    // beans, circulating slower than the arm and jostled on twos
    const drift = 0.3 * phi;
    const list = G.beans.map((b) => {
      const near = Math.cos(b.a + drift - phi);
      const push = Math.max(0, near) ** 6 * 0.06;
      const a = b.a + drift * (0.6 + 0.4 * (1 - b.rr / 402)) + push;
      const p = tp(b.rr, a);
      const j = L.h3(vkb, b.jig * 100, 7) - 0.5;
      return { b, x: p[0] + j * 2, y: p[1] + j * 1.5, rot: b.rot + 0.5 * drift + j * 0.3 };
    });
    list.sort((p, q) => p.y - q.y);
    for (const q of list) blit(ctx, A, q.b.ci, (q.b.vk + vkb) % VAR, q.x, q.y, q.rot, q.b.sc);
    ctx.drawImage(trayLayer(G, 'over', v), LX0, LY0, LW, LH);
    drawArm(ctx, phi);
  }

  function drawArm(ctx, phi) {
    // central spindle
    for (let k = 0; k < 2; k++) {
      const a = phi + k * Math.PI;
      const pts = [];
      for (let i = 0; i <= 10; i++) pts.push(tp(34 + (i / 10) * 382, a, 16));
      L.inkPath(ctx, pts, { width: 18, color: INK, seed: sd('armo', k), taper: [0, 2], swell: 0, wobble: 0.4 });
      L.inkPath(ctx, pts, { width: 11, color: STEEL, seed: sd('arm', k), taper: [0, 2], swell: 0, wobble: 0.4 });
      L.inkPath(ctx, pts.slice(0, 9).map(([x, y]) => [x, y - 2]), { width: 2, color: STEEL_L, seed: sd('armh', k), taper: [4, 4], wobble: 0.3 });
      // paddles hanging into the beans, with little bristle brushes
      for (const r of [140, 250, 360]) {
        const p = tp(r, a, 16);
        const nx = -Math.sin(a), ny = Math.cos(a) * KY;
        const nl = Math.hypot(nx, ny) || 1;
        const hw = 32;
        const pad = [[p[0] - (nx / nl) * hw, p[1] - (ny / nl) * hw], [p[0] + (nx / nl) * hw, p[1] + (ny / nl) * hw], [p[0] + (nx / nl) * hw, p[1] + (ny / nl) * hw + 30], [p[0] - (nx / nl) * hw, p[1] - (ny / nl) * hw + 30]];
        L.inkPath(ctx, pad, { closed: true, width: 2.6, fill: STEEL, smooth: false, seed: sd('pad', k, r), wobble: 0.3 });
        L.hatch(ctx, pad, { angle: -Math.PI / 4, spacing: 4, width: 1.1, color: STEELD, alpha: 0.85, seed: sd('padh', k, r), length: [6, 14] });
        const br = new Path2D();
        for (let m = 0; m <= 8; m++) {
          const u = m / 8 - 0.5;
          const bx = p[0] + (nx / nl) * hw * 2 * u, by = p[1] + (ny / nl) * hw * 2 * u + 30;
          br.moveTo(bx, by);
          br.lineTo(bx + (L.h3(m, r, k) - 0.5) * 3, by + 7);
        }
        ctx.save();
        ctx.strokeStyle = INK;
        ctx.lineWidth = 1.2;
        ctx.stroke(br);
        ctx.restore();
      }
    }
    // hub
    L.inkPath(ctx, L.ellipsePts(TC[0], TC[1] - 4, 34, 22, 28), { closed: true, width: 3, fill: STEELD, seed: sd('hubb'), wobble: 0.4 });
    L.inkPath(ctx, [[TC[0] - 34, TC[1] - 4], [TC[0] - 34, TC[1] - 24], [TC[0] + 34, TC[1] - 24], [TC[0] + 34, TC[1] - 4]], { width: 3, color: INK, seed: sd('hubs'), taper: [1, 1], smooth: false });
    fillPoly(ctx, [[TC[0] - 33, TC[1] - 4], [TC[0] - 33, TC[1] - 24], [TC[0] + 33, TC[1] - 24], [TC[0] + 33, TC[1] - 4]], STEEL);
    L.hatch(ctx, [[TC[0] + 6, TC[1] - 4], [TC[0] + 6, TC[1] - 24], [TC[0] + 33, TC[1] - 24], [TC[0] + 33, TC[1] - 4]], { angle: 0.05, spacing: 4, width: 1.2, color: STEELD, alpha: 0.9, seed: sd('hubsh'), length: [6, 16] });
    L.inkPath(ctx, L.ellipsePts(TC[0], TC[1] - 24, 34, 12, 28), { closed: true, width: 3, fill: STEEL_L, seed: sd('hubt'), wobble: 0.3 });
    L.inkPath(ctx, L.ellipsePts(TC[0], TC[1] - 25, 10, 4, 14), { closed: true, width: 2, fill: INK, seed: sd('hubc'), wobble: 0.2 });
  }

  function drawWisps(ctx, t, G) {
    const tw = L.onTwos(t);
    for (const w of G.wisps) {
      const u = (tw * w.spd + w.ph) % 1;
      const base = w.y0 - u * 120;
      const len = w.h * (0.55 + 0.45 * Math.sin(Math.PI * u));
      const pts = [];
      for (let k = 0; k <= 14; k++) {
        const s = k / 14;
        const y = base - s * len;
        const x = w.x + Math.sin(s * 4.2 + tw * 3 + w.ph * 6) * w.amp * (0.3 + s) + L.noise1(s * 2 + tw, w.seed) * 10;
        pts.push([x, y]);
      }
      const a = Math.sin(Math.PI * u);
      L.inkPath(ctx, pts, { width: 12, color: WHITE, alpha: 0.55 * a, seed: w.seed, taper: [20, 60], wobble: 1, swell: 0.4 });
      L.inkPath(ctx, pts.map(([x, y]) => [x + 6, y + 2]), { width: 1.4, color: INKSOFT, alpha: 0.45 * a, seed: w.seed + 1, taper: [30, 60], wobble: 1 });
    }
  }

  function drawOverlays(ctx, t) {
    // annYellow bracket under the ladder with a tick per bean (draws on over 6 frames)
    const dp = E.outExpo(clamp(t / (6 * FR) + 1 / 6));
    L.bracket(ctx, 70, 668, 920, 668, { style: 'square', cap: 16, offset: 0, color: P.annYellow, alpha: 1, width: 2.5, p: dp });
    ctx.save();
    ctx.strokeStyle = P.annYellow;
    ctx.lineWidth = 2;
    ctx.lineCap = 'round';
    for (let i = 0; i < 6; i++) {
      if (t + 1e-6 < POPS[i]) continue;
      const x = LAD_X[i];
      ctx.beginPath();
      ctx.moveTo(x, 668);
      ctx.lineTo(x, 680);
      ctx.stroke();
    }
    // growth wedge: a thin rising line from the green bean's height to the roasted one's
    const top0 = LAD_Y - (LAD_H / 2) * LAD_S[0] - 14, top1 = LAD_Y - (LAD_H / 2) * LAD_S[5] - 14;
    const k = clamp((t - POPS[5]) / (6 * FR) + 1 / 6);
    if (t + 1e-6 >= POPS[1]) {
      const xe = lerp(LAD_X[0], LAD_X[5], clamp((t - POPS[0]) / (POPS[5] - POPS[0] + 6 * FR)));
      ctx.setLineDash([14, 10]);
      ctx.beginPath();
      ctx.moveTo(LAD_X[0], top0 + 8);
      ctx.lineTo(xe, lerp(top0, top1, (xe - LAD_X[0]) / (LAD_X[5] - LAD_X[0])) + 8);
      ctx.stroke();
      ctx.setLineDash([]);
      if (k > 0) {
        ctx.beginPath();
        ctx.moveTo(LAD_X[5] - 9, top1 + 4);
        ctx.lineTo(LAD_X[5] + 3, top1 + 10);
        ctx.lineTo(LAD_X[5] - 7, top1 + 18);
        ctx.stroke();
      }
    }
    ctx.restore();
    // annBlue arrow riding with the stirring arm (elliptical, dashed)
    const phi = (t / ARM_PERIOD) * TAU;
    const rx = 300, ry = rx * KY;
    const a0 = phi + 0.25, a1 = phi + 1.75;
    ctx.save();
    ctx.strokeStyle = P.annBlue;
    ctx.fillStyle = P.annBlue;
    ctx.lineWidth = 2.5;
    ctx.lineCap = 'round';
    ctx.setLineDash([14, 10]);
    ctx.beginPath();
    ctx.ellipse(TC[0], TC[1] - 30, rx, ry, 0, a0, a1);
    ctx.stroke();
    ctx.setLineDash([]);
    const ex = TC[0] + Math.cos(a1) * rx, ey = TC[1] - 30 + Math.sin(a1) * ry;
    const tx = -Math.sin(a1) * rx, ty = Math.cos(a1) * ry;
    const tl = Math.hypot(tx, ty) || 1;
    const ux = tx / tl, uy = ty / tl, nx = -uy, ny = ux, ah = 15;
    ctx.beginPath();
    ctx.moveTo(ex + ux * ah * 0.4, ey + uy * ah * 0.4);
    ctx.lineTo(ex - ux * ah * 0.8 + nx * ah * 0.5, ey - uy * ah * 0.8 + ny * ah * 0.5);
    ctx.lineTo(ex - ux * ah * 0.45, ey - uy * ah * 0.45);
    ctx.lineTo(ex - ux * ah * 0.8 - nx * ah * 0.5, ey - uy * ah * 0.8 - ny * ah * 0.5);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
    // annMagenta ring on the oily bean at T 30.0 (second crack), 10 frames
    if (t >= B_GLEAM - FR) {
      const u = clamp((t - B_GLEAM) / (10 * FR) + 0.1);
      const x = LAD_X[5], y = LAD_Y + (x - 540) * -0.012;
      ctx.save();
      ctx.strokeStyle = P.annMagenta;
      ctx.lineWidth = 3;
      ctx.globalAlpha = 1 - 0.7 * u;
      ctx.beginPath();
      ctx.ellipse(x, y, 62 + 8 * E.outExpo(u), 90 + 14 * E.outExpo(u), LAD_ROT, 0, TAU);
      ctx.stroke();
      // crackle ticks round the ring
      ctx.lineCap = 'round';
      ctx.globalAlpha = 1 - u;
      for (let k = 0; k < 10; k++) {
        const a = (k / 10) * TAU + 0.2;
        const r0 = 1.18 + 0.25 * E.outExpo(u);
        ctx.beginPath();
        ctx.moveTo(x + Math.cos(a) * 62 * r0, y + Math.sin(a) * 90 * r0);
        ctx.lineTo(x + Math.cos(a) * 62 * (r0 + 0.14), y + Math.sin(a) * 90 * (r0 + 0.14));
        ctx.stroke();
      }
      ctx.restore();
    }
  }

  // ---------------------------------------------------------------------------
  FILM.scene({
    id: ID,
    draw(ctx, tIn, info) {
      const t = clamp(tIn, 0, info.dur);
      const tw = L.onTwos(t);
      const bi = L.boil(info.T);
      const G = geo();
      const A = atlas();

      L.stripes(ctx, { colors: [P.stripeCream, P.stripeApricot], width: 140, angle: -0.52, offset: 8 * info.T, seed: sd('stripes') });
      const camY = 960 + 30 * E.inOutSine(info.p);
      L.camera(ctx, { x: 540, y: camY, zoom: 1 }, (ctx) => {
        ctx.drawImage(trayLayer(G, 'under', ((bi % 3) + 3) % 3), LX0, LY0, LW, LH);
        drawLadder(ctx, t, bi);
        drawTray(ctx, t, tw, G, A, bi);
        drawWisps(ctx, t, G);
        drawOverlays(ctx, t);
      });
    },
  });
})();

</script>
<script>
// ---- src/scenes/16-grinder.js
// 16 grinder : "Burrs" (illustrated, global T 30.75 to 33.00, hard cut)
//
// A conical burr grinder in partial cutaway, centred on x 540. Roasted beans sink in the glass hopper
// and tumble into the throat; the inner cone burr turns inside the toothed ring burr; fine grounds fall
// from the spout (540, 1180) into the portafilter basket at (540, 1380); a steel tamper flattens the
// heap on the 8th at T 32.625.
//
// Layers, back to front:
//   1 stripes stripeCream / stripeApricot (drift 6 px per beat), counter top and back construction lines
//   2 base plate, back column and portafilter fork (behind the portafilter)
//   3 grinder body (steel cylinder, contour hatching), dial, vents, screws
//   4 cutaway window: back wall, throat with falling beans, ring burr in section, turning cone burr,
//     grounds in the gap, chute mouth
//   5 hopper: glass, sinking beans (on twos), reflections, lid
//   6 spout, grounds stream (from T 31.50 to T 32.25), portafilter with heap (peaks T 32.25)
//   7 tamper (enters T 32.33, presses on T 32.625 with popTwos), puff of grounds
//   8 overlays: annBlue rotation arrow around the burr, annYellow fineness ruler, annMagenta dose ring
(function () {
  'use strict';

  const ID = 'grinder';
  const LIB = FILM.lib;
  const TAU = Math.PI * 2;
  const DEG = Math.PI / 180;
  const FR = 1 / 24;

  const clamp = (v, a = 0, b = 1) => (v < a ? a : v > b ? b : v);
  const lerp = (a, b, u) => a + (b - a) * u;
  const sstep = (a, b, x) => {
    const u = clamp((x - a) / (b - a));
    return u * u * (3 - 2 * u);
  };
  const sd = (...k) => LIB.hash(ID, ...k) & 0x7fffffff;

  // ---------------------------------------------------------------------------
  // beats (shot-local seconds)
  // ---------------------------------------------------------------------------
  const B_GRIND = 0.75; // T 31.50 grounds start falling
  const B_PEAK = 1.5; // T 32.25 heap peaks, grinding stops
  const B_TAMP_IN = 1.583333; // T 32.333 tamper enters
  const B_TAMP = 1.875; // T 32.625 tamp (8th)

  // ---------------------------------------------------------------------------
  // small drawing helpers
  // ---------------------------------------------------------------------------
  function trace(ctx, pts, closed = true) {
    for (let i = 0; i < pts.length; i++) {
      if (i === 0) ctx.moveTo(pts[i][0], pts[i][1]);
      else ctx.lineTo(pts[i][0], pts[i][1]);
    }
    if (closed) ctx.closePath();
  }
  function fillPoly(ctx, pts, color, alpha = 1) {
    ctx.save();
    ctx.globalAlpha *= alpha;
    ctx.fillStyle = color;
    ctx.beginPath();
    trace(ctx, pts, true);
    ctx.fill();
    ctx.restore();
  }
  function stroke(ctx, path, color, alpha, width, dash) {
    ctx.save();
    ctx.strokeStyle = color;
    ctx.globalAlpha *= alpha;
    ctx.lineWidth = width;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    if (dash) ctx.setLineDash(dash);
    ctx.stroke(path);
    ctx.restore();
  }
  function arcPts(cx, cy, rx, ry, a0, a1, n = 32) {
    const out = [];
    for (let i = 0; i <= n; i++) {
      const a = lerp(a0, a1, i / n);
      out.push([cx + Math.cos(a) * rx, cy + Math.sin(a) * ry]);
    }
    return out;
  }
  function ell(cx, cy, rx, ry, n = 48) {
    return LIB.ellipsePts(cx, cy, rx, ry, n);
  }

  // ---------------------------------------------------------------------------
  // geometry
  // ---------------------------------------------------------------------------
  const HOP = { x0: 330, x1: 750, y0: 260, bx0: 440, bx1: 640, y1: 620 };
  const hopHalf = (y) => lerp(210, 100, clamp((y - 260) / 360));
  const BODY = { x0: 360, x1: 720, y0: 640, y1: 1180 };
  const WIN = { x0: 392, x1: 688, y0: 700, y1: 1022 };
  const BURR = { cx: 540, cy: 870, yTop: 800, yBot: 940, rTop: 38, rBot: 100 };
  const coneR = (y) => lerp(BURR.rTop, BURR.rBot, clamp((y - BURR.yTop) / (BURR.yBot - BURR.yTop)));
  const gapAt = (y) => lerp(22, 4, clamp((y - BURR.yTop) / (BURR.yBot - BURR.yTop)));
  const SPOUT = { x: 540, y: 1180 };
  const PF = { cx: 540, rimY: 1350, rx: 130, ry: 30 };

  let GEO = null;
  function geo(L) {
    if (GEO) return GEO;
    const r = L.rng(sd('beans'));
    // hopper beans: packed rows, (u across the hopper -1..1, y0 at t = 0)
    const beans = [];
    for (let y = 606, row = 0; y > 150; y -= 25, row++) {
      const hw = hopHalf(Math.max(260, y)) - 30;
      const n = Math.max(2, Math.floor((hw * 2) / 38));
      for (let i = 0; i < n; i++) {
        const u = n === 1 ? 0 : -1 + (2 * (i + 0.5 + r.range(-0.3, 0.3) + (row % 2 ? 0.25 : -0.25))) / n;
        beans.push({
          u: clamp(u, -1, 1),
          y0: y + r.range(-6, 6),
          rot: r.range(0, TAU),
          s: r.range(0.88, 1.08),
          dark: r() < 0.62,
          flip: r() < 0.3,
          k: beans.length,
        });
      }
    }
    // the surface of the heap at t = 0 sits near y 300: drop beans above an uneven surface line
    const surf = (u) => 300 + 18 * Math.sin(u * 2.1 + 0.6) + 10 * Math.abs(u);
    const hb = beans.filter((b) => b.y0 >= surf(b.u));
    hb.sort((a, b) => a.y0 - b.y0);
    // grounds stream particles (template, re-seeded per drawing at draw time)
    // window back-wall rivets
    const rivets = [];
    for (let i = 0; i < 6; i++) rivets.push([WIN.x0 + 18 + (i * (WIN.x1 - WIN.x0 - 36)) / 5, WIN.y0 + 14]);
    GEO = { beans: hb, rivets };
    return GEO;
  }

  // a roasted bean (canvas direct, batched by the caller's state); returns nothing
  function bean(ctx, x, y, rot, s, fill, P, flip, jit) {
    const a = 22 * s, b = 15.5 * s;
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(rot);
    ctx.beginPath();
    ctx.ellipse(0, 0, a, b, 0, 0, TAU);
    ctx.fillStyle = fill;
    ctx.fill();
    ctx.lineWidth = 1.7;
    ctx.strokeStyle = P.ink;
    ctx.beginPath();
    ctx.ellipse(jit * 0.4, 0, a, b + jit * 0.3, 0, 0, TAU);
    ctx.stroke();
    if (!flip) {
      // the opened crease with its pale silverskin line
      ctx.beginPath();
      ctx.moveTo(-a * 0.78, jit * 0.5);
      ctx.bezierCurveTo(-a * 0.3, -b * 0.42, a * 0.25, b * 0.42, a * 0.78, -jit * 0.5);
      ctx.lineWidth = 3.2;
      ctx.strokeStyle = P.ink;
      ctx.stroke();
      ctx.lineWidth = 1;
      ctx.strokeStyle = P.beanCinnamon;
      ctx.stroke();
    } else {
      ctx.beginPath();
      ctx.ellipse(-a * 0.25, -b * 0.35, a * 0.4, b * 0.18, -0.2, 0, TAU);
      ctx.fillStyle = P.beanOil;
      ctx.globalAlpha = 0.7;
      ctx.fill();
      ctx.globalAlpha = 1;
    }
    ctx.restore();
  }
  // shade arc on the lower-right side of a bean in screen space
  function beanShade(path, x, y, s) {
    const a = 20 * s, b = 13.5 * s;
    path.moveTo(x + Math.cos(-0.2) * a, y + Math.sin(-0.2) * b);
    path.ellipse(x, y, a, b, 0, -0.2, 1.9);
  }

  // ---------------------------------------------------------------------------
  // scene
  // ---------------------------------------------------------------------------
  FILM.scene({
    id: ID,
    draw(ctx, tIn, info) {
      const L = info.lib, P = L.pal, E = L.ease;
      const dur = info.dur;
      let t = clamp(tIn, 0, dur);
      const tFrame = Math.round(t * 24) / 24;
      if (Math.abs(t - tFrame) < 1e-4) t = tFrame + 1e-7;
      const tw = L.onTwos(t);
      const bi = L.boil(info.T);
      const g = geo(L);

      const drawing = (a) => Math.floor((t - a) * 12 + 1e-6);
      const hit = (a, frames, e, lead = 1) => {
        if (t < a) return 0;
        const u = clamp((t - a) / (frames * FR) + lead / frames);
        return e ? e(u) : u;
      };
      const popTwos = (a) => (t < a ? 0 : [0.72, 1.08, 1][Math.min(2, drawing(a))]);
      const ink = (pts, o) => L.inkPath(ctx, pts, Object.assign({ step: 4.5 }, o));

      const ink0 = P.ink, inkSoft = P.inkSoft, steel = P.steel, steelDeep = P.steelDeep;
      const steelLight = L.mix(P.steel, P.white, 0.45);

      // ---- 1 stripes, counter, construction ---------------------------------
      L.stripes(ctx, { colors: [P.stripeCream, P.stripeApricot], width: 140, angle: -0.52, offset: 8 * info.T, seed: sd('stripes') });

      // counter top (scenery, full bleed)
      fillPoly(ctx, [[0, 1600], [1080, 1600], [1080, 1920], [0, 1920]], L.mix(P.wood, P.paper, 0.35));
      L.hatch(ctx, [[0, 1606], [1080, 1606], [1080, 1920], [0, 1920]], { angle: 0.04, spacing: 9, width: 1.3, color: P.bark, alpha: 0.55, length: [40, 160], gap: [6, 24], seed: sd('counter'), density: (x, y) => 0.35 + 0.5 * sstep(1600, 1900, y) });
      ink([[-20, 1600], [1100, 1600]], { width: 3, seed: sd('counterL'), taper: [0, 0], smooth: false, step: 8 });
      ink([[-20, 1614], [1100, 1614]], { width: 1.5, color: inkSoft, alpha: 0.7, seed: sd('counterL2'), taper: [0, 0], smooth: false, step: 8 });

      {
        const cons = new Path2D();
        cons.moveTo(540, 170);
        cons.lineTo(540, 1640);
        stroke(ctx, cons, P.inkFaint, 0.32, 1.5, [10, 8]);
        L.guideCircle(ctx, BURR.cx, BURR.cy, 215, { color: P.inkFaint, alpha: 0.3, width: 1.5 });
        L.guideCircle(ctx, BURR.cx, BURR.cy, 236, { color: P.inkFaint, alpha: 0.22, width: 1.2, dash: [3, 7] });
        const reg = new Path2D();
        for (const [x, y] of [[330, 260], [750, 260], [440, 620], [640, 620], [540, 870], [540, 1180], [540, 1350], [120, 1430], [960, 870], [120, 870]]) {
          reg.moveTo(x - 9, y);
          reg.lineTo(x + 9, y);
          reg.moveTo(x, y - 9);
          reg.lineTo(x, y + 9);
        }
        stroke(ctx, reg, P.inkFaint, 0.5, 1.5);
        const hl = new Path2D();
        hl.moveTo(60, 870);
        hl.lineTo(300, 870);
        hl.moveTo(780, 870);
        hl.lineTo(1020, 870);
        hl.moveTo(140, 260);
        hl.lineTo(300, 260);
        hl.moveTo(780, 260);
        hl.lineTo(940, 260);
        stroke(ctx, hl, P.inkFaint, 0.3, 1.5);
        // degree ticks on the guide circle
        const deg = new Path2D();
        for (let a = 0; a < 360; a += 10) {
          const c = Math.cos(a * DEG), s = Math.sin(a * DEG);
          const l = a % 30 === 0 ? 14 : 7;
          deg.moveTo(BURR.cx + c * 215, BURR.cy + s * 215);
          deg.lineTo(BURR.cx + c * (215 + l), BURR.cy + s * (215 + l));
        }
        stroke(ctx, deg, P.inkFaint, 0.4, 1.3);
      }

      // ---- 2 base plate, back column, fork ------------------------------------
      {
        // plate
        const plateTop = ell(540, 1530, 330, 54, 64);
        const plateSide = arcPts(540, 1530, 330, 54, 0, Math.PI, 40).concat(arcPts(540, 1556, 330, 54, Math.PI, 0, 40));
        fillPoly(ctx, plateSide, steelDeep);
        L.hatch(ctx, plateSide, { angle: Math.PI / 2 - 0.1, spacing: 6, width: 1.3, color: ink0, alpha: 0.6, length: [8, 22], seed: sd('plateS'), density: (x) => 0.3 + 0.7 * sstep(400, 860, x) });
        ink(arcPts(540, 1556, 330, 54, 0, Math.PI, 40), { width: 3, seed: sd('plateB') });
        ink(plateTop, { closed: true, width: 3, fill: steel, seed: sd('plate') });
        L.hatch(ctx, plateTop, { angle: -Math.PI / 4, spacing: 8, width: 1.3, color: steelDeep, alpha: 0.75, seed: sd('plateH'), density: (x, y) => sstep(560, 860, x + (y - 1530) * 2) });
        // grounds spill on the plate
        L.stipple(ctx, ell(560, 1528, 150, 22, 32), { spacing: 9, color: P.grounds, alpha: 0.85, seed: sd('spill'), density: (x, y) => 1 - sstep(0.3, 1, Math.hypot((x - 560) / 150, (y - 1528) / 22)) });
        // back column
        const col = [[478, 1170], [602, 1170], [602, 1532], [478, 1532]];
        fillPoly(ctx, col, L.mix(steelDeep, steel, 0.4));
        L.hatch(ctx, col, { angle: 0, spacing: 6, width: 1.3, color: ink0, alpha: 0.7, length: [10, 30], bend: 1.5, seed: sd('colH'), density: (x) => 0.25 + 0.75 * sstep(500, 600, x) });
        ink([[478, 1170], [478, 1534]], { width: 3, seed: sd('colL'), taper: [0, 4] });
        ink([[602, 1170], [602, 1534]], { width: 3, seed: sd('colR'), taper: [0, 4] });
        // fork arms reaching the portafilter ears
        for (const sgn of [-1, 1]) {
          const arm = [[540 + sgn * 55, 1262], [540 + sgn * 168, 1300], [540 + sgn * 168, 1350], [540 + sgn * 156, 1350], [540 + sgn * 156, 1312], [540 + sgn * 55, 1284]];
          ink(arm, { closed: true, width: 2.6, fill: steel, seed: sd('fork', sgn), smooth: false });
          if (sgn > 0) L.hatch(ctx, arm, { angle: -Math.PI / 4, spacing: 5, width: 1.2, color: steelDeep, alpha: 0.8, seed: sd('forkH') });
        }
        ink(ell(540, 1272, 62, 16, 32), { closed: true, width: 2.6, fill: steelLight, seed: sd('forkHub') });
      }

      // ---- 3 grinder body ------------------------------------------------------
      {
        const top = ell(540, BODY.y0, 180, 28, 64);
        const body = arcPts(540, BODY.y0, 180, 28, Math.PI, 0, 32).concat([[720, 1150]]).concat(arcPts(540, 1150, 180, 32, 0, Math.PI, 40));
        ink(body, { closed: true, width: 5, fill: steel, seed: sd('body'), double: true });
        // contour hatching on the shadow half, light from the upper left
        L.hatch(ctx, body, { angle: 0, spacing: 7, width: 1.5, color: steelDeep, alpha: 0.9, length: [18, 60], bend: 3, seed: sd('bodyH'), density: (x) => sstep(560, 700, x) });
        L.crossHatch(ctx, body, { angle: -Math.PI / 4, spacing: 6, width: 1.3, color: ink0, alpha: 0.55, layers: 2, seed: sd('bodyX'), density: (x) => sstep(650, 720, x) });
        // highlight streaks on the lit side
        const hl = new Path2D();
        hl.moveTo(392, 680);
        hl.lineTo(392, 1140);
        hl.moveTo(404, 690);
        hl.lineTo(404, 1000);
        stroke(ctx, hl, P.white, 0.85, 3);
        // top face and collar
        ink(top, { closed: true, width: 3, fill: steelLight, seed: sd('bodyTop') });
        L.hatch(ctx, top, { angle: -Math.PI / 4, spacing: 8, width: 1.2, color: steelDeep, alpha: 0.6, seed: sd('topH'), density: (x) => sstep(560, 720, x) });
        const collar = arcPts(540, 600, 112, 18, Math.PI, 0, 24).concat(arcPts(540, 640, 112, 18, 0, Math.PI, 24));
        ink(collar, { closed: true, width: 3, fill: steel, seed: sd('collar') });
        L.hatch(ctx, collar, { angle: 0.05, spacing: 5, width: 1.2, color: ink0, alpha: 0.6, length: [8, 20], seed: sd('collarH'), density: (x) => sstep(560, 650, x) });
        ink(ell(540, 600, 112, 18, 40), { closed: true, width: 2.4, fill: steelLight, seed: sd('collarTop') });
        // base band
        ink(arcPts(540, 1130, 180, 30, 0, Math.PI, 40), { width: 2, color: inkSoft, alpha: 0.9, seed: sd('band1') });
        ink(arcPts(540, 1118, 180, 30, 0, Math.PI, 40), { width: 1.6, color: inkSoft, alpha: 0.7, seed: sd('band2') });
        // vents on the right
        const vents = new Path2D();
        for (let i = 0; i < 7; i++) {
          const y = 1040 + i * 11;
          vents.moveTo(640, y);
          vents.lineTo(690, y + 2);
        }
        stroke(ctx, vents, ink0, 0.85, 3.2);
        // grind dial with fineness ticks, pointer near "fine"
        L.inkPath(ctx, ell(480, 1072, 40, 36, 40), { closed: true, width: 3, fill: steelLight, seed: sd('dial') });
        L.hatch(ctx, ell(480, 1072, 38, 34, 32), { angle: -Math.PI / 4, spacing: 5, width: 1.2, color: steelDeep, alpha: 0.7, seed: sd('dialH'), density: (x, y) => sstep(0, 30, x - 480 + y - 1072) });
        L.ticks(ctx, 480, 1072, { r: 46, n: 24, len: 6, start: -Math.PI * 0.85, span: Math.PI * 0.7, major: 4, majorLen: 11, color: ink0, alpha: 0.85, width: 1.5 });
        const pa = -Math.PI * 0.8;
        ink([[480, 1072], [480 + Math.cos(pa) * 30, 1072 + Math.sin(pa) * 28]], { width: 3.5, seed: sd('ptr'), taper: [0, 6] });
        ctx.beginPath();
        ctx.arc(480, 1072, 5, 0, TAU);
        ctx.fillStyle = ink0;
        ctx.fill();
        // power switch
        ink(L.rrectPts(560, 1050, 44, 26, 8, 8), { closed: true, width: 2.4, fill: P.ink, seed: sd('switch') });
        ink(L.rrectPts(566, 1054, 18, 18, 5, 6), { closed: true, width: 1.5, fill: P.red, seed: sd('switch2') });
      }

      // ---- 4 cutaway window ----------------------------------------------------
      {
        const win = L.rrectPts(WIN.x0, WIN.y0, WIN.x1 - WIN.x0, WIN.y1 - WIN.y0, 26, 10);
        const winIn = L.rrectPts(WIN.x0 + 11, WIN.y0 + 11, WIN.x1 - WIN.x0 - 22, WIN.y1 - WIN.y0 - 22, 18, 10);
        // wall thickness in section
        fillPoly(ctx, win, L.mix(steel, P.white, 0.2));
        ctx.save();
        ctx.beginPath();
        trace(ctx, win, true);
        trace(ctx, winIn.slice().reverse(), true);
        ctx.clip();
        const sec = new Path2D();
        for (let k = -400; k < 400; k += 7) {
          sec.moveTo(WIN.x0 + k, WIN.y1 + 10);
          sec.lineTo(WIN.x0 + k + 340, WIN.y1 - 330);
        }
        stroke(ctx, sec, ink0, 0.55, 1.2);
        ctx.restore();
        // back wall of the chamber
        fillPoly(ctx, winIn, L.mix(steelDeep, P.ink, 0.25));
        L.hatch(ctx, winIn, { angle: -Math.PI / 4, spacing: 5, width: 1.3, color: ink0, alpha: 0.6, seed: sd('backH'), clip: true });
        ctx.save();
        ctx.beginPath();
        trace(ctx, winIn, true);
        ctx.clip();
        // throat channel
        const thr = [[494, 700], [586, 700], [578, 790], [502, 790]];
        fillPoly(ctx, thr, L.mix(steelDeep, P.paper, 0.18));
        ink([[494, 690], [502, 792]], { width: 2.4, seed: sd('thrL'), taper: [0, 0] });
        ink([[586, 690], [578, 792]], { width: 2.4, seed: sd('thrR'), taper: [0, 0] });
        // beans tumbling down the throat (on twos), cracking near the cone
        for (let i = 0; i < 4; i++) {
          const ph = ((tw * 1.6 + i * 0.25) % 1);
          const y = 690 + ph * 110;
          const x = 540 + 18 * Math.sin(i * 2.3 + tw * 3);
          const s = ph > 0.75 ? 0.7 : 0.9;
          bean(ctx, x, y, i * 1.7 + tw * 5, s, i % 2 ? P.beanDark : P.beanMedium, P, i % 3 === 0, L.h3(i, bi, 3) - 0.5);
        }
        // ring burr, in section, with teeth on its inner edge
        for (const sgn of [-1, 1]) {
          const inner = [];
          for (let y = BURR.yTop - 14; y <= BURR.yBot + 14; y += 5) {
            const k = Math.round((y - BURR.yTop) / 5);
            const tooth = k % 2 ? 6 : 0;
            inner.push([540 + sgn * (coneR(y) + gapAt(y) + tooth), y]);
          }
          const block = inner.concat([[540 + sgn * 150, BURR.yBot + 14], [540 + sgn * 150, BURR.yTop - 14]]);
          fillPoly(ctx, block, steel);
          L.hatch(ctx, block, { angle: sgn > 0 ? -Math.PI / 4 : Math.PI / 4, spacing: 6, width: 1.3, color: ink0, alpha: 0.75, seed: sd('ringH', sgn), clip: true, length: [20, 80] });
          ink(block, { closed: true, width: 3, seed: sd('ring', sgn), smooth: false, wobble: 0.8 });
        }
        // the cone burr turning (24 fps), helical teeth seen from the side
        const ang = t * 7.5;
        const cone = [[540 - BURR.rTop, BURR.yTop], [540 + BURR.rTop, BURR.yTop], [540 + BURR.rBot, BURR.yBot], [540 - BURR.rBot, BURR.yBot]];
        fillPoly(ctx, cone, steelLight);
        const teeth = new Path2D(), teethB = new Path2D();
        const NT = 14;
        for (let k = 0; k < NT; k++) {
          let pen = false, penB = false;
          for (let y = BURR.yTop; y <= BURR.yBot; y += 4) {
            const phi = ang + (k * TAU) / NT + (y - BURR.yTop) * 0.012;
            const c = Math.cos(phi);
            const x = 540 + coneR(y) * Math.sin(phi);
            if (c > 0) {
              if (!pen) teeth.moveTo(x, y);
              else teeth.lineTo(x, y);
              pen = true;
              penB = false;
            } else {
              pen = false;
              if (!penB) teethB.moveTo(x, y);
              else teethB.lineTo(x, y);
              penB = true;
            }
          }
        }
        ctx.save();
        ctx.beginPath();
        trace(ctx, cone, true);
        ctx.clip();
        stroke(ctx, teeth, ink0, 0.95, 2.2);
        // shade on the right half of the cone
        L.hatch(ctx, cone, { angle: Math.PI / 2 + 0.25, spacing: 5, width: 1.3, color: steelDeep, alpha: 0.85, length: [10, 40], seed: sd('coneH'), density: (x, y) => sstep(0.1, 0.8, (x - 540) / coneR(y)) });
        ctx.restore();
        ink(cone, { closed: true, width: 3, seed: sd('cone'), smooth: false, wobble: 0.6 });
        // top nut and carrier disk, shaft
        ink(ell(540, BURR.yTop, 30, 9, 24), { closed: true, width: 2.2, fill: steel, seed: sd('nut') });
        ink(L.rrectPts(428, BURR.yBot, 224, 18, 6, 10), { closed: true, width: 2.6, fill: steel, seed: sd('carrier') });
        const shaft = [[527, 958], [553, 958], [553, 1030], [527, 1030]];
        ink(shaft, { closed: true, width: 2.4, fill: steelDeep, seed: sd('shaft'), smooth: false });
        // grounds in the gap and spilling below the burrs, moving down with the turn
        const grind = t >= B_GRIND - 0.25 && t < B_PEAK + 0.2;
        if (grind) {
          const gp = new Path2D(), gp2 = new Path2D();
          const rr = L.rng(sd('gap', drawing(0)));
          for (let i = 0; i < 90; i++) {
            const y = BURR.yTop + rr() * (BURR.yBot - BURR.yTop + 70);
            const sgn = rr() < 0.5 ? -1 : 1;
            let x;
            if (y < BURR.yBot) x = 540 + sgn * (coneR(y) + rr() * gapAt(y));
            else x = 540 + sgn * (40 + rr() * 80) * (1 - (y - BURR.yBot) / 140);
            const rad = rr.range(1, 2.2);
            const pth = rr() < 0.6 ? gp : gp2;
            pth.moveTo(x + rad, y);
            pth.arc(x, y, rad, 0, TAU);
          }
          ctx.fillStyle = P.grounds;
          ctx.fill(gp);
          ctx.fillStyle = P.beanCinnamon;
          ctx.fill(gp2);
        }
        // chute mouth at the lower left of the chamber
        const chute = [[420, 985], [500, 985], [470, 1012], [430, 1012]];
        fillPoly(ctx, chute, P.ink, 0.85);
        ink([[412, 980], [508, 980]], { width: 2.4, seed: sd('chuteL'), taper: [0, 0] });
        ctx.restore();
        ink(win, { closed: true, width: 4, seed: sd('win') });
