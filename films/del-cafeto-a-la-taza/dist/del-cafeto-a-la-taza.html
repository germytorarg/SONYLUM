      let dx = 170 * Math.sign(c) * Math.pow(Math.abs(c), e);
      const dy = 240 * Math.sign(s) * Math.pow(Math.abs(s), e);
      dx *= 1 - (0.06 * (1 - dy / 240)) / 2;
      out.push([dx, dy]);
    }
    return out;
  }
  // local (pre-rotation, centred) points to screen at centre (cx, cy), scale s, rotation r
  function place(pts, cx, cy, s, r) {
    const c = Math.cos(r), sn = Math.sin(r);
    return pts.map(([x, y]) => [cx + s * (x * c - y * sn), cy + s * (x * sn + y * c)]);
  }

  // ---------------------------------------------------------------------------
  // layout
  // ---------------------------------------------------------------------------
  const LIP = [540, 398]; // where the beans leave the scoop
  const V0 = 420, GRAV = 1500; // stream: initial speed and gravity (px/s, px/s2)
  const MOUTH_X = 540, MOUTH_Y = 1180, MOUTH_RX = 300, MOUTH_RY = 70;
  const SACK_PIVOT = [540, 1920];
  const fallY = (tau) => LIP[1] + V0 * tau + 0.5 * GRAV * tau * tau;
  // time for the stream to fall from the lip to y
  const fallT = (y) => (-V0 + Math.sqrt(V0 * V0 + 2 * GRAV * (y - LIP[1]))) / GRAV;

  // ---------------------------------------------------------------------------
  // geometry (t-independent, built once)
  // ---------------------------------------------------------------------------
  let G = null;
  function geo(L) {
    if (G) return G;
    const g = {};
    g.loc = g1Local(96);
    g.small = g1Local(28);
    g.creaseLoc = L.smoothPts(G1_CREASE.map((p) => [p[0] - G1X, p[1] - G1Y]), false, 4);
    // silverskin: the crease trimmed to y 700..1100, ends pinned to the storyboard points
    const sv = g.creaseLoc.filter((p) => p[1] + G1Y >= 700 && p[1] + G1Y <= 1100);
    const a0 = sv[0], a1 = sv[sv.length - 1];
    g.silverLoc = sv.map((p, i) => {
      const u = i / (sv.length - 1);
      const dx = lerp(G1_SILVER[0][0] - G1X - a0[0], G1_SILVER[1][0] - G1X - a1[0], u);
      return [p[0] + dx * 0.5, p[1]];
    });
    g.creaseSmall = [[8, -200], [-8, -110], [10, 0], [-8, 110], [0, 200]];
    // the stream: two seeded sequences (the second only after the tip)
    g.stream = [];
    const r = L.rng(sd('stream'));
    for (let ts = -1.4, i = 0; ts < 1.6; ts += r.range(0.042, 0.06), i++) {
      g.stream.push({ ts, ox: r.range(-16, 16), drift: r.range(-34, 34), len: r.range(40, 60), rot: r() * TAU, spin: r.range(-9, 9), extra: false, flip: r() < 0.5 });
    }
    for (let ts = B_TIP - 0.2; ts < 1.6; ts += r.range(0.04, 0.06)) {
      g.stream.push({ ts, ox: r.range(-26, 26), drift: r.range(-50, 50), len: r.range(40, 58), rot: r() * TAU, spin: r.range(-10, 10), extra: true, flip: r() < 0.5 });
    }
    // the heap texture: packed small beans in rows, back to front
    g.heap = [];
    const rh = L.rng(sd('heap'));
    for (let y = 1060; y < 1320; y += rh.range(8, 10)) {
      for (let x = 200 + rh() * 12; x < 880; x += rh.range(17, 22)) {
        g.heap.push({ x, y: y + rh.range(-2, 2), s: rh.range(0.042, 0.054), rot: rh() * TAU, tone: rh() });
      }
    }
    // the sack outline (unsquashed): sides from the rim down past the frame bottom
    g.sackL = [[226, 1200], [214, 1290], [200, 1420], [190, 1560], [182, 1720], [176, 1980]];
    g.sackR = [[854, 1200], [868, 1290], [884, 1420], [892, 1560], [898, 1720], [904, 1980]];
    g.sackPoly = L.smoothPts(g.sackL, false, 10).concat(L.smoothPts(g.sackR, false, 10).reverse());
    G = g;
    return g;
  }

  // ---------------------------------------------------------------------------
  // helpers
  // ---------------------------------------------------------------------------
  function canvas(w, h) {
    if (FILM.makeCanvas) return FILM.makeCanvas(w, h);
    const c = document.createElement('canvas');
    c.width = w;
    c.height = h;
    return c;
  }
  function addPoly(path, pts, closed) {
    pts.forEach((q, i) => (i ? path.lineTo(q[0], q[1]) : path.moveTo(q[0], q[1])));
    if (closed) path.closePath();
  }
  function strokeP(ctx, path, color, alpha, width, dash) {
    if (alpha <= 0.002) return;
    ctx.save();
    ctx.strokeStyle = color;
    ctx.globalAlpha *= alpha;
    ctx.lineWidth = width;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    if (dash) ctx.setLineDash(dash);
    ctx.stroke(path);
    ctx.restore();
  }
  function fillP(ctx, path, color, alpha = 1) {
    ctx.save();
    ctx.globalAlpha *= alpha;
    ctx.fillStyle = color;
    ctx.fill(path);
    ctx.restore();
  }
  function ribbonPoly(pts, wFn) {
    const n = pts.length;
    const Lp = [], Rp = [];
    for (let i = 0; i < n; i++) {
      const a = pts[Math.max(0, i - 1)], b = pts[Math.min(n - 1, i + 1)];
      let tx = b[0] - a[0], ty = b[1] - a[1];
      const tl = Math.hypot(tx, ty) || 1;
      tx /= tl;
      ty /= tl;
      const w = wFn(i / (n - 1)) / 2;
      Lp.push([pts[i][0] - ty * w, pts[i][1] + tx * w]);
      Rp.push([pts[i][0] + ty * w, pts[i][1] - tx * w]);
    }
    return Lp.concat(Rp.reverse());
  }

  // a small green bean (stream, heap): filled body, lower-right shadow crescent, outline, crease
  function smallBean(paths, g, x, y, s, rot, flip) {
    const body = place(g.small, x, y, s, rot);
    const lit = place(g.small.map(([a, b]) => [a * 0.84 - 14, b * 0.86 - 18]), x, y, s, rot);
    addPoly(paths.deep, body, true);
    addPoly(paths.body, lit, true);
    addPoly(paths.line, body, true);
    const cr = place(g.creaseSmall.map(([a, b]) => [flip ? -a : a, b]), x, y, s, rot);
    addPoly(paths.crease, cr, false);
  }
  function newBeanPaths() {
    return { deep: new Path2D(), body: new Path2D(), line: new Path2D(), crease: new Path2D() };
  }
  function flushBeans(ctx, P, paths, lineW, alpha = 1) {
    fillP(ctx, paths.deep, P.beanGreenDeep, alpha);
    fillP(ctx, paths.body, P.beanGreen, alpha);
    strokeP(ctx, paths.line, P.ink, 0.95 * alpha, lineW);
    strokeP(ctx, paths.crease, P.beanGreenDeep, alpha, lineW * 1.2);
    strokeP(ctx, paths.crease, P.ink, 0.6 * alpha, lineW * 0.5);
  }

  // the heap texture, cached once
  const HEAP_Y = 1040, HEAP_H = 300;
  function heapSprite(L, P, g) {
    const S = FILM.S || 1;
    return L.cached(['heap', ID, S].join('|'), () => {
      const c = canvas(Math.round(1080 * S), Math.round(HEAP_H * S));
      const x = c.getContext('2d');
      x.scale(S, S);
      x.translate(0, -HEAP_Y);
      x.fillStyle = L.mix(P.beanGreenDeep, P.ink, 0.45);
      x.fillRect(180, HEAP_Y, 720, HEAP_H);
      // rows back to front, flushed every few rows so nearer beans overlap
      let paths = newBeanPaths();
      let lastY = -1, rows = 0;
      for (const b of g.heap) {
        if (b.y > lastY + 6) {
          rows++;
          lastY = b.y;
          if (rows % 2 === 0) {
            flushBeans(x, P, paths, 1);
            paths = newBeanPaths();
          }
        }
        smallBean(paths, g, b.x, b.y, b.s, b.rot, b.tone < 0.5);
      }
      flushBeans(x, P, paths, 1);
      return c;
    });
  }

  // ---------------------------------------------------------------------------
  // layers
  // ---------------------------------------------------------------------------
  function drawBackSacks(ctx, L, P, bi) {
    const sacks = [
      { pts: [[-90, 1236], [-40, 1214], [40, 1206], [130, 1214], [176, 1250], [190, 1400], [200, 1980], [-90, 1980]], seed: 1, tie: [40, 1206] },
      { pts: [[884, 1420], [896, 1240], [940, 1204], [1020, 1194], [1110, 1204], [1170, 1226], [1170, 1980], [880, 1980]], seed: 2, tie: [1020, 1194] },
    ];
    for (const s of sacks) {
      L.inkPath(ctx, s.pts, { closed: true, fill: L.mix(P.jute, P.paper, 0.25), width: 3, boil: bi, seed: sd('bsack', s.seed), taper: [6, 10] });
      L.crossHatch(ctx, s.pts, { spacing: 7, crossSpacing: 7, angle: 0, turn: [Math.PI / 2], layers: 2, width: 1, color: P.juteDeep, alpha: 0.4, boil: bi, seed: sd('bweave', s.seed) });
      L.hatch(ctx, s.pts, { spacing: 5, width: 1.3, color: P.juteDeep, alpha: 0.75, boil: bi, seed: sd('bshade', s.seed), density: (x, y) => (s.seed === 1 ? sstep(60, 190, x) : sstep(1040, 1160, x)) });
      // the stitched top seam with its two corner ears
      const [tx, ty] = s.tie;
      L.inkPath(ctx, [[tx - 120, ty + 40], [tx - 60, ty + 12], [tx, ty + 4], [tx + 60, ty + 12], [tx + 120, ty + 40]], { width: 2, color: P.juteDeep, boil: bi, seed: sd('bseam', s.seed) });
      const st = new Path2D();
      for (let k = -5; k <= 5; k++) {
        const x = tx + k * 21, y = ty + 4 + Math.pow(k / 5, 2) * 34;
        st.moveTo(x - 5, y - 6);
        st.lineTo(x + 5, y + 6);
      }
      strokeP(ctx, st, P.barkDeep, 0.9, 1.6);
    }
  }

  function drawSack(ctx, L, P, g, yh, bi) {
    // body
    const body = g.sackPoly;
    L.inkPath(ctx, body, { closed: true, fill: P.jute, width: 5, boil: bi, seed: sd('sack'), taper: [8, 14] });
    // jute weave: a grid of warp and weft, slightly bowed
    L.crossHatch(ctx, body, { spacing: 6, crossSpacing: 6, angle: 0.02, turn: [Math.PI / 2 - 0.04], layers: 2, width: 1.1, color: P.juteDeep, alpha: 0.45, length: [30, 90], gap: [1, 3], boil: bi, seed: sd('weave') });
    // shading: the right side and the underside of the rim, light from upper left
    L.crossHatch(ctx, body, { spacing: 6, crossSpacing: 7, width: 1.4, color: P.juteDeep, alpha: 0.85, tone: 0.7, boil: bi, seed: sd('sackshade'), density: (x, y) => clamp(sstep(640, 900, x) + 0.9 * sstep(1290, 1230, y) + 0.3 * sstep(260, 180, x)) });
    // folds: long soft creases down the body
    const folds = [
      [[330, 1300], [322, 1460], [300, 1640], [292, 1900]],
      [[612, 1310], [628, 1480], [640, 1700], [652, 1920]],
      [[760, 1300], [776, 1500], [800, 1760]],
    ];
    folds.forEach((f, i) => {
      L.inkPath(ctx, f, { width: 2, color: P.juteDeep, boil: bi, seed: sd('fold', i) });
      const off = f.map(([x, y]) => [x + 9, y]);
      L.hatch(ctx, ribbonPoly(off, () => 16), { spacing: 4, width: 1.1, color: P.juteDeep, alpha: 0.7, boil: bi, seed: sd('foldh', i), length: [10, 30] });
    });
    // stencilled emblem: an oval with its crease (no text)
    const em = place(g.small, 540, 1515, 0.3, -12 * DEG);
    L.inkPath(ctx, em, { closed: true, width: 7, color: P.juteDeep, alpha: 0.9, boil: bi, seed: sd('emblem'), taper: [4, 8], wobble: 1 });
    L.inkPath(ctx, place([[10, -190], [-12, -90], [10, 10], [-10, 110], [4, 190]], 540, 1515, 0.3, -12 * DEG), { width: 6, color: P.juteDeep, alpha: 0.9, boil: bi, seed: sd('emcrease') });
    // stencil bridges and a ring around the emblem
    L.inkPath(ctx, L.ellipsePts(540, 1515, 104, 104, 48), { closed: true, width: 3, color: P.juteDeep, alpha: 0.8, boil: bi, seed: sd('emring'), taper: [4, 8] });
    // rope tie round the neck: two twisted strands, a knot and hanging ends
    const rope = [];
    for (let i = 0; i <= 40; i++) {
      const a = Math.PI * (i / 40);
      rope.push([540 + Math.cos(a) * 318, 1268 + Math.sin(a) * 66]);
    }
    rope.reverse();
    L.inkPath(ctx, ribbonPoly(rope, () => 15), { closed: true, fill: L.mix(P.jute, P.white, 0.25), width: 2.6, boil: bi, seed: sd('rope'), taper: [3, 6] });
    const twist = new Path2D();
    for (let i = 1; i < rope.length - 1; i++) {
      const [x, y] = rope[i];
      twist.moveTo(x - 6, y - 7);
      twist.lineTo(x + 4, y + 7);
    }
    strokeP(ctx, twist, P.juteDeep, 0.9, 1.6);
    const kx = 396, ky = 1326;
    L.inkPath(ctx, L.ellipsePts(kx, ky, 18, 14, 20), { closed: true, fill: L.mix(P.jute, P.white, 0.2), width: 2.6, boil: bi, seed: sd('knot'), taper: [3, 6] });
    L.inkPath(ctx, [[kx - 4, ky + 10], [kx - 14, ky + 60], [kx - 8, ky + 110]], { width: 6, color: P.juteDeep, boil: bi, seed: sd('end1') });
    L.inkPath(ctx, [[kx + 6, ky + 10], [kx + 18, ky + 54], [kx + 26, ky + 96]], { width: 6, color: P.juteDeep, boil: bi, seed: sd('end2') });
  }

  // cached sprites of the static sack art, two boil drawings each
  const SPR_Y0 = 1080;
  function sprite(L, key, b, fn) {
    const S = FILM.S || 1;
    return L.cached([key, ID, b, S].join('|'), () => {
      const c = canvas(Math.round(1080 * S), Math.round((1920 - SPR_Y0) * S));
      const x = c.getContext('2d');
      x.scale(S, S);
      x.translate(0, -SPR_Y0);
      fn(x);
      return c;
    });
  }

  // the mouth: back rim, inside, heap (rising), front rim
  function mouthBack(ctx, L, P, g, yh, bi) {
    const inner = L.ellipsePts(MOUTH_X, MOUTH_Y, MOUTH_RX - 14, MOUTH_RY - 10, 72);
    // the dark inside
    L.inkPath(ctx, inner, { closed: true, fill: L.mix(P.juteDeep, P.ink, 0.45), width: 2, seed: sd('inside'), taper: [3, 6] });
    // heap: the cached bean texture below a domed surface line, clipped to the opening
    const dome = [];
    for (let x = MOUTH_X - MOUTH_RX; x <= MOUTH_X + MOUTH_RX; x += 12) {
      const u = (x - MOUTH_X) / (MOUTH_RX - 10);
      dome.push([x, yh + 44 * u * u + 3 * Math.sin(x * 0.07)]);
    }
    ctx.save();
    ctx.beginPath();
    L.tracePath(ctx, inner, true);
    ctx.clip();
    ctx.beginPath();
    L.tracePath(ctx, dome.concat([[MOUTH_X + MOUTH_RX, 1400], [MOUTH_X - MOUTH_RX, 1400]]), true);
    ctx.clip();
    ctx.drawImage(heapSprite(L, P, g), 0, HEAP_Y, 1080, HEAP_H);
    // shade the heap toward the back wall and the right
    L.hatch(ctx, null, { bounds: [MOUTH_X - MOUTH_RX, MOUTH_Y - MOUTH_RY, MOUTH_RX * 2, MOUTH_RY * 2 + 20], spacing: 5, width: 1.2, color: P.ink, alpha: 0.55, length: [10, 30], seed: sd('heapshade'), density: (x, y) => 0.15 + 0.7 * sstep(700, 840, x) + 0.4 * sstep(1150, 1120, y) });
    ctx.restore();
    // the back half of the rolled rim
    const back = [];
    for (let i = 0; i <= 36; i++) {
      const a = Math.PI + Math.PI * (i / 36);
      back.push([MOUTH_X + Math.cos(a) * (MOUTH_RX + 6), MOUTH_Y + Math.sin(a) * (MOUTH_RY + 4)]);
    }
    L.inkPath(ctx, ribbonPoly(back, (u) => 20 + 6 * Math.sin(Math.PI * u)), { closed: true, fill: L.mix(P.jute, P.juteDeep, 0.3), width: 3, seed: sd('rimback'), taper: [4, 8] });
  }
  function mouthFront(ctx, L, P, bi) {
    const front = [];
    for (let i = 0; i <= 36; i++) {
      const a = Math.PI * (i / 36);
      front.push([MOUTH_X + Math.cos(a) * (MOUTH_RX + 8), MOUTH_Y + Math.sin(a) * (MOUTH_RY + 8)]);
    }
    front.reverse();
    const band = ribbonPoly(front, (u) => 30 + 10 * Math.sin(Math.PI * u));
    L.inkPath(ctx, band, { closed: true, fill: L.mix(P.jute, P.white, 0.12), width: 4, seed: sd('rimfront'), taper: [4, 8], double: true });
    // roll texture: curved strokes across the band, darker underneath
    const strokes = new Path2D();
    for (let i = 2; i < front.length - 2; i++) {
      const [x, y] = front[i];
      strokes.moveTo(x - 4, y - 12);
      strokes.quadraticCurveTo(x + 4, y, x - 2, y + 14);
    }
    strokeP(ctx, strokes, P.juteDeep, 0.75, 1.4);
    const under = [];
    for (let i = 0; i <= 36; i++) {
      const a = Math.PI * (i / 36);
      under.push([MOUTH_X + Math.cos(a) * (MOUTH_RX + 10), MOUTH_Y + 8 + Math.sin(a) * (MOUTH_RY + 16)]);
    }
    L.hatch(ctx, ribbonPoly(under.reverse(), () => 12), { spacing: 4, width: 1.2, color: P.juteDeep, alpha: 0.9, seed: sd('rimunder'), length: [10, 26] });
  }

  // the stream: beans in flight at time tw (on twos); landed beans vanish into the heap
  function drawStream(ctx, L, P, g, tw, yh, alpha, tipK) {
    if (alpha <= 0.01) return;
    const back = newBeanPaths(), front = newBeanPaths();
    for (const b of g.stream) {
      if (b.extra && tw < B_TIP) continue;
      const tau = tw - b.ts;
      if (tau < 0) continue;
      const y = fallY(tau);
      if (y > yh + 8) continue;
      const spread = (b.extra ? 1.3 : 1) * (0.7 + 0.6 * tipK);
      const x = LIP[0] + b.ox * Math.min(1, tau * 3) * spread + b.drift * tau * spread;
      const s = b.len / 480;
      smallBean(y > MOUTH_Y - 30 ? back : front, g, x, y, s, b.rot + b.spin * tau, b.flip);
    }
    flushBeans(ctx, P, back, 1.8, alpha);
    flushBeans(ctx, P, front, 1.8, alpha);
  }

  function drawScoop(ctx, L, P, tilt, slide, bi) {
    // local frame: the pouring point at the origin, the scoop body extending to the upper left
    ctx.save();
    ctx.translate(LIP[0], LIP[1] + slide);
    ctx.rotate(tilt);
    const outline = [[6, -4], [0, -52], [-70, -66], [-160, -78], [-250, -86], [-262, -40], [-258, 26], [-236, 52], [-160, 50], [-80, 40], [-20, 26]];
    const mouth = L.ellipsePts(-4, -26, 16, 30, 32);
    // handle out of frame to the upper left
    const handle = [[-250, -30], [-420, -60], [-760, -120]];
    L.inkPath(ctx, ribbonPoly(handle, (u) => lerp(18, 26, u)), { closed: true, fill: P.wood, width: 3.2, seed: sd('handle'), taper: [4, 8] });
    L.hatch(ctx, ribbonPoly(handle.map(([x, y]) => [x, y + 6]), (u) => lerp(8, 12, u)), { angle: Math.atan2(-90, -510), spacing: 3.5, width: 1.1, color: P.barkDeep, alpha: 0.85, length: [30, 90], seed: sd('handleh') });
    L.inkPath(ctx, outline, { closed: true, fill: P.steel, width: 4.5, seed: sd('scoop'), taper: [6, 10], double: true });
    // steel: contour hatching on the lower half (shadow), a long highlight on top
    L.hatch(ctx, outline, { angle: Math.PI / 2 - 0.15, spacing: 5, width: 1.3, color: P.steelDeep, alpha: 0.9, length: [10, 34], seed: sd('scooph'), density: (x, y) => sstep(-20, 30, y) });
    L.crossHatch(ctx, outline, { angle: Math.PI / 2 - 0.15, spacing: 5, width: 1.1, color: P.steelDeep, alpha: 0.7, tone: 0.5, seed: sd('scoopx'), density: (x, y) => sstep(20, 50, y) });
    L.inkPath(ctx, [[-30, -46], [-120, -62], [-220, -72]], { width: 4, color: P.white, alpha: 0.85, seed: sd('scoophi'), taper: [10, 14] });
    // the back cap seam and rivets
    L.inkPath(ctx, [[-232, -82], [-240, -30], [-236, 20], [-222, 48]], { width: 2, color: P.steelDeep, seed: sd('seam') });
    const rv = new Path2D();
    for (const [x, y] of [[-246, -54], [-250, -6], [-246, 34]]) {
      rv.moveTo(x + 4, y);
      rv.arc(x, y, 4, 0, TAU);
    }
    fillP(ctx, rv, P.steelDeep, 1);
    // the open mouth with green beans tumbling over its lip
    L.inkPath(ctx, mouth, { closed: true, fill: L.mix(P.steelDeep, P.ink, 0.4), width: 3, seed: sd('mouth'), taper: [4, 8] });
    const bp = newBeanPaths();
    const r = L.rng(sd('scoopbeans', Math.floor(L.onTwos(L.T) * 12) % 4));
    for (let i = 0; i < 9; i++) smallBean(bp, G, r.range(-14, 6), r.range(-48, -4), r.range(0.07, 0.09), r() * TAU, r() < 0.5);
    ctx.save();
    ctx.beginPath();
    L.tracePath(ctx, mouth, true);
    ctx.clip();
    flushBeans(ctx, P, bp, 1.4);
    ctx.restore();
    ctx.restore();
  }

  // the hero bean in full detail at centre (cx, cy), scale s
  function drawHero(ctx, L, P, g, cx, cy, s, rot, bi) {
    const out = place(g.loc, cx, cy, s, rot);
    const shadeD = (x, y) => ((x - cx) * 0.6 + (y - cy) * 0.8) / (240 * s);
    L.inkPath(ctx, out, { closed: true, fill: P.beanGreen, width: Math.max(2.4, 5 * Math.sqrt(s)), seed: sd('hero'), taper: [10, 22] });
    if (s > 0.3) {
      // matte tone: hatching on the shadow side (light from the upper left), a cross layer deep down
      L.hatch(ctx, out, { spacing: 5.5 * Math.max(0.6, s), width: 1.5, color: P.beanGreenDeep, alpha: 0.85, length: [16, 60].map((v) => v * Math.max(0.5, s)), seed: sd('herohatch'), density: (x, y) => sstep(-0.15, 0.7, shadeD(x, y)) });
      L.hatch(ctx, out, { angle: -Math.PI / 4 - Math.PI / 3, spacing: 7 * Math.max(0.6, s), width: 1.3, color: P.beanGreenDeep, alpha: 0.8, length: [14, 44].map((v) => v * Math.max(0.5, s)), seed: sd('herox'), density: (x, y) => sstep(0.3, 0.9, shadeD(x, y)) });
      // dull surface: fine stipple all over, denser in shade
      L.stipple(ctx, out, { spacing: 9 * Math.max(0.6, s), r: [0.8, 1.6].map((v) => v * Math.max(0.6, s)), color: P.beanGreenDeep, alpha: 0.6, seed: sd('herostip'), density: (x, y) => 0.25 + 0.6 * sstep(-0.4, 0.6, shadeD(x, y)) });
      // a faint lit edge on the upper left (matte, not a gloss)
      const lit = place(g.loc.slice(50, 78).map(([x, y]) => [x * 0.9, y * 0.92]), cx, cy, s, rot);
      L.inkPath(ctx, lit, { width: 3 * s + 1, color: L.mix(P.beanGreen, P.white, 0.45), alpha: 0.8, seed: sd('herolit'), taper: [20 * s, 30 * s] });
    }
    // crease groove: beanGreenDeep, 12 px tapering to 3, an inked edge, the silverskin inside
    const cr = place(g.creaseLoc, cx, cy, s, rot);
    const gw = ribbonPoly(cr, (u) => s * (3 + 9 * Math.pow(Math.sin(Math.PI * u), 0.55)));
    L.inkPath(ctx, gw, { closed: true, fill: L.mix(P.beanGreenDeep, P.ink, 0.25), width: Math.max(1, 1.8 * s), color: P.ink, alpha: 0.85, seed: sd('herogroove'), taper: [6, 10], wobble: 0.8 * s });
    L.inkPath(ctx, place(g.silverLoc, cx, cy, s, rot), { width: Math.max(0.8, 3 * s), color: P.silverskin, seed: sd('herosilver'), taper: [12 * s, 16 * s], wobble: 0.6 });
    if (s > 0.3) {
      // the doubled hero outline, occasional
      L.inkPath(ctx, out, { closed: true, width: 1.5, alpha: 0.4, seed: sd('herodbl'), taper: [10, 22], double: false, wobble: 2.4 });
    }
  }

  // ---------------------------------------------------------------------------
  FILM.scene({
    id: ID,
    draw(ctx, tIn, info) {
      const L = info.lib, P = L.pal;
      const t = clamp(tIn, 0, info.dur);
      const g = geo(L);
      const bi = L.boil(info.T);
      const tw = L.onTwos(t);
      const f = Math.min(35, Math.floor(t * 24 + 1e-6));

      // 1 stripes
      L.stripes(ctx, { colors: [P.stripeCream, P.stripeSage], width: 140, angle: -0.52, offset: (info.T / 0.75) * 6 });

      // entrances: sack up and scoop down over frames 2..8 (on twos); nothing but the bean on frame 0
      const enter = L.ease.outCubic(clamp((tw - 2 * FR) / (6 * FR)));
      const sackDY = (1 - enter) * 760;
      const scoopDY = -(1 - enter) * 520;
      const streamA = clamp((t - 4 * FR) / (5 * FR));

      // heap level: rises from the first landings, faster after the tip
      const heapU = clamp((tw - 0.55) / 0.95);
      let yh = lerp(1206, 1138, L.ease.outQuad(heapU));
      // sack slump (3 percent squash) on the 8th at T 23.625, outBack over 3 frames on its frame
      const slumpK = f >= 27 ? L.ease.outBack(clamp((f - 26) / 3)) : 0;
      const sy = 1 - 0.03 * slumpK, sx = 1 + 0.015 * slumpK;
      const yhScreen = SACK_PIVOT[1] - (SACK_PIVOT[1] - yh) * sy + sackDY;

      // 2-3 the sacks
      if (enter > 0) {
        ctx.save();
        ctx.translate(0, sackDY);
        ctx.drawImage(sprite(L, 'backsacks', bi % 2, (x) => drawBackSacks(x, L, P, bi % 2)), 0, SPR_Y0, 1080, 1920 - SPR_Y0);
        ctx.translate(SACK_PIVOT[0], SACK_PIVOT[1]);
        ctx.scale(sx, sy);
        ctx.translate(-SACK_PIVOT[0], -SACK_PIVOT[1]);
        ctx.drawImage(sprite(L, 'sack', bi % 2, (x) => drawSack(x, L, P, g, 0, bi % 2)), 0, SPR_Y0, 1080, 1920 - SPR_Y0);
        mouthBack(ctx, L, P, g, yh, bi);
        ctx.restore();
      }

      // 4 the stream (behind the front rim once the beans drop below the rim line)
      const tipK = f >= 18 ? L.ease.outBack(clamp((f - 17) / 3)) : 0;
      if (enter > 0 && streamA > 0) {
        ctx.save();
        // beans in flight are hidden by the front rim: clip out below the front rim curve
        ctx.beginPath();
        ctx.rect(0, 0, 1080, 1920);
        const frontY = (x) => SACK_PIVOT[1] - (SACK_PIVOT[1] - (MOUTH_Y + MOUTH_RY * Math.sqrt(Math.max(0, 1 - Math.pow((x - MOUTH_X) / MOUTH_RX, 2))) * 0.2)) * sy + sackDY;
        ctx.moveTo(MOUTH_X - MOUTH_RX, frontY(MOUTH_X - MOUTH_RX));
        for (let x = MOUTH_X - MOUTH_RX; x <= MOUTH_X + MOUTH_RX; x += 20) ctx.lineTo(x, frontY(x));
        ctx.lineTo(MOUTH_X + MOUTH_RX, 1920);
        ctx.lineTo(MOUTH_X - MOUTH_RX, 1920);
        ctx.closePath();
        ctx.clip('evenodd');
        drawStream(ctx, L, P, g, tw, yhScreen, streamA, tipK);
        ctx.restore();
      }
      if (enter > 0) {
        ctx.save();
        ctx.translate(0, sackDY);
        ctx.translate(SACK_PIVOT[0], SACK_PIVOT[1]);
        ctx.scale(sx, sy);
        ctx.translate(-SACK_PIVOT[0], -SACK_PIVOT[1]);
        mouthFront(ctx, L, P, bi);
        ctx.restore();
      }

      // 5 the scoop
      if (enter > 0) drawScoop(ctx, L, P, -(28 + 14 * tipK) * DEG * -1, scoopDY, bi);

      // 6 the hero bean: G1 on frame 0, shrinking about (540, 900), then falling with the stream
      const kS = L.ease.inOutCubic(clamp(tw / B_SHRUNK));
      const s = lerp(1, 0.12, kS);
      if (tw < B_SHRUNK) {
        drawHero(ctx, L, P, g, G1X, G1Y, s, G1ROT, bi);
      } else {
        const tau0 = fallT(G1Y);
        const tau = tau0 + (tw - B_SHRUNK);
        const y = fallY(tau);
        if (y < yhScreen + 8) {
          ctx.save();
          if (y > MOUTH_Y - 30) {
            ctx.beginPath();
            ctx.rect(0, 0, 1080, MOUTH_Y + 10 + sackDY);
            ctx.clip();
          }
          drawHero(ctx, L, P, g, G1X + 6 * (tw - B_SHRUNK), y, 0.12, G1ROT + 5 * (tw - B_SHRUNK), bi);
          ctx.restore();
        }
      }

      // 7 overlays
      // an annYellow attention ring off the bean as the shot opens (expands and fades, 9 frames)
      if (f < 9) {
        const u = (f + 1) / 9;
        const k = L.ease.outExpo(u);
        ctx.save();
        ctx.strokeStyle = P.annYellow;
        ctx.globalAlpha = 1 - sstep(0.35, 1, u);
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.ellipse(G1X, G1Y, lerp(200, 300, k) * Math.max(s, 0.3), lerp(270, 380, k) * Math.max(s, 0.3), G1ROT, 0, TAU);
        ctx.stroke();
        ctx.restore();
      }
      if (f >= 9) {
        const prog = L.ease.outExpo((f - 8) / 6);
        const x = 640, y0 = LIP[1] + 40, y1 = yhScreen - 30;
        const ye = lerp(y0, y1, prog);
        ctx.save();
        ctx.strokeStyle = P.annBlue;
        ctx.fillStyle = P.annBlue;
        ctx.lineWidth = 2.5;
        ctx.lineCap = 'round';
        ctx.setLineDash([14, 10]);
        ctx.beginPath();
        ctx.moveTo(x - 30, y0);
        ctx.quadraticCurveTo(x, y0 + 60, x, Math.min(ye, y0 + 120));
        if (ye > y0 + 120) ctx.lineTo(x, ye);
        ctx.stroke();
        ctx.setLineDash([]);
        ctx.beginPath();
        ctx.moveTo(x, ye + 8);
        ctx.lineTo(x - 9, ye - 10);
        ctx.lineTo(x, ye - 5);
        ctx.lineTo(x + 9, ye - 10);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
        // the sack height: an annYellow bracket from the heap surface down to the safe-area floor
        const bx = 930, by0 = yhScreen, by1 = 1536;
        L.bracket(ctx, bx, by0, bx, by1, { color: P.annYellow, alpha: 1, width: 2, cap: 16, p: prog });
        // a tick that rides the heap level
        ctx.save();
        ctx.strokeStyle = P.annYellow;
        ctx.lineWidth = 2;
        ctx.setLineDash([6, 6]);
        ctx.beginPath();
        ctx.moveTo(MOUTH_X + 200, by0);
        ctx.lineTo(bx - 10, by0);
        ctx.stroke();
        ctx.restore();
      }
      // an annMagenta ring on the slump
      if (f >= 27 && f < 36) {
        const u = (f - 26) / 9;
        ctx.save();
        ctx.strokeStyle = P.annMagenta;
        ctx.globalAlpha = 1 - sstep(0.3, 1, u);
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.ellipse(MOUTH_X, yhScreen + 10, lerp(160, 330, L.ease.outExpo(u)), lerp(40, 90, L.ease.outExpo(u)), 0, 0, TAU);
        ctx.stroke();
        ctx.restore();
      }
    },
  });
})();

</script>
<script>
// ---- src/scenes/13-roaster-drum.js
// 13 roaster-drum : "The drum turns: green to gold to brown" (illustrated, global T 24.00 to 27.00)
// Act 3 opens on the hinge (bar 9 downbeat). Stripes stripeCream / stripeApricot.
//
// Layers, back to front (all inside the camera, which is locked until T 26.25 then pushes 1.0 -> 1.6):
//   1 stripes (drift 6 px per beat), floor shadow, legs and plinth
//   2 the roaster body: extruded red enamel box (front rrect (160,560)-(920,1380)), top and side faces,
//     hatched shadow side, seams, rivets, gloss streaks, gas pipe and valve, sample trier
//   3 chimney (chaff collector) on the left (220, 560 -> 260), hopper on top (420,360)-(660,560), dial stalk
//   4 burner slot with 7 flames at y 1300, heat shimmer
//   5 the cutaway window r 300 at (540, 960): cavity, rotating drum r 280 (back plate, hub, perforations, 8 vanes),
//     about 140 beans tumbling (bed + carried + flying), the pour from the hopper on the hinge, chaff in the drum
//   6 window bezel, bolts, hinge and latch; the thermometer dial at (820, 420) with its needle 0 -> 90 percent
//   7 overlays: annYellow roast arc r 330 with stage dots, annBlue rotation arrows, annMagenta ring on the dial (T 26.25)
(function () {
  'use strict';

  const ID = 'roaster-drum';
  const L = FILM.lib;
  const P = L.pal;
  const E = L.ease;
  const TAU = Math.PI * 2;
  const DEG = Math.PI / 180;
  const FR = 1 / 24;

  const clamp = (v, a = 0, b = 1) => (v < a ? a : v > b ? b : v);
  const lerp = (a, b, u) => a + (b - a) * u;
  const sstep = (a, b, x) => {
    const u = clamp((x - a) / (b - a));
    return u * u * (3 - 2 * u);
  };
  const sd = (...k) => L.hash(ID, ...k) & 0x7fffffff;

  // hoisted colours (pal is a read-only proxy)
  const INK = P.ink, INKSOFT = P.inkSoft, INKFAINT = P.inkFaint;
  const ENAMEL = P.enamel, STEEL = P.steel, STEELD = P.steelDeep;
  const ENAMEL_D = L.mix(P.enamel, P.ink, 0.42);
  const ENAMEL_S = L.mix(P.enamel, P.ink, 0.25);
  const ENAMEL_T = L.mix(P.enamel, P.white, 0.12);
  const STEEL_L = L.mix(P.steel, P.white, 0.45);
  const CAVITY = L.mix(P.ink, P.steelDeep, 0.3);
  const BACKPLATE = L.mix(P.steelDeep, P.ink, 0.38);
  const WHITE = P.white;
  const RAMP = [P.beanGreen, P.beanYellow, P.beanCinnamon, P.beanMedium];

  // ---------------------------------------------------------------------------
  // Beats (shot-local seconds; global T in comments)
  // ---------------------------------------------------------------------------
  const B_HINGE = 0.0; // T 24.00 bar 9 downbeat: beans pour in
  const B_GREEN_END = 0.75; // T 24.75 green until here
  const B_YELLOW = 1.5; // T 25.50 yellow; chaff starts
  const B_CINN = 2.25; // T 26.25 cinnamon; camera push; magenta ring on the dial
  const B_MED = 3.0; // T 27.00 medium brown
  const DRUM_PERIOD = 3.0; // one turn per bar

  // ---------------------------------------------------------------------------
  // Geometry constants (docs/storyboard.md, 13 Composition)
  // ---------------------------------------------------------------------------
  const CX = 540, CY = 960; // window and drum centre
  const RW = 300; // window radius
  const RD = 280; // drum radius
  const RB = 318; // bezel outer radius
  const BX0 = 160, BY0 = 560, BX1 = 920, BY1 = 1380, BR = 56; // enamel body
  const DX = 34, DY = -26; // extrusion (side and top faces)
  const DIAL = [820, 420], DIAL_R = 70;
  const BEAN_L = 38, BEAN_W = 28; // bean size in the drum

  // ---------------------------------------------------------------------------
  // Bean shape: the G1 superellipse family (exponent 2.3, top 6 percent narrower), unit half-axes
  // ---------------------------------------------------------------------------
  const CREASE = [[548, 682], [531, 750], [536, 826], [552, 900], [547, 976], [530, 1052], [538, 1118]].map(([x, y]) => [(x - 540) / 170, (y - 900) / 240]);
  function beanUnit(n) {
    const out = [];
    const e = 2 / 2.3;
    for (let i = 0; i < n; i++) {
      const a = (i / n) * TAU;
      const c = Math.cos(a), s = Math.sin(a);
      const x = Math.sign(c) * Math.pow(Math.abs(c), e);
      const y = Math.sign(s) * Math.pow(Math.abs(s), e);
      out.push([x * (1 - (0.06 * (1 - y)) / 2), y]);
    }
    return out;
  }
  const BEAN_U = beanUnit(44);
  const xf = (pts, cx, cy, a, b, rot) => {
    const c = Math.cos(rot), s = Math.sin(rot);
    return pts.map(([x, y]) => [cx + x * a * c - y * b * s, cy + x * a * s + y * b * c]);
  };

  // a ribbon polygon around a centreline with width w(u) (u 0..1 along it)
  function ribbon(cl, wFn) {
    const n = cl.length;
    const left = [], right = [];
    for (let i = 0; i < n; i++) {
      const a = cl[Math.max(0, i - 1)], b = cl[Math.min(n - 1, i + 1)];
      let tx = b[0] - a[0], ty = b[1] - a[1];
      const tl = Math.hypot(tx, ty) || 1;
      tx /= tl; ty /= tl;
      const w = wFn(i / (n - 1)) / 2;
      left.push([cl[i][0] - ty * w, cl[i][1] + tx * w]);
      right.push([cl[i][0] + ty * w, cl[i][1] - tx * w]);
    }
    return left.concat(right.reverse());
  }
  const fillPoly = (ctx, pts, col, a = 1) => {
    ctx.save();
    ctx.globalAlpha *= a;
    ctx.fillStyle = col;
    ctx.beginPath();
    L.tracePath(ctx, pts, true);
    ctx.fill();
    ctx.restore();
  };

  // paint one bean into a sprite context (upright, centre cx, cy; half-width a, half-length b)
  function paintBean(g, cx, cy, a, b, o) {
    const pts = xf(BEAN_U, cx, cy, a, b, 0);
    const deep = L.mix(o.col, INK, 0.5);
    // contact shadow, down-right
    fillPoly(g, xf(BEAN_U, cx + a * 0.16, cy + b * 0.12, a, b, 0), INK, 0.18);
    L.inkPath(g, pts, { closed: true, width: o.lw, fill: o.col, seed: o.seed, boil: o.bi, wobble: 0.5, tremble: 0.12, taper: [3, 6], rough: 0.25, boilAmp: 0.5, step: 1.5, overlap: 4 });
    L.hatch(g, pts, {
      angle: -Math.PI / 4, spacing: o.hs, width: o.hw, color: deep, alpha: 0.85, length: [o.hs * 1.6, o.hs * 5], gap: [1, 3],
      inset: 1, overshoot: 0, clip: true, seed: o.seed + 3, boil: o.bi, boilAmp: 0.3, edge: 0.08,
      density: (x, y) => sstep(0.0, 0.7, ((x - cx) / a) * 0.62 + ((y - cy) / b) * 0.78),
    });
    // highlight on the lit upper left
    g.save();
    g.strokeStyle = L.mix(o.col, WHITE, 0.5);
    g.lineCap = 'round';
    g.lineWidth = a * 0.16;
    g.globalAlpha = 0.85;
    g.beginPath();
    g.ellipse(cx, cy, a * 0.7, b * 0.76, 0, 1.08 * Math.PI, 1.42 * Math.PI);
    g.stroke();
    g.restore();
    if (o.view === 'face') {
      const cl = L.smoothPts(CREASE.map(([x, y]) => [cx + x * a, cy + y * b]), false, 2);
      const w0 = a * (0.12 + 0.22 * o.open);
      const groove = ribbon(cl, (u) => w0 * (0.3 + 0.7 * Math.sin(Math.PI * u)));
      fillPoly(g, groove, L.mix(o.col, INK, 0.72));
      L.inkPath(g, cl, { width: Math.max(1.2, o.lw * 0.45), color: INK, alpha: 0.8, seed: o.seed + 9, boil: o.bi, taper: [4, 4], wobble: 0.3, tremble: 0.1 });
      L.inkPath(g, cl.slice(3, cl.length - 3), { width: Math.max(1, a * 0.07), color: P.silverskin, alpha: 0.9, seed: o.seed + 11, boil: o.bi, taper: [3, 3], wobble: 0.2, tremble: 0.05 });
    } else {
      // rounded back: a soft ridge line, no crease
      L.inkPath(g, [[cx + a * 0.12, cy - b * 0.7], [cx + a * 0.2, cy], [cx + a * 0.1, cy + b * 0.7]], { width: Math.max(1, o.lw * 0.35), color: deep, alpha: 0.55, seed: o.seed + 13, boil: o.bi, taper: [6, 6], wobble: 0.3 });
    }
  }

  // sprite atlas: 25 colour steps along the ramp x (2 views x 3 boil variants), drawn at 2x
  const STEPS = 25, CW = 96, VAR = 3;
  function rampColour(s) {
    // s in 0..3 : green, yellow, cinnamon, medium
    const k = Math.min(2, Math.floor(s));
    return L.mix(RAMP[k], RAMP[k + 1], clamp(s - k));
  }
  function atlas() {
    const S = FILM.S || 1;
    return L.cached(['bean-atlas', ID, S].join('|'), () => {
      const c = FILM.makeCanvas(Math.ceil(STEPS * CW * S), Math.ceil(2 * VAR * CW * S));
      const g = c.getContext('2d');
      g.scale(S, S);
      for (let i = 0; i < STEPS; i++) {
        const col = rampColour((i / (STEPS - 1)) * 3);
        for (let v = 0; v < 2; v++) {
          for (let k = 0; k < VAR; k++) {
            paintBean(g, i * CW + CW / 2, (v * VAR + k) * CW + CW / 2, BEAN_W, BEAN_L, {
              col, view: v === 0 ? 'face' : 'back', open: 0.15 + 0.35 * (i / (STEPS - 1)), seed: sd('spr', i, v, k), bi: k * 7 + 3, lw: 3.6, hs: 5, hw: 2.2,
            });
          }
        }
      }
      return c;
    });
  }
  function blit(ctx, A, step, view, vk, x, y, rot, sc, alpha) {
    const S = FILM.S || 1;
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(rot);
    if (alpha < 1) ctx.globalAlpha *= alpha;
    const d = CW * 0.5 * sc;
    ctx.drawImage(A, step * CW * S, (view * VAR + vk) * CW * S, CW * S, CW * S, -d / 2, -d / 2, d, d);
    ctx.restore();
  }

  // ---------------------------------------------------------------------------
  // Drum bed, carried and flying beans (t-independent tables)
  // ---------------------------------------------------------------------------
  const polar = (a, r) => [CX + Math.cos(a) * r, CY + Math.sin(a) * r];
  const CHA = polar(186 * DEG, 252), CHB = polar(28 * DEG, 252); // bed surface chord (left high, right low)
  const belowChord = (x, y, pad = 0) => {
    const ux = CHB[0] - CHA[0], uy = CHB[1] - CHA[1];
    const ul = Math.hypot(ux, uy);
    return ((x - CHA[0]) * -uy + (y - CHA[1]) * ux) / ul > pad; // positive = below the chord (y down)
  };

  let GEO = null;
  function geo() {
    if (GEO) return GEO;
    const g = {};
    // bed beans
    const r = L.rng(sd('bed'));
    g.bed = [];
    let guard = 0;
    while (g.bed.length < 84 && guard++ < 40000) {
      const x = r.range(CX - 262, CX + 262), y = r.range(CY - 40, CY + 262);
      if (Math.hypot(x - CX, y - CY) > 254) continue;
      if (!belowChord(x, y, 4)) continue;
      if (g.bed.some((b) => Math.hypot(b.x - x, b.y - y) < 23)) continue;
      g.bed.push({
        x, y,
        rho: r.range(3, 9), ph: r.range(0, TAU), w: r.range(2.5, 6) * (r() < 0.5 ? -1 : 1),
        rot: r.range(0, TAU), spin: r.range(-1.6, 1.6), view: r() < 0.62 ? 0 : 1, vk: r.int(0, 2),
        off: r.range(-0.2, 0.2), arr: r.range(-0.4, 0.2), sx: r.range(-26, 26),
      });
    }
    g.bed.sort((p, q) => p.y - q.y);
    // flying beans: carried up the left wall by the vanes, released, thrown across onto the bed
    const f = L.rng(sd('fly'));
    g.fly = [];
    for (let i = 0; i < 58; i++) {
      const ar = f.range(198, 240) * DEG;
      const land = f.range(0.3, 0.96);
      g.fly.push({
        per: f.range(0.95, 1.35), ph: f.range(0, 1), ar, r: f.range(232, 248),
        lx: lerp(CHA[0], CHB[0], land) + f.range(-10, 10), ly: lerp(CHA[1], CHB[1], land) + f.range(4, 16),
        lift: f.range(110, 190), spin: f.range(4, 9) * (f() < 0.5 ? -1 : 1), rot: f.range(0, TAU),
        view: f() < 0.55 ? 0 : 1, vk: f.int(0, 2), off: f.range(-0.2, 0.2), arr: f.range(-0.4, 0.24), sx: f.range(-22, 22),
      });
    }
    // perforations on the back plate
    g.perf = [];
    for (const [rr, n] of [[236, 48], [206, 40], [96, 18]]) for (let i = 0; i < n; i++) g.perf.push([rr, (i / n) * TAU]);
    // rivets round the front face, skipping the window and the burner slot
    g.rivets = [];
    const rv = L.rrectPts(BX0 + 22, BY0 + 22, BX1 - BX0 - 44, BY1 - BY0 - 44, BR - 18, 46);
    for (const [x, y] of rv) {
      if (Math.hypot(x - CX, y - CY) < RB + 22) continue;
      if (y > 1268 && y < 1360 && x > 300 && x < 780) continue;
      g.rivets.push([x, y]);
    }
    // body outline and extrusion hull
    g.front = L.rrectPts(BX0, BY0, BX1 - BX0, BY1 - BY0, BR, 18);
    g.back = g.front.map(([x, y]) => [x + DX, y + DY]);
    g.hull = hull(g.front.concat(g.back));
    // chaff in the drum and at the chimney
    const c = L.rng(sd('chaff'));
    g.chaffIn = [];
    for (let i = 0; i < 22; i++) g.chaffIn.push({ t0: c.range(1.35, 2.95), x: c.range(CX - 150, CX + 210), life: c.range(0.7, 1.0), dx: c.range(-170, -60), rot: c.range(0, TAU), spin: c.range(-8, 8), s: c.range(0.8, 1.3) });
    g.chaffOut = [];
    for (let i = 0; i < 30; i++) g.chaffOut.push({ t0: c.range(1.45, 2.95), life: c.range(0.9, 1.3), dx: c.range(-90, 70), up: c.range(120, 240), rot: c.range(0, TAU), spin: c.range(-7, 7), s: c.range(0.8, 1.4), ph: c.range(0, TAU) });
    // hopper beans (a heap visible through the rim)
    const h = L.rng(sd('hop'));
    g.hop = [];
    for (let i = 0; i < 26; i++) g.hop.push({ x: h.range(-104, 104), y: h.range(-14, 22), rot: h.range(0, TAU), view: h() < 0.6 ? 0 : 1, vk: h.int(0, 2), k: h() });
    g.hop.sort((p, q) => p.y - q.y);
    GEO = g;
    return g;
  }

  function hull(pts) {
    const p = pts.slice().sort((a, b) => a[0] - b[0] || a[1] - b[1]);
    const cr = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
    const lo = [], up = [];
    for (const q of p) {
      while (lo.length >= 2 && cr(lo[lo.length - 2], lo[lo.length - 1], q) <= 0) lo.pop();
      lo.push(q);
    }
    for (let i = p.length - 1; i >= 0; i--) {
      const q = p[i];
      while (up.length >= 2 && cr(up[up.length - 2], up[up.length - 1], q) <= 0) up.pop();
      up.push(q);
    }
    return lo.slice(0, -1).concat(up.slice(0, -1));
  }

  // roast colour index 0..3 at shot time s (inOutSine through each stage)
  function roastS(s) {
    if (s <= B_GREEN_END) return 0;
    if (s <= B_YELLOW) return E.inOutSine((s - B_GREEN_END) / 0.75);
    if (s <= B_CINN) return 1 + E.inOutSine((s - B_YELLOW) / 0.75);
    return 2 + E.inOutSine((s - B_CINN) / 0.75);
  }
  const stepOf = (s) => Math.round((roastS(s) / 3) * (STEPS - 1));

  // ---------------------------------------------------------------------------
  // Drawing helpers
  // ---------------------------------------------------------------------------

  // boil override while painting the cached static layer (null = live, follow lib.T)
  let CB = null;
  const ink = (ctx, pts, o) => L.inkPath(ctx, pts, CB == null ? o : Object.assign({}, o, { boil: CB }));
  const hat = (ctx, c, o) => L.hatch(ctx, c, CB == null ? o : Object.assign({}, o, { boil: CB }));
  const xhat = (ctx, c, o) => L.crossHatch(ctx, c, CB == null ? o : Object.assign({}, o, { boil: CB }));

  // the static machine (floor, legs, plinth, body, chimney) cached as three boil drawings at 1.6x
  // resolution so the push-in stays crisp
  const SX0 = 130, SY0 = 236, SW = 860, SH = 1380, SK = 1.6;
  function staticLayer(G, v) {
    const S = FILM.S || 1;
    return L.cached(['static', ID, S, v].join('|'), () => {
      const c = FILM.makeCanvas(Math.ceil(SW * SK * S), Math.ceil(SH * SK * S));
      const g = c.getContext('2d');
      g.scale(SK * S, SK * S);
      g.translate(-SX0, -SY0);
      CB = v * 5 + 2;
      try {
        drawFloorAndBase(g);
        drawChimney(g);
        drawBody(g, G);
      } finally {
        CB = null;
      }
      return c;
    });
  }
  function drawCollectorWindow(ctx, tw) {
    for (let i = 0; i < 6; i++) {
      const a = L.h3(i, Math.floor(tw * 12), 5) * TAU;
      ctx.fillStyle = P.silverskin;
      ctx.beginPath();
      ctx.ellipse(206 + Math.cos(a + i) * 9, 376 + Math.sin(a * 1.3 + i) * 12, 3, 1.6, a, 0, TAU);
      ctx.fill();
    }
  }

  function drawFloorAndBase(ctx) {
    // floor shadow
    const sh = L.ellipsePts(570, 1572, 470, 36, 48);
    hat(ctx, sh, { angle: -Math.PI / 4, spacing: 6, width: 1.4, color: INK, alpha: 0.5, length: [14, 40], seed: sd('floorsh'), density: (x, y) => 1 - sstep(0.5, 1, Math.hypot((x - 570) / 470, (y - 1572) / 36)) });
    ink(ctx, [[40, 1590], [1040, 1594]], { width: 1.5, color: INKFAINT, alpha: 0.45, seed: sd('floor'), taper: [40, 40] });
    // legs
    for (const lx of [222, 858]) {
      const leg = [[lx - 20, 1430], [lx + 20, 1430], [lx + 16, 1566], [lx - 16, 1566]];
      ink(ctx, leg, { closed: true, width: 3, fill: STEELD, seed: sd('leg', lx), smooth: false, wobble: 0.6 });
      hat(ctx, [[lx + 2, 1432], [lx + 18, 1432], [lx + 14, 1562], [lx + 2, 1562]], { angle: 0.1, spacing: 5, width: 1.3, color: INK, alpha: 0.7, length: [10, 24], seed: sd('legh', lx) });
      ink(ctx, L.ellipsePts(lx, 1568, 30, 8, 20), { closed: true, width: 2.5, fill: STEEL, seed: sd('foot', lx), wobble: 0.4 });
    }
    ink(ctx, [[240, 1512], [840, 1512]], { width: 6, color: INK, seed: sd('bar'), taper: [2, 2], swell: 0 });
    ink(ctx, [[240, 1512], [840, 1512]], { width: 3, color: STEEL, seed: sd('bar2'), taper: [2, 2], swell: 0 });
    // plinth
    const pl = L.rrectPts(176, 1378, 728, 62, 10, 20);
    ink(ctx, pl, { closed: true, width: 4, fill: STEEL, seed: sd('plinth'), wobble: 0.8 });
    hat(ctx, pl, { angle: -Math.PI / 4, spacing: 6, width: 1.4, color: STEELD, alpha: 0.85, seed: sd('plh'), density: (x, y) => sstep(1390, 1440, y) * 0.6 + sstep(700, 904, x) * 0.6 });
    ink(ctx, [[186, 1392], [892, 1392]], { width: 1.8, color: STEEL_L, alpha: 0.9, seed: sd('plhi'), taper: [20, 20] });
  }

  function drawBody(ctx, G) {
    // extruded side and top faces
    fillPoly(ctx, G.hull, ENAMEL_S);
    ctx.save();
    ctx.beginPath();
    L.tracePath(ctx, G.hull, true);
    ctx.clip();
    // top face (lit) above the front, left of the corner diagonal
    fillPoly(ctx, [[0, BY0 + 2], [BX1 - 16, BY0 + 2], [BX1 - 16 + 140, BY0 + 2 - 107], [0, BY0 - 107]], ENAMEL_T);
    // side face hatch (shadow)
    xhat(ctx, [[BX1 - 4, BY0 - 30], [BX1 + DX + 4, BY0 - 30], [BX1 + DX + 4, BY1 + 4], [BX1 - 4, BY1 + 4]], { tone: 0.55, spacing: 5, width: 1.4, color: INK, alpha: 0.7, seed: sd('sideh'), length: [16, 50] });
    ctx.restore();
    ink(ctx, G.hull, { closed: true, width: 4, seed: sd('hull'), wobble: 1.2 });
    ink(ctx, [[BX1 - 14, BY0 + 10], [BX1 - 14 + DX, BY0 + 10 + DY]], { width: 2.4, seed: sd('edge1'), taper: [3, 3] });
    ink(ctx, [[BX0 + 14, BY0 + 12], [BX0 + 14 + DX, BY0 + 12 + DY]], { width: 2.2, seed: sd('edge2'), taper: [3, 3] });
    // front face
    ink(ctx, G.front, { closed: true, width: 5, fill: ENAMEL, seed: sd('front'), wobble: 1.4, double: { offset: -4, alpha: 0.4 } });
    // enamel shadow: right and bottom of the front face (clipped strips, constant tone)
    ctx.save();
    ctx.beginPath();
    L.tracePath(ctx, G.front, true);
    ctx.clip();
    xhat(ctx, [[760, BY0], [BX1 + 4, BY0], [BX1 + 4, BY1 + 4], [800, BY1 + 4]], { tone: 0.42, spacing: 7, crossSpacing: 7, width: 1.5, color: ENAMEL_D, alpha: 0.85, seed: sd('fronth'), length: [18, 60], edge: 0.3 });
    hat(ctx, [[BX0, 1262], [800, 1262], [800, BY1 + 4], [BX0, BY1 + 4]], { spacing: 7, width: 1.5, color: ENAMEL_D, alpha: 0.85, seed: sd('fronth2'), length: [18, 60], edge: 0.3 });
    hat(ctx, [[836, BY0], [BX1 + 4, BY0], [BX1 + 4, BY1 + 4], [836, BY1 + 4]], { angle: -Math.PI / 4 - Math.PI / 3, spacing: 6, width: 1.4, color: ENAMEL_D, alpha: 0.85, seed: sd('fronth3'), length: [18, 50] });
    ctx.restore();
    // gloss streaks along the lit top-left edge
    ctx.save();
    ctx.strokeStyle = WHITE;
    ctx.lineCap = 'round';
    ctx.globalAlpha = 0.6;
    ctx.lineWidth = 6;
    ctx.beginPath();
    ctx.moveTo(BX0 + 20, BY0 + 150);
    ctx.lineTo(BX0 + 20, BY0 + 88);
    ctx.quadraticCurveTo(BX0 + 22, BY0 + 22, BX0 + 88, BY0 + 20);
    ctx.lineTo(BX0 + 230, BY0 + 20);
    ctx.stroke();
    ctx.globalAlpha = 0.45;
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(BX0 + 252, BY0 + 20);
    ctx.lineTo(BX0 + 300, BY0 + 20);
    ctx.moveTo(BX0 + 20, BY0 + 172);
    ctx.lineTo(BX0 + 20, BY0 + 200);
    ctx.stroke();
    ctx.restore();
    // panel seams
    ink(ctx, [[BX0 + 8, 646], [BX1 - 8, 646]], { width: 1.8, color: INKSOFT, alpha: 0.9, seed: sd('seam1'), taper: [10, 10] });
    ink(ctx, [[BX0 + 8, 1296], [BX1 - 8, 1296]], { width: 1.8, color: INKSOFT, alpha: 0.9, seed: sd('seam2'), taper: [10, 10] });
    ink(ctx, [[BX0 + 10, 650], [BX1 - 10, 650]], { width: 1.2, color: ENAMEL_T, alpha: 0.9, seed: sd('seam1h'), taper: [10, 10] });
    // rivets
    for (const [x, y] of G.rivets) {
      ctx.save();
      ctx.fillStyle = ENAMEL_D;
      ctx.beginPath();
      ctx.arc(x + 1.5, y + 1.5, 5, 0, TAU);
      ctx.fill();
      ctx.fillStyle = STEEL;
      ctx.strokeStyle = INK;
      ctx.lineWidth = 1.3;
      ctx.beginPath();
      ctx.arc(x, y, 4.2, 0, TAU);
      ctx.fill();
      ctx.stroke();
      ctx.fillStyle = WHITE;
      ctx.beginPath();
      ctx.arc(x - 1.3, y - 1.3, 1.3, 0, TAU);
      ctx.fill();
      ctx.restore();
    }
    // sample trier handle on the right of the window
    ink(ctx, L.rrectPts(866, 1060, 40, 26, 6, 10), { closed: true, width: 2.6, fill: STEEL, seed: sd('trier'), wobble: 0.4 });
    ink(ctx, L.ellipsePts(912, 1073, 10, 16, 18), { closed: true, width: 2.6, fill: P.wood, seed: sd('trierk'), wobble: 0.4 });
    // gas pipe and valve under the burner, down to the plinth
    ink(ctx, [[790, 1316], [850, 1316], [850, 1376]], { width: 12, color: INK, seed: sd('gas0'), taper: [0, 0], swell: 0, smooth: false });
    ink(ctx, [[790, 1316], [850, 1316], [850, 1376]], { width: 7, color: P.ochre, seed: sd('gas1'), taper: [0, 0], swell: 0, smooth: false });
    ink(ctx, L.ellipsePts(850, 1316, 15, 15, 20), { closed: true, width: 2.6, fill: P.red, seed: sd('valve'), wobble: 0.3 });
    ink(ctx, [[838, 1304], [862, 1328]], { width: 3, seed: sd('valveh'), taper: [1, 1] });
  }

  function drawChimney(ctx) {
    // pipe from the top face up to the collector
    const pipe = [[192, 548], [192, 300], [248, 300], [248, 548]];
    ink(ctx, pipe, { closed: true, width: 3, fill: STEEL, seed: sd('pipe'), smooth: false, wobble: 0.8 });
    // contour hatching on the right half (horizontal, slightly curved)
    const ph = new Path2D();
    for (let y = 306; y < 544; y += 7) {
      const j = L.h3(y, 5, 31);
      ph.moveTo(224 + j * 6, y + 1);
      ph.quadraticCurveTo(236, y + 3, 246, y + 1);
    }
    ctx.save();
    ctx.strokeStyle = STEELD;
    ctx.globalAlpha = 0.9;
    ctx.lineWidth = 1.4;
    ctx.stroke(ph);
    ctx.restore();
    for (const y of [380, 470, 530]) ink(ctx, [[192, y], [248, y + 2]], { width: 1.8, color: INKSOFT, seed: sd('band', y), taper: [2, 2] });
    // chaff collector drum (cylinder)
    const col = L.rrectPts(160, 320, 120, 112, 14, 14);
    ink(ctx, col, { closed: true, width: 3.4, fill: STEEL, seed: sd('coll'), wobble: 0.8 });
    const ch = new Path2D();
    for (let y = 326; y < 428; y += 6) {
      const j = L.h3(y, 9, 77);
      ch.moveTo(236 + j * 8, y);
      ch.quadraticCurveTo(258, y + 4, 276, y);
    }
    ctx.save();
    ctx.strokeStyle = STEELD;
    ctx.lineWidth = 1.4;
    ctx.globalAlpha = 0.9;
    ctx.stroke(ch);
    ctx.restore();
    ink(ctx, [[166, 340], [274, 342]], { width: 1.8, color: INKSOFT, seed: sd('collb1'), taper: [3, 3] });
    ink(ctx, [[166, 412], [274, 414]], { width: 1.8, color: INKSOFT, seed: sd('collb2'), taper: [3, 3] });
    ink(ctx, [[176, 352], [176, 400]], { width: 3, color: STEEL_L, seed: sd('collhi'), taper: [6, 6] });
    // little window into the collector showing chaff
    ink(ctx, L.ellipsePts(206, 376, 16, 20, 20), { closed: true, width: 2.2, fill: CAVITY, seed: sd('collw'), wobble: 0.3 });
    // upper pipe and rain cap
    ink(ctx, [[204, 320], [204, 290], [236, 290], [236, 320]], { closed: true, width: 2.6, fill: STEEL, seed: sd('pipe2'), smooth: false, wobble: 0.4 });
    ink(ctx, [[220, 290], [220, 280]], { width: 2, seed: sd('capstem'), taper: [0, 0] });
    const cap = [[168, 282], [220, 256], [272, 282], [262, 286], [178, 286]];
    ink(ctx, cap, { closed: true, width: 3, fill: STEEL, seed: sd('cap'), smooth: false, wobble: 0.5 });
    hat(ctx, [[220, 258], [272, 282], [262, 286], [220, 286]], { angle: -Math.PI / 4, spacing: 4, width: 1.2, color: STEELD, alpha: 0.9, seed: sd('caph'), length: [6, 16] });
  }

  function drawHopper(ctx, t, A, G, step) {
    // funnel body
    const body = [[420, 372], [660, 372], [570, 516], [570, 548], [510, 548], [510, 516]];
    L.inkPath(ctx, body, { closed: true, width: 4, fill: STEEL, seed: sd('hop'), smooth: false, wobble: 0.8 });
    L.hatch(ctx, [[560, 372], [660, 372], [570, 516], [570, 548], [548, 548], [548, 516]], { angle: -Math.PI / 4, spacing: 6, width: 1.4, color: STEELD, alpha: 0.85, seed: sd('hoph'), length: [12, 40], density: (x) => sstep(560, 640, x) * 0.6 + 0.35 });
    L.inkPath(ctx, [[440, 384], [520, 512]], { width: 3, color: STEEL_L, alpha: 0.9, seed: sd('hophi'), taper: [10, 14] });
    for (const y of [420, 470]) {
      const hw = lerp(120, 30, (y - 372) / 144);
      L.inkPath(ctx, [[540 - hw, y], [540 + hw, y]], { width: 1.8, color: INKSOFT, seed: sd('hopseam', y), taper: [4, 4] });
      for (let k = -2; k <= 2; k++) {
        ctx.fillStyle = INK;
        ctx.beginPath();
        ctx.arc(540 + (k * hw) / 2.6, y - 5, 2.2, 0, TAU);
        ctx.fill();
      }
    }
    // gate lever at the neck, swung open on the hinge
    const open = clamp((t + 0.4) / 0.2);
    const la = lerp(-0.1, -0.9, E.outBack(open));
    L.inkPath(ctx, [[570, 532], [570 + Math.cos(la) * 70, 532 + Math.sin(la) * 70]], { width: 5, seed: sd('lever'), taper: [1, 1], swell: 0 });
    L.inkPath(ctx, L.ellipsePts(570 + Math.cos(la) * 74, 532 + Math.sin(la) * 74, 9, 9, 14), { closed: true, width: 2.2, fill: P.red, seed: sd('leverk'), wobble: 0.3 });
    // flange on the top face
    L.inkPath(ctx, L.rrectPts(494, 542, 92, 14, 4, 10), { closed: true, width: 2.6, fill: STEELD, seed: sd('flange'), wobble: 0.4 });
    // rim: open mouth, the green heap sinks as the beans pour out
    const rim = L.ellipsePts(540, 372, 120, 22, 40);
    L.inkPath(ctx, rim, { closed: true, width: 3.4, fill: CAVITY, seed: sd('rim'), wobble: 0.5 });
    const level = clamp((0.25 - t) / 0.65); // 1 full at t -0.4, empty at 0.25
    if (level > 0) {
      ctx.save();
      ctx.beginPath();
      L.tracePath(ctx, L.ellipsePts(540, 372, 117, 20, 40), true);
      ctx.clip();
      const drop = (1 - level) * 30;
      for (const b of G.hop) {
        if (b.k > level * 1.15) continue;
        blit(ctx, A, 0, b.view, (b.vk + Math.floor(t * 12)) % VAR, 540 + b.x * (0.6 + 0.4 * level), 372 + b.y * 0.5 + drop - 6, b.rot, 1, 1);
      }
      ctx.restore();
    }
    L.inkPath(ctx, rim.slice(0, 21), { width: 2, color: STEEL_L, alpha: 0.9, seed: sd('rimhi'), taper: [10, 10] });
  }

  function drawDial(ctx, t) {
    const [x, y] = DIAL;
    // stalk and probe line into the body
    L.inkPath(ctx, [[x - 9, y + 64], [x - 9, 546], [x + 9, 546], [x + 9, y + 64]], { closed: true, width: 2.6, fill: STEEL, seed: sd('stalk'), smooth: false, wobble: 0.4 });
    L.inkPath(ctx, L.rrectPts(x - 18, 536, 36, 12, 3, 8), { closed: true, width: 2.2, fill: STEELD, seed: sd('stalkf'), wobble: 0.3 });
    // bezel and face
    L.inkPath(ctx, L.ellipsePts(x + 4, y + 5, DIAL_R, DIAL_R, 48), { closed: true, width: 0.1, fill: INK, fillAlpha: 0.25, seed: sd('dialsh'), wobble: 0.3 });
    L.inkPath(ctx, L.ellipsePts(x, y, DIAL_R, DIAL_R, 48), { closed: true, width: 4, fill: STEEL, seed: sd('dialb'), wobble: 0.6 });
    L.hatch(ctx, L.ellipsePts(x, y, DIAL_R - 2, DIAL_R - 2, 40), { angle: -Math.PI / 4, spacing: 4.5, width: 1.2, color: STEELD, alpha: 0.85, seed: sd('dialbh'), length: [6, 18], density: (px, py) => sstep(0.25, 0.75, ((px - x) * 0.7 + (py - y) * 0.7) / DIAL_R) });
    L.inkPath(ctx, L.ellipsePts(x, y, 56, 56, 40), { closed: true, width: 2.6, fill: P.ceramic, seed: sd('dialf'), wobble: 0.4 });
    // ticks over a 270 degree sweep (from lower left, clockwise)
    const a0 = 135 * DEG, span = 270 * DEG;
    ctx.save();
    ctx.lineCap = 'round';
    ctx.strokeStyle = INK;
    for (let i = 0; i <= 40; i++) {
      const a = a0 + (i / 40) * span;
      const major = i % 5 === 0;
      const r0 = major ? 40 : 46, r1 = 52;
      ctx.lineWidth = major ? 2.4 : 1.2;
      ctx.beginPath();
      ctx.moveTo(x + Math.cos(a) * r0, y + Math.sin(a) * r0);
      ctx.lineTo(x + Math.cos(a) * r1, y + Math.sin(a) * r1);
      ctx.stroke();
    }
    // colour bands: green, yellow, cinnamon, medium zones (the roast stages) and a red zone
    const zones = [[0, 0.25, P.beanGreen], [0.25, 0.5, P.beanYellow], [0.5, 0.75, P.beanCinnamon], [0.75, 0.92, P.beanMedium], [0.92, 1, P.red]];
    ctx.lineWidth = 6;
    ctx.lineCap = 'butt';
    for (const [u0, u1, c] of zones) {
      ctx.strokeStyle = c;
      ctx.beginPath();
      ctx.arc(x, y, 33, a0 + u0 * span, a0 + u1 * span);
      ctx.stroke();
    }
    ctx.restore();
    // needle on twos with a small tremble
    const tw = L.onTwos(t);
    const f = 0.9 * clamp(tw / B_MED) + 0.006 * Math.sin(tw * 31);
    const an = a0 + f * span;
    L.inkPath(ctx, [[x - Math.cos(an) * 12, y - Math.sin(an) * 12], [x + Math.cos(an) * 48, y + Math.sin(an) * 48]], { width: 3.4, color: P.red, seed: sd('needle'), taper: [2, 10], wobble: 0.2, swell: 0 });
    ctx.save();
    ctx.fillStyle = INK;
    ctx.beginPath();
    ctx.arc(x, y, 6, 0, TAU);
    ctx.fill();
    // glass glare
    ctx.strokeStyle = WHITE;
    ctx.globalAlpha = 0.8;
    ctx.lineWidth = 4;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.arc(x, y, 47, 1.12 * Math.PI, 1.38 * Math.PI);
    ctx.stroke();
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(x, y, 47, 1.43 * Math.PI, 1.5 * Math.PI);
    ctx.stroke();
    ctx.restore();
  }

  function flamePts(cx, by, w, h, sway, n = 28) {
    const out = [];
    for (let i = 0; i < n; i++) {
      const a = (i / n) * TAU;
      const top = (1 + Math.cos(a)) / 2; // 1 at the tip
      out.push([cx + w * Math.sin(a) * (0.55 + 0.45 * (1 - top)) + sway * top * top, by - h * top - w * 0.2 * (1 - top)]);
    }
    return out;
  }

  function drawBurner(ctx, t) {
    const slot = L.rrectPts(318, 1282, 444, 64, 14, 14);
    L.inkPath(ctx, slot, { closed: true, width: 3.4, fill: CAVITY, seed: sd('slot'), wobble: 0.6 });
    // burner rail
    L.inkPath(ctx, L.rrectPts(336, 1330, 408, 10, 4, 12), { closed: true, width: 2, fill: STEELD, seed: sd('rail'), wobble: 0.3 });
    const k = Math.floor(t * 12 + 1e-6);
    for (let i = 0; i < 7; i++) {
      const fx = 360 + i * 60;
      const n = L.noise1(k * 0.37 + i * 3.1, sd('fl')) * 0.5 + 0.5;
      const h = 46 + 14 * n + 6 * (i % 2);
      const sway = (L.h3(k, i, 41) - 0.5) * 10;
      const outer = flamePts(fx, 1332, 14, h, sway);
      L.inkPath(ctx, outer, { closed: true, width: 2.2, fill: P.flame, seed: sd('flame', i), wobble: 0.5, taper: [3, 6] });
      fillPoly(ctx, flamePts(fx + 1, 1331, 8.5, h * 0.66, sway * 0.6, 20), P.sun);
      fillPoly(ctx, flamePts(fx + 1, 1331, 4, h * 0.3, sway * 0.3, 16), WHITE, 0.9);
      fillPoly(ctx, L.ellipsePts(fx, 1330, 10, 4, 12), P.water, 0.9);
    }
    // heat shimmer: wavy pale strokes rising off the flames
    ctx.save();
    ctx.strokeStyle = WHITE;
    ctx.lineCap = 'round';
    for (let i = 0; i < 9; i++) {
      const u = ((t * 1.3 + L.h3(i, 2, 61)) % 1);
      const x0 = 350 + i * 48;
      const y0 = 1290 - u * 70;
      ctx.globalAlpha = 0.45 * Math.sin(Math.PI * u);
      ctx.lineWidth = 1.6;
      ctx.beginPath();
      for (let s = 0; s <= 10; s++) {
        const yy = y0 - s * 5;
        const xx = x0 + Math.sin(s * 0.9 + t * 9 + i) * 4;
        if (s === 0) ctx.moveTo(xx, yy);
        else ctx.lineTo(xx, yy);
      }
      ctx.stroke();
    }
    ctx.restore();
  }

  // drum interior: cavity, back plate, hub, perforations, shadow crescent
  function drawDrumBack(ctx, G, th, bi) {
    fillPoly(ctx, L.ellipsePts(CX, CY, RW, RW, 96), CAVITY);
    fillPoly(ctx, L.ellipsePts(CX, CY, RD, RD, 96), STEELD);
    fillPoly(ctx, L.ellipsePts(CX + 4, CY + 4, RD - 18, RD - 18, 96), BACKPLATE);
    // shell band highlights (the inside of the cylinder catching light at lower right)
    ctx.save();
    ctx.strokeStyle = STEEL;
    ctx.globalAlpha = 0.5;
    ctx.lineWidth = 6;
    ctx.beginPath();
    ctx.arc(CX, CY, RD - 9, -0.15 * Math.PI, 0.55 * Math.PI);
    ctx.stroke();
    ctx.restore();
    // perforations and rings rotate with the drum
    const pp = new Path2D();
    for (const [r, a] of G.perf) {
      const x = CX + Math.cos(a + th) * r, y = CY + Math.sin(a + th) * r;
      pp.moveTo(x + 3, y);
      pp.arc(x, y, 3, 0, TAU);
    }
    ctx.save();
    ctx.fillStyle = INK;
    ctx.globalAlpha = 0.75;
    ctx.fill(pp);
    ctx.restore();
    for (const r of [222, 150]) L.inkPath(ctx, L.ellipsePts(CX, CY, r, r, 72), { closed: true, width: 1.8, color: STEEL, alpha: 0.55, seed: sd('ring', r), wobble: 0.6 });
    // hub and spokes
    for (let k = 0; k < 4; k++) {
      const a = th + (k * Math.PI) / 2;
      L.inkPath(ctx, [[CX + Math.cos(a) * 36, CY + Math.sin(a) * 36], [CX + Math.cos(a) * 140, CY + Math.sin(a) * 140]], { width: 5, color: STEEL, alpha: 0.7, seed: sd('spoke', k), taper: [2, 2], swell: 0 });
    }
    L.inkPath(ctx, L.ellipsePts(CX, CY, 36, 36, 28), { closed: true, width: 3, fill: STEEL, seed: sd('hub'), wobble: 0.4 });
    for (let k = 0; k < 6; k++) {
      const a = th + (k * TAU) / 6;
      ctx.fillStyle = INK;
      ctx.beginPath();
      ctx.arc(CX + Math.cos(a) * 24, CY + Math.sin(a) * 24, 3, 0, TAU);
      ctx.fill();
    }
    // shadow crescent from the bezel lip, upper left inside the drum
  }

  function vanePoly(a) {
    const r0 = RD - 2, r1 = 196, lean = 0.13, th = 4.5;
    const p0 = polar(a, r0), p1 = polar(a + lean, r1);
    const nx = -Math.sin(a + lean / 2), ny = Math.cos(a + lean / 2);
    return [[p0[0] - nx * th, p0[1] - ny * th], [p1[0] - nx * th * 0.8, p1[1] - ny * th * 0.8], [p1[0] + nx * th * 0.8, p1[1] + ny * th * 0.8], [p0[0] + nx * th, p0[1] + ny * th]];
  }
  function drawVanes(ctx, th) {
    for (let k = 0; k < 8; k++) {
      const a = th + (k * TAU) / 8;
      const v = vanePoly(a);
      L.inkPath(ctx, v, { closed: true, width: 2.4, fill: STEEL, seed: sd('vane', k), smooth: false, wobble: 0.4 });
      L.inkPath(ctx, [v[0], v[1]], { width: 1.6, color: STEEL_L, seed: sd('vaneh', k), taper: [4, 4], wobble: 0.2 });
      // bracket bolt at the shell
      const b = polar(a, RD - 10);
      ctx.fillStyle = INK;
      ctx.beginPath();
      ctx.arc(b[0], b[1], 3.4, 0, TAU);
      ctx.fill();
    }
  }

  // bean state helpers
  function streamPos(b, tw, land) {
    // falling in a narrow column from the top of the drum, fanning out only as it lands
    const t0 = b.arr - 0.3;
    const u = clamp((tw - t0) / 0.3);
    const x0 = CX + 10 + b.sx * 0.35, y0 = CY - RD + 20;
    const fan = sstep(0.6, 1, u);
    return [lerp(x0, land[0], fan), lerp(y0, land[1], u * u), u];
  }
  function bedPos(b, tw) {
    const a = b.ph + b.w * tw;
    return [b.x + Math.cos(a) * b.rho, b.y + Math.sin(a) * b.rho * 0.7, b.rot + b.spin * tw];
  }
  // cycle: 0 .. 0.42 carried up on the wall, 0.42 .. 0.84 thrown, 0.84 .. 1 sinking back (hidden in the bed)
  function flyPos(f, tw, th) {
    const u = (((tw / f.per + f.ph) % 1) + 1) % 1;
    const a1 = f.ar, a0 = f.ar - 112 * DEG;
    if (u < 0.42) {
      const a = lerp(a0, a1, u / 0.42);
      const p = polar(a, f.r);
      return { x: p[0], y: p[1], rot: a + Math.PI / 2, phase: 0, hidden: belowChord(p[0], p[1], 10) };
    }
    if (u < 0.84) {
      const s = (u - 0.42) / 0.42;
      const p0 = polar(a1, f.r);
      const tx = -Math.sin(a1), ty = Math.cos(a1);
      const c = [p0[0] + tx * f.lift, p0[1] + ty * f.lift];
      const v = 1 - s;
      const x = v * v * p0[0] + 2 * v * s * c[0] + s * s * f.lx;
      const y = v * v * p0[1] + 2 * v * s * c[1] + s * s * f.ly;
      return { x, y, rot: f.rot + f.spin * s, phase: 1, hidden: false };
    }
    const s = (u - 0.84) / 0.16;
    const p = polar(a0, f.r);
    return { x: lerp(f.lx, p[0], s), y: lerp(f.ly, p[1], s), rot: f.rot, phase: 2, hidden: true };
  }

  function drawBeans(ctx, t, tw, th, G, A) {
    const vkb = Math.floor(tw * 12);
    const grow = 1 + 0.1 * sstep(B_YELLOW, B_MED, tw);
    // the bed mass under the beans, so gaps never show the back plate
    const avg = rampColour(roastS(tw));
    const bedPoly = [];
    for (let i = 0; i <= 40; i++) {
      const a = 28 * DEG + (i / 40) * (158 * DEG);
      bedPoly.push(polar(a, 258));
    }
    const fillIn = clamp((tw + 0.25) / 0.45);
    const lift = (1 - fillIn) * 120;
    const mass = bedPoly.map(([x, y]) => [x, Math.max(y, Math.min(CY + RD, y + lift))]);
    // straighten the chord top so the bed has a slope
    ctx.save();
    ctx.beginPath();
    L.tracePath(ctx, L.ellipsePts(CX, CY, RD - 4, RD - 4, 80), true);
    ctx.clip();
    fillPoly(ctx, [[CHA[0] - 10, CHA[1] + 14 + lift], [CHB[0] + 10, CHB[1] + 14 + lift]].concat(mass.slice().reverse().filter(([x, y]) => y > CY - 20)), L.mix(avg, INK, 0.55));
    ctx.restore();

    // hidden flyers (sinking back / carried inside the bed) are drawn behind the bed beans
    const flyers = G.fly.map((f) => {
      const q = flyPos(f, tw, th);
      return { f, q };
    });
    const sizeOf = (b) => (grow * BEAN_L) / BEAN_L;
    const drawFly = (f, q) => {
      let x = q.x, y = q.y, alpha = 1;
      if (tw < f.arr + 0.12) {
        const land = [f.lx, f.ly];
        if (tw < f.arr) {
          const s = streamPos(f, tw, land);
          if (s[2] <= 0) return;
          x = s[0]; y = s[1];
          alpha = clamp(s[2] * 4);
        } else {
          const u = (tw - f.arr) / 0.12;
          x = lerp(land[0], q.x, u);
          y = lerp(land[1], q.y, u);
        }
      }
      const s = tw < f.arr ? 0 : stepOf(tw + f.off);
      blit(ctx, A, s, f.view, (f.vk + vkb) % VAR, x, y, q.rot, sizeOf(f), alpha);
    };
    for (const { f, q } of flyers) if (q.hidden && tw >= f.arr + 0.12) drawFly(f, q);
    for (const b of G.bed) {
      const p = bedPos(b, tw);
      let x = p[0], y = p[1], alpha = 1;
      if (tw < b.arr) {
        const s = streamPos(b, tw, [b.x, b.y]);
        if (s[2] <= 0) continue;
        x = s[0]; y = s[1];
        alpha = clamp(s[2] * 4);
      }
      const s = tw < b.arr ? 0 : stepOf(tw + b.off);
      blit(ctx, A, s, b.view, (b.vk + vkb) % VAR, x, y, p[2], grow, alpha);
    }
    for (const { f, q } of flyers) if (!q.hidden || tw < f.arr + 0.12) drawFly(f, q);
  }

  function drawChaffIn(ctx, t, G) {
    const tw = L.onTwos(t);
    for (const c of G.chaffIn) {
      const u = (tw - c.t0) / c.life;
      if (u < 0 || u > 1) continue;
      const y0 = lerp(CHA[1], CHB[1], (c.x - CHA[0]) / (CHB[0] - CHA[0])) - 10;
      const x = c.x + c.dx * u + Math.sin(u * 9 + c.rot) * 10;
      const y = y0 - u * 300;
      if (Math.hypot(x - CX, y - CY) > RD - 10) continue;
      drawFlake(ctx, x, y, c.rot + c.spin * u, c.s, Math.sin(Math.PI * u));
    }
  }
  function drawFlake(ctx, x, y, rot, s, a) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(rot);
    ctx.globalAlpha *= clamp(a * 1.6);
    ctx.fillStyle = P.silverskin;
    ctx.strokeStyle = INKSOFT;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(-7 * s, 0);
    ctx.quadraticCurveTo(-2 * s, -5 * s, 7 * s, -1 * s);
    ctx.quadraticCurveTo(1 * s, 4 * s, -7 * s, 0);
    ctx.fill();
    ctx.stroke();
    ctx.restore();
  }
  function drawChaffOut(ctx, t, G) {
    const tw = L.onTwos(t);
    for (const c of G.chaffOut) {
      const u = (tw - c.t0) / c.life;
      if (u < 0 || u > 1) continue;
      const x = 220 + c.dx * E.outQuad(u) + Math.sin(u * 7 + c.ph) * 12;
      const y = 284 - c.up * u;
      drawFlake(ctx, x, y, c.rot + c.spin * u, c.s, 1 - u * u);
    }
  }

  function drawCrescent(ctx) {
    const cres = [];
    for (let i = 0; i <= 40; i++) cres.push(polar((100 + (i / 40) * 250) * DEG, RD));
    for (let i = 40; i >= 0; i--) {
      const a = (100 + (i / 40) * 250) * DEG;
      const p = [CX + 30 + Math.cos(a) * (RD - 6), CY + 30 + Math.sin(a) * (RD - 6)];
      cres.push(Math.hypot(p[0] - CX, p[1] - CY) < RD ? p : polar(a, RD));
    }
    xhat(ctx, cres, { tone: 0.5, spacing: 5, width: 1.3, color: INK, alpha: 0.75, seed: sd('cres'), length: [10, 30], clip: true });
  }

  function drawBezel(ctx) {
    const outer = L.ellipsePts(CX, CY, RB, RB, 96);
    const inner = L.ellipsePts(CX, CY, RW, RW, 96);
    ctx.save();
    ctx.beginPath();
    L.tracePath(ctx, outer, true);
    L.tracePath(ctx, inner.slice().reverse(), true);
    ctx.fillStyle = STEEL;
    ctx.fill();
    ctx.restore();
    const ann = [];
    for (let i = 0; i <= 36; i++) ann.push(polar((-40 + (i / 36) * 220) * DEG, RB + 2));
    for (let i = 36; i >= 0; i--) ann.push(polar((-40 + (i / 36) * 220) * DEG, RW - 1));
    hat(ctx, ann, { angle: -Math.PI / 4, spacing: 4, width: 1.3, color: STEELD, alpha: 0.9, seed: sd('bezh'), length: [8, 22], clip: true, edge: 0.25 });
    ink(ctx, outer, { closed: true, width: 4, seed: sd('bezo'), wobble: 1, double: { offset: 5, alpha: 0.35 } });
    ink(ctx, inner, { closed: true, width: 3, seed: sd('bezi'), wobble: 1 });
    ctx.save();
    ctx.strokeStyle = STEEL_L;
    ctx.lineWidth = 3;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.arc(CX, CY, RW + 9, 1.05 * Math.PI, 1.45 * Math.PI);
    ctx.stroke();
    ctx.restore();
    for (let k = 0; k < 16; k++) {
      const a = (k / 16) * TAU + 0.1;
      const [x, y] = polar(a, RW + 9);
      ctx.fillStyle = INK;
      ctx.beginPath();
      ctx.arc(x, y, 3.6, 0, TAU);
      ctx.fill();
      ctx.fillStyle = STEEL_L;
      ctx.beginPath();
      ctx.arc(x - 1, y - 1, 1.2, 0, TAU);
      ctx.fill();
    }
    // hinge (left) and latch with handle (right)
    ink(ctx, L.rrectPts(CX - RB - 22, CY - 54, 34, 108, 8, 12), { closed: true, width: 3, fill: STEEL, seed: sd('hinge'), wobble: 0.5 });
    ink(ctx, [[CX - RB - 5, CY - 46], [CX - RB - 5, CY + 46]], { width: 2, color: INKSOFT, seed: sd('hingeline'), taper: [2, 2] });
    hat(ctx, L.rrectPts(CX - RB - 5, CY - 52, 16, 104, 6, 10), { angle: 0.05, spacing: 4, width: 1.2, color: STEELD, alpha: 0.9, seed: sd('hingeh'), length: [8, 20] });
    ink(ctx, L.rrectPts(CX + RB - 14, CY - 30, 40, 60, 8, 12), { closed: true, width: 3, fill: STEEL, seed: sd('latch'), wobble: 0.5 });
    ink(ctx, [[CX + RB + 26, CY - 18], [CX + RB + 44, CY - 18], [CX + RB + 44, CY + 70], [CX + RB + 30, CY + 70]], { width: 5, seed: sd('handle'), taper: [1, 1], swell: 0, smooth: false });
    ink(ctx, L.ellipsePts(CX + RB + 37, CY + 82, 11, 15, 16), { closed: true, width: 2.4, fill: P.wood, seed: sd('handlek'), wobble: 0.3 });
    // glass glare: two flat white strokes across the window
    ctx.save();
    ctx.beginPath();
    L.tracePath(ctx, inner, true);
    ctx.clip();
    ctx.strokeStyle = WHITE;
    ctx.lineCap = 'round';
    ctx.globalAlpha = 0.32;
    ctx.lineWidth = 16;
    ctx.beginPath();
    ctx.moveTo(CX - 250, CY - 40);
    ctx.lineTo(CX - 40, CY - 250);
    ctx.stroke();
    ctx.lineWidth = 6;
    ctx.beginPath();
    ctx.moveTo(CX - 236, CY + 10);
    ctx.lineTo(CX + 10, CY - 236);
    ctx.stroke();
    ctx.restore();
  }

  const BZX0 = 190, BZY0 = 630, BZW = 730, BZH = 670;
  function bezelLayer(v) {
    const S = FILM.S || 1;
    return L.cached(['bezel', ID, S, v].join('|'), () => {
      const c = FILM.makeCanvas(Math.ceil(BZW * SK * S), Math.ceil(BZH * SK * S));
      const g = c.getContext('2d');
      g.scale(SK * S, SK * S);
      g.translate(-BZX0, -BZY0);
      CB = v * 5 + 3;
      try {
        g.save();
        g.beginPath();
        g.arc(CX, CY, RW, 0, TAU);
        g.clip();
        drawCrescent(g);
        g.restore();
        drawBezel(g);
      } finally {
        CB = null;
      }
      return c;
    });
  }

  function drawOverlays(ctx, t) {
    // annYellow roast arc round the window, sweeping with the roast progress
    const rp = clamp(t / B_MED);
    const a0 = -Math.PI / 2;
    L.guideCircle(ctx, CX, CY, 332, { color: P.annYellow, alpha: 0.4, width: 1.5, dash: [6, 10], start: a0, p: 0.9 });
    L.arcAnnotation(ctx, CX, CY, 332, a0, a0 + rp * 0.9 * TAU, { color: P.annYellow, width: 2.5, arrow: 13, dot: 5, endTicks: 10 });
    // stage dots on the arc at green, yellow, cinnamon, medium
    const stages = [[0, P.beanGreen], [B_GREEN_END, P.beanGreen], [B_YELLOW, P.beanYellow], [B_CINN, P.beanCinnamon], [B_MED, P.beanMedium]];
    for (let i = 1; i < stages.length; i++) {
      const [ts, c] = stages[i];
      const a = a0 + (ts / B_MED) * 0.9 * TAU;
      const on = t + FR >= ts;
      const pop = on ? [0.72, 1.08, 1][Math.min(2, Math.floor((t - ts) * 12 + 1e-6 + 1))] || 1 : 0.6;
      const [x, y] = polar(a, 332);
      ctx.save();
      ctx.fillStyle = on ? c : P.paper;
      ctx.strokeStyle = P.annYellow;
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.arc(x, y, 9 * pop, 0, TAU);
      ctx.fill();
      ctx.stroke();
      ctx.restore();
    }
    // annBlue rotation arrows, turning with the drum (24 fps)
    const th = (t / DRUM_PERIOD) * TAU;
    for (const base of [-70 * DEG, 110 * DEG]) {
      L.arcAnnotation(ctx, CX, CY, 364, base + th, base + th + 52 * DEG, { color: P.annBlue, width: 2.5, arrow: 14, endTicks: 0, dash: [14, 10] });
    }
    // annMagenta ring on the dial at T 26.25
    if (t >= B_CINN - FR) {
      const u = clamp((t - B_CINN) / (10 * FR) + 0.1);
      const r = DIAL_R + 6 + 60 * E.outExpo(u);
      ctx.save();
      ctx.strokeStyle = P.annMagenta;
      ctx.globalAlpha = 1 - u * 0.85;
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(DIAL[0], DIAL[1], r, 0, TAU);
      ctx.stroke();
      ctx.restore();
      if (u < 1) {
        // the needle-tip mark stays on the dial after the ring
      }
      ctx.save();
      ctx.strokeStyle = P.annMagenta;
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(DIAL[0], DIAL[1], DIAL_R + 7, 135 * DEG + 0.62 * 270 * DEG, 135 * DEG + 0.92 * 270 * DEG);
      ctx.stroke();
      ctx.restore();
    }
  }

  // ---------------------------------------------------------------------------
  FILM.scene({
    id: ID,
    draw(ctx, tIn, info) {
      const t = clamp(tIn, 0, info.dur);
      const tw = L.onTwos(t);
      const bi = L.boil(info.T);
      const G = geo();
      const A = atlas();
      const th = (t / DRUM_PERIOD) * TAU; // drum angle, 24 fps

      // 1 stripes: band B turns apricot for act 3; drift 6 px per beat
      L.stripes(ctx, { colors: [P.stripeCream, P.stripeApricot], width: 140, angle: -0.52, offset: 8 * info.T, seed: sd('stripes') });

      // camera: locked, then push 1.0 -> 1.6 on the window from T 26.25
      const zoom = t < B_CINN ? 1 : 1 + 0.6 * E.inOutCubic((t - B_CINN) / (B_MED - B_CINN));
      L.camera(ctx, { x: CX, y: CY, zoom }, (ctx) => {
        ctx.save();
        ctx.imageSmoothingQuality = 'high';
        ctx.drawImage(staticLayer(G, ((bi % 3) + 3) % 3), SX0, SY0, SW, SH);
        ctx.restore();
        drawCollectorWindow(ctx, tw);
        drawDial(ctx, t);
        drawHopper(ctx, t, A, G);
        drawBurner(ctx, t);
        // 5 the drum, clipped to the window
        ctx.save();
        ctx.beginPath();
        ctx.arc(CX, CY, RW, 0, TAU);
        ctx.clip();
        drawDrumBack(ctx, G, th, bi);
        drawVanes(ctx, th);
        drawBeans(ctx, t, tw, th, G, A);
        if (t >= B_YELLOW - 0.15) drawChaffIn(ctx, t, G);
        ctx.restore();
        ctx.save();
        ctx.imageSmoothingQuality = 'high';
        ctx.drawImage(bezelLayer(((bi % 3) + 3) % 3), BZX0, BZY0, BZW, BZH);
        ctx.restore();
        if (t >= B_YELLOW - 0.1) drawChaffOut(ctx, t, G);
        drawOverlays(ctx, t);
      });
    },
  });
})();

</script>
<script>
// ---- src/scenes/14-first-crack.js
// 14 first-crack : "First crack" (schematic, global T 27.00 to 28.50)
//
// Layers, back to front:
//   1 lib.blueprint plate centred on the bean (540, 900)
//   2 guide geometry: turning guide circles with radial ticks, construction axis of the bean, the ghost of the
//     scale-1.00 outline (dashed) once the bean has grown
//   3 heat: wavy schemBean lines rising round the bean
//   4 the G1 bean (docs/storyboard.md Shared geometry G1), scaled about (540, 900) 1.00 -> 1.15 -> 1.25 -> 1.30:
//     curved rectangular cell lattice (18 x 12 local cells, so 24 x 16 at scale 1.30), CO2 glow dots,
//     double lavender outline, crease groove (12 px lineWhite, splitting to 26 px on the crack) with the
//     silverskin line and the schemBean crease glow
//   5 measurement: length bracket along the bean axis, thermometer scale x 900 y 620..1300 with its schemBean level
//     rising to the first-crack tick
//   6 network: vapour and CO2 node glyphs on the left, linked to the bean
//   7 events: magenta flash ring on the crack (12 frames), four chaff shards, two follow-up cracks, progress glyph
(function () {
  'use strict';

  const ID = 'first-crack';
  const L = FILM.lib;
  const P = L.pal;
  const E = L.ease;
  const TAU = Math.PI * 2;
  const DEG = Math.PI / 180;
  const FR = 1 / 24;

  const clamp = (v, a = 0, b = 1) => (v < a ? a : v > b ? b : v);
  const lerp = (a, b, u) => a + (b - a) * u;
  const sstep = (a, b, x) => {
    const u = clamp((x - a) / (b - a));
    return u * u * (3 - 2 * u);
  };
  const sd = (...k) => L.hash(ID, ...k) & 0x7fffffff;

  const LAV = P.lavender, WHITE = P.lineWhite, MAG = P.magenta, BEAN = P.schemBean, PALE = P.paleBlue;
  const NAVY_D = P.navyDeep, NAVY_L = P.navyLight, GLOW = P.glow;

  // ---------------------------------------------------------------------------
  // Beats (shot-local; global T in comments)
  // ---------------------------------------------------------------------------
  const B_CRACK = 0.75; // T 27.75 first crack
  const B_POP2 = 1.125; // T 28.125 follow-up crack (8th)
  const B_POP3 = 1.25; // T 28.25 follow-up crack (8th-triplet)

  // ---------------------------------------------------------------------------
  // G1 (copied from docs/storyboard.md, Shared geometry)
  // ---------------------------------------------------------------------------
  const G1C = [540, 900];
  const G1_ROT = -15 * DEG; // top leans left
  const G1_A = 170, G1_B = 240, G1_EXP = 2.3, G1_N = 96;
  const CREASE = [[548, 682], [531, 750], [536, 826], [552, 900], [547, 976], [530, 1052], [538, 1118]];
  const SILVER = [[546, 700], [538, 1100]];
  // upright local outline (dx, dy about the centre), 96 points
  const OUT_LOCAL = (() => {
    const out = [];
    const e = 2 / G1_EXP;
    for (let i = 0; i < G1_N; i++) {
      const a = (i / G1_N) * TAU;
      const c = Math.cos(a), s = Math.sin(a);
      const dy = G1_B * Math.sign(s) * Math.pow(Math.abs(s), e);
      const dx = G1_A * Math.sign(c) * Math.pow(Math.abs(c), e) * (1 - (0.06 * (1 - dy / G1_B)) / 2);
      out.push([dx, dy]);
    }
    return out;
  })();
  // half-width of the upright outline at height dy (for the fitted lattice)
  function halfW(dy) {
    const v = clamp(Math.abs(dy) / G1_B, 0, 0.99999);
    const w = G1_A * Math.pow(1 - Math.pow(v, G1_EXP), 1 / G1_EXP);
    return w * (1 - (0.06 * (1 - dy / G1_B)) / 2);
  }
  // crease centre x (local) at height dy, by linear interpolation of the storyboard points
  const CRL = CREASE.map(([x, y]) => [x - 540, y - 900]);
  function creaseX(dy) {
    if (dy <= CRL[0][1]) return CRL[0][0];
    for (let i = 0; i < CRL.length - 1; i++) if (dy <= CRL[i + 1][1]) return lerp(CRL[i][0], CRL[i + 1][0], (dy - CRL[i][1]) / (CRL[i + 1][1] - CRL[i][1]));
    return CRL[CRL.length - 1][0];
  }
  const COS = Math.cos(G1_ROT), SIN = Math.sin(G1_ROT);
  // local (dx, dy) -> screen at scale s
  const tf = (dx, dy, s) => [G1C[0] + (dx * COS - dy * SIN) * s, G1C[1] + (dx * SIN + dy * COS) * s];
  const tfPts = (pts, s) => pts.map(([x, y]) => tf(x, y, s));

  // per-boil wobble along the normal of a closed or open polyline
  function wob(pts, seed, amp, bi, closed) {
    const n = pts.length;
    const out = new Array(n);
    for (let i = 0; i < n; i++) {
      const a = pts[(i - 1 + n) % n], b = pts[(i + 1) % n];
      const pa = closed ? a : pts[Math.max(0, i - 1)], pb = closed ? b : pts[Math.min(n - 1, i + 1)];
      let tx = pb[0] - pa[0], ty = pb[1] - pa[1];
      const tl = Math.hypot(tx, ty) || 1;
      tx /= tl; ty /= tl;
      const d = amp * L.noise1(i * 0.21 + bi * 1.7, seed);
      out[i] = [pts[i][0] - ty * d, pts[i][1] + tx * d];
    }
    return out;
  }
  function insetPoly(pts, d) {
    // offset a closed counter-clockwise-or-not polygon toward its centroid side by d
    const n = pts.length;
    let cx = 0, cy = 0;
    for (const p of pts) { cx += p[0]; cy += p[1]; }
    cx /= n; cy /= n;
    const out = [];
    for (let i = 0; i < n; i++) {
      const a = pts[(i - 1 + n) % n], b = pts[(i + 1) % n];
      let tx = b[0] - a[0], ty = b[1] - a[1];
      const tl = Math.hypot(tx, ty) || 1;
      let nx = -ty / tl, ny = tx / tl;
      if ((pts[i][0] - cx) * nx + (pts[i][1] - cy) * ny > 0) { nx = -nx; ny = -ny; }
      out.push([pts[i][0] + nx * d, pts[i][1] + ny * d]);
    }
    return out;
  }
  const strokePts = (ctx, pts, closed, color, alpha, width, dash) => {
    ctx.save();
    ctx.strokeStyle = color;
