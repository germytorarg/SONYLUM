<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Sonylum — motion</title>
    <script src="vendor/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Cormorant Garamond";
        font-style: normal;
        font-weight: 700;
        src: url("fonts/cormorant-700.woff2") format("woff2");
      }
      @font-face {
        font-family: "Cormorant Garamond";
        font-style: italic;
        font-weight: 600;
        src: url("fonts/cormorant-italic-600.woff2") format("woff2");
      }
      :root {
        --ink: #0b0908;
        --gold: #c9a45c;
        --gold-hi: #e8c987;
        --bordo: #6e1423;
        --bordo-hi: #9b1b30;
        --bone: #ede6d8;
        --display: "Archivo Black", sans-serif;
        --serif: "Cormorant Garamond", serif;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--ink);
      }
      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--ink);
      }
      .clip {
        position: absolute;
        inset: 0;
        overflow: hidden;
      }
      .scene-content {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 100%;
        padding: 160px 80px;
        gap: 24px;
      }
      .slam {
        font-family: var(--display);
        color: var(--bone);
        line-height: 0.9;
        text-transform: uppercase;
        letter-spacing: -0.02em;
        display: block;
      }

      /* A — scroll infinito */
      #scene-scroll {
        background: var(--ink);
      }
      #scroll-stack {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      .scroll-word {
        font-family: var(--display);
        font-size: 230px;
        line-height: 1;
        letter-spacing: -0.02em;
        color: var(--bone);
        opacity: 0.9;
      }
      .scroll-word.outline {
        color: var(--ink);
        -webkit-text-stroke: 3px var(--gold);
        opacity: 1;
      }

      /* B — FRENÁ. */
      #scene-frena {
        background: var(--bordo);
      }
      #frena-text {
        font-size: 230px;
        white-space: nowrap;
      }

      /* C — ESTO / NO SE */
      #scene-esto {
        background: var(--ink);
      }
      #scene-esto .scene-content {
        align-items: stretch;
        gap: 40px;
      }
      #esto-text {
        font-size: 270px;
        white-space: nowrap;
        align-self: flex-start;
      }
      #nose-text {
        font-size: 270px;
        white-space: nowrap;
        align-self: flex-end;
        color: var(--gold);
      }

      /* D — SCROLLEA. */
      #scene-scrollea {
        background: var(--ink);
      }
      #scrollea-text {
        font-family: var(--serif);
        font-style: italic;
        font-weight: 600;
        font-size: 290px;
        line-height: 1;
        white-space: nowrap;
        color: var(--gold-hi);
        letter-spacing: -0.02em;
        display: block;
      }
      #scrollea-bar {
        display: block;
        width: 880px;
        height: 26px;
        background: var(--bordo-hi);
        transform-origin: left center;
      }

      /* Transición — barras */
      #scene-bars {
        pointer-events: none;
      }
      #bars {
        display: flex;
        flex-direction: column;
        width: 100%;
        height: 100%;
      }
      .bar {
        display: block;
        width: 100%;
        flex: 1;
        background: var(--bordo);
      }
      .bar.gold {
        background: var(--gold);
      }

      /* E — logo */
      #scene-logo {
        background: radial-gradient(ellipse at 50% 46%, #1b1210 0%, var(--ink) 62%);
      }
      #logo-push,
      #logo-shake {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 36px;
      }
      #logo-word {
        display: flex;
        font-family: var(--serif);
        font-weight: 700;
        font-size: 190px;
        line-height: 1;
        color: var(--gold);
        letter-spacing: 0.01em;
      }
      #logo-word span {
        display: inline-block;
      }
      #logo-rule {
        display: block;
        width: 640px;
        height: 4px;
        background: var(--gold);
      }
      #logo-tag {
        font-family: var(--display);
        font-size: 30px;
        letter-spacing: 0.32em;
        color: var(--bone);
        opacity: 0.85;
        text-transform: uppercase;
        padding-left: 0.32em;
      }

      /* capas */
      #flash {
        background: var(--gold-hi);
        opacity: 0;
        pointer-events: none;
      }
      #vignette {
        pointer-events: none;
        background: radial-gradient(ellipse at 50% 50%, rgba(0, 0, 0, 0) 55%, rgba(0, 0, 0, 0.55) 100%);
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="7"
      data-width="1080"
      data-height="1920"
    >
      <!-- A: scroll infinito -->
      <section id="scene-scroll" class="clip" data-start="0" data-duration="1.3" data-track-index="0">
        <div id="scroll-stack">
          <div class="scroll-word">SCROLL</div>
          <div class="scroll-word outline">SCROLL</div>
          <div class="scroll-word">SCROLL</div>
          <div class="scroll-word outline">SCROLL</div>
          <div class="scroll-word">SCROLL</div>
          <div class="scroll-word outline">SCROLL</div>
          <div class="scroll-word">SCROLL</div>
          <div class="scroll-word outline">SCROLL</div>
          <div class="scroll-word">SCROLL</div>
          <div class="scroll-word outline">SCROLL</div>
          <div class="scroll-word">SCROLL</div>
          <div class="scroll-word outline">SCROLL</div>
          <div class="scroll-word">SCROLL</div>
          <div class="scroll-word outline">SCROLL</div>
          <div class="scroll-word">SCROLL</div>
          <div class="scroll-word outline">SCROLL</div>
          <div class="scroll-word">SCROLL</div>
          <div class="scroll-word outline">SCROLL</div>
          <div class="scroll-word">SCROLL</div>
          <div class="scroll-word outline">SCROLL</div>
          <div class="scroll-word">SCROLL</div>
          <div class="scroll-word outline">SCROLL</div>
          <div class="scroll-word">SCROLL</div>
          <div class="scroll-word outline">SCROLL</div>
          <div class="scroll-word">SCROLL</div>
          <div class="scroll-word outline">SCROLL</div>
          <div class="scroll-word">SCROLL</div>
          <div class="scroll-word outline">SCROLL</div>
        </div>
      </section>

      <!-- B: FRENÁ. -->
      <section id="scene-frena" class="clip" data-start="1.3" data-duration="0.45" data-track-index="0">
        <div class="scene-content">
          <div id="frena-shake"><span id="frena-text" class="slam">FRENÁ.</span></div>
        </div>
      </section>

      <!-- C: ESTO / NO SE -->
      <section id="scene-esto" class="clip" data-start="1.75" data-duration="0.8" data-track-index="0">
        <div class="scene-content" id="esto-shake">
          <span id="esto-text" class="slam">ESTO</span>
          <span id="nose-text" class="slam">NO SE</span>
        </div>
      </section>

      <!-- D: SCROLLEA. -->
      <section id="scene-scrollea" class="clip" data-start="2.55" data-duration="0.9" data-track-index="0">
        <div class="scene-content">
          <span id="scrollea-text">scrollea.</span>
          <span id="scrollea-bar"></span>
        </div>
      </section>

      <!-- E: SONYLUM -->
      <section id="scene-logo" class="clip" data-start="3.45" data-duration="3.55" data-track-index="0">
        <div class="scene-content">
          <div id="logo-push">
            <div id="logo-shake">
              <div id="logo-word">
                <span>S</span><span>O</span><span>N</span><span>Y</span><span>L</span><span>U</span><span>M</span>
              </div>
              <span id="logo-rule"></span>
              <div id="logo-tag">Estudio digital · Villa Luro, BA</div>
            </div>
          </div>
        </div>
      </section>

      <!-- Transición: barras -->
      <section id="scene-bars" class="clip" data-start="3.3" data-duration="0.42" data-track-index="1">
        <div id="bars">
          <span class="bar"></span>
          <span class="bar gold"></span>
          <span class="bar"></span>
          <span class="bar gold"></span>
          <span class="bar"></span>
          <span class="bar gold"></span>
          <span class="bar"></span>
        </div>
      </section>

      <!-- Flash de impacto -->
      <div id="flash" class="clip" data-start="0" data-duration="7" data-track-index="2"></div>

      <!-- Viñeta cinematográfica -->
      <div id="vignette" class="clip" data-start="0" data-duration="7" data-track-index="3"></div>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });

      // Temblor de impacto determinístico
      const shake = (target, at, amp, first = true) => {
        tl.fromTo(
          target,
          { x: 0, y: 0 },
          {
            keyframes: [
              { x: -amp, y: amp * 0.6, duration: 0.03 },
              { x: amp * 0.8, y: -amp * 0.5, duration: 0.03 },
              { x: -amp * 0.5, y: amp * 0.3, duration: 0.03 },
              { x: amp * 0.3, y: -amp * 0.2, duration: 0.03 },
              { x: 0, y: 0, duration: 0.04 },
            ],
            ease: "none",
            immediateRender: first,
          },
          at,
        );
      };
      const flash = (at, peak, len) => {
        tl.fromTo("#flash", { opacity: peak }, { opacity: 0, duration: len, ease: "power2.out", immediateRender: false }, at);
      };

      // A — scroll que acelera hasta volverse borroso
      tl.fromTo(
        "#scroll-stack",
        { y: 0, filter: "blur(0px)" },
        { y: -4600, filter: "blur(10px)", duration: 1.3, ease: "power3.in" },
        0,
      );
      tl.fromTo("#scroll-stack", { scaleY: 1 }, { scaleY: 1.25, duration: 0.5, ease: "power2.in" }, 0.8);

      // B — FRENÁ.
      flash(1.3, 1, 0.14);
      tl.fromTo("#frena-text", { scale: 2.6 }, { scale: 1, duration: 0.16, ease: "expo.out" }, 1.3);
      shake("#frena-shake", 1.42, 22);

      // C — ESTO / NO SE
      tl.fromTo("#esto-text", { x: -1200, skewX: -14 }, { x: 0, skewX: 0, duration: 0.14, ease: "power4.out" }, 1.75);
      shake("#esto-shake", 1.86, 16);
      tl.fromTo("#nose-text", { x: 1200, skewX: 14, autoAlpha: 0 }, { x: 0, skewX: 0, autoAlpha: 1, duration: 0.14, ease: "power4.out" }, 2.15);
      shake("#esto-shake", 2.26, 18, false);

      // D — scrollea. (interrupción: serif dorada)
      flash(2.55, 0.55, 0.12);
      tl.fromTo(
        "#scrollea-text",
        { clipPath: "inset(0% 100% 0% 0%)", scale: 1.18 },
        { clipPath: "inset(0% 0% 0% 0%)", scale: 1, duration: 0.2, ease: "expo.out" },
        2.55,
      );
      tl.fromTo("#scrollea-bar", { scaleX: 0 }, { scaleX: 1, duration: 0.16, ease: "power4.out" }, 2.68);
      tl.to("#scrollea-text", { scale: 1.07, duration: 0.08, ease: "power2.out" }, 2.95);
      tl.to("#scrollea-text", { scale: 1, duration: 0.18, ease: "power2.inOut" }, 3.03);

      // Transición — barras barren alternando dirección
      gsap.utils.toArray(".bar").forEach((bar, i) => {
        const dir = i % 2 === 0 ? -1 : 1;
        tl.fromTo(
          bar,
          { xPercent: dir * 105 },
          { keyframes: [{ xPercent: 0, duration: 0.14, ease: "power4.out" }, { xPercent: -dir * 105, duration: 0.16, ease: "power4.in" }] },
          3.3 + i * 0.012,
        );
      });

      // E — SONYLUM cae letra por letra
      tl.fromTo(
        "#logo-word span",
        { yPercent: -140, scale: 2.4, autoAlpha: 0 },
        { yPercent: 0, scale: 1, autoAlpha: 1, duration: 0.2, ease: "expo.out", stagger: 0.04 },
        3.62,
      );
      flash(3.9, 0.45, 0.14);
      shake("#logo-shake", 3.9, 20);
      tl.fromTo("#logo-rule", { scaleX: 0 }, { scaleX: 1, duration: 0.3, ease: "expo.out" }, 4.05);
      tl.fromTo("#logo-tag", { autoAlpha: 0, y: 30 }, { autoAlpha: 0.85, y: 0, duration: 0.4, ease: "expo.out" }, 4.2);
      tl.fromTo("#logo-push", { scale: 1 }, { scale: 1.06, duration: 2.8, ease: "sine.inOut" }, 4.2);

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
